"{@bt_actor|::subscribed_books::vocabulary::person} had been weighing it for a long time. That night {@bt_actor2|::subscribed_books::vocabulary::person} went to {@bt_foe|::subscribed_books::vocabulary::person} with everything {@bt_hero|::subscribed_books::vocabulary::person} knew -- the road, the plan, the names -- and came back with {@bt_foe2|::subscribed_books::vocabulary::person}'s silver instead of {@bt_foe3|::subscribed_books::vocabulary::person}'s head." = "{@bt_actor|::subscribed_books::vocabulary::person} 已经权衡了很久。那天夜里，{@bt_actor2|::subscribed_books::vocabulary::person} 带着 {@bt_hero|::subscribed_books::vocabulary::person} 所知的一切——路线、计划和姓名——去见了 {@bt_foe|::subscribed_books::vocabulary::person}，回来时带着的是 {@bt_foe2|::subscribed_books::vocabulary::person} 的银子，而非 {@bt_foe3|::subscribed_books::vocabulary::person} 的头颅。"
