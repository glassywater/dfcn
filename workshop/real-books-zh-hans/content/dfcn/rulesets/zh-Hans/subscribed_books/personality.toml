"{@bt_a|::subscribed_books::vocabulary::person} spoke with just enough hesitation to seem honest, a trick {pro1} had long since perfected." = "{@bt_a|::subscribed_books::vocabulary::person}说话时恰好犹豫到显得诚实的程度。这个技巧，{pro1}早已练得炉火纯青。"
