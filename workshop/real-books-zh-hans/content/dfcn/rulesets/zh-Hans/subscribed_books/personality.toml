"{@bt_a|::subscribed_books::vocabulary::person} inflicted the wound, waited, and inflicted the next only once the first had been fully felt." = "{@bt_a|::subscribed_books::vocabulary::person}造成一道伤口，等待，直到第一道伤的痛苦被充分感受，才造成下一道。"
"{@bt_a|::subscribed_books::vocabulary::person} found the enemy's suffering more interesting than {pos1} own victory, and lingered accordingly." = "{@bt_a|::subscribed_books::vocabulary::person}觉得敌人的痛苦比{pos1}胜利更有趣，便为此久久停留。"

