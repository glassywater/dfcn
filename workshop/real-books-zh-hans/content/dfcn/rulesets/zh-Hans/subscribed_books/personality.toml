"\"Let's slow down,\" {@bt_a|::subscribed_books::vocabulary::person} said, tightening {pos1} grip. \"I want to enjoy this.\"" = "“慢一点，”{@bt_a|::subscribed_books::vocabulary::person}收紧{pos1}握持，说道，“我要好好享受。”"
"\"Does it hurt?\" {@bt_a|::subscribed_books::vocabulary::person} asked, and the smile said {pro1} already knew the answer and liked it." = "“疼吗？”{@bt_a|::subscribed_books::vocabulary::person}问。笑容表明，{pro1}早已知道答案，而且很喜欢。"
"\"I'm going to remember that sound,\" {@bt_a|::subscribed_books::vocabulary::person} said softly." = "“我会记住那个声音，”{@bt_a|::subscribed_books::vocabulary::person}轻声说。"
"\"No need to rush,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"We have all night.\"" = "“用不着急，”{@bt_a|::subscribed_books::vocabulary::person}说道，“我们有一整夜。”"
"\"Again,\" {@bt_a|::subscribed_books::vocabulary::person} said, almost gently. \"I want to hear that again.\"" = "“再来，”{@bt_a|::subscribed_books::vocabulary::person}几乎温柔地说，“我还想再听一次。”"
