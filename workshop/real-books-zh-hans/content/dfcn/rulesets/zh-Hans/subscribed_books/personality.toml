"{@bt_a|::subscribed_books::vocabulary::person} let the lie breathe, adding small imperfections to make the invented person feel more real than the truth would have." = "{@bt_a|::subscribed_books::vocabulary::person}让谎言活起来，添入微小的瑕疵，使编造的人物显得比真人还真实。"
"{@bt_a|::subscribed_books::vocabulary::person} held the impersonation for days without a single slip, as though the false self had simply replaced the true one." = "{@bt_a|::subscribed_books::vocabulary::person}维持冒充数日，没有一次失误，仿佛虚假的自我已取代真实的自我。"
