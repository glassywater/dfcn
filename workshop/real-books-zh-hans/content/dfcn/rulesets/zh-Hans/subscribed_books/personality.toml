[[rulesets]]
[rulesets.rules]
", eyes already flicking toward the door" = "，目光已开始往门口游移"
", voice tight with old fear" = "，声音被昔日的恐惧绷得发紧"
", flinching at a sound only they could hear" = "，被只有自己听见的声响吓得一缩"
", half a step back before the words finished" = "，话音未落便先退了半步"
", breath gone shallow at the raised voice" = "，一听见提高的嗓门，呼吸便浅了下来"
", hands curling in like a threatened animal" = "，像受威胁的动物一样蜷起双手"
", shoulders climbing toward the ears" = "，肩膀紧张地耸向耳边"
", gaze sliding away from the stranger's face" = "，目光从陌生人的脸上悄悄移开"
", heartbeat loud behind the ribs" = "，胸腔里心跳如鼓"
", ready to bolt at the first sharp word" = "，随时准备在第一句厉声传来时逃走"
", stomach knotted at the shadow in the hall" = "，看见走廊的阴影便心腹发紧"
", scanning every exit without meaning to" = "，不由自主地扫视每一个出口"
", voice small beneath the weight of the room" = "，在满屋人的压力下声音微弱"
", stiffening as the door swung on its hinge" = "，门一转动，身体便僵住"
", counting the distance to safer ground" = "，估算着离安全之处还有多远"
", startled by their own echoing footstep" = "，连自己脚步的回声也使其受惊"
", pressing back against the nearest wall" = "，退到最近的墙边紧紧贴住"
", swallowing hard against the taste of panic" = "，勉强咽下涌上喉头的恐惧"
", one hand drifting toward the hidden knife" = "，一只手悄悄移向藏着的刀"
", frozen mid-smile as the laughter turned rough" = "，笑声变得粗暴时，笑容也僵在脸上"
", already weighing what this could be turned toward" = "，已在盘算如何利用这件事"
", watching for the opening this offered" = "，留意着其中可乘之机"
", quietly mapping every leverage point in reach" = "，暗中梳理所有可以利用的把柄"
", sensing exactly where pressure would crack resolve" = "，准确察觉施压何处才能击破决心"
", measuring which string to pull for maximum give" = "，斟酌拨动哪根心弦才能换来最多让步"
", noting how easily trust could be made a weapon" = "，注意到信任何等容易变成武器"
", calculating the moment kindness becomes a cage" = "，计算着善意何时会化作牢笼"
", spotting the flaw that makes a promise breakable" = "，找出让承诺可以被打破的漏洞"
", gauging how far a favor stretches before it snaps" = "，估量一份人情还能榨取到何种地步"
", reading the silence between words for hidden price" = "，从话语间的沉默里读出暗藏的价码"
", waiting until need outruns caution in their eyes" = "，等待对方眼中的渴求压过谨慎"
", filing away each small debt for later collection" = "，记下每一笔小小的人情债，留待日后讨还"
", testing whether flattery or fear yields better fruit" = "，试探奉承与恐惧哪一种更见效"
", positioning each concession as a future claim" = "，把每次让步都变成将来索取的依据"
", tracking which secret buys the loudest obedience" = "，留意哪个秘密能换来最彻底的服从"
", judging the hour when loyalty becomes liability" = "，判断忠诚何时会变成负担"
", sensing the precise weight that tips the scale" = "，察觉让天平倾斜所需的准确分量"
", marking every weakness disguised as strength offered" = "，记下对方所展示的每一份强势背后藏着的弱点"
", counting the steps until the trap closes itself" = "，计算着还要几步陷阱才会自行合拢"
", knowing exactly which wound reopens at a whisper" = "，清楚哪一道伤口只需一句耳语就会重新撕开"
", unwilling to dress it up as anything softer" = "，不愿将话粉饰得更温和"
", saying it plainly, whatever it cost" = "，不论代价，直言不讳"
", warmth easy and unguarded" = "，温暖自然，毫无戒备"
", the kind of ease that put others at ease too" = "，那份自在连旁人也为之放松"
"What had seemed simple curdled into something else entirely." = "原本看似简单的事情，竟变成了全然不同的局面。"
"The moment turned before either of them meant it to." = "两人都还未打算改变，局面就已经转向。"
"A quiet agreement shattered, giving way to sudden, uneasy tension." = "无声的默契破裂了，取而代之的是突如其来、令人不安的紧张。"
"The calm that lingered dissolved into a sharp, unexpected clash." = "尚未散去的平静，化成了一场尖锐而意外的冲突。"
"A gentle whisper of cooperation twisted into a harsh, discordant shout." = "原本温和的合作低语，变成了刺耳而不和谐的叫嚷。"
"The shared smile faded, replaced by a wary, guarded stare." = "彼此脸上的笑容消退了，目光变得警惕而戒备。"
"A hopeful path narrowed, as suspicion edged into the conversation." = "猜疑悄悄混进谈话，那条充满希望的路也越走越窄。"
"What began as partnership slipped silently into a reluctant rivalry." = "起初的伙伴关系，悄然滑向了双方都不愿面对的竞争。"
"The easy rhythm broke, each note now striking a discordant chord." = "轻松的节奏断了，此后的每个音符都碰出刺耳的不和谐。"
"A friendly nod turned into a stiff, challenging glare." = "友善的点头，变成了僵硬而带着挑衅的瞪视。"
"The mutual trust trembled, giving rise to a subtle but firm opposition." = "相互的信任动摇了，隐约却坚定的对立随之滋生。"
"A soft invitation hardened, becoming a stern demand instead." = "温和的邀请硬了下来，变成了严厉的要求。"
"The easy flow of dialogue stalled, each word now weighted with doubt." = "原本流畅的谈话停滞下来，每个字都带上了怀疑的重量。"
"Neither had meant to raise their voice, and yet the words landed like a blow." = "双方都无意提高嗓门，可说出口的话仍像重击一般落下。"
"The common goal blurred, replaced by competing ambitions." = "共同的目标模糊了，取而代之的是彼此争夺的野心。"
"A moment of accord cracked, exposing underlying friction." = "片刻的和睦裂开，露出了潜藏的摩擦。"
"The warm exchange cooled, turning into a frosty standoff." = "温暖的交流冷却下来，变成了冰冷的对峙。"
"A gentle hand offered was withdrawn, leaving a clenched fist." = "原本温柔伸出的手收了回去，握成了拳头。"
"The silence that followed was not the comfortable kind anymore." = "随后到来的沉默，再也不是那种令人自在的沉默。"
"Somewhere in the exchange, patience gave out before either noticed." = "在谈话的某一刻，双方尚未察觉，耐心就已耗尽。"
"The old hostility, for once, found no fuel." = "昔日的敌意，这一次终于没能找到燃料。"
"Something in the moment refused to stay adversarial." = "这一刻，某种东西不愿再继续对立下去。"

[[rulesets]]
[rulesets.rules]
"They had been rivals since childhood, competing for the same recognition, the same positions, the same approval. What had started as rivalry had curdled into something darker." = "他们从小便是对手，争夺同样的认可、职位与赞许。起初的竞争，后来酿成了更阴暗的东西。"
"The enmity between {@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} began with a single insult -- one spoken carelessly, received deeply, and never forgiven." = "{@bt_a|::subscribed_books::vocabulary::person}与{@bt_b|::subscribed_books::vocabulary::person}的仇怨始于一句侮辱。说者漫不经心，听者却深受其伤，再也没有原谅。"
"{@bt_b|::subscribed_books::vocabulary::person} had taken something from {@bt_a|::subscribed_books::vocabulary::person} years ago. Not an object -- something less tangible. A reputation. A chance. A future that {@bt_a2|::subscribed_books::vocabulary::person} had earned and {@bt_b2|::subscribed_books::vocabulary::person} had stolen." = "多年前，{@bt_b|::subscribed_books::vocabulary::person}从{@bt_a|::subscribed_books::vocabulary::person}那里夺走了一样东西。那不是物品，而是更难以触摸之物：声誉、机会，以及{@bt_a2|::subscribed_books::vocabulary::person}本已争取到、却被{@bt_b2|::subscribed_books::vocabulary::person}偷走的未来。"
"They had been friends once. The betrayal that ended the friendship was so complete that neither could remember the friendship without pain." = "他们曾是朋友。结束友谊的背叛如此彻底，以至于任何一方回想起那段友情，都只剩痛楚。"
"{@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} stood on opposite sides of a dispute that had divided {@bt_site|::subscribed_books::personality::site} for years. Neither was entirely wrong. Neither would admit it." = "一场争端使{@bt_site|::subscribed_books::personality::site}多年分裂，{@bt_a|::subscribed_books::vocabulary::person}与{@bt_b|::subscribed_books::vocabulary::person}各站一方。双方都并非全错，却都不肯承认这一点。"
"{@bt_b|::subscribed_books::vocabulary::person} had murdered someone {@bt_a|::subscribed_books::vocabulary::person} loved. Not in battle, not in self-defense, but deliberately, coldly, and without remorse. The kind of killing that demands an answer." = "{@bt_b|::subscribed_books::vocabulary::person}杀害了{@bt_a|::subscribed_books::vocabulary::person}所爱之人。不是战斗，也不是自卫，而是蓄意、冷酷、毫无悔意的谋杀。这样的杀戮，必须有人偿还。"
"It was a matter of faith. {@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} worshipped different gods, and in {@bt_site|::subscribed_books::personality::site}, that difference had become a wall that neither could see past. What began as theological disagreement had hardened into hatred." = "这是信仰之争。{@bt_a|::subscribed_books::vocabulary::person}与{@bt_b|::subscribed_books::vocabulary::person}敬奉不同的神，在{@bt_site|::subscribed_books::personality::site}，这种差异已筑成一道双方都无法越过的墙。起初关于教义的分歧，后来凝成了仇恨。"
"{@bt_b|::subscribed_books::vocabulary::person} had stolen {@bt_a|::subscribed_books::vocabulary::person}'s most prized possession -- not for its value, but to prove that {@bt_a2|::subscribed_books::vocabulary::person}'s life could be violated, that nothing {@bt_a3|::subscribed_books::vocabulary::person} owned was truly safe. The theft was a message, and {@bt_a4|::subscribed_books::vocabulary::person} had received it." = "{@bt_b|::subscribed_books::vocabulary::person}偷走了{@bt_a|::subscribed_books::vocabulary::person}最珍爱的东西，并非为了它的价值，而是为了证明{@bt_a2|::subscribed_books::vocabulary::person}的生活可以遭到践踏，{@bt_a3|::subscribed_books::vocabulary::person}所拥有的一切都并不真正安全。这场偷窃是一则警告，而{@bt_a4|::subscribed_books::vocabulary::person}已经读懂。"
"They had once been lovers. The relationship had ended badly -- with accusations, betrayals, and the kind of intimate cruelty that only someone who knows you well can inflict." = "他们曾经相爱。那段关系以惨烈的方式结束：指责、背叛，以及只有深知你的人才能施加的贴身残酷。"
"{@bt_b|::subscribed_books::vocabulary::person} was a {race}. For {@bt_a|::subscribed_books::vocabulary::person}, that was reason enough. The prejudice ran deep, inherited from parents who had inherited it from theirs, all the way back to a wrong so old that no one alive could name it." = "{@bt_b|::subscribed_books::vocabulary::person}是{race}。对{@bt_a|::subscribed_books::vocabulary::person}而言，这就足够了。偏见根深蒂固，由父母传下，又由父母的父母传下，追溯至一桩古老到世间已无人能说清的旧怨。"
"{@bt_a|::subscribed_books::vocabulary::person} believed in the old ways -- the traditions, the rituals, the gods of {pos1} ancestors. {@bt_b|::subscribed_books::vocabulary::person} represented everything that threatened to tear those traditions apart. The enmity between them was not personal. It was civilizational." = "{@bt_a|::subscribed_books::vocabulary::person}信奉旧日之道：传统、仪式，以及{pos1}祖先的神灵。{@bt_b|::subscribed_books::vocabulary::person}则代表着一切可能将那些传统撕碎的力量。他们之间并非私人恩怨，而是文明的冲突。"
"{@bt_a|::subscribed_books::vocabulary::person} had first noticed {@bt_b|::subscribed_books::vocabulary::person} at a gathering, across a crowded hall. {@bt_b2|::subscribed_books::vocabulary::person} had been laughing at something someone said, and the sound had cut through every other noise in the room." = "在一次聚会中，{@bt_a|::subscribed_books::vocabulary::person}隔着拥挤的大厅第一次注意到{@bt_b|::subscribed_books::vocabulary::person}。{@bt_b2|::subscribed_books::vocabulary::person}正被某人的话逗笑，那笑声穿透了屋内的一切喧嚣。"
"They had met by accident -- a wrong turn, a shared shelter from rain, a conversation that lasted longer than either had planned. By the time they parted, something had changed." = "他们偶然相遇：一次走错路，一同避雨，一场比双方预想都更长的谈话。等到分别时，某种东西已经改变。"
"{@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} had grown up in the same settlement, knowing each other the way neighbors do -- casually, incompletely. It took years for either of them to see the other clearly." = "{@bt_a|::subscribed_books::vocabulary::person}与{@bt_b|::subscribed_books::vocabulary::person}在同一个聚落长大，像邻居那样相识：熟悉，却又所知有限。多年之后，双方才真正看清彼此。"
"They had met during a battle. {@bt_a|::subscribed_books::vocabulary::person} had dragged {@bt_b|::subscribed_books::vocabulary::person} out of the fighting, and in the chaos of blood and screaming, something impossible had happened: they had looked at each other and seen, not an ally or a stranger, but a person. The world had narrowed to a single point of recognition." = "他们相识于一场战斗。{@bt_a|::subscribed_books::vocabulary::person}把{@bt_b|::subscribed_books::vocabulary::person}拖出战场，在鲜血与尖叫的混乱中，不可思议的事发生了：他们对视，看见的既不是盟友，也不是陌生人，而是一个活生生的人。整个世界仿佛收束成了彼此认出的那一点。"
"{@bt_b|::subscribed_books::vocabulary::person} had asked {@bt_a|::subscribed_books::vocabulary::person} to retrieve something precious -- a family heirloom lost in dangerous territory. {@bt_a2|::subscribed_books::vocabulary::person} had gone, not for glory, but because {@bt_b2|::subscribed_books::vocabulary::person} had asked. When {@bt_a3|::subscribed_books::vocabulary::person} returned, battered and exhausted, carrying the prize, {@bt_b3|::subscribed_books::vocabulary::person} looked at {@bt_a4|::subscribed_books::vocabulary::person} as if seeing {obj1} for the first time." = "{@bt_b|::subscribed_books::vocabulary::person}请{@bt_a|::subscribed_books::vocabulary::person}寻回一件珍宝，那是遗失在险地中的传家之物。{@bt_a2|::subscribed_books::vocabulary::person}前去并非为了荣耀，只因{@bt_b2|::subscribed_books::vocabulary::person}开了口。等{@bt_a3|::subscribed_books::vocabulary::person}带着宝物回来，遍体鳞伤、筋疲力尽时，{@bt_b3|::subscribed_books::vocabulary::person}望向{@bt_a4|::subscribed_books::vocabulary::person}，仿佛第一次真正看见{obj1}。"
"It began with letters. {@bt_a|::subscribed_books::vocabulary::person} had written first -- a formal note about a trade matter. {@bt_b|::subscribed_books::vocabulary::person}'s reply had been unexpectedly warm, and personal, and funny. The letters continued, growing longer and more intimate, until the day they finally met in person and discovered that the connection was even stronger face to face." = "一切始于书信。{@bt_a|::subscribed_books::vocabulary::person}先写了一封讨论贸易的正式短函。{@bt_b|::subscribed_books::vocabulary::person}的回复却出乎意料地温暖、亲切而风趣。书信往来延续下去，越写越长，也越来越亲密，直到他们终于见面，才发现面对面时的联系更为深厚。"
"{@bt_b|::subscribed_books::vocabulary::person} had sought out {@bt_a|::subscribed_books::vocabulary::person} after hearing stories of the elder's wisdom. The apprenticeship was not offered easily -- {@bt_a2|::subscribed_books::vocabulary::person} had refused three times before finally agreeing." = "{@bt_b|::subscribed_books::vocabulary::person}听闻长者的智慧后，前去寻找{@bt_a|::subscribed_books::vocabulary::person}。拜师并不容易，{@bt_a2|::subscribed_books::vocabulary::person}拒绝三次之后才终于答应。"
"{@bt_a|::subscribed_books::vocabulary::person} recognized something in {@bt_b|::subscribed_books::vocabulary::person} that reminded {pro1} of {pos1} younger self: the same hunger, the same impatience, the same refusal to accept the world as it was." = "{@bt_a|::subscribed_books::vocabulary::person}在{@bt_b|::subscribed_books::vocabulary::person}身上看见了某种东西，让{pro1}想起{pos1}年轻时代：同样的渴望，同样的急切，同样不肯接受世界现状的倔强。"
"They had traveled together out of necessity at first -- the roads were dangerous, and two were safer than one. The friendship came later, slowly, built on shared hardship." = "起初他们一同旅行只是出于必要：道路危险，两个人比一个人更安全。后来，在共同的艰难中，友谊慢慢生长。"
"{@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} had fought together, bled together, and buried friends together. The bond between them was not sentimental. It was forged in survival." = "{@bt_a|::subscribed_books::vocabulary::person}与{@bt_b|::subscribed_books::vocabulary::person}并肩作战，一同流血，一同埋葬朋友。他们的联系并非感伤的情谊，而是在生死中铸成。"
"{@bt_b|::subscribed_books::vocabulary::person} wanted exactly what {@bt_a|::subscribed_books::vocabulary::person} wanted. The same position, the same recognition, the same place in the story. There was only room for one." = "{@bt_b|::subscribed_books::vocabulary::person}想要的，正是{@bt_a|::subscribed_books::vocabulary::person}想要的：同样的职位，同样的认可，以及故事中同样的位置。而那里只能容下一人。"
"The rivalry between {@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} was the kind that sharpened both of them. Neither would have achieved what they did without the other to measure against." = "{@bt_a|::subscribed_books::vocabulary::person}与{@bt_b|::subscribed_books::vocabulary::person}的竞争磨砺着双方。若没有对方作为衡量的标尺，任何一方都不会取得如今的成就。"
"They were both in love with the same person. Neither would yield. The competition between them was not about winning -- it was about proving that the other was unworthy." = "他们爱上了同一个人，谁也不肯退让。这场竞争不是为了获胜，而是为了证明对方不配。"

