"No one to ask where the tools went." = "没人来问工具去了哪儿。"
"No one to tell you that the way you have always done it is wrong." = "没人告诉你，你一直以来的做法是错的。"
"I have always worked best alone. The work speaks when no one else is speaking." = "我向来独自工作时做得最好。当旁人不再说话，作品就会开口。"
"I have always worked best alone." = "我向来独自工作时做得最好。"
"The work speaks when no one else is speaking." = "当旁人不再说话，作品就会开口。"

"And I have not forgotten {@bt_other|::subscribed_books::vocabulary::person}. The record calls {@bt_other2|::subscribed_books::vocabulary::person} my {other_word}, which is a kind way of putting it. Every tool put down in the wrong place, every lesson answered with a question - I remember all of it." = "我也没有忘记{@bt_other|::subscribed_books::vocabulary::person}。史册称{@bt_other2|::subscribed_books::vocabulary::person}是我的{other_word}，这已经是客气的说法了。每件放错位置的工具，每次以问题回应教导——我全都记得。"
"And I have not forgotten {@bt_other|::subscribed_books::vocabulary::person}." = "我也没有忘记{@bt_other|::subscribed_books::vocabulary::person}。"
"The record calls {@bt_other|::subscribed_books::vocabulary::person} my {other_word}, which is a kind way of putting it." = "史册称{@bt_other|::subscribed_books::vocabulary::person}是我的{other_word}，这已经是客气的说法了。"
"Every tool put down in the wrong place, every lesson answered with a question - I remember all of it." = "每件放错位置的工具，每次以问题回应教导——我全都记得。"
