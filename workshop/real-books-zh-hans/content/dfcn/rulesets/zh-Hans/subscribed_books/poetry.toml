base = "subscribed_books::poetry"

[[rulesets]]
[rulesets.rules]
# templates.lua: every Ode/Elegy/Ballad/Hymn/Satire template, line breaks retained.
"O {@bt_s|::subscribed_books::vocabulary::place}, {adj} jewel of {@bt_e|::subscribed_books::vocabulary::entity}!" = "啊，{@bt_s|::subscribed_books::vocabulary::place}，{@bt_e|::subscribed_books::vocabulary::entity} 的{adj}明珠！"
"Hear now the words that pour from a grateful heart." = "请听这感恩之心涌出的话语。"
"Praise be to {person}, whose name deserves a song." = "赞美 {person}，这名字值得歌唱。"
"I offer this poor verse." = "我献上这首拙诗。"
"O {person}, whose deeds outstrip the reach of common speech!" = "啊，{person}，你的功业岂是寻常话语所能尽述！"
"I, a humble versifier of {@bt_e|::subscribed_books::vocabulary::entity}, take up the {adj} challenge of setting your glory into meter and rhyme." = "我，{@bt_e|::subscribed_books::vocabulary::entity} 的卑微诗人，接下这{adj}挑战，将你的荣耀写入韵律。"
"Let the {adj} heavens bend their ear to this ode, for it concerns {person}, whose name rings like a bell across the vaulted sky." = "愿{adj}诸天侧耳聆听此颂诗，它歌颂 {person}，其名如钟声响彻苍穹。"
"Stanza:" = "诗节："
"O fallen one! O {@bt_a|::subscribed_books::vocabulary::person}, taken by {cause}\nin the year {@year}, at {@bt_evs|::subscribed_books::vocabulary::place}!\nThe world is dimmer for your absence,\nand the stones of {@bt_s|::subscribed_books::vocabulary::place} weep." = "啊，倒下的人！啊，{@bt_a|::subscribed_books::vocabulary::person}，被 {cause} 带走，\n在 {@year} 年，在 {@bt_evs|::subscribed_books::vocabulary::place}！\n你的离去使世界黯淡，\n{@bt_s|::subscribed_books::vocabulary::place} 的石头也在哭泣。"
"And lo, {@bt_i|::subscribed_books::vocabulary::artifact} was wrought\nby the {adj} hands of {@bt_a|::subscribed_books::vocabulary::person} in {@year}.\nA thing of beauty, born of toil,\nthat time itself shall not erase." = "看啊，{@bt_i|::subscribed_books::vocabulary::artifact} 被铸成，\n由 {@bt_a|::subscribed_books::vocabulary::person} 的{adj}双手，在 {@year} 年。\n美好的造物，生于辛劳，\n连时间本身也不能抹去。"
"Hail, {@bt_a|::subscribed_books::vocabulary::person}, named {role}\nin the year {@year}!\nMay {pos} service honor {@bt_e|::subscribed_books::vocabulary::entity}\nas the sun honors the dawn." = "致敬，{@bt_a|::subscribed_books::vocabulary::person}，于 {@year} 年\n被任命为{role}！\n愿{pos}奉献荣耀 {@bt_e|::subscribed_books::vocabulary::entity}，\n如太阳荣耀黎明。"
"Rise, {@bt_s|::subscribed_books::vocabulary::place}! Born in {@year}\nfrom the will of {@bt_e|::subscribed_books::vocabulary::entity}!\nMay your walls stand firm,\nyour hearths burn bright, your people flourish." = "崛起吧，{@bt_s|::subscribed_books::vocabulary::place}！于 {@year} 年诞生，\n出于 {@bt_e|::subscribed_books::vocabulary::entity} 的意志！\n愿你的城墙坚固，\n炉火明亮，人民繁荣。"
"And in the year {@year},\nthe world turned, as worlds do,\nand {@bt_s|::subscribed_books::vocabulary::place} endured,\n{adj} and unyielding." = "在 {@year} 年，\n世界依旧转动，\n{@bt_s|::subscribed_books::vocabulary::place} 仍然屹立，\n{adj}，坚强不屈。"
"(A breath between stanzas.)" = "（诗节间的一次呼吸。）"
"Thus ends this ode. May the words linger\nlong after the singer is silent." = "颂诗至此结束。愿这些话语，\n在歌者沉默后仍长久回荡。"
"The ode is sung. The {adj} echoes fade.\nBut somewhere, in the halls of {@bt_e|::subscribed_books::vocabulary::entity},\nthe melody persists, a ghost of praise\nthat haunts the air and will not rest." = "颂诗已唱完。{adj}回声渐逝。\n但在某处，{@bt_e|::subscribed_books::vocabulary::entity} 的厅堂里，\n旋律仍延续，赞美的幽灵\n萦绕在空气中，不愿安息。"
"We mourn. This verse is for the lost,\nfor {person}, who walks no more\namong the living of {@bt_e|::subscribed_books::vocabulary::entity}." = "我们哀悼。此诗献给逝者，\n献给 {person}，再也不能\n走在 {@bt_e|::subscribed_books::vocabulary::entity} 的生者之间。"
"An elegy. For {@bt_a|::subscribed_books::vocabulary::person}. For all we have lost.\nThe words are {adj} and insufficient. But they are all we have." = "一首挽歌。献给 {@bt_a|::subscribed_books::vocabulary::person}。献给失去的一切。\n话语{adj}而苍白。但这是我们拥有的一切。"
"Grief is a country with no map.\nI wander it now, pen in hand,\nsearching for the words to honor {person},\nwhose absence is a wound\nthat the {adj} flesh of the world cannot close." = "悲伤是没有地图的国度。\n我手握笔，在其中漫游，\n寻求话语，纪念 {person}，\n其离去留下的伤口，\n连世界的{adj}血肉都不能弥合。"
"{@bt_a|::subscribed_books::vocabulary::person}, {@bt_b|::subscribed_books::vocabulary::person}, taken by {cause}\nin the year {@year}.\nWe did not say goodbye.\nWe never do." = "{@bt_a|::subscribed_books::vocabulary::person}，{@bt_b|::subscribed_books::vocabulary::person}，被 {cause} 带走，\n在 {@year} 年。\n我们没能道别。\n总是如此。"
"{@bt_i|::subscribed_books::vocabulary::artifact} remains, though {@bt_a|::subscribed_books::vocabulary::person} does not.\nCreated in {@year}, it is a {adj} echo\nof the hands that made it." = "{@bt_i|::subscribed_books::vocabulary::artifact} 仍在，{@bt_a|::subscribed_books::vocabulary::person} 却已不在。\n它创作于 {@year} 年，是{adj}回声，\n回响着创造它的那双手。"
"The year {@year} took something from us.\nWe feel the gap. We always will." = "{@year} 年夺走了我们的一些东西。\n我们感受到缺口。永远如此。"
"(Silence.)" = "（寂静。）"
"Rest now. The elegy is done.\nThe grief is not. It never is." = "安息吧。挽歌已结束。\n悲伤还没有。永远不会。"
"This elegy carries no comfort.\nIt was not written to comfort.\nIt was written to remember,\nand in remembering, to insist\nthat what was lost was {adj}\nand real and irreplaceable." = "这首挽歌没有慰藉。\n写它不是为了安慰。\n写它是为了记住，\n并在记忆中坚持：\n失去的是{adj}事物，\n真实，且无可替代。"
"Come gather round and hear the tale\nof {person},\nwhose deeds in {@bt_s|::subscribed_books::vocabulary::place} are sung\nfrom here to the horizon's edge." = "请围拢来听这故事，\n{person} 的故事，\n其在 {@bt_s|::subscribed_books::vocabulary::place} 的功业，\n从这里一直唱到天际。"
"A ballad! Sung in the taverns of {@bt_e|::subscribed_books::vocabulary::entity}.\nOf {@bt_a|::subscribed_books::vocabulary::person} and {pos} {adj} fate." = "一首歌谣！唱响 {@bt_e|::subscribed_books::vocabulary::entity} 的酒馆。\n讲述 {@bt_a|::subscribed_books::vocabulary::person} 和{pos}{adj}命运。"
"Sing, friends, the ballad of {person},\nborn in {birth} to the {race} of {@bt_e|::subscribed_books::vocabulary::entity},\nwhose story, set in {@bt_s|::subscribed_books::vocabulary::place},\nis the kind that makes the ale taste sweeter\nand the night feel {adj} and short." = "朋友们，唱起 {person} 的歌谣，\n{birth}，生于 {@bt_e|::subscribed_books::vocabulary::entity} 的{race}之中，\n其在 {@bt_s|::subscribed_books::vocabulary::place} 展开的故事，\n让麦酒尝来更甜，\n让夜晚{adj}而短暂。"
"And the next verse goes:" = "下一段这样唱："
"Oh, {@bt_a|::subscribed_books::vocabulary::person} fell in {@year},\nstruck down by {cause}, they say.\nThe crowd at {@bt_s|::subscribed_books::vocabulary::place} wept\nand sang {pos} name the livelong day." = "哦，{@bt_a|::subscribed_books::vocabulary::person} 倒在 {@year} 年，\n他们说，是被 {cause} 击倒。\n{@bt_s|::subscribed_books::vocabulary::place} 的人群哭泣，\n终日唱着{pos}名字。"
"{@bt_a|::subscribed_books::vocabulary::person} forged {@bt_i|::subscribed_books::vocabulary::artifact} bright\nin the {adj} year of {@year}.\nThe craft was true, the metal rang,\nand all who saw it stopped to cheer." = "{@bt_a|::subscribed_books::vocabulary::person} 锻成闪亮的 {@bt_i|::subscribed_books::vocabulary::artifact}，\n在 {@year} 这个{adj}年份。\n手艺精湛，金属鸣响，\n见者皆停下，欢呼赞赏。"
"They crowned {@bt_a|::subscribed_books::vocabulary::person} {role}\nin the year of {@year}.\n{@bt_e|::subscribed_books::vocabulary::entity} rejoiced and raised a cup\nand drained it without fear." = "他们拥立 {@bt_a|::subscribed_books::vocabulary::person} 为{role}，\n在 {@year} 年。\n{@bt_e|::subscribed_books::vocabulary::entity} 欢喜举杯，\n无惧地一饮而尽。"
"The year was {@year}, the world was {adj},\nand {@bt_a|::subscribed_books::vocabulary::person} walked the land.\nWhat happened next you won't believe --\nbut listen, understand." = "时为 {@year} 年，世界{adj}，\n{@bt_a|::subscribed_books::vocabulary::person} 行走大地。\n接下来发生的事，你不会相信——\n但请听着，慢慢理解。"
"(Chorus repeats.)" = "（重复副歌。）"
"And that's the ballad, start to end.\nNow pass the drink, my friend.\n-- Sung in the halls of {@bt_e|::subscribed_books::vocabulary::entity}" = "歌谣从头到尾就这些。\n现在把酒递来，朋友。\n——唱于 {@bt_e|::subscribed_books::vocabulary::entity} 的厅堂"
"The ballad of {person}\nis done but never finished.\nFor every time it's sung again\nthe {adj} tale is replenished.\n\n(Applause.)\n-- A song of {@bt_e|::subscribed_books::vocabulary::entity}" = "{person} 的歌谣\n唱完了，却永不结束。\n因为每一次重唱，\n{adj}故事又获得新生。\n\n（掌声。）\n——{@bt_e|::subscribed_books::vocabulary::entity} 的歌"
"A hymn to the powers above.\nWe, the faithful of {@bt_e|::subscribed_books::vocabulary::entity},\nlift our voices in {adj} devotion." = "献给天上神灵的赞美诗。\n我们，{@bt_e|::subscribed_books::vocabulary::entity} 的信众，\n怀着{adj}虔诚放声歌唱。"
"Holy, holy is the world\nthat gave us {@bt_s|::subscribed_books::vocabulary::place}.\nWe sing in gratitude and awe." = "神圣，神圣的世界，\n赐给我们 {@bt_s|::subscribed_books::vocabulary::place}。\n我们怀着感恩与敬畏歌唱。"
"From the {adj} depths of reverence\nwe raise this hymn,\nwe the people of {@bt_e|::subscribed_books::vocabulary::entity},\nkneeling in the shadow of the divine,\ngrateful for {@bt_s|::subscribed_books::vocabulary::place}, for life, for the breath\nthat carries these words upward." = "从敬畏的{adj}深处，\n我们唱起这首赞美诗，\n我们，{@bt_e|::subscribed_books::vocabulary::entity} 的人民，\n跪在神圣的阴影中，\n感恩 {@bt_s|::subscribed_books::vocabulary::place}、生命与呼吸，\n将这些话语送上天空。"
"(Verse.)" = "（诗节。）"
"We commend {@bt_a|::subscribed_books::vocabulary::person} to the beyond.\n{cause} took {obj} in {@year}.\nMay {pos} spirit find the peace\nthat the world could not provide." = "我们将 {@bt_a|::subscribed_books::vocabulary::person} 托付给彼岸。\n{cause} 于 {@year} 年带走了{obj}。\n愿{pos}灵魂找到\n世间无法给予的安宁。"
"We give thanks for {@bt_i|::subscribed_books::vocabulary::artifact},\nwrought in {@year} by {adj} hands.\nA gift from mortal to divine." = "我们感恩 {@bt_i|::subscribed_books::vocabulary::artifact}，\n于 {@year} 年由{adj}双手制成。\n凡人献给神灵的礼物。"
"Blessed is {@bt_s|::subscribed_books::vocabulary::place}, raised in {@year}.\nMay the powers watch over it\nand all who dwell within." = "愿于 {@year} 年建立的 {@bt_s|::subscribed_books::vocabulary::place} 蒙福。\n愿神灵守护它，\n以及其中所有居民。"
"In {@year}, the faithful endured.\nThe {adj} light did not fail.\nWe give thanks." = "{@year} 年，信众坚守。\n{adj}光芒不曾熄灭。\n我们感恩。"
"(Refrain.)" = "（副歌。）"
"Amen. The hymn ascends.\nMay it be heard.\n-- The faithful of {@bt_e|::subscribed_books::vocabulary::entity}" = "阿门。赞美诗升上天空。\n愿它被听见。\n——{@bt_e|::subscribed_books::vocabulary::entity} 的信众"
"This hymn rises from {@bt_s|::subscribed_books::vocabulary::place}\nlike smoke from a {adj} altar,\ncarrying with it the prayers of {@bt_e|::subscribed_books::vocabulary::entity},\nthe hopes of the living,\nthe names of the dead." = "赞美诗从 {@bt_s|::subscribed_books::vocabulary::place} 升起，\n如{adj}祭坛上的烟，\n带着 {@bt_e|::subscribed_books::vocabulary::entity} 的祈祷，\n生者的希望，\n逝者的姓名。"
"Amen." = "阿门。"
"A poem. Of sorts.\nAbout {@bt_e|::subscribed_books::vocabulary::entity}, which deserves\nrather less praise than it receives." = "一首诗。姑且算是。\n写的是 {@bt_e|::subscribed_books::vocabulary::entity}，\n其获得的赞誉，远超应得的。"
"Let us be honest, in verse,\nabout {person}\nand the {adj} farce of {@bt_s|::subscribed_books::vocabulary::place}." = "让我们用诗句说些实话，\n关于 {person}，\n以及 {@bt_s|::subscribed_books::vocabulary::place} 的{adj}闹剧。"
"The muse of satire visits rarely\nand is never welcome.\nBut she has come to {@bt_s|::subscribed_books::vocabulary::place},\ntaken one look at {@bt_e|::subscribed_books::vocabulary::entity},\nand begun to {adj} laugh.\nI, {person}, merely transcribe." = "讽刺的缪斯很少来访，\n也从不受欢迎。\n但她来到 {@bt_s|::subscribed_books::vocabulary::place}，\n看了 {@bt_e|::subscribed_books::vocabulary::entity} 一眼，\n便开始{adj}大笑。\n我，{person}，只是记录。"
"(The next verse, sharper than the last.)" = "（下一诗节，比上一节更加尖刻。）"
"{@bt_a|::subscribed_books::vocabulary::person} died of {cause} in {@year}.\nShocking? Only to those\nwho believed {@bt_e|::subscribed_books::vocabulary::entity}\ncould organize a funeral." = "{@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年死于 {cause}。\n惊讶吗？只有那些\n相信 {@bt_e|::subscribed_books::vocabulary::entity}\n能办好一场葬礼的人，才会惊讶。"
"They made {@bt_a|::subscribed_books::vocabulary::person} {role} in {@year}.\nThe {adj} irony\nis that {pro} was the best candidate.\nThink about that." = "{@year} 年，他们让 {@bt_a|::subscribed_books::vocabulary::person} 当{role}。\n{adj}讽刺之处在于，\n{pro}竟已是最好的候选人。\n好好想想吧。"
"{@bt_i|::subscribed_books::vocabulary::artifact}, crafted {@year}.\nA masterpiece, they said.\nA masterpiece of what, exactly,\nnobody could explain." = "{@bt_i|::subscribed_books::vocabulary::artifact}，制于 {@year} 年。\n他们说，这是杰作。\n究竟是什么的杰作，\n谁也说不清。"
"The year {@year} passed.\n{@bt_e|::subscribed_books::vocabulary::entity} continued\nto mistake activity\nfor {adj} accomplishment." = "{@year} 年过去。\n{@bt_e|::subscribed_books::vocabulary::entity} 仍然\n把忙碌误当成\n{adj}成就。"
"(Nervous laughter.)" = "（紧张的笑声。）"
"The satire ends.\nThe truth, unfortunately, does not.\n-- {person}, poet of unfortunate honesty" = "讽刺诗结束了。\n真相，可惜没有。\n——{person}，因诚实而不幸的诗人"
"I put down my pen\nknowing it will earn me no friends.\nBut the {adj} truth is its own reward,\nand {@bt_e|::subscribed_books::vocabulary::entity} will survive my mockery.\nIt has survived worse." = "我放下笔，\n知道这不会为我赢得朋友。\n但{adj}真相，本身便是回报，\n{@bt_e|::subscribed_books::vocabulary::entity} 会熬过我的嘲笑。\n它曾熬过更坏的事情。"

