"{@bt_a|::subscribed_books::vocabulary::person} was three streets away by the time {@bt_b|::subscribed_books::vocabulary::person} realized anything was missing at all." = "等{@bt_b|::subscribed_books::vocabulary::person}发觉东西少了，{@bt_a|::subscribed_books::vocabulary::person}已在三条街之外。"
