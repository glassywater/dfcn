base = "subscribed_books::rhetoric"

[[rulesets]]
[rulesets.rules]
# templates.lua: Play, all five perspectives. Speaker prefixes delegate in the main namespace.
"DRAMATIS PERSONAE: {person}, a {race} of {@bt_e|::subscribed_books::vocabulary::entity}." = "登场人物：{person}，来自 {@bt_e|::subscribed_books::vocabulary::entity} 的{race}。"
"Setting: {@bt_s|::subscribed_books::vocabulary::place}." = "场景：{@bt_s|::subscribed_books::vocabulary::place}。"
"The stage is bare." = "舞台空无一物。"
"A single light falls upon {@bt_a|::subscribed_books::vocabulary::person}." = "一道孤光落在 {@bt_a|::subscribed_books::vocabulary::person} 身上。"
"A TRAGEDY in several acts." = "一部多幕悲剧。"
"Performed first at {@bt_s|::subscribed_books::vocabulary::place} in the year {@year}." = "于 {@year} 年在 {@bt_s|::subscribed_books::vocabulary::place} 首演。"
"{person} enters, unaware of what fate has prepared." = "{person} 登场，尚不知命运备下了什么。"
"DRAMATIS PERSONAE:\n{person} -- a {race}, {adj} in bearing\nVarious citizens of {@bt_e|::subscribed_books::vocabulary::entity}" = "登场人物：\n{person}——一位仪态{adj}的{race}\n{@bt_e|::subscribed_books::vocabulary::entity} 的众多居民"
"Setting: {@bt_s|::subscribed_books::vocabulary::place}, in the years of consequence." = "场景：{@bt_s|::subscribed_books::vocabulary::place}，命运攸关的岁月。"
"ACT I -- THE PROMISE" = "第一幕——承诺"
"A {adj} light illuminates the stage." = "一束{adj}光照亮舞台。"
"{@bt_a|::subscribed_books::vocabulary::person} stands alone." = "{@bt_a|::subscribed_books::vocabulary::person} 独自站着。"
"(The scene shifts.)" = "（场景转换。）"
"NEW SCENE." = "新场景。"
"The year is {@year}." = "时为 {@year} 年。"
"(falling) So it ends." = "（倒下）就这样结束了。"
"I did not think it would be like this." = "我没想到会是这样。"
"(Silence. The light fades.)" = "（寂静。灯光渐暗。）"
"In {@year}, {cause} claimed {person}." = "{@year} 年，{cause} 夺走了 {person}。"
"The audience weeps, if the playwright has done {pos} work." = "观众落泪了，前提是剧作家尽好了{pos}本分。"
"(accepting the mantle of {role}) I accept this burden." = "（接过{role}的重担）我接受这份责任。"
"May {@bt_e|::subscribed_books::vocabulary::entity} forgive me if I fail." = "若我失败，愿 {@bt_e|::subscribed_books::vocabulary::entity} 原谅我。"
"(holding {@bt_i|::subscribed_books::vocabulary::artifact} aloft) I have made something that will outlast me." = "（高举 {@bt_i|::subscribed_books::vocabulary::artifact}）我创造了比自己更长久的东西。"
"Is that enough?" = "这够了吗？"
"({@bt_a|::subscribed_books::vocabulary::person} crosses the stage." = "（{@bt_a|::subscribed_books::vocabulary::person} 穿过舞台。"
"The {adj} shadows lengthen." = "{adj}阴影渐渐拉长。"
"The year is {@year}.)" = "时为 {@year} 年。）"
"(Curtain falls. Murmurs from the audience.)" = "（落幕。观众低声议论。）"
"The tragedy is complete." = "悲剧结束了。"
"The actors take their bows." = "演员鞠躬致意。"
"The audience files out in silence." = "观众默默离场。"
"The {adj} tragedy of {person} concludes." = "{person} 的{adj}悲剧落幕了。"
"The stage empties." = "舞台空了。"
"The lights die." = "灯光熄灭。"
"But somewhere in the dark, the story continues to echo, as tragedies always do." = "但在黑暗的某处，故事仍不断回响，正如每一场悲剧。"
"A COMEDY." = "一部喜剧。"
"Set in {@bt_s|::subscribed_books::vocabulary::place}." = "场景设在 {@bt_s|::subscribed_books::vocabulary::place}。"
"Featuring {person} and assorted fools." = "由 {person} 和形形色色的傻瓜登场。"
"Enter {@bt_a|::subscribed_books::vocabulary::person}, tripping over {pos} own feet." = "{@bt_a|::subscribed_books::vocabulary::person} 登场，被{pos}自己的脚绊了一跤。"
"A MERRY PLAY about {person}, {race} of {@bt_e|::subscribed_books::vocabulary::entity}, and the {adj} misunderstandings that ensued." = "一部欢快戏剧，讲述来自 {@bt_e|::subscribed_books::vocabulary::entity} 的{race} {person}，以及随之而来的{adj}误会。"
"{@bt_a|::subscribed_books::vocabulary::person} enters, looking confused." = "{@bt_a|::subscribed_books::vocabulary::person} 登场，一脸困惑。"
"ACT NEXT." = "下一幕。"
"The confusion deepens." = "误会加深了。"
"(New scene. {@year}. Things have gotten worse. Funnier, but worse.)" = "（新场景。{@year} 年。情况更糟了。更好笑，但也更糟。）"
"(dramatically) I am undone!" = "（夸张地）我完了！"
"{cause}!" = "{cause}！"
"You seem fine." = "你看起来没事。"
"Give it a moment." = "再等一会儿。"
"They made me {role}?" = "他们让我当{role}？"
"ME?!" = "我？！"
"Nobody else wanted it." = "因为没有其他人愿意。"
"Fair enough." = "那也合理。"
"(presenting {@bt_i|::subscribed_books::vocabulary::artifact}) Behold my masterwork!" = "（展示 {@bt_i|::subscribed_books::vocabulary::artifact}）看看我的杰作！"
"It's upside down." = "你拿倒了。"
"That's... deliberate." = "那是……故意的。"
"(Hilarious misunderstandings occur in {@year}. The audience is delighted.)" = "（{@year} 年，爆笑误会连连。观众喜不自胜。）"
"(Laughter. Intermission.)" = "（大笑。幕间休息。）"
"(in unison) And so all's well that ends well!" = "（齐声）就这样，结局好，一切都好！"
"(Curtain. Applause. Someone throws a turnip.)" = "（落幕。掌声。有人扔来一个芜菁。）"
"THE END." = "全剧终。"
"The comedy of {person} concludes." = "{person} 的喜剧结束。"
"Everyone goes to the tavern." = "大家都去了酒馆。"
"A HISTORY PLAY." = "一部历史剧。"
"Based upon the true events of {@bt_e|::subscribed_books::vocabulary::entity} at {@bt_s|::subscribed_books::vocabulary::place}." = "依据 {@bt_e|::subscribed_books::vocabulary::entity} 在 {@bt_s|::subscribed_books::vocabulary::place} 的真实事件改编。"
"ACT I -- THE BEGINNING" = "第一幕——开端"
"Enter {person}." = "{person} 登场。"
"THE CHRONICLE OF {@bt_a|::subscribed_books::vocabulary::person}, dramatized for the stage." = "{@bt_a|::subscribed_books::vocabulary::person} 的编年史，改编为舞台剧。"
"Set in {@bt_s|::subscribed_books::vocabulary::place}, among the people of {@bt_e|::subscribed_books::vocabulary::entity}." = "场景设在 {@bt_s|::subscribed_books::vocabulary::place}，{@bt_e|::subscribed_books::vocabulary::entity} 的民众之中。"
"{@bt_a|::subscribed_books::vocabulary::person} stands before {@bt_e|::subscribed_books::vocabulary::entity}." = "{@bt_a|::subscribed_books::vocabulary::person} 站在 {@bt_e|::subscribed_books::vocabulary::entity} 面前。"
"A PLAY IN SEVERAL ACTS\nBased upon the {adj} history of {@bt_e|::subscribed_books::vocabulary::entity}\n\nDRAMATIS PERSONAE:\n{person} -- central figure\nCitizens, soldiers, and officials of {@bt_e2|::subscribed_books::vocabulary::entity}\n\nSetting: {@bt_s|::subscribed_books::vocabulary::place} and surrounding lands" = "一部多幕戏剧\n依据 {@bt_e|::subscribed_books::vocabulary::entity} 的{adj}历史改编\n\n登场人物：\n{person}——核心人物\n{@bt_e2|::subscribed_books::vocabulary::entity} 的居民、士兵和官员\n\n场景：{@bt_s|::subscribed_books::vocabulary::place} 及其周边土地"
"A PLAY IN SEVERAL ACTS\nBased upon the {adj} history of {@bt_e|::subscribed_books::vocabulary::entity}" = "一部多幕戏剧\n依据 {@bt_e|::subscribed_books::vocabulary::entity} 的{adj}历史改编"
"DRAMATIS PERSONAE:\n{person} -- central figure\nCitizens, soldiers, and officials of {@bt_e2|::subscribed_books::vocabulary::entity}" = "登场人物：\n{person}——核心人物\n{@bt_e2|::subscribed_books::vocabulary::entity} 的居民、士兵和官员"
"Setting: {@bt_s|::subscribed_books::vocabulary::place} and surrounding lands" = "场景：{@bt_s|::subscribed_books::vocabulary::place} 及其周边土地"
"ACT I -- THE STAGE IS SET" = "第一幕——舞台已备"
"{@bt_a|::subscribed_books::vocabulary::person} enters." = "{@bt_a|::subscribed_books::vocabulary::person} 登场。"
"ACT -- {@year}" = "第 {@year} 幕"
"(to the audience) I have served {@bt_e|::subscribed_books::vocabulary::entity} as best I could." = "（对观众）我已尽我所能，为 {@bt_e|::subscribed_books::vocabulary::entity} 效力。"
"{cause} takes me now, in {@year}." = "如今，{@year} 年，{cause} 将带走我。"
"Remember what was done here." = "记住这里发生的一切。"
"Let it be known that {@bt_a|::subscribed_books::vocabulary::person} is appointed {role} of {@bt_e|::subscribed_books::vocabulary::entity}!" = "宣告众人：{@bt_a|::subscribed_books::vocabulary::person} 被任命为 {@bt_e|::subscribed_books::vocabulary::entity} 的{role}！"
"(Cheers. Or silence. The playwright leaves it ambiguous.)" = "（欢呼。或是沉默。剧作家对此故意含糊其辞。）"
"{@bt_s|::subscribed_books::vocabulary::place} is founded in the year {@year}!" = "{@bt_s|::subscribed_books::vocabulary::place} 于 {@year} 年建立！"
"May it stand forever!" = "愿它永远屹立！"
"Forever is a long time." = "永远可是很久。"
"Let us hope for \"long enough.\"" = "让我们期盼它能存在“足够久”吧。"
"(The drama of {@bt_e|::subscribed_books::vocabulary::entity} unfolds in {@year}. {@bt_a|::subscribed_books::vocabulary::person} watches from center stage.)" = "（{@year} 年，{@bt_e|::subscribed_books::vocabulary::entity} 的戏剧展开。{@bt_a|::subscribed_books::vocabulary::person} 在舞台中央注视着。）"
"(The scene darkens. History moves on.)" = "（场景渐暗。历史继续前行。）"
"And so the history of {@bt_e|::subscribed_books::vocabulary::entity} continues beyond the stage." = "于是，{@bt_e|::subscribed_books::vocabulary::entity} 的历史在舞台之外继续。"
"The play ends." = "戏剧结束了。"
"The world does not." = "世界没有结束。"
"FINIS." = "终。"
"What you have witnessed is a {adj} dramatization." = "诸位所见，是一场{adj}戏剧改编。"
"The truth, as always, is both simpler and more complicated." = "真相一如既往，既更简单，也更复杂。"
"The play of {person} ends here, but history -- real history -- never takes a curtain call." = "{person} 的戏剧就此结束，但历史——真实的历史——从不谢幕。"
"A MORALITY PLAY." = "一部道德剧。"
"In which VIRTUE and VICE contend for the soul of {@bt_a|::subscribed_books::vocabulary::person}." = "美德与恶德争夺 {@bt_a|::subscribed_books::vocabulary::person} 的灵魂。"
"Behold {person}, who stands at the crossroads." = "看吧，{person} 正站在十字路口。"
"(laughing) Crossroads are my favorite place." = "（笑）十字路口是我最喜欢的地方。"
"THE TRIAL OF {@bt_a|::subscribed_books::vocabulary::person}." = "{@bt_a|::subscribed_books::vocabulary::person} 的审判。"
"An allegorical play." = "一部寓言剧。"
"We are gathered to weigh the {adj} deeds of {person}, {race} of {@bt_e|::subscribed_books::vocabulary::entity}." = "我们在此评判来自 {@bt_e|::subscribed_books::vocabulary::entity} 的{race} {person} 所做的{adj}行为。"
"In {@year}, the contest continued." = "{@year} 年，争斗仍在继续。"
"My turn." = "轮到我了。"
"{@bt_a|::subscribed_books::vocabulary::person} fell to {cause} in {@year}." = "{@year} 年，{@bt_a|::subscribed_books::vocabulary::person} 因 {cause} 倒下。"
"I didn't do it." = "这不是我干的。"
"Not this time." = "至少这次不是。"
"That is somehow worse." = "这反而更加糟糕。"
"{@bt_a|::subscribed_books::vocabulary::person} accepted the role of {role} in {@year}." = "{@year} 年，{@bt_a|::subscribed_books::vocabulary::person} 接受了{role}的职位。"
"A chance to serve." = "一个效力的机会。"
"A chance to be corrupted." = "一个腐化的机会。"
"Same thing, different angle." = "同一件事，不同角度。"
"(VIRTUE and VICE observe {@bt_a|::subscribed_books::vocabulary::person}'s actions in {@year}, each claiming credit.)" = "（美德与恶德观察 {@bt_a|::subscribed_books::vocabulary::person} 在 {@year} 年的行为，各自居功。）"
"The scales remain in balance." = "天平仍然平衡。"
"For now." = "暂且如此。"
"The verdict on {person} is rendered: {adj}." = "对 {person} 的裁决如下：{adj}。"
"The audience must decide whether that is enough." = "观众必须决定，这是否足够。"
"(to the audience) You have seen the {adj} contest for the soul of {person}." = "（对观众）诸位已见证争夺 {person} 灵魂的{adj}较量。"
"Virtue and Vice will argue their cases until the end of time." = "美德与恶德将为各自主张争辩，直到时间尽头。"
"The verdict is always yours." = "裁决永远属于诸位。"
"A FARCE." = "一部闹剧。"
"Nobody is who they seem." = "没有人像表面看来那样。"
"Everyone is hiding in a barrel." = "每个人都藏在桶里。"
"Enter {person}, wearing the wrong hat." = "{person} 登场，戴着不属于自己的帽子。"
"AN OUTRAGEOUS FARCE set in {@bt_s|::subscribed_books::vocabulary::place}." = "一部设在 {@bt_s|::subscribed_books::vocabulary::place} 的荒唐闹剧。"
"Mistaken identities." = "认错身份。"
"Slamming doors." = "砰砰关门。"
"At least one goat." = "至少一只山羊。"
"{@bt_a|::subscribed_books::vocabulary::person} enters, pursued by misfortune." = "{@bt_a|::subscribed_books::vocabulary::person} 登场，厄运紧随其后。"
"(Crash. Bang. It's {@year} and things are getting ridiculous.)" = "（哗啦。砰。时为 {@year} 年，事情愈发荒唐。）"
"I think I'm dying." = "我觉得我要死了。"
"No, that's just indigestion." = "不，你只是消化不良。"
"Oh. Oh no, actually, {cause}--" = "哦。哦不，其实是 {cause}——"
"(Blackout.)" = "（灯光骤灭。）"
"{@bt_a|::subscribed_books::vocabulary::person} is now {role}!" = "{@bt_a|::subscribed_books::vocabulary::person} 现在是{role}了！"
"WHAT." = "什么。"
"Also the building is on fire." = "还有，这栋房子着火了。"
"(In {@year}, twelve things go wrong simultaneously. {@bt_a|::subscribed_books::vocabulary::person} falls into a hole.)" = "（{@year} 年，十二件事情同时出错。{@bt_a|::subscribed_books::vocabulary::person} 掉进了洞里。）"
"(Slamming door. Honking goat. Applause.)" = "（摔门。山羊叫。掌声。）"
"(Everyone takes a bow. The set collapses. The goat escapes. THE END.)" = "（所有人鞠躬。布景坍塌。山羊逃跑。全剧终。）"
"THE FARCE OF {person} ENDS." = "{person} 的闹剧结束。"
"Somehow, everyone is fine." = "不知怎的，所有人都没事。"
"Except the furniture." = "除了家具。"

# Letter, all five perspectives.
"To whomever may read this -- I am {@bt_a|::subscribed_books::vocabulary::person}, and I write in {adj} desperation." = "致读到此信的人——我是 {@bt_a|::subscribed_books::vocabulary::person}，正怀着{adj}绝望写信。"
"I need help, and there is no one else to ask." = "我需要帮助，却没有其他人可以求助。"
"Please." = "求你了。"
"I beg you." = "我恳求你。"
"My name is {person}, and what I am about to describe requires immediate action." = "我的名字是 {person}，即将描述的事情需要立即采取行动。"
"I write this letter knowing it may never arrive." = "我写下此信，知道它可能永远无法送达。"
"I am {person}, {race} of {@bt_e|::subscribed_books::vocabulary::entity}, and I am in a position of {adj} need." = "我是来自 {@bt_e|::subscribed_books::vocabulary::entity} 的{race} {person}，处于{adj}困境之中。"
"If you have any mercy in you, read on." = "若你尚有怜悯之心，请读下去。"
"If not, pass this letter to someone who does." = "否则，请把这封信交给有怜悯之心的人。"
"By {@year}, the situation had grown more dire." = "到了 {@year} 年，局势更加危急。"
"I write again." = "我又写了一封信。"
"It is now {@year}." = "如今是 {@year} 年。"
"Things have worsened." = "事情恶化了。"
"{@bt_a|::subscribed_books::vocabulary::person} is dead." = "{@bt_a|::subscribed_books::vocabulary::person} 已死。"
"In {@year}." = "在 {@year} 年。"
"I could not save {obj}." = "我没能救下{obj}。"
"Please, you must act before more are lost." = "求你，一定要在更多人丧命前采取行动。"
"They have named {@bt_a|::subscribed_books::vocabulary::person} as {role} in {@year}." = "他们于 {@year} 年任命 {@bt_a|::subscribed_books::vocabulary::person} 为{role}。"
"I fear it is a trap." = "我担心这是个陷阱。"
"In {@year}, the danger grew." = "{@year} 年，危险加剧了。"
"I cannot be more specific in a letter." = "信中我无法说得更具体。"
"I await your response." = "我等待着你的回复。"
"Please hurry." = "请尽快。"
"I send this with all haste." = "我以最快的速度寄出此信。"
"May it reach you in time." = "愿它及时到达你的手中。"
"-- {@bt_a|::subscribed_books::vocabulary::person}" = "——{@bt_a|::subscribed_books::vocabulary::person}"
"This letter carries the {adj} weight of everything I cannot say aloud." = "这封信承载了我无法说出口的一切，重得{adj}。"
"If it reaches you, act." = "如果它到了你手中，就行动吧。"
"If it does not, then I have failed, and {@bt_e|::subscribed_books::vocabulary::entity} is on its own." = "如果没到，我便失败了，{@bt_e|::subscribed_books::vocabulary::entity} 只能独自面对。"
"To the leadership of {@bt_e|::subscribed_books::vocabulary::entity}." = "致 {@bt_e|::subscribed_books::vocabulary::entity} 的领导者。"
"Subject: Events at {@bt_s|::subscribed_books::vocabulary::place}." = "主题：{@bt_s|::subscribed_books::vocabulary::place} 的事件。"
"From: {@bt_a|::subscribed_books::vocabulary::person}." = "发件人：{@bt_a|::subscribed_books::vocabulary::person}。"
"Classification: Official." = "类别：公务。"
"REPORT." = "报告。"
"Prepared by {person} for the records of {@bt_e|::subscribed_books::vocabulary::entity}." = "由 {person} 编写，存入 {@bt_e|::subscribed_books::vocabulary::entity} 的档案。"
"Concerning: recent developments at {@bt_s|::subscribed_books::vocabulary::place}." = "事由：{@bt_s|::subscribed_books::vocabulary::place} 的近期进展。"
"Update for the period of {@year}:" = "{@year} 年的更新："
"Casualty report: {person}, deceased year {@year}." = "伤亡报告：{person}，于 {@year} 年死亡。"
"Cause: {cause}." = "原因：{cause}。"
"Location: {@bt_s|::subscribed_books::vocabulary::place}." = "地点：{@bt_s|::subscribed_books::vocabulary::place}。"
"Personnel change: {@bt_a|::subscribed_books::vocabulary::person} assigned to {role}, effective {@year}." = "人事变动：{@bt_a|::subscribed_books::vocabulary::person} 被任命为{role}，于 {@year} 年生效。"
"Notable production: {@bt_i|::subscribed_books::vocabulary::artifact}, crafted by {@bt_a|::subscribed_books::vocabulary::person} in {@year}." = "重要作品：{@bt_i|::subscribed_books::vocabulary::artifact}，由 {@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年制作。"
"Activities for year {@year} proceeded within expected parameters." = "{@year} 年的活动在预期范围内开展。"
"End of section." = "本节完。"
"End of report." = "报告结束。"
"Filed by {@bt_a|::subscribed_books::vocabulary::person}." = "归档人：{@bt_a|::subscribed_books::vocabulary::person}。"
"For official use only." = "仅限公务用途。"
"Report complete." = "报告完成。"
"Awaiting further instructions." = "等待后续指示。"
"My dearest {@bt_b|::subscribed_books::vocabulary::person} -- I write to you from {@bt_s|::subscribed_books::vocabulary::place} with a heart so full it aches." = "我最亲爱的 {@bt_b|::subscribed_books::vocabulary::person}——我从 {@bt_s|::subscribed_books::vocabulary::place} 写信给你，满心情意涨得发痛。"
"I think of you always." = "我时刻想着你。"
"To {@bt_b|::subscribed_books::vocabulary::person}, the light of my life." = "致 {@bt_b|::subscribed_books::vocabulary::person}，我生命中的光。"
"These words are a {adj} substitute for my presence, but they are all I have." = "这些话语是我亲身陪伴的{adj}替代品，但我只能给你这些。"
"My beloved {@bt_b|::subscribed_books::vocabulary::person} -- there are not enough words in the language of {@bt_e|::subscribed_books::vocabulary::entity}, nor in any other tongue, to express what you mean to me." = "我挚爱的 {@bt_b|::subscribed_books::vocabulary::person}——无论 {@bt_e|::subscribed_books::vocabulary::entity} 的语言，还是任何其他语言，都没有足够的话语表达你对我的意义。"
"I am {person}, and I am yours, wholly and without reservation." = "我是 {person}，我毫无保留地、完全属于你。"
"This letter is a {adj} vessel for an ocean of feeling." = "这封信是承载感情海洋的{adj}舟船。"
"Time has passed." = "时光流逝。"
"It is {@year} now." = "现在是 {@year} 年。"
"I miss you still." = "我仍思念你。"
"I must tell you terrible news." = "我必须告诉你一个可怕的消息。"
"{@bt_a|::subscribed_books::vocabulary::person} is gone." = "{@bt_a|::subscribed_books::vocabulary::person} 已经离去了。"
"Year {@year}." = "{@year} 年。"
"I cannot bear it." = "我无法承受。"
"In {@year}, I thought of you." = "{@year} 年，我思念着你。"
"As I do every year." = "如同每一年。"
"As I will every year to come." = "如同今后的每一年。"
"I send you all my love." = "我将全部爱意寄给你。"
"It is the one thing distance cannot diminish." = "只有它，是距离无法削减的。"
"Yours always, in this world and the next." = "永远属于你，无论此生还是来世。"
"Every word in this letter is a {adj} heartbeat." = "这封信里的每个字，都是一次{adj}心跳。"
"I am counting the days until we are reunited." = "我数着日子，等我们重逢。"
"Until then, carry me in your thoughts as I carry you in mine." = "在那之前，请将我放在心上，就如我将你放在心上一样。"
"Yours eternally, {person}." = "永远属于你的，{person}。"
"READ THIS IMMEDIATELY." = "请立即阅读此信。"
"I am {@bt_a|::subscribed_books::vocabulary::person}." = "我是 {@bt_a|::subscribed_books::vocabulary::person}。"
"{@bt_s|::subscribed_books::vocabulary::place} is in danger." = "{@bt_s|::subscribed_books::vocabulary::place} 正处于危险之中。"
"This letter may be our only chance." = "这封信可能是我们唯一的机会。"
"To {@bt_e|::subscribed_books::vocabulary::entity}: This is not a request." = "致 {@bt_e|::subscribed_books::vocabulary::entity}：这不是请求。"
"This is a warning." = "这是警告。"
"What I have witnessed at {@bt_s|::subscribed_books::vocabulary::place} demands urgent action." = "我在 {@bt_s|::subscribed_books::vocabulary::place} 目睹的事情，必须立即采取行动。"
"By {@year}, the threat had escalated." = "到 {@year} 年，威胁升级了。"
"This is exactly what I warned about." = "这正是我警告过的事情。"
"The events of {@year} confirm my worst fears." = "{@year} 年的事件，证实了我最坏的担忧。"
"Act now or face the consequences." = "立即行动，否则就要面对后果。"
"Do not ignore this." = "不要忽视此事。"
"I am running out of time." = "我的时间不多了。"
"You have been warned." = "我已经警告过你。"
"What happens next is on your conscience." = "接下来发生的事，将由你的良心承担。"
"This is my final warning." = "这是我最后的警告。"
"After this, it will be too late." = "再晚，就来不及了。"
"By the time you read this, I will be gone." = "当你读到此信时，我已离去。"
"My name is {person}, and these are my last words." = "我的名字是 {person}，这些是我的遗言。"
"To those I leave behind: I am {@bt_a|::subscribed_books::vocabulary::person}." = "致我留下的人们：我是 {@bt_a|::subscribed_books::vocabulary::person}。"
"I write this in {@bt_s|::subscribed_books::vocabulary::place}, knowing I will not write another." = "我在 {@bt_s|::subscribed_books::vocabulary::place} 写下此信，知道自己不会再写第二封。"
"This is my farewell." = "这是我的告别。"
"I am {person}, {race} of {@bt_e|::subscribed_books::vocabulary::entity}, and I have come to the {adj} end of my road." = "我是来自 {@bt_e|::subscribed_books::vocabulary::entity} 的{race} {person}，如今已走到生命道路的{adj}尽头。"
"Do not grieve too long." = "不要悲伤太久。"
"I lived, and that was enough." = "我活过，这就足够了。"
"Before I go, let me tell you about {@year}." = "在我离去前，让我讲讲 {@year} 年的事。"
"I know now that {cause} is coming for me, as it came for {@bt_a|::subscribed_books::vocabulary::person} in {@year}." = "我现在知道，{cause} 即将带走我，如同它在 {@year} 年带走 {@bt_a|::subscribed_books::vocabulary::person}。"
"I am not afraid." = "我并不害怕。"
"In {@year}, I was happy." = "{@year} 年，我很幸福。"
"I want you to know that." = "我想让你知道这一点。"
"There is more I wish I could say." = "我还想说更多。"
"But time is short." = "但时间紧迫。"
"Goodbye." = "再见。"
"Remember me kindly, if you remember me at all." = "若你还记得我，请善意地记住我。"
"I go now into the {adj} silence that awaits us all." = "我现在走向那等待所有人的{adj}寂静。"
"I carry no regrets, or at least none worth burdening you with." = "我没有遗憾，至少没有值得让你背负的遗憾。"
"Live well." = "好好生活。"
"Love freely." = "自由地去爱。"
"Remember me." = "记住我。"

