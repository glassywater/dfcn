"The false name did not survive contact with the first direct question. {@bt_a|::subscribed_books::vocabulary::person} simply told the truth instead." = "假名字连第一个直接的问题都没撑过。{@bt_a|::subscribed_books::vocabulary::person}干脆说了真话。"
"{@bt_a|::subscribed_books::vocabulary::person} attempted the disguise and abandoned it almost immediately -- it felt too much like lying to bear." = "{@bt_a|::subscribed_books::vocabulary::person}试着伪装，却几乎立刻放弃。这感觉太像撒谎，实在难以忍受。"
