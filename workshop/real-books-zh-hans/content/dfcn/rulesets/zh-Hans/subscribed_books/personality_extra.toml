[[rulesets]]
[rulesets.rules]
# 目击者的悲痛、愤怒、恐惧与自豪。
"{@bt_a|::subscribed_books::vocabulary::person} reached {@bt_c|::subscribed_books::personality_extra::person} too late, and stayed there on {pos1} knees long after there was any point." = "{@bt_a|::subscribed_books::vocabulary::person} 赶到 {@bt_c|::subscribed_books::personality_extra::person} 身旁时已为时太晚，却仍久久地跪在那里，{pos1}双膝始终没有离地，哪怕一切早已毫无意义。"
"{@bt_a|::subscribed_books::vocabulary::person} made no sound at all. Later, everyone who was there agreed that had been the worst of it." = "{@bt_a|::subscribed_books::vocabulary::person} 一点声音也没有发出。后来，在场的人都说，那才是最让人难受的地方。"
"{@bt_a|::subscribed_books::vocabulary::person} had seen {@bt_c|::subscribed_books::personality_extra::person} fall. {pro1} would see it again, every night, for a long time." = "{@bt_a|::subscribed_books::vocabulary::person} 亲眼看见 {@bt_c|::subscribed_books::personality_extra::person} 倒下。此后很长一段时间，{pro1}每晚都会再看见那一幕。"
"{@bt_a|::subscribed_books::vocabulary::person} had seen what {@bt_b|::subscribed_books::vocabulary::person} did to {@bt_c|::subscribed_books::personality_extra::person}. {pro1} would not forget it, and did not mean to." = "{@bt_a|::subscribed_books::vocabulary::person} 亲眼见过 {@bt_b|::subscribed_books::vocabulary::person} 对 {@bt_c|::subscribed_books::personality_extra::person} 做了什么。{pro1}不会忘，也不打算忘。"
"{@bt_a|::subscribed_books::vocabulary::person} said nothing to {@bt_b|::subscribed_books::vocabulary::person} then. There would be time." = "当时，{@bt_a|::subscribed_books::vocabulary::person} 没有对 {@bt_b|::subscribed_books::vocabulary::person} 说什么。以后有的是时间。"
"{@bt_a|::subscribed_books::vocabulary::person} helped {@bt_c|::subscribed_books::personality_extra::person} up, and over {@bt_c2|::subscribed_books::personality_extra::person}'s shoulder looked at {@bt_b|::subscribed_books::vocabulary::person} in a way {@bt_b2|::subscribed_books::vocabulary::person} would have done well to notice." = "{@bt_a|::subscribed_books::vocabulary::person} 扶起 {@bt_c|::subscribed_books::personality_extra::person}，越过 {@bt_c2|::subscribed_books::personality_extra::person} 的肩头望向 {@bt_b|::subscribed_books::vocabulary::person}。那样的目光，{@bt_b2|::subscribed_books::vocabulary::person} 最好能看在眼里。"
"{@bt_a|::subscribed_books::vocabulary::person} looked at {@bt_b|::subscribed_books::vocabulary::person} as if at a stranger." = "{@bt_a|::subscribed_books::vocabulary::person} 看着 {@bt_b|::subscribed_books::vocabulary::person}，仿佛看着一个陌生人。"
"{@bt_a|::subscribed_books::vocabulary::person} had always been glad of {@bt_b|::subscribed_books::vocabulary::person} at {pos1} side. {pro1} was not sure, now, what {pro2} had been glad of." = "{@bt_a|::subscribed_books::vocabulary::person} 一直庆幸 {@bt_b|::subscribed_books::vocabulary::person} 站在{pos1}身边。可如今，{pro1}已不确定，{pro2}过去究竟在庆幸什么。"
"{@bt_a|::subscribed_books::vocabulary::person} could not watch the end of it, and did not speak to {@bt_b|::subscribed_books::vocabulary::person} for the rest of the day." = "{@bt_a|::subscribed_books::vocabulary::person} 不忍看完最后一幕，那天余下的时间里，也没有再和 {@bt_b|::subscribed_books::vocabulary::person} 说话。"
"{@bt_a|::subscribed_books::vocabulary::person} was the first at {@bt_b|::subscribed_books::vocabulary::person}'s side when it was over, grinning like a fool." = "事情一结束，{@bt_a|::subscribed_books::vocabulary::person} 就第一个赶到 {@bt_b|::subscribed_books::vocabulary::person} 身旁，笑得像个傻子。"
