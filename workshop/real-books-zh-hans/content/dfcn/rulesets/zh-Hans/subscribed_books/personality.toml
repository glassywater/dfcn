"{@bt_a|::subscribed_books::vocabulary::person} did not need to sneak. {pro1} simply distracted {@bt_b|::subscribed_books::vocabulary::person} and walked away with what {pro2} came for." = "{@bt_a|::subscribed_books::vocabulary::person}无需偷偷摸摸。{pro1}只需让{@bt_b|::subscribed_books::vocabulary::person}分心，就能带着{pro2}此行所求走开。"
