# interpreters.lua::interpret_political：敌对宣告、任命与晋升、家族/功绩/神祇关系、所有组织关系类型及组合历史段。
base = "subscribed_books::interpreters_political"

[[rulesets]]
[rulesets.rules]
"In the year {year1}, a new threat emerged to menace {@bt_entity|::subscribed_books::interpreters::entity}. {@bt_hero_ep|::subscribed_books::interpreters::person}, {article} {race}, was declared an enemy of the people. The creature had made its presence known in ways that could no longer be ignored." = "{year1}年，新的威胁出现，危及{@bt_entity|::subscribed_books::interpreters::entity}。{@bt_hero_ep|::subscribed_books::interpreters::person}，一只{race}，被宣布为人民的敌人。这只生物的存在已通过无法再忽略的方式显露出来。"
"The year {year1} brought a new terror to {@bt_entity|::subscribed_books::interpreters::entity}. {@bt_hero_ep|::subscribed_books::interpreters::person}, {article} {race} of fearsome reputation, rose as an enemy of the civilization. Its attacks on the outskirts of {@bt_site|::subscribed_books::interpreters::place} had grown too brazen, too frequent, too costly to dismiss." = "{year1}年为{@bt_entity|::subscribed_books::interpreters::entity}带来了新的恐怖。{@bt_hero_ep|::subscribed_books::interpreters::person}，一只凶名远扬的{race}，成为文明的敌人。它在{@bt_site|::subscribed_books::interpreters::place}外围的袭击已过于大胆、频繁，代价过高，再无法忽视。"
"{@bt_hero_ep|::subscribed_books::interpreters::person}. The name would come to be spoken with dread throughout {@bt_entity|::subscribed_books::interpreters::entity}. In {year1}, this {race} was formally recognized as an enemy -- not merely a nuisance or a hazard, but a genuine threat to the survival of {@bt_site|::subscribed_books::interpreters::place} and its people." = "{@bt_hero_ep|::subscribed_books::interpreters::person}。这个名字将让整个{@bt_entity|::subscribed_books::interpreters::entity}的人说起时都心怀恐惧。{year1}年，这只{race}被正式确认为敌人，不只是烦扰或危险，而是真正威胁{@bt_site|::subscribed_books::interpreters::place}及其人民的生存。"
"The declaration did not come from nowhere. Before being named an enemy, {@bt_hero|::subscribed_books::interpreters::person} had been responsible for at least {n1} recorded attacks." = "这个宣告并非凭空而来。在被列为敌人之前，{@bt_hero|::subscribed_books::interpreters::person}已至少造成{n1}次有记录的袭击。"
"The creature's victims included {victims}." = "这只生物的受害者包括{victims}。"
"The final straw was the taking of {race} in the year {year2} -- an act so brazen, so close to the heart of {@bt_site|::subscribed_books::interpreters::place}, that the people could no longer pretend the problem would solve itself." = "最后的导火索是{year2}年掳走{race}之举。行为如此大胆，地点如此接近{@bt_site|::subscribed_books::interpreters::place}的核心，人们再无法假装问题会自行消失。"
"What drove {@bt_hero|::subscribed_books::interpreters::person} to target {@bt_entity|::subscribed_books::interpreters::entity} specifically was a matter of speculation. Some believed the {race} was territorial, defending hunting grounds that the settlers had unknowingly encroached upon. Others thought the creature was simply drawn to easy prey -- the livestock, the travelers, the unwary." = "是什么驱使{@bt_hero|::subscribed_books::interpreters::person}专门以{@bt_entity|::subscribed_books::interpreters::entity}为目标，众说纷纭。有人相信，这只{race}是在保卫领地，捍卫被定居者无意侵入的猎场；也有人觉得，它只是被容易得手的猎物吸引，牲畜、旅人，以及毫无戒备的人。"
"The people of {@bt_site|::subscribed_books::interpreters::place} had dealt with predators before, but {@bt_hero|::subscribed_books::interpreters::person} was different. This was not an animal acting on instinct alone. There was a cunning to its attacks, a pattern that suggested intelligence -- or at least a dangerous kind of learning." = "{@bt_site|::subscribed_books::interpreters::place}的人民以前也应付过掠食者，但{@bt_hero|::subscribed_books::interpreters::person}不同。它并非仅凭本能行动的动物。它的袭击带着狡猾，有一定规律，显示着智慧，或者至少某种危险的学习能力。"
"Reports of {@bt_hero|::subscribed_books::interpreters::person}'s activities painted a grim picture. Livestock taken in the night. Travelers gone missing on the roads. Strange tracks found where no tracks should be. The {race} was testing the defenses of {@bt_site|::subscribed_books::interpreters::place}, probing for weakness, and finding it." = "关于{@bt_hero|::subscribed_books::interpreters::person}活动的报告，勾勒出阴沉的画面。牲畜夜间被掳走，旅人在路上失踪，本不该有足迹之处却出现怪异痕迹。这只{race}正试探{@bt_site|::subscribed_books::interpreters::place}的防御，寻找弱点，并找到了。"
"{@bt_hero|::subscribed_books::interpreters::person} was no young beast. At {n1} years old, the {race} had survived longer than most of its kind -- a testament to its cunning, its strength, or both." = "{@bt_hero|::subscribed_books::interpreters::person}已非年轻野兽。这只{n1}岁的{race}活得比大多数同类都久，证明着它的狡猾、力量，或者两者兼具。"
"At {n1} years old, {@bt_hero|::subscribed_books::interpreters::person} was in its prime. {article} {race} of that age would be at the peak of its strength and aggression." = "{n1}岁的{@bt_hero|::subscribed_books::interpreters::person}正处壮年。这个年龄的{race}，力量与攻击性都会达到巅峰。"
"Those who had observed {@bt_hero|::subscribed_books::interpreters::person} described the {race} as {tags}." = "观察过{@bt_hero|::subscribed_books::interpreters::person}的人，形容这只{race}性情{tags}。"
"The declaration of {@bt_hero|::subscribed_books::interpreters::person} as an enemy was not merely symbolic. It meant that the resources of {@bt_entity|::subscribed_books::interpreters::entity} could now be directed toward dealing with the threat. Bounties were posted. Patrols were doubled. And the people of {@bt_site|::subscribed_books::interpreters::place} slept a little less soundly, knowing that somewhere in the darkness, the {race} was watching." = "宣布{@bt_hero|::subscribed_books::interpreters::person}为敌人，并不只是象征。它意味着{@bt_entity|::subscribed_books::interpreters::entity}的资源如今可以用来处理威胁。悬赏张贴，巡逻加倍。{@bt_site|::subscribed_books::interpreters::place}的人民睡得更不安稳，因为他们知道，某处黑暗里，这只{race}正看着。"
"With the formal recognition of {@bt_hero|::subscribed_books::interpreters::person} as an enemy, the mood in {@bt_site|::subscribed_books::interpreters::place} shifted. This was no longer a problem to be tolerated. It was a war -- a small one, perhaps, fought not between armies but between a civilization and a single, relentless creature. And wars, as everyone knew, had to be won." = "正式确认{@bt_hero|::subscribed_books::interpreters::person}为敌人后，{@bt_site|::subscribed_books::interpreters::place}的气氛变了。这不再是可以容忍的问题，而是一场战争。也许是小战争，并非军队之间，而是一个文明与一只永不停歇的生物之间。人人都知道，战争必须赢。"
"The threat of {@bt_hero|::subscribed_books::interpreters::person} would persist for another {n1} years before the {race} was finally brought down. But the memory of its reign of terror lingered long after." = "{@bt_hero|::subscribed_books::interpreters::person}的威胁又持续了{n1}年，这只{race}才终于被击倒。但它恐怖统治的记忆，仍久久不散。"
"{@bt_hero|::subscribed_books::interpreters::person}'s time as a threat was cut short. The {race} met its end in the same year it was declared an enemy." = "{@bt_hero|::subscribed_books::interpreters::person}作为威胁的时日被提前终结。这只{race}在被宣布为敌人的同一年，就迎来了末日。"
"As of this writing, {@bt_hero|::subscribed_books::interpreters::person} remains a threat. The {race} is out there still, and the people of {@bt_site|::subscribed_books::interpreters::place} have not forgotten." = "写到这里时，{@bt_hero|::subscribed_books::interpreters::person}仍是威胁。这只{race}还在外面，{@bt_site|::subscribed_books::interpreters::place}的人民也未忘记。"
"In the year {year1}, {@bt_appointer|::subscribed_books::interpreters::person}, {appointer_title} of {@bt_entity|::subscribed_books::interpreters::entity}, named {@bt_hero|::subscribed_books::interpreters::person} to the position of {role}. The appointment sent ripples through every hall and corridor of {@bt_site|::subscribed_books::interpreters::place}." = "{year1}年，{@bt_entity|::subscribed_books::interpreters::entity}的{appointer_title}{@bt_appointer|::subscribed_books::interpreters::person}任命{@bt_hero|::subscribed_books::interpreters::person}担任{role}。这次任命在{@bt_site|::subscribed_books::interpreters::place}每座大厅、每条走廊激起涟漪。"
"It was {@bt_appointer|::subscribed_books::interpreters::person} who made the decision. In {year1}, the {appointer_title} of {@bt_entity|::subscribed_books::interpreters::entity} elevated {@bt_hero|::subscribed_books::interpreters::person} to the rank of {role} -- a choice that would define the direction of {@bt_entity2|::subscribed_books::interpreters::entity} for years to come." = "作决定的是{@bt_appointer|::subscribed_books::interpreters::person}。{year1}年，这位{@bt_entity|::subscribed_books::interpreters::entity}的{appointer_title}将{@bt_hero|::subscribed_books::interpreters::person}提升为{role}，这个选择将决定{@bt_entity2|::subscribed_books::interpreters::entity}往后多年的方向。"
"{@bt_appointer|::subscribed_books::interpreters::person}, {appointer_title} of {@bt_entity|::subscribed_books::interpreters::entity}, had watched {@bt_hero|::subscribed_books::interpreters::person} for some time. In {year1}, {@bt_appointer2|::subscribed_books::interpreters::person} made the appointment official: {@bt_hero2|::subscribed_books::interpreters::person} would serve as {role}." = "{@bt_entity|::subscribed_books::interpreters::entity}的{appointer_title}{@bt_appointer|::subscribed_books::interpreters::person}已观察{@bt_hero|::subscribed_books::interpreters::person}一段时间。{year1}年，{@bt_appointer2|::subscribed_books::interpreters::person}正式作出任命：{@bt_hero2|::subscribed_books::interpreters::person}将担任{role}。"
"In the year {year1}, {@bt_hero_ep|::subscribed_books::interpreters::person} was named {role} of {@bt_entity|::subscribed_books::interpreters::entity}. The appointment was the culmination of years of service, ambition, and the kind of quiet competence that eventually becomes impossible to ignore." = "{year1}年，{@bt_hero_ep|::subscribed_books::interpreters::person}被任命为{@bt_entity|::subscribed_books::interpreters::entity}的{role}。多年服务、雄心，以及终究变得无法忽视的安静才干，在这次任命中汇聚到顶点。"
"The year {year1} brought a new {role} to {@bt_entity|::subscribed_books::interpreters::entity}. {@bt_hero_ep|::subscribed_books::interpreters::person}, {article} {race} of {n1} years, took the position with the gravity it deserved." = "{year1}年为{@bt_entity|::subscribed_books::interpreters::entity}带来了新的{role}。{@bt_hero_ep|::subscribed_books::interpreters::person}，一位{n1}岁的{race}，以这个职位应有的庄重就任。"
"{@bt_hero|::subscribed_books::interpreters::person} was {n1} years old -- {article} {race} known to be {tags}. These were not incidental qualities. They were the very traits that made {pos1} appointment inevitable." = "{@bt_hero|::subscribed_books::interpreters::person}当时{n1}岁，是一位以{tags}闻名的{race}。这些性情并非偶然，正是让{pos1}任命成为必然的品质。"
"{@bt_hero|::subscribed_books::interpreters::person} was {n1} years old at the time, {article} {race} who had earned respect through years of steady service to {@bt_entity|::subscribed_books::interpreters::entity}." = "{@bt_hero|::subscribed_books::interpreters::person}当时{n1}岁，是一位通过多年稳定服务{@bt_entity|::subscribed_books::interpreters::entity}而赢得尊敬的{race}。"
"{@bt_hero|::subscribed_books::interpreters::person} had previously served as {roles} -- hardly the expected path to a military command. But {@bt_hero2|::subscribed_books::interpreters::person} understood something that the professional soldiers did not: that the battles worth fighting were not always the ones fought with weapons. {pro1} brought a strategist's mind to a warrior's post." = "{@bt_hero|::subscribed_books::interpreters::person}此前担任{roles}，这几乎不是人们预期的军事指挥道路。但{@bt_hero2|::subscribed_books::interpreters::person}明白职业军人不懂的事：值得打的战斗，并不总是用武器打的。{pro1}把战略家的头脑，带到了战士的岗位。"
"The appointment surprised those who knew {@bt_hero|::subscribed_books::interpreters::person} only as {roles}. But {@bt_hero2|::subscribed_books::interpreters::person} had always been more than {pos1} title suggested. The discipline required to master one craft was the same discipline needed to lead soldiers. And {@bt_hero3|::subscribed_books::interpreters::person} had discipline in abundance." = "那些只知道{@bt_hero|::subscribed_books::interpreters::person}曾担任{roles}的人，都为任命吃惊。但{@bt_hero2|::subscribed_books::interpreters::person}向来不止{pos1}头衔所显示的那样。精通一门技艺需要的纪律，与领导士兵所需的纪律相同。而{@bt_hero3|::subscribed_books::interpreters::person}的纪律充沛。"
"Some questioned the choice. {@bt_hero|::subscribed_books::interpreters::person} had been {roles}, not a warrior. But those who questioned had not seen {@bt_hero2|::subscribed_books::interpreters::person} in the sparring ring at dawn, or noticed the military treatises in {pos1} quarters, or heard the questions {pro1} asked the veterans when no one else was listening." = "有人质疑选择。{@bt_hero|::subscribed_books::interpreters::person}曾是{roles}，不是战士。但质疑的人没见过{@bt_hero2|::subscribed_books::interpreters::person}黎明时在对练场里的模样，没注意{pos1}房间里的军事论著，也没听过{pro1}在无人旁听时向老兵提出的问题。"
"{@bt_hero|::subscribed_books::interpreters::person} had served as {roles} before this appointment. The progression was natural -- each role had prepared {pro1} for the next, building a breadth of experience that few in {@bt_entity|::subscribed_books::interpreters::entity} could match." = "这次任命前，{@bt_hero|::subscribed_books::interpreters::person}曾担任{roles}。晋升很自然，每个职位都为{pro1}下一个职位作准备，积累了{@bt_entity|::subscribed_books::interpreters::entity}内少有人能比的广博经验。"
"The appointment was not without justification. {@bt_hero|::subscribed_books::interpreters::person} had {n1} confirmed kills to {pos1} name" = "这次任命并非毫无依据。{@bt_hero|::subscribed_books::interpreters::person}名下有{n1}次确认击杀"
"-- among them {persons}" = "，其中包括{persons}"
". In a world where threats came from every direction, a leader who could fight was worth ten who could only delegate." = "。在威胁来自四面八方的世界，能战斗的一位领袖，抵得上只能委派任务的十位。"
"{@bt_hero|::subscribed_books::interpreters::person} was no stranger to violence. With {n1} kills recorded before the appointment, {pro1} had proven that {pos1} resolve was not merely theoretical. It had been tested, and it had held." = "{@bt_hero|::subscribed_books::interpreters::person}并不陌生于暴力。任命前已有{n1}次击杀记录，证明{pos1}决心并非纸上谈兵。它经过考验，也站住了。"
"{@bt_hero|::subscribed_books::interpreters::person} bore the scars of {n1} wound{plural} survived in battle. Each one was a testament to {pos1} refusal to stay behind walls while others bled." = "{@bt_hero|::subscribed_books::interpreters::person}身上带着在战斗中挺过{n1}处伤口的疤痕。每一处都证明着：旁人流血时，{pro1}不愿留在墙后。"
"There were whispers that {@bt_hero|::subscribed_books::interpreters::person}'s connection to {@bt_deity|::subscribed_books::interpreters::person} was more than devotion -- that {pro1} carried a divine mandate. Whether or not this was true, {@bt_hero2|::subscribed_books::interpreters::person}'s faith gave {::subscribed_books::interpreters_political::ref_repeat_1} a certainty that others found either inspiring or unsettling. In battle, certainty was worth more than skill." = "有传言称，{@bt_hero|::subscribed_books::interpreters::person}与{@bt_deity|::subscribed_books::interpreters::person}的联系不止于虔诚，{pro1}背负着神授的使命。无论真假，{@bt_hero2|::subscribed_books::interpreters::person}的信仰给予{::subscribed_books::interpreters_political::ref_repeat_1}一种确信，旁人或受鼓舞，或感不安。战斗中，确信比技巧更值钱。"
"{@bt_hero|::subscribed_books::interpreters::person} was a devoted follower of {@bt_deity|::subscribed_books::interpreters::person}. Some said it was this faith that steadied {pos1} hand in the darkest moments -- that {pro1} fought not for glory or survival, but because {::subscribed_books::interpreters_political::ref_repeat_1} believed {@bt_deity2|::subscribed_books::interpreters::person} had chosen {::subscribed_books::interpreters_political::ref_repeat_2} for this purpose." = "{@bt_hero|::subscribed_books::interpreters::person}是{@bt_deity|::subscribed_books::interpreters::person}的忠诚信徒。有人说，正是这信仰在最黑暗的时刻稳住{pos1}双手；{pro1}战斗并非为荣耀或生存，而是因为{::subscribed_books::interpreters_political::ref_repeat_1}相信，{@bt_deity2|::subscribed_books::interpreters::person}已为此选中{::subscribed_books::interpreters_political::ref_repeat_2}。"
"{@bt_hero|::subscribed_books::interpreters::person}'s connection to {@bt_deity|::subscribed_books::interpreters::person} was well known. As {role2}, {pro1} had been seen praying over the wounded, and more than one soldier swore that {pos1} touch carried a warmth that no poultice could explain. Whether it was faith or skill, the result was the same: people who should have died did not." = "{@bt_hero|::subscribed_books::interpreters::person}与{@bt_deity|::subscribed_books::interpreters::person}的联系众所周知。担任{role2}时，人们见过{pro1}在伤员旁祈祷，不止一位士兵发誓，{pos1}触碰带着任何药膏都无法解释的暖意。无论来自信仰还是技巧，结果一样：本该死的人没有死。"
"{@bt_hero|::subscribed_books::interpreters::person} was a follower of {@bt_deity|::subscribed_books::interpreters::person}. The connection lent {pos1} authority a quality that went beyond the merely political -- there was a sense, among the people of {@bt_entity|::subscribed_books::interpreters::entity}, that {@bt_hero2|::subscribed_books::interpreters::person}'s appointment was not merely the will of the {appointer_title}, but something ordained." = "{@bt_hero|::subscribed_books::interpreters::person}信奉{@bt_deity|::subscribed_books::interpreters::person}。这份联系为{pos1}权威增添了超越纯粹政治的性质。{@bt_entity|::subscribed_books::interpreters::entity}的人民觉得，{@bt_hero2|::subscribed_books::interpreters::person}的任命不只是{appointer_title}的意愿，而是某种天命。"
"The path to the command had not been straightforward. {@bt_hero|::subscribed_books::interpreters::person} had spent years studying the art of war from the margins -- attending strategy meetings uninvited, mapping the weaknesses in {@bt_site|::subscribed_books::interpreters::place}'s defenses, drilling informally with the younger soldiers. When the previous {role} stepped down, {@bt_hero2|::subscribed_books::interpreters::person} was the only candidate who had already been doing the work." = "走向指挥权的道路并不平坦。{@bt_hero|::subscribed_books::interpreters::person}多年从边缘研习兵法，不请自来地参加战略会议，标出{@bt_site|::subscribed_books::interpreters::place}防御中的弱点，与年轻士兵私下操练。上一任{role}退下时，{@bt_hero2|::subscribed_books::interpreters::person}是唯一早已在做这份工作的候选者。"
"What qualified {@bt_hero|::subscribed_books::interpreters::person} for the command was not combat prowess -- though {pro1} was competent enough with a weapon. It was vision. While others saw {@bt_site|::subscribed_books::interpreters::place}'s militia as a reactive force, {@bt_hero2|::subscribed_books::interpreters::person} saw what it could become: organized, disciplined, and prepared for threats before they materialized. The {appointer_title} recognized that this was exactly what {@bt_entity|::subscribed_books::interpreters::entity} needed." = "让{@bt_hero|::subscribed_books::interpreters::person}有资格指挥的，不是武艺，尽管{pro1}使用武器已足够熟练，而是远见。旁人把{@bt_site|::subscribed_books::interpreters::place}民兵视作被动反应的力量，{@bt_hero2|::subscribed_books::interpreters::person}却看见了他们可能成为的模样：有组织、有纪律，在威胁出现之前便作好准备。{appointer_title}认识到，这正是{@bt_entity|::subscribed_books::interpreters::entity}所需。"
"{@bt_hero|::subscribed_books::interpreters::person} had been making a case for the position for years -- not through words, but through actions. {pro1} reorganized the supply stores. {::subscribed_books::interpreters_political::ref_repeat_1} mapped the patrol routes and found the gaps. {::subscribed_books::interpreters_political::ref_repeat_2} trained the recruits that no one else wanted to bother with. By the time the appointment came, it was less a promotion than a recognition of what already was." = "{@bt_hero|::subscribed_books::interpreters::person}多年为这个职位证明自己，不凭话语，而凭行动。{pro1}重整补给仓库，规划巡逻路线并找出空隙，训练旁人不愿费心照顾的新兵。任命到来时，与其说是晋升，不如说是对已有事实的承认。"
"{@bt_hero|::subscribed_books::interpreters::person} had built {pos1} power base quietly, forging alliances with the craftspeople and traders who formed the backbone of {@bt_entity|::subscribed_books::interpreters::entity}. When the time came, the support was already there -- not because {@bt_hero2|::subscribed_books::interpreters::person} had demanded it, but because {pro1} had earned it." = "{@bt_hero|::subscribed_books::interpreters::person}悄悄建立{pos1}权力基础，与构成{@bt_entity|::subscribed_books::interpreters::entity}骨干的工匠和商人结盟。时候到来，支持早已存在，不是因为{@bt_hero2|::subscribed_books::interpreters::person}索取过，而是因为{pro1}挣得了它。"
