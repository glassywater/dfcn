"\"I don't need a answer right now,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I just needed you to know how I feel.\"" = "“我现在不需要答复，”{@bt_a|::subscribed_books::vocabulary::person}说，“只是需要你知道我的感受。”"

