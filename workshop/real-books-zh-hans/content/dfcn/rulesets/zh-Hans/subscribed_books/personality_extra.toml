# fiction_personality.lua：作者改写、克制冲突、目击者、关系线、转折与尾声。
base = "subscribed_books::personality_extra"

[[rulesets]]
[rulesets.rules]
# 原有人物反应中的宾格槽与当前作者句式。
"{@bt_a|::subscribed_books::vocabulary::person} stood so abruptly that the bench toppled behind {obj1}." = "{@bt_a|::subscribed_books::vocabulary::person} 猛然起身，{obj1}身后的长凳随之翻倒。"
"{@bt_a|::subscribed_books::vocabulary::person} allowed a small smile. High praise, from {obj1}." = "{@bt_a|::subscribed_books::vocabulary::person} 露出一丝微笑。对{obj1}来说，这已是极高的赞许。"
"\"Amusing,\" {@bt_a|::subscribed_books::vocabulary::person} said. And from {obj1}, that was practically a standing ovation." = "“有趣，”{@bt_a|::subscribed_books::vocabulary::person} 说道。从{obj1}嘴里说出来，这几乎等同于起立喝彩。"
# phlegmatic：去重保留带引号的对白，却可删掉随后的叙述句；匹配完整对白句，不拆引号内的话。
"\"Amusing,\" {@bt_a|::subscribed_books::vocabulary::person} said." = "“有趣，”{@bt_a|::subscribed_books::vocabulary::person} 说道。"
"And from {obj1}, that was practically a standing ovation." = "从{obj1}嘴里说出来，这几乎等同于起立喝彩。"
"{@bt_a|::subscribed_books::vocabulary::person} allowed a small smile." = "{@bt_a|::subscribed_books::vocabulary::person} 露出一丝微笑。"
"High praise, from {obj1}." = "对{obj1}来说，这已是极高的赞许。"
"\"I am not going anywhere,\" {@bt_a|::subscribed_books::vocabulary::person} said simply." = "“我不会去任何地方，”{@bt_a|::subscribed_books::vocabulary::person} 简单地说。"
"For {obj1}, that was a declaration of love." = "对{obj1}来说，这便是爱的宣言。"
"\"This ends now,\" {@bt_a|::subscribed_books::vocabulary::person} said. It was a statement of fact." = "“到此为止，”{@bt_a|::subscribed_books::vocabulary::person} 说道。这是在陈述事实。"
"The argument was about everything, whatever they thought it was about. It always was." = "无论他们以为自己在争什么，这场争论牵扯的都是一切。向来如此。"
"{@bt_a|::subscribed_books::vocabulary::person} saw through the manipulation instantly; {pro1} expected the worst from everyone." = "{@bt_a|::subscribed_books::vocabulary::person} 立刻看穿了这番操纵；{pro1}对每个人都作最坏的打算。"
"{@bt_a|::subscribed_books::vocabulary::person} nodded along to the argument against {obj1}, then said, calmly, that {pro1} still disagreed." = "{@bt_a|::subscribed_books::vocabulary::person} 听着针对{obj1}的论点，频频点头，随后平静地表示，{pro1}仍不同意。"
"{@bt_a|::subscribed_books::vocabulary::person} paused at exactly the right moment, letting the silence do the persuading for {obj1}." = "{@bt_a|::subscribed_books::vocabulary::person} 恰到好处地停顿，让沉默替{obj1}完成说服。"
"{@bt_a|::subscribed_books::vocabulary::person} chose the gift carefully, for what it would owe {pro1} later." = "{@bt_a|::subscribed_books::vocabulary::person} 精心挑选礼物，盘算着它日后能为{pro1}换来多少人情。"
"{@bt_a|::subscribed_books::vocabulary::person} timed the gift to land at the exact moment it would do the most good -- for {obj1}." = "{@bt_a|::subscribed_books::vocabulary::person} 算准时机，让礼物在最有利的那一刻送到——最有利于{obj1}的那一刻。"
"{@bt_a|::subscribed_books::vocabulary::person} met aggression with restraint; {pro1} had a code that mattered more than the fight." = "{@bt_a|::subscribed_books::vocabulary::person} 以克制回应挑衅；{pro1}有一套比眼前的争斗更重要的准则。"
"{@bt_a|::subscribed_books::vocabulary::person} held to the old rules of engagement even as everyone around {obj1} abandoned them." = "即使{obj1}身边所有人都抛弃了旧日的交战规矩，{@bt_a|::subscribed_books::vocabulary::person} 仍坚守着它们。"
"{@bt_a|::subscribed_books::vocabulary::person} fought with {pos1} back against something solid, because at least that way nothing could come at {obj1} from behind." = "{@bt_a|::subscribed_books::vocabulary::person} 战斗时让{pos1}后背紧靠着坚实的东西，因为至少这样，便不会有东西从背后袭击{obj1}。"
"{@bt_a|::subscribed_books::vocabulary::person} struck to wound, again and again, until wounding became its own kind of message." = "{@bt_a|::subscribed_books::vocabulary::person} 一次次出手，只为致伤，直到伤口本身成了一种宣告。"
"{@bt_a|::subscribed_books::vocabulary::person} could not keep the invented name straight, because some part of {obj1} kept refusing to use it." = "{@bt_a|::subscribed_books::vocabulary::person} 总是记不准那个编造的名字，因为{obj1}内心的某个角落始终不肯使用它。"
"{@bt_a|::subscribed_books::vocabulary::person} spoke with the calm of someone telling the truth, which was, for {obj1}, simply a matter of practice." = "{@bt_a|::subscribed_books::vocabulary::person} 说话时镇定得像在讲真话，而对{obj1}来说，这不过是熟能生巧。"
"{@bt_a|::subscribed_books::vocabulary::person} could not have said, afterward, exactly when the impersonation had started feeling easy. It had, for {obj1}, always been easy." = "事后，{@bt_a|::subscribed_books::vocabulary::person} 也说不清冒充别人究竟从何时起变得轻松。对{obj1}而言，这件事向来轻而易举。"
"{@bt_a|::subscribed_books::vocabulary::person} was gone by the time anyone realized the conflict had been arranged." = "等到有人意识到这场冲突早有安排时，{@bt_a|::subscribed_books::vocabulary::person} 已经不见了。"
"{@bt_a|::subscribed_books::vocabulary::person} planted the seed of doubt early and let the conflict undo itself without {obj1} lifting a finger." = "{@bt_a|::subscribed_books::vocabulary::person} 早早埋下怀疑的种子，让冲突自行瓦解，连{obj1}的一根手指都不用动。"
"{@bt_a|::subscribed_books::vocabulary::person} arranged for {@bt_b|::subscribed_books::vocabulary::person} to hand the item over willingly, which felt, to {obj1}, like the more elegant kind of theft." = "{@bt_a|::subscribed_books::vocabulary::person} 设法让 {@bt_b|::subscribed_books::vocabulary::person} 心甘情愿地交出东西。在{obj1}看来，这是一种更优雅的偷窃。"
"No matter how many times {@bt_a|::subscribed_books::vocabulary::person} was struck, {pro1} would not strike back. It was a line {pro2} would not cross." = "无论挨了多少下，{@bt_a|::subscribed_books::vocabulary::person} 都不肯还击。这是{pro1}坚守的底线，是{pro2}绝不肯越过的界限。"
"{@bt_a|::subscribed_books::vocabulary::person} threw {ref1} into the middle of it to end it before someone worse got hurt." = "{@bt_a|::subscribed_books::vocabulary::person} 让{ref1}冲进争斗中，只为在有人伤得更重之前结束它。"
"{@bt_a|::subscribed_books::vocabulary::person} took wound after wound without landing a single one in return. It was refusal." = "{@bt_a|::subscribed_books::vocabulary::person} 身上伤口不断增加，却没有还击造成哪怕一道伤口。这是在拒绝。"
"Every wound {@bt_a|::subscribed_books::vocabulary::person} inflicted was chosen for how long it would take to matter." = "{@bt_a|::subscribed_books::vocabulary::person} 造成每一道伤口时，都算好了它要过多久才会真正显出厉害。"
"{@bt_a|::subscribed_books::vocabulary::person} struck to wound, again and again, and enjoyed keeping them alive." = "{@bt_a|::subscribed_books::vocabulary::person} 一次次出手致伤，乐于让对手活着承受。"
"{@bt_a|::subscribed_books::vocabulary::person}'s face went red, then white, and the words that followed were meant to hurt." = "{@bt_a|::subscribed_books::vocabulary::person} 的脸先涨得通红，随即变得苍白，接下来的每句话都是有意伤人。"
"What mattered now was what {@bt_a|::subscribed_books::vocabulary::person} did next. The feeling could be dealt with later." = "眼下要紧的是 {@bt_a|::subscribed_books::vocabulary::person} 接下来怎么做。情绪可以留到以后再处理。"
"{@bt_a|::subscribed_books::vocabulary::person} took it as a challenge, and reacted like it." = "{@bt_a|::subscribed_books::vocabulary::person} 将此视为挑衅，也照受到挑衅的方式作了回应。"
"{@bt_a|::subscribed_books::vocabulary::person} answered the joke with a shove." = "{@bt_a|::subscribed_books::vocabulary::person} 推了对方一把，算是对笑话的回应。"
"{@bt_a|::subscribed_books::vocabulary::person} bent every rule and broke the ones that didn't bend. The outcome was what mattered." = "{@bt_a|::subscribed_books::vocabulary::person} 扭曲每一条规矩，扭不动的就干脆打破。要紧的只有结果。"
"Whatever the terms of the conflict were, {@bt_a|::subscribed_books::vocabulary::person} treated them as a starting point for negotiation." = "无论冲突双方定下了什么条件，{@bt_a|::subscribed_books::vocabulary::person} 都只把它们当作谈判的起点。"
"{@bt_a|::subscribed_books::vocabulary::person} did not avoid the confrontation. {pro1} walked into it. Some part of {obj1} needed it." = "{@bt_a|::subscribed_books::vocabulary::person} 没有躲开这场冲突。{pro1}主动迎了上去。{obj1}内心的某个角落需要它。"
"It hurt more than {@bt_a|::subscribed_books::vocabulary::person} expected, and some quiet part of {obj1} was grateful for that." = "这比 {@bt_a|::subscribed_books::vocabulary::person} 预想的更痛，而{obj1}内心某个沉默的角落，竟对此心怀感激。"
"{@bt_a|::subscribed_books::vocabulary::person} did not defend {ref1}. Some part of {obj1} thought {pro1} deserved every word of it." = "{@bt_a|::subscribed_books::vocabulary::person} 没有替{ref1}辩护。{obj1}内心的某个角落觉得，那些话的每一个字都是{pro1}应得的。"

# 冲突没有升级为战斗时的四种性情反应。
"{@bt_a|::subscribed_books::vocabulary::person}'s hand went to {pos1} weapon -- and stayed there, white-knuckled." = "{@bt_a|::subscribed_books::vocabulary::person} 的手伸向{pos1}武器——随后停在那里，攥得指节发白。"
"{@bt_a|::subscribed_books::vocabulary::person} took one step toward {@bt_b|::subscribed_books::vocabulary::person} and stopped, fists clenched, breathing hard." = "{@bt_a|::subscribed_books::vocabulary::person} 朝 {@bt_b|::subscribed_books::vocabulary::person} 迈了一步便停住，双拳紧握，呼吸粗重。"
"{@bt_a|::subscribed_books::vocabulary::person} kicked the bench aside instead of {@bt_b|::subscribed_books::vocabulary::person}." = "{@bt_a|::subscribed_books::vocabulary::person} 一脚踢开了长凳，没把这一脚踢在 {@bt_b|::subscribed_books::vocabulary::person} 身上。"
"{@bt_a|::subscribed_books::vocabulary::person} drove a fist into the wall, a hand's width from {@bt_b|::subscribed_books::vocabulary::person}'s head." = "{@bt_a|::subscribed_books::vocabulary::person} 一拳砸在墙上，离 {@bt_b|::subscribed_books::vocabulary::person} 的脑袋只有一掌之隔。"
"{@bt_a|::subscribed_books::vocabulary::person} turned away so sharply that the people nearest flinched, and stood with {pos1} back to {@bt_b|::subscribed_books::vocabulary::person}, shaking." = "{@bt_a|::subscribed_books::vocabulary::person} 猛地转身，惊得身旁的人向后一缩，随后让{pos1}后背对着 {@bt_b|::subscribed_books::vocabulary::person}，站在那里浑身发抖。"
"\"Not here,\" {@bt_a|::subscribed_books::vocabulary::person} said through {pos1} teeth. \"Not now.\"" = "“不能在这里，”{@bt_a|::subscribed_books::vocabulary::person} 从{pos1}紧咬的牙缝里挤出话来，“也不能是现在。”"
"\"Get out of my sight,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"before I forget myself.\"" = "“从我眼前消失，”{@bt_a|::subscribed_books::vocabulary::person} 说，“趁我还没失去理智。”"
"\"You are lucky,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"that there are witnesses.\"" = "“算你走运，”{@bt_a|::subscribed_books::vocabulary::person} 说，“这里还有人看着。”"
"\"Say one more word,\" {@bt_a|::subscribed_books::vocabulary::person} said. Nobody said one." = "“你再说一个字试试，”{@bt_a|::subscribed_books::vocabulary::person} 说道。没有人再开口。"
"{@bt_a|::subscribed_books::vocabulary::person} gripped the edge of the table until {pos1} knuckles went white, and said nothing for a long moment." = "{@bt_a|::subscribed_books::vocabulary::person} 紧攥桌沿，直到{pos1}指节发白，久久一言不发。"
"{@bt_a|::subscribed_books::vocabulary::person} closed {pos1} eyes and counted, the way {pro1} had been taught as a child." = "{@bt_a|::subscribed_books::vocabulary::person} 闭上{pos1}眼睛，默默数数，就像{pro1}小时候受过的教导那样。"
"{@bt_a|::subscribed_books::vocabulary::person} walked to the door, stopped there, and did not come back." = "{@bt_a|::subscribed_books::vocabulary::person} 走到门口，停在那里，没有再走回来。"
"\"I will not give you the satisfaction,\" {@bt_a|::subscribed_books::vocabulary::person} said quietly." = "“我不会让你称心如意，”{@bt_a|::subscribed_books::vocabulary::person} 低声说道。"
"\"Another day,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I will remember this.\"" = "“改日再说，”{@bt_a|::subscribed_books::vocabulary::person} 说，“这笔账我会记着。”"
"\"You are not worth what it would cost me,\" {@bt_a|::subscribed_books::vocabulary::person} said." = "“为你付出那样的代价，不值得，”{@bt_a|::subscribed_books::vocabulary::person} 说道。"
"{@bt_a|::subscribed_books::vocabulary::person} squared up to {@bt_b|::subscribed_books::vocabulary::person} -- then laughed, a short ugly sound, and let it go." = "{@bt_a|::subscribed_books::vocabulary::person} 朝 {@bt_b|::subscribed_books::vocabulary::person} 摆开架势——随后却发出一声短促而难听的笑，就此作罢。"
"{@bt_a|::subscribed_books::vocabulary::person} raised a hand, thought better of it, and used it to wave the whole business away." = "{@bt_a|::subscribed_books::vocabulary::person} 抬起一只手，又改变了主意，只挥了挥手，将整件事揭了过去。"
"{@bt_a|::subscribed_books::vocabulary::person} shoved past {@bt_b|::subscribed_books::vocabulary::person} and out into the air before anything worse could happen." = "趁事情尚未变得更糟，{@bt_a|::subscribed_books::vocabulary::person} 推开 {@bt_b|::subscribed_books::vocabulary::person}，径直走到外面。"
"\"You are not worth the bruises,\" {@bt_a|::subscribed_books::vocabulary::person} said." = "“为你挨一身淤青，不值得，”{@bt_a|::subscribed_books::vocabulary::person} 说道。"
"\"Some other time,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"when I care more.\"" = "“改天吧，”{@bt_a|::subscribed_books::vocabulary::person} 说，“等我更把这当回事的时候。”"
"\"I would win,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"And then I would have to explain it.\"" = "“我会赢，”{@bt_a|::subscribed_books::vocabulary::person} 说，“然后还得费心解释。”"
"{@bt_a|::subscribed_books::vocabulary::person} looked at {@bt_b|::subscribed_books::vocabulary::person} for a long, cold moment, and then looked away." = "{@bt_a|::subscribed_books::vocabulary::person} 冷冷地看了 {@bt_b|::subscribed_books::vocabulary::person} 许久，随后移开视线。"
"{@bt_a|::subscribed_books::vocabulary::person} folded {pos1} arms and simply waited until the heat had gone out of the room." = "{@bt_a|::subscribed_books::vocabulary::person} 抱起{pos1}双臂，只管等着屋里的火气渐渐消散。"
"{@bt_a|::subscribed_books::vocabulary::person} set down what {pro1} was holding, very carefully, and stepped back." = "{@bt_a|::subscribed_books::vocabulary::person} 极其小心地放下{pro1}手中的东西，往后退了一步。"
"\"No,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"Not like this.\"" = "“不，”{@bt_a|::subscribed_books::vocabulary::person} 说，“不能这样。”"
"\"We are done here,\" {@bt_a|::subscribed_books::vocabulary::person} said." = "“到此为止，”{@bt_a|::subscribed_books::vocabulary::person} 说道。"
"\"If it comes to that, it will not be today,\" {@bt_a|::subscribed_books::vocabulary::person} said." = "“就算终究得走到那一步，也不会是今天，”{@bt_a|::subscribed_books::vocabulary::person} 说道。"

# 人物关系背景、争执与背叛的作者改写。
"{@bt_b|::subscribed_books::vocabulary::person} had murdered someone {@bt_a|::subscribed_books::vocabulary::person} loved. It was done deliberately, coldly, and without remorse. The kind of killing that demands an answer." = "{@bt_b|::subscribed_books::vocabulary::person} 杀害了 {@bt_a|::subscribed_books::vocabulary::person} 所爱之人。这是一场蓄意、冷酷、毫无悔意的谋杀。这样的杀戮，必须有人偿还。"
"{@bt_b|::subscribed_books::vocabulary::person} had stolen {@bt_a|::subscribed_books::vocabulary::person}'s most prized possession -- to prove that {@bt_a2|::subscribed_books::vocabulary::person}'s life could be violated, that nothing {@bt_a3|::subscribed_books::vocabulary::person} owned was truly safe. The theft was a message, and {@bt_a4|::subscribed_books::vocabulary::person} had received it." = "{@bt_b|::subscribed_books::vocabulary::person} 偷走了 {@bt_a|::subscribed_books::vocabulary::person} 最珍视的财物——为的是证明，{@bt_a2|::subscribed_books::vocabulary::person} 的生活随时可以遭到侵犯，{@bt_a3|::subscribed_books::vocabulary::person} 拥有的一切都算不上真正安全。这场偷窃是在传递警告，而 {@bt_a4|::subscribed_books::vocabulary::person} 已经收到了。"
"{@bt_a|::subscribed_books::vocabulary::person} believed in the old ways -- the traditions, the rituals, the gods of {pos1} ancestors. {@bt_b|::subscribed_books::vocabulary::person} represented everything that threatened to tear those traditions apart. The enmity between them was civilizational." = "{@bt_a|::subscribed_books::vocabulary::person} 信奉旧道——传统、仪式，以及{pos1}祖先的诸神。{@bt_b|::subscribed_books::vocabulary::person} 则代表着一切足以撕碎这些传统的威胁。两人之间的敌意，是文明之间的冲突。"
"They had met during a battle. {@bt_a|::subscribed_books::vocabulary::person} had dragged {@bt_b|::subscribed_books::vocabulary::person} out of the fighting, and in the chaos of blood and screaming, something impossible had happened: they had looked at each other and seen a person. The world had narrowed to a single point of recognition." = "他们相识于一场战斗。{@bt_a|::subscribed_books::vocabulary::person} 将 {@bt_b|::subscribed_books::vocabulary::person} 拖出战场，而在鲜血与尖叫的混乱中，不可思议的事发生了：他们彼此凝望，看见了一个活生生的人。整个世界收束成了彼此相认的那一点。"
"{@bt_b|::subscribed_books::vocabulary::person} had asked {@bt_a|::subscribed_books::vocabulary::person} to retrieve something precious -- a family heirloom lost in dangerous territory. {@bt_a2|::subscribed_books::vocabulary::person} had gone because {@bt_b2|::subscribed_books::vocabulary::person} had asked. When {@bt_a3|::subscribed_books::vocabulary::person} returned, battered and exhausted, carrying the prize, {@bt_b3|::subscribed_books::vocabulary::person} looked at {@bt_a4|::subscribed_books::vocabulary::person} as if seeing {obj1} for the first time." = "{@bt_b|::subscribed_books::vocabulary::person} 曾请 {@bt_a|::subscribed_books::vocabulary::person} 寻回一件珍贵之物——遗落在险地的传家宝。只因 {@bt_b2|::subscribed_books::vocabulary::person} 开了口，{@bt_a2|::subscribed_books::vocabulary::person} 便去了。当 {@bt_a3|::subscribed_books::vocabulary::person} 带着宝物归来，伤痕累累、筋疲力尽时，{@bt_b3|::subscribed_books::vocabulary::person} 注视着 {@bt_a4|::subscribed_books::vocabulary::person}，仿佛第一次真正看见{obj1}。"
"{@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} had fought together, bled together, and buried friends together. The bond between them was forged in survival." = "{@bt_a|::subscribed_books::vocabulary::person} 与 {@bt_b|::subscribed_books::vocabulary::person} 曾并肩作战，一同流血，一同埋葬朋友。他们之间的纽带，是在生死患难中铸就的。"
"\"You see conspiracy where there is only compromise,\" {@bt_b|::subscribed_books::vocabulary::person} said. \"Governing means giving no one everything.\"" = "“只是妥协，你却看出了阴谋，”{@bt_b|::subscribed_books::vocabulary::person} 说，“治理意味着，谁也不可能事事如愿。”"
"{@bt_b|::subscribed_books::vocabulary::person} had poisoned the water supply -- slowly, carefully, over months. Enough to sicken, too little to kill outright. Enough to weaken. When {@bt_a|::subscribed_books::vocabulary::person} traced the illness back to its source, the trail led directly to {@bt_b2|::subscribed_books::vocabulary::person}." = "{@bt_b|::subscribed_books::vocabulary::person} 在水源中下了毒——历时数月，缓慢而谨慎。剂量足以致病，却不足以直接致死。足以让人衰弱。当 {@bt_a|::subscribed_books::vocabulary::person} 追查病因时，线索径直指向了 {@bt_b2|::subscribed_books::vocabulary::person}。"
"{@bt_b|::subscribed_books::vocabulary::person} confessed directly, out of pride. \"Yes,\" {@bt_b2|::subscribed_books::vocabulary::person} said, smiling. \"I did it. You were so trusting. It was almost too easy.\"" = "出于自负，{@bt_b|::subscribed_books::vocabulary::person} 直接承认了。“没错，”{@bt_b2|::subscribed_books::vocabulary::person} 微笑着说，“是我干的。你太轻信别人了。简直容易得不像话。”"
"{@bt_a|::subscribed_books::vocabulary::person} had drawn a line. {@bt_b|::subscribed_books::vocabulary::person} had crossed it. The words that followed were the kind that cannot be taken back." = "{@bt_a|::subscribed_books::vocabulary::person} 划下了底线。{@bt_b|::subscribed_books::vocabulary::person} 越过了它。接下来说出的那些话，再也无法收回。"
"It was a matter of faith. {@bt_b|::subscribed_books::vocabulary::person} had desecrated something sacred to {@bt_a|::subscribed_books::vocabulary::person} -- whether out of ignorance or contempt, the result was the same. {@bt_a2|::subscribed_books::vocabulary::person} could not let it pass." = "这关乎信仰。{@bt_b|::subscribed_books::vocabulary::person} 亵渎了 {@bt_a|::subscribed_books::vocabulary::person} 心中的神圣之物——无论出于无知还是蔑视，结果并无不同。{@bt_a2|::subscribed_books::vocabulary::person} 不能就此放过。"
"The argument had revealed something that could not be taken back. A truth about {@bt_b|::subscribed_books::vocabulary::person}'s character that {@bt_a|::subscribed_books::vocabulary::person} could not live with." = "这场争论揭露了某种无法再掩回去的东西。那是关于 {@bt_b|::subscribed_books::vocabulary::person} 本性的真相，是 {@bt_a|::subscribed_books::vocabulary::person} 无法容忍的真相。"

# 赠礼的当前完整段落。
"{@bt_a|::subscribed_books::vocabulary::person} held out {::subscribed_books::world::item}. \"This belonged to my {::subscribed_books::world::relation},\" {@bt_a2|::subscribed_books::vocabulary::person} said quietly. \"{pro1} carried it for years. I want you to have it, because I value it.\"" = "{@bt_a|::subscribed_books::vocabulary::person} 递出{::subscribed_books::world::item}。“这是我的{::subscribed_books::world::relation}留下的，”{@bt_a2|::subscribed_books::vocabulary::person} 轻声说，“{pro1}带了它很多年。正因为我珍惜它，才想把它送给你。”"
"{@bt_a|::subscribed_books::vocabulary::person} presented a blade, plain and perfectly balanced. \"I had this made by the best smith in {@bt_profession|::subscribed_books::world::profession},\" {@bt_a2|::subscribed_books::vocabulary::person} said. \"For someone who understands what a weapon should be.\"" = "{@bt_a|::subscribed_books::vocabulary::person} 送来一把剑，朴实无华，配重完美。“我请{@bt_profession|::subscribed_books::world::profession}中最好的铁匠打造了它，”{@bt_a2|::subscribed_books::vocabulary::person} 说道，“送给懂得武器该是什么样子的人。”"

# 险些动手后的叙述。
"It came close to blows. It did not quite come to them." = "他们差一点就动起手来。终究还是没有。"
"For a moment it looked as though it would come to violence. Then the moment passed." = "有那么一刻，眼看就要诉诸暴力。随后，那一刻过去了。"
"Someone would have struck someone, in another hour. Instead they stood there breathing hard until it passed." = "若换个时候，定会有人动手打人。这一次，他们只是站在那里粗重地喘息，直到怒气过去。"
"Nobody moved. Then, slowly, everybody breathed again." = "没有人动。随后，大家缓缓地重新呼吸起来。"
"The silence that followed was worse than a blow would have been, and it lasted longer." = "随之而来的沉默，比挨上一拳更难受，也持续得更久。"
"Whatever would have happened next did not happen. It was a near thing." = "接下来本可能发生的一切，终究没有发生。只差那么一点。"

[[rulesets]]
[rulesets.rules]
# relationship_reasons：句子去重后留下的关系背景完整句，原整段规则仍保留。
# 敌对关系。
"They had been rivals since childhood, competing for the same recognition, the same positions, the same approval." = "他们从小便是对手，争夺同样的认可、职位与赞许。"
"What had started as rivalry had curdled into something darker." = "起初的竞争，后来酿成了更阴暗的东西。"
"{@bt_b|::subscribed_books::vocabulary::person} had taken something from {@bt_a|::subscribed_books::vocabulary::person} years ago." = "多年前，{@bt_b|::subscribed_books::vocabulary::person} 从 {@bt_a|::subscribed_books::vocabulary::person} 那里夺走了一样东西。"
"Not an object -- something less tangible." = "那不是物品，而是更难以触摸之物。"
"A reputation." = "声誉。"
"A chance." = "机会。"
"A future that {@bt_a|::subscribed_books::vocabulary::person} had earned and {@bt_b|::subscribed_books::vocabulary::person} had stolen." = "一个 {@bt_a|::subscribed_books::vocabulary::person} 本已争取到、却被 {@bt_b|::subscribed_books::vocabulary::person} 偷走的未来。"
"They had been friends once." = "他们曾是朋友。"
"The betrayal that ended the friendship was so complete that neither could remember the friendship without pain." = "结束友谊的背叛如此彻底，以至于任何一方回想起那段友情，都只剩痛楚。"
"{@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} stood on opposite sides of a dispute that had divided {@bt_site|::subscribed_books::personality::site} for years." = "一场争端使 {@bt_site|::subscribed_books::personality::site} 多年分裂，{@bt_a|::subscribed_books::vocabulary::person} 与 {@bt_b|::subscribed_books::vocabulary::person} 各站一方。"
"Neither was entirely wrong." = "双方都并非全错。"
"Neither would admit it." = "却都不肯承认这一点。"
"{@bt_b|::subscribed_books::vocabulary::person} had murdered someone {@bt_a|::subscribed_books::vocabulary::person} loved." = "{@bt_b|::subscribed_books::vocabulary::person} 杀害了 {@bt_a|::subscribed_books::vocabulary::person} 所爱之人。"
"It was done deliberately, coldly, and without remorse." = "这是一场蓄意、冷酷、毫无悔意的谋杀。"
"The kind of killing that demands an answer." = "这样的杀戮，必须有人偿还。"
"It was a matter of faith." = "这是信仰之争。"
"{@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} worshipped different gods, and in {@bt_site|::subscribed_books::personality::site}, that difference had become a wall that neither could see past." = "{@bt_a|::subscribed_books::vocabulary::person} 与 {@bt_b|::subscribed_books::vocabulary::person} 敬奉不同的神，在 {@bt_site|::subscribed_books::personality::site}，这种差异已筑成一道双方都无法越过的墙。"
"What began as theological disagreement had hardened into hatred." = "起初关于教义的分歧，后来变成了根深蒂固的仇恨。"
"{@bt_b|::subscribed_books::vocabulary::person} had stolen {@bt_a|::subscribed_books::vocabulary::person}'s most prized possession -- to prove that {@bt_a2|::subscribed_books::vocabulary::person}'s life could be violated, that nothing {@bt_a3|::subscribed_books::vocabulary::person} owned was truly safe." = "{@bt_b|::subscribed_books::vocabulary::person} 偷走了 {@bt_a|::subscribed_books::vocabulary::person} 最珍视的财物——为的是证明，{@bt_a2|::subscribed_books::vocabulary::person} 的生活随时可以遭到侵犯，{@bt_a3|::subscribed_books::vocabulary::person} 拥有的一切都算不上真正安全。"
"The theft was a message, and {@bt_a|::subscribed_books::vocabulary::person} had received it." = "这场偷窃是在传递警告，而 {@bt_a|::subscribed_books::vocabulary::person} 已经收到了。"
"They had once been lovers." = "他们曾经相爱。"
"The relationship had ended badly -- with accusations, betrayals, and the kind of intimate cruelty that only someone who knows you well can inflict." = "那段关系以惨烈的方式结束：指责、背叛，以及只有深知你的人才能施加的贴身残酷。"
"{@bt_b|::subscribed_books::vocabulary::person} was a {::subscribed_books::personality::race}." = "{@bt_b|::subscribed_books::vocabulary::person} 是{::subscribed_books::personality::race}。"
"For {@bt_a|::subscribed_books::vocabulary::person}, that was reason enough." = "对 {@bt_a|::subscribed_books::vocabulary::person} 而言，这就足够了。"
"The prejudice ran deep, inherited from parents who had inherited it from theirs, all the way back to a wrong so old that no one alive could name it." = "偏见根深蒂固，由父母传下，又由父母的父母传下，追溯至一桩古老到世间已无人能说清的旧怨。"
"{@bt_a|::subscribed_books::vocabulary::person} believed in the old ways -- the traditions, the rituals, the gods of {pos1} ancestors." = "{@bt_a|::subscribed_books::vocabulary::person} 信奉旧道——传统、仪式，以及{pos1}祖先的诸神。"
"{@bt_b|::subscribed_books::vocabulary::person} represented everything that threatened to tear those traditions apart." = "{@bt_b|::subscribed_books::vocabulary::person} 则代表着一切足以撕碎这些传统的威胁。"
"The enmity between them was civilizational." = "两人之间的敌意，是文明之间的冲突。"

# 相识与相恋。
"{@bt_a|::subscribed_books::vocabulary::person} had first noticed {@bt_b|::subscribed_books::vocabulary::person} at a gathering, across a crowded hall." = "在一次聚会中，{@bt_a|::subscribed_books::vocabulary::person} 隔着拥挤的大厅第一次注意到 {@bt_b|::subscribed_books::vocabulary::person}。"
"{@bt_b|::subscribed_books::vocabulary::person} had been laughing at something someone said, and the sound had cut through every other noise in the room." = "{@bt_b|::subscribed_books::vocabulary::person} 正被某人的话逗笑，那笑声穿透了屋内的一切喧嚣。"
"They had met by accident -- a wrong turn, a shared shelter from rain, a conversation that lasted longer than either had planned." = "他们偶然相遇：一次走错路，一同避雨，一场比双方预想都更长的谈话。"
"By the time they parted, something had changed." = "等到分别时，某种东西已经改变。"
"{@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} had grown up in the same settlement, knowing each other the way neighbors do -- casually, incompletely." = "{@bt_a|::subscribed_books::vocabulary::person} 与 {@bt_b|::subscribed_books::vocabulary::person} 在同一个聚落长大，像邻居那样相识：熟悉，却又所知有限。"
"It took years for either of them to see the other clearly." = "多年之后，双方才真正看清彼此。"
"They had met during a battle." = "他们相识于一场战斗。"
"{@bt_a|::subscribed_books::vocabulary::person} had dragged {@bt_b|::subscribed_books::vocabulary::person} out of the fighting, and in the chaos of blood and screaming, something impossible had happened: they had looked at each other and seen a person." = "{@bt_a|::subscribed_books::vocabulary::person} 将 {@bt_b|::subscribed_books::vocabulary::person} 拖出战场，而在鲜血与尖叫的混乱中，不可思议的事发生了：他们彼此凝望，看见了一个活生生的人。"
"The world had narrowed to a single point of recognition." = "整个世界收束成了彼此相认的那一点。"
"{@bt_b|::subscribed_books::vocabulary::person} had asked {@bt_a|::subscribed_books::vocabulary::person} to retrieve something precious -- a family heirloom lost in dangerous territory." = "{@bt_b|::subscribed_books::vocabulary::person} 曾请 {@bt_a|::subscribed_books::vocabulary::person} 寻回一件珍贵之物——遗落在险地的传家宝。"
"{@bt_a|::subscribed_books::vocabulary::person} had gone because {@bt_b|::subscribed_books::vocabulary::person} had asked." = "只因 {@bt_b|::subscribed_books::vocabulary::person} 开了口，{@bt_a|::subscribed_books::vocabulary::person} 便去了。"
"When {@bt_a|::subscribed_books::vocabulary::person} returned, battered and exhausted, carrying the prize, {@bt_b|::subscribed_books::vocabulary::person} looked at {@bt_a2|::subscribed_books::vocabulary::person} as if seeing {obj1} for the first time." = "当 {@bt_a|::subscribed_books::vocabulary::person} 带着宝物归来，伤痕累累、筋疲力尽时，{@bt_b|::subscribed_books::vocabulary::person} 注视着 {@bt_a2|::subscribed_books::vocabulary::person}，仿佛第一次真正看见{obj1}。"
"It began with letters." = "一切始于书信。"
"{@bt_a|::subscribed_books::vocabulary::person} had written first -- a formal note about a trade matter." = "{@bt_a|::subscribed_books::vocabulary::person} 先写了一封讨论贸易的正式短函。"
"{@bt_b|::subscribed_books::vocabulary::person}'s reply had been unexpectedly warm, and personal, and funny." = "{@bt_b|::subscribed_books::vocabulary::person} 的回复却出乎意料地温暖、亲切而风趣。"
"The letters continued, growing longer and more intimate, until the day they finally met in person and discovered that the connection was even stronger face to face." = "书信往来延续下去，越写越长，也越来越亲密，直到他们终于见面，才发现面对面时的联系更为深厚。"

# 师徒、同行者与竞争者。
"{@bt_b|::subscribed_books::vocabulary::person} had sought out {@bt_a|::subscribed_books::vocabulary::person} after hearing stories of the elder's wisdom." = "{@bt_b|::subscribed_books::vocabulary::person} 听闻长者的智慧后，前去寻找 {@bt_a|::subscribed_books::vocabulary::person}。"
"The apprenticeship was not offered easily -- {@bt_a|::subscribed_books::vocabulary::person} had refused three times before finally agreeing." = "拜师并不容易，{@bt_a|::subscribed_books::vocabulary::person} 拒绝三次之后才终于答应。"
"They had traveled together out of necessity at first -- the roads were dangerous, and two were safer than one." = "起初他们一同旅行只是出于必要：道路危险，两个人比一个人更安全。"
"The friendship came later, slowly, built on shared hardship." = "后来，在共同的艰难中，友谊慢慢生长。"
"{@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} had fought together, bled together, and buried friends together." = "{@bt_a|::subscribed_books::vocabulary::person} 与 {@bt_b|::subscribed_books::vocabulary::person} 曾并肩作战，一同流血，一同埋葬朋友。"
"The bond between them was forged in survival." = "他们之间的纽带，是在生死患难中铸就的。"
"{@bt_b|::subscribed_books::vocabulary::person} wanted exactly what {@bt_a|::subscribed_books::vocabulary::person} wanted." = "{@bt_b|::subscribed_books::vocabulary::person} 想要的，正是 {@bt_a|::subscribed_books::vocabulary::person} 想要的。"
"The same position, the same recognition, the same place in the story." = "同样的职位，同样的认可，以及故事中同样的位置。"
"There was only room for one." = "而那里只能容下一人。"
"The rivalry between {@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} was the kind that sharpened both of them." = "{@bt_a|::subscribed_books::vocabulary::person} 与 {@bt_b|::subscribed_books::vocabulary::person} 的竞争磨砺着双方。"
"Neither would have achieved what they did without the other to measure against." = "若没有对方作为衡量的标尺，任何一方都不会取得如今的成就。"
"They were both in love with the same person." = "他们爱上了同一个人。"
"Neither would yield." = "谁也不肯退让。"
"The competition between them was not about winning -- it was about proving that the other was unworthy." = "这场竞争不是为了获胜，而是为了证明对方不配。"

