"\"You know what your problem is?\" {@bt_a|::subscribed_books::vocabulary::person} said, with a smile that did not belong on a face. \"You think people care about you.\"" = "“知道你的问题在哪吗？”{@bt_a|::subscribed_books::vocabulary::person}带着不该出现在人脸上的笑容说，“你以为有人在乎你。”"
"\"Go ahead and cry,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"It won't change anything, but I'll enjoy watching it.\"" = "“尽管哭吧，”{@bt_a|::subscribed_books::vocabulary::person}说道，“改变不了什么，可我看得会很开心。”"
"\"I'm not angry,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I'm just enjoying this a great deal more than you are.\"" = "“我没生气，”{@bt_a|::subscribed_books::vocabulary::person}说道，“我只是比你享受得多。”"
"\"Say that again,\" {@bt_a|::subscribed_books::vocabulary::person} said softly. \"I want to remember exactly how pathetic it sounded.\"" = "“再说一遍，”{@bt_a|::subscribed_books::vocabulary::person}轻声道，“我要准确记住，它听起来有多可悲。”"
