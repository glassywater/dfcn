"A explorer's atlas of the lands around {@bt_site|::subscribed_books::vocabulary::place}. Compiled from direct observation by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}." = "一部关于{@bt_site|::subscribed_books::vocabulary::place}周围土地的探险者地图集。由{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}根据直接观察编写。"
"The {::subscribed_books::adj} landscape around {@bt_site|::subscribed_books::vocabulary::place} had never been properly documented. I, {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, resolved to correct this. What follows is a atlas born of boots on the ground and eyes wide open." = "{@bt_site|::subscribed_books::vocabulary::place}周围{::subscribed_books::adj}的地貌，从未被妥善记录。我，{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}，决心纠正这一点。以下这部地图集，诞生于脚踏实地、睁眼细看的探索。"
"Thinking of settling near {@bt_site|::subscribed_books::vocabulary::place}? Read this first. A atlas and practical guide for prospective settlers." = "打算在{@bt_site|::subscribed_books::vocabulary::place}附近定居？请先阅读本书。一部面向未来定居者的地图集与实用指南。"
"{::subscribed_books::templates_legacy::metaphor} So speaks the land around {@bt_site|::subscribed_books::vocabulary::place}. This atlas, by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, is a attempt to listen." = "{::subscribed_books::templates_legacy::metaphor}{@bt_site|::subscribed_books::vocabulary::place}周围的土地如此诉说。本地图集由{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}撰写，是一次倾听的尝试。"
