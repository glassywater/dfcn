# Dwarvemon 2.22 translation extension; merges into the base namespace.
base = "plants::name"

[[rulesets]]
name = "singular"
[rulesets.rules]
"{::plants::dwarvemon_optional}" = "{::plants::dwarvemon_optional}"
"{::plants::dwarvemon::name}" = "{::plants::dwarvemon::name}"

[[rulesets]]
name = "plural"
[rulesets.rules]
"{::plants::dwarvemon_optional}" = "{::plants::dwarvemon_optional}"
"{::plants::dwarvemon::name}" = "{::plants::dwarvemon::name}"

# Native grass slopes and stairs use RAW ADJ rather than NAME_PLURAL.
[[rulesets]]
name = "adjective"
[rulesets.rules]
"{::plants::dwarvemon_optional}" = "{::plants::dwarvemon_optional}"
"{::plants::dwarvemon::name}" = "{::plants::dwarvemon::name}"
