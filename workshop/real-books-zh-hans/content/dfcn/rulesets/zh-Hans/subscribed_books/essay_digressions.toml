"Among {@bt_civ|::subscribed_books::vocabulary::entity} we have a way of doing things, and it has served us longer than any of us has been alive." = "我们{@bt_civ|::subscribed_books::vocabulary::entity}有自己做事的方式，它沿用至今的年月，比我们任何人的年岁都长。"

"And people who do not know the first thing about being {trade_a} have opinions about it. They always do. I have stopped listening." = "那些对如何做{trade_a}一窍不通的人，也对此有一堆意见。他们向来如此。我已经不再听了。"
"And people who do not know the first thing about being {trade_a} have opinions about it." = "那些对如何做{trade_a}一窍不通的人，也对此有一堆意见。"
"They always do." = "他们向来如此。"
"I have stopped listening." = "我已经不再听了。"
"Have I said that I am {trade_a}? It is the kind of work that teaches you to notice small things, and once you have learned that, you cannot stop." = "我说过自己是{trade_a}吗？这份工作教会人留意细节，而一旦学会，就再也停不下来。"
