"Praise is the record's rarest note, and worth sounding when it can be." = "赞颂是史册中最罕见的音符，每逢有机会，便值得奏响。"
"It will be said that praise is easy and criticism hard." = "有人会说，赞扬容易，批评难。"
"Praise that is earned is not easy. It must first be seen." = "真正应得的赞扬并不容易。首先得有人看见那些值得赞扬之处。"
