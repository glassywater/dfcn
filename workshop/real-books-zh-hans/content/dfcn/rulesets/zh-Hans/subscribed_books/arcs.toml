# fiction_arcs.lua：气氛、剧情分镜、长段落、人物引介、伏笔回收与物品描写。
base = "subscribed_books::arcs"

[[rulesets]]
[rulesets.rules]
"The morning was bright, the air clean, and the road ahead clear." = "清晨明亮，空气清新，前方的道路一览无余。"
"Sunlight fell across the settlement, painting everything in gold." = "阳光洒遍聚落，将一切镀成金色。"
"Something good was coming. You could feel it in the air." = "好事将至。空气中就能感觉到。"
"The clouds had broken. Blue sky, for the first time in weeks." = "云层散开，几周来头一次露出蓝天。"
"Hope is a small thing. It is also, sometimes, enough." = "希望虽小，有时却已足够。"
"The path forward was uncertain, but it was, at least, a path." = "前路尚不明朗，但至少还有路可走。"
"Birdsong. The first in a long while." = "鸟鸣。许久未曾听到的鸟鸣。"
"Tomorrow looked, for once, like it might be kinder than today." = "这一回，明天似乎会比今天更温柔些。"
"There was light at the edge of things, faint but growing." = "万物边缘透出微光，淡淡的，却正在变亮。"
"A new season. New possibilities, however modest." = "新的季节。新的可能，哪怕并不起眼。"
"The seeds had been planted. Now there was only waiting, and faith." = "种子已经播下。现在只剩等待，以及信念。"
"Something had shifted, quietly, for the better." = "有什么悄悄变了，向着更好的方向。"
"The horizon looked wider than it had in years." = "地平线看上去比这些年来都更辽阔。"
"Small victories. They were, perhaps, the beginning of larger ones." = "小小的胜利。也许，这正是更大胜利的开端。"
"The worst had passed, or seemed to. Either way, it was a relief." = "最坏的时刻已过去，或看似过去了。无论如何，总算松了口气。"
"Green shoots pushed through what had, until recently, been ash." = "不久前还是灰烬的地方，冒出了绿色嫩芽。"
"Doors that had been closed were, unexpectedly, open again." = "曾紧闭的门，出乎意料地又打开了。"
"The future, glimpsed briefly, did not look so grim after all." = "短暂瞥见的未来，似乎也没有那么阴沉。"
"A fresh wind. A clear sky. A reason, however small, to smile." = "清新的风。澄澈的天空。一个微小却足以微笑的理由。"
"It was, against all odds, a good day." = "尽管种种迹象都不看好，这仍是美好的一天。"
"The air was heavy with unspoken words. Something was about to break." = "空气中满是未说出口的话。有什么就要崩裂了。"
"A silence had settled over the place -- the kind that precedes storms." = "寂静笼罩了这里，正如暴风雨来临之前。"
"No one spoke. No one dared to." = "没有人开口。也没有人敢开口。"
"Every eye in the room watched the door." = "屋里所有的目光都盯着门。"
"The quiet stretched too long to be comfortable." = "沉默拖得太久，令人不安。"
"Something was coming. No one could say what." = "有什么正在逼近。没人说得出是什么。"
"Hands hovered near weapons that, so far, had not been drawn." = "手停在武器旁，武器暂时还没有出鞘。"
"The conversation had stopped three sentences too early." = "对话早了三句话便戛然而止。"
"Waiting is its own kind of violence." = "等待本身也是一种暴力。"
"A held breath, and no one willing to let it out first." = "人人屏着呼吸，谁也不愿先吐出来。"
"The room felt smaller than it had a moment ago." = "房间似乎比片刻前更小了。"
"Words queued behind clenched jaws, unsaid." = "未说出口的话挤在咬紧的牙关后。"
"Something in the air had changed. No one could name it." = "空气中有什么变了。没人说得清。"
"The calm was thin. Beneath it, something strained." = "平静只有薄薄一层，下面有什么紧绷着。"
"Every sound seemed louder than it should have been." = "每个声音都比应有的更响。"
"A single wrong word, and the whole thing would come apart." = "只要说错一个词，一切就会分崩离析。"
"The pause had gone on long enough to mean something." = "停顿已经长得意味深长。"
"No one moved first. No one wanted to be the one who did." = "没人率先行动。没人愿意做第一个。"
"The stillness was not peace. It was restraint." = "这份静止不是和平，而是克制。"
"It could go either way. Everyone in the room knew it." = "结果可能倒向任一边。屋里每个人都明白。"
"The wind picked up, carrying with it the smell of change." = "风势渐强，带来了变化的气息。"
"The sky darkened, as if the world itself knew what was coming." = "天空阴沉下来，仿佛世界也知道什么即将到来。"
"Everything up to this point had been prelude." = "此前的一切都只是序幕。"
"The stage, such as it was, had been set." = "这座舞台，姑且称它为舞台，已经布置好了。"
"Thunder rolled somewhere distant, punctual as an omen." = "远处雷声滚动，如预兆般准时。"
"The moment announced itself before it arrived." = "那一刻尚未到来，就已宣告自己的存在。"
"History does not often give warning. This time, it did." = "历史很少预先警告。这一次却给了警告。"
"The old order was ending. Something new stood ready to take its place." = "旧秩序正走向终结。新的事物已准备取而代之。"
"A line had been drawn, and everyone knew it." = "界线已经划下，每个人都明白。"
"The weight of the moment pressed down like a held breath." = "这一刻的重量，如屏息般压在人们心头。"
"Nothing would be the same after this." = "此后再没有什么会和从前一样。"
"The world seemed to lean in, listening." = "世界仿佛俯身倾听。"
"It was the kind of day people would remember, one way or another." = "不论结果如何，这都是人们会记住的一天。"
"Fate, or something close enough to it, was in motion." = "命运，或者与它相差无几的东西，开始转动。"
"The air itself seemed to be counting down." = "就连空气都仿佛在倒数。"
"Every road had led, somehow, to this one." = "所有道路都以某种方式通向了这里。"
"The moment had a shape. It was about to reveal it." = "这一刻自有轮廓，就要显露出来。"
"Something large moved beneath the surface of events." = "巨大的事物在事件表面下涌动。"
"The music, if there had been any, would have swelled here." = "如果此处有音乐，它此时一定会高涨。"
"This was the turn. Everything after would be different." = "转折就在这里。此后的一切都会不同。"
"The light had gone out of the place. What remained was shadow and the smell of old stone." = "这里的光已经熄灭。只剩阴影和古老石头的气味。"
"Night had fallen early, or perhaps it had never truly left." = "夜幕提早降临，也可能从未真正离去。"
"Rot had settled into the walls, slow and patient." = "腐败缓慢而耐心地渗入墙壁。"
"Even the shadows seemed to lean away from what had happened here." = "连阴影都仿佛在躲避此地发生过的事。"
"Something had curdled in this place, long before tonight." = "很久以前，远在今夜之前，这里就有什么变质了。"
"The dark did not arrive. It had simply always been waiting." = "黑暗并非降临。它一直在此等候。"
"Cold stone. Colder air. A silence with weight to it." = "冰冷的石头。更冷的空气。沉甸甸的寂静。"
"Whatever had lived here once had long since died, or fled." = "曾在这里生活的一切，早已死去或逃离。"
"The dust on the floor had not been disturbed in years." = "地板上的灰尘多年无人扰动。"
"There was a smell that did not belong to anything living." = "这里有一种不属于任何活物的气味。"
"The walls held their secrets the way graves hold their dead." = "墙壁藏着秘密，正如坟墓藏着死者。"
"Nothing here had been touched by light in a long time." = "这里的一切已经很久未沐浴过光。"
"Decay had its own kind of quiet." = "腐朽自有一种寂静。"
"The place had the stillness of something already lost." = "这里静得像是早已失落的地方。"
"Even the echoes here sounded tired." = "就连回声都显得疲惫。"
"What light remained clung to the edges, unwilling to go further in." = "残存的光攀附在边缘，不肯再向深处走。"
"The air tasted of dust and old iron." = "空气尝起来带着尘土和旧铁的味道。"
"This was a place things came to end, not begin." = "事物来到这里是为了终结，而非开始。"
"Cracks ran through everything, old wounds never mended." = "裂缝遍布一切，如从未愈合的旧伤。"
"The dark here was not empty. It was full of something patient." = "这里的黑暗并不空洞，里面满是耐心等待的东西。"
"The fire crackled in the hearth, and for a moment, the world felt smaller and safer." = "炉火噼啪作响，有那么一刻，世界变得更小，也更安全了。"
"The room was warm, and the company was good, and for a while, nothing else mattered." = "房间暖和，同伴可亲。有一阵子，其余一切都不重要。"
"Laughter, low and easy, filled the corners of the room." = "低声而自在的笑声填满房间的角落。"
"There was enough food, enough warmth, enough of everyone who mattered." = "食物够吃，暖意充足，在意的人也都在。"
"The blankets were thick. The night, for once, did not feel cold." = "毯子很厚。这一夜终于不再寒冷。"
"Familiar voices. Familiar faces. Nothing more was needed." = "熟悉的声音。熟悉的面孔。无需更多。"
"Someone had left a lamp burning, just in case." = "有人留着一盏灯，以防万一。"
"The kettle sang softly on the fire." = "水壶在火上轻声歌唱。"
"It was the kind of evening that asked nothing of anyone." = "这样的夜晚，不向任何人索取什么。"
"Comfort, simple and unremarkable, filled the room like warmth from a stove." = "平凡朴素的舒适充满房间，如火炉散出的暖意。"
"No one was in a hurry to leave." = "没人急着离开。"
"The chairs had been pulled close together, without anyone deciding to do it." = "不知不觉间，椅子已经拉得很近。"
"Good company made the small room feel larger than it was." = "好伙伴让这间小屋显得更宽敞。"
"The bread was fresh, and someone had saved the best of it." = "面包新鲜，还有人把最好的部分留了下来。"
"A quiet kindness moved through the room, unspoken but felt." = "无声的善意在屋里流动，虽未说出口，却能感觉到。"
"Everyone here was safe, at least for tonight." = "这里的每个人都很安全，至少今夜如此。"
"The warmth came less from the fire than from who sat around it." = "暖意更多来自围坐的人，而非炉火。"
"Old stories were told again, and were somehow better for the repetition." = "旧故事又被讲起，反而因为重复而更动听了。"
"There was nowhere else anyone needed to be." = "没有人非去别处不可。"
"Home, in the end, was simply this: warmth, and company, and enough." = "说到底，家就是这样：温暖，有人作伴，一切足够。"
"This was the place. This was the moment. Everything had led here." = "就是这里。就是此刻。一切都通向了这里。"
"The ground itself seemed to tremble with anticipation." = "大地本身仿佛也因期待而颤抖。"
"Every choice, every delay, every quiet hour -- it all arrived at this." = "每个选择，每次拖延，每个安静的时辰，全都汇聚于此。"
"There would be no more waiting after this." = "此后再无需等待。"
"The moment had come, fully formed, impossible to postpone." = "那一刻已经完整到来，再无法推迟。"
"Everything else fell away. Only this remained." = "其余一切都退去，只剩下这一件事。"
"The air itself seemed to hold its breath." = "就连空气都仿佛屏住了呼吸。"
"Here. Now. There would be no better moment, and no worse one." = "此地。此刻。不会再有更好的时机，也不会再有更坏的。"
"Every thread of the story pulled taut at once." = "故事的每条线索同时绷紧了。"
"This was not a beginning, and not quite an ending. It was the hinge between them." = "这不是开始，也算不上结束，而是两者之间的枢纽。"
"The world narrowed to this single point." = "世界收缩为这唯一的一点。"
"It had all been building to exactly this." = "一切一直都在酝酿着这一刻。"
"There was no more room for hesitation." = "再没有犹豫的余地。"
"The moment demanded everything, and offered no second chances." = "这一刻索取全部，绝不给第二次机会。"
"Whatever came next would define everything that came before." = "接下来发生的事，将定义此前发生的一切。"
"The weight of the entire story pressed down on this one instant." = "整个故事的重量都压在这短短一瞬。"
"Everyone understood, without being told, that this was it." = "无须别人说明，每个人都知道，就是现在。"
"The wait was over. The moment had arrived, unmistakable." = "等待结束了。那一刻已经到来，毋庸置疑。"
"Nothing before this had mattered as much as what happened next." = "此前的一切，都不及接下来的事重要。"
"This was the crest. Whatever followed would be the fall, one way or another." = "这是最高点。此后，无论怎样，都将落下。"
"The crowd erupted. The impossible had been achieved." = "人群爆发出欢呼。不可能的事已经做到了。"
"Victory. The word tasted sweet, and for once, it was not premature." = "胜利。这个词甜美可口，这一次，终于说得不算太早。"
"They had done it. Against every reasonable expectation, they had done it." = "他们做到了。尽管所有合理的预期都不看好，他们还是做到了。"
"Cheers rose into the air like something set free." = "欢呼声冲向天空，仿佛获得了解放。"
"The impossible thing had happened, and everyone had seen it happen." = "不可能的事发生了，每个人都亲眼目睹。"
"There is no feeling quite like the one that follows a hard-won victory." = "没有什么感受，能与艰难取胜后的感觉相比。"
"It was over. They had won." = "一切结束了。他们赢了。"
"Fists raised. Voices raised. Nothing held back." = "拳头高举。声音高涨。再无保留。"
"Success, when it finally arrived, felt bigger than anyone had imagined." = "成功终于来临时，感觉比任何人想象的都更伟大。"
"The doubt that had haunted every step vanished in an instant." = "伴随每一步的疑虑在刹那间消散。"
"This was what all the effort had been for." = "所有努力，为的就是这一刻。"
"Every hardship suddenly seemed worth it." = "每一道难关突然都变得值得。"
"The celebration began before anyone had decided to start one." = "还没等人决定开始庆祝，庆祝就已经开始了。"
"They had earned this moment. No one could argue otherwise." = "这是他们挣来的时刻。没人能否认。"
"Triumph, unqualified and undeniable, filled the air." = "无可争辩、毫无保留的胜利充满空气。"
"What had seemed impossible an hour ago was now simply true." = "一小时前似乎不可能的事，如今已是事实。"
"The relief of victory was almost as sweet as victory itself." = "胜利带来的释然，几乎和胜利本身一样甜美。"
"Nobody had believed it could happen. It happened anyway." = "没人相信这会发生。它却照样发生了。"
"This was a story that would be told for a long time." = "这个故事会流传很久。"
"The hardest part was over, and they had won." = "最艰难的部分结束了，而他们赢了。"
"The dust had settled. The noise had faded. What remained was quiet, and thought." = "尘埃落定。喧嚣消散。留下的是寂静，以及思索。"
"In the stillness that followed, there was time -- at last -- to think." = "随后的静谧中，终于有时间思考了。"
"Looking back, it was easier to see how each piece had fit." = "回头看时，更容易看清每一块如何拼合。"
"The quiet after the event was its own kind of event." = "事件之后的平静，本身也是一种事件。"
"There was room, now, to consider what it had all meant." = "如今总算有余地思量，这一切究竟意味着什么。"
"Some things only make sense afterward, in the quiet." = "有些事，只有事后安静下来才说得通。"
"The noise had gone. What was left was worth examining." = "喧嚣已经退去。剩下的值得细看。"
"It was easier to understand the shape of things once they had stopped moving." = "当一切停止运动之后，才更容易看清它们的形状。"
"There was time now, and little else to do with it but think." = "现在有了时间，除了思考，也少有别的事可做。"
"Hindsight arrived, as it always does, a little too late to help." = "事后的明悟照例来得稍晚，已帮不上忙。"
"The mind kept returning to it, turning it over." = "思绪不断回到此事，反复翻看。"
"Some questions only get asked once the danger has passed." = "有些问题，危险过去之后才会被问起。"
"A pause, unhurried, to take stock of what remained." = "从容停顿片刻，盘点还剩些什么。"
"The silence afterward asked its own quiet questions." = "事后的沉默，轻声提出了自己的问题。"
"Distance made the picture clearer, if not easier." = "距离使画面更清楚，却未必更容易接受。"
"There was value in simply sitting with what had happened." = "安静地与发生过的事相处，也自有价值。"
"Nothing more needed to be done. Only understood." = "无需再做什么。只需要理解。"
"The past, examined calmly, looked different than it had felt." = "冷静审视过去时，它的模样与亲历时的感受不同。"
"It was a good time for honesty, now that no one was watching." = "如今没人旁观，正适合坦诚面对自己。"
"What remained, once the dust cleared, was worth sitting with." = "尘埃散尽后剩下的一切，值得静静思量。"
"The shadows were longer today. No one mentioned it, but everyone noticed." = "今天的影子更长了。没人提起，却人人留意。"
"A raven sat on the wall, watching. It had been there all morning." = "一只渡鸦停在墙头注视，整个上午都在那里。"
"Something was wrong with the quiet. It was too complete." = "这寂静不太对劲。它太彻底了。"
"The signs had been there for days. Only now did they seem to matter." = "迹象已经出现好几天，到现在才显得要紧。"
"Nobody said the word aloud, but everyone was thinking it." = "没人把那个词说出口，每个人却都在想。"
"The animals had gone quiet an hour ago, and had not started again." = "动物一个小时前就不再出声，此后也未恢复。"
"There was a feeling of being watched, though no one could say by what." = "有一种被注视的感觉，却没人说得清被什么注视。"
"Small things had begun to go wrong, in ways that felt connected." = "小事接连出错，似乎彼此关联。"
"The wind had a different sound to it tonight." = "今夜的风，声音与往常不同。"
"Something was gathering, just past the edge of what could be seen." = "有什么正在视野边缘之外聚集。"
"The warnings had been easy to dismiss. They were harder to dismiss now." = "那些警告曾很容易被忽略，如今却很难忽略了。"
"A door that should have been locked was found, quietly, open." = "一扇本该锁着的门，悄悄地被发现敞开着。"
"The dread was not sudden. It had been building for a while." = "恐惧并不突然，已经酝酿了一阵。"
"Every small omen, alone, meant nothing. Together, they meant something." = "每个小小征兆单看都无意义，合在一起却意味深长。"
"The pattern was there, if you knew how to look for it." = "只要知道该如何寻找，就能发现其中的规律。"
"Something waited, patient and unseen, just beyond the firelight." = "火光之外，有什么耐心而无声地等待着。"
"The old stories about this place had never seemed less like stories." = "关于此地的旧故事，从未如此不像故事。"
"Nothing had happened yet. That was, somehow, the worst part." = "还什么都没发生。不知为何，这却最令人难受。"
"The feeling would not leave, no matter how it was reasoned away." = "无论如何用道理解释，那感觉就是不肯离去。"
"Trouble had not arrived. But it was, unmistakably, on its way." = "麻烦尚未到来，但毫无疑问，已经在路上。"
"The banners flew high, and the people cheered, and everything seemed right with the world." = "旗帜高扬，人们欢呼，世界仿佛一切安好。"
"Confidence radiated from every stone of the place. This was a civilization at its peak." = "这里的每块石头都散发着自信。这是处于巅峰的文明。"
"This was what they had built, and it showed." = "这就是他们建成的一切，成果清晰可见。"
"Every hall, every hearth, every carved stone spoke of what had been accomplished." = "每座大厅，每处炉灶，每块雕石都诉说着成就。"
"There was a straightness to every spine here that had not always been there." = "这里的每个人都挺直脊背，那并非一直如此。"
"The place did not need to announce its success. It was obvious." = "这里不必宣告成功。成功显而易见。"
"Nothing here was accidental. Every detail had been earned." = "这里没有什么偶然。每个细节都是努力换来的。"
"Generations of work stood visible in every wall." = "每面墙上都能看见数代人的劳作。"
"This was not luck. This was the result of deliberate, sustained effort." = "这不是运气，而是有心而持续的努力结出的成果。"
"There was a quiet dignity to everything that had been achieved." = "取得的一切成就，都带着安静的尊严。"
"The work spoke for itself, and it spoke well." = "成果自己开口说话，说得很好。"
"What had once been ambition was now simply fact." = "曾经的雄心，如今已成事实。"
"Every visitor could see it: this was a place that had succeeded." = "每位访客都看得出来：这个地方成功了。"
"The achievements here needed no exaggeration." = "这里的成就无须夸大。"
"There was reason, at last, to stand a little taller." = "人们终于有理由站得更挺直些。"
"This was a legacy worth having built." = "这是一份值得建立的传承。"
"The pride here was earned, not assumed." = "这里的自豪来自实绩，而非自以为是。"
"Everything that had been promised, in the early days, had been delivered." = "早年许下的每项承诺都已兑现。"
"It was, by any honest measure, an accomplishment." = "用任何诚实的标准衡量，这都是成就。"
"The place carried itself like something that had earned the right to." = "这里举止自若，因为它挣得了这样的资格。"
"Behind closed doors, the real work was being done." = "紧闭的门后，真正的工作正在进行。"
"The conversation was pleasant. The subtext was deadly." = "对话亲切。言外之意却致命。"
"Nothing said aloud could be taken at face value." = "任何说出口的话，都不能照字面理解。"
"Every smile in the room concealed a calculation." = "屋里每一个微笑都藏着算计。"
"The plan had been in motion for longer than anyone realized." = "计划早就开始运转，远比任何人意识到的更早。"
"What appeared to be a simple request was, in fact, nothing of the sort." = "看似简单的请求，实际上完全不是那么回事。"
"There were more players at this table than were visible." = "这张桌旁的参与者，比看得见的更多。"
"The real conversation happened in the pauses, not the words." = "真正的对话发生在停顿中，而不在话语里。"
"Everyone here wanted something. Few were willing to say what." = "这里每个人都有所求，愿说出所求的人却很少。"
"A favor offered now would be called in later, with interest." = "此时给予的恩惠，日后会连本带利地讨还。"
"The pieces were being arranged, quietly, for a game no one else knew was being played." = "棋子正在悄悄摆好，而旁人还不知道游戏已经开始。"
"Loyalty, here, was a currency, traded carefully." = "在这里，忠诚是一种货币，交易起来十分谨慎。"
"Nothing was ever quite what it was presented as." = "任何东西，都不会全然符合它展示出的样子。"
"The trap had been set long before anyone noticed the bait." = "人们发现诱饵之前，陷阱早已布下。"
"Alliances formed and dissolved in the space between sentences." = "话语的间隙，同盟建立又瓦解。"
"Every question had a second, unspoken question behind it." = "每个问题后面都藏着第二个未说出口的问题。"
"The information moved quietly, through channels that did not officially exist." = "情报悄悄流过那些在官方记录中并不存在的渠道。"
"Patience, here, was simply another word for strategy." = "在这里，耐心只是策略的另一个名字。"
"The move had been planned three steps in advance." = "这一着棋，早在三步之前就已策划好。"
"Nothing about this arrangement was as simple as it looked." = "这项安排，处处都比看上去更复杂。"
"It happened too fast for anyone to react. By the time they understood, it was over." = "事情发生得太快，无人来得及反应。等他们明白，已经结束。"
"The gasp was audible. The silence that followed was worse." = "惊喘清晰可闻。随后的寂静更令人难受。"
"No one saw it coming. That was, perhaps, the point." = "没人预料到。或许，这正是用意所在。"
"One moment, everything was ordinary. The next, it was not." = "前一刻，一切平常。下一刻，就已不同。"
"There was no warning. There rarely is." = "没有预警。通常也不会有。"
"The room went still, all at once, as if struck." = "整个房间猛然静止，仿佛遭到重击。"
"It should not have been possible. And yet, there it was." = "这本不该可能，然而它就摆在眼前。"
"Nobody moved for a long moment. Nobody could." = "好一阵子无人行动。谁也动不了。"
"The world lurched sideways, briefly, before it steadied." = "世界短暂地向一旁倾斜，随后才重新稳住。"
"What had just happened took a moment to catch up to everyone watching." = "刚刚发生的事，过了一会儿才传达到所有旁观者的心里。"
"Even those who had seen everything had not seen this." = "即便自以为见过一切的人，也从未见过这个。"
"The sound of it echoed long after the moment itself had passed." = "那一刻早已过去，它的声音却回荡不休。"
"Disbelief arrived first. Understanding came slower." = "难以置信先到，理解来得更慢。"
"It happened in an instant, and changed everything after it." = "它发生在一瞬，改变了此后的一切。"
"No one had time to brace for it." = "没有人来得及做好准备。"
"The suddenness of it was, in some ways, the cruelest part." = "从某些方面说，它的突如其来正是最残酷之处。"
"Every plan anyone had made became irrelevant in a single moment." = "所有人的每个计划，都在刹那间失去了意义。"
"It took a long breath before anyone could speak again." = "过了长长的一次呼吸，才有人重新开口。"
"There had been no build-up. Just, suddenly, this." = "没有任何铺垫。只是突然发生了。"
"The shock had not yet worn into anything else. It simply sat there, raw." = "震惊还未转化为其他感受，只是赤裸地停在那里。"
"The world stopped. Or seemed to." = "世界停住了。或者仿佛停住了。"
"There are moments that divide a life into before and after. This was one of them." = "有些时刻会把人生划分为前后两段。这就是其中之一。"
"Nothing that came after would feel quite the same as what came before." = "此后的任何事，都不会再像从前那样。"
"Everything that had mattered a moment ago suddenly did not." = "片刻前还重要的一切，突然都不重要了。"
"The floor did not move, but it felt as though it had." = "地板没有移动，感觉却像移动过。"
"Some news cannot be absorbed all at once. It has to be taken in pieces." = "有些消息无法一次接受，只能一点一点领会。"
"There was a before, and now there was an after, and nothing bridged them." = "曾经有一个“之前”，如今有一个“之后”，两者之间再无桥梁。"
"The ground beneath everything familiar simply gave way." = "所有熟悉事物脚下的地面，突然塌陷。"
"It was the kind of moment that made every other concern seem small." = "这样的时刻，会让其余所有忧虑都显得渺小。"
"Everything anyone had planned for no longer applied." = "此前的一切打算，如今都已不再适用。"
"The weight of it did not arrive all at once. It arrived, and stayed." = "它的重量并非一次压下，而是来到后便始终不走。"
"Whatever had been solid a moment ago no longer felt that way." = "片刻前坚实的一切，如今都不再令人觉得可靠。"
"Some things, once known, cannot be unknown." = "有些事一旦知晓，就再也无法当作不知道。"
"The silence that followed had a different quality than any silence before it." = "随后的沉默，与此前任何一次沉默都不同。"
"It was not a wound. It was closer to an amputation." = "这不是伤口，更像是截肢。"
"Life continued, technically. It did not feel like continuing." = "从严格意义上说，生活仍在继续，感觉却不像继续。"
"Everything that had been certain became, in an instant, uncertain." = "一切确定的事，转眼间都变得不确定。"
"There was no undoing what had just happened." = "刚刚发生的事无法撤销。"
"The scale of it took time to become clear, and then it became unbearable." = "过了一段时间才明白事态有多大，而一明白，就无法承受。"
"Nothing could prepare anyone for news like this. Nothing ever does." = "这样的消息，无论如何准备都无法应对。向来如此。"
"The tragedy was not in the violence. It was in the inevitability." = "悲剧不在于暴力，而在于不可避免。"
"Everyone knew how this would end. No one could stop it." = "人人都知道结局，却无人能阻止。"
"It had been written long before it happened. That was the worst part." = "发生之前，结局早已写好。这才是最糟糕的。"
"Every warning had been ignored, not out of malice, but out of hope." = "每次警告都被忽略，并非出于恶意，而是出于希望。"
"The path here had been clear for a long time. It was simply too late to leave it." = "通向这里的道路早已清楚，只是已来不及离开。"
"There was nothing anyone could have done differently. That did not make it easier." = "没人本来能够做得不同。这也丝毫没有让事情更好受。"
"Some endings arrive slowly enough to watch, and still cannot be stopped." = "有些结局缓慢得能看着它到来，却依旧无法阻止。"
"It was not bad luck. It was the natural conclusion of everything that came before." = "这不是运气不好，而是此前一切的自然结局。"
"Fate, if such a thing exists, had settled this long ago." = "如果命运存在，它早就定下了此事。"
"Everyone had seen it coming. Seeing it had not been enough." = "每个人都看见它正在到来。看见却仍不够。"
"The outcome had been decided the moment the first choice was made." = "作出第一个选择的那一刻，结果就已经注定。"
"There was a terrible logic to how it had all unfolded." = "这一切的展开，带着可怕的逻辑。"
"This was not an accident. It was a consequence." = "这不是意外，而是后果。"
"The story had only ever had one ending. It simply took time to arrive." = "这个故事从来只有一个结局，只是需要时间抵达。"
"No one was surprised. That, somehow, made it worse." = "没人吃惊。不知为何，这反而让事情更糟。"
"It had felt, for a long time, like waiting for something already decided." = "很久以来，感觉都像是在等待已经定下的事。"
"What could have been prevented, wasn't. What couldn't have been, happened anyway." = "能够避免的，未被避免。无法避免的，照样发生。"
"The inevitability of it offered no comfort at all." = "它的不可避免，丝毫不能带来安慰。"
"Everyone had played their part exactly as the story required." = "每个人都完全按故事所需，演完了自己的角色。"
"It ended the only way it ever could have." = "它以唯一可能的方式结束了。"
"The wind carried the sound of weeping. Or perhaps it was just the wind." = "风送来哭泣声。也许，那只是风。"
"The place that had been full of life was empty now, and the emptiness echoed." = "曾经满是生命的地方，如今空空荡荡，空虚回荡不绝。"
"Absence has a shape. It fills a room as surely as presence does." = "缺席也有形状。它和存在一样，确实地填满一间屋。"
"The quiet where a voice used to be was its own kind of sound." = "声音曾在的地方如今寂静，这寂静本身也是一种声音。"
"Everything here still smelled faintly of who used to be here." = "这里的一切仍隐约带着昔日那人的气息。"
"The chair remained where it had always been. No one sat in it anymore." = "椅子仍在老地方。却再没人坐上去。"
"Grief moved through the halls like a draft no one could seal out." = "悲伤像无法堵住的穿堂风，流过走廊。"
"What was left behind was mostly silence, and small unfinished things." = "留下的大多是沉默，以及尚未完成的小事。"
"The absence was loudest in the small hours, when nothing else competed with it." = "深夜最能听见缺席，因为再无其他声音与它争夺。"
"Time had not yet worn the edges off the loss." = "时间还没磨平失去的棱角。"
"Everything familiar now carried a faint, aching reminder." = "每样熟悉事物，如今都带着微弱而痛楚的提醒。"
"The empty space at the table was harder to look at than anything else." = "桌边那个空位，比什么都更难直视。"
"Mourning does not announce itself. It simply moves in and stays." = "哀悼不会宣告自己到来，只会搬进来，然后留下。"
"Even the light in the room seemed dimmer than it used to." = "连屋里的光都似乎比从前暗淡。"
"Someone would have laughed, here, once. No one did now." = "曾经有人会在这里笑，如今却无人笑。"
"The silence had weight, the particular weight of someone missing." = "沉默沉甸甸的，那是缺少某个人特有的重量。"
"Everything continued, quietly, around the shape of what was gone." = "一切都围绕着失去之物的轮廓，静静地继续。"
"The wind through the empty rooms sounded almost like a name." = "风吹过空房间，听上去几乎像一个名字。"
"Loss does not end. It only grows quieter with time." = "失去不会结束，只会随着时间渐渐安静。"
"What remained was memory, and the ache of everything memory could not return." = "剩下的是记忆，以及记忆无法带回一切的痛。"
"The day was pleasant, the mood was good, and no one suspected a thing." = "天气宜人，心情愉快，没有人起疑。"
"Laughter drifted from the open windows, carried on a warm breeze." = "笑声从敞开的窗户飘出，乘着温暖的微风。"
"It was an ordinary day, and ordinary days are underrated." = "这是平常的一天，而平常的一天常被低估。"
"Nothing much was happening, and that was, for once, wonderful." = "没发生多少事，这一次，却美妙得很。"
"The afternoon passed easily, without incident or ambition." = "下午轻松地过去，既无意外，也无雄心。"
"Everyone seemed a little lighter than usual today." = "今天每个人似乎都比往常轻快些。"
"Small talk. Easy company. Nothing that needed solving." = "闲聊。自在作伴。没有需要解决的事。"
"The world, for a while, behaved itself." = "世界暂时表现得很规矩。"
"It was the kind of day that asked very little of anyone." = "这样的一天，不向任何人索取太多。"
"There was nothing on anyone's mind worth worrying about." = "没人心里有值得担忧的事。"
"The sun was out, the mood was easy, and no one hurried anywhere." = "太阳出来了，心情轻松，没人急着赶往哪里。"
"A pleasant hum of ordinary life filled the air." = "普通生活的愉快低鸣充满空气。"
"Nothing important was happening, which was, itself, a kind of gift." = "没有要紧的事发生，这本身也是一种赠礼。"
"The day drifted along, unremarkable and entirely welcome." = "一天平平无奇地缓缓流逝，却完全令人欢迎。"
"Everyone seemed to have forgotten, briefly, whatever usually worried them." = "每个人似乎暂时忘记了平常的烦恼。"
"It was a good day to have nothing much to do." = "这是适合无所事事的好日子。"
"The mood was light, the conversation lighter still." = "心情轻松，对话更轻松。"
"For once, nothing loomed on the horizon." = "地平线上终于没有迫近的忧患。"
"The simple pleasures were, today, entirely sufficient." = "今天，简单的快乐就已完全足够。"
"It was, refreshingly, just a nice day." = "只是美好的一天，令人心旷神怡。"
"What happened next defied explanation. And yet it happened." = "接下来发生的事无法解释，却还是发生了。"
"The situation was, by any rational measure, ridiculous." = "按任何理性的尺度衡量，这情况都十分荒谬。"
"No one could quite explain how things had gotten to this point." = "没人说得清，事情怎会发展到这一步。"
"It made no sense. It happened anyway." = "这毫无道理，却照样发生了。"
"Logic had left the building some time ago, and had not returned." = "逻辑早已离开这里，也未再回来。"
"There was no good explanation. There rarely is, in situations like this." = "没有合理解释。这样的情况下，通常也没有。"
"If someone had planned this, it would have been a terrible plan. No one had planned it." = "如果有人策划了这一切，那会是极糟的计划。却没人策划过。"
"The absurdity only became clear in hindsight, which did not help at all." = "只有事后回头看，才发现如此荒谬，而这毫无帮助。"
"This was, without question, the strangest way things could have gone." = "毫无疑问，这是事情可能发展的最古怪方式。"
"Nobody would believe this story. It had the decency to be true anyway." = "没人会相信这个故事。可它至少厚道地是真的。"
"It was the sort of thing that sounded made up, even while it was happening." = "这种事，即便正在发生，听起来也像编的。"
"Reasonable explanations were attempted, and abandoned." = "人们尝试合理解释，又放弃了。"
"There was a certain dignity in giving up trying to make sense of it." = "放弃理解这一切的努力，倒也有几分尊严。"
"Nothing about this followed from anything that came before." = "这一切，处处都无法从之前的事推导出来。"
"The situation had officially exceeded the bounds of the sensible." = "事态正式超出了合理的边界。"
"It defied every expectation, including the low ones." = "它打破了所有预期，包括最低的那些。"
"Someone would later ask how this had happened. No one would have a good answer." = "以后会有人问这是怎么发生的，却无人能给出好答案。"
"This was not supposed to be possible. It was, nonetheless, happening." = "这本不该可能，却偏偏正在发生。"
"The whole thing had the logic of a fever dream." = "整件事只有高烧梦境般的逻辑。"
"It was hard to know whether to laugh or simply give up." = "真不知该笑，还是干脆放弃。"
"Everything was happening at once, and none of it was going according to plan." = "所有事同时发生，没有一件按计划进行。"
"Chaos. Pure, undiluted, magnificent chaos." = "混乱。纯粹、十足、壮观的混乱。"
"There was no time to think. Only to react." = "没有思考的时间，只能反应。"
"Every direction seemed to need attention at the same moment." = "每个方向仿佛都在同一刻需要照顾。"
"Shouting. Running. No one quite in control of anything." = "叫喊。奔跑。没有谁真正掌控什么。"
"Plans dissolved the instant they were made." = "计划刚一订下就崩散。"
"It was impossible to keep track of everything that was going wrong." = "根本无法数清有多少事正在出错。"
"Too many things demanded attention, all of them urgent." = "太多事情需要关注，而且件件紧急。"
"There was barely time to breathe, let alone think clearly." = "连呼吸的时间都几乎没有，更别说清楚思考。"
"Everyone moved fast and none of it looked coordinated." = "人人跑得飞快，却毫无配合。"
"One crisis folded into the next without pause." = "一个危机接着另一个，片刻不停。"
"The situation had spiraled past anyone's ability to manage it calmly." = "事态已经失控，超出任何人冷静处置的能力。"
"Every second mattered, and there were not nearly enough of them." = "每一秒都重要，而时间远远不够。"
"It was a scramble, disorganized and desperate." = "这是杂乱而绝望的仓皇奔忙。"
"Nothing was where it was supposed to be, including the people." = "什么都不在该在的地方，包括人。"
"The noise alone was enough to make thinking difficult." = "光是喧嚣就已足以妨碍思考。"
"There was no plan anymore. Only motion." = "再没有计划，只有动作。"
"Everyone was shouting something different, all at the same time." = "每个人都在同时喊着不同的事。"
"It felt less like a moment and more like a collision." = "感觉不像一个时刻，更像一次碰撞。"
"Whatever order had existed a minute ago was entirely gone now." = "一分钟前尚存的秩序，如今已经荡然无存。"
"It was, objectively, not funny. And yet everyone was laughing." = "客观而言，这不好笑。但人人都在笑。"
"The absurdity of the situation had reached critical mass." = "事态的荒谬已经到达临界点。"
"No one could explain what was funny about it. It was funny anyway." = "没人说得出哪里好笑，却偏偏好笑。"
"Someone tried to keep a straight face. It did not last." = "有人试图保持严肃，却没撑多久。"
"The laughter started small and became, quickly, unstoppable." = "笑声起初很小，很快就止不住了。"
"It was the kind of situation that only made sense as comedy." = "这种局面，只有当成喜剧才说得通。"
"Trying to explain it later only made it funnier." = "日后试图解释，反而会使它更好笑。"
"Nobody meant for it to be this ridiculous. That was rather the point." = "没人想让事情如此荒唐。这倒恰好是关键。"
"The whole thing had spiraled well past seriousness." = "整件事早已离严肃十万八千里。"
"It was funnier for how badly everyone was trying not to laugh." = "人人拼命忍笑的狼狈样，反而让它更好笑。"
"There is a point where disaster tips over into comedy, and this had reached it." = "灾难有时会越过某一点变成喜剧，此事已经到了那一点。"
"Even the people involved could not keep from grinning." = "连当事人都忍不住咧嘴笑。"
"It would be a story told, and laughed at, for a long time." = "这个故事会被讲起，也被嘲笑，很长一段时间。"
"Whatever dignity had existed here was now thoroughly gone, and no one minded." = "这里曾有的尊严如今彻底消失，没人介意。"
"It was hard to breathe, between the laughing." = "笑声之中，呼吸都变得困难。"
"The situation had become too ridiculous to take seriously." = "情况荒谬到无法认真对待。"
"Someone was going to have to explain this later. That thought made it funnier." = "以后总要有人解释此事。想到这里，更好笑了。"
"The laughter was contagious, spreading before anyone could stop it." = "笑声会传染，谁也来不及阻止便已蔓延。"
"Nothing about this was planned, which was exactly why it worked." = "这一切全非计划，却恰因此奏效。"
"It was, all things considered, a very good bad idea." = "综合来看，这是个相当不错的馊主意。"
"The moment was small, private, and infinitely valuable." = "这一刻微小、私密，却珍贵无比。"
"Tenderness, in a world this harsh, was an act of courage." = "在如此严酷的世界里，温柔是一种勇气。"
"It was a small kindness, and it mattered more than it should have." = "那是一点小小的善意，重要得超乎它的分量。"
"A gentle word, offered at the right moment, can outweigh a great deal." = "适时的一句温柔话，能胜过很多东西。"
"There was nothing dramatic about it. It was simply, quietly, kind." = "没有什么戏剧性，只是安静而纯粹的善意。"
"The gesture cost nothing and meant everything." = "这个举动不费什么，却意味着一切。"
"Some moments do not need witnesses to matter." = "有些时刻不需要见证者，也仍然重要。"
"It was a quiet thing, easy to miss, impossible to forget." = "它很安静，很容易错过，却不可能忘记。"
"Softness, here, was not weakness. It was a choice." = "这里的柔软并非软弱，而是一种选择。"
"A hand offered, without being asked, said more than words could." = "无须请求便伸出的手，比话语说得更多。"
"The care in it was plain, even without being spoken aloud." = "即使没有说出口，其中的关怀也清晰可见。"
"Nothing about the moment demanded attention. It simply deserved it." = "这一刻并不要求关注，却值得关注。"
"Some kindnesses are small enough to go unnoticed by everyone but the person who needed them." = "有些善意小得无人察觉，只有需要它的人会看见。"
"It was a private moment, and it stayed that way." = "这是一个私密的时刻，也始终如此。"
"The gentleness of it was almost startling, given everything else." = "在其余一切的映衬下，这份温柔几乎令人吃惊。"
"A quiet touch. A quieter understanding." = "轻柔的触碰。更安静的理解。"
"There was no need to say anything. The gesture said it." = "不必说话，这个举动已经说了。"
"It was the kind of tenderness that asked for nothing in return." = "这样的温柔不求任何回报。"
"Something soft passed between them, unremarked and unforgotten." = "温软之物在两人之间流过，无人提起，也无人忘记。"
"The smallest gestures, sometimes, carry the most weight." = "有时，最小的举动承载着最重的分量。"
"The words hurt more than any blade. Words always do." = "话语比任何刀刃都更伤人。话语总是如此。"
"The pain was not physical. It was the kind that no healer could touch." = "痛苦并非肉体的，而是任何医者都触碰不到的那种。"
"Some wounds do not bleed, and are no less real for it." = "有些伤口不流血，却并不因此更不真实。"
"It was not the injury that hurt. It was what the injury meant." = "疼的不是伤，而是伤所意味的东西。"
"There are hurts that leave no mark, and heal slower for it." = "有些伤痛不留痕迹，反而愈合得更慢。"
"The pain settled somewhere words could not quite reach to describe." = "痛楚停在言语难以抵达描述的地方。"
"It was the kind of hurt that did not fade with time, only with acceptance." = "这种痛并不随时间淡去，只能随接受而缓解。"
"Nothing about the pain showed on the outside." = "从外表看不见丝毫痛苦。"
"The sting of it lingered long after the moment had passed." = "那一刻过去很久，刺痛依旧。"
"Some things said cannot be unsaid, and the damage cannot be undone." = "有些话一旦说出就无法收回，伤害也无法撤销。"
"It hurt in a way that had nothing to do with the body." = "这种痛与身体毫无关系。"
"The wound was invisible, and somehow that made it worse." = "伤口看不见，而这竟使它更糟。"
"There was no bandage for this kind of hurt." = "这种伤痛没有绷带可用。"
"It ached in a place that had no name." = "痛发生在没有名字的地方。"
"The pain did not shout. It simply sat there, quiet and persistent." = "痛苦没有喊叫，只是安静而持久地留在那里。"
"Some hurts are carried alone, because there is no way to share them." = "有些伤痛只能独自承受，因为无法分享。"
"It was the kind of pain that got worse the more it was examined." = "这种痛越仔细审视，越厉害。"
"Nothing physical had happened, and yet everything hurt." = "肉体未发生什么，却处处都疼。"
"The hurt did not fade. It just became familiar." = "伤痛没有淡去，只是变得熟悉。"
"This was pain of the kind that outlasts any bruise." = "这份痛楚会比任何淤伤都更长久。"
"What broke was not a bone or a promise. It was something that could not be named, and could not be repaired." = "碎裂的不是骨头，也不是承诺，而是无法命名、无法修复的东西。"
"Some things, once broken, do not mend. They only get carried differently." = "有些东西一旦碎裂就不会复原，只能换一种方式承受。"
"It was not the kind of damage that time could undo." = "这种损伤不是时间能够消除的。"
"Something essential had cracked, quietly, and would not be whole again." = "某个至关重要的东西悄悄裂开，再不会完整。"
"The break was not visible. It was, nonetheless, total." = "破碎无法看见，却是彻底的。"
"There are losses that leave no repair possible, only adaptation." = "有些失去无法补救，只能适应。"
"Whatever had held everything together had, finally, given way." = "维系一切的东西终于崩溃了。"
"It was the kind of ending that left nothing to salvage." = "这样的结局，没留下任何可挽救的东西。"
"Something had shattered that had no name and no replacement." = "某种无名、无可替代的东西碎了。"
"This was not a wound that would scar over. It simply stayed open." = "这不是会结疤的伤口，而是一直敞开着。"
"The pieces of it could be gathered, but never quite fit the same way again." = "碎片能够拾起，却再也无法像从前那样拼合。"
"It broke the part of things that cannot be rebuilt, only mourned." = "它打碎了只能哀悼、无法重建的部分。"
"Nothing could be done. That was the whole, unbearable truth of it." = "无计可施。这就是全部而无法忍受的真相。"
"Something had been lost that no apology could return." = "失去了某种无论怎样道歉都无法带回的东西。"
"It was over in a way that had no exceptions, no second chances." = "结束得彻彻底底，没有例外，也没有第二次机会。"
"The damage went deeper than anything that could be fixed with time." = "伤害深得远超时间所能修复。"
"What remained afterward was not brokenness exactly, but permanent absence." = "事后留下的，与其说是破碎，不如说是永久的缺席。"
"There was no version of this that ended gently." = "无论怎样，这都无法温柔地结束。"
"Some breaks do not heal. They simply become part of the shape of a life." = "有些裂痕不会愈合，只会成为人生形状的一部分。"
"It was the kind of loss that redefined everything that came after it." = "这种失去，重新定义了此后的一切。"
"Something was wrong. Not obviously wrong -- subtly wrong. The kind of wrong that made the skin crawl." = "有什么不对。并非明显的不对，而是微妙得让人毛骨悚然。"
"Nothing here was quite as it should be, though nothing could be pointed to directly." = "这里一切都不完全合乎应有的样子，却又无法确切指出。"
"It was the small details that were wrong, not the large ones." = "出错的是小细节，而非大事。"
"There was a wrongness to the quiet that was hard to place." = "寂静中透着难以捉摸的不对劲。"
"Everything looked normal. Nothing felt normal." = "看起来一切正常，感觉却全不正常。"
"The feeling would not settle, no matter how it was reasoned through." = "无论怎样推敲解释，那感觉就是无法平复。"
"Something about the stillness here did not sit right." = "这里的静止总让人觉得不妥。"
"It was the kind of unease that had no clear source, and no clear end." = "这份不安既无明确来源，也无明确尽头。"
"Nothing was overtly threatening. Everything was, somehow, off." = "没有公然的威胁，但一切莫名地不对。"
"A wrongness lingered in the air, too faint to name and too persistent to ignore." = "不对劲的感觉滞留在空气中，淡得难以命名，又持久得无法忽略。"
"The details did not add up, in ways too small to explain." = "细节间对不上，却小得难以解释。"
"There was a sense of being observed by something that was not, in fact, there." = "有一种被某物注视的感觉，尽管它其实并不在那里。"
"Everything was in its place, and that, somehow, was the problem." = "所有东西都在该在的位置，不知为何，这正是问题。"
"The ordinary had taken on a strange, faintly hostile quality." = "平常的一切变得古怪，隐隐带着敌意。"
"It was hard to say what exactly was wrong. Only that something was." = "很难说清究竟哪里不对，只知道有事不对。"
"The silence here felt deliberate, in a way silence should not." = "这里的沉默似乎是有意为之，而沉默不该如此。"
"Something about it did not belong, though it looked, on the surface, like it did." = "有些东西不属于这里，尽管表面上看很合适。"
"A low, wordless dread had settled in, and refused to explain itself." = "低沉而无言的恐惧盘踞下来，拒绝解释自己。"
"Every familiar thing here felt, faintly, unfamiliar." = "这里每样熟悉的东西，都透着一点陌生。"
"It was the kind of feeling that made sense only after it was too late." = "这种感觉，只有太迟时才会显出意义。"
"Questions hung in the air like smoke." = "问题像烟一样悬在空气中。"
"The investigation was methodical, patient, and deeply uncomfortable for everyone involved." = "调查有条不紊，耐心十足，令所有相关者都深感不适。"
"Every answer only produced another question." = "每个答案只带来另一个问题。"
"Nothing was accepted at face value. Everything was checked twice." = "什么都不按表面接受。每件事都核实两遍。"
"The questioning was gentle. It was also relentless." = "盘问很温和，也毫不松懈。"
"Each detail was turned over, examined, and set carefully aside." = "每个细节都被翻看、审视，再小心放到一旁。"
"There was no rushing this. Every thread had to be followed to its end." = "这急不得，每根线索都必须追到尽头。"
"The truth, if it existed, was going to have to be found the hard way." = "如果真相存在，也只能费力找出。"
"Silence, here, was as informative as speech." = "在这里，沉默与话语提供的信息一样多。"
"Every inconsistency was noted, and none of them were forgotten." = "每处矛盾都被记下，绝不会忘。"
"The pieces did not fit yet. That, itself, was worth noting." = "拼图还对不上。这本身就值得留意。"
"Patience was the only tool that mattered here." = "在这里，耐心是唯一重要的工具。"
"Nothing was dismissed until it had been fully understood." = "任何事都要完全理解之后，才会被排除。"
"The questions kept coming, careful and precise." = "问题不断到来，谨慎而精确。"
"Someone was going to have to account for every detail, eventually." = "总有一天，会有人必须交代每个细节。"
"The gaps in the story were more interesting than the story itself." = "故事的空白，比故事本身更有意思。"
"Each answer was weighed against everything that had come before it." = "每个答案都要与此前的一切一起权衡。"
"It was uncomfortable, this kind of scrutiny. It was also necessary." = "这样的审视令人不适，却也必要。"
"The truth was in here somewhere, buried under everything that was easier to believe." = "真相就在其中某处，埋在所有更容易相信的东西下面。"
"Every version of events was going to be tested, sooner or later." = "每一种说法，迟早都会受到检验。"
"The trail seemed clear. It was not." = "线索看似清楚，其实并非如此。"
"Everything pointed one way. The truth, naturally, was in the opposite direction." = "一切都指向一边。真相自然在相反方向。"
"The obvious answer was, as usual, the wrong one." = "显而易见的答案，照例是错误的。"
"What looked like the whole story was only the part meant to be seen." = "看似完整的故事，其实只是被允许看见的部分。"
"The evidence had been arranged to lead exactly where it led." = "证据经过安排，正好引向它所引的地方。"
"Nothing here was quite what it first appeared to be." = "这里的一切，都不完全是初看时的样子。"
"The simplest explanation was, in this case, a lie." = "在这个例子里，最简单的解释是谎言。"
"Every clue confirmed the wrong conclusion, conveniently." = "每条线索都恰到好处地证实着错误结论。"
"It was easy to believe. That should have been the first warning sign." = "它很容易相信。这本该是第一个警讯。"
"The path forward looked certain. Certainty, here, was the trap." = "前路看似确定。在这里，确定性恰是陷阱。"
"What seemed like an accident had been carefully arranged to look like one." = "看似意外的事，被精心安排成了意外的模样。"
"The story fit together too neatly to be entirely true." = "故事拼合得过于整齐，不可能全是真的。"
"Someone had gone to great trouble to make the false thing look real." = "有人费了很大工夫，让假的看起来像真的。"
"The real answer was hiding exactly where no one thought to look." = "真正的答案，正藏在没人想到去看的地方。"
"Every convenient detail should have raised a question. None did, at first." = "每个便捷的细节都该引起疑问，起初却没有一个。"
"The truth had been dressed up to look like something else entirely." = "真相被装扮成了全然不同的东西。"
"It all made sense, which was, in hindsight, the problem." = "一切都说得通，事后看来，这正是问题。"
"The obvious suspect was obvious for a reason -- and it was the wrong reason." = "显而易见的嫌疑人之所以显眼自有原因，而那原因是错的。"
"Someone had built this story carefully, brick by false brick." = "有人用一块块虚假的砖，精心砌成了这个故事。"
"The clearer the trail looked, the less it should have been trusted." = "线索看上去越清楚，就越不该相信。"
"The time for deliberation was over. Action was required, and {@bt_a|::subscribed_books::vocabulary::person} was ready to take it." = "斟酌的时间已经结束。必须行动，而{@bt_a|::subscribed_books::vocabulary::person}已经准备好。"
"There was no more room for doubt. {@bt_a|::subscribed_books::vocabulary::person} moved anyway." = "再容不下怀疑。{@bt_a|::subscribed_books::vocabulary::person}还是行动了。"
"{@bt_a|::subscribed_books::vocabulary::person} had weighed every option already. Now there was only the choosing." = "{@bt_a|::subscribed_books::vocabulary::person}已经权衡过每个选项，如今只剩作出选择。"
"Enough waiting. {@bt_a|::subscribed_books::vocabulary::person} stepped forward." = "等得够久了。{@bt_a|::subscribed_books::vocabulary::person}迈步向前。"
"The decision had been made. {@bt_a|::subscribed_books::vocabulary::person} did not look back at it." = "决定已经作出。{@bt_a|::subscribed_books::vocabulary::person}不再回顾。"
"Whatever came next, {@bt_a|::subscribed_books::vocabulary::person} would meet it head-on." = "不论接下来是什么，{@bt_a|::subscribed_books::vocabulary::person}都会迎面面对。"
"There was a moment for thinking, and it had passed. {@bt_a|::subscribed_books::vocabulary::person} acted." = "思考的时刻已经过去。{@bt_a|::subscribed_books::vocabulary::person}行动了。"
"{@bt_a|::subscribed_books::vocabulary::person} did not need certainty. Only resolve." = "{@bt_a|::subscribed_books::vocabulary::person}不需要确定，只需要决心。"
"The choice was clear now, and {@bt_a|::subscribed_books::vocabulary::person} did not hesitate to make it." = "选择已经清楚，{@bt_a|::subscribed_books::vocabulary::person}毫不犹豫地作出了选择。"
"No more questions. {@bt_a|::subscribed_books::vocabulary::person} had heard enough." = "不再提问。{@bt_a|::subscribed_books::vocabulary::person}已经听够了。"
"This was the moment {@bt_a|::subscribed_books::vocabulary::person} had been preparing for, whether ready or not." = "无论准备好了没有，{@bt_a|::subscribed_books::vocabulary::person}一直准备面对的时刻已经到了。"
"{@bt_a|::subscribed_books::vocabulary::person} set the doubt aside and did what needed doing." = "{@bt_a|::subscribed_books::vocabulary::person}把疑虑放到一旁，做了必须做的事。"
"The path had been chosen. {@bt_a|::subscribed_books::vocabulary::person} walked it without flinching." = "道路已经选定，{@bt_a|::subscribed_books::vocabulary::person}毫不退缩地走了下去。"
"Enough talk. {@bt_a|::subscribed_books::vocabulary::person} was done talking." = "话说够了。{@bt_a|::subscribed_books::vocabulary::person}不再开口。"
"{@bt_a|::subscribed_books::vocabulary::person} made the call, and stood behind it." = "{@bt_a|::subscribed_books::vocabulary::person}作出决定，并为它负责。"
"There would be time to second-guess later. {@bt_a|::subscribed_books::vocabulary::person} did not have time now." = "以后有时间反复猜疑，现在{@bt_a|::subscribed_books::vocabulary::person}没有时间。"
"The moment called for someone willing to act. {@bt_a|::subscribed_books::vocabulary::person} answered." = "这一刻需要愿意行动的人。{@bt_a|::subscribed_books::vocabulary::person}应声而出。"
"{@bt_a|::subscribed_books::vocabulary::person} had run out of reasons to wait." = "{@bt_a|::subscribed_books::vocabulary::person}再找不到等待的理由。"
"It was time. {@bt_a|::subscribed_books::vocabulary::person} knew it, and moved." = "时候到了。{@bt_a|::subscribed_books::vocabulary::person}心知肚明，随即行动。"
"Every hesitation fell away, and {@bt_a|::subscribed_books::vocabulary::person} simply began." = "所有犹豫都退去，{@bt_a|::subscribed_books::vocabulary::person}就这样开始了。"
"The taste in {@bt_a|::subscribed_books::vocabulary::person}'s mouth was familiar. Bitterness had become an old companion." = "{@bt_a|::subscribed_books::vocabulary::person}口中的味道很熟悉。苦涩已成老友。"
"{@bt_a|::subscribed_books::vocabulary::person} had stopped expecting anything better. It was easier that way." = "{@bt_a|::subscribed_books::vocabulary::person}不再期待更好的结果，这样更容易。"
"There was no surprise left in disappointment, not for {@bt_a|::subscribed_books::vocabulary::person}, not anymore." = "失望已不会让{@bt_a|::subscribed_books::vocabulary::person}吃惊，再也不会了。"
"{@bt_a|::subscribed_books::vocabulary::person} had learned, the hard way, not to hope for much." = "{@bt_a|::subscribed_books::vocabulary::person}通过苦痛学会了不抱太多希望。"
"The resentment had settled in quietly, and stayed." = "怨恨悄悄住了下来，始终未走。"
"{@bt_a|::subscribed_books::vocabulary::person} smiled, because it was expected. It did not reach far." = "{@bt_a|::subscribed_books::vocabulary::person}微笑，因为人们期待如此。那笑意并未深入。"
"Something in {@bt_a|::subscribed_books::vocabulary::person} had gone hard, the way things do when they are handled too roughly, too often." = "{@bt_a|::subscribed_books::vocabulary::person}内心的某处已变得坚硬，正如被太频繁、太粗暴地对待的东西。"
"The unfairness of it did not surprise {@bt_a|::subscribed_books::vocabulary::person} anymore. It simply confirmed what {@bt_a2|::subscribed_books::vocabulary::person} already suspected." = "不公再不会使{@bt_a|::subscribed_books::vocabulary::person}吃惊，只会证实{@bt_a2|::subscribed_books::vocabulary::person}早有的怀疑。"
"{@bt_a|::subscribed_books::vocabulary::person} had earned the right to be bitter about this, and did not apologize for it." = "{@bt_a|::subscribed_books::vocabulary::person}有资格为此感到苦涩，并不为此道歉。"
"It was easier for {@bt_a|::subscribed_books::vocabulary::person} to expect the worst than to be disappointed again." = "对{@bt_a|::subscribed_books::vocabulary::person}而言，期待最坏结果，比再次失望更容易。"
"The old wound had not healed. It had simply gone quiet." = "旧伤没有愈合，只是安静下来。"
"{@bt_a|::subscribed_books::vocabulary::person} said nothing. {@bt_a2|::subscribed_books::vocabulary::person}'s silence said enough." = "{@bt_a|::subscribed_books::vocabulary::person}一言不发。{@bt_a2|::subscribed_books::vocabulary::person}的沉默已说得够多。"
"There was a hardness in {@bt_a|::subscribed_books::vocabulary::person} now that had not always been there." = "如今{@bt_a|::subscribed_books::vocabulary::person}身上有一种从前并非总有的冷硬。"
"{@bt_a|::subscribed_books::vocabulary::person} had given up expecting fairness from this. Fairness had never shown up before." = "{@bt_a|::subscribed_books::vocabulary::person}已放弃期待公平。公平从来未曾出现。"
"The grudge sat comfortably where hope used to be." = "怨恨舒适地坐在希望曾经的位置。"
"{@bt_a|::subscribed_books::vocabulary::person} had stopped being surprised by betrayal. That, itself, was a kind of loss." = "{@bt_a|::subscribed_books::vocabulary::person}不再为背叛吃惊。这本身也是一种失去。"
"Whatever warmth {@bt_a|::subscribed_books::vocabulary::person} once had for this had long since curdled." = "{@bt_a|::subscribed_books::vocabulary::person}曾对此抱有的温情，早已变质。"
"{@bt_a|::subscribed_books::vocabulary::person} carried the bitterness the way some carry old scars -- quietly, and everywhere." = "{@bt_a|::subscribed_books::vocabulary::person}带着苦涩，正如有人带着旧疤，静静地，无论走到哪里。"
"It was not anger exactly. It was something colder, and more settled." = "与其说是愤怒，不如说是更冷、更沉定的东西。"
"{@bt_a|::subscribed_books::vocabulary::person} had made peace with disappointment. Peace was the wrong word, but it was close enough." = "{@bt_a|::subscribed_books::vocabulary::person}已经与失望和解。“和解”并不准确，却也相差不远。"
"Nothing would stop {@bt_a|::subscribed_books::vocabulary::person} now. Not fear, not doubt, not the voice in the back of {a_pos} mind that whispered this was madness." = "如今什么都无法阻止{@bt_a|::subscribed_books::vocabulary::person}。恐惧不能，疑虑不能，{a_pos}脑海深处低语着“这是疯了”的声音也不能。"
"{@bt_a|::subscribed_books::vocabulary::person} had made the decision, and no amount of doubt would unmake it." = "{@bt_a|::subscribed_books::vocabulary::person}已经作出决定，再多怀疑也无法撤销。"
"Whatever stood in the way, {@bt_a|::subscribed_books::vocabulary::person} intended to go through it." = "不论什么挡路，{@bt_a|::subscribed_books::vocabulary::person}都打算穿过去。"
"The fear was still there. {@bt_a|::subscribed_books::vocabulary::person} simply refused to let it lead." = "恐惧仍在。{@bt_a|::subscribed_books::vocabulary::person}只是拒绝让它领路。"
"{@bt_a|::subscribed_books::vocabulary::person} had come too far to turn back now." = "{@bt_a|::subscribed_books::vocabulary::person}已经走得太远，无法再回头。"
"Every obstacle only seemed to harden {a_pos} resolve further." = "每道阻碍都仿佛让{a_pos}决心更坚。"
"{@bt_a|::subscribed_books::vocabulary::person} did not need to feel ready. {@bt_a2|::subscribed_books::vocabulary::person} only needed to move." = "{@bt_a|::subscribed_books::vocabulary::person}无需觉得已经准备好。{@bt_a2|::subscribed_books::vocabulary::person}只需行动。"
"The odds did not matter to {@bt_a|::subscribed_books::vocabulary::person} nearly as much as the outcome did." = "对{@bt_a|::subscribed_books::vocabulary::person}而言，胜算远没有结果重要。"
"{@bt_a|::subscribed_books::vocabulary::person} had one goal, and nothing left in {a_pos} mind but reaching it." = "{@bt_a|::subscribed_books::vocabulary::person}只有一个目标，{a_pos}心中只剩抵达它。"
"Doubt could keep whispering. {@bt_a|::subscribed_books::vocabulary::person} had stopped listening." = "疑虑可以继续低语。{@bt_a|::subscribed_books::vocabulary::person}已经不再听。"
"There was a stubbornness in {@bt_a|::subscribed_books::vocabulary::person} that refused to be reasoned out of this." = "{@bt_a|::subscribed_books::vocabulary::person}有一股倔强，拒绝被道理劝走。"
"{@bt_a|::subscribed_books::vocabulary::person} would see this through, whatever it cost." = "无论付出什么代价，{@bt_a|::subscribed_books::vocabulary::person}都会坚持到底。"
"Failure was a possibility {@bt_a|::subscribed_books::vocabulary::person} had already accepted, and moved past." = "{@bt_a|::subscribed_books::vocabulary::person}早已接受失败的可能，并越过了它。"
"Nothing about this would be easy. {@bt_a|::subscribed_books::vocabulary::person} had never expected it to be." = "这一切都不会轻松，{@bt_a|::subscribed_books::vocabulary::person}也从未期待轻松。"
"{@bt_a|::subscribed_books::vocabulary::person} pressed forward, because stopping was no longer an option {@bt_a2|::subscribed_books::vocabulary::person} allowed." = "{@bt_a|::subscribed_books::vocabulary::person}继续向前，因为{@bt_a2|::subscribed_books::vocabulary::person}再不允许停下这个选项。"
"The exhaustion did not matter. {@bt_a|::subscribed_books::vocabulary::person} kept going anyway." = "疲惫无关紧要。{@bt_a|::subscribed_books::vocabulary::person}照样继续。"
"{@bt_a|::subscribed_books::vocabulary::person} had made a promise, silently, and intended to keep it." = "{@bt_a|::subscribed_books::vocabulary::person}曾默默许下承诺，并打算兑现。"
"Every excuse to quit had already occurred to {@bt_a|::subscribed_books::vocabulary::person}. None of them had worked." = "每个退出的借口，{@bt_a|::subscribed_books::vocabulary::person}都已经想过，却没有一个奏效。"
"{@bt_a|::subscribed_books::vocabulary::person} set {a_pos} jaw and continued." = "{@bt_a|::subscribed_books::vocabulary::person}咬紧牙关，继续前进。"
"This was not stubbornness, not exactly. It was something closer to certainty." = "这不完全是固执，更接近确信。"
"The release, when it came, was overwhelming." = "宣泄终于到来时，势不可挡。"
"Everything that had been held back -- the anger, the grief, the patience -- came flooding out." = "所有压抑的东西，愤怒、悲伤、耐心，都汹涌而出。"
"It was not relief exactly. It was closer to a dam breaking." = "这不完全是释然，更像大坝决口。"
"Whatever had been held in for so long finally found its way out." = "压在心里许久的一切，终于找到了出口。"
"The tears came without warning, and without apology." = "眼泪毫无预兆地流下，也毫无歉意。"
"It felt like putting down something heavy that had been carried too long." = "感觉像终于放下了背负太久的重物。"
"Everything that had been swallowed finally demanded to be spoken." = "吞回去的一切，终于要求被说出来。"
"The release left everyone a little raw, and a little lighter." = "宣泄使人人都略感刺痛，也略感轻快。"
"It had been building for a long time. It all came out at once." = "它已积蓄很久，如今一次全部涌出。"
"There was no controlling it, once it started." = "一旦开始，就再无法控制。"
"Something in the chest finally, finally let go." = "胸口的某样东西终于、终于松开了。"
"The silence that had been kept for so long broke, all at once." = "保持许久的沉默一下子破碎。"
"It was messy, and loud, and long overdue." = "它凌乱、响亮，而且早该如此。"
"Whatever had been pent up came out in a single, overwhelming rush." = "所有积压的东西，以一次压倒性的奔涌喷出。"
"The relief afterward was almost as intense as the release itself." = "事后的释然，几乎与宣泄本身一样强烈。"
"It had needed to happen for a long time. Now, finally, it had." = "很久以前就需要如此，如今终于发生了。"
"Nothing about it was graceful. All of it was necessary." = "这一切毫不优雅，却全都必要。"
"The weight lifted, suddenly and completely." = "重压突然完全消失。"
"What came out could not have stayed in much longer." = "涌出的东西，原本也无法再多压抑多久。"
"It was exhausting, and cleansing, in equal measure." = "它同样令人疲惫，也同样令人洁净。"
"It was done. The emptiness that followed was vast." = "完成了。随后的空虚广大无边。"
"The victory felt like nothing. Or worse -- it felt like loss." = "胜利毫无感觉。甚至更糟，像是失去。"
"Whatever had been expected to follow this did not arrive." = "原本期待随之而来的一切，都没有到来。"
"There should have been relief. There was only emptiness." = "本该释然，剩下的却只有空虚。"
"The thing that had driven everything for so long was gone now, and nothing had filled the space it left." = "驱动一切许久的东西如今已消失，却无物填补它留下的位置。"
"Winning had not felt like this was supposed to feel." = "获胜的感觉，本不该是这样。"
"Something was missing from the moment that should have been complete." = "本该完整的一刻，却缺了什么。"
"The satisfaction never came. Only quiet." = "满足从未到来。只有安静。"
"It felt like arriving somewhere only to find nothing there." = "感觉像抵达某处，却发现那里空无一物。"
"All that effort, and this was what remained: nothing much at all." = "费尽心力，剩下的却是这些：几乎什么都没有。"
"The moment passed without meaning anything at all." = "这一刻毫无意义地过去了。"
"It should have mattered more than it did." = "它本该比实际上更重要。"
"There was a hole where triumph was supposed to be." = "胜利本应在的位置，留下了一个洞。"
"Nothing filled the space that finishing left behind." = "完成之后留下的空位，无物填补。"
"The end had come, and brought with it only a strange, flat quiet." = "结局到来，只带来古怪而平淡的安静。"
"It felt less like an ending and more like an absence." = "与其说是结束，更像是缺席。"
"Whatever had been hoped for did not show up, even now." = "即使如今，期盼的东西也仍未出现。"
"The achievement sat there, unclaimed by any real feeling." = "成就摆在那里，没有任何真切感情去认领。"
"It was over, and being over did not feel like anything." = "结束了，而结束也没有任何感觉。"
"What should have felt like enough did not feel like enough at all." = "本该足够的东西，一点也不令人觉得足够。"
"Silence. The kind that demands respect." = "寂静。那种要求敬意的寂静。"
"The words, when they came, were chosen with the care of a mason choosing stones." = "话语到来时，被精心挑选，如石匠选石。"
"Some things deserve to be approached quietly." = "有些事值得安静地接近。"
"No one spoke loudly here. It did not feel like a place for loud things." = "这里无人高声说话，感觉就不是容得下喧哗的地方。"
"There was a weight to this place that asked for stillness." = "此地有一种重量，要求人们静下来。"
"Every gesture here was made with unusual care." = "这里每个举动都格外谨慎。"
"This was not a place for idle words." = "这里不容闲言。"
"Something about the moment asked everyone to be smaller, and quieter, than usual." = "这一刻有些什么，要求人人比平常更渺小、更安静。"
"Respect, here, did not need to be requested. It was simply given." = "在这里，无须索取尊重，人们自会给出。"
"The hush that fell was not empty. It was full of meaning." = "落下的静默并不空洞，而是意味深长。"
"Some silences are a kind of tribute." = "有些沉默也是一种致敬。"
"Nothing here was said carelessly." = "这里没有一句话说得轻率。"
"The moment asked for reverence, and received it." = "这一刻要求虔敬，也得到了虔敬。"
"There was a solemnity to the air that no one questioned." = "空气中有一种庄严，无人质疑。"
"Some things are too important to be spoken of quickly." = "有些事太重要，不能匆匆说起。"
"Everyone present understood, without being told, to tread carefully." = "无须说明，每个在场者都懂得谨慎前行。"
"The stillness here felt earned, and necessary." = "这里的静谧来之有因，也十分必要。"
"This was a moment to be honored, not rushed." = "这一刻应该被敬重，不该被催促。"
"Every word carried more weight than usual, and was treated accordingly." = "每个词都比往常更有分量，也被相应地郑重对待。"
"The quiet was a kind of offering." = "这份安静也是一种供奉。"
"The world was bright, and beautiful, and worth celebrating." = "世界明亮、美丽，值得庆祝。"
"Let this be remembered. Let this endure." = "让这一切被铭记，让这一切长存。"
"This was a moment worth carving into stone." = "这是值得刻入石头的一刻。"
"Everything, for once, felt as grand as it deserved to." = "终于，每件事都显得如其应有的那般宏伟。"
"Let it be said, plainly: this mattered." = "让我们直言：此事重要。"
"The moment deserved every bit of the celebration it received." = "这一刻配得上所获得的全部庆祝。"
"This was worth singing about, and someone, somewhere, would." = "这值得歌唱，也会有某个人在某个地方歌唱。"
"Greatness, when it appears, should be recognized as such." = "伟大出现时，理应被认作伟大。"
"Let history record this exactly as it happened." = "让历史如实记下这一切。"
"This was the kind of moment stories are built around." = "故事正是围绕这样的时刻写成。"
"Something magnificent had happened, and everyone present knew it." = "壮美之事已经发生，每个在场者都知道。"
"The world felt, briefly, exactly as grand as it was supposed to be." = "世界短暂地显得恰如它应有的那般宏伟。"
"This deserved to be more than remembered -- it deserved to be honored." = "这不仅值得铭记，更值得敬重。"
"Let this stand as proof of what was possible." = "让此事成为可能性的证明。"
"Every part of the moment felt larger than life, because it was." = "这一刻处处都超越平凡，因为它确实如此。"
"This was the kind of thing worth building monuments to." = "这样的事，值得为之建造纪念碑。"
"Let no one forget what happened here." = "愿无人忘记这里发生的一切。"
"The moment glowed with a significance that needed no explanation." = "这一刻闪耀着无需解释的意义。"
"This was greatness, plainly and simply." = "这就是伟大，清楚而简单。"
"Let this be the story told for generations." = "让这个故事传诵世世代代。"
"In the quiet, there was room for thought." = "安静中，有了思考的空间。"
"The mind turned inward, and what it found there was complex." = "思绪转向内心，发现那里十分复杂。"
"There was no rush to reach a conclusion." = "不急于得出结论。"
"Some thoughts need silence to unfold properly." = "有些想法需要寂静，才能充分展开。"
"The question did not have an easy answer, and there was time to sit with that." = "这个问题没有简单答案，而现在有时间与它相处。"
"It was worth thinking about, slowly, without hurrying toward an answer." = "这值得慢慢思考，不急着寻找答案。"
"The mind wandered, unhurried, through everything it had seen." = "思绪从容地游走在所见的一切之中。"
"Not every thought needed to resolve into something." = "并非每个念头都必须得出什么结果。"
"There was a kind of comfort in simply turning the question over." = "单是反复思量这个问题，也有一种安慰。"
"Some things become clearer only when given time to sit." = "有些事只有静置一段时间，才会更清楚。"
"The quiet made room for questions that noise usually crowded out." = "寂静为平常被喧嚣挤走的问题腾出位置。"
"It was a moment for thinking, not for deciding." = "这是思考的时刻，而非决定的时刻。"
"The mind circled the idea slowly, unwilling to rush past it." = "思绪缓慢绕着这个想法，不肯匆匆掠过。"
"Some understanding only arrives after long, unhurried consideration." = "有些理解，只有经过漫长而从容的考虑才会到来。"
"There was value in simply not knowing yet." = "暂时不知道，本身也有价值。"
"The thought did not resolve easily, and did not need to." = "这个念头不易得出结论，也无须如此。"
"It was worth sitting with the discomfort of an open question." = "未解的问题令人不适，却值得静静面对。"
"Nothing here demanded an answer immediately." = "这里没有什么要求立即作答。"
"The mind, given quiet, found its way to unexpected places." = "心灵获得安静后，会走向意想不到的地方。"
"Some truths only reveal themselves slowly, to those willing to wait for them." = "有些真相，只向愿意等候的人缓缓展露。"
"The loss was fresh, and raw, and total." = "失去是新鲜、刺痛而彻底的。"
"Grief is not a feeling. It is a place. And {@bt_a|::subscribed_books::vocabulary::person} was lost in it." = "悲伤不是一种感觉，而是一个地方。{@bt_a|::subscribed_books::vocabulary::person}迷失在其中。"
"{@bt_a|::subscribed_books::vocabulary::person} had not yet found the words for what had been lost." = "{@bt_a|::subscribed_books::vocabulary::person}还找不到话语，描述失去了什么。"
"There was no getting around it. {@bt_a|::subscribed_books::vocabulary::person} would have to go through it." = "无法绕过。{@bt_a|::subscribed_books::vocabulary::person}必须穿过它。"
"{@bt_a|::subscribed_books::vocabulary::person} kept expecting it not to be true. It kept being true." = "{@bt_a|::subscribed_books::vocabulary::person}不断期待这不是真的，它却不断成为事实。"
"The grief had not settled into anything manageable yet." = "悲伤还没有沉淀成能够应付的模样。"
"{@bt_a|::subscribed_books::vocabulary::person} moved through the day as though underwater, everything muffled and slow." = "{@bt_a|::subscribed_books::vocabulary::person}度过一天，如同潜在水下，一切模糊而缓慢。"
"Nothing felt real to {@bt_a|::subscribed_books::vocabulary::person} yet. Everything felt real all at once." = "对{@bt_a|::subscribed_books::vocabulary::person}而言，一切都还不真实，却又同时全然真实。"
"{@bt_a|::subscribed_books::vocabulary::person} did not know how to carry something this heavy." = "{@bt_a|::subscribed_books::vocabulary::person}不知道该怎样背起这么沉的东西。"
"The absence followed {@bt_a|::subscribed_books::vocabulary::person} everywhere, impossible to set down." = "缺席跟随{@bt_a|::subscribed_books::vocabulary::person}到每个地方，无法放下。"
"{@bt_a|::subscribed_books::vocabulary::person} had not cried yet. That would come later, and it would not be gentle." = "{@bt_a|::subscribed_books::vocabulary::person}还未哭泣。那将稍后到来，绝不会温柔。"
"Grief, for {@bt_a|::subscribed_books::vocabulary::person}, had no edges. It simply filled everything." = "对{@bt_a|::subscribed_books::vocabulary::person}而言，悲伤没有边缘，只是填满一切。"
"{@bt_a|::subscribed_books::vocabulary::person} kept reaching for something that was no longer there." = "{@bt_a|::subscribed_books::vocabulary::person}不断伸手去找已经不在的东西。"
"There was no version of today that {@bt_a|::subscribed_books::vocabulary::person} was prepared for." = "无论今天会怎样，{@bt_a|::subscribed_books::vocabulary::person}都没有准备好。"
"{@bt_a|::subscribed_books::vocabulary::person} did not want comfort. {@bt_a2|::subscribed_books::vocabulary::person} wanted the loss undone, which no one could offer." = "{@bt_a|::subscribed_books::vocabulary::person}不想要安慰。{@bt_a2|::subscribed_books::vocabulary::person}想让失去撤销，但没人能给。"
"The weight of it sat on {@bt_a|::subscribed_books::vocabulary::person} like something physical." = "它的重量像实体一样压在{@bt_a|::subscribed_books::vocabulary::person}身上。"
"{@bt_a|::subscribed_books::vocabulary::person} had entered a country with no maps, and no way back." = "{@bt_a|::subscribed_books::vocabulary::person}走进了没有地图、没有归路的国度。"
"Nothing about this made sense to {@bt_a|::subscribed_books::vocabulary::person} yet, and might never." = "这一切对{@bt_a|::subscribed_books::vocabulary::person}仍说不通，也许永远说不通。"
"{@bt_a|::subscribed_books::vocabulary::person} was, for now, simply lost in it." = "目前，{@bt_a|::subscribed_books::vocabulary::person}只是迷失其中。"
"The grief would change shape eventually. For now, {@bt_a|::subscribed_books::vocabulary::person} only had to survive it." = "悲伤终会改变模样。眼下，{@bt_a|::subscribed_books::vocabulary::person}只需活着熬过去。"
"The memory was sweet. The knowing that it was gone was not." = "记忆甜美。知道它已经消失，却并不甜美。"
"It was good, once. That it had ended did not undo the good." = "它曾经美好。结束并未消除那份美好。"
"Some things are worth remembering even though remembering hurts a little." = "有些事值得记住，即便回忆会略微刺痛。"
"The joy of what had been did not erase the ache of its absence." = "昔日的欢喜，并未消除它缺席的痛。"
"It was a happy memory, wrapped around a small, permanent loss." = "这是一段快乐的记忆，包裹着小小而永久的失去。"
"Looking back felt like reopening something gentle and sad at once." = "回头望去，仿佛同时重新打开了温柔和悲伤。"
"What had been good was still good, even in the past tense." = "曾经美好的仍然美好，哪怕已成过去时。"
"There was a smile in it, and underneath the smile, something quieter and sadder." = "其中有微笑，微笑之下却有更安静、更悲伤的东西。"
"Nothing about the memory was ruined. It was simply, now, finished." = "记忆中没有什么被毁掉，只是如今已经结束。"
"The sweetness of it made the ending harder, not easier." = "它的甜美使结束更难承受，并非更容易。"
"It was the kind of memory that made you smile and ache in the same breath." = "这种记忆让人同一次呼吸里既微笑，又疼痛。"
"Some things end well and still leave something behind that aches." = "有些事结束得很好，仍会留下隐隐作痛的东西。"
"The good had been real. So, now, was its absence." = "美好曾经真实，如今它的缺席也同样真实。"
"It was impossible to think of one without the other -- the joy, and the loss of it." = "不可能只想其一而不想其二：欢喜，以及失去欢喜。"
"The past held onto its warmth, even as it slipped further away." = "过去保持着温度，尽管它正越走越远。"
"Nothing was wrong with remembering. It just was not painless." = "回忆并无错，只是并不无痛。"
"What had been shared was worth having, even knowing it would end." = "共同拥有的东西值得拥有，即便知道它会结束。"
"The memory glowed, faintly, with something that was almost grief." = "记忆隐隐发光，其中某种东西近似悲伤。"
"It was a good thing, once. That it was gone did not make it less good." = "它曾经美好。消失并未使它不那么美好。"
"Some happiness only reveals its full weight once it is over." = "有些幸福，结束后才显出全部的分量。"
"Acceptance came, not with peace, but with exhaustion." = "接受随疲惫而来，并非随平静而来。"
"There was nothing left to fight. And so {@bt_a|::subscribed_books::vocabulary::person} stopped fighting." = "再没有什么可抗争。于是{@bt_a|::subscribed_books::vocabulary::person}停止了抗争。"
"{@bt_a|::subscribed_books::vocabulary::person} had run out of reasons to keep struggling against it." = "{@bt_a|::subscribed_books::vocabulary::person}再找不到继续与它挣扎的理由。"
"It was not surrender exactly. It was simply running out of road." = "不全是投降，只是无路可走。"
"{@bt_a|::subscribed_books::vocabulary::person} let it happen, because there was no longer a way to stop it." = "{@bt_a|::subscribed_books::vocabulary::person}让它发生，因为再无法阻止。"
"The fight had gone out of {@bt_a|::subscribed_books::vocabulary::person}, quietly, sometime before {@bt_a2|::subscribed_books::vocabulary::person} noticed." = "{@bt_a|::subscribed_books::vocabulary::person}的斗志早在{@bt_a2|::subscribed_books::vocabulary::person}留意到之前，就已悄悄消失。"
"{@bt_a|::subscribed_books::vocabulary::person} stopped asking why. The question had stopped mattering." = "{@bt_a|::subscribed_books::vocabulary::person}不再问为什么。那个问题已不再重要。"
"There was a strange relief in giving up trying to change it." = "放弃改变它的努力，带来一种古怪的释然。"
"{@bt_a|::subscribed_books::vocabulary::person} accepted it the way one accepts weather -- without agreeing, only enduring." = "{@bt_a|::subscribed_books::vocabulary::person}接受它，正如接受天气，不赞同，只忍耐。"
"The struggle had cost more than {@bt_a|::subscribed_books::vocabulary::person} had left to spend." = "挣扎花去的，比{@bt_a|::subscribed_books::vocabulary::person}还能付出的更多。"
"{@bt_a|::subscribed_books::vocabulary::person} let go, not because it was right, but because holding on had become impossible." = "{@bt_a|::subscribed_books::vocabulary::person}放手，并非因为这样正确，而是已无法抓住。"
"It was easier, in the end, for {@bt_a|::subscribed_books::vocabulary::person} to simply stop resisting." = "最终，对{@bt_a|::subscribed_books::vocabulary::person}而言，停止抵抗更容易。"
"{@bt_a|::subscribed_books::vocabulary::person} had nothing left to offer the fight." = "{@bt_a|::subscribed_books::vocabulary::person}再没有什么可投入抗争。"
"This was not peace. It only looked like peace from a distance." = "这不是和平，只是从远处看像和平。"
"{@bt_a|::subscribed_books::vocabulary::person} settled into the outcome the way one settles into cold water -- slowly, and without choice." = "{@bt_a|::subscribed_books::vocabulary::person}接受结果，如同进入冷水，缓慢而别无选择。"
"There was no more use in wishing it were otherwise." = "再希望它不同，已毫无用处。"
"{@bt_a|::subscribed_books::vocabulary::person} had exhausted every alternative. Only this remained." = "{@bt_a|::subscribed_books::vocabulary::person}已耗尽每种其他可能，只剩这个。"
"It was over, and {@bt_a|::subscribed_books::vocabulary::person} was too tired to pretend otherwise." = "结束了，而{@bt_a|::subscribed_books::vocabulary::person}太累，无力假装并非如此。"
"{@bt_a|::subscribed_books::vocabulary::person} stopped waiting for it to get better." = "{@bt_a|::subscribed_books::vocabulary::person}不再等待它好转。"
"Whatever came next, {@bt_a|::subscribed_books::vocabulary::person} would simply accept it now." = "不论接下来发生什么，如今{@bt_a|::subscribed_books::vocabulary::person}都只会接受。"
"The world had been quiet for {@bt_a|::subscribed_books::vocabulary::person}. Too quiet, perhaps. The kind of quiet that precedes a storm." = "对{@bt_a|::subscribed_books::vocabulary::person}而言，世界一直很安静。也许太安静了。那是风暴前的寂静。"
"It began, as these things often do, with a visitor and a question that could not be ignored." = "事情的开端，正如这类事常有的开端，是一位访客，以及一个无法回避的问题。"
"{@bt_a|::subscribed_books::vocabulary::person} had lived a simple life until this moment. That simplicity was about to end." = "在此之前，{@bt_a|::subscribed_books::vocabulary::person}的生活很简单。这份简单就要结束。"
"{@bt_a|::subscribed_books::vocabulary::person} wanted no part of it. The road ahead was dark, uncertain, and almost certainly dangerous." = "{@bt_a|::subscribed_books::vocabulary::person}不想参与。前路黑暗、难测，几乎肯定充满危险。"
"\"I am not the one you need,\" {@bt_a|::subscribed_books::vocabulary::person} insisted. But the words rang hollow, even to {a_pos} own ears." = "“我不是你需要的那个人。”{@bt_a|::subscribed_books::vocabulary::person}坚持说。但这话连在{a_pos}自己耳中，都显得空洞。"
"There was no going back. The moment {@bt_a|::subscribed_books::vocabulary::person} crossed that threshold, the old life was gone." = "再无归路。{@bt_a|::subscribed_books::vocabulary::person}跨过门槛的瞬间，旧日生活就已消失。"
"The journey began not with a shout or a battle cry, but with a single, quiet step." = "旅程并非从叫喊或战吼开始，而是从安静的一小步开始。"
"The world tested {@bt_a|::subscribed_books::vocabulary::person}. It tested {a_pos} strength, {::subscribed_books::arcs::ref_repeat_1} resolve, {::subscribed_books::arcs::ref_repeat_2} capacity for pain." = "世界考验着{@bt_a|::subscribed_books::vocabulary::person}，考验{a_pos}力量、{::subscribed_books::arcs::ref_repeat_1}意志，以及{::subscribed_books::arcs::ref_repeat_2}忍痛能力。"
"What followed was the kind of ordeal that either forged heroes or destroyed them." = "随后的磨难，既可能锻造英雄，也可能毁掉英雄。"
"Not all strength comes from within. {@bt_a|::subscribed_books::vocabulary::person} was about to learn the value of trust." = "并非所有力量都源自内心。{@bt_a|::subscribed_books::vocabulary::person}就要明白信任的价值。"
"In the darkest moments, help came from an unexpected quarter." = "最黑暗的时刻，帮助来自意料之外。"
"Everything had been building to this. The confrontation that could not be avoided." = "一切都在酝酿着这场无法避免的对决。"
"The moment of reckoning arrived, and it was more terrible than anyone had imagined." = "清算的时刻到来，比任何人想象的都更可怕。"
"Victory, when it came, was sweeter than {@bt_a|::subscribed_books::vocabulary::person} had dared to hope." = "胜利到来时，比{@bt_a|::subscribed_books::vocabulary::person}敢于期望的还要甜美。"
"The ordeal was over. What remained was the quiet work of putting the world back together." = "磨难结束了。剩下的是安静地重整世界。"
"{@bt_a|::subscribed_books::vocabulary::person} came home. But home, like {@bt_a2|::subscribed_books::vocabulary::person}, had changed." = "{@bt_a|::subscribed_books::vocabulary::person}回家了。但家和{@bt_a2|::subscribed_books::vocabulary::person}一样，都已经改变。"
"The journey was over. The traveler who returned was not the one who had left." = "旅程结束了。归来的旅人，已不再是离去时那人。"
"Before the tragedy, there was a beginning. Every fall starts from a height." = "悲剧之前，先有开端。每一次坠落，都从高处开始。"
"The audience is asked to observe. What follows is not entertainment. It is a warning." = "请观众看着。接下来不是娱乐，而是警告。"
"{@bt_a|::subscribed_books::vocabulary::person} stood at the peak of {a_pos} power, and saw no limit to what {a_pro} could achieve." = "{@bt_a|::subscribed_books::vocabulary::person}站在权力巅峰，看不见{a_pro}所能成就之事的界限。"
"Pride. The oldest sin, and the most seductive. {@bt_a|::subscribed_books::vocabulary::person} embraced it without hesitation." = "骄傲。最古老、也最诱人的罪。{@bt_a|::subscribed_books::vocabulary::person}毫不犹豫地拥抱了它。"
"The scheme was elegant, patient, and utterly without mercy." = "这个阴谋精巧、耐心，毫无怜悯。"
"While {@bt_a|::subscribed_books::vocabulary::person} looked elsewhere, the trap was being set." = "{@bt_a|::subscribed_books::vocabulary::person}看向别处时，陷阱正在布下。"
"The reversal came without warning. Everything {@bt_a|::subscribed_books::vocabulary::person} had built began to crumble." = "逆转毫无预警地到来。{@bt_a|::subscribed_books::vocabulary::person}建立的一切开始崩塌。"
"Fortune turned. It turned with the cold precision of a blade." = "命运转向，以刀刃般冰冷的精确。"
"And then {@bt_a|::subscribed_books::vocabulary::person} understood. The truth was terrible, and it was complete." = "然后，{@bt_a|::subscribed_books::vocabulary::person}明白了。真相可怕，而且完整。"
"Recognition came too late, as it always does in stories like this." = "顿悟来得太晚，这类故事向来如此。"
"The end was inevitable. It had been inevitable from the beginning." = "结局不可避免。从开始时就不可避免。"
"What happened next was not a battle. It was a reckoning." = "接下来发生的不是战斗，而是清算。"
"The stage emptied. What remained was silence, and the weight of what had been lost." = "舞台空了。留下的是沉默，以及失去的一切的重量。"
"Let the audience remember. This is how it ended. This is what pride costs." = "请观众铭记。这就是它如何结束。这就是骄傲的代价。"
"It started simply enough. These things always do." = "开头很简单。这类事总是如此。"
"No one could have predicted what would happen next. Least of all {@bt_a|::subscribed_books::vocabulary::person}." = "没人能料到接下来会发生什么，尤其是{@bt_a|::subscribed_books::vocabulary::person}。"
"The confusion was total, magnificent, and entirely avoidable." = "混乱彻底、壮观，而且完全本可避免。"
"What followed was the sort of misunderstanding that could only occur between people who were absolutely certain they understood each other." = "随后的误会，只可能发生在那些坚信自己完全理解彼此的人之间。"
"Things got worse. Naturally." = "事情变得更糟。自然如此。"
"The situation, already absurd, proceeded to become more so." = "本已荒谬的局面，继续变得更加荒谬。"
"The chaos reached its zenith. No one was in control. No one had been for some time." = "混乱到达顶点。无人掌控，早有一阵子无人掌控。"
"Everything that could go wrong did. And then some things went wrong that no one had even considered possible." = "所有可能出错的事都出了错。接着，连没人想过可能的事也出了错。"
"And then, somehow, it was over. The pieces fell into place with the satisfying click of a puzzle solved." = "然后，不知怎么，一切结束了。碎片各就各位，如拼图解开时令人满足的一声轻响。"
"The resolution came with laughter, tears, and the shared understanding that none of this should have happened." = "结局带来了笑声、眼泪，以及共同的认识：这一切原本都不该发生。"
"The argument had escalated beyond the capacity of words to contain it." = "争论升级到话语已无法容纳的地步。"
"It was not a battle in any heroic sense. It was two people who had run out of arguments and had only fists left." = "这算不上任何英雄式的战斗，只是两个人说尽了争辩，剩下的只有拳头。"
"The peace was shattered. A new danger had arrived, and it did not care about anyone's feelings." = "和平破碎了。新的危险来到，毫不在意任何人的感受。"
"Into the quiet of their happiness came a shadow. The threat was real, immediate, and indifferent to love." = "幸福的安静中，投下一道阴影。威胁真实而迫在眉睫，对爱情毫不动心。"
"There are things worth fighting for. {@bt_a|::subscribed_books::vocabulary::person} had found one." = "有些东西值得为之战斗，{@bt_a|::subscribed_books::vocabulary::person}找到了一件。"
"The battle was not sought. It was forced. And when it came, {@bt_a|::subscribed_books::vocabulary::person} met it without hesitation." = "战斗并非主动寻求，而是被迫而来。它到来时，{@bt_a|::subscribed_books::vocabulary::person}毫不犹豫地迎上。"
"The attack came without warning. Someone wanted this investigation to end." = "袭击毫无预警。有人希望调查就此终止。"
"{@bt_a|::subscribed_books::vocabulary::person} had been getting too close. The ambush was proof." = "{@bt_a|::subscribed_books::vocabulary::person}已经接近得太过。这次伏击就是证明。"
"The wrong was absolute. There was no justification, no excuse, and no forgiveness." = "这份冤屈彻底，没有理由，没有借口，也没有宽恕。"
"It began with an act of cruelty that would define the rest of this story." = "开端是一件残酷之事，它将定义这个故事的其余部分。"
"{@bt_a|::subscribed_books::vocabulary::person} made a promise. Not to the gods, not to {a_pos} family, but to {a_reflexive}. And {a_pro} intended to keep it." = "{@bt_a|::subscribed_books::vocabulary::person}许下承诺，不向众神，不向{a_pos}家人，而向{a_reflexive}。{a_pro}打算兑现。"
"The oath was silent, private, and unbreakable." = "誓言无声、私密，不可打破。"
"{@bt_a|::subscribed_books::vocabulary::person} began to prepare. Methodically. Patiently. With the cold focus of someone who has all the time in the world." = "{@bt_a|::subscribed_books::vocabulary::person}开始准备，有条不紊，耐心十足，像拥有无限时间的人那样冷静专注。"
"Revenge is a dish best served cold. {@bt_a|::subscribed_books::vocabulary::person} was letting it freeze." = "复仇宜冷不宜热。{@bt_a|::subscribed_books::vocabulary::person}正让它结冰。"
"The hunt began. {@bt_a|::subscribed_books::vocabulary::person} was patient, and patience was the deadliest weapon of all." = "追猎开始。{@bt_a|::subscribed_books::vocabulary::person}耐心十足，而耐心是最致命的武器。"
"{@bt_a|::subscribed_books::vocabulary::person} closed the distance. Day by day, step by step, the gap narrowed." = "{@bt_a|::subscribed_books::vocabulary::person}拉近距离。日复一日，步复一步，间隙渐渐缩小。"
"They met. There was nothing left to say." = "他们相遇了。再无话可说。"
"The moment had arrived. Every step of the journey had led here." = "那一刻到来。旅途的每一步都通向此处。"
"It was over. The satisfaction {@bt_a|::subscribed_books::vocabulary::person} had expected did not come. In its place was something quieter, and more permanent." = "结束了。{@bt_a|::subscribed_books::vocabulary::person}期待的满足没有到来，取而代之的是更安静、更持久的东西。"
"The revenge was complete. The emptiness that followed was its own punishment." = "复仇完成了。随后的空虚，本身就是惩罚。"
"Their eyes met across the room. The moment was ordinary. The feeling was not." = "他们隔着房间目光相遇。时刻平凡，感受却非如此。"
"They met by chance. Or by fate. Or by the kind of coincidence that stories are built on." = "他们偶然相遇。或者出于命运，或者出于故事赖以成立的那种巧合。"
"What followed was the oldest dance in the world. Two souls, circling each other, drawn together by something neither fully understood." = "随后是世界上最古老的舞步。两个灵魂围绕彼此，被双方都未完全理解的东西吸引。"
"The courtship was tentative, clumsy, and entirely sincere." = "求爱试探、笨拙，却全然真诚。"
"Love, as always, was not enough. The world had other plans." = "爱情照例不够。世界另有安排。"
"The obstacle between them was not distance or circumstance. It was something harder to overcome." = "挡在两人之间的不是距离或境遇，而是更难克服的东西。"
"They parted. The separation was necessary, and devastating, and incomplete." = "他们分开了。这分离必要、毁灭性十足，又不彻底。"
"The distance between them grew, but the connection did not break. Not entirely." = "两人的距离扩大，联系却未断，至少未全断。"
"They found each other again. The world had changed. They had changed. But the core of what they were to each other had survived." = "他们再次找到彼此。世界变了，他们变了，但彼此关系的核心幸存下来。"
"The reunion was quiet. The words came later. First, there was simply the relief of presence." = "重逢很安静。话语稍后才来。最先只是对方在场所带来的释然。"
"Something was wrong. The evidence was there, for those who knew where to look." = "有什么不对。证据就在那里，留给知道该向何处看的人。"
"The discovery changed everything. Nothing that came before could be trusted." = "发现改变了一切。此前的事再无可信。"
"Questions led to more questions. Every answer opened a new door, and behind every door was another question." = "问题引出更多问题。每个答案打开新门，而每扇门后又是另一个问题。"
"{@bt_a|::subscribed_books::vocabulary::person} dug deeper. The truth was buried, but not deep enough." = "{@bt_a|::subscribed_books::vocabulary::person}继续深挖。真相埋着，却埋得不够深。"
"The trail went cold. Or rather, it went somewhere misleading." = "线索断了。更确切地说，它走向了误导的方向。"
"The false lead was convincing. It was meant to be." = "错误线索很有说服力，那正是它的目的。"
"The truth, when it came, was worse than the mystery." = "真相到来时，比谜团更糟。"
"Everything fell into place. The picture was clear, and it was ugly." = "一切拼合起来。画面清楚，而且丑陋。"
"Knowledge demanded action. {@bt_a|::subscribed_books::vocabulary::person} acted." = "知识要求行动。{@bt_a|::subscribed_books::vocabulary::person}行动了。"
"The truth was known. What remained was to decide what to do about it." = "真相已知。剩下的是决定该如何对待它。"
"Let the words rise. Let them be heard by those who listen." = "让话语升起，让愿意聆听的人听见。"
"In the beginning, there is the voice. And the voice speaks of what endures." = "开端有声音。声音讲述长存之物。"
"Let this be celebrated. Let the world know what was accomplished here." = "让此事受到庆祝。让世界知道这里的成就。"
"There are deeds worth singing. This is one of them." = "有些壮举值得歌唱。这就是其中之一。"
"And so the song ends. But the echo remains." = "歌声就此结束，回声却仍在。"
"What was praised endures. What was mourned is not forgotten." = "受赞颂的继续存在，受哀悼的不会被忘记。"
"This is what was lost. Let the record show what the world gave up." = "这就是失去的一切。让记录说明世界放弃了什么。"
"The absence is louder than the presence ever was." = "缺席比曾经的存在更响亮。"
"Remember. That is all that is asked. Remember." = "记住。所求只有这一件：记住。"
"The memory persists. It persists because it matters." = "记忆长存，因为它重要。"
"And so, in the end, there is acceptance. Not peace -- never quite peace. But acceptance." = "最终迎来的是接受。不是安宁，永远不全是安宁，但仍是接受。"
"The wound does not heal. But the bearer learns to walk with it." = "伤口不会愈合，承受者却学会了带着它行走。"
"{Pro} wore these qualities the way others wore armor -- as protection against a world that was not always kind." = "{Pro}披着这些性情，如别人穿着盔甲，以防护并不总是善待人的世界。"
"{Pro} kept these qualities close, revealed only when there was no other choice, like a shield raised at the last moment." = "{Pro}把这些性情藏在身边，别无选择时才显露，如最后一刻才举起的盾。"
"These were not qualities {@bt_name|::subscribed_books::vocabulary::person} advertised. They were kept behind a careful distance, deployed only when needed." = "{@bt_name|::subscribed_books::vocabulary::person}从不宣扬这些性情。它们藏在谨慎的距离之后，只在需要时才拿出。"
"{Pro} carried these qualities openly, without apology and without the faintest concern for what anyone thought of them." = "{Pro}公开带着这些性情，毫无歉意，也丝毫不在乎别人怎么看。"
"{@bt_name|::subscribed_books::vocabulary::person} made no effort to hide any of it. Shame, evidently, was a quality {pro} had never developed." = "{@bt_name|::subscribed_books::vocabulary::person}完全不想掩藏。显然，羞耻这种品质，{pro}从未学会。"
"There was no pretense here, no attempt at softening. {Pro} simply was what {::subscribed_books::arcs::ref_repeat_3} was, and let the world adjust." = "这里没有伪装，也没有粉饰。{Pro}就是{::subscribed_books::arcs::ref_repeat_3}本来的样子，让世界自行适应。"
"{Pro} wore these qualities plainly, like a badge rather than a shield -- there was nothing here {::subscribed_books::arcs::ref_repeat_3} felt the need to hide." = "{Pro}坦然展示这些性情，如佩戴徽章而非盾牌，因为{::subscribed_books::arcs::ref_repeat_3}无须掩藏。"
"These were not defenses. They were simply who {@bt_name|::subscribed_books::vocabulary::person} was, offered freely to anyone who cared to look." = "这些不是防御，只是{@bt_name|::subscribed_books::vocabulary::person}本来的模样，自由展现给每个愿意看的人。"
"{Pro} carried these qualities the way a person carries a favorite coat: comfortably, and without a second thought." = "{Pro}带着这些性情，如穿着最喜欢的外套，舒适而无需多想。"
"{Pro} carried these qualities quietly, without display, the way a person carries something they have long since stopped noticing." = "{Pro}安静地带着这些性情，毫不展示，如随身带着早已不再留意的东西。"
"These were not qualities {@bt_name|::subscribed_books::vocabulary::person} performed. They simply were, present in the small choices no one else saw." = "这些不是{@bt_name|::subscribed_books::vocabulary::person}刻意表演的品质，只是存在于旁人看不见的小小选择中。"
"{Pro} wore these qualities the way a stone wears the weather: slowly, unremarkably, and without complaint." = "{Pro}披着这些性情，如石头经受风雨，缓慢、平凡，毫无怨言。"
"Whatever civility remained between them was long since spent." = "两人之间残存的礼数，早已消耗殆尽。"
"Neither bothered anymore to hide the contempt." = "双方再懒得掩藏轻蔑。"
"Mutual disdain eclipsed any remnants of shared respect." = "相互的鄙视遮蔽了任何残存的敬意。"
"Their conversations were brief, laced with sharp sarcasm." = "他们对话简短，满是尖刻的讥讽。"
"Neither could afford the luxury of polite silence." = "双方都已无力享有礼貌沉默的奢侈。"
"The air between them crackled with unspoken threats." = "两人之间的空气，噼啪闪着未说出口的威胁。"
"Each interaction felt like a duel of wits and barbs." = "每次交流都像机锋与尖刺的决斗。"
"They avoided eye contact, preferring to glare through distance." = "他们避免目光相接，宁愿隔着距离怒视。"
"No gesture could bridge the chasm of mutual contempt." = "没有任何姿态，能跨越相互轻蔑的鸿沟。"
"Their shared history was a battlefield of broken promises." = "他们共同的历史，是破碎承诺构成的战场。"
"Words between them carried knives rather than kindness." = "他们之间的话语带着刀刃，而非善意。"
"The tension between them was a palpable, oppressive presence." = "他们之间的紧张，切实而压抑地存在着。"
"They spoke in clipped sentences, never offering apologies." = "他们用短促的句子交谈，从不道歉。"
"The silence that followed each argument was deafening." = "每次争论后的沉默，震耳欲聋。"
"Each encounter left a lingering sense of hostility." = "每次相遇都留下挥之不去的敌意。"
"They treated each other as obstacles to be avoided." = "他们把彼此当作需要避开的障碍。"
"The trust that once existed was a distant memory." = "曾有的信任，已成遥远的记忆。"
"Their rivalry was fueled by relentless mutual scorn." = "无休止的相互鄙夷，助长着他们的竞争。"
"Even laughter between them was tinged with bitterness." = "即便彼此间的笑声，也染着苦涩。"
"They refused to acknowledge any shared goodwill." = "他们拒绝承认曾有任何共同的善意。"
"The warmth that might once have been there had cooled." = "也许曾存在的温情，如今已经冷却。"
"They spoke now the way strangers do." = "如今他们说话，如陌生人一般。"
"There was an ease between them that neither had to work for." = "他们之间有一种无需费力的自在。"
"Whatever else was true, this much was easy." = "无论其他事如何，至少这一点轻松。"
"Between them lay a trust neither had ever had reason to question." = "两人之间的信任，谁都未曾有理由怀疑。"
"This was not a bond either of them measured anymore -- it simply was." = "他们已不再衡量这份纽带，它只是存在着。"
"{gift_noun} was still there, a reminder of what {@bt_giver|::subscribed_books::vocabulary::person} had given." = "{gift_noun}仍在，提醒着{@bt_giver|::subscribed_books::vocabulary::person}曾经的赠予。"
"{@bt_receiver|::subscribed_books::vocabulary::person} still had {gift_noun} -- it had not left {receiver_pos} side." = "{@bt_receiver|::subscribed_books::vocabulary::person}仍留着{gift_noun}，它从未离开{receiver_pos}身边。"
"{gift_noun}, given so long ago, had never been far from {@bt_receiver|::subscribed_books::vocabulary::person}." = "很久以前获赠的{gift_noun}，从未远离{@bt_receiver|::subscribed_books::vocabulary::person}。"
"{@bt_proto|::subscribed_books::vocabulary::person} had lived quietly until now. But the world had other plans, and those plans arrived in the form of a choice that could not be ignored." = "直到此刻，{@bt_proto|::subscribed_books::vocabulary::person}一直安静地生活。但世界另有打算，那些打算化为一个无法回避的选择，来到了眼前。"
"The call was clear, but {@bt_proto|::subscribed_books::vocabulary::person} was not ready. Not yet. The weight of what was being asked -- to leave everything behind, to walk into the unknown -- was more than {proto_pro} could bear." = "召唤很清楚，{@bt_proto|::subscribed_books::vocabulary::person}却还未准备好。还没有。抛下一切、走向未知的要求太沉，超出{proto_pro}所能承受。"
"And so {@bt_proto|::subscribed_books::vocabulary::person} left. The threshold was crossed, the old life abandoned, and the journey began in earnest. There would be no going back." = "于是{@bt_proto|::subscribed_books::vocabulary::person}离去。门槛跨过，旧生活抛下，旅程真正开始。再无归路。"
"The world beyond was harder than {@bt_proto|::subscribed_books::vocabulary::person} had imagined. Every day brought new challenges, new enemies, new reasons to question whether the journey had been a mistake." = "外面的世界比{@bt_proto|::subscribed_books::vocabulary::person}想象的更艰难。每天都有新的挑战、新的敌人、新的理由，让人怀疑踏上旅程是否错了。"
"But {@bt_proto|::subscribed_books::vocabulary::person} was not alone. In the darkest stretch of the road, help came from an unexpected quarter -- a reminder that even in a hostile world, solidarity existed." = "但{@bt_proto|::subscribed_books::vocabulary::person}并不孤单。在道路最黑暗的一段，援助来自意料之外，提醒着人：即便世界充满敌意，团结仍然存在。"
"Everything had been building to this. The confrontation that could not be avoided, the test that would determine whether {@bt_proto|::subscribed_books::vocabulary::person}'s journey had been for nothing." = "一切都酝酿着这一刻：无法避免的对决，将决定{@bt_proto|::subscribed_books::vocabulary::person}的旅程是否全是徒劳。"
"The ordeal was survived. The prize was won. But the journey was not over -- because the hardest part of any quest is not the going, but the coming back." = "磨难已经熬过，奖励已经赢得。但旅程未结束，因为任何征途最难的都不是去，而是回来。"
"{@bt_proto|::subscribed_books::vocabulary::person} returned home, changed in ways that those who had stayed behind could not fully understand. The world was the same. {proto_pro} was not." = "{@bt_proto|::subscribed_books::vocabulary::person}回到家，发生的变化，留下来的人无法完全理解。世界依旧，{proto_pro}却已不同。"
"Every fall starts from a height, and {@bt_proto|::subscribed_books::vocabulary::person}'s was considerable." = "每次坠落都从高处开始，而{@bt_proto|::subscribed_books::vocabulary::person}曾站得很高。"
"{@bt_proto|::subscribed_books::vocabulary::person} stood at the height of {proto_pos} power, and believed {proto_pro} had earned it. Pride -- the oldest and most seductive of sins -- had taken root." = "{@bt_proto|::subscribed_books::vocabulary::person}站在权力巅峰，相信那是{proto_pro}应得的。骄傲，最古老、最诱人的罪，已经扎根。"
"The forces that would undo {@bt_proto|::subscribed_books::vocabulary::person} were already in motion. {@bt_antag|::subscribed_books::vocabulary::person} moved in the shadows, patient and deliberate, building the trap that {@bt_proto2|::subscribed_books::vocabulary::person} could not see." = "将摧毁{@bt_proto|::subscribed_books::vocabulary::person}的力量已开始运转。{@bt_antag|::subscribed_books::vocabulary::person}在暗处耐心而有意地行动，构筑{@bt_proto2|::subscribed_books::vocabulary::person}看不见的陷阱。"
"The reversal came. Everything {@bt_proto|::subscribed_books::vocabulary::person} had built, everything {proto_pro} had believed about {proto_pos} place in the world, crumbled. The fall was swift and total." = "逆转到来。{@bt_proto|::subscribed_books::vocabulary::person}建立的一切，{proto_pro}对{proto_pos}在世上地位的全部信念，都崩塌了。坠落迅速而彻底。"
"And then, too late, {@bt_proto|::subscribed_books::vocabulary::person} understood. The truth was terrible, and it was complete, and it changed nothing. The damage was done." = "然后，太迟了，{@bt_proto|::subscribed_books::vocabulary::person}才明白。真相可怕而完整，却什么都没改变。损害已成。"
"The end was not a surprise. It had been written from the first act, in the choices {@bt_proto|::subscribed_books::vocabulary::person} had made and the warnings {proto_pro} had ignored. Tragedy is not what happens to us. It is what we do to ourselves." = "结局并不意外。从第一幕开始，它就写在{@bt_proto|::subscribed_books::vocabulary::person}的选择与{proto_pro}忽略的警告里。悲剧不是降临于我们的事，而是我们对自己做的事。"
"The stage is empty now. Let the audience carry what they have seen with them, and let them remember: this is the cost of pride." = "如今舞台已空。让观众带着所见离去，并铭记：这就是骄傲的代价。"
"It began simply enough. {@bt_proto|::subscribed_books::vocabulary::person} had a plan. It was not a good plan, but it was a plan, and that was more than most people had." = "开头很简单。{@bt_proto|::subscribed_books::vocabulary::person}有一个计划。不算好计划，却也是计划，已比大多数人有的更多。"
"The plan, predictably, went sideways. What followed was a cascade of misunderstandings so elaborate that no one involved could have untangled it even if they had wanted to." = "不出所料，计划出了岔子。随后连串的误解如此错综复杂，即便当事人想解开，也无法解开。"
"Things got worse. Not dramatically worse -- comically worse, in the way that only happens when everyone involved is absolutely certain they are the only reasonable person in the room." = "事情更糟了。并非悲壮地更糟，而是滑稽地更糟，唯有人人都坚信自己是屋里唯一理性之人时，才会如此。"
"The argument escalated beyond words. {@bt_proto|::subscribed_books::vocabulary::person} and {@bt_antag|::subscribed_books::vocabulary::person} came to blows -- not out of genuine hatred, but because the situation had reached a point where punching someone felt like the only reasonable response." = "争论升级，超出言语。{@bt_proto|::subscribed_books::vocabulary::person}和{@bt_antag|::subscribed_books::vocabulary::person}动起手来，并非出于深仇大恨，而是局面已到揍人看似唯一合理反应的地步。"
"The chaos reached its magnificent, absurd peak. Every thread of the story had knotted together into something that defied comprehension, logic, and several laws of probability." = "混乱达到壮观而荒谬的巅峰。故事的每根线都纠结起来，违背理解、逻辑，以及好几条概率法则。"
"And then, somehow, it sorted itself out. The misunderstandings were cleared, the disguises removed, the apologies offered. Everyone agreed never to speak of it again. They would, of course." = "然后，不知怎么，一切自行理顺。误会消除，伪装揭去，歉意表达。大家约定再不提起。自然，他们仍会提。"
"{@bt_proto|::subscribed_books::vocabulary::person} was wronged. Not in the small, forgettable way that is part of ordinary life, but in the deep, bone-level way that reshapes a person entirely. {@bt_antag|::subscribed_books::vocabulary::person} was responsible." = "{@bt_proto|::subscribed_books::vocabulary::person}受到伤害。不是日常生活中微小、易忘的委屈，而是深至骨髓、足以彻底重塑一个人的伤害。责任在{@bt_antag|::subscribed_books::vocabulary::person}。"
"In the aftermath, {@bt_proto|::subscribed_books::vocabulary::person} made a promise. Not to anyone else -- to {proto_reflexive}. The wrong would be answered. The debt would be paid. No matter how long it took." = "事后，{@bt_proto|::subscribed_books::vocabulary::person}许下承诺。不是向别人，而是向{proto_reflexive}。冤屈必有回应，债务必将偿还，无论需要多久。"
"The preparation was methodical. {@bt_proto|::subscribed_books::vocabulary::person} studied, trained, planned. Every action was a step toward a single goal that burned with a cold, patient intensity." = "准备有条不紊。{@bt_proto|::subscribed_books::vocabulary::person}学习、训练、谋划。每个行动都迈向同一个目标，那目标冷静、耐心而强烈地燃烧。"
"The hunt began. {@bt_proto|::subscribed_books::vocabulary::person} closed the distance to {@bt_antag|::subscribed_books::vocabulary::person}, day by day, step by step. The pursuer was relentless, and the pursued did not yet know they were being pursued." = "追猎开始。{@bt_proto|::subscribed_books::vocabulary::person}日复一日、步复一步地拉近与{@bt_antag|::subscribed_books::vocabulary::person}的距离。追猎者从不懈怠，而被追猎者还不知道有人在追。"
"They met. Everything that had happened -- the wrong, the vow, the preparation, the hunt -- had led to this single moment. There was nothing left to say." = "他们相遇了。发生的一切，冤屈、誓言、准备、追猎，都通向这唯一的时刻。再无话可说。"
"The revenge was complete. The satisfaction {@bt_proto|::subscribed_books::vocabulary::person} had expected did not come. In its place was something quieter, heavier, and more permanent. The story was over. But the emptiness remained." = "复仇完成了。{@bt_proto|::subscribed_books::vocabulary::person}期待的满足没有到来，取而代之的是更安静、更沉重、更持久的东西。故事结束，空虚却仍在。"
"{@bt_proto|::subscribed_books::vocabulary::person} met {@bt_love|::subscribed_books::vocabulary::person}. The moment was unremarkable to everyone except the two of them. For them, it was the beginning of everything." = "{@bt_proto|::subscribed_books::vocabulary::person}遇见{@bt_love|::subscribed_books::vocabulary::person}。在旁人看来，这一刻毫不起眼；对他们两人而言，这是一切的开端。"
"What followed was the oldest story in the world: two people, drawn together, circling each other with the caution and hope that only new love can produce." = "随后是世上最古老的故事：两个人彼此吸引，怀着只有初生爱情才能带来的谨慎与希望，围绕彼此。"
"But the world did not pause for romance. {@bt_antag|::subscribed_books::vocabulary::person} appeared -- a threat to everything {@bt_proto|::subscribed_books::vocabulary::person} and {@bt_love|::subscribed_books::vocabulary::person} were building. The danger was real, and it would not wait for a more convenient time." = "但世界不会为爱情暂停。{@bt_antag|::subscribed_books::vocabulary::person}出现，威胁{@bt_proto|::subscribed_books::vocabulary::person}和{@bt_love|::subscribed_books::vocabulary::person}正在建立的一切。危险真实，不会等待更方便的时机。"
"{@bt_antag|::subscribed_books::vocabulary::person} drove a wedge between {@bt_proto|::subscribed_books::vocabulary::person} and {@bt_love|::subscribed_books::vocabulary::person}. Whether through jealousy, ambition, or simple cruelty, {@bt_antag2|::subscribed_books::vocabulary::person} made sure the path to happiness was blocked." = "{@bt_antag|::subscribed_books::vocabulary::person}在{@bt_proto|::subscribed_books::vocabulary::person}和{@bt_love|::subscribed_books::vocabulary::person}之间打入楔子。无论出于嫉妒、野心，还是纯粹残酷，{@bt_antag2|::subscribed_books::vocabulary::person}确保通向幸福的道路被堵住。"
"{@bt_proto|::subscribed_books::vocabulary::person} fought. Not for glory or revenge, but for the simple right to love in peace. {@bt_antag|::subscribed_books::vocabulary::person} had underestimated what {@bt_proto2|::subscribed_books::vocabulary::person} was willing to sacrifice for {@bt_love|::subscribed_books::vocabulary::person}." = "{@bt_proto|::subscribed_books::vocabulary::person}战斗了。不是为了荣耀或复仇，而是为了平静相爱的简单权利。{@bt_antag|::subscribed_books::vocabulary::person}低估了{@bt_proto2|::subscribed_books::vocabulary::person}愿为{@bt_love|::subscribed_books::vocabulary::person}牺牲多少。"
"They were pulled apart. The separation was painful, necessary, and -- both of them feared -- permanent. But {@bt_proto|::subscribed_books::vocabulary::person} carried {@bt_love|::subscribed_books::vocabulary::person}'s memory like a shield." = "他们被迫分开。分离痛苦、必要，而且两人都害怕它会永久持续。但{@bt_proto|::subscribed_books::vocabulary::person}像盾牌一样带着{@bt_love|::subscribed_books::vocabulary::person}的记忆。"
"They found each other again. The world had changed. They had changed. But the connection between them had survived everything the world had thrown at it." = "他们再次找到彼此。世界变了，他们变了，但彼此之间的联系挺过了世界施加的一切。"
"Something was wrong. {@bt_proto|::subscribed_books::vocabulary::person} was the first to notice -- a detail out of place, a question without an answer, a shadow where there should have been light." = "有什么不对。{@bt_proto|::subscribed_books::vocabulary::person}最先留意到，一个不合适的细节，一个无解的问题，一道本该有光的地方出现的阴影。"
"{@bt_proto|::subscribed_books::vocabulary::person} dug deeper. Every answer led to more questions. Every door opened onto another corridor. The truth was buried, but {@bt_proto2|::subscribed_books::vocabulary::person} was stubborn enough to keep digging." = "{@bt_proto|::subscribed_books::vocabulary::person}继续深挖。每个答案引出更多问题，每扇门打开都是另一条走廊。真相埋着，但{@bt_proto2|::subscribed_books::vocabulary::person}足够顽强，继续挖掘。"
"The trail went cold -- or rather, it went somewhere {@bt_antag|::subscribed_books::vocabulary::person} had intended it to go. The false lead was convincing, deliberate, and nearly fatal." = "线索断了，或者说，走向了{@bt_antag|::subscribed_books::vocabulary::person}希望它去的地方。错误线索令人信服、蓄意为之，而且几乎致命。"
"{@bt_proto|::subscribed_books::vocabulary::person} had gotten too close to the truth. {@bt_antag|::subscribed_books::vocabulary::person} struck first -- an ambush meant to silence the investigation permanently. But {@bt_proto2|::subscribed_books::vocabulary::person} was not so easily silenced." = "{@bt_proto|::subscribed_books::vocabulary::person}接近真相太过。{@bt_antag|::subscribed_books::vocabulary::person}抢先出手，意在通过伏击永久终止调查。但{@bt_proto2|::subscribed_books::vocabulary::person}没那么容易被封口。"
"The truth, when it came, was worse than the mystery. {@bt_proto|::subscribed_books::vocabulary::person} saw the full picture at last, and it was ugly, and it was undeniable, and it changed everything." = "真相到来时，比谜团更糟。{@bt_proto|::subscribed_books::vocabulary::person}终于看见完整画面，它丑陋、不可否认，改变了一切。"
"Knowledge demanded action. {@bt_proto|::subscribed_books::vocabulary::person} acted. The consequences of that action would ripple outward for years, but in the moment, there was only the clarity of doing what had to be done." = "知识要求行动。{@bt_proto|::subscribed_books::vocabulary::person}行动了。其后果将涟漪般扩散多年，但当时，唯有做必须之事的清明。"
"Let the words rise. Let them carry what cannot be carried in silence. This is an invocation -- a calling-forth of something worth remembering." = "让话语升起，让它们承载沉默所不能承载之物。这是祈请，召来值得铭记的东西。"
"There are deeds worth celebrating, and this is one of them. Let the world know what was accomplished, and let the accomplishment stand as proof that greatness is still possible." = "有些壮举值得庆祝，这就是其中之一。让世界知道所成就的事，让它证明伟大仍有可能。"
"And so the song ends. But the echo remains, carried forward by those who heard it, and by those who will hear it again." = "歌声就此结束，回声却留下，由听过的人、以及将再次听见的人，继续传递。"
"This is what was lost. The absence is louder than the presence ever was, and the world that remains is diminished by the going." = "这就是失去的一切。缺席比曾经的存在更响亮，而留下的世界因离去而缩减。"
"But memory persists. It persists because it matters, because the thing that was lost deserves to be remembered, and because forgetting would be a second death." = "但记忆长存。它长存，因为它重要，因为失去之物值得铭记，因为遗忘将是第二次死亡。"
"In the end, there is acceptance. Not peace -- never quite peace. But the recognition that the wound will not heal, and the willingness to carry it anyway." = "最终迎来接受。不是安宁，永远不全是安宁，而是承认伤口不会愈合，并愿意继续带着它。"
", its weight wrong in a way no scale could measure" = "，其重量有种任何秤都无法测出的不对劲"
", carrying whatever it had carried before" = "，仍承载着此前承载的一切"
