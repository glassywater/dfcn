"\"Don't stop,\" {@bt_a|::subscribed_books::vocabulary::person} murmured. \"I want to see how far you'll go.\"" = "“别停，”{@bt_a|::subscribed_books::vocabulary::person}低声说，“我想看看，你能做到什么地步。”"
