# forms/music/composition.lua 与 musical.lua：按完整句解析乐曲编制和乐段。
# 乐器、曲式、音阶及作品名称沿用已有语义入口，不捕获任意英文正文。
base = "subscribed_books::composition"

[[rulesets]]
[rulesets.rules]
"A Composition" = "一首乐曲"
"Perspective: {perspective}" = "风格：{perspective}"
"For any who will listen." = "献给所有愿意聆听的人。"
"For the gods, in devotion." = "虔诚地献给诸神。"
"For {::text::person}, in devotion." = "虔诚地献给{::text::person}。"
"In memory of those who are gone." = "纪念那些已经逝去的人。"
"In memory of {::subscribed_books::essay_fight_aftermath::lost_person}, who died in the year {year}." = "纪念于{year}年逝世的{::subscribed_books::essay_fight_aftermath::lost_person}。"
"For the soldiers." = "献给战士们。"
"For the soldiers of {::subscribed_books::vocabulary::entity}." = "献给{::subscribed_books::vocabulary::entity}的战士们。"
"In the musical form of {form}." = "采用{form}的曲式。"
"In the musical form of {form}, for {players}." = "采用{form}的曲式，由{players}演出。"
"In the musical form of {form}, in the {scale} scale." = "采用{form}的曲式，使用{scale}音阶。"
"In the musical form of {form}, for {players}, in the {scale} scale." = "采用{form}的曲式，由{players}演出，使用{scale}音阶。"
"It is played {manner_list}." = "演奏方式：{manner_list}。"
"{section}: {players} {performance}." = "{section}：{players}{performance}。"
"{section}, played {play_detail}." = "{section}：演奏{play_detail}。"
"The words:" = "歌词："
"The words are my own {work_kind}, {book}." = "歌词取自我自己的{work_kind}{book}。"
"The words are {::text::person}'s {work_kind}, {book}." = "歌词取自{::text::person}的{work_kind}{book}。"
"The words are {work_kind}, {book}." = "歌词取自{work_kind}{book}。"

[[rulesets]]
name = "perspective"
[rulesets.rules]
"hymn" = "赞美诗"
"lament" = "哀歌"
"march" = "进行曲"
"song" = "歌曲"
"air" = "器乐曲"

[[rulesets]]
name = "form"
[rulesets.rules]
"{::text::form}" = "《{::text::form}》"
"its people" = "其民族"

[[rulesets]]
name = "scale"
[rulesets.rules]
# musical.scale_name 读取世界音阶的原生语言名称。
"{::text::native_item_name}" = "{::text::native_item_name}"

[[rulesets]]
name = "players"
[rulesets.rules]
"{player}" = "{player}"
"{player} and {players}" = "{player}和{players}"
"{player}, {players}" = "{player}、{players}"

[[rulesets]]
name = "player"
[rulesets.rules]
"the {::text::instrument}" = "{::text::instrument}"
"a singer" = "一位歌者"
"a speaker" = "一位朗诵者"
"a chanter" = "一位吟唱者"
"the singer" = "歌者"
"the speaker" = "朗诵者"
"the chanter" = "吟唱者"

[[rulesets]]
name = "section"
[rulesets.rules]
"an interlude" = "间奏"
"the introduction" = "引子"
"the exposition" = "呈示部"
"the recapitulation" = "再现部"
"the synthesis" = "综合部"
"a verse" = "主歌"
"the chorus" = "副歌"
"the finale" = "终曲"
"the coda" = "尾声"
"a bridge" = "过渡段"
"the theme" = "主题"
"a variation" = "变奏"
