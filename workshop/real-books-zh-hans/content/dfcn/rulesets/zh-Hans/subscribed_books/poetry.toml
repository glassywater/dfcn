# 声明内生成变化的规范形变体；原作者句式保留。
[[rulesets]]
[rulesets.rules]
"A elegy. For {@bt_a|::subscribed_books::vocabulary::person}. For all we have lost.\nThe words are {adj} and insufficient. But they are all we have." = "一首挽歌。献给 {@bt_a|::subscribed_books::vocabulary::person}。献给失去的一切。\n话语{adj}而苍白。但这是我们拥有的一切。"

