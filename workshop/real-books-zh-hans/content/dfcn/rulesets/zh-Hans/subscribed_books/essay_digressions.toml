"I think sometimes of {@bt_other|::subscribed_books::vocabulary::person}, my {other_word}. We did not part as friends, and the record does not say why. I will not say either." = "我有时会想起我的{other_word}，{@bt_other|::subscribed_books::vocabulary::person}。我们分道扬镳时已非朋友，史册没有记下缘由。我也不会说。"
"I think sometimes of {@bt_other|::subscribed_books::vocabulary::person}, my {other_word}." = "我有时会想起我的{other_word}，{@bt_other|::subscribed_books::vocabulary::person}。"
