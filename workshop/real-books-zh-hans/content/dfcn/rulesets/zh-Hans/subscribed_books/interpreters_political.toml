"In the year {year1}, a new threat emerged to menace {@bt_entity|::subscribed_books::interpreters::entity}. {@bt_hero_ep|::subscribed_books::interpreters::person}, {article} {race}, was declared a enemy of the people. The creature had made its presence known in ways that could no longer be ignored." = "{year1}年，新的威胁出现，危及{@bt_entity|::subscribed_books::interpreters::entity}。{@bt_hero_ep|::subscribed_books::interpreters::person}，一只{race}，被宣布为人民的敌人。这只生物的存在已通过无法再忽略的方式显露出来。"
"The year {year1} brought a new terror to {@bt_entity|::subscribed_books::interpreters::entity}. {@bt_hero_ep|::subscribed_books::interpreters::person}, {article} {race} of fearsome reputation, rose as a enemy of the civilization. Its attacks on the outskirts of {@bt_site|::subscribed_books::interpreters::place} had grown too brazen, too frequent, too costly to dismiss." = "{year1}年为{@bt_entity|::subscribed_books::interpreters::entity}带来了新的恐怖。{@bt_hero_ep|::subscribed_books::interpreters::person}，一只凶名远扬的{race}，成为文明的敌人。它在{@bt_site|::subscribed_books::interpreters::place}外围的袭击已过于大胆、频繁，代价过高，再无法忽视。"
"{@bt_hero_ep|::subscribed_books::interpreters::person}. The name would come to be spoken with dread throughout {@bt_entity|::subscribed_books::interpreters::entity}. In {year1}, this {race} was formally recognized as a enemy -- not merely a nuisance or a hazard, but a genuine threat to the survival of {@bt_site|::subscribed_books::interpreters::place} and its people." = "{@bt_hero_ep|::subscribed_books::interpreters::person}。这个名字将让整个{@bt_entity|::subscribed_books::interpreters::entity}的人说起时都心怀恐惧。{year1}年，这只{race}被正式确认为敌人，不只是烦扰或危险，而是真正威胁{@bt_site|::subscribed_books::interpreters::place}及其人民的生存。"
"The declaration did not come from nowhere. Before being named a enemy, {@bt_hero|::subscribed_books::interpreters::person} had been responsible for at least {n1} recorded attacks." = "这个宣告并非凭空而来。在被列为敌人之前，{@bt_hero|::subscribed_books::interpreters::person}已至少造成{n1}次有记录的袭击。"
"The final straw was the taking of {race} in the year {year2} -- a act so brazen, so close to the heart of {@bt_site|::subscribed_books::interpreters::place}, that the people could no longer pretend the problem would solve itself." = "最后的导火索是{year2}年掳走{race}之举。行为如此大胆，地点如此接近{@bt_site|::subscribed_books::interpreters::place}的核心，人们再无法假装问题会自行消失。"
"The people of {@bt_site|::subscribed_books::interpreters::place} had dealt with predators before, but {@bt_hero|::subscribed_books::interpreters::person} was different. This was not a animal acting on instinct alone. There was a cunning to its attacks, a pattern that suggested intelligence -- or at least a dangerous kind of learning." = "{@bt_site|::subscribed_books::interpreters::place}的人民以前也应付过掠食者，但{@bt_hero|::subscribed_books::interpreters::person}不同。它并非仅凭本能行动的动物。它的袭击带着狡猾，有一定规律，显示着智慧，或者至少某种危险的学习能力。"
"The declaration of {@bt_hero|::subscribed_books::interpreters::person} as a enemy was not merely symbolic. It meant that the resources of {@bt_entity|::subscribed_books::interpreters::entity} could now be directed toward dealing with the threat. Bounties were posted. Patrols were doubled. And the people of {@bt_site|::subscribed_books::interpreters::place} slept a little less soundly, knowing that somewhere in the darkness, the {race} was watching." = "宣布{@bt_hero|::subscribed_books::interpreters::person}为敌人，并不只是象征。它意味着{@bt_entity|::subscribed_books::interpreters::entity}的资源如今可以用来处理威胁。悬赏张贴，巡逻加倍。{@bt_site|::subscribed_books::interpreters::place}的人民睡得更不安稳，因为他们知道，某处黑暗里，这只{race}正看着。"
"With the formal recognition of {@bt_hero|::subscribed_books::interpreters::person} as a enemy, the mood in {@bt_site|::subscribed_books::interpreters::place} shifted. This was no longer a problem to be tolerated. It was a war -- a small one, perhaps, fought not between armies but between a civilization and a single, relentless creature. And wars, as everyone knew, had to be won." = "正式确认{@bt_hero|::subscribed_books::interpreters::person}为敌人后，{@bt_site|::subscribed_books::interpreters::place}的气氛变了。这不再是可以容忍的问题，而是一场战争。也许是小战争，并非军队之间，而是一个文明与一只永不停歇的生物之间。人人都知道，战争必须赢。"
"{@bt_hero|::subscribed_books::interpreters::person}'s time as a threat was cut short. The {race} met its end in the same year it was declared a enemy." = "{@bt_hero|::subscribed_books::interpreters::person}作为威胁的时日被提前终结。这只{race}在被宣布为敌人的同一年，就迎来了末日。"
"What {@bt_hero|::subscribed_books::interpreters::person} would make of the position remained to be seen. But those who had watched {pos1} rise through the ranks of {@bt_entity|::subscribed_books::interpreters::entity} suspected that the appointment was less a ending than a beginning." = "{@bt_hero|::subscribed_books::interpreters::person}会把职位做成什么样，仍待观察。但那些看着{pos1}在{@bt_entity|::subscribed_books::interpreters::entity}内部逐级上升的人，怀疑这次任命并非结束，而是开始。"
"The author can attest, from personal experience, that {@bt_hero|::subscribed_books::interpreters::person} proved to be a exceptional {role}. Under {pos1} leadership, {@bt_entity|::subscribed_books::interpreters::entity} prospered in ways that vindicated the choice. History, in the end, is kind to those who deserve it." = "作者能凭亲身经历作证：{@bt_hero|::subscribed_books::interpreters::person}是一位出色的{role}。在{pos1}领导下，{@bt_entity|::subscribed_books::interpreters::entity}繁荣起来，证明当初的选择正确。说到底，历史善待值得善待的人。"
"In {year1}, {@bt_hero_ep|::subscribed_books::interpreters::person} was declared a criminal by {@bt_entity|::subscribed_books::interpreters::entity}. The charges, whatever they were, marked {@bt_hero|::subscribed_books::interpreters::person} as a outcast -- someone to be shunned, pursued, or punished. The details of the crime may have faded, but the designation endured." = "{year1}年，{@bt_entity|::subscribed_books::interpreters::entity}宣布{@bt_hero_ep|::subscribed_books::interpreters::person}为罪犯。无论罪名是什么，它都将{@bt_hero|::subscribed_books::interpreters::person}标为被排斥之人，需要被躲避、追捕或惩罚。犯罪细节也许淡去，这个名号却持久存在。"
"In {year1}, {@bt_hero_ep|::subscribed_books::interpreters::person} took up a occupation within {@bt_entity|::subscribed_books::interpreters::entity}. It was the kind of quiet decision that rarely makes history -- and yet, in its own way, it shaped {@bt_hero|::subscribed_books::interpreters::person}'s life as surely as any battle or election." = "{year1}年，{@bt_hero_ep|::subscribed_books::interpreters::person}在{@bt_entity|::subscribed_books::interpreters::entity}内部开始从事一项职业。这类安静的决定很少载入历史，却以自己的方式，与任何战斗或选举一样确实地塑造了{@bt_hero|::subscribed_books::interpreters::person}的人生。"
"The declaration did not come from nowhere. Before being named a enemy, {@bt_hero|::subscribed_books::interpreters::person} had been responsible for at least {n1} recorded attacks. The creature's victims included {victims}." = "这个宣告并非凭空而来。在被列为敌人之前，{@bt_hero|::subscribed_books::interpreters::person}已至少造成{n1}次有记录的袭击。这只生物的受害者包括{victims}。"
"The declaration did not come from nowhere. Before being named a enemy, {@bt_hero|::subscribed_books::interpreters::person} had been responsible for at least {n1} recorded attacks. The final straw was the taking of {race} in the year {year2} -- a act so brazen, so close to the heart of {@bt_site|::subscribed_books::interpreters::place}, that the people could no longer pretend the problem would solve itself." = "这个宣告并非凭空而来。在被列为敌人之前，{@bt_hero|::subscribed_books::interpreters::person}已至少造成{n1}次有记录的袭击。最后的导火索是{year2}年掳走{race}之举。行为如此大胆，地点如此接近{@bt_site|::subscribed_books::interpreters::place}的核心，人们再无法假装问题会自行消失。"
"The declaration did not come from nowhere. Before being named a enemy, {@bt_hero|::subscribed_books::interpreters::person} had been responsible for at least {n1} recorded attacks. The creature's victims included {victims}. The final straw was the taking of {race} in the year {year2} -- a act so brazen, so close to the heart of {@bt_site|::subscribed_books::interpreters::place}, that the people could no longer pretend the problem would solve itself." = "这个宣告并非凭空而来。在被列为敌人之前，{@bt_hero|::subscribed_books::interpreters::person}已至少造成{n1}次有记录的袭击。这只生物的受害者包括{victims}。最后的导火索是{year2}年掳走{race}之举。行为如此大胆，地点如此接近{@bt_site|::subscribed_books::interpreters::place}的核心，人们再无法假装问题会自行消失。"

