"The priests keep silent only because {::subscribed_books::speech::religion::entity} {::subscribed_books::speech::religion::action} {::subscribed_books::speech::religion::object} before their eyes." = "祭司沉默，只因{::subscribed_books::speech::religion::entity}当着他们的面{::subscribed_books::speech::religion::action}{::subscribed_books::speech::religion::object}。"
"You speak of faith while {::subscribed_books::speech::religion::entity} {::subscribed_books::speech::religion::action} {::subscribed_books::speech::religion::object}. The lie is yours alone." = "{::subscribed_books::speech::religion::entity}{::subscribed_books::speech::religion::action}{::subscribed_books::speech::religion::object}时，你还谈信仰。这谎言属于你一人。"
"{::subscribed_books::speech::religion::entity} fear no divinity, and so they {::subscribed_books::speech::religion::action} {::subscribed_books::speech::religion::object} without a second thought." = "{::subscribed_books::speech::religion::entity}不惧任何神灵，因此想也不想就{::subscribed_books::speech::religion::action}{::subscribed_books::speech::religion::object}。"
"I warned them this would come. {::subscribed_books::speech::religion::entity} would {::subscribed_books::speech::religion::action} {::subscribed_books::speech::religion::object}, and they did." = "我警告过他们会有这一天。{::subscribed_books::speech::religion::entity}会{::subscribed_books::speech::religion::action}{::subscribed_books::speech::religion::object}，果然如此。"
"Blasphemy is a choice, {::subscribed_books::speech::religion::entity}. You chose to {::subscribed_books::speech::religion::action} {::subscribed_books::speech::religion::object}." = "亵渎是一种选择，{::subscribed_books::speech::religion::entity}。你们选择了{::subscribed_books::speech::religion::action}{::subscribed_books::speech::religion::object}。"
"{::subscribed_books::speech::religion::entity} serve the people, not the other way around. We will not {::subscribed_books::speech::religion::action} {::subscribed_books::speech::religion::object} on faith alone." = "{::subscribed_books::speech::religion::entity}为人民服务，而非反过来。我们不会仅凭信仰就{::subscribed_books::speech::religion::action}{::subscribed_books::speech::religion::object}。"
"The gods have not spoken on this. You have." = "众神未对此开口，开口的是你。"
"We did not {::subscribed_books::speech::religion::action} {::subscribed_books::speech::religion::object} out of malice. {::subscribed_books::speech::religion::entity} acted from desperate need." = "我们{::subscribed_books::speech::religion::action}{::subscribed_books::speech::religion::object}不是出于恶意，{::subscribed_books::speech::religion::entity}是被迫切需要驱使。"
"Faith is not the same as fear, and {::subscribed_books::speech::religion::entity} will not {::subscribed_books::speech::religion::action} {::subscribed_books::speech::religion::object} blindly." = "信仰不等于恐惧，{::subscribed_books::speech::religion::entity}不会盲目{::subscribed_books::speech::religion::action}{::subscribed_books::speech::religion::object}。"
"You accuse {::subscribed_books::speech::religion::entity} of sacrilege because we would not {::subscribed_books::speech::religion::action} {::subscribed_books::speech::religion::object} as you demanded." = "你指责{::subscribed_books::speech::religion::entity}亵渎，只因我们不肯按你要求的{::subscribed_books::speech::religion::action}{::subscribed_books::speech::religion::object}。"
"{::subscribed_books::speech::religion::entity} honor {::subscribed_books::speech::religion::object} more through doubt than you ever did through rote." = "{::subscribed_books::speech::religion::entity}通过怀疑表达对{::subscribed_books::speech::religion::object}的敬意，比你机械照做更多。"
