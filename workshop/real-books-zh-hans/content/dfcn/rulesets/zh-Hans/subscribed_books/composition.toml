"speaks it {play_detail}" = "朗诵{play_detail}"
"chants it {play_detail}" = "吟唱{play_detail}"

[[rulesets]]
name = "play_detail"
[rulesets.rules]
# passage_line 依次输出次数、逗号分隔的演奏方式、声部和长度；后三项可缺省。
"{times}" = "{times}"
"{times}, {manner_commas}" = "{times}，{manner_commas}"
"{times} - {components}" = "{times}；声部为{components}"
"{times}, {length}" = "{times}，篇幅{length}"
"{times}, {manner_commas} - {components}" = "{times}，{manner_commas}；声部为{components}"
"{times}, {manner_commas}, {length}" = "{times}，{manner_commas}，篇幅{length}"
"{times} - {components}, {length}" = "{times}；声部为{components}，篇幅{length}"
"{times}, {manner_commas} - {components}, {length}" = "{times}，{manner_commas}；声部为{components}，篇幅{length}"

[[rulesets]]
name = "times"
[rulesets.rules]
"once" = "一次"
"twice" = "两次"
"{count} times" = "{count}次"
"{count} or {count_to} times" = "{count}次或{count_to}次"

[[rulesets]]
name = "count"
[rulesets.rules]
"one" = "一"
"two" = "两"
"three" = "三"
"four" = "四"
"five" = "五"
"six" = "六"
"seven" = "七"
"eight" = "八"
"{#digits}" = "{#digits}"

[[rulesets]]
name = "count_to"
[rulesets.rules]
"{count}" = "{count}"

[[rulesets]]
name = "components"
[rulesets.rules]
"{component}" = "{component}"
