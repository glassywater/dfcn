[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} slipped into the false identity as easily as putting on a coat. For {pro1}, there was no meaningful difference between truth and fiction." = "{@bt_a|::subscribed_books::vocabulary::person}进入假身份，如同穿上外套般容易。对{pro1}而言，真实与虚构之间，没有实质区别。"
