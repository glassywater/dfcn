"{@bt_a|::subscribed_books::vocabulary::person} wove the lie into the discussion so seamlessly that no one thought to question where it had come from." = "{@bt_a|::subscribed_books::vocabulary::person}把谎言天衣无缝地织入讨论，没人想到追问它从何而来。"
"{@bt_a|::subscribed_books::vocabulary::person} answered the hard question first, and answered it wrong, knowing it would set the tone for everything after." = "{@bt_a|::subscribed_books::vocabulary::person}先回答那个难题，而且答得不对，深知它将为此后的一切定下基调。"
"{@bt_a|::subscribed_books::vocabulary::person} could feel the discussion tilting toward doubt, and course-corrected with a lie so smooth it erased the doubt entirely." = "{@bt_a|::subscribed_books::vocabulary::person}察觉讨论正转向怀疑，于是用一个圆滑到完全消除疑虑的谎言，校正了方向。"
"{@bt_a|::subscribed_books::vocabulary::person} did not hesitate. Hesitation was where lies got caught, and {pro1} had trained {ref1} out of it years ago." = "{@bt_a|::subscribed_books::vocabulary::person}毫不犹豫。犹豫就是谎言露馅的地方，而{pro1}早在多年前，就训练{ref1}戒掉了它。"
"{@bt_a|::subscribed_books::vocabulary::person} gave a detailed, specific, entirely fabricated account, and the details were what sold it." = "{@bt_a|::subscribed_books::vocabulary::person}给出一份详尽、具体而完全虚构的叙述，正是那些细节让人信了它。"
"{@bt_a|::subscribed_books::vocabulary::person} let the discussion settle on the false version and did nothing to correct it -- {pro1} had put it there on purpose." = "{@bt_a|::subscribed_books::vocabulary::person}任由讨论停在虚假的版本上，丝毫不纠正。那本就是{pro1}刻意放进去的。"
"{@bt_a|::subscribed_books::vocabulary::person} spoke with the calm of someone telling the truth, which was, for {pro1}, simply a matter of practice." = "{@bt_a|::subscribed_books::vocabulary::person}说话时有着讲真话者的镇定。对{pro1}而言，这不过是熟能生巧。"
