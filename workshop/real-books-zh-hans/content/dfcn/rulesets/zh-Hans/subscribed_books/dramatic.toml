"Who made you the voice of {::subscribed_books::speech::religion::object}? {::subscribed_books::speech::religion::entity} answer to something older than you." = "谁让你替{::subscribed_books::speech::religion::object}发声？{::subscribed_books::speech::religion::entity}回应的是比你更古老的存在。"
