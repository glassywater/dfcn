# Trait: pacifist.
[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} stepped between the combatants, arms spread, willing to take the blow rather than let it land on someone else." = "{@bt_a|::subscribed_books::vocabulary::person}张开双臂，走到交战者之间，宁愿自己挨这一击，也不让它落在别人身上。"
"{@bt_a|::subscribed_books::vocabulary::person} would not raise a hand, not even in self-defense. There were other ways, and {pro1} intended to find one." = "{@bt_a|::subscribed_books::vocabulary::person}不肯动手，哪怕为了自卫也不肯。总有别的办法，而{pro1}决意找到它。"
"Rather than strike back, {@bt_a|::subscribed_books::vocabulary::person} simply stood {pos1} ground and absorbed it, hoping the fight would burn itself out." = "{@bt_a|::subscribed_books::vocabulary::person}没有还击，只守着{pos1}位置承受攻击，希望争斗会自行耗尽。"
"{@bt_a|::subscribed_books::vocabulary::person} pushed the weapon aside, gently but firmly, and said there had to be another way." = "{@bt_a|::subscribed_books::vocabulary::person}温和却坚定地推开武器，说一定还有别的办法。"
"When the shoving started, {@bt_a|::subscribed_books::vocabulary::person} did not shove back. {pro1} just kept talking, low and steady, until the fists unclenched." = "推搡开始时，{@bt_a|::subscribed_books::vocabulary::person}没有推回去。{pro1}只是继续低声而平稳地说着，直到拳头松开。"
"{@bt_a|::subscribed_books::vocabulary::person} placed {ref1} between the blade and its target without a moment's hesitation." = "{@bt_a|::subscribed_books::vocabulary::person}让{ref1}挡在刀刃与目标之间，没有片刻犹豫。"
"The others wanted blood. {@bt_a|::subscribed_books::vocabulary::person} wanted it to stop, and was willing to be the one who got hurt to make that happen." = "其他人想见血。{@bt_a|::subscribed_books::vocabulary::person}想让它停下，为此愿做那个受伤的人。"
"{@bt_a|::subscribed_books::vocabulary::person} dropped {pos1} own guard entirely, refusing to meet violence with violence even as it closed in." = "{@bt_a|::subscribed_books::vocabulary::person}完全放下{pos1}防备，即使暴力逼近，也拒绝以暴力回应。"
"No matter how many times {@bt_a|::subscribed_books::vocabulary::person} was struck, {pro1} would not strike back. It was not weakness. It was a line {pro2} would not cross." = "无论挨了多少下，{@bt_a|::subscribed_books::vocabulary::person}都不还击。{pro1}这样做并非软弱，而是守着{pro2}绝不跨越的底线。"
"{@bt_a|::subscribed_books::vocabulary::person} threw {ref1} into the middle of it, not to win, but to end it before someone worse got hurt." = "{@bt_a|::subscribed_books::vocabulary::person}让{ref1}冲进争斗中，不为获胜，只为在有人伤得更重之前结束它。"
"\"Hit me instead,\" {@bt_a|::subscribed_books::vocabulary::person} said, and meant it." = "“改打我吧，”{@bt_a|::subscribed_books::vocabulary::person}说道，而且是真心的。"
"{@bt_a|::subscribed_books::vocabulary::person} held out empty hands, palms up, and refused to close them into fists even as the danger closed in." = "{@bt_a|::subscribed_books::vocabulary::person}伸出空空的双手，掌心朝上，即使危险逼近，也拒绝把它们握成拳头。"
"Every instinct told {@bt_a|::subscribed_books::vocabulary::person} to fight back. {pro1} ignored every one of them and took the beating instead." = "每一种本能都催促{@bt_a|::subscribed_books::vocabulary::person}还击。{pro1}却不听任何一种，只承受殴打。"
"{@bt_a|::subscribed_books::vocabulary::person} shielded the smaller of the two with {pos1} own body, absorbing what should have landed elsewhere." = "{@bt_a|::subscribed_books::vocabulary::person}用{pos1}身体护住两人中较弱小的那个，承受本该落在别处的攻击。"
"There was a way to stop this without anyone else bleeding, and {@bt_a|::subscribed_books::vocabulary::person} was going to be the one who bled for it." = "有办法让这一切停下，而不让其他人流血。{@bt_a|::subscribed_books::vocabulary::person}决定成为为此流血的人。"
"{@bt_a|::subscribed_books::vocabulary::person} would not be moved. {pro1} stood fast between them, unarmed, unwilling, immovable." = "{@bt_a|::subscribed_books::vocabulary::person}不肯退让。{pro1}坚定地站在两人之间，赤手空拳，不愿参战，也无法撼动。"
"{@bt_a|::subscribed_books::vocabulary::person} caught the blow meant for someone else and did not so much as raise a hand in return." = "{@bt_a|::subscribed_books::vocabulary::person}接下本该打向别人的一击，连手都没有抬起还击。"
"Where others reached for weapons, {@bt_a|::subscribed_books::vocabulary::person} reached for the people in danger and pulled them clear, taking the risk onto {ref1}." = "别人伸手拿武器时，{@bt_a|::subscribed_books::vocabulary::person}伸手拉出危险中的人，把风险揽到{ref1}身上。"
"{@bt_a|::subscribed_books::vocabulary::person} would rather bleed than let the fight continue, and said as much before stepping into the middle of it." = "{@bt_a|::subscribed_books::vocabulary::person}宁愿流血，也不让争斗继续。走进争斗中央之前，已把这话说了出来。"
"No one could talk {@bt_a|::subscribed_books::vocabulary::person} into fighting back. {pro1} simply would not do it, no matter the cost to {ref1}." = "没人能劝{@bt_a|::subscribed_books::vocabulary::person}还击。无论{ref1}要付出多大代价，{pro1}都不肯这样做。"

[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} refused to fight. {pro1} stood there and took every blow, and somehow that was worse than any resistance." = "{@bt_a|::subscribed_books::vocabulary::person}拒绝战斗。{pro1}站在那里承受每一击，不知为何，这比任何反抗都更难面对。"
"{@bt_a|::subscribed_books::vocabulary::person} lowered {pos1} weapon in the middle of the battle and would not lift it again, whatever the cost." = "{@bt_a|::subscribed_books::vocabulary::person}在战斗中放下{pos1}武器，无论代价如何，也不肯再举起。"
"{@bt_a|::subscribed_books::vocabulary::person} let the blows land, one after another, and never once raised a hand to answer them." = "{@bt_a|::subscribed_books::vocabulary::person}任凭攻击一下接一下地落下，从未抬手回应。"
"Even surrounded, {@bt_a|::subscribed_books::vocabulary::person} would not swing. {pro1} simply endured, and the enemy did not know what to make of it." = "即使被包围，{@bt_a|::subscribed_books::vocabulary::person}也不挥击。{pro1}只是承受，敌人不知该如何理解。"
"{@bt_a|::subscribed_books::vocabulary::person} walked through the battlefield unarmed, pulling the wounded clear, indifferent to {pos1} own exposure." = "{@bt_a|::subscribed_books::vocabulary::person}赤手空拳走过战场，将伤者拖离险地，不在乎{pos1}暴露于危险。"
"\"I won't kill you,\" {@bt_a|::subscribed_books::vocabulary::person} said, blocking a blade with a bare forearm instead of a weapon." = "“我不会杀你，”{@bt_a|::subscribed_books::vocabulary::person}说道，用裸露的前臂而非武器挡住刀刃。"
"{@bt_a|::subscribed_books::vocabulary::person} took wound after wound without landing a single one in return. It was not cowardice. It was refusal." = "{@bt_a|::subscribed_books::vocabulary::person}一道接一道地受伤，却没有还击造成哪怕一道伤口。这不是怯懦，而是拒绝。"
"The fighting raged around {@bt_a|::subscribed_books::vocabulary::person}, and {@bt_a2|::subscribed_books::vocabulary::person} simply would not join it, standing there as a target rather than a threat." = "战斗在{@bt_a|::subscribed_books::vocabulary::person}周围激烈展开，{@bt_a2|::subscribed_books::vocabulary::person}却就是不肯加入，只站在那里，作为目标，而非威胁。"
"{@bt_a|::subscribed_books::vocabulary::person} dropped {pos1} weapon at {pos2} feet and raised both hands, daring the enemy to strike an unarmed opponent." = "{@bt_a|::subscribed_books::vocabulary::person}把{pos1}武器丢在{pos2}脚边，举起双手，逼敌人面对是否敢攻击赤手空拳的对手。"
"Every blow that fell on {@bt_a|::subscribed_books::vocabulary::person} was one that did not fall on someone behind {obj1}. That was the whole point, as far as {pro1} was concerned." = "每落在{@bt_a|::subscribed_books::vocabulary::person}身上的一击，就少一击落在{obj1}身后的人身上。在{pro1}看来，意义就在这里。"
"{@bt_a|::subscribed_books::vocabulary::person} shielded a fallen comrade with {pos1} own body and refused to so much as draw a blade in response." = "{@bt_a|::subscribed_books::vocabulary::person}用{pos1}身体护住倒下的同伴，甚至连拔剑回应也不肯。"
"{@bt_a|::subscribed_books::vocabulary::person} kept saying it did not have to be this way, even as {pro1} bled from wounds {pro2} never answered." = "{@bt_a|::subscribed_books::vocabulary::person}不停说着，事情不必如此。即使{pro1}因一道道{pro2}从未还击的伤口而流血，也仍如此。"
"{@bt_a|::subscribed_books::vocabulary::person} would not be goaded into striking back, not even as the injuries mounted." = "{@bt_a|::subscribed_books::vocabulary::person}不肯受激而还击，即使伤势越来越重。"
"Somewhere in the chaos, {@bt_a|::subscribed_books::vocabulary::person} was still trying to talk someone out of killing {obj1}." = "混乱中的某处，{@bt_a|::subscribed_books::vocabulary::person}仍试图劝某个人不要杀死{obj1}。"
"{@bt_a|::subscribed_books::vocabulary::person} absorbed blow after blow like a wall absorbs rain, unmoving, unresisting, unwilling to bend that principle." = "{@bt_a|::subscribed_books::vocabulary::person}像墙承受雨水一样，承受一击又一击，不动，不反抗，也不肯弯曲那条原则。"
"The enemy expected resistance. {@bt_a|::subscribed_books::vocabulary::person} gave them stillness instead, and it unsettled them more than a fight would have." = "敌人预料会遭到抵抗。{@bt_a|::subscribed_books::vocabulary::person}却给了他们静止，比战斗更令他们不安。"
"{@bt_a|::subscribed_books::vocabulary::person} threw {ref1} in front of the retreating wounded and simply refused to move, weaponless." = "{@bt_a|::subscribed_books::vocabulary::person}让{ref1}挡在撤退的伤者前面，赤手空拳，就是不肯移动。"
"Blood ran down {pos1} face from a wound {pro1} never tried to prevent, because preventing it would have meant striking first." = "血从{pro1}从未试图阻止的一道伤口流下{pos1}脸颊，因为阻止它就意味着先动手。"
"{@bt_a|::subscribed_books::vocabulary::person} would rather fall than deal the killing blow, and by the end of the battle, {pro1} very nearly had." = "{@bt_a|::subscribed_books::vocabulary::person}宁愿倒下，也不愿打出致命的一击。战斗结束时，{pro1}确实几乎倒下了。"
"{@bt_a|::subscribed_books::vocabulary::person} stood at the center of the melee, arms at {pos1} sides, and let the fighting happen around a stillness it could not touch." = "{@bt_a|::subscribed_books::vocabulary::person}站在混战中央，{pos1}双臂垂于身侧，任战斗围绕那片无法触动的静止发生。"

# Trait: trickster.
[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} did not fight fair. {pro1} did not fight at all, if {pro2} could help it. Instead, {pro3} arranged for the situation to resolve itself in {pos1} favor." = "{@bt_a|::subscribed_books::vocabulary::person}不讲公平；只要{pro2}有办法，{pro1}根本不战斗。相反，{pro3}设法让局势自行朝有利于{pos1}的方向解决。"
"{@bt_a|::subscribed_books::vocabulary::person} let the conflict think it was going one way while quietly steering it another." = "{@bt_a|::subscribed_books::vocabulary::person}让冲突看似沿着一个方向发展，却悄悄把它引向另一个方向。"
"{@bt_a|::subscribed_books::vocabulary::person} slipped out of the conflict's path entirely and let the opposing side stumble into each other instead." = "{@bt_a|::subscribed_books::vocabulary::person}完全避开冲突的路线，转而让对方自己撞在一起。"
"{@bt_a|::subscribed_books::vocabulary::person} planted the seed of doubt early and let the conflict undo itself without {pro1} lifting a finger." = "{@bt_a|::subscribed_books::vocabulary::person}早早种下怀疑，让冲突自行瓦解，{pro1}连一根手指都不用动。"
"{@bt_a|::subscribed_books::vocabulary::person} had a plan for the conflict before it started, and the plan did not involve fighting." = "冲突开始之前，{@bt_a|::subscribed_books::vocabulary::person}就有了计划，而计划里没有战斗。"
"{@bt_a|::subscribed_books::vocabulary::person} misdirected at exactly the right moment, and the conflict resolved somewhere {pro1} had wanted it to all along." = "{@bt_a|::subscribed_books::vocabulary::person}在恰当的时刻误导对方，冲突便以{pro1}始终期待的方式解决了。"
"{@bt_a|::subscribed_books::vocabulary::person} was never where the conflict expected {pro1} to be." = "{@bt_a|::subscribed_books::vocabulary::person}从来不在冲突预想{pro1}会在的地方。"
"{@bt_a|::subscribed_books::vocabulary::person} let someone else take the credit for ending the conflict, which suited {pro1} fine, since {pro2} had arranged the ending." = "{@bt_a|::subscribed_books::vocabulary::person}让别人领取结束冲突的功劳，{pro1}对此很满意，毕竟结局本就是{pro2}安排的。"
"{@bt_a|::subscribed_books::vocabulary::person} turned the conflict's own momentum against it, with a nudge here and a suggestion there." = "{@bt_a|::subscribed_books::vocabulary::person}这里轻推一下，那里提个建议，便让冲突自身的势头反过来瓦解它。"
"{@bt_a|::subscribed_books::vocabulary::person} avoided the conflict entirely by making sure it happened to someone else instead." = "{@bt_a|::subscribed_books::vocabulary::person}确保冲突发生在别人身上，自己则完全避开了它。"
"{@bt_a|::subscribed_books::vocabulary::person} smiled through the conflict, already three moves ahead of everyone else in it." = "{@bt_a|::subscribed_books::vocabulary::person}在冲突中始终微笑，算计已领先其他所有人三步。"
"{@bt_a|::subscribed_books::vocabulary::person} did not win the conflict so much as arrange for it to no longer need winning." = "与其说{@bt_a|::subscribed_books::vocabulary::person}赢得冲突，不如说安排得让它不再需要获胜。"
"{@bt_a|::subscribed_books::vocabulary::person} let the conflict escalate just enough to be useful, then defused it in a way that benefited only {pro1}." = "{@bt_a|::subscribed_books::vocabulary::person}让冲突升级到恰好有用的程度，随后以只对{pro1}有利的方式化解它。"
"{@bt_a|::subscribed_books::vocabulary::person} slipped a lie into the middle of the conflict and let it do all the fighting instead." = "{@bt_a|::subscribed_books::vocabulary::person}把一个谎言塞进冲突中间，让它代替自己完成所有战斗。"
"{@bt_a|::subscribed_books::vocabulary::person} watched the conflict unfold exactly as {pro1} had engineered it to, and stepped in only at the end." = "{@bt_a|::subscribed_books::vocabulary::person}看着冲突完全按{pro1}设计的方式展开，直到最后才介入。"
"{@bt_a|::subscribed_books::vocabulary::person} redirected the conflict with a well-placed rumor and stepped back to watch it work." = "{@bt_a|::subscribed_books::vocabulary::person}用一则放得恰到好处的谣言改变冲突方向，随后退到一旁，看它奏效。"
"{@bt_a|::subscribed_books::vocabulary::person} was gone by the time anyone realized the conflict had been arranged, not accidental." = "等有人意识到冲突是安排好的、并非意外时，{@bt_a|::subscribed_books::vocabulary::person}早已离开。"
"{@bt_a|::subscribed_books::vocabulary::person} used the conflict as cover for something else entirely, and walked away with both." = "{@bt_a|::subscribed_books::vocabulary::person}利用冲突掩护另一件全然不同的事，最后两边都得手，扬长而去。"
"{@bt_a|::subscribed_books::vocabulary::person} let the conflict's loudest voice believe {pro1} was winning, right up until it became clear {pro2} wasn't." = "{@bt_a|::subscribed_books::vocabulary::person}让冲突中声音最大的人相信{pro1}正在获胜，直到事实清楚表明，{pro2}并没有。"
"{@bt_a|::subscribed_books::vocabulary::person} treated the conflict as a puzzle rather than a fight, and solved it accordingly." = "{@bt_a|::subscribed_books::vocabulary::person}把冲突当成谜题，而不是战斗，并用解谜的方式解决了它。"

