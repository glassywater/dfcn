"Here is something done well, by people who did not have to." = "这些人本无义务去做，却把事情做得很好。"
"What was done here would be remembered without me. I write so that it is remembered rightly." = "即便没有我，此处的事迹也会被铭记。我写下它，是为了让人们正确地铭记。"
