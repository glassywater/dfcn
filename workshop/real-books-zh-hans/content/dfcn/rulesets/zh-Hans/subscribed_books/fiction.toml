base = "subscribed_books::fiction"

[[rulesets]]
[rulesets.rules]
"You want a story?" = "你想听个故事？"
"Fine." = "好吧。"
"But don't blame me if you can't sleep after." = "不过，听完睡不着可别怪我。"
"This one's about {@bt_a|::subscribed_books::vocabulary::person}, and what happened at {@bt_site|::subscribed_books::vocabulary::place}." = "这个故事讲的是 {@bt_a|::subscribed_books::vocabulary::person}，以及在 {@bt_site|::subscribed_books::vocabulary::place} 发生的事情。"
"Settle in." = "坐舒服些。"
"This won't take long." = "不会讲很久。"
"It's the story of {person}, and it begins on a {adj} night in {@bt_site|::subscribed_books::vocabulary::place}." = "这是 {person} 的故事，从 {@bt_site|::subscribed_books::vocabulary::place} 一个{adj}夜晚开始。"
"They tell this one in the taverns of {@bt_site|::subscribed_books::vocabulary::place}." = "{@bt_site|::subscribed_books::vocabulary::place} 的酒馆里流传着这个故事。"
"About {@bt_a|::subscribed_books::vocabulary::person}." = "是关于 {@bt_a|::subscribed_books::vocabulary::person} 的。"
"About what {pro} saw." = "关于{pro}见到的事情。"
"The firelight throws long shadows against the {adj} walls." = "火光在{adj}墙壁上投下长长的影子。"
"Outside, something howls." = "外面，某种东西正在嚎叫。"
"Inside, a voice begins: \"Let me tell you about {person}, and what happened in {@bt_site|::subscribed_books::vocabulary::place}." = "屋里，一个声音开口了：“让我讲讲 {person}，以及在 {@bt_site|::subscribed_books::vocabulary::place} 发生的事。"
"You think you know the story." = "你以为自己知道这个故事。"
"You don't.\"" = "你并不知道。”"
"That's the feeling this story gives you, the one about {person} and the night everything changed in {@bt_site|::subscribed_books::vocabulary::place}." = "这个关于 {person} 的故事，关于 {@bt_site|::subscribed_books::vocabulary::place} 那个一切都改变的夜晚的故事，就给你这样的感觉。"
"Lean closer." = "靠近一些。"
"Lower your voice." = "压低声音。"
"Here it comes." = "故事开始了。"
"And then --" = "然后——"
"Now here's where it gets strange." = "从这里开始，事情变得奇怪了。"
"Wait." = "等等。"
"It gets worse." = "更糟的还在后头。"
"The year was {@year}." = "那是 {@year} 年。"
"Remember that." = "记住这个年份。"
"It matters." = "这很重要。"
"{@bt_a|::subscribed_books::vocabulary::person} died." = "{@bt_a|::subscribed_books::vocabulary::person} 死了。"
"Just like that." = "就这么死了。"
"{cause}, in {@bt_site|::subscribed_books::vocabulary::place}." = "死因是{cause}，地点在 {@bt_site|::subscribed_books::vocabulary::place}。"
"Nobody saw it coming." = "谁也没有预料到。"
"Or maybe everybody did, and nobody said." = "也许人人都预料到了，只是谁也没说。"
"In {@year}, {cause} caught up with {@bt_a|::subscribed_books::vocabulary::person} at {@bt_site|::subscribed_books::vocabulary::place}." = "{@year} 年，{cause} 在 {@bt_site|::subscribed_books::vocabulary::place} 追上了 {@bt_a|::subscribed_books::vocabulary::person}。"
"The {adj} truth is, {pro} never had a chance." = "{adj}真相是，{pro}从来没有机会。"
"The death of {person} in {@year} -- by {cause}, at {@bt_site|::subscribed_books::vocabulary::place} -- is the kind of thing that makes you stop and wonder whether the world has any sense in it at all." = "{person} 于 {@year} 年在 {@bt_site|::subscribed_books::vocabulary::place} 死于{cause}；这样的事让你停下来，怀疑世界究竟还有没有道理。"
"There was this thing {@bt_a|::subscribed_books::vocabulary::person} made." = "{@bt_a|::subscribed_books::vocabulary::person} 曾做过这么一件东西。"
"{@bt_artifact|::subscribed_books::vocabulary::artifact}, they called it." = "他们叫它 {@bt_artifact|::subscribed_books::vocabulary::artifact}。"
"Crafted in {@year}." = "制成于 {@year} 年。"
"Beautiful and {adj} and wrong, somehow." = "美丽、{adj}，却又不知为何透着不对劲。"
"{@bt_a|::subscribed_books::vocabulary::person} became {role} that year, {@year}." = "{@bt_a|::subscribed_books::vocabulary::person} 在那年，也就是 {@year} 年，成为了{role}。"
"Everyone congratulated {obj}." = "人人都向{obj}道贺。"
"Everyone was wrong to." = "人人都贺错了。"
"Something happened in {@year}." = "{@year} 年发生了某件事。"
"The kind of thing people talk about in whispers." = "那是一件人们只敢低声谈论的事。"
"Quiet now." = "现在，安静些。"
"There's more." = "还没讲完。"
"Still with me?" = "还在听吗？"
"And that's the story." = "这就是这个故事。"
"I'm going to bed." = "我要去睡了。"
"They still tell it in {@bt_site|::subscribed_books::vocabulary::place}." = "{@bt_site|::subscribed_books::vocabulary::place} 的人还在讲它。"
"Some of them believe it." = "有些人相信它。"
"Do you?" = "你信吗？"
"The fire dies." = "火熄灭了。"
"The story ends." = "故事结束了。"
"But in the {adj} silence that follows, you find you're still listening, as if there might be one more word." = "然而在随之而来的{adj}寂静中，你发现自己仍在倾听，仿佛还会有最后一句话。"
"There isn't." = "并没有。"
"There never is." = "从来没有。"
"There was once a {race} named {@bt_a|::subscribed_books::vocabulary::person}, who lived in {@bt_site|::subscribed_books::vocabulary::place}." = "从前有一个名叫 {@bt_a|::subscribed_books::vocabulary::person} 的{race}，住在 {@bt_site|::subscribed_books::vocabulary::place}。"
"This is a story with a lesson, though the lesson may not be the one you expect." = "这是一个有教益的故事，虽然那教益也许并不是你期待的。"
"Listen and learn." = "听着，从中学习吧。"
"The tale of {person} is a parable for our times." = "{person} 的故事，是我们时代的寓言。"
"A parable is a mirror held up to the soul." = "寓言是一面照向灵魂的镜子。"
"The story of {person}, set in the {adj} streets of {@bt_site|::subscribed_books::vocabulary::place}, reflects back truths we would rather not see." = "{person} 的故事发生在 {@bt_site|::subscribed_books::vocabulary::place} {adj}街道上，映出了我们宁愿不看的真相。"
"Let those with ears hear it." = "愿有耳者听见。"
"And so it was that in {@year} --" = "于是，在 {@year} 年——"
"The lesson deepened in {@year}." = "{@year} 年，教益更加深刻。"
"The lesson is not about death." = "教益并不在于死亡。"
"The lesson is about what {pro} chose to do before it." = "教益在于{pro}死前选择做了什么。"
"In {@year}, {cause} claimed {@bt_a|::subscribed_books::vocabulary::person}." = "{@year} 年，{cause} 夺去了 {@bt_a|::subscribed_books::vocabulary::person} 的生命。"
"But {pos} choices had already sealed {pos2} fate long before." = "但{pos}选择，早已决定了{pos2}命运。"
"What {pro} put into it, {pro2} could never take back." = "{pro}投入其中的东西，{pro2}再也无法取回。"
"When {@bt_a|::subscribed_books::vocabulary::person} became {role} in {@year}, {pro} learned that power reveals character." = "{@year} 年，{@bt_a|::subscribed_books::vocabulary::person} 成为{role}时，{pro}懂得了权力会揭示品格。"
"It does not create it." = "权力并不创造品格。"
"In {@year}, {@bt_a|::subscribed_books::vocabulary::person} faced a choice." = "{@year} 年，{@bt_a|::subscribed_books::vocabulary::person} 面临一次选择。"
"The choice, not the outcome, is the point of this parable." = "这则寓言的要旨在于选择，而非结果。"
"Consider what has been said." = "思考刚才说过的话。"
"The wise will understand." = "智者自会理解。"
"The rest will hear it again, in time." = "其余的人，日后还会再听一遍。"
"Every parable carries a seed." = "每则寓言都携带一颗种子。"
"The story of {person} is now planted in you." = "{person} 的故事，如今已种在你的心中。"
"What grows from it depends entirely on the {adj} soil of your own character." = "它能长出什么，完全取决于你自身品格的{adj}土壤。"
"I was there." = "我就在场。"
"I saw it happen." = "我亲眼看着它发生。"
"My name doesn't matter." = "我的名字不重要。"
"What matters is what I saw {@bt_a|::subscribed_books::vocabulary::person} do in {@bt_site|::subscribed_books::vocabulary::place}." = "重要的是，我看见 {@bt_a|::subscribed_books::vocabulary::person} 在 {@bt_site|::subscribed_books::vocabulary::place} 做了什么。"
"This is not a story." = "这不是一个故事。"
"This is a testimony." = "这是一份证词。"
"I witnessed the events surrounding {person}, and I will tell the truth." = "我亲历了围绕 {person} 发生的事件，我将如实讲述。"
"I do not ask you to believe me." = "我不要求你相信我。"
"I ask only that you listen." = "我只要求你听。"
"I was present in {@bt_site|::subscribed_books::vocabulary::place} when {person} did what {pro} did, and the {adj} weight of what I witnessed demands that I speak." = "当 {person} 在 {@bt_site|::subscribed_books::vocabulary::place} 做出那些事时，我就在场；亲见之事的{adj}重量，要求我开口。"
"It was the year {@year}." = "那是 {@year} 年。"
"I remember it clearly." = "我记得清楚。"
"What happened next -- in {@year} -- I will never forget." = "随后在 {@year} 年发生的事，我永远不会忘记。"
"I watched {@bt_a|::subscribed_books::vocabulary::person} die." = "我看着 {@bt_a|::subscribed_books::vocabulary::person} 死去。"
"I stood there and did nothing." = "我站在那里，什么也没做。"
"I was close enough to see the light leave {pos} eyes." = "我离得够近，能看见光芒从{pos}眼中消失。"
"I saw {@bt_a|::subscribed_books::vocabulary::person} create {@bt_artifact|::subscribed_books::vocabulary::artifact} in {@year}." = "我看见 {@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年创造了 {@bt_artifact|::subscribed_books::vocabulary::artifact}。"
"{pos} hands moved like they had a mind of their own." = "{pos}双手移动着，仿佛有自己的意志。"
"They named {@bt_a|::subscribed_books::vocabulary::person} {role} in {@year}." = "{@year} 年，他们任命 {@bt_a|::subscribed_books::vocabulary::person} 为{role}。"
"I was in the crowd." = "我在人群中。"
"I cheered." = "我欢呼了。"
"I shouldn't have." = "我不该那样。"
"In {@year}, I was there." = "{@year} 年，我就在场。"
"I saw it." = "我亲眼见到了。"
"I still see it when I close my eyes." = "如今闭上眼睛，我仍然看得到。"
"That is what I witnessed." = "这便是我亲见的事情。"
"I swear it." = "我发誓。"
"I have told you what I saw." = "我已将所见告诉你。"
"What you do with it is your burden now." = "现在，如何对待它，是你的责任了。"
"The {adj} truth is heavy." = "{adj}真相很沉重。"
"I have carried it long enough." = "我已经背负得够久了。"
"With this testimony, I pass it to you." = "通过这份证词，我把它交给你。"
"Guard it well." = "请好好守护。"
"Long ago, when the beasts still spoke and the mountains had not yet learned to be silent, there lived a creature named {@bt_a|::subscribed_books::vocabulary::person}." = "很久以前，野兽仍会说话，群山尚未学会沉默时，有一个名叫 {@bt_a|::subscribed_books::vocabulary::person} 的生灵。"
"This is a fable." = "这是一则寓言。"
"The {race} in this story are not really {race2}." = "这个故事里的{race}，其实并不是{race2}。"
"They are you, and everyone you know." = "它们是你，也是你认识的每个人。"
"In the old days -- the truly {adj} old days, when the world was new and stories grew on trees -- there was a {race} called {@bt_a|::subscribed_books::vocabulary::person}, who lived in a place called {@bt_site|::subscribed_books::vocabulary::place}." = "在古老岁月——真正{adj}古老岁月，那时世界还新，故事长在树上——有一个叫 {@bt_a|::subscribed_books::vocabulary::person} 的{race}，住在一个叫 {@bt_site|::subscribed_books::vocabulary::place} 的地方。"
"What follows is a fable." = "下文是一则寓言。"
"The animals are metaphors." = "动物是比喻。"
"The moral is real." = "寓意是真实的。"
"One day, in the year {@year}, something happened." = "{@year} 年的某一天，有件事发生了。"
"And then, as fables go, the trouble began." = "随后，如寓言常有的那样，麻烦开始了。"
"The creature called {@bt_a|::subscribed_books::vocabulary::person} fell." = "那个叫 {@bt_a|::subscribed_books::vocabulary::person} 的生灵倒下了。"
"{cause}, they say, but in fables the cause is always the character's own nature." = "他们说是{cause}，但在寓言中，原因永远是角色自身的本性。"
"{@bt_a|::subscribed_books::vocabulary::person} was no more, lost to {cause} in {@year}." = "{@bt_a|::subscribed_books::vocabulary::person} 不复存在，于 {@year} 年死于{cause}。"
"The forest -- or the mountain, or the river -- mourned." = "森林——或者群山，或者河流——为之哀悼。"
"{@bt_a|::subscribed_books::vocabulary::person} made something {adj} in {@year}." = "{@year} 年，{@bt_a|::subscribed_books::vocabulary::person} 做出了某件{adj}东西。"
"In fables, objects always mean more than they seem." = "在寓言中，物件的含义总比表面更多。"
"In {@year}, something shifted in the natural order of {@bt_site|::subscribed_books::vocabulary::place}." = "{@year} 年，{@bt_site|::subscribed_books::vocabulary::place} 的自然秩序发生了某种变化。"
"And so the story turns, as stories must." = "故事就这样转折，正如故事总会做的那样。"
"The moral of the story?" = "这个故事的寓意？"
"You already know it." = "你已经知道了。"
"You just don't want to admit it." = "你只是不愿承认。"
"The fable ends." = "寓言结束了。"
"The {adj} truth it contained scurries away like a field mouse, hiding in the corners of your mind where it will nest and breed until you cannot ignore it any longer." = "它所包含的{adj}真相，像田鼠一样窜走，躲进你脑海的角落筑巢繁衍，直到你再也无法忽视。"
"They say {@bt_site|::subscribed_books::vocabulary::place} is haunted." = "人们说，{@bt_site|::subscribed_books::vocabulary::place} 闹鬼。"
"By what, you ask?" = "你问，被什么鬼缠上？"
"By the memory of {person}." = "被 {person} 的记忆。"
"Let me tell you why." = "让我告诉你为什么。"
"This is a ghost story." = "这是一个鬼故事。"
"Not the kind with rattling chains." = "不是那种铁链哗啦作响的。"
"The kind that follows you home." = "而是会跟着你回家的那种。"
"Do you believe in ghosts?" = "你相信鬼吗？"
"You will, after you hear what happened to {@bt_a|::subscribed_books::vocabulary::person} in {@bt_site|::subscribed_books::vocabulary::place}." = "听完 {@bt_a|::subscribed_books::vocabulary::person} 在 {@bt_site|::subscribed_books::vocabulary::place} 的遭遇，你就会信了。"
"The {adj} chill that creeps through {@bt_site|::subscribed_books::vocabulary::place} on certain nights is not the wind." = "某些夜晚，掠过 {@bt_site|::subscribed_books::vocabulary::place} 的{adj}寒意并不是风。"
"It is the echo of {person}, whose story I am about to tell you." = "那是 {person} 的回响，我正要讲述其故事。"
"Listen carefully." = "仔细听。"
"The dead are listening too." = "死者也在听。"
"It was {@year} when the haunting began." = "闹鬼始于 {@year} 年。"
"After dark." = "在天黑之后。"
"But dying, it turns out, was not the end." = "然而事实证明，死亡并不是结束。"
"They killed {@bt_a|::subscribed_books::vocabulary::person} in {@year}." = "{@year} 年，他们杀死了 {@bt_a|::subscribed_books::vocabulary::person}。"
"But {pro} didn't stay dead." = "但{pro}没有一直死下去。"
"Not entirely." = "至少没有完全死去。"
"In {@year}, {cause} took {person} at {@bt_site|::subscribed_books::vocabulary::place}." = "{@year} 年，{cause} 在 {@bt_site|::subscribed_books::vocabulary::place} 夺去了 {person} 的生命。"
"The body was buried." = "尸体被埋葬了。"
"The spirit, however, had other {adj} plans." = "灵魂却另有{adj}打算。"
"Some say it's still warm to the touch, even now." = "有人说，即使如今，摸上去仍是温热的。"
"Something that left a {adj} stain on {@bt_site|::subscribed_books::vocabulary::place} that will not wash out." = "某件事给 {@bt_site|::subscribed_books::vocabulary::place} 留下了一道永远洗不掉的{adj}污迹。"
"The candle flickers." = "烛火摇曳。"
"Was that the wind?" = "那是风吗？"
"That's the story." = "故事就是这样。"
"Sleep well tonight." = "今晚好好睡吧。"
"Or don't." = "或者别睡。"
"The ghost of {person} has no lessons to teach, no messages to deliver." = "{person} 的鬼魂没有教训要传授，也没有消息要传递。"
"{pro} simply persists, a {adj} stain on the fabric of the world, reminding us that some stories never truly end." = "{pro}只是长存，化作世界织锦上一道{adj}污迹，提醒我们，有些故事永远不会真正结束。"

