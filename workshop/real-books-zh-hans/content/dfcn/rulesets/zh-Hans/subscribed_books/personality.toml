# Trait: honest.
[[rulesets]]
[rulesets.rules]
"\"I will not lie to you,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"Even when the truth is harder. Especially then.\"" = "“我不会骗你，”{@bt_a|::subscribed_books::vocabulary::person}说道，“即使真相更难承受，尤其是在那种时候。”"
"\"I could tell you what you want to hear,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but I'd be lying, and I don't do that.\"" = "“我可以说你想听的话，”{@bt_a|::subscribed_books::vocabulary::person}说道，“可那就是撒谎，而我不撒谎。”"
"\"Ask me anything,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I'll answer honestly, even the parts you won't like.\"" = "“随便问，”{@bt_a|::subscribed_books::vocabulary::person}说道，“我会诚实回答，哪怕是你不愿听的部分。”"
"\"I'm not trying to manage how you feel about this,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I'm just telling you what happened.\"" = "“我不是想控制你对这事的感受，”{@bt_a|::subscribed_books::vocabulary::person}说道，“只是告诉你发生了什么。”"
"\"You deserve the truth,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"even the ugly parts of it. Especially those.\"" = "“你有权知道真相，”{@bt_a|::subscribed_books::vocabulary::person}说道，“包括丑陋的部分，尤其是那些部分。”"
"\"I won't dress it up,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"It is what it is, and pretending otherwise helps no one.\"" = "“我不会粉饰，”{@bt_a|::subscribed_books::vocabulary::person}说道，“事情就是这样，装成别的样子，对谁都没好处。”"
"\"I could soften this,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but softened isn't the same as true.\"" = "“我可以说得温和些，”{@bt_a|::subscribed_books::vocabulary::person}说道，“但温和不等于真实。”"
"\"You want an honest answer or a comfortable one?\" {@bt_a|::subscribed_books::vocabulary::person} asked. \"I only have the honest kind.\"" = "“你想听诚实的答案，还是舒服的答案？”{@bt_a|::subscribed_books::vocabulary::person}问，“我只有诚实的那一种。”"
"\"I don't know how to say it gently,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"so I'm just going to say it.\"" = "“我不知道怎么委婉地说，”{@bt_a|::subscribed_books::vocabulary::person}说道，“所以就直说了。”"
"\"Believe me or don't,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but I've told you exactly what I saw.\"" = "“信不信由你，”{@bt_a|::subscribed_books::vocabulary::person}说道，“我已把看到的一切如实告诉你。”"
"\"I'm not going to spin this for you,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"You'll get the truth, plain, and you can decide what to do with it.\"" = "“我不会替你包装此事，”{@bt_a|::subscribed_books::vocabulary::person}说道，“你会得到朴素的真相，如何处理，由你决定。”"
"\"It would be easier to lie right now,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I'm not going to, though.\"" = "“现在撒谎会更容易，”{@bt_a|::subscribed_books::vocabulary::person}说道，“但我不会。”"
"\"I have never once lied to you,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"and I'm not about to start.\"" = "“我从未骗过你，”{@bt_a|::subscribed_books::vocabulary::person}说道，“也不打算现在开始。”"
"\"You can ask someone else if you want it sugarcoated,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I only have the one version.\"" = "“你要听好听的，可以去问别人，”{@bt_a|::subscribed_books::vocabulary::person}说道，“我这里只有一个版本。”"
"\"This is going to be hard to hear,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but it would be worse for me to lie about it.\"" = "“这会很难听进去，”{@bt_a|::subscribed_books::vocabulary::person}说道，“但要我为此撒谎，只会更糟。”"
"\"I won't manipulate you into agreeing,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"If you agree, I want it to be because it's true.\"" = "“我不会操纵你，让你同意，”{@bt_a|::subscribed_books::vocabulary::person}说道，“如果你赞同，我希望是因为事实如此。”"
"\"The truth doesn't need my help to be convincing,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"It just needs to be said.\"" = "“真相不需要我的帮助就能说服人，”{@bt_a|::subscribed_books::vocabulary::person}说道，“只需要被说出来。”"
"\"I could tell you a nicer version of this,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but it wouldn't be the real one.\"" = "“我可以讲一个更好听的版本，”{@bt_a|::subscribed_books::vocabulary::person}说道，“但那不会是真实的版本。”"
"\"I'm not clever enough to lie well,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"and I wouldn't want to be, honestly.\"" = "“我没有聪明到能把谎撒好，”{@bt_a|::subscribed_books::vocabulary::person}说道，“说真的，我也不愿那样聪明。”"
"\"Here's exactly what happened,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"no more, no less, and no easier than it actually was.\"" = "“事情就是这样发生的，”{@bt_a|::subscribed_books::vocabulary::person}说道，“不多不少，也不比当时实际的情况轻松。”"

[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} spoke plainly. No embellishment, no spin, no careful omissions. Just the truth, which was harder to hear than any lie." = "{@bt_a|::subscribed_books::vocabulary::person}直言不讳，没有修饰、歪曲或刻意遗漏。只有真相，比任何谎言都难听进去。"
"{@bt_a|::subscribed_books::vocabulary::person} answered every question directly, even the ones {pro1} clearly wished hadn't been asked." = "{@bt_a|::subscribed_books::vocabulary::person}直接回答每个问题，即使有些问题，{pro1}显然希望从未被问起。"
"{@bt_a|::subscribed_books::vocabulary::person} did not soften the facts to make them easier to sit with." = "{@bt_a|::subscribed_books::vocabulary::person}没有为了让事实更好接受，而将它们说得温和些。"
"{@bt_a|::subscribed_books::vocabulary::person} laid out exactly what had happened, in order, without shaping it to look better for anyone -- including {ref1}." = "{@bt_a|::subscribed_books::vocabulary::person}按顺序如实陈述经过，没有为了任何人的面子而修饰，包括{ref1}。"
"{@bt_a|::subscribed_books::vocabulary::person} corrected the room's flattering version of events with the plainer, less flattering true one." = "{@bt_a|::subscribed_books::vocabulary::person}纠正了众人美化的事件版本，换成更朴素、也更不好听的真相。"
"{@bt_a|::subscribed_books::vocabulary::person} answered a question {pro1} could have dodged, and answered it fully." = "{@bt_a|::subscribed_books::vocabulary::person}回答了一个{pro1}本可以回避的问题，而且答得完整。"
"{@bt_a|::subscribed_books::vocabulary::person} did not let the conversation drift toward comfortable half-truths. {pro1} pulled it back, plainly, every time." = "{@bt_a|::subscribed_books::vocabulary::person}不让谈话漂向令人舒适的半真半假。每一次，{pro1}都会直截了当地将它拉回来。"
"{@bt_a|::subscribed_books::vocabulary::person} admitted {pos1} own mistake in the discussion before anyone else had the chance to point it out." = "在别人有机会指出之前，{@bt_a|::subscribed_books::vocabulary::person}已在讨论中承认{pos1}错误。"
"{@bt_a|::subscribed_books::vocabulary::person} gave the same account twice, in two different rooms, and it did not change either time." = "{@bt_a|::subscribed_books::vocabulary::person}在两个不同的房间里，讲了两遍相同的经过，一次也没有变。"
"{@bt_a|::subscribed_books::vocabulary::person} said the uncomfortable thing everyone else in the discussion was avoiding." = "{@bt_a|::subscribed_books::vocabulary::person}说出了讨论中其他人都在回避的、令人不舒服的事。"
"{@bt_a|::subscribed_books::vocabulary::person} refused to let a kind lie pass unchallenged, even when the lie would have made things easier." = "{@bt_a|::subscribed_books::vocabulary::person}不肯让善意的谎言无人质疑地通过，即使那谎言本能让事情更容易。"
"{@bt_a|::subscribed_books::vocabulary::person} spoke without hedging, stating things as {pro1} understood them, consequences included." = "{@bt_a|::subscribed_books::vocabulary::person}说话毫不含糊，按{pro1}理解的样子陈述事情，连后果也一并说出。"
"{@bt_a|::subscribed_books::vocabulary::person} did not claim more credit than {pro1} deserved, nor less blame than {pro2} deserved either." = "{@bt_a|::subscribed_books::vocabulary::person}不冒领超过{pro1}应得的功劳，也不推卸{pro2}应负的责任。"
"{@bt_a|::subscribed_books::vocabulary::person} answered honestly even when a vaguer answer would have ended the discussion faster." = "即使模糊的回答能更快结束讨论，{@bt_a|::subscribed_books::vocabulary::person}仍然诚实作答。"
"{@bt_a|::subscribed_books::vocabulary::person} would not let the discussion settle on a comfortable version of events that wasn't quite true." = "{@bt_a|::subscribed_books::vocabulary::person}不会让讨论停在一个令人舒适，却不完全真实的事件版本上。"
"{@bt_a|::subscribed_books::vocabulary::person} stated {pos1} disagreement outright rather than let it go unsaid for the sake of harmony." = "{@bt_a|::subscribed_books::vocabulary::person}直说{pos1}不同意见，而不是为维持和气闭口不提。"
"{@bt_a|::subscribed_books::vocabulary::person} gave a straight answer to a question clearly designed to be dodged." = "面对一个显然刻意让人回避的问题，{@bt_a|::subscribed_books::vocabulary::person}仍给出了直接的回答。"
"{@bt_a|::subscribed_books::vocabulary::person} did not flatter anyone in the discussion, {ref1} included." = "{@bt_a|::subscribed_books::vocabulary::person}在讨论中不奉承任何人，包括{ref1}。"
"{@bt_a|::subscribed_books::vocabulary::person} told the plain truth of it, and let the discussion be harder for it, rather than easier and false." = "{@bt_a|::subscribed_books::vocabulary::person}说出朴素的真相，宁愿让讨论因此更艰难，也不愿它轻松却虚假。"
"{@bt_a|::subscribed_books::vocabulary::person} said exactly what {pro1} thought, in exactly the words {pro2} thought it in, without translation." = "{@bt_a|::subscribed_books::vocabulary::person}如实说出{pro1}所想，用的就是{pro2}心里的那些话，毫不改换。"

