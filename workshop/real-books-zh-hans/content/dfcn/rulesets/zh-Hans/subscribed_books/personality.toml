"\"I like you better when you're afraid,\" {@bt_a|::subscribed_books::vocabulary::person} said, tilting {pos1} head." = "“我更喜欢你害怕的样子，”{@bt_a|::subscribed_books::vocabulary::person}偏着{pos1}脑袋说。"
