"\"Keep talking,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I like watching you realize none of it matters.\"" = "“继续说，”{@bt_a|::subscribed_books::vocabulary::person}说道，“我喜欢看你明白，这一切都没有用。”"
"\"Oh, don't stop,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"This is the best part.\"" = "“哦，别停，”{@bt_a|::subscribed_books::vocabulary::person}说道，“这才是最精彩的部分。”"
"\"I could end this argument in one sentence,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but where's the fun in that?\"" = "“我一句话就能结束争论，”{@bt_a|::subscribed_books::vocabulary::person}说道，“可那还有什么乐趣？”"
"\"You look like you're about to break,\" {@bt_a|::subscribed_books::vocabulary::person} said, delighted. \"Please don't disappoint me now.\"" = "“看起来你快崩溃了，”{@bt_a|::subscribed_books::vocabulary::person}欣喜地说，“到了现在，可别让我失望。”"
"\"I've heard better arguments from people I actually respect,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"Which is to say, I've heard better arguments.\"" = "“我真正尊重的人，讲过更好的论点，”{@bt_a|::subscribed_books::vocabulary::person}说道，“也就是说，我听过更好的论点。”"
"\"It's cute that you thought that would work on me,\" {@bt_a|::subscribed_books::vocabulary::person} said." = "“你居然以为这能对我奏效，真可爱，”{@bt_a|::subscribed_books::vocabulary::person}说道。"
"\"Go on, defend yourself,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I've got time. I've got nothing but time, actually.\"" = "“继续，替自己辩护，”{@bt_a|::subscribed_books::vocabulary::person}说道，“我有时间。实际上，我除了时间，什么都没有。”"
"\"You should hear yourself,\" {@bt_a|::subscribed_books::vocabulary::person} said, smiling. \"It's the best thing I've listened to all week.\"" = "“你真该听听自己，”{@bt_a|::subscribed_books::vocabulary::person}笑着说，“这是我这周听到的最精彩的东西。”"
"\"I'm going to let you finish,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"because watching you dig deeper is more satisfying than stopping you.\"" = "“我会让你说完，”{@bt_a|::subscribed_books::vocabulary::person}说道，“因为看你越陷越深，比拦住你更令我满足。”"
"\"Poor thing,\" {@bt_a|::subscribed_books::vocabulary::person} said, in a tone with no pity in it at all. \"Did you think I was going to be fair?\"" = "“可怜的东西，”{@bt_a|::subscribed_books::vocabulary::person}用毫无怜悯的语气说，“你以为我会讲公平吗？”"
"\"That's the spirit,\" {@bt_a|::subscribed_books::vocabulary::person} said, watching the other person's composure crack. \"Fight me on it. It's more fun this way.\"" = "“就该这样，”{@bt_a|::subscribed_books::vocabulary::person}看着对方的镇定裂开，“跟我争，这样更好玩。”"
"\"You're shaking,\" {@bt_a|::subscribed_books::vocabulary::person} said, sounding pleased rather than concerned. \"Good.\"" = "“你在发抖，”{@bt_a|::subscribed_books::vocabulary::person}说道，听起来是高兴而非担心，“很好。”"
"\"I could stop,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but I don't want to.\"" = "“我可以停下，”{@bt_a|::subscribed_books::vocabulary::person}说道，“但我不想。”"
"\"There it is,\" {@bt_a|::subscribed_books::vocabulary::person} said, watching the hurt land. \"That's the face I was waiting for.\"" = "“来了，”{@bt_a|::subscribed_books::vocabulary::person}看着伤害落到实处，“这就是我一直等着的表情。”"
"\"You'll remember this argument for a long time,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I intend to make sure of it.\"" = "“你会记得这场争论很久，”{@bt_a|::subscribed_books::vocabulary::person}说道，“我会确保如此。”"

