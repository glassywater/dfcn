# 声明内生成变化的规范形变体；原作者句式保留。
[[rulesets]]
[rulesets.rules]
"This essay is a argument, and I make no apology for its {adj} tone." = "这篇文章是一场争论，我不会为它{adj}的语气道歉。"
"When {@bt_a|::subscribed_books::vocabulary::person} was made {role} in {@year}, it was a insult to every competent soul in {@bt_e|::subscribed_books::vocabulary::entity}." = "{@year} 年任命 {@bt_a|::subscribed_books::vocabulary::person} 为{role}，是对 {@bt_e|::subscribed_books::vocabulary::entity} 每一位有才干者的侮辱。"
"A essay by {person}." = "{person} 的文章。"
"A essay by {person}, who loves this place more than words can say, and yet must try." = "{person} 的文章；对这片土地的热爱，语言无法尽述，却仍必须尝试。"
"This is a essay of admiration." = "这是一篇表达敬慕的文章。"
"Participants: {person}, philosopher of {@bt_e|::subscribed_books::vocabulary::entity}; a unnamed Interlocutor." = "参与者：{person}，{@bt_e|::subscribed_books::vocabulary::entity} 的哲学家；一位无名对话者。"
"When I became {role} in {@year}, I thought it was a honor." = "{@year} 年我成为{role}时，以为那是荣耀。"

