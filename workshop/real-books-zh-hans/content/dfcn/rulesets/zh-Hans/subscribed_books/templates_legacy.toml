"THE GRAND COMPENDIUM. A comprehensive reference work covering the notable subjects of {@bt_entity|::subscribed_books::vocabulary::entity}. Compiled by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}." = "大百科全书。全面收录{@bt_entity|::subscribed_books::vocabulary::entity}重要对象的参考著作。编者：{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}。"
"This encyclopedia aspires to completeness. Every {::subscribed_books::adj} subject of significance within {@bt_entity|::subscribed_books::vocabulary::entity} is documented herein." = "这部百科全书力求完整。{@bt_entity|::subscribed_books::vocabulary::entity}范围内每个{::subscribed_books::adj}而重要的对象，都记录在此。"
"The ambition of this encyclopedia is {::subscribed_books::adj}: to document every notable figure, artifact, and site within the sphere of {@bt_entity|::subscribed_books::vocabulary::entity}. I, {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, have labored at {@bt_site|::subscribed_books::vocabulary::place} to produce a work worthy of the civilization it describes. Whether I have succeeded, the reader must judge." = "本百科全书怀有{::subscribed_books::adj}的雄心：记录{@bt_entity|::subscribed_books::vocabulary::entity}范围内每位重要人物、每件神器和每处据点。我，{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}，在{@bt_site|::subscribed_books::vocabulary::place}辛勤工作，力求写出一部配得上它所描述的文明的作品。是否成功，交由读者判断。"
"ENTRY -- subject relevant to the period of {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "条目——{@bt_year|::subscribed_books::vocabulary::birth_year}年相关时期的对象："
"The next entry in the compendium, dated to {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "百科全书下一条目，年代为{@bt_year|::subscribed_books::vocabulary::birth_year}年："
"ENTRY: {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}. {@bt_Race|::subscribed_books::vocabulary::race} of {@bt_entity|::subscribed_books::vocabulary::entity}. Born {@bt_birth_year|::subscribed_books::vocabulary::birth_year}. Died {@bt_year|::subscribed_books::vocabulary::birth_year}, {@bt_cause|::subscribed_books::vocabulary::cause}, at {@bt_evsite|::subscribed_books::vocabulary::place}. A figure of {::subscribed_books::adj} significance." = "条目：{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}。{@bt_entity|::subscribed_books::vocabulary::entity}的{@bt_Race|::subscribed_books::vocabulary::race}。生于{@bt_birth_year|::subscribed_books::vocabulary::birth_year}年。于{@bt_year|::subscribed_books::vocabulary::birth_year}年在{@bt_evsite|::subscribed_books::vocabulary::place}因{@bt_cause|::subscribed_books::vocabulary::cause}去世。具有{::subscribed_books::adj}重要性的人物。"
"ENTRY: {@bt_artifact|::subscribed_books::vocabulary::artifact}. Created by {@bt_hero|::subscribed_books::vocabulary::person} in {@bt_year|::subscribed_books::vocabulary::birth_year}. A work of {::subscribed_books::adj} importance to {@bt_entity|::subscribed_books::vocabulary::entity}." = "条目：{@bt_artifact|::subscribed_books::vocabulary::artifact}。由{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年创造。对{@bt_entity|::subscribed_books::vocabulary::entity}具有{::subscribed_books::adj}重要性的作品。"
"ENTRY: {@bt_evsite|::subscribed_books::vocabulary::place}. Founded {@bt_year|::subscribed_books::vocabulary::birth_year} by {@bt_entity|::subscribed_books::vocabulary::entity}. A settlement of strategic and cultural value." = "条目：{@bt_evsite|::subscribed_books::vocabulary::place}。由{@bt_entity|::subscribed_books::vocabulary::entity}于{@bt_year|::subscribed_books::vocabulary::birth_year}年建立。具有战略与文化价值的聚落。"
"ENTRY: {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}. Appointed {@bt_role|::subscribed_books::vocabulary::role} of {@bt_entity|::subscribed_books::vocabulary::entity} in {@bt_year|::subscribed_books::vocabulary::birth_year}." = "条目：{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}。于{@bt_year|::subscribed_books::vocabulary::birth_year}年被任命为{@bt_entity|::subscribed_books::vocabulary::entity}的{@bt_role|::subscribed_books::vocabulary::role}。"
"ENTRY: Events of {@bt_year|::subscribed_books::vocabulary::birth_year}. Of {::subscribed_books::adj} significance to {@bt_entity|::subscribed_books::vocabulary::entity}." = "条目：{@bt_year|::subscribed_books::vocabulary::birth_year}年的事件。对{@bt_entity|::subscribed_books::vocabulary::entity}具有{::subscribed_books::adj}意义。"
"Further entries follow." = "以下还有更多条目。"
"THE GRAND COMPENDIUM is complete. Additions and corrections are welcomed. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "大百科全书完成。欢迎补充和更正。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"This encyclopedia, though {::subscribed_books::adj} in scope, is by nature incomplete. The world grows, and with it the need for new entries. Future scholars are invited to expand upon this foundation. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "这部百科全书的范围虽然{::subscribed_books::adj}，本质上仍不完整。世界在发展，对新条目的需求也在增长。欢迎后世学者在此基础上继续扩充。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"A collection of curiosities, wonders, and oddities drawn from the history of {@bt_entity|::subscribed_books::vocabulary::entity}. Compiled for the delight of the reader." = "一部从{@bt_entity|::subscribed_books::vocabulary::entity}历史中收集的奇事、奇观与怪闻，编写来供读者赏玩。"
"Not everything worth knowing is important. Some things are simply {::subscribed_books::adj} and strange. This encyclopedia collects them." = "并非一切值得知道的东西都很重要。有些事物只是{::subscribed_books::adj}而奇怪。这部百科全书将它们收集起来。"
"The world of {@bt_entity|::subscribed_books::vocabulary::entity} is full of things that make you stop and say: \"truly?\" This encyclopedia, compiled by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} at {@bt_site|::subscribed_books::vocabulary::place}, collects the {::subscribed_books::adj}, the improbable, and the frankly bizarre for the edification and amusement of the reader." = "{@bt_entity|::subscribed_books::vocabulary::entity}的世界充满让人停下来问“真的吗？”的事物。这部百科全书由{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}在{@bt_site|::subscribed_books::vocabulary::place}编写，汇集了{::subscribed_books::adj}之事、难以置信之事，以及坦率地说十分离奇之事，供读者学习与娱乐。"
"Another curiosity, from around {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "另一件奇事，约发生于{@bt_year|::subscribed_books::vocabulary::birth_year}年："
"Consider: {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, who died in {@bt_year|::subscribed_books::vocabulary::birth_year} by {@bt_cause|::subscribed_books::vocabulary::cause}. The circumstances were, to say the least, {::subscribed_books::adj}." = "请看：{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}，于{@bt_year|::subscribed_books::vocabulary::birth_year}年因{@bt_cause|::subscribed_books::vocabulary::cause}去世。事情经过，至少可以说是{::subscribed_books::adj}的。"
"{@bt_artifact|::subscribed_books::vocabulary::artifact}, created by {@bt_hero|::subscribed_books::vocabulary::person} in {@bt_year|::subscribed_books::vocabulary::birth_year}. A {::subscribed_books::adj} object whose story is stranger than fiction." = "{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年创造的{@bt_artifact|::subscribed_books::vocabulary::artifact}。一件{::subscribed_books::adj}的物品，它的故事比虚构还离奇。"
"In {@bt_year|::subscribed_books::vocabulary::birth_year}, something happened that defies easy categorization. It belongs in this collection." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年发生了一件难以轻易归类的事。它应当收入本集。"
"Curious, is it not?" = "很奇妙，不是吗？"
"The curious collection ends here, though the world continues to produce wonders. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "这部奇闻集到此结束，但世界仍在不断产生奇迹。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"A reference encyclopedia for scholars of {@bt_entity|::subscribed_books::vocabulary::entity}. Entries organized for efficient consultation." = "一部供{@bt_entity|::subscribed_books::vocabulary::entity}学者使用的参考百科全书。条目经过整理，便于高效查阅。"
"This work serves as a {::subscribed_books::adj} reference for researchers working within the domain of {@bt_entity|::subscribed_books::vocabulary::entity}'s history and culture." = "这部作品为研究{@bt_entity|::subscribed_books::vocabulary::entity}历史与文化的人员提供{::subscribed_books::adj}的参考。"
"Reference entry, period of {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "参考条目，{@bt_year|::subscribed_books::vocabulary::birth_year}年相关时期："
"{@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}. Deceased {@bt_year|::subscribed_books::vocabulary::birth_year}. Cause: {@bt_cause|::subscribed_books::vocabulary::cause}. See related entries." = "{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}。卒于{@bt_year|::subscribed_books::vocabulary::birth_year}年。死因：{@bt_cause|::subscribed_books::vocabulary::cause}。参见相关条目。"
"{@bt_artifact|::subscribed_books::vocabulary::artifact}. Created {@bt_year|::subscribed_books::vocabulary::birth_year} by {@bt_hero|::subscribed_books::vocabulary::person}. Cross-reference: crafting techniques, {@bt_entity|::subscribed_books::vocabulary::entity} artifacts." = "{@bt_artifact|::subscribed_books::vocabulary::artifact}。由{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年创造。交叉参照：制作技法、{@bt_entity|::subscribed_books::vocabulary::entity}神器。"
"{@bt_evsite|::subscribed_books::vocabulary::place}. Est. {@bt_year|::subscribed_books::vocabulary::birth_year}. Founded by {@bt_entity|::subscribed_books::vocabulary::entity}. See: settlement patterns." = "{@bt_evsite|::subscribed_books::vocabulary::place}。建立于{@bt_year|::subscribed_books::vocabulary::birth_year}年。建立者：{@bt_entity|::subscribed_books::vocabulary::entity}。参见：聚落模式。"
"See: events of {@bt_year|::subscribed_books::vocabulary::birth_year}. Cross-reference as appropriate." = "参见：{@bt_year|::subscribed_books::vocabulary::birth_year}年的事件。酌情交叉参照。"
"End of reference entries. Index forthcoming. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "参考条目结束。索引即将编制。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"An encyclopedia for everyone! No prior knowledge required. Just curiosity and a love of good stories." = "一本适合所有人的百科全书！不需要任何已有知识。只需好奇心，以及对精彩故事的热爱。"
"Welcome to the popular encyclopedia of {@bt_entity|::subscribed_books::vocabulary::entity}! {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} has compiled the most {::subscribed_books::adj} stories for your enjoyment." = "欢迎阅读{@bt_entity|::subscribed_books::vocabulary::entity}的通俗百科全书！{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}汇集了最{::subscribed_books::adj}的故事，供你欣赏。"
"Not every reader wants footnotes and cross-references. Some just want to know: what happened? who was involved? and was it interesting? This popular encyclopedia of {@bt_entity|::subscribed_books::vocabulary::entity}, compiled by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, answers all three questions with a resounding \"yes.\"" = "并非每位读者都想要脚注和交叉参照。有些人只想知道：发生了什么？涉及谁？有趣吗？这部{@bt_entity|::subscribed_books::vocabulary::entity}通俗百科全书由{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}编写，对这三个问题都给出了响亮的“是”。"
"Here's a good one from {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "这里有个{@bt_year|::subscribed_books::vocabulary::birth_year}年的好故事："
"Next up -- and you're going to love this -- something from {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "接下来——你一定会喜欢——是{@bt_year|::subscribed_books::vocabulary::birth_year}年的一件事："
"You won't believe how {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} died. It was {@bt_year|::subscribed_books::vocabulary::birth_year}, and {@bt_cause|::subscribed_books::vocabulary::cause} was involved. Trust me, it's a story." = "你不会相信{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}是怎么死的。那是{@bt_year|::subscribed_books::vocabulary::birth_year}年，涉及{@bt_cause|::subscribed_books::vocabulary::cause}。相信我，这确实是个故事。"
"Ever heard of {@bt_artifact|::subscribed_books::vocabulary::artifact}? {@bt_hero|::subscribed_books::vocabulary::person} made it in {@bt_year|::subscribed_books::vocabulary::birth_year}. It's {::subscribed_books::adj}. Let me tell you about it." = "听说过{@bt_artifact|::subscribed_books::vocabulary::artifact}吗？{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年创造了它。它很{::subscribed_books::adj}。让我讲讲。"
"{@bt_evsite|::subscribed_books::vocabulary::place} was founded in {@bt_year|::subscribed_books::vocabulary::birth_year}. Sounds boring? It wasn't. Here's why." = "{@bt_evsite|::subscribed_books::vocabulary::place}建立于{@bt_year|::subscribed_books::vocabulary::birth_year}年。听起来无聊？其实并不。理由如下。"
"Something {::subscribed_books::adj} happened in {@bt_year|::subscribed_books::vocabulary::birth_year}. Read on." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年发生了{::subscribed_books::adj}的事情。请继续读。"
"Good stuff, right? There's more." = "不错吧？还有更多。"
"That's the popular encyclopedia of {@bt_entity|::subscribed_books::vocabulary::entity}. Hope you enjoyed it as much as I enjoyed writing it. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "这就是{@bt_entity|::subscribed_books::vocabulary::entity}的通俗百科全书。希望你阅读时的乐趣，与我写作时一样多。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"This encyclopedia tells connected stories. Each entry leads to the next, weaving a {::subscribed_books::adj} tapestry of {@bt_entity|::subscribed_books::vocabulary::entity}'s history." = "这部百科全书讲述相互联系的故事。每个条目都引出下一个，编织出{@bt_entity|::subscribed_books::vocabulary::entity}历史的一幅{::subscribed_books::adj}锦绣。"
"History is not a list of facts. It is a web of connections. This encyclopedia traces those threads." = "历史并非事实清单。它是一张关系网。这部百科全书追溯其中的线索。"
"The entries in this encyclopedia are not isolated. They are links in a {::subscribed_books::adj} chain, each one connected to the others by the invisible threads of cause and consequence. I, {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, have arranged them so that the reader may follow the story of {@bt_entity|::subscribed_books::vocabulary::entity} as it actually unfolded: not in alphabetical order, but in the order of life." = "本百科全书的条目并不孤立。它们是一条{::subscribed_books::adj}链条中的环节，以看不见的因果线索相互连接。我，{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}，这样编排它们，是为了让读者跟随{@bt_entity|::subscribed_books::vocabulary::entity}真实展开的故事：按生活的次序，而非字母的次序。"
"The story continues with {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "故事从{@bt_year|::subscribed_books::vocabulary::birth_year}年继续："
"The death of {@bt_hero|::subscribed_books::vocabulary::person} in {@bt_year|::subscribed_books::vocabulary::birth_year} connects to everything that came before and after. {@bt_Cause|::subscribed_books::vocabulary::cause} was the instrument, but the causes ran deeper." = "{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年去世，与前后发生的一切相连。{@bt_Cause|::subscribed_books::vocabulary::cause}是手段，但根源更加深远。"
"{@bt_artifact|::subscribed_books::vocabulary::artifact}, created in {@bt_year|::subscribed_books::vocabulary::birth_year}, was both a product of its time and a catalyst for what followed." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年创造的{@bt_artifact|::subscribed_books::vocabulary::artifact}，既是时代的产物，也是后来事件的催化剂。"
"{@bt_evsite|::subscribed_books::vocabulary::place}, founded in {@bt_year|::subscribed_books::vocabulary::birth_year}, was not an isolated event but a consequence of {@bt_entity|::subscribed_books::vocabulary::entity}'s broader trajectory." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年{@bt_evsite|::subscribed_books::vocabulary::place}的建立并非孤立事件，而是{@bt_entity|::subscribed_books::vocabulary::entity}整体发展轨迹的结果。"
"When {@bt_hero|::subscribed_books::vocabulary::person} became {@bt_role|::subscribed_books::vocabulary::role} in {@bt_year|::subscribed_books::vocabulary::birth_year}, it was the next link in a chain stretching back generations." = "{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年成为{@bt_role|::subscribed_books::vocabulary::role}，这是延续数代的链条中又一个环节。"
"The events of {@bt_year|::subscribed_books::vocabulary::birth_year} rippled outward, connecting to entries both before and after this one." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年的事件向外荡起涟漪，与本条目前后的各条记录相连。"
"Follow the thread. It leads somewhere." = "跟随线索。它会引向某处。"
"The living history of {@bt_entity|::subscribed_books::vocabulary::entity} does not end with this encyclopedia. It continues in every new event, every new connection." = "{@bt_entity|::subscribed_books::vocabulary::entity}鲜活的历史，不会随这部百科全书终结。它在每个新事件、每段新联系中继续。"
"This encyclopedia is a snapshot of a living system. The {::subscribed_books::adj} web of {@bt_entity|::subscribed_books::vocabulary::entity}'s history grows with each passing year, and no single work can capture it all. {::subscribed_books::templates_legacy::metaphor} But the attempt, I believe, is worth making. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "本百科全书是一个活跃系统的瞬间记录。{@bt_entity|::subscribed_books::vocabulary::entity}历史的{::subscribed_books::adj}网络年年增长，任何一部作品都无法尽数捕捉。{::subscribed_books::templates_legacy::metaphor}但我相信，这仍值得尝试。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"This encyclopedia is a snapshot of a living system. The {::subscribed_books::adj} web of {@bt_entity|::subscribed_books::vocabulary::entity}'s history grows with each passing year, and no single work can capture it all. But the attempt, I believe, is worth making. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "本百科全书是一个活跃系统的瞬间记录。{@bt_entity|::subscribed_books::vocabulary::entity}历史的{::subscribed_books::adj}网络年年增长，任何一部作品都无法尽数捕捉。但我相信，这仍值得尝试。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"A grammatical analysis of the language of {@bt_entity|::subscribed_books::vocabulary::entity}. Compiled at {@bt_site|::subscribed_books::vocabulary::place} by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}." = "对{@bt_entity|::subscribed_books::vocabulary::entity}语言的语法分析。由{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}在{@bt_site|::subscribed_books::vocabulary::place}编写。"
"This dictionary examines the structure, vocabulary, and usage patterns of the language spoken by {@bt_entity|::subscribed_books::vocabulary::entity}." = "本词典考察{@bt_entity|::subscribed_books::vocabulary::entity}所用语言的结构、词汇与使用模式。"
"Language is the {::subscribed_books::adj} architecture of thought. This dictionary, compiled by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} at {@bt_site|::subscribed_books::vocabulary::place}, documents the grammatical structures and lexical patterns of {@bt_entity|::subscribed_books::vocabulary::entity}'s tongue with the rigor such a subject demands." = "语言是思想的{::subscribed_books::adj}建筑。本词典由{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}在{@bt_site|::subscribed_books::vocabulary::place}编写，以这门课题应有的严谨，记录{@bt_entity|::subscribed_books::vocabulary::entity}语言的语法结构与词汇模式。"
"Linguistic observations relevant to the period of {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "{@bt_year|::subscribed_books::vocabulary::birth_year}年相关时期的语言观察："
"The name {@bt_artifact|::subscribed_books::vocabulary::artifact}, given in {@bt_year|::subscribed_books::vocabulary::birth_year}, demonstrates characteristic phonological patterns of {@bt_entity|::subscribed_books::vocabulary::entity}'s language." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年赋予的名字{@bt_artifact|::subscribed_books::vocabulary::artifact}，体现了{@bt_entity|::subscribed_books::vocabulary::entity}语言特有的语音模式。"
"Usage patterns documented circa {@bt_year|::subscribed_books::vocabulary::birth_year} reveal ongoing evolution of the language." = "约{@bt_year|::subscribed_books::vocabulary::birth_year}年记录的使用模式，显示这门语言仍在不断演变。"
"Further grammatical analysis follows." = "以下继续进行语法分析。"
"This grammatical dictionary of {@bt_entity|::subscribed_books::vocabulary::entity}'s language is submitted for scholarly review. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "这部关于{@bt_entity|::subscribed_books::vocabulary::entity}语言的语法词典，提交学界评议。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"A phrasebook for visitors to {@bt_site|::subscribed_books::vocabulary::place} and the lands of {@bt_entity|::subscribed_books::vocabulary::entity}. Learn to speak like the locals!" = "一本供前往{@bt_site|::subscribed_books::vocabulary::place}与{@bt_entity|::subscribed_books::vocabulary::entity}领土的游客使用的会话手册。学着像本地人一样说话吧！"
"Don't visit {@bt_entity|::subscribed_books::vocabulary::entity} without this guide. Essential phrases, common expressions, and useful vocabulary." = "造访{@bt_entity|::subscribed_books::vocabulary::entity}时，别忘了带上本指南。必备短语、常见表达和实用词汇尽在其中。"
"Phrases you'll need when discussing events like those of {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "讨论类似{@bt_year|::subscribed_books::vocabulary::birth_year}年事件时会用到的短语："
"To express condolence in the language of {@bt_entity|::subscribed_books::vocabulary::entity}: useful when discussing the death of figures like {@bt_hero|::subscribed_books::vocabulary::person}." = "用{@bt_entity|::subscribed_books::vocabulary::entity}语言表达哀悼：讨论{@bt_hero|::subscribed_books::vocabulary::person}这类人物的死亡时很有用。"
"Common expressions used when discussing the events of {@bt_year|::subscribed_books::vocabulary::birth_year}." = "讨论{@bt_year|::subscribed_books::vocabulary::birth_year}年事件时常用的表达。"
"Practice these phrases before your trip." = "旅行前请练习这些短语。"
"With these phrases, you'll be speaking like a native of {@bt_entity|::subscribed_books::vocabulary::entity} in no time. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "学会这些短语，你很快就能像{@bt_entity|::subscribed_books::vocabulary::entity}的本地人一样说话。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"An investigation into the origins of words in the language of {@bt_entity|::subscribed_books::vocabulary::entity}. By {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}." = "对{@bt_entity|::subscribed_books::vocabulary::entity}语言中词语起源的研究。作者：{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}。"
"Words have histories. This dictionary traces the {::subscribed_books::adj} origins of key terms in {@bt_entity|::subscribed_books::vocabulary::entity}'s vocabulary." = "词语也有历史。本词典追溯{@bt_entity|::subscribed_books::vocabulary::entity}词汇中关键术语的{::subscribed_books::adj}起源。"
"Every word carries the {::subscribed_books::adj} weight of its history. This etymological study of {@bt_entity|::subscribed_books::vocabulary::entity}'s language, conducted by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} at {@bt_site|::subscribed_books::vocabulary::place}, traces the roots of key terms back to their earliest documented usage, revealing the forces that shaped a people through the evolution of their speech." = "每个词语都承载着它历史的{::subscribed_books::adj}重量。本项{@bt_entity|::subscribed_books::vocabulary::entity}语言的词源研究，由{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}在{@bt_site|::subscribed_books::vocabulary::place}实施，将关键术语的根源追溯至最早的记录，揭示语言演变中塑造民族的力量。"
"Etymological developments from the period of {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "{@bt_year|::subscribed_books::vocabulary::birth_year}年相关时期的词源发展："
"The word for {@bt_artifact|::subscribed_books::vocabulary::artifact}, coined circa {@bt_year|::subscribed_books::vocabulary::birth_year}, derives from older roots meaning {::subscribed_books::adj} craftsmanship." = "指称{@bt_artifact|::subscribed_books::vocabulary::artifact}的词语约于{@bt_year|::subscribed_books::vocabulary::birth_year}年创立，源自意为{::subscribed_books::adj}工艺的古老词根。"
"The naming of {@bt_evsite|::subscribed_books::vocabulary::place} in {@bt_year|::subscribed_books::vocabulary::birth_year} introduced new terms into the common vocabulary." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年{@bt_evsite|::subscribed_books::vocabulary::place}的命名，为通用词汇带来了新术语。"
"Linguistic shifts circa {@bt_year|::subscribed_books::vocabulary::birth_year} reflect broader cultural changes within {@bt_entity|::subscribed_books::vocabulary::entity}." = "约{@bt_year|::subscribed_books::vocabulary::birth_year}年的语言变迁，反映了{@bt_entity|::subscribed_books::vocabulary::entity}更广泛的文化变化。"
"The roots run deep. Further excavation is needed." = "根源很深。仍需继续发掘。"
"This etymological study is a beginning, not an end. The language of {@bt_entity|::subscribed_books::vocabulary::entity} continues to evolve. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "本词源研究是开端，而非终点。{@bt_entity|::subscribed_books::vocabulary::entity}的语言仍在演变。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"A collection of the most {::subscribed_books::adj} and beautiful words in the language of {@bt_entity|::subscribed_books::vocabulary::entity}. Curated for poets, dreamers, and lovers of language." = "一部收集{@bt_entity|::subscribed_books::vocabulary::entity}语言中最{::subscribed_books::adj}、最美丽词语的选集。为诗人、梦想家与语言爱好者精心编选。"
"Some words are too beautiful to be confined to prose. This lexicon celebrates the poetry of {@bt_entity|::subscribed_books::vocabulary::entity}'s tongue." = "有些词语太美，不该只留在散文中。本词汇集赞颂{@bt_entity|::subscribed_books::vocabulary::entity}语言中的诗意。"
"Words of beauty from the era of {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "{@bt_year|::subscribed_books::vocabulary::birth_year}年时代中的优美词语："
"The name {@bt_artifact|::subscribed_books::vocabulary::artifact} is itself a poem. Created in {@bt_year|::subscribed_books::vocabulary::birth_year}, it sings when spoken aloud." = "名字{@bt_artifact|::subscribed_books::vocabulary::artifact}本身就是一首诗。它创立于{@bt_year|::subscribed_books::vocabulary::birth_year}年，朗读时仿佛在歌唱。"
"The vocabulary of {@bt_year|::subscribed_books::vocabulary::birth_year} yielded {::subscribed_books::adj} terms that deserve preservation for their beauty alone." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年的词汇产生了{::subscribed_books::adj}的术语，仅凭美感就值得保存。"
"Speak these words aloud. Feel their weight." = "大声说出这些词语。感受它们的重量。"
"The poetic lexicon of {@bt_entity|::subscribed_books::vocabulary::entity} is a {::subscribed_books::adj} garden of sound and meaning. May it bloom forever. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "{@bt_entity|::subscribed_books::vocabulary::entity}的诗意词汇集，是一座声音与意义构成的{::subscribed_books::adj}花园。愿它永远盛放。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"A glossary comparing the language of {@bt_entity|::subscribed_books::vocabulary::entity} with neighboring tongues. Compiled by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} at {@bt_site|::subscribed_books::vocabulary::place}." = "将{@bt_entity|::subscribed_books::vocabulary::entity}语言与周边语言比较的词汇表。由{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}在{@bt_site|::subscribed_books::vocabulary::place}编写。"
"How does the language of {@bt_entity|::subscribed_books::vocabulary::entity} compare to others? This glossary provides a {::subscribed_books::adj} cross-reference." = "{@bt_entity|::subscribed_books::vocabulary::entity}的语言与其他语言相比如何？本词汇表提供{::subscribed_books::adj}的对照。"
"Comparative entries from the period of {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "{@bt_year|::subscribed_books::vocabulary::birth_year}年相关时期的比较条目："
"Terms from {@bt_year|::subscribed_books::vocabulary::birth_year} show both convergence with and divergence from neighboring languages." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年的术语，既显示与周边语言的趋同，也显示差异。"
"The founding of {@bt_evsite|::subscribed_books::vocabulary::place} in {@bt_year|::subscribed_books::vocabulary::birth_year} brought {@bt_entity|::subscribed_books::vocabulary::entity}'s language into contact with new linguistic influences." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年{@bt_evsite|::subscribed_books::vocabulary::place}的建立，让{@bt_entity|::subscribed_books::vocabulary::entity}语言接触到了新的语言影响。"
"The comparison reveals as much about culture as about language." = "这种比较既揭示语言，也同样揭示文化。"
"This comparative glossary of {@bt_entity|::subscribed_books::vocabulary::entity}'s language is offered as a bridge between peoples. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "这部关于{@bt_entity|::subscribed_books::vocabulary::entity}语言的比较词汇表，旨在成为不同民族之间的桥梁。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"

[[rulesets]]
[rulesets.rules]
"The history of invention is the history of civilization. This treatise traces the {::subscribed_books::adj} arc of technological progress within {@bt_entity|::subscribed_books::vocabulary::entity}." = "发明的历史，就是文明的历史。本论著追溯{@bt_entity|::subscribed_books::vocabulary::entity}技术进步的{::subscribed_books::adj}轨迹。"
"From the first forge to the latest innovation, the story of {@bt_entity|::subscribed_books::vocabulary::entity}'s technology is a story of relentless advancement." = "从第一座熔炉到最新的创新，{@bt_entity|::subscribed_books::vocabulary::entity}技术的故事就是不断前进的故事。"
"Progress is not inevitable. It is the product of {::subscribed_books::adj} ingenuity, stubborn experimentation, and the occasional happy accident. This treatise, by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, documents the technological evolution of {@bt_entity|::subscribed_books::vocabulary::entity} from its earliest days at {@bt_site|::subscribed_books::vocabulary::place} to the present." = "进步并非必然。它来自{::subscribed_books::adj}的巧思、顽强的试验，以及偶尔幸运的意外。本论著由{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}撰写，记录{@bt_entity|::subscribed_books::vocabulary::entity}从早期的{@bt_site|::subscribed_books::vocabulary::place}岁月到如今的技术演变。"
"Technological developments around {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "约{@bt_year|::subscribed_books::vocabulary::birth_year}年的技术发展："
"{@bt_artifact|::subscribed_books::vocabulary::artifact}, created by {@bt_hero|::subscribed_books::vocabulary::person} in {@bt_year|::subscribed_books::vocabulary::birth_year}, represents a {::subscribed_books::adj} leap forward in technique and understanding." = "{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年创造的{@bt_artifact|::subscribed_books::vocabulary::artifact}，代表了技法与理解上的一次{::subscribed_books::adj}飞跃。"
"The establishment of {@bt_evsite|::subscribed_books::vocabulary::place} in {@bt_year|::subscribed_books::vocabulary::birth_year} created new demands that drove technological innovation." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年{@bt_evsite|::subscribed_books::vocabulary::place}的建立带来了新的需求，推动了技术创新。"
"The death of {@bt_hero|::subscribed_books::vocabulary::person} in {@bt_year|::subscribed_books::vocabulary::birth_year} temporarily set back progress. Knowledge was lost with {::subscribed_books::personality::obj1}." = "{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年去世，暂时阻碍了进步。知识随{::subscribed_books::personality::obj1}一同消失。"
"Advances documented circa {@bt_year|::subscribed_books::vocabulary::birth_year} built upon earlier foundations." = "约{@bt_year|::subscribed_books::vocabulary::birth_year}年记录的进展，建立在更早的基础之上。"
"Progress marches on." = "进步继续向前。"
"The technological evolution of {@bt_entity|::subscribed_books::vocabulary::entity} continues. This treatise captures one moment in a {::subscribed_books::adj} and ongoing story. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "{@bt_entity|::subscribed_books::vocabulary::entity}的技术演变仍在继续。本论著捕捉了一个{::subscribed_books::adj}而仍在延续的故事中的一刻。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"Technology is a blade that cuts both ways. This treatise examines the {::subscribed_books::adj} dangers that accompanied {@bt_entity|::subscribed_books::vocabulary::entity}'s innovations." = "技术是一把双刃剑。本论著考察伴随{@bt_entity|::subscribed_books::vocabulary::entity}创新而来的{::subscribed_books::adj}危险。"
"Not every invention was a blessing. This work catalogues the costs of progress within {@bt_entity|::subscribed_books::vocabulary::entity}." = "并非每项发明都是福祉。本书记录{@bt_entity|::subscribed_books::vocabulary::entity}进步所付出的代价。"
"The risks that emerged around {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "约{@bt_year|::subscribed_books::vocabulary::birth_year}年显现的风险："
"{@bt_hero|::subscribed_books::vocabulary::person} died in {@bt_year|::subscribed_books::vocabulary::birth_year}. {@bt_Cause|::subscribed_books::vocabulary::cause}. A direct consequence of pushing technological boundaries too far, too fast." = "{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年去世。死因：{@bt_Cause|::subscribed_books::vocabulary::cause}。这是把技术边界推进得过远、过快的直接后果。"
"{@bt_artifact|::subscribed_books::vocabulary::artifact}, created in {@bt_year|::subscribed_books::vocabulary::birth_year}, brought both benefit and unforeseen {::subscribed_books::adj} consequence." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年创造的{@bt_artifact|::subscribed_books::vocabulary::artifact}，既带来益处，也带来未曾预料的{::subscribed_books::adj}后果。"
"The innovations of {@bt_year|::subscribed_books::vocabulary::birth_year} carried hidden costs that only became apparent later." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年的创新伴随隐藏的代价，后来才逐渐显现。"
"Progress without caution is simply destruction with better tools." = "没有谨慎的进步，只是使用更好工具的毁灭。"
"This treatise is a warning. Innovate, yes. But remember the {::subscribed_books::adj} price others have paid. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "本论著是一份警告。可以创新。但请记住，别人已经付出的{::subscribed_books::adj}代价。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"Behind every invention is a person. This treatise tells the stories of {@bt_entity|::subscribed_books::vocabulary::entity}'s innovators." = "每项发明背后都有一个人。本论著讲述{@bt_entity|::subscribed_books::vocabulary::entity}发明者的故事。"
"The {::subscribed_books::adj} minds that drove {@bt_entity|::subscribed_books::vocabulary::entity}'s technological evolution deserve to be remembered by name." = "推动{@bt_entity|::subscribed_books::vocabulary::entity}技术演变的那些{::subscribed_books::adj}头脑，应当被人们记住名字。"
"The inventors of {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "{@bt_year|::subscribed_books::vocabulary::birth_year}年的发明者："
"{@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} created {@bt_artifact|::subscribed_books::vocabulary::artifact} in {@bt_year|::subscribed_books::vocabulary::birth_year}. The innovation was born of necessity and {::subscribed_books::adj} determination." = "{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}于{@bt_year|::subscribed_books::vocabulary::birth_year}年创造了{@bt_artifact|::subscribed_books::vocabulary::artifact}。这项创新诞生于必要性与{::subscribed_books::adj}的决心。"
"When {@bt_hero|::subscribed_books::vocabulary::person} died in {@bt_year|::subscribed_books::vocabulary::birth_year}, {::subscribed_books::personality::pos1} unfinished work represented possibilities the world would never see." = "{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年去世时，{::subscribed_books::personality::pos1}未完成的工作，代表了世界再也无法见到的可能。"
"{@bt_hero|::subscribed_books::vocabulary::person}, named {@bt_role|::subscribed_books::vocabulary::role} in {@bt_year|::subscribed_books::vocabulary::birth_year}, used the position to advance technological development." = "{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年获任{@bt_role|::subscribed_books::vocabulary::role}，利用这个职位推动了技术发展。"
"The innovators of {@bt_year|::subscribed_books::vocabulary::birth_year} worked in obscurity. This treatise gives them their due." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年的发明者在默默无闻中工作。本论著给予他们应有的肯定。"
"Behind every breakthrough, a {::subscribed_books::adj} individual." = "每次突破背后，都有一个{::subscribed_books::adj}的人。"
"This treatise honors the inventors. Without them, {@bt_entity|::subscribed_books::vocabulary::entity} would still be in the dark. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "本论著向发明者致敬。没有他们，{@bt_entity|::subscribed_books::vocabulary::entity}仍会处于黑暗之中。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"How techniques improved over time. A practical account of {@bt_entity|::subscribed_books::vocabulary::entity}'s technological refinement." = "技法如何随时间改进。一份关于{@bt_entity|::subscribed_books::vocabulary::entity}技术精进的实用记录。"
"Innovation is not always dramatic. Sometimes it is the slow, {::subscribed_books::adj} improvement of existing methods. This treatise documents that process." = "创新并不总是轰轰烈烈。有时，它是对现有方法缓慢而{::subscribed_books::adj}的改进。本论著记录这一过程。"
"Refinements achieved around {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "约{@bt_year|::subscribed_books::vocabulary::birth_year}年实现的改进："
"The techniques used to create {@bt_artifact|::subscribed_books::vocabulary::artifact} in {@bt_year|::subscribed_books::vocabulary::birth_year} represent measurable improvement over earlier methods." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年用于创造{@bt_artifact|::subscribed_books::vocabulary::artifact}的技法，与早期方法相比，有可衡量的改善。"
"Incremental improvements documented circa {@bt_year|::subscribed_books::vocabulary::birth_year} compounded over time into {::subscribed_books::adj} gains." = "约{@bt_year|::subscribed_books::vocabulary::birth_year}年记录的渐进改良，随时间积累成了{::subscribed_books::adj}的收获。"
"Small improvements, accumulated, produce revolutions." = "微小的改进积累起来，也能引发革命。"
"The practical evolution of {@bt_entity|::subscribed_books::vocabulary::entity}'s technology is a story of patience and persistence. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "{@bt_entity|::subscribed_books::vocabulary::entity}技术的实际演变，是一个耐心与坚持的故事。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"Knowledge is fragile. This treatise documents technologies that were lost and, sometimes, rediscovered by {@bt_entity|::subscribed_books::vocabulary::entity}." = "知识脆弱。本论著记录{@bt_entity|::subscribed_books::vocabulary::entity}曾经失去、又有时重新发现的技术。"
"What we know now was once known before, lost, and painfully relearned. The {::subscribed_books::adj} cycle of forgetting and rediscovery is the subject of this work." = "我们如今所知的东西，曾经被人知道，后来失传，再被艰难地重新学会。遗忘与重发现的{::subscribed_books::adj}循环，是本书的主题。"
"The knowledge landscape around {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "约{@bt_year|::subscribed_books::vocabulary::birth_year}年的知识状况："
"When {@bt_hero|::subscribed_books::vocabulary::person} died in {@bt_year|::subscribed_books::vocabulary::birth_year}, {::subscribed_books::personality::pos1} knowledge died with {::subscribed_books::personality::obj1}. It would take years to rediscover." = "{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年去世时，{::subscribed_books::personality::pos1}的知识随{::subscribed_books::personality::obj1}而去。重新发现它们将需要多年。"
"{@bt_artifact|::subscribed_books::vocabulary::artifact}, created in {@bt_year|::subscribed_books::vocabulary::birth_year}, employed techniques that had been lost for generations." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年创造的{@bt_artifact|::subscribed_books::vocabulary::artifact}，运用了已失传数代的技法。"
"Around {@bt_year|::subscribed_books::vocabulary::birth_year}, {@bt_entity|::subscribed_books::vocabulary::entity} rediscovered -- or lost -- knowledge that changed the course of its development." = "约{@bt_year|::subscribed_books::vocabulary::birth_year}年，{@bt_entity|::subscribed_books::vocabulary::entity}重新发现——或失去——了改变其发展方向的知识。"
"The cycle of loss and recovery continues." = "失落与寻回的循环仍在继续。"
"This treatise is itself an attempt to prevent further loss. Preserve what you know. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "本论著本身就是防止进一步失传的尝试。保存你所知的一切。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"I set out to map the unknown. What I found in the region of {@bt_site|::subscribed_books::vocabulary::place} surpassed all expectation. This atlas is my record." = "我出发绘制未知之地。在{@bt_site|::subscribed_books::vocabulary::place}地区的发现，超出了所有预期。本地图集就是我的记录。"
"An explorer's atlas of the lands around {@bt_site|::subscribed_books::vocabulary::place}. Compiled from direct observation by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}." = "一部关于{@bt_site|::subscribed_books::vocabulary::place}周围土地的探险者地图集。由{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}根据直接观察编写。"
"The {::subscribed_books::adj} landscape around {@bt_site|::subscribed_books::vocabulary::place} had never been properly documented. I, {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, resolved to correct this. What follows is an atlas born of boots on the ground and eyes wide open." = "{@bt_site|::subscribed_books::vocabulary::place}周围{::subscribed_books::adj}的地貌，从未被妥善记录。我，{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}，决心纠正这一点。以下这部地图集，诞生于脚踏实地、睁眼细看的探索。"
"Exploration notes from {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "{@bt_year|::subscribed_books::vocabulary::birth_year}年的探险笔记："
"{@bt_evsite|::subscribed_books::vocabulary::place}, first documented in {@bt_year|::subscribed_books::vocabulary::birth_year}. The surrounding terrain is {::subscribed_books::adj} and distinctive." = "{@bt_evsite|::subscribed_books::vocabulary::place}，首次记录于{@bt_year|::subscribed_books::vocabulary::birth_year}年。周围地形{::subscribed_books::adj}而独特。"
"The region claimed {@bt_hero|::subscribed_books::vocabulary::person} in {@bt_year|::subscribed_books::vocabulary::birth_year}. {@bt_Cause|::subscribed_books::vocabulary::cause}. Some lands extract a {::subscribed_books::adj} toll from those who would map them." = "这片地区于{@bt_year|::subscribed_books::vocabulary::birth_year}年夺走了{@bt_hero|::subscribed_books::vocabulary::person}。死因：{@bt_Cause|::subscribed_books::vocabulary::cause}。有些土地会向试图绘制它们的人索取{::subscribed_books::adj}的代价。"
"The landscape around {@bt_site|::subscribed_books::vocabulary::place} as observed in {@bt_year|::subscribed_books::vocabulary::birth_year}: varied, complex, and full of surprises." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年观察到的{@bt_site|::subscribed_books::vocabulary::place}周围地貌：多样、复杂，充满惊喜。"
"Further exploration is recommended." = "建议继续探索。"
"This atlas is a beginning. The land has more secrets than one explorer can uncover. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "这部地图集只是开端。土地的秘密，远比一个探险者能揭开的更多。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"A strategic atlas of the region surrounding {@bt_site|::subscribed_books::vocabulary::place}. Prepared for the military and administrative use of {@bt_entity|::subscribed_books::vocabulary::entity}." = "一部关于{@bt_site|::subscribed_books::vocabulary::place}周边地区的战略地图集。供{@bt_entity|::subscribed_books::vocabulary::entity}军事与行政使用。"
"STRATEGIC SURVEY. Region: {@bt_site|::subscribed_books::vocabulary::place}. Prepared by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}. Classification: tactical reference." = "战略调查。地区：{@bt_site|::subscribed_books::vocabulary::place}。编者：{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}。分类：战术参考。"
"Strategic assessment, period of {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "战略评估，{@bt_year|::subscribed_books::vocabulary::birth_year}年相关时期："
"{@bt_evsite|::subscribed_books::vocabulary::place}, est. {@bt_year|::subscribed_books::vocabulary::birth_year}. Strategic value: significant. Controls regional access routes." = "{@bt_evsite|::subscribed_books::vocabulary::place}，建立于{@bt_year|::subscribed_books::vocabulary::birth_year}年。战略价值：显著。控制地区通行路线。"
"Casualty note: {@bt_hero|::subscribed_books::vocabulary::person} lost in region, {@bt_year|::subscribed_books::vocabulary::birth_year}. Cause: {@bt_cause|::subscribed_books::vocabulary::cause}. Terrain hazards confirmed." = "伤亡注记：{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年在此地区去世。死因：{@bt_cause|::subscribed_books::vocabulary::cause}。已确认地形危险。"
"Regional conditions as of {@bt_year|::subscribed_books::vocabulary::birth_year}: consistent with prior intelligence." = "截至{@bt_year|::subscribed_books::vocabulary::birth_year}年的地区状况：与以往情报一致。"
"Assessment continues in the next section." = "评估在下一节继续。"
"Strategic survey complete. For authorized use by {@bt_entity|::subscribed_books::vocabulary::entity} command. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "战略调查完成。仅供{@bt_entity|::subscribed_books::vocabulary::entity}指挥机构授权使用。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"A natural history of the region around {@bt_site|::subscribed_books::vocabulary::place}. The land itself is the subject: its geology, its waters, its living things." = "一部关于{@bt_site|::subscribed_books::vocabulary::place}周围地区的自然史。土地本身就是主题：它的地质、水域与生物。"
"This atlas documents the natural world of {@bt_site|::subscribed_books::vocabulary::place} and its surroundings, as observed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}." = "本地图集记录{@bt_site|::subscribed_books::vocabulary::place}及其周边的自然世界，观察者为{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}。"
"The {::subscribed_books::adj} natural world around {@bt_site|::subscribed_books::vocabulary::place} is a tapestry of geological forces, living systems, and the slow work of water and wind. This atlas, by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, attempts to capture that tapestry in words and description." = "{@bt_site|::subscribed_books::vocabulary::place}周围{::subscribed_books::adj}的自然世界，是地质力量、生命系统，以及水与风缓慢作用编成的锦绣。本地图集由{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}撰写，试图用文字与描述捕捉这幅锦绣。"
"Natural observations from {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "{@bt_year|::subscribed_books::vocabulary::birth_year}年的自然观察："
"The founding of {@bt_evsite|::subscribed_books::vocabulary::place} in {@bt_year|::subscribed_books::vocabulary::birth_year} altered the local ecology. Human settlement reshapes the land." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年{@bt_evsite|::subscribed_books::vocabulary::place}的建立改变了当地生态。人类定居会重塑土地。"
"The natural conditions around {@bt_site|::subscribed_books::vocabulary::place} as of {@bt_year|::subscribed_books::vocabulary::birth_year} showed the {::subscribed_books::adj} interplay of nature and civilization." = "截至{@bt_year|::subscribed_books::vocabulary::birth_year}年，{@bt_site|::subscribed_books::vocabulary::place}周围的自然条件，呈现了自然与文明之间{::subscribed_books::adj}的相互作用。"
"Nature is patient but not passive. The land responds to everything we do." = "自然有耐心，却并不被动。土地会回应我们所做的一切。"
"This natural history atlas of {@bt_site|::subscribed_books::vocabulary::place} is a record of the land as it was. It will not remain so forever. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "这部{@bt_site|::subscribed_books::vocabulary::place}的自然史地图集，记录了土地曾有的模样。它不会永远保持如此。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"Thinking of settling near {@bt_site|::subscribed_books::vocabulary::place}? Read this first. An atlas and practical guide for prospective settlers." = "打算在{@bt_site|::subscribed_books::vocabulary::place}附近定居？请先阅读本书。一部面向未来定居者的地图集与实用指南。"
"A settler's atlas of the {@bt_site|::subscribed_books::vocabulary::place} region. What to expect, where to build, and what to avoid." = "一本{@bt_site|::subscribed_books::vocabulary::place}地区的定居者地图集。说明可能遇见什么、在哪里建造，以及应当避免什么。"
"Conditions relevant to settlement, circa {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "约{@bt_year|::subscribed_books::vocabulary::birth_year}年与定居相关的条件："
"{@bt_evsite|::subscribed_books::vocabulary::place} was established in {@bt_year|::subscribed_books::vocabulary::birth_year}. Lessons from its founding are relevant to new settlers." = "{@bt_evsite|::subscribed_books::vocabulary::place}建立于{@bt_year|::subscribed_books::vocabulary::birth_year}年。它创立时的经验，对新定居者有借鉴意义。"
"Warning: {@bt_hero|::subscribed_books::vocabulary::person} was lost near {@bt_site|::subscribed_books::vocabulary::place} in {@bt_year|::subscribed_books::vocabulary::birth_year}. {@bt_Cause|::subscribed_books::vocabulary::cause}. The region has {::subscribed_books::adj} hazards." = "警告：{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年在{@bt_site|::subscribed_books::vocabulary::place}附近去世。死因：{@bt_Cause|::subscribed_books::vocabulary::cause}。该地区存在{::subscribed_books::adj}的危险。"
"Settlement prospects as of {@bt_year|::subscribed_books::vocabulary::birth_year}: {::subscribed_books::adj}. Further assessment recommended." = "截至{@bt_year|::subscribed_books::vocabulary::birth_year}年的定居前景：{::subscribed_books::adj}。建议进一步评估。"
"Plan carefully. The land rewards the prepared and punishes the hasty." = "仔细规划。土地奖赏准备充分者，惩罚鲁莽者。"
"This settler's guide to the {@bt_site|::subscribed_books::vocabulary::place} region is offered with the hope that it saves lives. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "这本{@bt_site|::subscribed_books::vocabulary::place}地区的定居指南，怀着挽救生命的期望而写。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"The land around {@bt_site|::subscribed_books::vocabulary::place} is not merely terrain. It is a poem written in stone and water and sky." = "{@bt_site|::subscribed_books::vocabulary::place}周围的土地不仅是地形。它是一首由石、水与天空写成的诗。"
"This atlas sees the landscape as art. The region of {@bt_site|::subscribed_books::vocabulary::place} is a masterwork of natural {::subscribed_books::adj} beauty." = "这部地图集将景观视为艺术。{@bt_site|::subscribed_books::vocabulary::place}地区，是一件自然{::subscribed_books::adj}之美的杰作。"
"Geography is the poetry of the earth. The region surrounding {@bt_site|::subscribed_books::vocabulary::place}, beloved home of {@bt_entity|::subscribed_books::vocabulary::entity}, speaks in a language of {::subscribed_books::adj} ridgelines and whispering valleys. This atlas translates that language for the reader who has ears to hear it." = "地理是大地的诗歌。{@bt_entity|::subscribed_books::vocabulary::entity}挚爱的家园，{@bt_site|::subscribed_books::vocabulary::place}周围的地区，以{::subscribed_books::adj}山脊与低语山谷的语言诉说。本地图集为愿意倾听的读者翻译这种语言。"
"{::subscribed_books::templates_legacy::metaphor} So speaks the land around {@bt_site|::subscribed_books::vocabulary::place}. This atlas, by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, is an attempt to listen." = "{::subscribed_books::templates_legacy::metaphor}{@bt_site|::subscribed_books::vocabulary::place}周围的土地如此诉说。本地图集由{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}撰写，是一次倾听的尝试。"
"So speaks the land around {@bt_site|::subscribed_books::vocabulary::place}. This atlas, by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, is an attempt to listen." = "{@bt_site|::subscribed_books::vocabulary::place}周围的土地如此诉说。本地图集由{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}撰写，是一次倾听的尝试。"
"The landscape as it appeared around {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "约{@bt_year|::subscribed_books::vocabulary::birth_year}年时的景观："
"When {@bt_evsite|::subscribed_books::vocabulary::place} rose from the earth in {@bt_year|::subscribed_books::vocabulary::birth_year}, the land seemed to welcome it, as if it had always been waiting." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年{@bt_evsite|::subscribed_books::vocabulary::place}从大地上兴起时，土地仿佛在欢迎它，仿佛一直等待着它。"
"In {@bt_year|::subscribed_books::vocabulary::birth_year}, the landscape around {@bt_site|::subscribed_books::vocabulary::place} wore its {::subscribed_books::adj} seasonal garments and dazzled all who looked upon it." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年，{@bt_site|::subscribed_books::vocabulary::place}周围的景观披上{::subscribed_books::adj}的四季衣裳，让每个注视它的人目眩神迷。"
"The land speaks. We have only to listen." = "土地在诉说。我们只需倾听。"
"This poetic atlas of {@bt_site|::subscribed_books::vocabulary::place} is my love letter to the earth itself. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "这部关于{@bt_site|::subscribed_books::vocabulary::place}的诗意地图集，是我献给大地本身的情书。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"The {::subscribed_books::adj} geography of {@bt_site|::subscribed_books::vocabulary::place} defies the power of words to capture it fully. {::subscribed_books::templates_legacy::metaphor} This atlas is a gesture toward the sublime. It falls short. All language does. But the attempt, like the landscape, has its own beauty. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "{@bt_site|::subscribed_books::vocabulary::place}{::subscribed_books::adj}的地理，远非文字能够完整捕捉。{::subscribed_books::templates_legacy::metaphor}这部地图集，是朝向崇高的一次示意。它有所不足。所有语言都是如此。但这种尝试，正如景观本身，也有自己的美。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"The {::subscribed_books::adj} geography of {@bt_site|::subscribed_books::vocabulary::place} defies the power of words to capture it fully. This atlas is a gesture toward the sublime. It falls short. All language does. But the attempt, like the landscape, has its own beauty. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "{@bt_site|::subscribed_books::vocabulary::place}{::subscribed_books::adj}的地理，远非文字能够完整捕捉。这部地图集，是朝向崇高的一次示意。它有所不足。所有语言都是如此。但这种尝试，正如景观本身，也有自己的美。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"

