"The year {year1} marked the birth of {@bt_site|::subscribed_books::interpreters::place}. {@bt_entity|::subscribed_books::interpreters::entity} sent a expedition into the wilderness, and the expedition did not come back -- because it had found what it was looking for.{builder}" = "{year1}年，{@bt_site|::subscribed_books::interpreters::place}诞生了。{@bt_entity|::subscribed_books::interpreters::entity}派出一支探险队进入荒野，而探险队没有回来——因为他们已经找到了所寻求的地方。{builder}"
"{@bt_artifact|::subscribed_books::interpreters::artifact} was born in the workshops of {@bt_site|::subscribed_books::interpreters::place} in the year {year1}. Its creator, {@bt_hero|::subscribed_books::interpreters::person}, had poured into it something that could not be quantified: years of experience, a understanding of the medium, and the indefinable spark that separates craft from art." = "{year1}年，{@bt_artifact|::subscribed_books::interpreters::artifact}诞生于{@bt_site|::subscribed_books::interpreters::place}的工坊。创造者{@bt_hero|::subscribed_books::interpreters::person}倾注其中的，是无法量化的东西：多年经验、对材料的理解，以及让技艺升华为艺术的那一缕难以言说的火花。"
"In {year1}, {@bt_hero|::subscribed_books::interpreters::person} {artifact_action} {@bt_artifact|::subscribed_books::interpreters::artifact} at {@bt_site|::subscribed_books::interpreters::place}. The transfer of a artifact was never merely material -- it carried political weight, symbolic meaning, and the implicit question of whether the new holder was worthy of what they now possessed." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}在{@bt_site|::subscribed_books::interpreters::place}{artifact_action}{@bt_artifact|::subscribed_books::interpreters::artifact}。神器的转移从来不只是物质的转手——它带着政治分量、象征意义，以及一个未明说的问题：新的持有者，是否配得上如今拥有的东西。"
