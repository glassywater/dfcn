[[rulesets]]
name = "builder_temper"
[rulesets.rules]
"was kinder to me than my temper deserved" = "对我的宽厚，远超过我的坏脾气所配得到的"
"quarrelled with me over every stone of it" = "为了修建它的每一块石头都要与我争吵"
"could make anyone laugh, even in the dirt" = "即使身处泥地，也能逗得人人发笑"
"was never less than courteous to me" = "对我始终彬彬有礼"
"ruled us harder than we liked" = "对我们的管束严厉得令人不快"
