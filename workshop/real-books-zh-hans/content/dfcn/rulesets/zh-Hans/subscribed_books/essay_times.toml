# forms/essay/subjects/times.lua：随笔对事件的教训、批评与赞颂。
# 保留原文完整句组，并接受原模组去重后留下的独立句。
base = "subscribed_books::essay_times"

[[rulesets]]
[rulesets.rules]
"This essay concerns {::subscribed_books::essay_vocabulary::subject}. I do not mean to retell it; I mean to ask what it teaches." = "本文讨论{::subscribed_books::essay_vocabulary::subject}。我无意重述此事，而是想问它能带来什么教训。"
"This essay concerns {::subscribed_books::essay_vocabulary::subject}." = "本文讨论{::subscribed_books::essay_vocabulary::subject}。"
"I do not mean to retell it; I mean to ask what it teaches." = "我无意重述此事，而是想问它能带来什么教训。"
"Every event in the record is also an instruction, if one reads it so." = "只要用心去读，史册中的每件事也都是一堂课。"
"What happened here has happened before, and will again." = "这里发生的事，过去曾发生过，将来也还会发生。"
"The record is a teacher with no patience for inattentive students." = "史册是一位老师，对心不在焉的学生毫无耐心。"
"History does not repeat itself; we repeat it, by forgetting." = "历史不会自行重演；是我们的遗忘使它重演。"
"A lesson unlearned is only a delay." = "没有吸取教训，不过是让覆辙稍迟些重蹈。"
"It will be said that the past teaches nothing, and that each age must learn for itself." = "有人会说，过去教不了我们什么，每个时代都得自己学习。"
"Each age must learn; it need not learn from nothing." = "每个时代都得学习，却不必从零开始。"
"I return to {::subscribed_books::essay_vocabulary::subject} and its lesson. Let it be learned once, and kept." = "回到{::subscribed_books::essay_vocabulary::subject}及其教训。愿我们学会一次，便永远铭记。"
"I return to {::subscribed_books::essay_vocabulary::subject} and its lesson." = "回到{::subscribed_books::essay_vocabulary::subject}及其教训。"
"Let it be learned once, and kept." = "愿我们学会一次，便永远铭记。"

"I will argue that {::subscribed_books::essay_vocabulary::subject} shows a failure, and that someone should have prevented it." = "我要论证，{::subscribed_books::essay_vocabulary::subject}反映了一场失职，而且本该有人阻止它。"
"None of this was inevitable." = "这一切并非不可避免。"
"Those who could have acted did not." = "有能力采取行动的人却没有行动。"
"The record is full of what was done. It is fuller still of what was not." = "史册里写满了人们做过的事，却有更多本该做而未做的事。"
"The record is full of what was done." = "史册里写满了人们做过的事。"
"It is fuller still of what was not." = "其中却有更多本该做而未做的事。"
"Neglect is the commonest cause of disaster, and the least recorded." = "疏忽是灾难最常见的起因，却最少见于记载。"
"It will be said that hindsight is cheap." = "有人会说，事后之明很廉价。"
"So is foresight, and no one bought it." = "先见之明也不贵，却无人愿意为之付出。"
"I return to {::subscribed_books::essay_vocabulary::subject} and I repeat my complaint. Someone should answer for it." = "回到{::subscribed_books::essay_vocabulary::subject}，我仍要提出同样的指责。此事必须有人负责。"
"I return to {::subscribed_books::essay_vocabulary::subject} and I repeat my complaint." = "回到{::subscribed_books::essay_vocabulary::subject}，我仍要提出同样的指责。"
"Someone should answer for it." = "此事必须有人负责。"

"I write about {::subscribed_books::essay_vocabulary::subject} to praise it, and those whose story it is." = "我写下{::subscribed_books::essay_vocabulary::subject}，是为了赞颂这件事，以及亲历此事的人们。"
"I write about {::subscribed_books::essay_vocabulary::subject} to praise it. It is partly my own story, and I will try not to make it only mine." = "我写下{::subscribed_books::essay_vocabulary::subject}，是为了赞颂它。这也是我人生的一部分，但我会尽量不把它写成我一个人的故事。"
"I write about {::subscribed_books::essay_vocabulary::subject} to praise it." = "我写下{::subscribed_books::essay_vocabulary::subject}，是为了赞颂它。"
