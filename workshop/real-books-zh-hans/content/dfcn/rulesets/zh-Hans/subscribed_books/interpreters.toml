name = "builder"
optional = true
[rulesets.rules]
" The expedition was led by {@bt_builder|::subscribed_books::interpreters::person}." = "这支探险队由{@bt_builder|::subscribed_books::interpreters::person}率领。"

[[rulesets]]
name = "oversight"
optional = true
[rulesets.rules]
" {@bt_supervisor|::subscribed_books::interpreters::person} oversaw the work." = "{@bt_supervisor|::subscribed_books::interpreters::person}监督了这项工程。"
[[rulesets]]
[rulesets.rules]
"In the year {year1}, {@bt_entity|::subscribed_books::interpreters::entity} founded {@bt_site|::subscribed_books::interpreters::place}.{builder} The decision to establish a new settlement was never made lightly -- it required resources, planning, and the willingness to stake everything on an uncertain future." = "{year1}年，{@bt_entity|::subscribed_books::interpreters::entity}建立了{@bt_site|::subscribed_books::interpreters::place}。{builder}建立新聚居地的决定从来不会轻易作出——它需要资源、计划，以及将一切押在不确定的未来上的决心。"

[[rulesets]]
[rulesets.rules]
"{@bt_site|::subscribed_books::interpreters::place} was founded in {year1} by {@bt_entity|::subscribed_books::interpreters::entity}.{builder} The land was chosen with care: defensible, resourceful, and far enough from existing settlements to be worth the risk of starting fresh." = "{@bt_site|::subscribed_books::interpreters::place}由{@bt_entity|::subscribed_books::interpreters::entity}建立于{year1}年。{builder}这片土地经过精心挑选：易于防守、资源丰富，而且离既有聚居地足够远，值得冒险重新开始。"

[[rulesets]]
[rulesets.rules]
"The year {year1} marked the birth of {@bt_site|::subscribed_books::interpreters::place}. {@bt_entity|::subscribed_books::interpreters::entity} sent an expedition into the wilderness, and the expedition did not come back -- because it had found what it was looking for.{builder}" = "{year1}年，{@bt_site|::subscribed_books::interpreters::place}诞生了。{@bt_entity|::subscribed_books::interpreters::entity}派出一支探险队进入荒野，而探险队没有回来——因为他们已经找到了所寻求的地方。{builder}"

[[rulesets]]
[rulesets.rules]
"The founding was not born of ambition alone. {@bt_entity|::subscribed_books::interpreters::entity} had been embroiled in conflict with {@bt_enemy|::subscribed_books::interpreters::entity}, and the need for new territory -- defensible, distant from the front lines, rich enough to sustain a population under pressure -- had become urgent. {@bt_site|::subscribed_books::interpreters::place} was the answer to that need." = "这次建城不只是出于野心。{@bt_entity|::subscribed_books::interpreters::entity}与{@bt_enemy|::subscribed_books::interpreters::entity}深陷冲突，迫切需要新的领地——易守、远离前线，而且足够富饶，能养活承受压力的民众。{@bt_site|::subscribed_books::interpreters::place}正是这一需求的答案。"

[[rulesets]]
[rulesets.rules]
"{@bt_site|::subscribed_books::interpreters::place} was not {@bt_entity|::subscribed_books::interpreters::entity}'s first settlement. At least {n1} other site{plural} had been founded before it. This was a civilization expanding, claiming new ground, pushing the boundaries of the known world outward. Each new settlement was a statement of intent: we will endure, and we will grow." = "{@bt_site|::subscribed_books::interpreters::place}并非{@bt_entity|::subscribed_books::interpreters::entity}的第一处聚居地。在它之前，至少已有{n1}处{plural}其他聚居地建立起来。这是一个不断扩展的文明，开拓新土地，将已知世界的边界向外推移。每一处新聚居地，都在宣告同一个决心：我们要存续，也要壮大。"

[[rulesets]]
[rulesets.rules]
"The land around {@bt_site|::subscribed_books::interpreters::place} was untamed. The first settlers arrived to find wilderness -- beautiful, dangerous, and entirely indifferent to their survival. Everything they would build, they would build from nothing." = "{@bt_site|::subscribed_books::interpreters::place}周围的土地尚未开化。最初的定居者到来时，眼前只有荒野——美丽、危险，而且全然不在乎他们能否生存。他们要建立的一切，都必须从无到有。"

[[rulesets]]
[rulesets.rules]
"What the founders of {@bt_site|::subscribed_books::interpreters::place} found when they arrived was not a home. It was a promise -- one that would take years of labor, sacrifice, and stubbornness to fulfill." = "{@bt_site|::subscribed_books::interpreters::place}的开拓者到来时，找到的并不是家，而是一个承诺——要靠多年的劳动、牺牲与坚持，才能将它兑现。"

[[rulesets]]
[rulesets.rules]
"{@bt_site|::subscribed_books::interpreters::place}'s first decade was marked by loss. At least {n1} lives were claimed in the years following the founding -- to predators, to conflict, to the simple cruelty of a world that does not welcome newcomers. But {@bt_entity|::subscribed_books::interpreters::entity} held on. The settlement endured, because the people who built it refused to let it die." = "{@bt_site|::subscribed_books::interpreters::place}最初的十年充满损失。建城后的几年里，至少有{n1}条生命被夺走——死于掠食者、冲突，或这个不欢迎新来者的世界单纯的残酷。但{@bt_entity|::subscribed_books::interpreters::entity}坚持了下来。聚居地得以存续，因为建造它的人们不肯让它灭亡。"

[[rulesets]]
[rulesets.rules]
"The early years were not without cost. {@bt_site|::subscribed_books::interpreters::place} lost {n1} of its own in the first decade. But for a new settlement on the frontier, that was the price of existence." = "早年的发展并非没有代价。{@bt_site|::subscribed_books::interpreters::place}在最初十年中失去了{n1}名居民。但对边疆的新聚居地而言，这就是存在的代价。"

[[rulesets]]
[rulesets.rules]
"The early years of {@bt_site|::subscribed_books::interpreters::place} were, by the standards of frontier settlements, remarkably peaceful. Whether this was luck, good planning, or the vigilance of the founders, the result was the same: {@bt_site2|::subscribed_books::interpreters::place} was given time to grow roots before the world tested them." = "以边疆聚居地的标准来看，{@bt_site|::subscribed_books::interpreters::place}的早年岁月异常平静。无论是运气、周密的计划，还是开拓者的警惕所致，结果都一样：在世界开始考验它之前，{@bt_site2|::subscribed_books::interpreters::place}得到了扎根的时间。"

[[rulesets]]
[rulesets.rules]
"In {year1}, a new structure was {construction_action} at {@bt_site|::subscribed_books::interpreters::place}.{oversight} The construction was a statement: that {@bt_entity|::subscribed_books::interpreters::entity} was not merely surviving at {@bt_site2|::subscribed_books::interpreters::place}, but building for the future." = "{year1}年，一座新建筑在{@bt_site|::subscribed_books::interpreters::place}{construction_action}。{oversight}这项工程宣告：{@bt_entity|::subscribed_books::interpreters::entity}在{@bt_site2|::subscribed_books::interpreters::place}不只是在维持生存，更是在建设未来。"

[[rulesets]]
[rulesets.rules]
"The old structure had served its purpose. What replaced it was larger, stronger, and better suited to the needs of a people who had outgrown their origins. The act of rebuilding was itself a kind of optimism -- a bet that the future would be worth preparing for." = "旧建筑已经完成了使命。取代它的新建筑更大、更坚固，也更适合这个已超越起初规模的族群。重建本身就是一种乐观——押注未来值得为之准备。"

[[rulesets]]
[rulesets.rules]
"In {year1}, {@bt_hero|::subscribed_books::interpreters::person} created {@bt_artifact|::subscribed_books::interpreters::artifact} at {@bt_site|::subscribed_books::interpreters::place}. The work was immediately recognized as something extraordinary -- not merely well-crafted, but imbued with a quality that transcended the materials from which it was made." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}在{@bt_site|::subscribed_books::interpreters::place}创造了{@bt_artifact|::subscribed_books::interpreters::artifact}。人们立刻认出它非同寻常——不仅制作精良，更拥有某种超越其材料本身的品质。"

[[rulesets]]
[rulesets.rules]
"{@bt_artifact|::subscribed_books::interpreters::artifact} was born in the workshops of {@bt_site|::subscribed_books::interpreters::place} in the year {year1}. Its creator, {@bt_hero|::subscribed_books::interpreters::person}, had poured into it something that could not be quantified: years of experience, an understanding of the medium, and the indefinable spark that separates craft from art." = "{year1}年，{@bt_artifact|::subscribed_books::interpreters::artifact}诞生于{@bt_site|::subscribed_books::interpreters::place}的工坊。创造者{@bt_hero|::subscribed_books::interpreters::person}倾注其中的，是无法量化的东西：多年经验、对材料的理解，以及让技艺升华为艺术的那一缕难以言说的火花。"

[[rulesets]]
[rulesets.rules]
"The year {year1} produced many things at {@bt_site|::subscribed_books::interpreters::place}. But none would be remembered like {@bt_artifact|::subscribed_books::interpreters::artifact}, created by {@bt_hero|::subscribed_books::interpreters::person}. From the moment it was completed, those who saw it knew they were looking at something that would outlast its maker." = "{year1}年，{@bt_site|::subscribed_books::interpreters::place}产出了许多东西，但没有哪一件能像{@bt_hero|::subscribed_books::interpreters::person}创造的{@bt_artifact|::subscribed_books::interpreters::artifact}那样被铭记。从它完成的那一刻起，见到它的人就知道，这件作品的寿命将比创造者更长。"

[[rulesets]]
[rulesets.rules]
"{@bt_artifact|::subscribed_books::interpreters::artifact} was not {@bt_hero|::subscribed_books::interpreters::person}'s first work of note. At least {n1} other artifact{plural} had come from {pos1} hands before this one. {@bt_hero2|::subscribed_books::interpreters::person} was a prolific creator, but even among {pos2} works, {@bt_artifact2|::subscribed_books::interpreters::artifact} stood apart." = "{@bt_artifact|::subscribed_books::interpreters::artifact}并非{@bt_hero|::subscribed_books::interpreters::person}的第一件名作。在它之前，{pos1}双手至少还创造过{n1}件{plural}其他神器。{@bt_hero2|::subscribed_books::interpreters::person}是一位多产的创造者，但即便放在{pos2}众多作品之中，{@bt_artifact2|::subscribed_books::interpreters::artifact}仍独树一帜。"

[[rulesets]]
[rulesets.rules]
"It was {@bt_hero|::subscribed_books::interpreters::person}'s first work of true greatness -- the kind that transforms a skilled artisan into a legend. Every crafter hopes for such a moment. Most never find it. {@bt_hero2|::subscribed_books::interpreters::person} did." = "这是{@bt_hero|::subscribed_books::interpreters::person}第一件真正伟大的作品——足以让熟练工匠成为传奇的那种作品。每位工匠都盼望这样的时刻，大多数人终其一生也等不到。{@bt_hero2|::subscribed_books::interpreters::person}等到了。"

[[rulesets]]
[rulesets.rules]
"{@bt_artifact|::subscribed_books::interpreters::artifact} would not remain in {@bt_site|::subscribed_books::interpreters::place} forever." = "{@bt_artifact|::subscribed_books::interpreters::artifact}不会永远留在{@bt_site|::subscribed_books::interpreters::place}。"

[[rulesets]]
[rulesets.rules]
"In {year1}, it passed to {@bt_hero|::subscribed_books::interpreters::person}." = "{year1}年，它转到了{@bt_hero|::subscribed_books::interpreters::person}手中。"

[[rulesets]]
[rulesets.rules]
"Each transfer carried the weight of the artifact's growing legend." = "每一次转手，都承载着这件神器日益壮大的传奇。"

[[rulesets]]
[rulesets.rules]
"For {@bt_entity|::subscribed_books::interpreters::entity}, the creation of {@bt_artifact|::subscribed_books::interpreters::artifact} was more than craftsmanship. It was proof that {@bt_site|::subscribed_books::interpreters::place} had become a place where beauty could survive alongside danger -- where the pursuit of excellence had not been abandoned in the struggle to merely exist." = "对{@bt_entity|::subscribed_books::interpreters::entity}来说，{@bt_artifact|::subscribed_books::interpreters::artifact}的诞生不只体现了精湛技艺。它证明，{@bt_site|::subscribed_books::interpreters::place}已成为一个让美与危险并存的地方——人们在艰难求生时，仍未放弃对卓越的追求。"

[[rulesets]]
[rulesets.rules]
"In {year1}, {@bt_hero|::subscribed_books::interpreters::person} produced a masterwork at {@bt_site|::subscribed_books::interpreters::place}. The quality of the craftsmanship was immediately apparent -- this was not the product of mere skill, but of a mind that had spent years understanding its medium and had, in this moment, achieved something close to perfection." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}在{@bt_site|::subscribed_books::interpreters::place}制成了一件大师作品。其工艺水准一望便知——这并非单靠技巧得来的产物，而是多年钻研材料的心智，在此刻达到了近乎完美的境界。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person} created a masterwork at {@bt_site|::subscribed_books::interpreters::place} in {year1}. The piece was exceptional by any standard, but what made it remarkable was the way it seemed to transcend its materials -- as if the crafter had found a way to embed intention itself into the work." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}在{@bt_site|::subscribed_books::interpreters::place}创造了一件大师作品。以任何标准衡量，它都非同凡响；更令人赞叹的是，它仿佛超越了自身的材料——工匠似乎找到了将心意本身融入作品的方法。"

[[rulesets]]
[rulesets.rules]
"In {year1}, a masterwork was lost at {@bt_site|::subscribed_books::interpreters::place}. The circumstances of its disappearance -- whether through theft, carelessness, or deliberate destruction -- were a source of grief and recrimination. What had taken years of skill to create was gone in a moment, and {@bt_entity|::subscribed_books::interpreters::entity} was diminished by the loss." = "{year1}年，一件大师作品在{@bt_site|::subscribed_books::interpreters::place}遗失了。它究竟因盗窃、疏忽还是蓄意毁坏而消失，引发了悲痛与相互指责。多年技艺积累才创造出的东西，转瞬间便不复存在，{@bt_entity|::subscribed_books::interpreters::entity}也因此蒙受损失。"

[[rulesets]]
[rulesets.rules]
"In {year1}, {@bt_hero|::subscribed_books::interpreters::person} {artifact_action} {@bt_artifact|::subscribed_books::interpreters::artifact} at {@bt_site|::subscribed_books::interpreters::place}. The transfer of an artifact was never merely material -- it carried political weight, symbolic meaning, and the implicit question of whether the new holder was worthy of what they now possessed." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}在{@bt_site|::subscribed_books::interpreters::place}{artifact_action}{@bt_artifact|::subscribed_books::interpreters::artifact}。神器的转移从来不只是物质的转手——它带着政治分量、象征意义，以及一个未明说的问题：新的持有者，是否配得上如今拥有的东西。"

[[rulesets]]
[rulesets.rules]
"In {year1}, after {n1} failed attempt{plural} at reconciliation, peace was finally accepted between {@bt_ent1|::subscribed_books::interpreters::entity} and {@bt_ent2|::subscribed_books::interpreters::entity}. The road to this moment had been long, bitter, and paved with the graves of those who had not lived to see it." = "{year1}年，经过{n1}次{plural}失败的和解尝试，{@bt_ent1|::subscribed_books::interpreters::entity}与{@bt_ent2|::subscribed_books::interpreters::entity}终于接受了和平。通往这一刻的道路漫长而苦涩，沿途满是未能活着见到和平者的坟墓。"

[[rulesets]]
[rulesets.rules]
"In {year1}, peace was accepted between {@bt_ent1|::subscribed_books::interpreters::entity} and {@bt_ent2|::subscribed_books::interpreters::entity}. The war that had consumed both peoples was over -- at least for now. The treaties were signed, the diplomats withdrew, and the soldiers went home to families that had learned to sleep without them." = "{year1}年，{@bt_ent1|::subscribed_books::interpreters::entity}与{@bt_ent2|::subscribed_books::interpreters::entity}接受了和平。吞噬双方族群的战争结束了——至少暂时如此。条约签署，外交官离去，士兵回到家中，而家人们早已学会在他们不在时入睡。"

[[rulesets]]
[rulesets.rules]
"The cost of the war could not be calculated in gold or territory alone. At least {n1} had died in the fighting -- soldiers, civilians, diplomats, and those who simply had the misfortune to be in the wrong place. Every family in both civilizations had been touched by the conflict. The peace, when it came, was not celebrated so much as accepted with exhausted relief." = "战争的代价，不能只用黄金或领土来计算。至少有{n1}人死于战火——士兵、平民、外交官，以及只是倒霉地身处错误地方的人。两个文明中的每个家庭，都被冲突波及。和平到来时，人们与其说是在庆祝，不如说是在疲惫中松了一口气，接受了它。"

[[rulesets]]
[rulesets.rules]
"Whether the peace would hold remained to be seen. {@bt_ent1|::subscribed_books::interpreters::entity} and {@bt_ent2|::subscribed_books::interpreters::entity} had too much history, too many grievances, and too little trust for anyone to believe the fighting was truly over. But for now -- for today -- the killing had stopped. And that was enough." = "和平能否维持，还有待观察。{@bt_ent1|::subscribed_books::interpreters::entity}与{@bt_ent2|::subscribed_books::interpreters::entity}之间往事太多、怨恨太深、信任太少，没有人能轻易相信战斗真的结束了。但此刻——至少今天——杀戮停了。这就够了。"

[[rulesets]]
[rulesets.rules]
"The terms of the peace were specific, the concessions real, and the compromises painful to both sides. It was, in other words, a genuine peace -- the kind that neither party was fully satisfied with, which meant it had a chance of lasting." = "和平的条件明确，让步真实，妥协令双方都感到痛苦。换句话说，这是真正的和平——双方都不完全满意的那种，也正因此，它才有机会长久维持。"

[[rulesets]]
[rulesets.rules]
"In {year1}, an offer of peace between {@bt_ent1|::subscribed_books::interpreters::entity} and {@bt_ent2|::subscribed_books::interpreters::entity} was rejected. The war would continue. The diplomats who had carried the offer returned empty-handed, and behind them, the door to negotiation closed." = "{year1}年，{@bt_ent1|::subscribed_books::interpreters::entity}与{@bt_ent2|::subscribed_books::interpreters::entity}之间的一项和平提议遭到拒绝。战争还将继续。带着提议而来的外交官空手返回，谈判的大门在他们身后关上了。"

[[rulesets]]
[rulesets.rules]
"This was not the first time peace had been refused. {n1} prior attempt{plural} had met the same fate. The pattern was becoming clear: one side -- or both -- was not yet ready to stop fighting. The price of continued war had not yet exceeded the price of the concessions that peace would require." = "这并非和平第一次被拒绝。此前的{n1}次{plural}尝试，都遭遇了同样的命运。规律已经清楚：一方——或双方——还没准备好停止战斗。继续战争的代价，还没有高过和平所需让步的代价。"

[[rulesets]]
[rulesets.rules]
"The rejection was not irrational. To accept peace on the terms offered would have meant conceding territory, influence, or pride -- and in the politics of {@bt_ent1|::subscribed_books::interpreters::entity} and {@bt_ent2|::subscribed_books::interpreters::entity}, pride was the currency that mattered most. The dead could not object. The living would not forget." = "拒绝并非毫无道理。接受对方提出的和平条件，意味着让出领土、影响力或尊严——而在{@bt_ent1|::subscribed_books::interpreters::entity}与{@bt_ent2|::subscribed_books::interpreters::entity}的政治中，尊严才是最重要的筹码。死者无法反对，生者不会忘记。"

[[rulesets]]
[rulesets.rules]
"Those who had argued for peace were silenced -- not by force, but by the simple weight of anger. Too much had been lost for forgiveness to come cheaply. The people of both {@bt_ent1|::subscribed_books::interpreters::entity} and {@bt_ent2|::subscribed_books::interpreters::entity} wanted resolution, but not the kind that required them to shake the hand that had struck them." = "主张和平的人沉默了——并非被武力压制，而是被愤怒本身的分量压住。失去的东西太多，宽恕不可能轻易到来。{@bt_ent1|::subscribed_books::interpreters::entity}与{@bt_ent2|::subscribed_books::interpreters::entity}的人民都想要一个了结，却不愿以握住那只打过自己的手为代价。"

[[rulesets]]
[rulesets.rules]
"In {year1}, a diplomatic agreement between {@bt_ent1|::subscribed_books::interpreters::entity} and {@bt_ent2|::subscribed_books::interpreters::entity} was {diplomatic_outcome}. The negotiation had been conducted with the careful formality that characterized relations between the two powers -- every word weighed, every concession measured, every silence deliberate." = "{year1}年，{@bt_ent1|::subscribed_books::interpreters::entity}与{@bt_ent2|::subscribed_books::interpreters::entity}之间的一项外交协议{diplomatic_outcome}。谈判遵循着两大势力交往时谨慎而正式的作风——每一句话都被斟酌，每一项让步都被衡量，每一次沉默都有意为之。"

[[rulesets]]
[rulesets.rules]
"The rejection was a setback, but not a surprise. The terms had been ambitious, the trust between the parties thin, and the political will to compromise insufficient. The diplomats returned to their respective capitals knowing they would be back -- the question was whether they would return with better terms or with ultimatums." = "拒绝带来了挫折，却不令人意外。条件过于雄心勃勃，双方的信任薄弱，妥协的政治意愿也不足。外交官返回各自首都，知道自己还会回来——问题只在于，下次带来的会是更好的条件，还是最后通牒。"

[[rulesets]]
[rulesets.rules]
"The agreement shaped the political landscape in ways that outlasted the individuals who negotiated it. Trade routes were opened or closed, boundaries were drawn or erased, and the balance of power between {@bt_ent1|::subscribed_books::interpreters::entity} and {@bt_ent2|::subscribed_books::interpreters::entity} shifted in ways that would take years to fully understand." = "协议改变了政治格局，其影响比谈判者本人更为长久。贸易路线被开通或关闭，边界被划定或抹去，{@bt_ent1|::subscribed_books::interpreters::entity}与{@bt_ent2|::subscribed_books::interpreters::entity}之间的力量平衡也发生变化，要过多年才能彻底看清。"

[[rulesets]]
[rulesets.rules]
"In {year1}, {@bt_hero|::subscribed_books::interpreters::person} was lost while on a diplomatic mission." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}在执行外交使命时失踪。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person} had been sent to broker an agreement between {@bt_ent1|::subscribed_books::interpreters::entity} and {@bt_ent2|::subscribed_books::interpreters::entity}." = "{@bt_hero|::subscribed_books::interpreters::person}受命前去促成{@bt_ent1|::subscribed_books::interpreters::entity}与{@bt_ent2|::subscribed_books::interpreters::entity}之间的协议。"

[[rulesets]]
[rulesets.rules]
"The mission was meant to bring the two parties closer to understanding." = "这项使命原本是为了增进双方的相互理解。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person} never returned." = "{@bt_hero|::subscribed_books::interpreters::person}再也没有回来。"

[[rulesets]]
[rulesets.rules]
"The loss of a diplomat was not merely a personal tragedy. It was a message -- intentional or not -- that the path to peace was blocked. Trust between {@bt_ent1|::subscribed_books::interpreters::entity} and {@bt_ent2|::subscribed_books::interpreters::entity} would take years to rebuild, if it could be rebuilt at all." = "一位外交官的失踪，并非只是一场个人悲剧。无论有意与否，它都传递出一个讯息：通往和平的道路已经受阻。{@bt_ent1|::subscribed_books::interpreters::entity}与{@bt_ent2|::subscribed_books::interpreters::entity}之间的信任，即使还能重建，也需要多年。"

[[rulesets]]
[rulesets.rules]
"In {year1}, trade took place between {@bt_ent1|::subscribed_books::interpreters::entity} and {@bt_ent2|::subscribed_books::interpreters::entity}. The caravans that traveled between the two peoples carried more than goods -- they carried information, culture, and the fragile beginnings of mutual understanding. In a world defined by conflict, commerce was one of the few forces that consistently brought peoples together." = "{year1}年，{@bt_ent1|::subscribed_books::interpreters::entity}与{@bt_ent2|::subscribed_books::interpreters::entity}展开贸易。往来于两个族群之间的商队，带着的不只是货物，还有消息、文化，以及相互理解脆弱的开端。在一个由冲突塑造的世界里，商业是少数能不断将不同族群联系起来的力量。"

[[rulesets]]
[rulesets.rules]
"The movement of goods between {@bt_ent1|::subscribed_books::interpreters::entity} and {@bt_ent2|::subscribed_books::interpreters::entity} was the lifeblood of both civilizations. What one had in surplus, the other needed. What one could craft, the other could not. The exchange was practical, unsentimental, and absolutely essential." = "{@bt_ent1|::subscribed_books::interpreters::entity}与{@bt_ent2|::subscribed_books::interpreters::entity}之间的货物流动，是两个文明的命脉。一方富余的，正是另一方所需；一方能制作的，另一方却做不出。这种交换实际、毫不感情用事，却不可或缺。"

[[rulesets]]
[rulesets.rules]
"In {year1}, a diplomatic event of significance occurred involving {@bt_ent1|::subscribed_books::interpreters::entity}. The details, as recorded, suggest a moment when the political calculus of the region shifted -- perhaps imperceptibly, perhaps decisively." = "{year1}年，一件涉及{@bt_ent1|::subscribed_books::interpreters::entity}的重要外交事件发生了。记录中的细节表明，当时整个地区的政治算计发生了转变——也许微不可察，也许影响深远。"

[[rulesets]]
[rulesets.rules]
"In {year1}, {@bt_hero|::subscribed_books::interpreters::person} created {work_type} at {@bt_site|::subscribed_books::interpreters::place}. The act of creation was deliberate -- not a hobby or a pastime, but a statement. {@bt_hero2|::subscribed_books::interpreters::person} had something to say, and {work_desc} was the medium through which it would be said." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}在{@bt_site|::subscribed_books::interpreters::place}创造了{work_type}。这是一场有意的创作——不是爱好，也不是消遣，而是一种表达。{@bt_hero2|::subscribed_books::interpreters::person}有话要说，{work_desc}就是传达这些话的媒介。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person} composed {work_type} at {@bt_site|::subscribed_books::interpreters::place} in the year {year1}. In a world preoccupied with survival, the creation of art was an act of faith -- a declaration that there was more to existence than merely enduring it." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}在{@bt_site|::subscribed_books::interpreters::place}创作了{work_type}。在一个一心求生的世界里，艺术创作是一种信念的举动——宣告存在的意义，不止是勉强活下去。"

[[rulesets]]
[rulesets.rules]
"The year {year1} saw {@bt_hero|::subscribed_books::interpreters::person} create {work_type} at {@bt_site|::subscribed_books::interpreters::place}. Whether the work was born of joy, grief, or the simple need to make something that had not existed before, it stood as evidence that {@bt_entity|::subscribed_books::interpreters::entity} valued more than just strength and stone." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}在{@bt_site|::subscribed_books::interpreters::place}创造了{work_type}。无论作品源于欢乐、悲伤，还是单纯想造出此前不存在的东西，它都证明：{@bt_entity|::subscribed_books::interpreters::entity}所珍视的，不只有力量与石头。"

[[rulesets]]
[rulesets.rules]
"The work was composed in the shadow of loss. {@bt_relative|::subscribed_books::interpreters::person}, {@bt_hero|::subscribed_books::interpreters::person}'s {relation}, had died in {year1}. Grief does not always silence the artist -- sometimes it sharpens them, gives them a clarity of purpose that happiness never could. {@bt_hero2|::subscribed_books::interpreters::person}'s {work_desc} carried the weight of that loss in every line." = "这部作品诞生在失去亲人的阴影中。{@bt_hero|::subscribed_books::interpreters::person}的{relation}，{@bt_relative|::subscribed_books::interpreters::person}，已于{year1}年死去。悲伤并不总会让艺术家沉默——有时它反而使人敏锐，给予一种幸福从未能带来的清晰目标。{@bt_hero2|::subscribed_books::interpreters::person}的{work_desc}里，每一行都承载着那份失去的重量。"

[[rulesets]]
[rulesets.rules]
"Art created during wartime carries a weight that peacetime works cannot. {@bt_hero|::subscribed_books::interpreters::person} composed in a world where people were dying, where the future was uncertain, where beauty was a luxury that some could not afford. The {work_desc} that emerged was defiant -- not escapist, but insistent that even now, especially now, creation mattered." = "战争中创造的艺术，带着和平时期的作品无法拥有的重量。{@bt_hero|::subscribed_books::interpreters::person}创作时，人们正在死去，未来充满不确定，美成了有些人负担不起的奢侈。由此诞生的{work_desc}充满抗争——不是逃避现实，而是坚持认为，即使此刻，尤其此刻，创造仍然重要。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person} was a prolific creator. This was the {ordinal} significant work attributed to {pos1} name. In {@bt_entity|::subscribed_books::interpreters::entity}, {@bt_hero2|::subscribed_books::interpreters::person}'s contributions to {work_desc} had become part of the cultural fabric -- performed, recited, and passed down as something worth preserving." = "{@bt_hero|::subscribed_books::interpreters::person}是一位多产的创造者。这是记在{pos1}名下的第{ordinal}部重要作品。在{@bt_entity|::subscribed_books::interpreters::entity}，{@bt_hero2|::subscribed_books::interpreters::person}对{work_desc}的贡献已成为文化的一部分——被表演、吟诵，并作为值得保存的东西传承下去。"

[[rulesets]]
[rulesets.rules]
"Whether this work would endure beyond {@bt_hero|::subscribed_books::interpreters::person}'s lifetime remained to be seen. But in {@bt_site|::subscribed_books::interpreters::place}, at least for a time, it was valued -- shared, discussed, and held up as proof that {@bt_entity|::subscribed_books::interpreters::entity} was a civilization capable of producing more than warriors and walls." = "这部作品能否比{@bt_hero|::subscribed_books::interpreters::person}的生命更长久，还有待观察。但在{@bt_site|::subscribed_books::interpreters::place}，至少曾有一段时间，它备受珍视——被分享、讨论，并被用来证明：{@bt_entity|::subscribed_books::interpreters::entity}这个文明，能创造的不只有战士与城墙。"

[[rulesets]]
[rulesets.rules]
"In {year1}, {@bt_hero|::subscribed_books::interpreters::person} learned a secret -- knowledge forbidden to most, dangerous to all, and irresistible to those with the will to seek it. The world changed for {pro1} that day, though the world itself did not yet know it." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}学得一个秘密——对多数人而言是禁忌，对所有人而言都危险，对有意追寻者而言又无法抗拒的知识。那一天，{pro1}的世界改变了，尽管世界本身尚未察觉。"

[[rulesets]]
[rulesets.rules]
"There are things that, once known, cannot be unknown. {@bt_hero|::subscribed_books::interpreters::person} learned this in {year1}, when forbidden knowledge passed into {pos1} possession. The change was invisible and absolute." = "有些事情一旦知道，就再也无法装作不知。{year1}年，当禁忌知识落入{pos1}手中时，{@bt_hero|::subscribed_books::interpreters::person}明白了这一点。变化无形，却彻底而绝对。"

[[rulesets]]
[rulesets.rules]
"The knowledge came from {@bt_teacher|::subscribed_books::interpreters::person}." = "这些知识来自{@bt_teacher|::subscribed_books::interpreters::person}。"

[[rulesets]]
[rulesets.rules]
"The knowledge came from {@bt_teacher|::subscribed_books::interpreters::person} -- a figure whose own mastery of forbidden arts had been the subject of whispered speculation for years. What motivated {@bt_teacher2|::subscribed_books::interpreters::person} to share this knowledge was unclear. Perhaps it was the desire to see the art survive. Perhaps it was something darker." = "这些知识来自{@bt_teacher|::subscribed_books::interpreters::person}——多年来，人们一直低声猜测此人对禁忌之术究竟掌握了多少。{@bt_teacher2|::subscribed_books::interpreters::person}为何愿意分享，原因并不清楚。也许是希望这门技艺延续下去，也许出于更加阴暗的动机。"

[[rulesets]]
[rulesets.rules]
"{@bt_teacher|::subscribed_books::interpreters::person} did not survive long after passing on the secret. Whether the two events were connected -- whether the act of teaching had drawn unwanted attention, or simply exhausted the last of {@bt_teacher2|::subscribed_books::interpreters::person}'s vitality -- the timing was difficult to dismiss as coincidence." = "传授秘密后不久，{@bt_teacher|::subscribed_books::interpreters::person}便死去了。两件事是否有关——传授是否招来了不必要的注意，还是仅仅耗尽了{@bt_teacher2|::subscribed_books::interpreters::person}最后的生命力——这样的时间先后，很难简单归为巧合。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person} would put the knowledge to use. The power that {pro1} now possessed was not academic -- it was practical, and it would be wielded. The consequences of that wielding are recorded elsewhere in this account." = "{@bt_hero|::subscribed_books::interpreters::person}终会将知识付诸实践。{pro1}如今掌握的力量，并非纸上学问，而是能够使用、也将被使用的实际力量。施展它所带来的后果，记载在这部记述的其他地方。"

[[rulesets]]
[rulesets.rules]
"In {year1}, {@bt_hero|::subscribed_books::interpreters::person} unleashed a power upon {@bt_target|::subscribed_books::interpreters::person} at {@bt_site|::subscribed_books::interpreters::place}. The act was not subtle. Forces that most people only knew from stories -- forces that the wise pretended did not exist -- were brought to bear on a living being. The result was immediate and terrible." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}在{@bt_site|::subscribed_books::interpreters::place}向{@bt_target|::subscribed_books::interpreters::person}释放了一股力量。这并非隐秘的举动。大多数人只在故事里听说过的力量——智者们假装并不存在的力量——被施加在一个活生生的存在身上。结果立刻显现，可怕至极。"

[[rulesets]]
[rulesets.rules]
"{@bt_target|::subscribed_books::interpreters::person} did not survive the encounter. The power that {@bt_hero|::subscribed_books::interpreters::person} wielded was not a threat or a warning -- it was a sentence, carried out with the certainty of someone who had moved beyond hesitation." = "{@bt_target|::subscribed_books::interpreters::person}未能从这次遭遇中生还。{@bt_hero|::subscribed_books::interpreters::person}施展的力量，不是威胁，也不是警告，而是一道判决，执行时毫不迟疑，仿佛施术者早已超越了犹豫。"

[[rulesets]]
[rulesets.rules]
"{@bt_target|::subscribed_books::interpreters::person} was changed by the interaction -- fundamentally, irrevocably. What emerged from the encounter was not what had entered it. {@bt_hero|::subscribed_books::interpreters::person} had reshaped another living being, and the act left both of them altered." = "这次作用改变了{@bt_target|::subscribed_books::interpreters::person}——从根本上改变，再也无法逆转。经历之后出现的存在，已不再是先前进入其中的那个。{@bt_hero|::subscribed_books::interpreters::person}重塑了另一个生命，而这件事也让双方都发生了变化。"

[[rulesets]]
[rulesets.rules]
