# forms/essay/words.lua 与 essay.lua：共享随笔框架、作者立场、题名呼应和例证引语。
# 以完整句接续正文，兼容 fresh_sentences 删除重复叙述后的剩余句子。
base = "subscribed_books::essay"

[[rulesets]]
[rulesets.rules]
"This essay concerns {::subscribed_books::essay_vocabulary::subject}." = "这篇论文讨论的是{::subscribed_books::essay_vocabulary::subject}。"

# essay_reflections.subject_line：结论回到作品的具体主题。
"And so I come back to {::subscribed_books::essay_vocabulary::subject}, as I have all along." = "于是，我又回到{::subscribed_books::essay_vocabulary::subject}，正如我始终所做的那样。"
"In the end it was always {::subscribed_books::essay_vocabulary::subject} I was thinking of." = "说到底，我始终思考的都是{::subscribed_books::essay_vocabulary::subject}。"
"Remember {::subscribed_books::essay_vocabulary::subject} the next time someone tells you it was nothing." = "下次有人对你说那算不了什么时，请记住{::subscribed_books::essay_vocabulary::subject}。"
"That is the truth about {::subscribed_books::essay_vocabulary::subject}. Deny it if you can." = "这便是{::subscribed_books::essay_vocabulary::subject}的真相。若能否认，就尽管否认吧。"
"That is the truth about {::subscribed_books::essay_vocabulary::subject}." = "这便是{::subscribed_books::essay_vocabulary::subject}的真相。"
"Deny it if you can." = "若能否认，就尽管否认吧。"
"Let {::subscribed_books::essay_vocabulary::subject} stand as the example, and let us be worthy of it." = "让{::subscribed_books::essay_vocabulary::subject}成为榜样，也让我们无愧于它。"
"From {::subscribed_books::essay_vocabulary::subject}, all that is written here follows." = "这里写下的一切，都源于{::subscribed_books::essay_vocabulary::subject}。"
"Weighed fairly, {::subscribed_books::essay_vocabulary::subject} deserves more than the record gives it." = "公允地衡量，{::subscribed_books::essay_vocabulary::subject}应当得到比史册所给予的更多的评价。"
"So much, then, for {::subscribed_books::essay_vocabulary::subject}; the reader may judge the rest." = "关于{::subscribed_books::essay_vocabulary::subject}，就说到这里；其余留待读者评判。"
"Praise, then, for {::subscribed_books::essay_vocabulary::subject}, and for all that came of it." = "那么，让我们赞颂{::subscribed_books::essay_vocabulary::subject}，以及由此而来的一切。"
"So let {::subscribed_books::essay_vocabulary::subject} be remembered, and sung again." = "愿{::subscribed_books::essay_vocabulary::subject}被铭记，再次得到传唱。"
"That, in the end, is {::subscribed_books::essay_vocabulary::subject}." = "说到底，这便是{::subscribed_books::essay_vocabulary::subject}。"

# 作者与所论之事的关系。
"I write of my own life, and I know the danger in that: no one sees a thing worse than the one it happened to, except perhaps everyone else." = "我写的是自己的人生，也知道其中的危险：没有谁比亲历者更看不清一件事，或许其他所有人除外。"
"{@bt_to|::subscribed_books::vocabulary::person} is my {relation}, and I will not pretend to write as a stranger would." = "{@bt_to|::subscribed_books::vocabulary::person} 是我的{relation}，我不会假装自己能像陌生人那样落笔。"
"I will not pretend I was ever a friend to {@bt_to|::subscribed_books::vocabulary::person}." = "我不会假装自己曾是 {@bt_to|::subscribed_books::vocabulary::person} 的朋友。"
"I am of {@bt_civ|::subscribed_books::vocabulary::entity}, as they were, and I write as one who knows what that means." = "我与他们一样，出身于 {@bt_civ|::subscribed_books::vocabulary::entity}，也深知这一身份意味着什么。"
"I am {race_article}, as they were, though not of their people, and I write as a cousin writes: near enough to see, far enough to judge." = "我与他们一样，是{race_article}，却不属于他们的族群。我如同远亲一般落笔：近得足以看清，远得足以判断。"
"I am {race_article}, and I write of them from outside, which is sometimes the only place from which a thing can be seen whole." = "我是{race_article}，以局外人的身份写他们。有时，只有站在外面，才能看清一件事的全貌。"
"I did not know them." = "我并不认识他们。"
"I write as a stranger, which is to say as most readers will read." = "我以陌生人的身份写下这些，正如大多数读者将以陌生人的身份阅读。"

# 沉思、论战、宣言、批评和赞颂的开篇。
"I have been thinking about {matter}, and about what it says of us." = "我一直在思考{matter}，也思考它道出了我们怎样的面貌。"
"I am {author}, and these are my reflections." = "我是{author}，以下便是我的思考。"
"Quiet thoughts on {matter}." = "关于{matter}的静思。"
"An essay by {author}." = "论文，作者：{author}。"
"The {adj} practice of contemplation is unfashionable in our age; we prefer action." = "在我们这个时代，{adj}沉思已不合时宜；我们更喜欢行动。"
"But I, {author}, believe there is value in sitting with a thing until it speaks." = "但我，{author}，相信静静面对一件事，直至它自己开口，仍有其价值。"
"This essay is my attempt to sit with {matter}." = "这篇论文，便是我静心面对{matter}的一次尝试。"
"Enough." = "够了。"
"Someone must say it plainly, and I, {author}, will." = "总得有人把话说清楚，而我，{author}，就要这么做。"
"This essay is an argument, and I make no apology for its {adj} tone." = "这篇论文是一场论辩，我不会为它{adj}语气道歉。"
"This essay means to persuade." = "这篇论文意在说服读者。"
"I, {author}, write about {matter} in {adj} earnest." = "我，{author}，以{adj}郑重态度写下对{matter}的看法。"
"What follows is not balanced." = "下文并不追求平衡。"
"Balance is for scales." = "平衡是天平的事。"
"I, {author}, set forth what I hold to be true about {matter}." = "我，{author}，在此陈述自己关于{matter}所认定的真理。"
"Let the world take notice." = "愿世人留意。"
"This is a declaration of {adj} purpose." = "这是一份{adj}志向宣言。"
"I, {author}, write it so that what I hold about {matter} is on record, and cannot be said to have been whispered." = "我，{author}，写下这些，是要让自己对{matter}的信念留下记录，不容旁人说那只是私下的低语。"
"A critical examination of {matter}, by {author}." = "对{matter}的批判性审视，作者：{author}。"
"It spares nothing, least of all its author." = "它不放过任何事物，尤其不放过作者自己。"
"This essay examines {matter} as it was, whatever memory has made of it since." = "这篇论文审视{matter}本来的面貌，无论后来的记忆将它改成了什么样子。"
"This is an essay of admiration, and I make no apology for it." = "这是一篇赞颂的论文，我无意为此道歉。"
"By {author}." = "作者：{author}。"
"In praise of what deserves it." = "赞颂值得赞颂之物。"
"What follows is admiration, plainly." = "下文很简单，就是赞美。"
"I, {author}, have set myself the {adj} task of putting {matter} into words." = "我，{author}，为自己定下了将{matter}诉诸文字这一{adj}任务。"
"I will fail, as all who try to capture what they love must fail." = "我会失败，正如一切试图以文字捕捉所爱之物的人注定失败。"
"The attempt is the point." = "尝试本身便是意义所在。"

# 各视角的收尾；署名与它前面的末句按原文保持相连。
"These are my thoughts." = "以上便是我的想法。"
"They are not finished; thoughts never are. -- {author}" = "它们尚未完成；思想从来不会真正完成。——{author}"
"I leave it there, for now. -- {author}" = "暂且写到这里。——{author}"
"If this essay offends you, good." = "若这篇论文冒犯了你，那很好。"
"It was meant to. -- {author}" = "这正是我的本意。——{author}"
"This essay is a {adj} brick thrown through the window of complacency." = "这篇论文是一块{adj}砖，要砸穿自满的窗户。"
"If the glass shatters, perhaps some air will get in. -- {author}" = "玻璃若碎了，或许就能透进些空气。——{author}"
"This is what I hold." = "这便是我的信念。"
"Break with it if you must, but know that I will not. -- {author}" = "若你非要与之决裂，尽管去做，但要知道我绝不会。——{author}"
"That is my judgment." = "这便是我的判断。"
"Let it be weighed as carefully as it was made. -- {author}" = "愿人们权衡它时，像我作出判断时一样审慎。——{author}"
"I have praised what I came to praise." = "我已赞颂了自己本欲赞颂的事物。"
"It deserves better than words, but words are what I have. -- {author}" = "它值得比文字更好的东西，可我拥有的只有文字。——{author}"

# 题名在论点与结论中的呼应。
"I have called this essay what I have because it is the lesson of my life: never underestimate {topic}." = "我为这篇论文取下这个题目，是因为这是我一生的教训：永远不要低估{topic}。"
"So I say it again, and I have earned the right to: never underestimate {topic}." = "所以我再次申明，而我有资格这样说：永远不要低估{topic}。"
"My title promises errors in {topic}, and I will name them." = "我的题目承诺指出{topic}中的错误，我会逐一列明。"
"Those are the errors I promised." = "以上便是我承诺指出的错误。"
"Let {topic} answer for them." = "让{topic}为这些错误作出回应吧。"
"My title says this is my life." = "我的题目说，这是我的人生。"
"It is, or the part of it that mattered." = "确实如此，至少是其中真正要紧的部分。"
"My title promises questions about {topic}, not answers, and I mean to keep that promise." = "我的题目承诺提出关于{topic}的问题，而非答案，我打算信守这一承诺。"
"I have called it a quandary, and it is one." = "我称它为难题，而它确实如此。"
"I call this a journey to {topic}, and that is what it was." = "我称此为通往{topic}的旅程，而事实正是如此。"
"I call this an introduction to {topic}, and I write it for those who do not know us." = "我称此为对{topic}的介绍，写给那些不了解我们的人。"
"My title promises a secret, and I will come to it." = "我的题目承诺揭示一个秘密，我会谈到它。"
"My title speaks of a before and an after, and this is the line between them." = "我的题目谈的是前后之别，而这便是两者之间的分界。"
"My title asks what a true {topic} is." = "我的题目问的是，怎样才算真正的{topic}。"
"What follows is my answer." = "下文便是我的回答。"
"That is what I mean by a true {topic}: what we do when it is our turn, whatever the songs make of us." = "这就是我所说的真正的{topic}：轮到我们时，我们会如何行动，无论歌谣后来如何描绘我们。"
"I have given this essay a proud title, and I mean to earn it." = "我给这篇论文取了一个自豪的题目，也打算让它名副其实。"
"I said my title was proud." = "我说过，我的题目充满自豪。"
"I hope I have shown it was also true." = "我希望自己也已证明，它同样真实。"
"My title is not a kind one, and the essay will not be kinder." = "我的题目并不仁慈，正文也不会更温和。"
"My title asks a question." = "我的题目提出了一个问题。"
"I do not promise to answer it, only to ask it properly." = "我不承诺给出答案，只承诺把问题问清楚。"
"I have called this a record, and a record it will be: what happened, and what I make of it." = "我称此为记录，它也将是一份记录：发生了什么，以及我如何看待它。"
"My title promises instruction, and what follows should be read as such." = "我的题目承诺传授知识，下文也应当如此看待。"
"My title makes this personal, and it is." = "我的题目表明这是个人之事，事实也的确如此。"
"My title calls this a journey, and every argument is one." = "我的题目将此称为旅程，而每一场论辩都是如此。"
"My title speaks of something hidden." = "我的题目谈的是某种隐藏之物。"
"I will come to it." = "我会谈到它。"

# 唯一一段示例对白前后的说明。
"No one recorded how it happened." = "没有人记下它是如何发生的。"
"I picture it this way, as it must have been:" = "在我想象中，它必定是这样的："
"Let me set down a small scene." = "容我写下一小段场景。"
"The record does not keep it; I keep it, because it shows what I mean." = "史料未曾留下这一幕；我把它留下，因为它能表明我的意思。"
"Whether those were the words or not, that was the meaning." = "无论当时说的是否是这些话，意思就是如此。"
"The record would never keep such a moment." = "史料绝不会留下这样一个瞬间。"
"That is why I have." = "所以我把它留了下来。"

