# Trait: cruel.
[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} did not stop when {@bt_b|::subscribed_books::vocabulary::person} fell. {pro1} kept going, because the point was not to win. The point was to make sure {@bt_b2|::subscribed_books::vocabulary::person} never forgot losing." = "{@bt_b|::subscribed_books::vocabulary::person}倒下时，{@bt_a|::subscribed_books::vocabulary::person}并未停手。{pro1}继续攻击，因为目的不是获胜，而是确保{@bt_b2|::subscribed_books::vocabulary::person}永远忘不了这场失败。"
"{@bt_a|::subscribed_books::vocabulary::person} smiled the entire time {@bt_b|::subscribed_books::vocabulary::person} struggled, and made no move to end it quickly." = "{@bt_b|::subscribed_books::vocabulary::person}挣扎时，{@bt_a|::subscribed_books::vocabulary::person}始终微笑，丝毫不打算迅速结束这一切。"
