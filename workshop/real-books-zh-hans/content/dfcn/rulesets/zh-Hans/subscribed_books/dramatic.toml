# styles/dramatic.lua：舞台提示、地点词池与全部分主题对话。
base = "subscribed_books::dramatic"

[[rulesets]]
[rulesets.rules]
"{@bt_name|::subscribed_books::vocabulary::person} enters -- {article} {race}, {profession} by trade." = "{@bt_name|::subscribed_books::vocabulary::person}登场，一位{race}，以{profession}为业。"
"{@bt_name|::subscribed_books::vocabulary::person}, {article} {race} {profession}, enters." = "{@bt_name|::subscribed_books::vocabulary::person}登场，一位{race}{profession}。"
"Enter {@bt_name|::subscribed_books::vocabulary::person}, {article} {race}." = "{@bt_name|::subscribed_books::vocabulary::person}登场，一位{race}。"
"{@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} are in {place}." = "{@bt_a|::subscribed_books::vocabulary::person}与{@bt_b|::subscribed_books::vocabulary::person}身处{place}。"
"{@bt_a|::subscribed_books::vocabulary::person} is in {place}." = "{@bt_a|::subscribed_books::vocabulary::person}身处{place}。"
"{@bt_speaker|::subscribed_books::vocabulary::person}: \"{line}\"" = "{@bt_speaker|::subscribed_books::vocabulary::person}：“{line}”"
"{line}" = "{line}"
"{thread}" = "{thread}"
"{beat}" = "{beat}"
"{action}" = "{action}"

[[rulesets]]
name = "military"
[rulesets.rules]
"Your {::subscribed_books::speech::military::group} are a disgrace. I have seen farmers fight better than what you station at {::subscribed_books::speech::military::object}." = "你的{::subscribed_books::speech::military::group}真是耻辱。我见过农夫都比你驻在{::subscribed_books::speech::military::object}的那些人更能打。"
"You {::subscribed_books::speech::military::strategy} {::subscribed_books::speech::military::object} and call it a plan? It is an invitation to disaster." = "你{::subscribed_books::speech::military::strategy}{::subscribed_books::speech::military::object}，就管这叫计划？这是在招来灾难。"
"{::subscribed_books::speech::military::object} falls because your {::subscribed_books::speech::military::group} were never where they should have been." = "{::subscribed_books::speech::military::object}之所以失守，是因为你的{::subscribed_books::speech::military::group}从不在该在的位置。"
"Do you think {military_multiplier} times the cowardice will somehow win the day?" = "你觉得胆怯翻上{military_multiplier}倍，就能赢下这一天吗？"
"I will not pretend your {::subscribed_books::speech::military::strategy} at {::subscribed_books::speech::military::object} was anything but treasonous incompetence." = "我绝不会假装你在{::subscribed_books::speech::military::object}的{::subscribed_books::speech::military::strategy}，不是近乎叛国的无能。"
"The {::subscribed_books::speech::military::group} you sent were boys playing at war." = "你送来的{::subscribed_books::speech::military::group}，不过是玩打仗游戏的男孩。"
"If {::subscribed_books::speech::military::object} burns, it burns because you {::subscribed_books::speech::military::strategy} it into the ground." = "如果{::subscribed_books::speech::military::object}烧毁，那是因为你用{::subscribed_books::speech::military::strategy}把它送进火坑。"
"We are dying by the {military_multiplier} while your {::subscribed_books::speech::military::group} sit and sharpen sticks." = "我们以{military_multiplier}倍的速度死去，你的{::subscribed_books::speech::military::group}却坐着磨木棍。"
"You call this defense? Watching you {::subscribed_books::speech::military::strategy} {::subscribed_books::speech::military::object} is a joke told at my expense." = "你管这叫防御？看着你{::subscribed_books::speech::military::strategy}{::subscribed_books::speech::military::object}，就像听一个拿我寻开心的笑话。"
"{::subscribed_books::speech::military::group} like yours should be court-martialed, not praised." = "像你这样的{::subscribed_books::speech::military::group}应该上军事法庭，而非受赞扬。"
"Every hour you {::subscribed_books::speech::military::strategy} {::subscribed_books::speech::military::object} is an hour our dead multiply." = "你每多花一小时{::subscribed_books::speech::military::strategy}{::subscribed_books::speech::military::object}，我们的死者就多一小时成倍增加。"
"I have lost good soldiers to your {::subscribed_books::speech::military::group} and their precious {::subscribed_books::speech::military::strategy}." = "我因为你的{::subscribed_books::speech::military::group}和他们那宝贝{::subscribed_books::speech::military::strategy}，失去了好士兵。"
"Tell me, were you drunk when you {::subscribed_books::speech::military::strategy} {::subscribed_books::speech::military::object}?" = "告诉我，你{::subscribed_books::speech::military::strategy}{::subscribed_books::speech::military::object}的时候是不是喝醉了？"
"The enemy laughs at your {::subscribed_books::speech::military::group}. I have heard them." = "敌人在笑你的{::subscribed_books::speech::military::group}，我亲耳听见。"
"{::subscribed_books::speech::military::object} was ours until your {::subscribed_books::speech::military::strategy} handed it away." = "{::subscribed_books::speech::military::object}原本属于我们，直到你的{::subscribed_books::speech::military::strategy}把它拱手送走。"
"You would trade {military_multiplier} of our lives for one of your prideful {::subscribed_books::speech::military::group}." = "你宁愿用我们{military_multiplier}条命，换你一个骄傲的{::subscribed_books::speech::military::group}。"
"No banner, no honor, no sense. That is your {::subscribed_books::speech::military::group}." = "没有旗帜，没有荣誉，没有脑子。这就是你的{::subscribed_books::speech::military::group}。"
"Why did you {::subscribed_books::speech::military::strategy} {::subscribed_books::speech::military::object} when the walls were already breached?" = "墙都已被攻破，你为什么还要{::subscribed_books::speech::military::strategy}{::subscribed_books::speech::military::object}？"
"Your {::subscribed_books::speech::military::group} fled. They always flee. Stop pretending otherwise." = "你的{::subscribed_books::speech::military::group}逃了。他们总逃。别再装作不是。"
"I curse the day you were given command of {::subscribed_books::speech::military::object}." = "我诅咒把{::subscribed_books::speech::military::object}指挥权交给你的那一天。"
"And who pays for the {::subscribed_books::speech::military::group}? We cannot {::subscribed_books::speech::military::strategy} {::subscribed_books::speech::military::object} and feed our people at the same time." = "谁来供养{::subscribed_books::speech::military::group}？我们无法一边{::subscribed_books::speech::military::strategy}{::subscribed_books::speech::military::object}，一边喂饱人民。"
"Your plan ignores the real threat. {::subscribed_books::speech::military::object} is not where the danger lies." = "你的计划忽略了真正的威胁。危险不在{::subscribed_books::speech::military::object}。"
"You speak of the {::subscribed_books::speech::military::group} as though they are infinite. They are not." = "你谈{::subscribed_books::speech::military::group}，仿佛他们无穷无尽。事实并非如此。"
"{::subscribed_books::speech::military::group} are not cowards. They are exhausted, and you would grind them to dust." = "{::subscribed_books::speech::military::group}不是懦夫，而是累坏了，你还要把他们磨成尘。"
"If I had {military_multiplier} the men, perhaps your tongue would find a kinder word." = "若我有{military_multiplier}倍的人手，你的舌头也许能说出更和善的词。"
"We did {::subscribed_books::speech::military::strategy} {::subscribed_books::speech::military::object} with what the gods gave us, not what you imagined." = "我们确实{::subscribed_books::speech::military::strategy}{::subscribed_books::speech::military::object}，用的是众神给予的东西，而非你想象的东西。"
"You were not there when the {::subscribed_books::speech::military::group} held the line at {::subscribed_books::speech::military::object}." = "{::subscribed_books::speech::military::group}在{::subscribed_books::speech::military::object}守住阵线时，你不在场。"
"Must every failure be mine? Whether to {::subscribed_books::speech::military::strategy} {::subscribed_books::speech::military::object} was decided above me." = "每次失败都得算我的？是否{::subscribed_books::speech::military::strategy}{::subscribed_books::speech::military::object}，是我上面的人决定的。"
"{::subscribed_books::speech::military::object} still stands. Barely, but it stands, and that is on my {::subscribed_books::speech::military::group}." = "{::subscribed_books::speech::military::object}仍然屹立。虽勉强，却还站着，那是我的{::subscribed_books::speech::military::group}的功劳。"
"I will not apologize for sparing lives when your {::subscribed_books::speech::military::strategy} would have spent them." = "你的{::subscribed_books::speech::military::strategy}会耗尽生命，而我救下了它们，我不会为此道歉。"
"You want {military_multiplier} more dead? Give the order yourself, then." = "你想多死{military_multiplier}倍的人？那就自己下命令。"
"The {::subscribed_books::speech::military::group} fought. They bled. Show them that much respect." = "{::subscribed_books::speech::military::group}战斗过，流过血。至少给他们这点尊重。"
"Had you {::subscribed_books::speech::military::strategy} {::subscribed_books::speech::military::object} as I asked, none of this would matter." = "若你按我要求的{::subscribed_books::speech::military::strategy}{::subscribed_books::speech::military::object}，这一切都不会要紧。"
"I am tired of your accusations and the {::subscribed_books::speech::military::group} are tired of dying for them." = "我厌倦了你的指责，{::subscribed_books::speech::military::group}也厌倦了为它们送命。"
"{::subscribed_books::speech::military::object} was a trap, and I pulled the {::subscribed_books::speech::military::group} out before it closed." = "{::subscribed_books::speech::military::object}是个陷阱，我在它合拢之前，把{::subscribed_books::speech::military::group}拉了出来。"
"You speak of treason. I speak of survival, and I choose survival." = "你谈叛国，我谈生存。我选择生存。"
"With {military_multiplier} the supplies I could have taken {::subscribed_books::speech::military::object} myself." = "若有{military_multiplier}倍补给，我自己就能拿下{::subscribed_books::speech::military::object}。"
"Do not lecture me on war. Your {::subscribed_books::speech::military::strategy} has never met a blade." = "别给我讲战争。你的{::subscribed_books::speech::military::strategy}从未见过刀锋。"
"The {::subscribed_books::speech::military::group} are my responsibility, not your insult to throw about." = "{::subscribed_books::speech::military::group}是我的责任，不是任你丢来丢去的辱词。"
"We {::subscribed_books::speech::military::strategy} {::subscribed_books::speech::military::object} the only way we could. Blame the enemy, not the shield." = "我们用唯一能用的方式{::subscribed_books::speech::military::strategy}{::subscribed_books::speech::military::object}。怪敌人，别怪盾牌。"

[[rulesets]]
name = "economy"
[rulesets.rules]
"You would {::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target} while the rest of us starve? Where does the {::subscribed_books::speech::economy::resource} go? Into your pockets?" = "我们其他人挨饿时，你还要{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}？{::subscribed_books::speech::economy::resource}都去了哪儿？进了你的口袋？"
"The {::subscribed_books::speech::economy::resource} is gone, and you stand there talking about {::subscribed_books::speech::economy::target}." = "{::subscribed_books::speech::economy::resource}没了，你却站在那里谈论{::subscribed_books::speech::economy::target}。"
"{::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target} if you must, but do not pretend the {::subscribed_books::speech::economy::resource} was never ours." = "非要{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}也行，但别装作{::subscribed_books::speech::economy::resource}从不属于我们。"
"Who gave you the right to {::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target} and bleed us of {::subscribed_books::speech::economy::resource}?" = "谁给你的权利{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}，榨干我们的{::subscribed_books::speech::economy::resource}？"
"We are not fools. Every time you {::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target}, the {::subscribed_books::speech::economy::resource} vanishes from our hands." = "我们不是傻子。每次你{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}，{::subscribed_books::speech::economy::resource}就从我们手里消失。"
"If the {::subscribed_books::speech::economy::resource} meant anything to you, you would not {::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target}." = "若你还在意{::subscribed_books::speech::economy::resource}，就不会{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}。"
"Stop. Just stop {::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target} and tell me where the {::subscribed_books::speech::economy::resource} went." = "停下。停止{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}，告诉我{::subscribed_books::speech::economy::resource}去了哪里。"
"{::subscribed_books::speech::economy::target}? You speak of {::subscribed_books::dramatic::ref_repeat_1} while the {::subscribed_books::speech::economy::resource} dries up and our children go thin." = "{::subscribed_books::speech::economy::target}？{::subscribed_books::speech::economy::resource}枯竭、孩子瘦得皮包骨时，你还在谈{::subscribed_books::dramatic::ref_repeat_1}。"
"I have watched you {::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target} a hundred times, and still the {::subscribed_books::speech::economy::resource} never reaches the poor." = "我看你{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}一百回了，{::subscribed_books::speech::economy::resource}仍从未到穷人手里。"
"You {::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target} for your own glory and call the missing {::subscribed_books::speech::economy::resource} an accident." = "你为自己的荣耀{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}，却把不见的{::subscribed_books::speech::economy::resource}说成意外。"
"The ledgers lie. The {::subscribed_books::speech::economy::resource} is missing, and you were the one who chose to {::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target}." = "账本在撒谎。{::subscribed_books::speech::economy::resource}不见了，而选择{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}的正是你。"
"Empty your hands. Show me the {::subscribed_books::speech::economy::resource} before you {::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target} again." = "摊开双手。再{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}之前，先把{::subscribed_books::speech::economy::resource}给我看。"
"A fine speech about {::subscribed_books::speech::economy::target}, but where is the {::subscribed_books::speech::economy::resource} you promised?" = "关于{::subscribed_books::speech::economy::target}的演讲很好，可你答应的{::subscribed_books::speech::economy::resource}在哪里？"
"{::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target} on my account one more time and answer for the lost {::subscribed_books::speech::economy::resource}." = "你再拿我的账{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}一次，就得为失去的{::subscribed_books::speech::economy::resource}负责。"
"Do you hear the bell? It tolls for the {::subscribed_books::speech::economy::resource} you spent to {::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target}." = "听见钟声吗？它为你用来{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}而花掉的{::subscribed_books::speech::economy::resource}敲响。"
"We begged you not to {::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target}, and now the {::subscribed_books::speech::economy::resource} is nothing but dust." = "我们求你别{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}，如今{::subscribed_books::speech::economy::resource}只剩尘土。"
"Your word is ash. The {::subscribed_books::speech::economy::resource} is spent, and {::subscribed_books::speech::economy::target} paid the price." = "你的承诺成了灰。{::subscribed_books::speech::economy::resource}花光，{::subscribed_books::speech::economy::target}付出了代价。"
"They {::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target} in the capital while we here are robbed of {::subscribed_books::speech::economy::resource}." = "他们在都城{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}，我们在这里却被夺走{::subscribed_books::speech::economy::resource}。"
"If a single coin of {::subscribed_books::speech::economy::resource} remains, why did you {::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target} behind closed doors?" = "要是{::subscribed_books::speech::economy::resource}还剩哪怕一枚钱，为什么你还要关起门来{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}？"
"{::subscribed_books::speech::economy::target} will not feed us. Only the {::subscribed_books::speech::economy::resource} could, and you have thrown it away to {::subscribed_books::speech::economy::action} {::subscribed_books::dramatic::ref_repeat_1}." = "{::subscribed_books::speech::economy::target}养不活我们。只有{::subscribed_books::speech::economy::resource}能，可你为了{::subscribed_books::speech::economy::action}{::subscribed_books::dramatic::ref_repeat_1}把它扔了。"
"If we {::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target}, the {::subscribed_books::speech::economy::resource} trade collapses within a season." = "若我们{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}，{::subscribed_books::speech::economy::resource}贸易一季内就会崩溃。"
"Your numbers do not account for the {::subscribed_books::speech::economy::resource} we already owe." = "你的数字没算进我们已经欠下的{::subscribed_books::speech::economy::resource}。"
"{::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target}, and the {::subscribed_books::speech::economy::resource} survives another winter. That is the only math that matters." = "{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}，{::subscribed_books::speech::economy::resource}就能再熬一个冬天。只有这个算式要紧。"
"You call it theft. I call it the {::subscribed_books::speech::economy::resource} we spent to {::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target} before the enemy came." = "你叫它盗窃，我叫它敌人来之前，为{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}花掉的{::subscribed_books::speech::economy::resource}。"
"The {::subscribed_books::speech::economy::resource} was never enough to {::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target} and still fill your granaries." = "{::subscribed_books::speech::economy::resource}从来就不够既{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}，又填满你的粮仓。"
"Had I not {::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target}, there would be no {::subscribed_books::speech::economy::resource} at all, only ruin." = "若我没{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}，根本不会再有{::subscribed_books::speech::economy::resource}，只剩废墟。"
"Blame the harvest, not me. I {::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target} to protect what little {::subscribed_books::speech::economy::resource} remains." = "怪收成，别怪我。我{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}，是为了保护仅剩的一点{::subscribed_books::speech::economy::resource}。"
"{::subscribed_books::speech::economy::target} is the reason the {::subscribed_books::speech::economy::resource} holds any value whatsoever." = "{::subscribed_books::speech::economy::target}正是{::subscribed_books::speech::economy::resource}仍有任何价值的原因。"
"You speak of {::subscribed_books::speech::economy::resource} as if I buried it. I {::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target} so the well would not run dry." = "你谈{::subscribed_books::speech::economy::resource}，仿佛我把它埋了。我{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}，是为了不让井干涸。"
"One bad year does not make me a thief for choosing to {::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target}." = "一个坏年景，不能因为我选择{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}就把我变成贼。"
"The {::subscribed_books::speech::economy::resource} is pledged, signed, and sealed. {::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target} and we keep our honor." = "{::subscribed_books::speech::economy::resource}已承诺、签字、封定。{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}，我们才能保住荣誉。"
"Ask the guilds why the {::subscribed_books::speech::economy::resource} thins, then ask why I must {::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target}." = "去问行会为何{::subscribed_books::speech::economy::resource}减少，再问我为何必须{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}。"
"I did not {::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target} for myself. The {::subscribed_books::speech::economy::resource} bought us peace, not my comfort." = "我不是为自己{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}。{::subscribed_books::speech::economy::resource}买的是和平，不是我的舒适。"
"Without the {::subscribed_books::speech::economy::resource} we raised to {::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target}, you would be counting corpses." = "若无我们为{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}筹集的{::subscribed_books::speech::economy::resource}，你如今数的会是尸体。"
"{::subscribed_books::speech::economy::target} was the bargain. The {::subscribed_books::speech::economy::resource} was the price, and I paid it in full." = "交易是{::subscribed_books::speech::economy::target}，代价是{::subscribed_books::speech::economy::resource}，我已全额付清。"
"You want the {::subscribed_books::speech::economy::resource} back? Then undo the war I {::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target} to end." = "你想要回{::subscribed_books::speech::economy::resource}？那就撤销我为结束战争而作的{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}。"
