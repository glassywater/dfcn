# engine/story_engine.lua 的接续、空章和回顾；story_styles.lua 的 narrative 输出。
base = "subscribed_books::engine_narrative"

[[rulesets]]
[rulesets.rules]
"{@bt_succ|::subscribed_books::vocabulary::person} had loved {@bt_dead|::subscribed_books::vocabulary::person}. Imperfectly, with difficulty, and deeply, for a long time. When {::subscribed_books::personality::pro1} learned that {@bt_killer|::subscribed_books::vocabulary::person} had taken {@bt_dead2|::subscribed_books::vocabulary::person} from {::subscribed_books::personality::obj1}, something inside {@bt_succ2|::subscribed_books::vocabulary::person} broke. What grew in its place was harder, colder, and entirely focused on a single purpose." = "{@bt_succ|::subscribed_books::vocabulary::person}深爱过{@bt_dead|::subscribed_books::vocabulary::person}。这份爱并不完美，历经艰难，却深沉而长久。当{::subscribed_books::personality::pro1}得知{@bt_killer|::subscribed_books::vocabulary::person}从{::subscribed_books::personality::obj1}身边夺走了{@bt_dead2|::subscribed_books::vocabulary::person}时，{@bt_succ2|::subscribed_books::vocabulary::person}内心的某样东西碎裂了。取而代之的东西更坚硬、更冰冷，全部心思只系于一个目标。"
"{@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} were enemies because {@bt_b2|::subscribed_books::vocabulary::person} had killed {@bt_dead|::subscribed_books::vocabulary::person} -- someone {@bt_a2|::subscribed_books::vocabulary::person} had cared about deeply. The vendetta was personal." = "{@bt_a|::subscribed_books::vocabulary::person}与{@bt_b|::subscribed_books::vocabulary::person}成为仇敌，是因为{@bt_b2|::subscribed_books::vocabulary::person}杀死了{@bt_dead|::subscribed_books::vocabulary::person}——一个{@bt_a2|::subscribed_books::vocabulary::person}深切关心的人。这是私人的血仇。"
"Weeks passed. {@bt_hero|::subscribed_books::vocabulary::person} waited, and watched, and said little." = "数周过去。{@bt_hero|::subscribed_books::vocabulary::person}等待着，观察着，沉默寡言。"
"The season turned, and {@bt_hero|::subscribed_books::vocabulary::person} did not forget {cause}." = "季节更替，{@bt_hero|::subscribed_books::vocabulary::person}仍未忘记{cause}。"
"{@bt_hero|::subscribed_books::vocabulary::person} spent those days in preparation, and no one asked why." = "那些日子，{@bt_hero|::subscribed_books::vocabulary::person}一直在准备，没人问为什么。"
"For a time nothing happened, and {@bt_hero|::subscribed_books::vocabulary::person} trusted the quiet less with every day of it." = "有一阵子什么也没发生，而每过一天，{@bt_hero|::subscribed_books::vocabulary::person}便愈发不相信这份平静。"
"{@bt_a|::subscribed_books::vocabulary::person} killed {@bt_b|::subscribed_books::vocabulary::person}." = "{@bt_a|::subscribed_books::vocabulary::person}杀死了{@bt_b|::subscribed_books::vocabulary::person}。"
"{@bt_a|::subscribed_books::vocabulary::person} maimed {@bt_b|::subscribed_books::vocabulary::person}." = "{@bt_a|::subscribed_books::vocabulary::person}使{@bt_b|::subscribed_books::vocabulary::person}致残。"
"{@bt_a|::subscribed_books::vocabulary::person} beat {@bt_b|::subscribed_books::vocabulary::person}." = "{@bt_a|::subscribed_books::vocabulary::person}击败了{@bt_b|::subscribed_books::vocabulary::person}。"
"{@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} fought to a standstill." = "{@bt_a|::subscribed_books::vocabulary::person}与{@bt_b|::subscribed_books::vocabulary::person}战成平手。"
"{@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} were enemies now." = "如今{@bt_a|::subscribed_books::vocabulary::person}与{@bt_b|::subscribed_books::vocabulary::person}已是仇敌。"
"{@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} had fallen in love." = "{@bt_a|::subscribed_books::vocabulary::person}与{@bt_b|::subscribed_books::vocabulary::person}相爱了。"
"{@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} became friends." = "{@bt_a|::subscribed_books::vocabulary::person}与{@bt_b|::subscribed_books::vocabulary::person}成了朋友。"
"Whatever had been between {@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} was broken." = "无论{@bt_a|::subscribed_books::vocabulary::person}与{@bt_b|::subscribed_books::vocabulary::person}之间曾有怎样的联系，如今都已破裂。"
"{@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} made their peace." = "{@bt_a|::subscribed_books::vocabulary::person}与{@bt_b|::subscribed_books::vocabulary::person}和解了。"
# Gift nouns come from the finite item pool. A permissive capture would also
# consume "gave the same account..." and the dialogue that follows it.
"{@bt_a|::subscribed_books::vocabulary::person} gave {@bt_b|::subscribed_books::vocabulary::person} {::subscribed_books::world::item}." = "{@bt_a|::subscribed_books::vocabulary::person}送给{@bt_b|::subscribed_books::vocabulary::person}{::subscribed_books::world::item}。"
"{@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} talked." = "{@bt_a|::subscribed_books::vocabulary::person}与{@bt_b|::subscribed_books::vocabulary::person}交谈了。"
"{@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} argued." = "{@bt_a|::subscribed_books::vocabulary::person}与{@bt_b|::subscribed_books::vocabulary::person}争吵了。"
"The {beat} went as it was meant to." = "{beat}如预期般展开。"
"The {beat} went another way." = "{beat}走向了另一种结果。"
"{beat}: {purpose}." = "{beat}：{purpose}。"

