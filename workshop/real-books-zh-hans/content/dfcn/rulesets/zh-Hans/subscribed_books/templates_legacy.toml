"A encyclopedia for everyone! No prior knowledge required. Just curiosity and a love of good stories." = "一本适合所有人的百科全书！不需要任何已有知识。只需好奇心，以及对精彩故事的热爱。"
"{@bt_evsite|::subscribed_books::vocabulary::place}, founded in {@bt_year|::subscribed_books::vocabulary::birth_year}, was not a isolated event but a consequence of {@bt_entity|::subscribed_books::vocabulary::entity}'s broader trajectory." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年{@bt_evsite|::subscribed_books::vocabulary::place}的建立并非孤立事件，而是{@bt_entity|::subscribed_books::vocabulary::entity}整体发展轨迹的结果。"
"A investigation into the origins of words in the language of {@bt_entity|::subscribed_books::vocabulary::entity}. By {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}." = "对{@bt_entity|::subscribed_books::vocabulary::entity}语言中词语起源的研究。作者：{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}。"
"This etymological study is a beginning, not a end. The language of {@bt_entity|::subscribed_books::vocabulary::entity} continues to evolve. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "本词源研究是开端，而非终点。{@bt_entity|::subscribed_books::vocabulary::entity}的语言仍在演变。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
