base = "subscribed_books::comparative"

[[rulesets]]
[rulesets.rules]
"Two names, spoken in the same breath, yet standing for opposite things: {person} and {person2}." = "两个名字同时被人提起，却代表着截然相反的事物：{person} 与 {person2}。"
"This work examines what set them against each other." = "本书考察了是什么让他们相互对立。"
"History rarely produces a single champion without also producing a rival." = "历史很少只造就一位英雄，而不同时造就一位对手。"
"{@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} were locked in a contest that defined an age." = "{@bt_a|::subscribed_books::vocabulary::person} 与 {@bt_b|::subscribed_books::vocabulary::person} 深陷一场定义了整个时代的竞争。"
"The {adj} rivalry between {person} and {person2} is one of the defining conflicts of their era." = "{person} 与 {person2} 之间{adj}竞争，是定义那个时代的冲突之一。"
"Born in {@bt_birth1|::subscribed_books::vocabulary::birth_year} and {@bt_birth2|::subscribed_books::vocabulary::birth_year} respectively, these two {race} figures carved opposing paths through the history of {@bt_entity|::subscribed_books::vocabulary::entity}." = "这两位 {race} 人物分别生于 {@bt_birth1|::subscribed_books::vocabulary::birth_year}与 {@bt_birth2|::subscribed_books::vocabulary::birth_year}，在 {@bt_entity|::subscribed_books::vocabulary::entity} 的历史中开辟了相互对立的道路。"
"Their relationship was one of {relation}." = "他们的关系是{relation}。"
"So stood {@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person}, two poles of a single axis, each defined as much by the other as by {pos} own deeds." = "{@bt_a|::subscribed_books::vocabulary::person} 与 {@bt_b|::subscribed_books::vocabulary::person} 就像同一轴线的两极，彼此的存在与各自的功业同样定义着他们。"
"This comparative biography traces their intertwined fates." = "这部比较传记追溯着他们相互交织的命运。"
"In {@year}, the rivalry intensified." = "{@year} 年，竞争愈发激烈。"
"The year {@year} brought {@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} into conflict once more." = "{@year} 年，{@bt_a|::subscribed_books::vocabulary::person} 与 {@bt_b|::subscribed_books::vocabulary::person} 再次发生冲突。"
"By {@year}, the tension between {person} and {person2} had become a fault line running through all of {@bt_entity|::subscribed_books::vocabulary::entity}." = "到 {@year} 年，{person} 与 {person2} 之间的紧张关系，已经成为贯穿整个 {@bt_entity|::subscribed_books::vocabulary::entity} 的断层。"
"{@bt_a|::subscribed_books::vocabulary::person} fell in {@year} by {cause}." = "{@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年死于{cause}。"
"{@bt_b|::subscribed_books::vocabulary::person} received the news in silence." = "{@bt_b|::subscribed_books::vocabulary::person} 默默地接到了消息。"
"What {pro} felt, none can say." = "{pro}有何感受，无人能说清。"
"The death of {@bt_a|::subscribed_books::vocabulary::person} in {@year} left {@bt_b|::subscribed_books::vocabulary::person} without a rival." = "{@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年的死亡，使 {@bt_b|::subscribed_books::vocabulary::person} 失去了对手。"
"Some say it diminished {obj} more than any defeat could." = "有人说，这对{obj}的打击超过了任何失败。"
"When {cause} claimed {@bt_a|::subscribed_books::vocabulary::person} in {@year}, the rivalry ended -- not with a final contest, but with the {adj} silence of an unanswered challenge." = "{cause} 于 {@year} 年夺去 {@bt_a|::subscribed_books::vocabulary::person} 的生命时，竞争结束了；结束于无人回应的挑战所留下的{adj}沉默，而非最后一场较量。"
"{person} was, at last, alone." = "{person} 终于只剩孤身一人。"
"{@bt_a|::subscribed_books::vocabulary::person} was named {role} in {@year}." = "{@year} 年，{@bt_a|::subscribed_books::vocabulary::person} 被任命为{role}。"
"{@bt_b|::subscribed_books::vocabulary::person} seethed." = "{@bt_b|::subscribed_books::vocabulary::person} 怒火中烧。"
"In {@year}, {@bt_a|::subscribed_books::vocabulary::person} rose to {role}, widening the gap between the two rivals." = "{@year} 年，{@bt_a|::subscribed_books::vocabulary::person} 升任{role}，进一步拉大了两位对手间的差距。"
"{@bt_b|::subscribed_books::vocabulary::person} could only watch." = "{@bt_b|::subscribed_books::vocabulary::person} 只能在旁观看。"
"In {@year}, both {@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} continued their {adj} contest for supremacy." = "{@year} 年，{@bt_a|::subscribed_books::vocabulary::person} 和 {@bt_b|::subscribed_books::vocabulary::person} 继续着{adj}争霸。"
"Neither would yield." = "谁也不肯退让。"
"The rivalry burned on." = "竞争的火焰继续燃烧。"
"And so the two pressed forward, each measuring {pos} worth against the other." = "两人于是继续前行，各自用对方来衡量自己的价值。"
"In the end, the rivalry between {@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} was the forge upon which both were shaped." = "最终，{@bt_a|::subscribed_books::vocabulary::person} 与 {@bt_b|::subscribed_books::vocabulary::person} 之间的竞争，成为了铸造两人的熔炉。"
"{person} and {person2}: rivals to the last." = "{person} 与 {person2}：至死仍为对手。"
"History remembers them both, as each would have demanded." = "历史记住了他们两人，正如他们各自所要求的那样。"
"The comparative biography of {@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} reveals a {adj} truth: that greatness, more often than not, requires an adversary." = "{@bt_a|::subscribed_books::vocabulary::person} 与 {@bt_b|::subscribed_books::vocabulary::person} 的比较传记揭示了一个{adj}真理：伟大往往需要一个对手。"
"They were each other's crucible, and the world was shaped by their fire." = "他们互为坩埚，而世界被他们的火焰塑造。"
"Two lives, separated by circumstance, united by an uncanny symmetry." = "两个生命被境遇分开，却被不可思议的对称联系在一起。"
"{person} and {person2} walked parallel paths without knowing it." = "{person} 与 {person2} 走着平行的道路，自己却未曾知晓。"
"History sometimes echoes." = "历史有时会产生回声。"
"The lives of {@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} resonate with one another in ways neither could have imagined." = "{@bt_a|::subscribed_books::vocabulary::person} 与 {@bt_b|::subscribed_books::vocabulary::person} 的人生，以他们都未曾想象的方式相互共鸣。"
"The {adj} parallels between {person}, born in {@bt_birth1|::subscribed_books::vocabulary::birth_year}, and {person2}, born in {@bt_birth2|::subscribed_books::vocabulary::birth_year}, are too striking to be coincidence and too improbable to be design." = "生于 {@bt_birth1|::subscribed_books::vocabulary::birth_year}的 {person} 与生于 {@bt_birth2|::subscribed_books::vocabulary::birth_year}的 {person2} 之间，那些{adj}相似之处太惊人，难以视为巧合；又太不可思议，难以视为安排。"
"This work traces the mirror-image lives of two {race} souls." = "本书追溯了两个 {race} 灵魂如镜像般的人生。"
"In {@year}, both lives took a similar turn." = "{@year} 年，两人的人生发生了相似的转折。"
"The year {@year} reveals another parallel." = "{@year} 年，又一处相似之处显现了。"
"{@bt_a|::subscribed_books::vocabulary::person} was claimed by {cause} in {@year}." = "{@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年死于{cause}。"
"{@bt_b|::subscribed_books::vocabulary::person} had faced something eerily similar." = "{@bt_b|::subscribed_books::vocabulary::person} 曾面对过令人不安地相似的事情。"
"The death of {@bt_a|::subscribed_books::vocabulary::person} in {@year} mirrored losses {@bt_b|::subscribed_books::vocabulary::person} had also endured." = "{@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年的死亡，映照了 {@bt_b|::subscribed_books::vocabulary::person} 也曾承受的失去。"
"{@bt_b|::subscribed_books::vocabulary::person} had walked a remarkably similar path." = "{@bt_b|::subscribed_books::vocabulary::person} 曾走过极其相似的道路。"
"In {@year}, the {adj} pattern continued: two lives, one echo." = "{@year} 年，{adj}规律继续：两个生命，同一道回响。"
"The symmetry holds." = "对称依然成立。"
"The mirror does not lie." = "镜子不会说谎。"
"Two lives." = "两个生命。"
"One pattern." = "同一个规律。"
"The comparative biography of {@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} is a meditation on the strange geometry of fate." = "{@bt_a|::subscribed_books::vocabulary::person} 与 {@bt_b|::subscribed_books::vocabulary::person} 的比较传记，是对命运奇异几何的一场沉思。"
"Whether by chance or by some deeper {adj} design, {@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} lived the same story in different keys." = "无论出于巧合，还是某种更深的{adj}安排，{@bt_a|::subscribed_books::vocabulary::person} 与 {@bt_b|::subscribed_books::vocabulary::person} 都以不同的调性，活过了同一个故事。"
"This work does not explain the symmetry." = "本书没有解释这种对称。"
"It merely records it, and marvels." = "它只是记录，并为之惊叹。"
"{person} and {person2}: one taught, the other learned." = "{person} 与 {person2}：一人教授，一人学习。"
"The relationship between them shaped both lives." = "两人的关系塑造了双方的人生。"
"Every great figure owes a debt to a mentor." = "每位伟大人物都欠导师一份恩情。"
"For {@bt_b|::subscribed_books::vocabulary::person}, that mentor was {@bt_a|::subscribed_books::vocabulary::person}." = "对 {@bt_b|::subscribed_books::vocabulary::person} 而言，这位导师就是 {@bt_a|::subscribed_books::vocabulary::person}。"
"This work examines what passed between them." = "本书考察了两人之间传承的事物。"
"The {adj} bond between teacher and student is among the most consequential in any civilization." = "在任何文明中，师徒间{adj}纽带都具有极其深远的影响。"
"{person} and {person2} exemplify this truth." = "{person} 与 {person2} 正是这一真理的例证。"
"Their relationship -- one of {relation} -- shaped not only their lives but the world around them." = "他们的{relation}关系，不仅塑造了彼此的人生，也塑造了周围的世界。"
"In {@year}, the lessons deepened." = "{@year} 年，教益更加深厚。"
"The year {@year} tested what {@bt_b|::subscribed_books::vocabulary::person} had learned." = "{@year} 年考验了 {@bt_b|::subscribed_books::vocabulary::person} 所学的一切。"
"{@bt_b|::subscribed_books::vocabulary::person} carried the lessons forward alone." = "{@bt_b|::subscribed_books::vocabulary::person} 独自将这些教益传承下去。"
"When {cause} took {@bt_a|::subscribed_books::vocabulary::person} in {@year}, {person} realized that some lessons can only be learned through loss." = "{cause} 于 {@year} 年夺去 {@bt_a|::subscribed_books::vocabulary::person} 的生命时，{person} 明白，有些教训只有在失去中才能领悟。"
"{@bt_b|::subscribed_books::vocabulary::person} watched, and learned." = "{@bt_b|::subscribed_books::vocabulary::person} 观察，并学习。"
"In {@year}, {@bt_a|::subscribed_books::vocabulary::person} imparted wisdom, and {@bt_b|::subscribed_books::vocabulary::person} absorbed it -- in {pos} own {adj} way." = "{@year} 年，{@bt_a|::subscribed_books::vocabulary::person} 传授智慧，{@bt_b|::subscribed_books::vocabulary::person} 则以自己{adj}方式吸收。"
"The student grew." = "学生成长了。"
"The teacher's influence endured." = "老师的影响长存。"
"The legacy of {@bt_a|::subscribed_books::vocabulary::person} lives on through {@bt_b|::subscribed_books::vocabulary::person}." = "{@bt_a|::subscribed_books::vocabulary::person} 的精神通过 {@bt_b|::subscribed_books::vocabulary::person} 延续。"
"That is the highest praise any teacher can receive." = "这是任何老师所能得到的最高赞誉。"
"What {person} gave to {person2} was not knowledge alone, but the {adj} capacity to exceed the teacher." = "{person} 给予 {person2} 的不仅是知识，还有超越老师的{adj}能力。"
"This comparative biography is, in the end, a story about what endures." = "这部比较传记最终讲述的，是那些长存之物。"
"Light and shadow." = "光与影。"
"{person} and {person2} stood on opposite sides of the moral divide." = "{person} 与 {person2} 站在道德鸿沟相对的两侧。"
"One built." = "一人建设。"
"The other destroyed." = "另一人毁灭。"
"This is the story of {@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person}, and the chasm between them." = "这是 {@bt_a|::subscribed_books::vocabulary::person} 与 {@bt_b|::subscribed_books::vocabulary::person} 的故事，以及两人之间的深渊。"
"Every age produces its heroes and its villains." = "每个时代都会产生自己的英雄与恶徒。"
"The {adj} contrast between {person} and {person2} is the defining moral drama of their time." = "{person} 与 {person2} 之间{adj}对比，是定义他们时代的道德戏剧。"
"This biography holds them up to the light and lets the reader judge." = "这部传记将两人置于光下，让读者评判。"
"In {@year}, the contrast between them sharpened." = "{@year} 年，两人之间的对比更加鲜明。"
"The year {@year} made the difference between the two unmistakable." = "{@year} 年使两人的区别无可误认。"
"{@bt_b|::subscribed_books::vocabulary::person} was suspected, but never proven guilty." = "{@bt_b|::subscribed_books::vocabulary::person} 受到怀疑，却从未被证实有罪。"
"The death of {person} in {@year} was a victory for darkness." = "{person} 于 {@year} 年的死亡，是黑暗的一次胜利。"
"{@bt_b|::subscribed_books::vocabulary::person} said nothing." = "{@bt_b|::subscribed_books::vocabulary::person} 什么也没有说。"
"{@bt_b|::subscribed_books::vocabulary::person} plotted in the shadows." = "{@bt_b|::subscribed_books::vocabulary::person} 在阴影中谋划。"
"In {@year}, {@bt_a|::subscribed_books::vocabulary::person} strove for {adj} good while {@bt_b|::subscribed_books::vocabulary::person} pursued {pos} own ends." = "{@year} 年，{@bt_a|::subscribed_books::vocabulary::person} 为{adj}善而奋斗，{@bt_b|::subscribed_books::vocabulary::person} 则追逐自己的目的。"
"The struggle between virtue and villainy continued." = "美德与邪恶之间的斗争仍在继续。"
"History has rendered its verdict on {@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person}." = "历史已经对 {@bt_a|::subscribed_books::vocabulary::person} 与 {@bt_b|::subscribed_books::vocabulary::person} 作出裁决。"
"But history, like justice, is never truly final." = "但历史如同正义，永远不会真正终结。"
"The comparative biography of {person} and {person2} is a {adj} parable about the choices that define us." = "{person} 与 {person2} 的比较传记，是一则{adj}寓言，讲述定义我们的那些选择。"
"One chose light." = "一人选择了光。"
"One chose shadow." = "一人选择了影。"
"The world bore the consequences of both." = "世界承受了两种选择的后果。"
"Bound not by blood, but by something deeper: {person} and {person2} shared a {adj} kinship of the soul." = "两人被比血缘更深的事物连接：{person} 与 {person2} 共享着{adj}灵魂之亲。"
"Some bonds defy explanation." = "有些纽带无法解释。"
"The connection between {@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} was one such mystery." = "{@bt_a|::subscribed_books::vocabulary::person} 与 {@bt_b|::subscribed_books::vocabulary::person} 之间的联系，正是这样的谜。"
"There are those who meet and recognize in each other something familiar, something ancient." = "有些人相遇时，便从彼此身上认出了某种熟悉、古老的东西。"
"{person} and {person2} were kindred spirits in the truest sense: their relationship -- one of {relation} -- transcended circumstance to touch something {adj} and eternal." = "{person} 与 {person2} 是真正的知己：他们的{relation}关系超越境遇，触及某种{adj}永恒之物。"
"In {@year}, their bond deepened." = "{@year} 年，他们的纽带更加深厚。"
"The year {@year} tested their friendship and found it {adj}." = "{@year} 年考验了他们的友谊，证明它是{adj}。"
"The death of {@bt_a|::subscribed_books::vocabulary::person} in {@year} left {@bt_b|::subscribed_books::vocabulary::person} bereft." = "{@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年的死亡，使 {@bt_b|::subscribed_books::vocabulary::person} 悲痛欲绝。"
"{cause} had stolen something irreplaceable." = "{cause} 夺走了无可替代的东西。"
"{@bt_b|::subscribed_books::vocabulary::person} was never quite the same afterward." = "此后，{@bt_b|::subscribed_books::vocabulary::person} 再也无法回到从前。"
"{@bt_a|::subscribed_books::vocabulary::person} became {role} in {@year}, with {@bt_b|::subscribed_books::vocabulary::person}'s full-hearted support." = "{@year} 年，{@bt_a|::subscribed_books::vocabulary::person} 成为{role}，得到了 {@bt_b|::subscribed_books::vocabulary::person} 全心的支持。"
"In {@year}, {@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} continued to walk their shared {adj} path." = "{@year} 年，{@bt_a|::subscribed_books::vocabulary::person} 与 {@bt_b|::subscribed_books::vocabulary::person} 继续走着共同的{adj}道路。"
"Together, they were more than the sum of their parts." = "两人在一起，远胜过各自之和。"
"The bond between {@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} endures in memory, a testament to what kindred spirits can achieve." = "{@bt_a|::subscribed_books::vocabulary::person} 与 {@bt_b|::subscribed_books::vocabulary::person} 的纽带在记忆中长存，见证着知己所能成就的一切。"
"This comparative biography of {person} and {person2} is, beneath its scholarly surface, a {adj} love letter to friendship itself." = "{person} 与 {person2} 的比较传记，在学术外表之下，是一封写给友谊本身的{adj}情书。"

