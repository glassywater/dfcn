"{@bt_a|::subscribed_books::vocabulary::person} helped, but {pos1} movements carried the resignation of someone who knew that accidents were just the universe reminding you it did not care." = "{@bt_a|::subscribed_books::vocabulary::person}伸手帮忙，但{pos1}动作带着认命般的无奈，仿佛早已知道意外只是天地在提醒你，它并不在乎。"
"{@bt_a|::subscribed_books::vocabulary::person} fought grimly, without joy or hatred -- only the heavy knowledge that violence solved nothing, and yet here {pro1} was." = "{@bt_a|::subscribed_books::vocabulary::person}沉着脸战斗，没有喜悦，也没有憎恨，只有沉重的认知：暴力什么也解决不了，可{pro1}仍置身其中。"

