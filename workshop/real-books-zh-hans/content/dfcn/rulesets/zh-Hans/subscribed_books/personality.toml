"{@bt_a|::subscribed_books::vocabulary::person} did not fight to survive. {pro1} fought to make {@bt_b|::subscribed_books::vocabulary::person} regret surviving this far." = "{@bt_a|::subscribed_books::vocabulary::person}战斗不是为了生存。{pro1}要让{@bt_b|::subscribed_books::vocabulary::person}后悔活到现在。"
"{@bt_a|::subscribed_books::vocabulary::person} left {@bt_b|::subscribed_books::vocabulary::person} just barely able to stand, because a fight that ended too quickly wasn't worth having." = "{@bt_a|::subscribed_books::vocabulary::person}让{@bt_b|::subscribed_books::vocabulary::person}勉强还能站着，因为结束得太快的战斗，根本不值得打。"
"{@bt_a|::subscribed_books::vocabulary::person} laughed, once, when {@bt_b|::subscribed_books::vocabulary::person} cried out. It was not an accident that {pro1} laughed." = "{@bt_b|::subscribed_books::vocabulary::person}惨叫时，{@bt_a|::subscribed_books::vocabulary::person}笑了一声。{pro1}的笑，绝非偶然。"
"{@bt_a|::subscribed_books::vocabulary::person} aimed for the wound {@bt_b|::subscribed_books::vocabulary::person} already had. It seemed a shame to waste one." = "{@bt_a|::subscribed_books::vocabulary::person}瞄准{@bt_b|::subscribed_books::vocabulary::person}已有的伤口。浪费现成的伤口，似乎太可惜了。"
"{@bt_a|::subscribed_books::vocabulary::person} took {pos1} time with {@bt_b|::subscribed_books::vocabulary::person}, savoring each moment the way other people savored a meal." = "{@bt_a|::subscribed_books::vocabulary::person}面对{@bt_b|::subscribed_books::vocabulary::person}，按{pos1}节奏慢慢来，像别人品尝美食一样，品味每一刻。"
