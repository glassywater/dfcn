base = "items::grown"

# Grown descriptions name the source plant, rather than a crafted wood
# material. Match the entire native material phrase before the item noun.
# Item designation glyphs remain owned by items' designation replacer.
[[rulesets]]
[rulesets.rules]
"grown {body}{::items::$number}" = "{body}{::items::$number}"
"grown {::items::grown::material}{::items::$number}" = "{::items::grown::material}长出的木材{::items::$number}"

[[rulesets]]
name = "body"
[rulesets.rules]
# This exact production is also bound to separate native trade material
# and item fields, whose source text does not carry the grown prefix.
"{::items::grown::material} {::items::main}" = "{::items::grown::material}长出的{::items::main}"
"{::items::prefix::maybe_equipment_size}{::items::prefix::equipment_modifier} {::items::grown::material} {::items::main}" = "{::items::grown::material}长出的{::items::prefix::maybe_equipment_size}{::items::prefix::equipment_modifier}{::items::main}"
"{::items::trapcomp::^prefix}{::items::grown::material} {::items::trapcomp}" = "{::items::grown::material}长出的{::items::trapcomp::^prefix}{::items::trapcomp}"
"{::items::pants::^prefix}{::items::prefix::maybe_equipment_size}{::items::pants::^length}{::items::grown::material} {::items::pants}" = "{::items::grown::material}长出的{::items::prefix::maybe_equipment_size}{::items::pants::^length}{::items::pants}"
"{::items::armor::plural::^0}{::items::prefix::maybe_equipment_size}{::items::grown::material} {::items::armor::main}" = "{::items::grown::material}长出的{::items::prefix::maybe_equipment_size}{::items::armor::main}"

[[rulesets]]
name = "material"
[rulesets.rules]
