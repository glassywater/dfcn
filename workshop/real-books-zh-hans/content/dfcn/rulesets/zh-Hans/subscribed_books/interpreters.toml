"In {year1}, {@bt_hero|::subscribed_books::interpreters::person} assumed the identity of {@bt_target|::subscribed_books::interpreters::person}. The impersonation was deliberate, sustained, and executed with a precision that suggested long planning. To become someone else -- to wear their name, their history, their face in the eyes of others -- was a act of either brilliance or desperation." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}冒用了{@bt_target|::subscribed_books::interpreters::person}的身份。这场冒充蓄意而持久，实施得极为精准，显然经过了长期谋划。成为另一个人——在他人眼中披上对方的名字、经历和面容——这样的行为，若非聪明绝顶，便是绝望至极。"
"The transformation was not a accident of nature. It was {@bt_transformer|::subscribed_books::interpreters::person} who wielded the power that remade {@bt_hero|::subscribed_books::interpreters::person}. Whether it was a curse, a punishment, or something the victim had sought, the effect was the same: the person who had existed before was gone." = "这场变化并非自然的偶然。是{@bt_transformer|::subscribed_books::interpreters::person}运用力量，重塑了{@bt_hero|::subscribed_books::interpreters::person}。无论是诅咒、惩罚，还是受害者自己寻求的结果，效果都一样：先前存在的那个人，已然消失。"
