# fiction_plot.lua：十二种剧情前提与结局；保留作者的完整段落。
base = "subscribed_books::plot_premises"

[[rulesets]]
[rulesets.rules]
# stolen_relic：失窃圣物。
"{@bt_foe|::subscribed_books::vocabulary::person} came to {@bt_place|::subscribed_books::vocabulary::place} as a guest and left as a thief, carrying the {::subscribed_books::plot_vocabulary::object} out of the shrine of {@bt_deity|::subscribed_books::world::deity} in the dark." = "{@bt_foe|::subscribed_books::vocabulary::person} 来到 {@bt_place|::subscribed_books::vocabulary::place} 时还是客人，离去时却成了窃贼，趁着夜色从 {@bt_deity|::subscribed_books::world::deity} 的神殿里偷走了{::subscribed_books::plot_vocabulary::object}。"
"The {::subscribed_books::plot_vocabulary::object} came home to {@bt_place|::subscribed_books::vocabulary::place} at last, and the shrine of {@bt_deity|::subscribed_books::world::deity} was whole again. {@bt_foe|::subscribed_books::vocabulary::person} would steal nothing more." = "{::subscribed_books::plot_vocabulary::object} 终于回到了 {@bt_place|::subscribed_books::vocabulary::place}，{@bt_deity|::subscribed_books::world::deity} 的神殿也重归完整。{@bt_foe|::subscribed_books::vocabulary::person} 再也偷不了任何东西了。"
"The {::subscribed_books::plot_vocabulary::object} never came home. Somewhere past {@bt_far_place|::subscribed_books::vocabulary::place} it is still where {@bt_foe|::subscribed_books::vocabulary::person} put it, and the shrine of {@bt_deity|::subscribed_books::world::deity} at {@bt_place|::subscribed_books::vocabulary::place} stands empty." = "{::subscribed_books::plot_vocabulary::object} 再也没有回来。在 {@bt_far_place|::subscribed_books::vocabulary::place} 之外的某个地方，它仍放在 {@bt_foe|::subscribed_books::vocabulary::person} 留下它的原处，而 {@bt_place|::subscribed_books::vocabulary::place} 的 {@bt_deity|::subscribed_books::world::deity} 神殿依旧空空荡荡。"
"Neither {@bt_hero|::subscribed_books::vocabulary::person} nor {@bt_foe|::subscribed_books::vocabulary::person} lived to hold the {::subscribed_books::plot_vocabulary::object}. Whoever found it afterwards found a thing without its story, which is the saddest way for a relic to end." = "{@bt_hero|::subscribed_books::vocabulary::person} 和 {@bt_foe|::subscribed_books::vocabulary::person} 都没能活到将{::subscribed_books::plot_vocabulary::object}握在手中的那一天。后来无论是谁找到它，找到的都只是一个失去了自身故事的物件，而这正是一件圣物最悲哀的结局。"
"Whether the {::subscribed_books::plot_vocabulary::object} ever reached {@bt_place|::subscribed_books::vocabulary::place} again, the tellers do not agree. They agree only that {@bt_hero|::subscribed_books::vocabulary::person} never stopped looking for it." = "{::subscribed_books::plot_vocabulary::object} 究竟有没有再次回到 {@bt_place|::subscribed_books::vocabulary::place}，讲述者们各执一词。他们唯一认同的是，{@bt_hero|::subscribed_books::vocabulary::person} 从未停止寻找它。"
"{@bt_foe|::subscribed_books::vocabulary::person} was beaten, and the {::subscribed_books::plot_vocabulary::object} came home to {@bt_place|::subscribed_books::vocabulary::place} in {@bt_hero|::subscribed_books::vocabulary::person}'s own hands. The shrine of {@bt_deity|::subscribed_books::world::deity} was whole again." = "{@bt_foe|::subscribed_books::vocabulary::person} 败下阵来，{@bt_hero|::subscribed_books::vocabulary::person} 亲手将{::subscribed_books::plot_vocabulary::object}带回了 {@bt_place|::subscribed_books::vocabulary::place}。{@bt_deity|::subscribed_books::world::deity} 的神殿重归完整。"
"{@bt_foe|::subscribed_books::vocabulary::person} kept the {::subscribed_books::plot_vocabulary::object}. {@bt_hero|::subscribed_books::vocabulary::person} came home to {@bt_place|::subscribed_books::vocabulary::place} empty-handed and alive, which some called the better half of the bargain and {@bt_hero2|::subscribed_books::vocabulary::person} never did." = "{@bt_foe|::subscribed_books::vocabulary::person} 留下了{::subscribed_books::plot_vocabulary::object}。{@bt_hero|::subscribed_books::vocabulary::person} 两手空空，却活着回到了 {@bt_place|::subscribed_books::vocabulary::place}；有人说这才是那笔交易中更划算的一半，{@bt_hero2|::subscribed_books::vocabulary::person} 却从不这样想。"

# lost_kin：失踪亲人。
"{@bt_victim|::subscribed_books::vocabulary::person}, {@bt_hero|::subscribed_books::vocabulary::person}'s {::subscribed_books::plot_vocabulary::relation}, went with {@bt_foe|::subscribed_books::vocabulary::person} to {@bt_far_place|::subscribed_books::vocabulary::place} and did not come back. {@bt_foe2|::subscribed_books::vocabulary::person} came back alone, with a story that changed a little every time it was told." = "{@bt_hero|::subscribed_books::vocabulary::person} 的{::subscribed_books::plot_vocabulary::relation} {@bt_victim|::subscribed_books::vocabulary::person} 跟随 {@bt_foe|::subscribed_books::vocabulary::person} 前往 {@bt_far_place|::subscribed_books::vocabulary::place} 后便再也没有回来。{@bt_foe2|::subscribed_books::vocabulary::person} 独自归来，带回了一个每次讲述都会略有变化的说法。"
"The truth of what happened to {@bt_victim|::subscribed_books::vocabulary::person} came out at last, and {@bt_foe|::subscribed_books::vocabulary::person} would tell no more stories about it." = "{@bt_victim|::subscribed_books::vocabulary::person} 遭遇的真相终于大白，而 {@bt_foe|::subscribed_books::vocabulary::person} 再也无法为此编造故事了。"
"{@bt_victim|::subscribed_books::vocabulary::person} was never found, and {@bt_foe|::subscribed_books::vocabulary::person} kept the truth to the end. {@bt_hero|::subscribed_books::vocabulary::person}'s family still sets a place at the table, out of habit more than hope." = "{@bt_victim|::subscribed_books::vocabulary::person} 始终下落不明，{@bt_foe|::subscribed_books::vocabulary::person} 至死都守着真相。{@bt_hero|::subscribed_books::vocabulary::person} 的家人仍会在餐桌上留出一个座位，与其说是怀着希望，不如说是出于习惯。"
"{@bt_hero|::subscribed_books::vocabulary::person} and {@bt_foe|::subscribed_books::vocabulary::person} both died before the truth about {@bt_victim|::subscribed_books::vocabulary::person} came out. It is out there still, at {@bt_far_place|::subscribed_books::vocabulary::place}, waiting for someone who knows where to look." = "{@bt_victim|::subscribed_books::vocabulary::person} 的真相尚未揭晓，{@bt_hero|::subscribed_books::vocabulary::person} 和 {@bt_foe|::subscribed_books::vocabulary::person} 就都死了。真相依然在远方的 {@bt_far_place|::subscribed_books::vocabulary::place}，等待着知道该去何处寻找的人。"
"{@bt_foe|::subscribed_books::vocabulary::person} still tells the same story about {@bt_victim|::subscribed_books::vocabulary::person}, and {@bt_hero|::subscribed_books::vocabulary::person} still does not believe a word of it." = "{@bt_foe|::subscribed_books::vocabulary::person} 对 {@bt_victim|::subscribed_books::vocabulary::person} 的遭遇仍是那一套说辞，{@bt_hero|::subscribed_books::vocabulary::person} 也依然一个字都不信。"
"Cornered at last, {@bt_foe|::subscribed_books::vocabulary::person} told the truth about {@bt_victim|::subscribed_books::vocabulary::person}, all of it. It was a hard truth, and it ended the not knowing." = "终于走投无路时，{@bt_foe|::subscribed_books::vocabulary::person} 说出了关于 {@bt_victim|::subscribed_books::vocabulary::person} 的全部真相。那真相令人难以承受，却终结了茫然无知的煎熬。"
"{@bt_foe|::subscribed_books::vocabulary::person} walked away with the truth about {@bt_victim|::subscribed_books::vocabulary::person} still untold, and {@bt_hero|::subscribed_books::vocabulary::person} let it go, because the alternative was to go after it alone." = "{@bt_foe|::subscribed_books::vocabulary::person} 离去时，仍未说出关于 {@bt_victim|::subscribed_books::vocabulary::person} 的真相。{@bt_hero|::subscribed_books::vocabulary::person} 就此放手，因为另一条路，是独自追寻下去。"

# murdered_kin：为亲人复仇。
"{@bt_foe|::subscribed_books::vocabulary::person} killed {@bt_victim|::subscribed_books::vocabulary::person}, {@bt_hero|::subscribed_books::vocabulary::person}'s {::subscribed_books::plot_vocabulary::relation}, on the road outside {@bt_place|::subscribed_books::vocabulary::place}, and walked away from it with no mark against the name {@bt_foe2|::subscribed_books::vocabulary::person}." = "{@bt_foe|::subscribed_books::vocabulary::person} 在 {@bt_place|::subscribed_books::vocabulary::place} 外的路上杀死了 {@bt_hero|::subscribed_books::vocabulary::person} 的{::subscribed_books::plot_vocabulary::relation} {@bt_victim|::subscribed_books::vocabulary::person}，随后扬长而去，{@bt_foe2|::subscribed_books::vocabulary::person} 这个名字却未因此蒙上丝毫污点。"
"{@bt_foe|::subscribed_books::vocabulary::person} was dead, and the debt for {@bt_victim|::subscribed_books::vocabulary::person} was paid in full. Paying it did not bring {@bt_victim2|::subscribed_books::vocabulary::person} back, which every avenger learns and none believe until after." = "{@bt_foe|::subscribed_books::vocabulary::person} 死了，欠 {@bt_victim|::subscribed_books::vocabulary::person} 的血债也已偿清。然而，还清血债并不能让 {@bt_victim2|::subscribed_books::vocabulary::person} 复生。每个复仇者都会明白这一点，却没有谁在事成之前真正相信。"
"{@bt_foe|::subscribed_books::vocabulary::person} outlived the vengeance. {@bt_victim|::subscribed_books::vocabulary::person} went unavenged, and so, in the end, did those who tried." = "复仇落幕，{@bt_foe|::subscribed_books::vocabulary::person} 却仍活着。{@bt_victim|::subscribed_books::vocabulary::person} 的仇无人得报，最终，那些试图复仇的人也落得同样的下场。"
"The quarrel over {@bt_victim|::subscribed_books::vocabulary::person} ended the way such quarrels usually do: with no one left on either side to carry it." = "围绕 {@bt_victim|::subscribed_books::vocabulary::person} 的仇怨，以这类仇怨惯常的方式收场：双方都再没有人活着将它延续下去。"
"{@bt_foe|::subscribed_books::vocabulary::person} still lives, and the debt for {@bt_victim|::subscribed_books::vocabulary::person} still stands. Some debts are carried rather than paid." = "{@bt_foe|::subscribed_books::vocabulary::person} 依然活着，欠 {@bt_victim|::subscribed_books::vocabulary::person} 的血债也仍未偿还。有些债只能背负，无法偿清。"
"{@bt_foe|::subscribed_books::vocabulary::person} lived, beaten and disgraced, and admitted to {@bt_victim|::subscribed_books::vocabulary::person}'s death before all of {@bt_place|::subscribed_books::vocabulary::place}. It was not the ending {@bt_hero|::subscribed_books::vocabulary::person} had sworn to. It may have been a better one." = "{@bt_foe|::subscribed_books::vocabulary::person} 活了下来，却一败涂地、名誉扫地，并在 {@bt_place|::subscribed_books::vocabulary::place} 所有人面前承认了杀害 {@bt_victim|::subscribed_books::vocabulary::person} 的罪行。这并不是 {@bt_hero|::subscribed_books::vocabulary::person} 曾发誓要达成的结局。也许，这反而是更好的结局。"
"{@bt_foe|::subscribed_books::vocabulary::person} beat {@bt_hero|::subscribed_books::vocabulary::person} and walked away. The debt for {@bt_victim|::subscribed_books::vocabulary::person} stands to this day, and {@bt_hero2|::subscribed_books::vocabulary::person} carries it." = "{@bt_foe|::subscribed_books::vocabulary::person} 击败了 {@bt_hero|::subscribed_books::vocabulary::person}，扬长而去。欠 {@bt_victim|::subscribed_books::vocabulary::person} 的血债至今未偿，仍由 {@bt_hero2|::subscribed_books::vocabulary::person} 背负着。"

# stolen_birthright：被夺的家业。
"{@bt_foe|::subscribed_books::vocabulary::person} took the hall at {@bt_place|::subscribed_books::vocabulary::place} from {@bt_hero|::subscribed_books::vocabulary::person}'s family with a forged claim and a bought judge, and {@bt_hero2|::subscribed_books::vocabulary::person} grew up within sight of a home that belonged to someone else." = "{@bt_foe|::subscribed_books::vocabulary::person} 凭着伪造的权属凭据和收买的法官，从 {@bt_hero|::subscribed_books::vocabulary::person} 的家族手中夺走了 {@bt_place|::subscribed_books::vocabulary::place} 的宅邸。{@bt_hero2|::subscribed_books::vocabulary::person} 就这样长大，眼前的故居却早已属于别人。"
"The hall at {@bt_place|::subscribed_books::vocabulary::place} belonged to {@bt_hero|::subscribed_books::vocabulary::person}'s family again. The forged claim was burned in its own hearth, and {@bt_foe|::subscribed_books::vocabulary::person} was not there to watch." = "{@bt_place|::subscribed_books::vocabulary::place} 的宅邸重新属于了 {@bt_hero|::subscribed_books::vocabulary::person} 的家族。伪造的权属凭据在宅邸自己的壁炉中化为灰烬，{@bt_foe|::subscribed_books::vocabulary::person} 却再也无法亲眼见证。"
"{@bt_foe|::subscribed_books::vocabulary::person} kept the hall at {@bt_place|::subscribed_books::vocabulary::place}, and the forged claim hardened, as such things do, into history." = "{@bt_foe|::subscribed_books::vocabulary::person} 保住了 {@bt_place|::subscribed_books::vocabulary::place} 的宅邸，而那份伪造的权属凭据，也像这类东西惯常的命运一样，渐渐凝固成了历史。"
"The hall at {@bt_place|::subscribed_books::vocabulary::place} passed to strangers in the end. Neither claim survived the people who made it." = "{@bt_place|::subscribed_books::vocabulary::place} 的宅邸最终落入了陌生人手中。争夺它的双方死去后，彼此的权利主张也随之消散。"
"The hall at {@bt_place|::subscribed_books::vocabulary::place} is still in dispute. Every winter the case is heard again, and every winter it is not decided." = "{@bt_place|::subscribed_books::vocabulary::place} 的宅邸归属至今仍有争议。每年冬天，这桩案子都会重新开审；每年冬天，也都没有定论。"
"The forged claim came apart in front of the judges, and {@bt_foe|::subscribed_books::vocabulary::person} was driven out of the hall at {@bt_place|::subscribed_books::vocabulary::place} with nothing but the clothes on {@bt_foe2|::subscribed_books::vocabulary::person}'s back." = "伪造的权属凭据在法官面前被彻底揭穿，{@bt_foe|::subscribed_books::vocabulary::person} 被赶出了 {@bt_place|::subscribed_books::vocabulary::place} 的宅邸；除了身上的衣服，{@bt_foe2|::subscribed_books::vocabulary::person} 什么也没能带走。"
"{@bt_foe|::subscribed_books::vocabulary::person} held the hall at {@bt_place|::subscribed_books::vocabulary::place}, and {@bt_hero|::subscribed_books::vocabulary::person} stood at its gate one last time before turning away for good." = "{@bt_foe|::subscribed_books::vocabulary::person} 守住了 {@bt_place|::subscribed_books::vocabulary::place} 的宅邸。{@bt_hero|::subscribed_books::vocabulary::person} 最后一次站在宅邸门前，随后转身离去，再也没有回来。"

# ambition：权位野心。
"{@bt_hero|::subscribed_books::vocabulary::person} wanted the seat of {@bt_office|::subscribed_books::plot_vocabulary::office} at {@bt_place|::subscribed_books::vocabulary::place} more than anything in the world. Only {@bt_foe|::subscribed_books::vocabulary::person} stood in the way -- {@bt_foe2|::subscribed_books::vocabulary::person}, and the oldest {::subscribed_books::word_origins::law} of {@bt_place2|::subscribed_books::vocabulary::place}, which said the seat could not be taken, only given." = "对 {@bt_hero|::subscribed_books::vocabulary::person} 来说，世上再没有什么比 {@bt_place|::subscribed_books::vocabulary::place} 的{@bt_office|::subscribed_books::plot_vocabulary::office}之位更值得渴求。挡在前面的只有 {@bt_foe|::subscribed_books::vocabulary::person}——{@bt_foe2|::subscribed_books::vocabulary::person}，以及 {@bt_place2|::subscribed_books::vocabulary::place} 最古老的{::subscribed_books::word_origins::law}：这个位置只能授予，不能强取。"
"{@bt_hero|::subscribed_books::vocabulary::person} had the seat of {@bt_office|::subscribed_books::plot_vocabulary::office} at last, and found it had been paid for with everything that made it worth having." = "{@bt_hero|::subscribed_books::vocabulary::person} 终于坐上了{@bt_office|::subscribed_books::plot_vocabulary::office}之位，却发现为此付出的代价，恰恰是让这个位置值得拥有的一切。"
"The seat of {@bt_office|::subscribed_books::plot_vocabulary::office} went to {@bt_foe|::subscribed_books::vocabulary::person}, as perhaps it always would have. The reach had exceeded the grasp, and the fall was all the longer for it." = "{@bt_office|::subscribed_books::plot_vocabulary::office}之位归了 {@bt_foe|::subscribed_books::vocabulary::person}，也许本就注定如此。野心越过了能力所及之处，因此跌落得也更深。"
"The seat of {@bt_office|::subscribed_books::plot_vocabulary::office} stood empty when it was over. Those who came after sat in it carefully, and remembered why." = "一切结束时，{@bt_office|::subscribed_books::plot_vocabulary::office}之位空无一人。后继者坐上这个位置时无不小心翼翼，也始终记得其中的缘由。"
"The seat of {@bt_office|::subscribed_books::plot_vocabulary::office} is still contested, and the law of {@bt_place|::subscribed_books::vocabulary::place} still says it cannot be taken. Both sides are still trying." = "{@bt_office|::subscribed_books::plot_vocabulary::office}之位仍在争夺之中，{@bt_place|::subscribed_books::vocabulary::place} 的律法也仍说它不可强取。双方却都还在尝试。"
"{@bt_foe|::subscribed_books::vocabulary::person} yielded the seat of {@bt_office|::subscribed_books::plot_vocabulary::office}, and {@bt_hero|::subscribed_books::vocabulary::person} took it. Whether it was worth the taking, {@bt_hero2|::subscribed_books::vocabulary::person} would spend the rest of a long life deciding." = "{@bt_foe|::subscribed_books::vocabulary::person} 让出了{@bt_office|::subscribed_books::plot_vocabulary::office}之位，{@bt_hero|::subscribed_books::vocabulary::person} 接过了它。至于这是否值得，{@bt_hero2|::subscribed_books::vocabulary::person} 将用漫长的余生来寻找答案。"
"{@bt_foe|::subscribed_books::vocabulary::person} kept the seat of {@bt_office|::subscribed_books::plot_vocabulary::office}, and {@bt_hero|::subscribed_books::vocabulary::person} learned to live beneath it. Pride, it turns out, can be survived." = "{@bt_foe|::subscribed_books::vocabulary::person} 保住了{@bt_office|::subscribed_books::plot_vocabulary::office}之位，{@bt_hero|::subscribed_books::vocabulary::person} 则学会了在其治下生活。原来，即使骄傲受挫，人也能继续活下去。"

# forbidden_tome：禁忌典籍。
"In the vaults beneath {@bt_place|::subscribed_books::vocabulary::place} lay a {::subscribed_books::plot_vocabulary::object} that no one was to read. {@bt_hero|::subscribed_books::vocabulary::person} meant to read it. {@bt_foe|::subscribed_books::vocabulary::person} meant to stop {@bt_hero2|::subscribed_books::vocabulary::person} -- or to read it first." = "{@bt_place|::subscribed_books::vocabulary::place} 地下的密库中藏着一部{::subscribed_books::plot_vocabulary::object}，任何人都不得阅读。{@bt_hero|::subscribed_books::vocabulary::person} 决意要读。{@bt_foe|::subscribed_books::vocabulary::person} 则决意阻止 {@bt_hero2|::subscribed_books::vocabulary::person}——或者抢先读到它。"
"The {::subscribed_books::plot_vocabulary::object} was read, and {@bt_foe|::subscribed_books::vocabulary::person} was not there to see what it said. What it said is not written here, which is perhaps the point." = "{::subscribed_books::plot_vocabulary::object} 终究被人读了，而 {@bt_foe|::subscribed_books::vocabulary::person} 已无法亲眼看见其中的内容。至于里面写了什么，这里并未记载，也许这正是用意所在。"
"{@bt_foe|::subscribed_books::vocabulary::person} reached the {::subscribed_books::plot_vocabulary::object} first. Whatever it held, it belongs to {@bt_foe2|::subscribed_books::vocabulary::person} now, and the vaults beneath {@bt_place|::subscribed_books::vocabulary::place} are quieter than they were." = "{@bt_foe|::subscribed_books::vocabulary::person} 率先找到了{::subscribed_books::plot_vocabulary::object}。无论其中藏着什么，如今都属于 {@bt_foe2|::subscribed_books::vocabulary::person} 了，而 {@bt_place|::subscribed_books::vocabulary::place} 地下的密库比从前更加寂静。"
"The {::subscribed_books::plot_vocabulary::object} lies in the vaults beneath {@bt_place|::subscribed_books::vocabulary::place} still, unread. Two people died for it, which is twice the price it was worth." = "{::subscribed_books::plot_vocabulary::object} 仍静静躺在 {@bt_place|::subscribed_books::vocabulary::place} 地下的密库里，无人读过。两个人为它丧了命，这代价已是它所值的两倍。"
"The {::subscribed_books::plot_vocabulary::object} is still in the vaults. The seal is still on the door. For now." = "{::subscribed_books::plot_vocabulary::object} 仍在密库之中。门上的封印也还完好。至少目前如此。"
"{@bt_foe|::subscribed_books::vocabulary::person} was turned back at the vault door, and the {::subscribed_books::plot_vocabulary::object} was {@bt_hero|::subscribed_books::vocabulary::person}'s to read. What it said is not written here." = "{@bt_foe|::subscribed_books::vocabulary::person} 被挡在了密库门外，{::subscribed_books::plot_vocabulary::object} 则任由 {@bt_hero|::subscribed_books::vocabulary::person} 阅读。至于其中的内容，这里并未记载。"
"{@bt_foe|::subscribed_books::vocabulary::person} reached the {::subscribed_books::plot_vocabulary::object} first and sealed the vault behind. {@bt_hero|::subscribed_books::vocabulary::person} still dreams of the door." = "{@bt_foe|::subscribed_books::vocabulary::person} 率先找到了{::subscribed_books::plot_vocabulary::object}，随后封死了密库。{@bt_hero|::subscribed_books::vocabulary::person} 至今仍会梦见那扇门。"

# feud：世仇。
"{@bt_hero|::subscribed_books::vocabulary::person} and {@bt_ally|::subscribed_books::vocabulary::person} were born on opposite sides of a quarrel older than either of them: the houses of {@bt_place|::subscribed_books::vocabulary::place} and {@bt_far_place|::subscribed_books::vocabulary::place} had not spoken in a generation, and {@bt_foe|::subscribed_books::vocabulary::person} meant to keep it that way." = "{@bt_hero|::subscribed_books::vocabulary::person} 与 {@bt_ally|::subscribed_books::vocabulary::person} 生来便分属一场世仇的两方，那仇怨比他们的年岁都更久远：{@bt_place|::subscribed_books::vocabulary::place} 与 {@bt_far_place|::subscribed_books::vocabulary::place} 两家已经整整一代人不相往来，而 {@bt_foe|::subscribed_books::vocabulary::person} 决意让这种局面延续下去。"
"The feud died with {@bt_foe|::subscribed_books::vocabulary::person}. {@bt_hero|::subscribed_books::vocabulary::person} and {@bt_ally|::subscribed_books::vocabulary::person} were the first in a generation to cross between {@bt_place|::subscribed_books::vocabulary::place} and {@bt_far_place|::subscribed_books::vocabulary::place} by the front gate." = "世仇随着 {@bt_foe|::subscribed_books::vocabulary::person} 的死而终结。整整一代人以来，{@bt_hero|::subscribed_books::vocabulary::person} 和 {@bt_ally|::subscribed_books::vocabulary::person} 是最先能够堂堂正正走过正门，往来于 {@bt_place|::subscribed_books::vocabulary::place} 与 {@bt_far_place|::subscribed_books::vocabulary::place} 两家之间的人。"
"The feud outlived the people who tried to end it. {@bt_foe|::subscribed_books::vocabulary::person} saw to that." = "试图终结世仇的人都死了，世仇却仍在延续。{@bt_foe|::subscribed_books::vocabulary::person} 确保了这一点。"
"The feud between {@bt_place|::subscribed_books::vocabulary::place} and {@bt_far_place|::subscribed_books::vocabulary::place} ended at last, because there was no one left who cared to keep it." = "{@bt_place|::subscribed_books::vocabulary::place} 与 {@bt_far_place|::subscribed_books::vocabulary::place} 两家的世仇终于终结，因为再没有人愿意将它延续下去。"
"The houses of {@bt_place|::subscribed_books::vocabulary::place} and {@bt_far_place|::subscribed_books::vocabulary::place} still do not speak. {@bt_hero|::subscribed_books::vocabulary::person} and {@bt_ally|::subscribed_books::vocabulary::person} speak for them, quietly, when no one is listening." = "{@bt_place|::subscribed_books::vocabulary::place} 与 {@bt_far_place|::subscribed_books::vocabulary::place} 两家依旧不相往来。{@bt_hero|::subscribed_books::vocabulary::person} 和 {@bt_ally|::subscribed_books::vocabulary::person} 则在无人聆听的时候，悄悄替两家说着话。"
"{@bt_foe|::subscribed_books::vocabulary::person} gave up at last, too beaten to keep the old quarrel alive, and {@bt_hero|::subscribed_books::vocabulary::person} and {@bt_ally|::subscribed_books::vocabulary::person} crossed between {@bt_place|::subscribed_books::vocabulary::place} and {@bt_far_place|::subscribed_books::vocabulary::place} by the front gate." = "{@bt_foe|::subscribed_books::vocabulary::person} 终于放弃，惨败之后已无力延续旧日的仇怨。{@bt_hero|::subscribed_books::vocabulary::person} 和 {@bt_ally|::subscribed_books::vocabulary::person} 得以堂堂正正走过正门，往来于 {@bt_place|::subscribed_books::vocabulary::place} 与 {@bt_far_place|::subscribed_books::vocabulary::place} 两家之间。"
"{@bt_foe|::subscribed_books::vocabulary::person} won, and the feud went on. {@bt_hero|::subscribed_books::vocabulary::person} and {@bt_ally|::subscribed_books::vocabulary::person} learned to meet where no one would see them." = "{@bt_foe|::subscribed_books::vocabulary::person} 赢了，世仇仍在继续。{@bt_hero|::subscribed_books::vocabulary::person} 和 {@bt_ally|::subscribed_books::vocabulary::person} 学会了在无人看见的地方相会。"

# duty：誓约与责任。
"{@bt_hero|::subscribed_books::vocabulary::person} was sworn to the service of {@bt_place|::subscribed_books::vocabulary::place}, and the oath had no room in it for {@bt_ally|::subscribed_books::vocabulary::person}. {@bt_foe|::subscribed_books::vocabulary::person} held the oath, and would not hear of releasing it." = "{@bt_hero|::subscribed_books::vocabulary::person} 发誓效忠 {@bt_place|::subscribed_books::vocabulary::place}，而这份誓约容不下 {@bt_ally|::subscribed_books::vocabulary::person}。{@bt_foe|::subscribed_books::vocabulary::person} 掌握着誓约，绝不肯答应解除它。"
"The oath was released with the one who held it. {@bt_hero|::subscribed_books::vocabulary::person} left the service of {@bt_place|::subscribed_books::vocabulary::place} with clean hands and an open road." = "掌握誓约的人死去，誓约也随之解除。{@bt_hero|::subscribed_books::vocabulary::person} 问心无愧地结束了对 {@bt_place|::subscribed_books::vocabulary::place} 的效力，前路从此畅通无阻。"
"The oath held. {@bt_foe|::subscribed_books::vocabulary::person} saw to that, and {@bt_hero|::subscribed_books::vocabulary::person} served {@bt_place|::subscribed_books::vocabulary::place} to the end, as sworn." = "誓约始终有效。{@bt_foe|::subscribed_books::vocabulary::person} 确保了这一点，而 {@bt_hero|::subscribed_books::vocabulary::person} 也依照誓言，为 {@bt_place|::subscribed_books::vocabulary::place} 效力到了最后。"
"The oath ended with the people bound by it. {@bt_place|::subscribed_books::vocabulary::place} found others to swear, as it always does." = "受誓约束缚的人都死了，誓约也就此终结。{@bt_place|::subscribed_books::vocabulary::place} 找到了其他人宣誓，一如往常。"
"The oath still stands. So does {@bt_hero|::subscribed_books::vocabulary::person}'s hope of being released from it. Neither has given way." = "誓约依旧有效。{@bt_hero|::subscribed_books::vocabulary::person} 仍怀着摆脱它的希望。两者都不曾退让。"
"{@bt_foe|::subscribed_books::vocabulary::person} released the oath, grudgingly, and {@bt_hero|::subscribed_books::vocabulary::person} walked out of the service of {@bt_place|::subscribed_books::vocabulary::place} free." = "{@bt_foe|::subscribed_books::vocabulary::person} 不情不愿地解除了誓约，{@bt_hero|::subscribed_books::vocabulary::person} 就此结束对 {@bt_place|::subscribed_books::vocabulary::place} 的效力，自由地离去。"
"{@bt_foe|::subscribed_books::vocabulary::person} held {@bt_hero|::subscribed_books::vocabulary::person} to the oath, and {@bt_hero2|::subscribed_books::vocabulary::person} kept it. Some prisons are made of promises." = "{@bt_foe|::subscribed_books::vocabulary::person} 要求 {@bt_hero|::subscribed_books::vocabulary::person} 恪守誓约，而 {@bt_hero2|::subscribed_books::vocabulary::person} 确实遵守了。有些牢笼，是由承诺筑成的。"

# murder：谋杀疑云。
"{@bt_victim|::subscribed_books::vocabulary::person} was found dead in the cellars of {@bt_place|::subscribed_books::vocabulary::place}, and the watch called it an accident. {@bt_hero|::subscribed_books::vocabulary::person} did not." = "人们在 {@bt_place|::subscribed_books::vocabulary::place} 的地窖里发现了 {@bt_victim|::subscribed_books::vocabulary::person} 的尸体，卫队将此事认定为意外。{@bt_hero|::subscribed_books::vocabulary::person} 却不这样认为。"
"{@bt_foe|::subscribed_books::vocabulary::person} had killed {@bt_victim|::subscribed_books::vocabulary::person}. Now everyone knew it, and {@bt_foe2|::subscribed_books::vocabulary::person} would kill no one else." = "是 {@bt_foe|::subscribed_books::vocabulary::person} 杀害了 {@bt_victim|::subscribed_books::vocabulary::person}。如今人人都知道了，而 {@bt_foe2|::subscribed_books::vocabulary::person} 也再无法杀害任何人。"
"The watch still calls it an accident. {@bt_foe|::subscribed_books::vocabulary::person} still walks the streets of {@bt_place|::subscribed_books::vocabulary::place}. Some truths are found and not believed." = "卫队依然称那是一场意外。{@bt_foe|::subscribed_books::vocabulary::person} 仍在 {@bt_place|::subscribed_books::vocabulary::place} 的街头自在行走。有些真相即使被揭开，也无人相信。"
"The truth about {@bt_victim|::subscribed_books::vocabulary::person} died with the last two people who knew it." = "最后两个知情者死去，关于 {@bt_victim|::subscribed_books::vocabulary::person} 的真相也随之埋葬。"
"{@bt_hero|::subscribed_books::vocabulary::person} knows who killed {@bt_victim|::subscribed_books::vocabulary::person}. Knowing and proving are different things, and {@bt_foe|::subscribed_books::vocabulary::person} knows it too." = "{@bt_hero|::subscribed_books::vocabulary::person} 知道是谁杀害了 {@bt_victim|::subscribed_books::vocabulary::person}。但知道与证明是两回事，{@bt_foe|::subscribed_books::vocabulary::person} 也明白这一点。"
"{@bt_foe|::subscribed_books::vocabulary::person} had killed {@bt_victim|::subscribed_books::vocabulary::person}, and now all of {@bt_place|::subscribed_books::vocabulary::place} knew it. The watch, which had called it an accident, made the arrest itself." = "是 {@bt_foe|::subscribed_books::vocabulary::person} 杀害了 {@bt_victim|::subscribed_books::vocabulary::person}，如今整个 {@bt_place|::subscribed_books::vocabulary::place} 都知道了。曾将此事认定为意外的卫队，亲自逮捕了凶手。"
"{@bt_foe|::subscribed_books::vocabulary::person} was never charged. {@bt_hero|::subscribed_books::vocabulary::person} knows what happened to {@bt_victim|::subscribed_books::vocabulary::person}, and {@bt_foe2|::subscribed_books::vocabulary::person} knows that {@bt_hero2|::subscribed_books::vocabulary::person} knows, and they nod to each other in the street." = "{@bt_foe|::subscribed_books::vocabulary::person} 始终没有受到指控。{@bt_hero|::subscribed_books::vocabulary::person} 知道 {@bt_victim|::subscribed_books::vocabulary::person} 遭遇了什么，{@bt_foe2|::subscribed_books::vocabulary::person} 也知道 {@bt_hero2|::subscribed_books::vocabulary::person} 已经知情，而他们在街上相遇时，仍会向彼此点头致意。"

# theft：密库失窃。
"The {::subscribed_books::plot_vocabulary::object} vanished from the vault of {@bt_place|::subscribed_books::vocabulary::place} on a night when the door was locked and the guard was awake, and suspicion fell on everyone but the one who took it." = "某天夜里，门明明上了锁，守卫也没有睡着，{::subscribed_books::plot_vocabulary::object} 却从 {@bt_place|::subscribed_books::vocabulary::place} 的密库中消失了。人人都遭到了怀疑，唯独真正的窃贼没有。"
"The {::subscribed_books::plot_vocabulary::object} was back in the vault of {@bt_place|::subscribed_books::vocabulary::place}, and the hand that took it, {@bt_foe|::subscribed_books::vocabulary::person}'s, would take nothing more." = "{::subscribed_books::plot_vocabulary::object} 回到了 {@bt_place|::subscribed_books::vocabulary::place} 的密库里。曾偷走它的那只手，属于 {@bt_foe|::subscribed_books::vocabulary::person} 的手，再也偷不了任何东西。"
"The {::subscribed_books::plot_vocabulary::object} was never recovered, and {@bt_foe|::subscribed_books::vocabulary::person} was never accused. The vault of {@bt_place|::subscribed_books::vocabulary::place} has a new lock. It will not help." = "{::subscribed_books::plot_vocabulary::object} 始终没有找回，{@bt_foe|::subscribed_books::vocabulary::person} 也始终没有受到指控。{@bt_place|::subscribed_books::vocabulary::place} 的密库换了一把新锁。那也无济于事。"
"The {::subscribed_books::plot_vocabulary::object} turned up years later, in a dead thief's belongings. By then no one remembered why it had mattered." = "多年后，{::subscribed_books::plot_vocabulary::object} 出现在一个死去窃贼的遗物中。到那时，已经没有人记得它为何曾经如此重要。"
"The {::subscribed_books::plot_vocabulary::object} is still missing. {@bt_hero|::subscribed_books::vocabulary::person} knows where it went. {@bt_foe|::subscribed_books::vocabulary::person} knows that {@bt_hero2|::subscribed_books::vocabulary::person} knows." = "{::subscribed_books::plot_vocabulary::object} 依然下落不明。{@bt_hero|::subscribed_books::vocabulary::person} 知道它去了哪里。{@bt_foe|::subscribed_books::vocabulary::person} 也知道 {@bt_hero2|::subscribed_books::vocabulary::person} 已经知情。"
"The {::subscribed_books::plot_vocabulary::object} went back into the vault of {@bt_place|::subscribed_books::vocabulary::place}, and {@bt_foe|::subscribed_books::vocabulary::person} went into a cell beneath it." = "{::subscribed_books::plot_vocabulary::object} 回到了 {@bt_place|::subscribed_books::vocabulary::place} 的密库中，而 {@bt_foe|::subscribed_books::vocabulary::person} 则被关进了密库下方的牢房。"
"{@bt_foe|::subscribed_books::vocabulary::person} kept the {::subscribed_books::plot_vocabulary::object} and the good name both. {@bt_hero|::subscribed_books::vocabulary::person} keeps the truth, which pays nothing." = "{@bt_foe|::subscribed_books::vocabulary::person} 既留下了{::subscribed_books::plot_vocabulary::object}，也保住了好名声。{@bt_hero|::subscribed_books::vocabulary::person} 则守着真相，而真相换不来任何东西。"

# mistaken_identity：身份误认；相同的胜利／落败文本各保留一条。
"A clerk in {@bt_place|::subscribed_books::vocabulary::place} wrote down the wrong name, and so {@bt_hero|::subscribed_books::vocabulary::person} was taken for a famous {@bt_office|::subscribed_books::plot_vocabulary::office}. {@bt_foe|::subscribed_books::vocabulary::person} knew the truth, and meant to make a great deal of money from it." = "{@bt_place|::subscribed_books::vocabulary::place} 的一名书记员记错了名字，于是 {@bt_hero|::subscribed_books::vocabulary::person} 被当成了一位赫赫有名的{@bt_office|::subscribed_books::plot_vocabulary::office}。{@bt_foe|::subscribed_books::vocabulary::person} 知道真相，并打算借此大赚一笔。"
"The mistake was corrected at last, loudly and in public, and {@bt_foe|::subscribed_books::vocabulary::person}'s scheme went down with it." = "这场误会终于被当众大声澄清，{@bt_foe|::subscribed_books::vocabulary::person} 的阴谋也随之破产。"
"{@bt_foe|::subscribed_books::vocabulary::person} profited, the clerk was promoted, and {@bt_hero|::subscribed_books::vocabulary::person} is still answering to the wrong name." = "{@bt_foe|::subscribed_books::vocabulary::person} 得了利，书记员升了职，而 {@bt_hero|::subscribed_books::vocabulary::person} 至今仍在应着那个错误的名字。"
"In the end no one could say who had been who. The clerk in {@bt_place|::subscribed_books::vocabulary::place} wrote it all down anyway." = "到头来，谁也说不清谁究竟是谁。不过，{@bt_place|::subscribed_books::vocabulary::place} 的书记员还是把这一切全都记了下来。"
"The wrong name is still on the record in {@bt_place|::subscribed_books::vocabulary::place}. {@bt_hero|::subscribed_books::vocabulary::person} has, against all sense, grown used to it." = "{@bt_place|::subscribed_books::vocabulary::place} 的档案里仍记着那个错误的名字。说来也荒唐，{@bt_hero|::subscribed_books::vocabulary::person} 已经渐渐习惯了。"

# lost_item：遗失借物；相同的胜利文本保留一条。
"{@bt_foe|::subscribed_books::vocabulary::person} lent {@bt_hero|::subscribed_books::vocabulary::person} the {::subscribed_books::plot_vocabulary::object} with conditions attached, and {@bt_hero2|::subscribed_books::vocabulary::person} lost it within the week." = "{@bt_foe|::subscribed_books::vocabulary::person} 附带条件，将{::subscribed_books::plot_vocabulary::object}借给了 {@bt_hero|::subscribed_books::vocabulary::person}，可不到一个星期，{@bt_hero2|::subscribed_books::vocabulary::person} 就把它弄丢了。"
"The {::subscribed_books::plot_vocabulary::object} turned up, and {@bt_foe|::subscribed_books::vocabulary::person} never learned how close it had come. Some victories are best kept quiet." = "{::subscribed_books::plot_vocabulary::object} 找到了，{@bt_foe|::subscribed_books::vocabulary::person} 始终不知道险些出了多大的乱子。有些胜利，最好默默留在心里。"
"{@bt_foe|::subscribed_books::vocabulary::person} asked for the {::subscribed_books::plot_vocabulary::object} back on the worst possible day. The conditions, it turned out, had been written down." = "{@bt_foe|::subscribed_books::vocabulary::person} 偏偏在最糟糕的一天要求归还{::subscribed_books::plot_vocabulary::object}。原来，那些条件早已白纸黑字写了下来。"
"The {::subscribed_books::plot_vocabulary::object} outlasted both of them, which is the only thing it had ever been good at." = "两个人都已不在，{::subscribed_books::plot_vocabulary::object} 却依然完好。而长久留存，也是它唯一擅长的事。"
"The {::subscribed_books::plot_vocabulary::object} is still missing. {@bt_foe|::subscribed_books::vocabulary::person} has not asked yet. {@bt_hero|::subscribed_books::vocabulary::person} lives in hope." = "{::subscribed_books::plot_vocabulary::object} 依然下落不明。{@bt_foe|::subscribed_books::vocabulary::person} 还没来索要。{@bt_hero|::subscribed_books::vocabulary::person} 仍抱着一线希望过日子。"
"{@bt_foe|::subscribed_books::vocabulary::person} asked for the {::subscribed_books::plot_vocabulary::object} back on the worst possible day, and the conditions, it turned out, had been written down." = "{@bt_foe|::subscribed_books::vocabulary::person} 偏偏在最糟糕的一天要求归还{::subscribed_books::plot_vocabulary::object}，而那些条件，原来早已白纸黑字写了下来。"
