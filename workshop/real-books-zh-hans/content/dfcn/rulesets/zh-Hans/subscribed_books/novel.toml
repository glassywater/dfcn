base = "subscribed_books::novel"

[[rulesets]]
[rulesets.rules]
"The road stretched out before {person} like a promise and a threat." = "道路在 {person} 面前延伸，像一个承诺，也像一个威胁。"
"This is the saga of {pos} {adj} journey." = "这是{pos}{adj}旅程的传奇。"
"{@bt_a|::subscribed_books::vocabulary::person} left {@bt_site|::subscribed_books::vocabulary::place} with nothing but a name and a purpose." = "{@bt_a|::subscribed_books::vocabulary::person} 离开 {@bt_site|::subscribed_books::vocabulary::place} 时，除一个名字和一个目标之外，什么也没带。"
"What followed was an odyssey that would reshape the world." = "此后，一场将重塑世界的漫长旅程展开了。"
"Every great journey begins with a single step into the unknown." = "每次伟大旅程，都始于向未知迈出的第一步。"
"When {person} departed {@bt_site|::subscribed_books::vocabulary::place} in the year {@year}, {pro} carried nothing that could prepare {obj} for what lay ahead." = "当 {person} 于 {@year} 年离开 {@bt_site|::subscribed_books::vocabulary::place} 时，{pro}所带的一切，都不足以让{obj}准备好面对前路。"
"This novel chronicles the {adj} road from there to the end of the world and back." = "这部小说记述了那条{adj}道路：从这里到世界尽头，然后返回。"
"So began the odyssey of {person}, a {race} whose footsteps would trace a path across the map of history itself." = "{person} 的漫游由此开始，这位{race}的足迹将穿越历史的地图。"
"This is not merely a novel." = "这不仅仅是一部小说。"
"It is a cartography of the soul." = "它是一幅灵魂的地图。"
"The next stage of the journey began in {@year}." = "旅程的下一阶段始于 {@year} 年。"
"In {@year}, the road forked, and {@bt_a|::subscribed_books::vocabulary::person} chose." = "{@year} 年，道路分岔，{@bt_a|::subscribed_books::vocabulary::person} 做出了选择。"
"Chapter opens on {@year}." = "本章从 {@year} 年开始。"
"The landscape has changed." = "景观变了。"
"So has {@bt_a|::subscribed_books::vocabulary::person}." = "{@bt_a|::subscribed_books::vocabulary::person} 也变了。"
"The {adj} road does that to a person." = "{adj}道路，会让人变成这样。"
"{@bt_a|::subscribed_books::vocabulary::person} fell on the road in {@year}." = "{@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年倒在了路上。"
"The journey ended where no one expected." = "旅程在无人预料之处结束。"
"In {@year}, {cause} stopped {person} forever." = "{@year} 年，{cause} 永远阻止了 {person} 的脚步。"
"The {adj} road goes on without its traveler." = "{adj}道路失去了旅人，却继续延伸。"
"The epic journey of {@bt_a|::subscribed_books::vocabulary::person} ended in {@year} at {@bt_site|::subscribed_books::vocabulary::place}, where {cause} wrote the final chapter." = "{@bt_a|::subscribed_books::vocabulary::person} 的史诗旅程，于 {@year} 年在 {@bt_site|::subscribed_books::vocabulary::place} 结束，{cause} 写下了最后一章。"
"{pos} body remains, but {pos2} spirit -- the {adj} wandering spirit -- perhaps it walks the road still." = "{pos}身体留下了，但{pos2}灵魂——那{adj}漂泊灵魂——也许仍在道路上行走。"
"{@bt_a|::subscribed_books::vocabulary::person} came to {@bt_site|::subscribed_books::vocabulary::place} in {@year}." = "{@year} 年，{@bt_a|::subscribed_books::vocabulary::person} 来到了 {@bt_site|::subscribed_books::vocabulary::place}。"
"A new land." = "一片新土地。"
"A new chapter." = "一个新篇章。"
"Along the way, in {@year}, {@bt_a|::subscribed_books::vocabulary::person} forged {@bt_artifact|::subscribed_books::vocabulary::artifact}." = "在旅途中，{@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年锻造了 {@bt_artifact|::subscribed_books::vocabulary::artifact}。"
"It would prove {adj} in the trials to come." = "它将在今后的考验中证明自己的{adj}价值。"
"{@bt_a|::subscribed_books::vocabulary::person} joined {@bt_entity|::subscribed_books::vocabulary::entity} as {role} in {@year}." = "{@year} 年，{@bt_a|::subscribed_books::vocabulary::person} 以{role}的身份加入 {@bt_entity|::subscribed_books::vocabulary::entity}。"
"Even wanderers need a cause." = "即使流浪者，也需要为之奋斗的事业。"
"A pause in the long {adj} march." = "漫长{adj}行程中的一次停顿。"
"The year {@year} found {@bt_a|::subscribed_books::vocabulary::person} still moving, still searching, still refusing to stop." = "{@year} 年，{@bt_a|::subscribed_books::vocabulary::person} 仍在前进，仍在寻找，仍拒绝停下。"
"The journey continues." = "旅程继续。"
"It always continues." = "它一直继续。"
"The road does not wait." = "道路不会等待。"
"And so {@bt_a|::subscribed_books::vocabulary::person} pressed forward, into the {adj} unknown, carrying the weight of every mile already walked." = "{@bt_a|::subscribed_books::vocabulary::person} 于是背着已走过每一里路的重量，继续走入{adj}未知。"
"The journey of {person} is over." = "{person} 的旅程结束了。"
"The road remains, waiting for the next traveler." = "道路仍在，等待下一位旅人。"
"Every odyssey ends where it began: with a single soul standing at the edge of the {adj} unknown." = "每次漫游都结束在它开始之处：一个灵魂，站在{adj}未知的边缘。"
"{person} walked farther than most." = "{person} 比多数人走得更远。"
"The road remembers." = "道路记得。"
"In the halls of {@bt_entity|::subscribed_books::vocabulary::entity}, nothing is as it seems." = "在 {@bt_entity|::subscribed_books::vocabulary::entity} 的厅堂中，没有什么与表面一致。"
"This novel follows {person} through a web of {adj} deception." = "这部小说跟随 {person} 穿过一张{adj}欺骗之网。"
"Power." = "权力。"
"Betrayal." = "背叛。"
"The slow poison of ambition." = "野心的慢性毒药。"
"This is the story of {@bt_a|::subscribed_books::vocabulary::person} and the game played in the shadows of {@bt_site|::subscribed_books::vocabulary::place}." = "这是 {@bt_a|::subscribed_books::vocabulary::person} 的故事，也是 {@bt_site|::subscribed_books::vocabulary::place} 阴影中的权力游戏。"
"The {adj} corridors of power within {@bt_entity|::subscribed_books::vocabulary::entity} are narrow, lightless, and treacherous." = "{@bt_entity|::subscribed_books::vocabulary::entity} 内部{adj}权力走廊，狭窄、无光而险恶。"
"{person} entered them willingly, believing {pro} could navigate what others could not." = "{person} 自愿走入其中，相信{pro}能穿越其他人无法穿越的地方。"
"This novel is the account of how that belief was tested." = "这部小说记录了这份信念如何受到考验。"
"In {@year}, the intrigue deepened." = "{@year} 年，阴谋更加深重。"
"New alliances formed in {@year}." = "{@year} 年，新的联盟形成。"
"New betrayals followed." = "新的背叛接踵而至。"
"The year {@year} brought a {adj} reshuffling of loyalties within {@bt_entity|::subscribed_books::vocabulary::entity}." = "{@year} 年，{@bt_entity|::subscribed_books::vocabulary::entity} 内部的忠诚经历了一次{adj}重组。"
"{@bt_a|::subscribed_books::vocabulary::person} watched." = "{@bt_a|::subscribed_books::vocabulary::person} 观察着。"
"{@bt_a|::subscribed_books::vocabulary::person} waited." = "{@bt_a|::subscribed_books::vocabulary::person} 等待着。"
"{@bt_a|::subscribed_books::vocabulary::person} made {pos} move." = "{@bt_a|::subscribed_books::vocabulary::person} 采取了行动。"
"In {@year}, {@bt_a|::subscribed_books::vocabulary::person} was eliminated." = "{@year} 年，{@bt_a|::subscribed_books::vocabulary::person} 被除掉了。"
"The game has no mercy for the slow." = "这场游戏对迟钝之人毫无怜悯。"
"Officially: {cause}." = "官方说法：{cause}。"
"Unofficially: someone wanted {obj} gone." = "非官方说法：有人希望{obj}消失。"
"In {@year}, {@bt_a|::subscribed_books::vocabulary::person} claimed the title of {role}." = "{@year} 年，{@bt_a|::subscribed_books::vocabulary::person} 取得了{role}的头衔。"
"The other players took note." = "其他参与者注意到了。"
"A bold move." = "大胆的一步。"
"Perhaps too bold." = "也许太大胆了。"
"The year {@year} saw {@bt_a|::subscribed_books::vocabulary::person} maneuver through another {adj} round of the endless game." = "{@year} 年，{@bt_a|::subscribed_books::vocabulary::person} 在这场无尽游戏中又周旋了{adj}一轮。"
"Trust no one." = "不要信任任何人。"
"That was the only rule that mattered." = "这是唯一重要的规则。"
"The game goes on." = "游戏仍在继续。"
"It always goes on." = "它一直继续。"
"{person} was merely one player among many." = "{person} 只是众多参与者之一。"
"In the {adj} world of {@bt_entity|::subscribed_books::vocabulary::entity}'s politics, there are no winners -- only survivors." = "在 {@bt_entity|::subscribed_books::vocabulary::entity} {adj}政治世界中，没有胜者，只有幸存者。"
"This novel is a testament to the price of playing and the higher price of refusing to." = "这部小说见证了参与的代价，以及拒绝参与所要付出的更高代价。"
"War came to {@bt_site|::subscribed_books::vocabulary::place}, and {person} was in the thick of it." = "战争来到 {@bt_site|::subscribed_books::vocabulary::place}，{person} 深陷其中。"
"This novel tells of blood, iron, and the {adj} cost of survival." = "这部小说讲述鲜血、钢铁，以及生存的{adj}代价。"
"The drums of war beat across the lands of {@bt_entity|::subscribed_books::vocabulary::entity}." = "战鼓响遍 {@bt_entity|::subscribed_books::vocabulary::entity} 的土地。"
"{@bt_a|::subscribed_books::vocabulary::person} answered the call." = "{@bt_a|::subscribed_books::vocabulary::person} 响应了召唤。"
"War is the great simplifier." = "战争是一位伟大的简化者。"
"It strips away pretense and leaves only the {adj} essential: survive, or don't." = "它剥去伪装，只留下{adj}本质：活下来，或者死去。"
"{person}, {race} of {@bt_entity|::subscribed_books::vocabulary::entity}, discovered this truth firsthand." = "{@bt_entity|::subscribed_books::vocabulary::entity} 的{race} {person}，亲身发现了这个真理。"
"This novel is the record of that discovery." = "这部小说便是那次发现的记录。"
"In {@year}, the battle lines shifted." = "{@year} 年，战线发生变化。"
"The war entered a new phase in {@year}." = "{@year} 年，战争进入新阶段。"
"{@bt_a|::subscribed_books::vocabulary::person} fell in battle in {@year}." = "{@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年战死。"
"{pos} comrades carried {obj} from the field." = "{pos}战友将{obj}抬离战场。"
"The war claimed {person} in {@year}." = "战争于 {@year} 年夺去了 {person} 的生命。"
"One more name on a {adj} list that grew longer every day." = "那份每日加长的{adj}名单上，又多了一个名字。"
"{@bt_site|::subscribed_books::vocabulary::place} was established in {@year} as a forward position." = "{@bt_site|::subscribed_books::vocabulary::place} 于 {@year} 年作为前线据点建立。"
"The war reshaped the map." = "战争重绘了地图。"
"A weapon born of necessity and {adj} purpose." = "一件诞生于需求与{adj}目标的武器。"
"In {@year}, the war ground on." = "{@year} 年，战争继续消磨着一切。"
"That was all anyone could do." = "任何人所能做的，也只有这些。"
"The fighting paused." = "战斗暂歇。"
"It never stopped." = "但从未停止。"
"The war ended." = "战争结束了。"
"Or perhaps it just moved elsewhere." = "也许只是转移到了别处。"
"{person} survived." = "{person} 活了下来。"
"Surviving is not the same as winning." = "生存并不等于胜利。"
"This war chronicle of {person} is a {adj} record of what mortals endure when the world decides to tear itself apart." = "这部 {person} 的战争编年史，是一份{adj}记录，记下世界决定撕裂自身时，凡人所忍受的一切。"
"May we never need to write another one." = "愿我们永远不必再写一部。"
"This is a love story." = "这是一个爱情故事。"
"It does not end well." = "它的结局并不好。"
"They never do, not really." = "真正说来，这类故事从没有好结局。"
"It begins with {person} in {@bt_site|::subscribed_books::vocabulary::place}." = "它从身在 {@bt_site|::subscribed_books::vocabulary::place} 的 {person} 开始。"
"{@bt_a|::subscribed_books::vocabulary::person} loved {@bt_b|::subscribed_books::vocabulary::person}." = "{@bt_a|::subscribed_books::vocabulary::person} 爱着 {@bt_b|::subscribed_books::vocabulary::person}。"
"That is the beginning and the end." = "这便是开始，也是结尾。"
"Everything in between is the novel." = "两者之间的一切，便是小说。"
"The {adj} heart wants what it wants, and what it wants, more often than not, is something it cannot keep." = "{adj}心只想得到它所想要的，而它想要的，往往是无法留住的东西。"
"{person} learned this the hard way." = "{person} 以痛苦的方式学会了这一点。"
"This novel is the record of that education." = "这部小说记录了这场领悟。"
"In {@year}, the heart led where reason feared to follow." = "{@year} 年，心把人领向理智不敢跟随的地方。"
"The year {@year} brought {@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} closer." = "{@year} 年，{@bt_a|::subscribed_books::vocabulary::person} 与 {@bt_b|::subscribed_books::vocabulary::person} 更加亲近。"
"Or farther apart." = "也许更加疏远。"
"In love, it can be hard to tell." = "在爱情中，这很难分辨。"
"{@bt_a|::subscribed_books::vocabulary::person} lost {@bt_b|::subscribed_books::vocabulary::person} in {@year}." = "{@year} 年，{@bt_a|::subscribed_books::vocabulary::person} 失去了 {@bt_b|::subscribed_books::vocabulary::person}。"
"Some losses have no remedy and no lesson." = "有些失去既无法弥补，也没有教益。"
"They simply are." = "它们只是存在。"
"It was, in truth, a love letter in material form." = "实际上，那是一封有形的情书。"
"In {@year}, {@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} continued their {adj} dance of devotion and doubt." = "{@year} 年，{@bt_a|::subscribed_books::vocabulary::person} 与 {@bt_b|::subscribed_books::vocabulary::person} 继续着奉献与疑虑交织的{adj}舞蹈。"
"Love is patient." = "爱是耐心的。"
"Love is not always kind." = "爱却不总是仁慈。"
"The story of {@bt_a|::subscribed_books::vocabulary::person} and {@bt_b|::subscribed_books::vocabulary::person} is the oldest story there is." = "{@bt_a|::subscribed_books::vocabulary::person} 与 {@bt_b|::subscribed_books::vocabulary::person} 的故事，是世上最古老的故事。"
"It never gets easier to tell." = "它从未变得更容易讲述。"
"This novel of {person} and {@bt_b|::subscribed_books::vocabulary::person} is, in the end, a {adj} meditation on the impossibility of holding anything forever." = "这部关于 {person} 与 {@bt_b|::subscribed_books::vocabulary::person} 的小说，归根结底是一场{adj}沉思：没有什么能被永远留住。"
"We love." = "我们爱。"
"We lose." = "我们失去。"
"We love again." = "我们再次相爱。"
"The novel is in the \"again.\"" = "小说就在这“再次”之中。"
"{person} rose higher than any {race} of {@bt_entity|::subscribed_books::vocabulary::entity} had risen before." = "{person} 攀上了 {@bt_entity|::subscribed_books::vocabulary::entity} 任何{race}都未曾到达的高度。"
"And the fall, when it came, was absolute." = "而坠落到来时，也是彻底的。"
"Ambition built {@bt_a|::subscribed_books::vocabulary::person} a throne." = "野心为 {@bt_a|::subscribed_books::vocabulary::person} 建起了王座。"
"Pride knocked {obj} off it." = "骄傲又将{obj}从王座上推落。"
"This is the novel of {pos} {adj} arc." = "这部小说描绘了{pos}{adj}生命弧线。"
"The trajectory of {person} describes a perfect parabola: ascent, apex, descent." = "{person} 的轨迹是一条完美的抛物线：上升、顶点、下降。"
"This novel traces each phase with the {adj} precision of an astronomer charting a comet that will not return." = "这部小说以天文学者绘制永不归来之彗星轨迹的{adj}精确，追溯每个阶段。"
"In {@year}, {@bt_a|::subscribed_books::vocabulary::person} climbed higher still." = "{@year} 年，{@bt_a|::subscribed_books::vocabulary::person} 继续向更高处攀登。"
"The year {@year} marked the zenith." = "{@year} 年标志着顶峰。"
"Or perhaps it had already passed." = "也许顶峰早已过去。"
"{@bt_a|::subscribed_books::vocabulary::person} fell from grace and then from life in {@year}." = "{@year} 年，{@bt_a|::subscribed_books::vocabulary::person} 先失去眷顾，随后失去生命。"
"The arc was complete." = "生命的弧线完成了。"
"{pos} rise accelerated." = "{pos}上升加速了。"
"So did the forces that would undo {obj}." = "将摧毁{obj}的力量，也同样加速。"
"A {adj} monument to ambition at its peak." = "一座纪念巅峰野心的{adj}丰碑。"
"In {@year}, {@bt_a|::subscribed_books::vocabulary::person} continued to accumulate power, influence, and enemies." = "{@year} 年，{@bt_a|::subscribed_books::vocabulary::person} 继续积累权力、影响，以及敌人。"
"Higher and higher." = "越来越高。"
"The air thins." = "空气越来越稀薄。"
"The ground waits." = "大地在等待。"
"What goes up must come down." = "升上去的，终要落下来。"
"{person} is the proof." = "{person} 就是证据。"
"The {adj} novel of {person} is a parable older than civilization: that the same qualities which drive a soul upward are the ones that guarantee the fall." = "这部 {person} 的{adj}小说，是一则比文明更古老的寓言：推动灵魂上升的品质，也正是保证其坠落的品质。"

