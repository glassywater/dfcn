# 师徒与婚恋主题调用 life.bond_facts；portrait 仅取 trade/god/works/made。
# 人物、组织、作品和日期均为普通类型引用，不把未识别正文作为名称保留。
base = "subscribed_books::essay_bond_facts"

[[rulesets]]
[rulesets.rules]
"{actor} was {profession_article} of {entity}." = "{actor}当时是隶属于{entity}的一名{profession_article}。"
"{actor} was {profession_article}." = "{actor}当时是一名{profession_article}。"
"{actor} lived in {place} then, {site_kind} held by {entity}." = "{actor}当时住在{place}，那是由{entity}掌控的{site_kind}。"
"{actor} lived in {place} then, {site_kind}." = "{actor}当时住在{place}，那是{site_kind}。"

# 不带神职说明的信仰句沿用 essay_personal_facts；不带余数的著作句沿用 writing_facts。
"{actor} worshipped {deity}, god of {spheres}." = "{actor}信奉掌管{spheres}的神祇{deity}。"
"{actor} worshipped {deity}, goddess of {spheres}." = "{actor}信奉掌管{spheres}的女神{deity}。"
"{actor} wrote {book}, {about}, and {count} more." = "{actor}写过{book}，这是{about}；此外还写过{count}部作品。"
"{actor} wrote {book}, and {count} more." = "{actor}写过{book}，此外还写过{count}部作品。"
"{actor} made {artifact}, {item_kind}, in {year}." = "{actor}于{year}年制作了{artifact}，这是{item_kind}。"
"{actor} made {artifact}, in {year}." = "{actor}于{year}年制作了{artifact}。"

# 原生师徒事件的无地点句已在 career_facts；这里补地点和 life.lead 的师徒时间锚。
"{bond} {location}." = "{location}，{bond}。"
"In {date}, {bond} {location}." = "{date}{location}，{bond}。"
"In {date} {bond} {location}." = "{date}{location}，{bond}。"
"{lead} {bond} {location}." = "{lead}{location}，{bond}。"
"{lead} {::subscribed_books::essay_career_facts::sentence}" = "{lead}{::subscribed_books::essay_career_facts::sentence}"
"{actor} and {other} were bound as master and apprentice in {year}." = "{actor}与{other}于{year}年结为师徒。"
# 关系建立之后的写作仍复用已有完整创作事实，不连接任意书籍后文。
"{lead} {::subscribed_books::essay_writing_facts::record}" = "{lead}{::subscribed_books::essay_writing_facts::record}"
"{lead} {circumstance}, {::subscribed_books::essay_writing_facts::record}" = "{lead}{circumstance}，{::subscribed_books::essay_writing_facts::record}"

# bond_facts 的 other_fate 只传入另一位师父或学徒，故此处只接受这两种单人身份。
"{lead} {slayer} came to {place}, and killed {victim}." = "{lead}{slayer}来到{place}，杀死了{victim}。"
"{lead} {arrival} came to {place}, and {slayer} killed {victim}." = "{lead}{arrival}来到{place}，{slayer}杀死了{victim}。"
"{lead} {arrival} came to {place}, and {victim} died there." = "{lead}{arrival}来到{place}，{victim}死在了那里。"
"I have not forgiven {arrival}, and I will not." = "我至今没有原谅{arrival}，以后也不会。"
"I think of him still." = "我至今仍会想起他。"
"I think of her still." = "我至今仍会想起她。"
"I think of them still." = "我至今仍会想起他们。"
"Something of me went into the ground with him." = "我的一部分也随他一同入土了。"
"Something of me went into the ground with her." = "我的一部分也随她一同入土了。"
"Something of me went into the ground with them." = "我的一部分也随他们一同入土了。"

