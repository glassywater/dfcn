[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} could not maintain the pretense. The lie sat in {pos1} mouth like a stone, and eventually, {pro1} spat it out." = "{@bt_a|::subscribed_books::vocabulary::person}维持不了伪装。谎言像石头一样堵在{pos1}嘴里，最终，{pro1}把它吐了出来。"
