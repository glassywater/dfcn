"{@bt_a|::subscribed_books::vocabulary::person} enjoyed the battle the way most people enjoyed nothing at all -- completely, and without guilt." = "{@bt_a|::subscribed_books::vocabulary::person}享受战斗，享受得彻底而毫无愧疚，大多数人对任何事物都没有这样的享受。"
