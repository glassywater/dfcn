# Trait: liar.
[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} spoke with absolute conviction. Every word was a lie. The delivery was flawless." = "{@bt_a|::subscribed_books::vocabulary::person}说得绝对笃定。每个字都是谎言，表达却毫无破绽。"
