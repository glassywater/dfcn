# value_rant 从全部价值观中选择 high/low；仅接受对应的完整固定引语。
"{::subscribed_books::essay_value_sayings}" = "{::subscribed_books::essay_value_sayings}"

[[rulesets]]
name = "other_word"
[rulesets.rules]
"{::subscribed_books::vocabulary::relation}" = "{::subscribed_books::vocabulary::relation}"
"former master" = "昔日的师父"
