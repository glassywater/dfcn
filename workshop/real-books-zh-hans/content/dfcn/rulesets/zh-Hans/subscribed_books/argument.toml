base = "subscribed_books::argument"

[[rulesets]]
[rulesets.rules]
# templates.lua Essay: polemic, meditation, manifesto, critique, ode.
"Enough." = "够了。"
"The situation within {@bt_e|::subscribed_books::vocabulary::entity} has become intolerable, and someone must say so." = "{@bt_e|::subscribed_books::vocabulary::entity} 的状况已经令人无法忍受，必须有人直说。"
"I, {@bt_a|::subscribed_books::vocabulary::person}, will say it plainly." = "我，{@bt_a|::subscribed_books::vocabulary::person}，会直言不讳。"
"This essay is an argument, and I make no apology for its {adj} tone." = "这篇文章是一场争论，我不会为它{adj}的语气道歉。"
"What happened at {@bt_s|::subscribed_books::vocabulary::place} demands outrage, not analysis." = "{@bt_s|::subscribed_books::vocabulary::place} 发生的事，需要愤怒，而非分析。"
"The purpose of this essay is not to inform but to persuade." = "这篇文章的目的在于说服，而非告知。"
"I, {person}, write in {adj} anger, having witnessed firsthand the failures of {@bt_e|::subscribed_books::vocabulary::entity}." = "我，{person}，亲眼见证了 {@bt_e|::subscribed_books::vocabulary::entity} 的失败，怀着{adj}愤怒写下此文。"
"What follows is not balanced." = "下文不求平衡。"
"Balance is for scales." = "平衡是天平的事。"
"This is for conscience." = "这里谈的是良心。"
"Consider what happened in {@year}." = "想想 {@year} 年发生的事。"
"And another thing about {@year} --" = "还有，关于 {@year} 年——"
"The death of {@bt_a|::subscribed_books::vocabulary::person} in {@year} by {cause} is a scandal." = "{@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年因 {cause} 死亡，是一桩丑闻。"
"It should never have happened." = "这本不该发生。"
"When {@bt_a|::subscribed_books::vocabulary::person} was made {role} in {@year}, it was an insult to every competent soul in {@bt_e|::subscribed_books::vocabulary::entity}." = "{@year} 年任命 {@bt_a|::subscribed_books::vocabulary::person} 为{role}，是对 {@bt_e|::subscribed_books::vocabulary::entity} 每一位有才干者的侮辱。"
"The events of {@year} speak for themselves." = "{@year} 年的事件已经说明一切。"
"Or they should, if anyone were listening." = "至少，如果有人愿意听，就该如此。"
"I rest my case." = "我的陈述到此为止。"
"If this essay offends you, good." = "如果这篇文章冒犯了你，很好。"
"It was meant to." = "这正是我的本意。"
"This polemic is a {adj} brick thrown through the window of complacency." = "这篇论战文章，是砸向自满之窗的一块{adj}砖头。"
"If the glass shatters, perhaps some air will get in." = "如果玻璃碎了，也许就有空气进来。"
"I have been thinking about {@bt_s|::subscribed_books::vocabulary::place}." = "我一直在思索 {@bt_s|::subscribed_books::vocabulary::place}。"
"About what it means." = "思索它意味着什么。"
"About what we mean, here in the world." = "思索我们在这世间意味着什么。"
"I am {@bt_a|::subscribed_books::vocabulary::person}, and these are my reflections." = "我是 {@bt_a|::subscribed_books::vocabulary::person}，这些是我的思考。"
"Quiet thoughts on {adj} matters." = "关于{adj}事物的静默思考。"
"An essay by {person}." = "{person} 的文章。"
"The {adj} practice of contemplation is unfashionable in our age." = "{adj}沉思，在我们这个时代并不流行。"
"We prefer action, decision, movement." = "我们更喜欢行动、决断与奔走。"
"But I, {person}, believe there is value in stillness." = "但我，{person}，相信静止也有价值。"
"This essay is my attempt to sit with the unanswerable and see what emerges." = "这篇文章，是我尝试与无解之问静坐，看能浮现出什么。"
"Reflecting on {@year}..." = "回想 {@year} 年……"
"The death of {@bt_a|::subscribed_books::vocabulary::person} in {@year} invites us to consider what we value and why." = "{@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年去世，让我们思索自己珍视什么，以及原因。"
"What happened in {@year} is less important than what it reveals about us." = "{@year} 年发生了什么，远不及它揭示了我们什么来得重要。"
"These thoughts are incomplete." = "这些思考并不完整。"
"Perhaps all honest thoughts are." = "也许所有诚实的思考都如此。"
"I have no conclusion." = "我没有结论。"
"Only the {adj} suspicion that the questions matter more than the answers." = "只有一个{adj}猜想：问题比答案更重要。"
"We declare." = "我们宣告。"
"We demand." = "我们要求。"
"We are {@bt_e|::subscribed_books::vocabulary::entity}, and this manifesto sets forth what we believe and what we will no longer tolerate." = "我们是 {@bt_e|::subscribed_books::vocabulary::entity}，这份宣言阐明我们的信念，以及不再容忍的事情。"
"I, {person}, set forth the following {adj} principles." = "我，{person}，提出以下{adj}原则。"
"Let the world take notice." = "让全世界注意。"
"This manifesto is a declaration of {adj} purpose." = "这份宣言，宣告我们的{adj}目标。"
"I, {person}, write not for myself but for {@bt_e|::subscribed_books::vocabulary::entity}, whose values have been compromised and whose future demands a return to first principles." = "我，{person}，并非为自己而写，而是为 {@bt_e|::subscribed_books::vocabulary::entity} 而写；其价值已遭损害，其未来要求回归基本原则。"
"Principle concerning the events of {@year}:" = "关于 {@year} 年事件的原则："
"We declare that the death of {@bt_a|::subscribed_books::vocabulary::person} by {cause} in {@year} was a preventable tragedy." = "我们宣告：{@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年因 {cause} 死亡，是一场本可避免的悲剧。"
"Never again." = "绝不重演。"
"We affirm that leadership is a trust, not a privilege." = "我们确认，领导权是一份托付，而非特权。"
"The appointment of {@bt_a|::subscribed_books::vocabulary::person} as {role} in {@year} must serve the people." = "{@year} 年任命 {@bt_a|::subscribed_books::vocabulary::person} 为{role}，必须服务于人民。"
"We hold that the events of {@year} demand accountability." = "我们认为，{@year} 年的事件必须有人负责。"
"These principles are non-negotiable." = "这些原则不容妥协。"
"This manifesto is our covenant." = "这份宣言，是我们的盟约。"
"Break it at your peril." = "违背它，后果自负。"
"-- {person}, for {@bt_e|::subscribed_books::vocabulary::entity}" = "——{person}，代表 {@bt_e|::subscribed_books::vocabulary::entity}"
"A critical examination of recent events at {@bt_s|::subscribed_books::vocabulary::place}." = "对 {@bt_s|::subscribed_books::vocabulary::place} 近期事件的批判审视。"
"By {person}." = "作者：{person}。"
"This essay identifies {adj} failures in the conduct of {@bt_e|::subscribed_books::vocabulary::entity} and proposes corrections." = "本文指出 {@bt_e|::subscribed_books::vocabulary::entity} 行为中的{adj}失败，并提出纠正方案。"
"Examining the events of {@year}:" = "审视 {@year} 年的事件："
"The circumstances of {@bt_a|::subscribed_books::vocabulary::person}'s death in {@year} -- by {cause} -- reveal systemic failures within {@bt_e|::subscribed_books::vocabulary::entity}." = "{@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年因 {cause} 死亡的经过，揭示了 {@bt_e|::subscribed_books::vocabulary::entity} 的系统性失败。"
"The appointment of {@bt_a|::subscribed_books::vocabulary::person} as {role} in {@year} raises questions about {@bt_e|::subscribed_books::vocabulary::entity}'s selection criteria." = "{@year} 年任命 {@bt_a|::subscribed_books::vocabulary::person} 为{role}，使 {@bt_e|::subscribed_books::vocabulary::entity} 的选拔标准受到质疑。"
"Events of {@year} warrant critical scrutiny." = "{@year} 年的事件值得批判审视。"
"The analysis continues." = "分析仍在继续。"
"This critique is offered constructively." = "这份批评，出于建设性的目的。"
"Whether it is received that way is {@bt_e|::subscribed_books::vocabulary::entity}'s choice." = "是否如此接受它，由 {@bt_e|::subscribed_books::vocabulary::entity} 决定。"
"In praise of {@bt_s|::subscribed_books::vocabulary::place}." = "赞颂 {@bt_s|::subscribed_books::vocabulary::place}。"
"An essay by {person}, who loves this place more than words can say, and yet must try." = "{person} 的文章；对这片土地的热爱，语言无法尽述，却仍必须尝试。"
"This is an essay of admiration." = "这是一篇表达敬慕的文章。"
"{@bt_e|::subscribed_books::vocabulary::entity} has given the world so much." = "{@bt_e|::subscribed_books::vocabulary::entity} 给予世界如此之多。"
"Let me count the ways." = "让我一一细数。"
"What follows is not analysis but adoration." = "下文表达的是崇敬，而非分析。"
"I, {person}, have set {pos} pen to the {adj} task of expressing in words what {@bt_s|::subscribed_books::vocabulary::place} and {@bt_e|::subscribed_books::vocabulary::entity} mean to me." = "我，{person}，提起{pos}笔，开始这项{adj}工作：用语言表达 {@bt_s|::subscribed_books::vocabulary::place} 与 {@bt_e|::subscribed_books::vocabulary::entity} 对我的意义。"
"I will fail, as all who attempt to capture beauty in language must fail." = "我会失败，正如所有试图用语言捕捉美的人都必将失败。"
"But the attempt itself is a kind of worship." = "但尝试本身，便是一种礼拜。"
"Consider the {adj} gifts of the year {@year}." = "想想 {@year} 年带来的{adj}馈赠。"
"{@bt_a|::subscribed_books::vocabulary::person} created {@bt_i|::subscribed_books::vocabulary::artifact} in {@year}." = "{@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年创造了 {@bt_i|::subscribed_books::vocabulary::artifact}。"
"Is there any finer proof of the beauty {@bt_e|::subscribed_books::vocabulary::entity} is capable of?" = "还有什么比这更能证明 {@bt_e|::subscribed_books::vocabulary::entity} 所能创造的美？"
"In {@year}, {@bt_s|::subscribed_books::vocabulary::place} was founded." = "{@year} 年，{@bt_s|::subscribed_books::vocabulary::place} 建立了。"
"Another jewel in the {adj} crown of {@bt_e|::subscribed_books::vocabulary::entity}." = "这是 {@bt_e|::subscribed_books::vocabulary::entity} 的{adj}王冠上又一颗宝石。"
"In {@year}, {@bt_e|::subscribed_books::vocabulary::entity} gave the world another reason to be grateful." = "{@year} 年，{@bt_e|::subscribed_books::vocabulary::entity} 又给了世界一个感恩的理由。"
"There is so much to praise." = "值得赞颂的如此之多。"
"These pages are not enough." = "这些书页远远不够。"
"I praise {@bt_e|::subscribed_books::vocabulary::entity}." = "我赞颂 {@bt_e|::subscribed_books::vocabulary::entity}。"
"I praise {@bt_s|::subscribed_books::vocabulary::place}." = "我赞颂 {@bt_s|::subscribed_books::vocabulary::place}。"
"I praise the {adj} world that made them both." = "我赞颂创造它们的{adj}世界。"
"This ode is my offering." = "这篇颂文，是我的献礼。"
"{@bt_e|::subscribed_books::vocabulary::entity} deserves better than words, but words are all I have." = "{@bt_e|::subscribed_books::vocabulary::entity} 值得比话语更好的献礼，但话语是我拥有的一切。"
"May they serve as a {adj} monument to what I love." = "愿它们成为我所热爱事物的一座{adj}丰碑。"

# Dialog: all five perspectives, speaker labels captured by the main namespace.
"A DIALOG between {person} and a Questioner, concerning the nature of things." = "{person} 与一位问询者，探讨事物本质的对话。"
"Tell me, {@bt_a|::subscribed_books::vocabulary::person}, what is truth?" = "告诉我，{@bt_a|::subscribed_books::vocabulary::person}，什么是真理？"
"That is a {adj} question." = "那是个{adj}问题。"
"Let us find out together." = "让我们一起寻找答案。"
"A philosophical dialog." = "一场哲学对话。"
"{person} and a Student meet in {@bt_s|::subscribed_books::vocabulary::place}." = "{person} 与一位学生在 {@bt_s|::subscribed_books::vocabulary::place} 相会。"
"I have come to learn." = "我是来学习的。"
"Then you have come to the right place." = "那么你来对地方了。"
"Or the wrong one." = "也可能来错了。"
"We shall see." = "我们拭目以待。"
"A DIALOG ON FIRST PRINCIPLES" = "关于基本原则的对话"
"Participants: {person}, philosopher of {@bt_e|::subscribed_books::vocabulary::entity}; an unnamed Interlocutor." = "参与者：{person}，{@bt_e|::subscribed_books::vocabulary::entity} 的哲学家；一位无名对话者。"
"I am told you know the truth." = "听说你知道真理。"
"I know only that I do not know it." = "我只知道，我不知道真理。"
"That, I have found, is the {adj} beginning of all wisdom." = "我发现，这是所有智慧的{adj}开端。"
"What of {@year}?" = "{@year} 年又如何？"
"Ah." = "啊。"
"That is worth examining." = "那值得研究。"
"{@bt_a|::subscribed_books::vocabulary::person} died in {@year}." = "{@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年去世。"
"By {cause}." = "死于 {cause}。"
"What does that teach us?" = "这教会了我们什么？"
"That we are mortal." = "我们终有一死。"
"But you knew that already." = "但你本来就知道。"
"{@bt_a|::subscribed_books::vocabulary::person} became {role} in {@year}." = "{@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年成为{role}。"
"Is power a good thing?" = "权力是好事吗？"
"Power is a tool." = "权力是一件工具。"
"It is the hand that holds it that makes it {adj} or otherwise." = "使它变得{adj}或相反的，是握住它的手。"
"What happened in {@year}?" = "{@year} 年发生了什么？"
"Something worth thinking about." = "一些值得思考的事。"
"That is usually the case." = "通常都是如此。"
"I am beginning to see." = "我开始明白了。"
"Then we are making progress." = "那么我们有进步了。"
"Or at least, we are losing our ignorance." = "至少，我们正摆脱无知。"
"Have we found the truth?" = "我们找到真理了吗？"
"No." = "没有。"
"But we have found some better questions." = "但我们找到了更好的问题。"
"That will do for today." = "今天就到这里吧。"
"END OF DIALOG." = "对话结束。"
"Will we continue tomorrow?" = "明天我们还继续吗？"
"If we are wise, we will continue every day for the rest of our lives." = "若我们明智，就会在余生的每一天继续下去。"
"The {adj} examined life is the only one worth living." = "只有经过{adj}审视的人生，才值得度过。"
"A DEBATE between two thinkers of {@bt_e|::subscribed_books::vocabulary::entity}." = "{@bt_e|::subscribed_books::vocabulary::entity} 两位思想家的辩论。"
"The subject: the meaning of recent events at {@bt_s|::subscribed_books::vocabulary::place}." = "主题：{@bt_s|::subscribed_books::vocabulary::place} 近期事件的意义。"
"I maintain that what happened was just." = "我认为，发生的事情是公正的。"
"And I maintain that it was {adj} folly." = "而我认为，那是{adj}愚行。"
"A DIALOG OF OPPOSITION." = "一场意见相左的对话。"
"Two voices, one question." = "两种声音，一个问题。"
"{@bt_e|::subscribed_books::vocabulary::entity} did the right thing." = "{@bt_e|::subscribed_books::vocabulary::entity} 做对了。"
"{@bt_e|::subscribed_books::vocabulary::entity} did the {adj} wrong thing." = "{@bt_e|::subscribed_books::vocabulary::entity} 做了{adj}错事。"
"Prove me wrong." = "证明我错了。"
"Consider {@year}." = "想想 {@year} 年。"
"I have." = "我想过了。"
"My conclusion differs." = "我的结论不同。"
"The death of {@bt_a|::subscribed_books::vocabulary::person} in {@year} was tragic but necessary." = "{@bt_a|::subscribed_books::vocabulary::person} 在 {@year} 年死亡，虽是悲剧，却有其必要。"
"Necessary?" = "必要？"
"{cause} is never necessary." = "{cause} 从来都没有必要。"
"It is merely tolerated." = "它只是被容忍。"
"{@bt_a|::subscribed_books::vocabulary::person} as {role} was the correct choice." = "让 {@bt_a|::subscribed_books::vocabulary::person} 当{role}，是正确的选择。"
"{@bt_a|::subscribed_books::vocabulary::person} as {role} was the convenient choice." = "让 {@bt_a|::subscribed_books::vocabulary::person} 当{role}，只是方便的选择。"
"Those are rarely the same." = "两者很少相同。"
"The events of {@year} justify my position." = "{@year} 年的事件，证明我的立场正确。"
"The events of {@year} justify mine." = "{@year} 年的事件，证明的是我的立场。"
"Strange how facts work." = "事实的作用，真是奇妙。"
"The debate continues after a brief intermission." = "短暂休息后，辩论继续。"
"The debate is concluded." = "辩论结束。"
"The audience will render its own verdict." = "观众将作出自己的裁决。"
"END." = "终。"
"MASTER {person} receives a young student in {@bt_s|::subscribed_books::vocabulary::place}." = "大师 {person} 在 {@bt_s|::subscribed_books::vocabulary::place} 接见了一位年轻学生。"
"Master, teach me." = "师父，请教我。"
"Sit." = "坐下。"
"Listen." = "听着。"
"The lesson begins when you stop expecting it." = "当你不再期待课程开始时，课程就开始了。"
"A DIALOG OF INSTRUCTION." = "一场传授知识的对话。"
"Do you know why I brought you here to {@bt_s|::subscribed_books::vocabulary::place}?" = "你知道我为何带你来 {@bt_s|::subscribed_books::vocabulary::place} 吗？"
"To learn, master." = "为了学习，师父。"
"To unlearn." = "为了忘掉所学。"
"It is much harder." = "这要难得多。"
"What about {@year}, master?" = "那么 {@year} 年呢，师父？"
"(sighs) Pay attention." = "（叹气）留心听。"
"That is terrible." = "真是可怕。"
"It is." = "是的。"
"And there is a lesson in it, if you have the courage to find it." = "其中也有教训，只要你有勇气找寻。"
"When I became {role} in {@year}, I thought it was an honor." = "{@year} 年我成为{role}时，以为那是荣耀。"
"It wasn't?" = "难道不是？"
"It was a {adj} responsibility." = "那是{adj}责任。"
"They are not the same." = "两者并不相同。"
"In {@year}, I learned something I wish I had known earlier." = "{@year} 年，我学到了一件希望自己早些知道的事。"
"What?" = "什么？"
"That I didn't know enough." = "我知道得还不够。"
"I think I understand." = "我想我明白了。"
"If you think you understand, you don't." = "如果你觉得自己明白了，那就没有。"
"Keep trying." = "继续努力。"
"The lesson is over." = "课程结束了。"
"But I have more questions!" = "可我还有问题！"
"Good." = "很好。"
"That means it worked." = "这说明课程奏效了。"
"Speak, {@bt_a|::subscribed_books::vocabulary::person}." = "说吧，{@bt_a|::subscribed_books::vocabulary::person}。"
"Unburden yourself." = "放下心中的重担。"
"(pause) I have done things." = "（停顿）我做过一些事。"
"{adj} things." = "一些{adj}事。"
"A DIALOG OF CONFESSION." = "一场忏悔的对话。"
"{person} kneels before a Listener." = "{person} 跪在一位聆听者面前。"
"I do not know where to begin." = "我不知道从何说起。"
"Begin where it hurts most." = "从最痛苦的地方说起。"
"And in {@year}?" = "那 {@year} 年呢？"
"(hesitates) Yes." = "（犹豫）是的。"
"In {@year}..." = "在 {@year} 年……"
"I could have prevented it." = "我本可以阻止这一切。"
"Could you truly?" = "你真的可以吗？"
"I will never know." = "我永远无法知道。"
"That is the worst part." = "这才最折磨人。"
"In {@year}, I made a choice." = "{@year} 年，我作出了一个选择。"
"The wrong one." = "一个错误的选择。"
"And now?" = "那么现在呢？"
"And now I live with it." = "现在我背负着它继续生活。"
"Go on." = "继续说。"
"The truth has weight, but it lightens with the telling." = "真相很沉重，但说出来会轻一些。"
"Am I forgiven?" = "我得到宽恕了吗？"
"I cannot forgive you." = "我无法宽恕你。"
"Only you can do that." = "只有你自己可以。"
"You have spoken the {adj} truth." = "你说出了{adj}真相。"
"That is brave." = "这很勇敢。"
"It doesn't feel brave." = "我并不觉得勇敢。"
"It feels like bleeding." = "只觉得像在流血。"
"Healing often does." = "疗愈常常如此。"
"A TRIAL." = "一场审判。"
"{person} stands accused before the court of {@bt_e|::subscribed_books::vocabulary::entity}." = "{person} 以被告身份站在 {@bt_e|::subscribed_books::vocabulary::entity} 的法庭上。"
"The accused is charged with crimes against {@bt_e|::subscribed_books::vocabulary::entity}." = "被告被指控犯有危害 {@bt_e|::subscribed_books::vocabulary::entity} 的罪行。"
"I plead not guilty." = "我申辩无罪。"
"Let the {adj} evidence speak." = "让{adj}证据说话。"
"THE TRIAL OF {person}." = "{person} 的审判。"
"The court is now in session." = "法庭现在开庭。"
"The people of {@bt_e|::subscribed_books::vocabulary::entity} versus {@bt_a|::subscribed_books::vocabulary::person}." = "{@bt_e|::subscribed_books::vocabulary::entity} 的人民诉 {@bt_a|::subscribed_books::vocabulary::person}。"
"How does the accused plead?" = "被告如何答辩？"
"I plead that the truth be heard." = "我请求法庭聆听真相。"
"Let us examine the events of {@year}." = "让我们审视 {@year} 年的事件。"
"{@bt_a|::subscribed_books::vocabulary::person} is responsible for the death of {@bt_b|::subscribed_books::vocabulary::person} in {@year}." = "{@bt_a|::subscribed_books::vocabulary::person} 应对 {@bt_b|::subscribed_books::vocabulary::person} 在 {@year} 年的死亡负责。"
"{cause} was the method." = "手段是 {cause}。"
"My client denies all charges." = "我的当事人否认所有指控。"
"The defendant used the position of {role}, obtained in {@year}, for personal gain." = "被告利用 {@year} 年取得的{role}职位谋取私利。"
"My client served {@bt_e|::subscribed_books::vocabulary::entity} faithfully." = "我的当事人忠诚地效力于 {@bt_e|::subscribed_books::vocabulary::entity}。"
"The events of {@year} demonstrate a {adj} pattern of misconduct." = "{@year} 年的事件，展现出一种{adj}不当行为模式。"
"The events of {@year} demonstrate nothing of the sort." = "{@year} 年的事件，没有证明任何这种事情。"
"The court will take a brief recess." = "法庭将短暂休庭。"
"The court has reached a verdict." = "法庭已作出裁决。"
"History will determine whether it was just." = "是否公正，将由历史判断。"
"END OF TRIAL." = "审判结束。"
"Let the record show that the {adj} case of {@bt_e|::subscribed_books::vocabulary::entity} versus {person} is concluded." = "请记录在案：{@bt_e|::subscribed_books::vocabulary::entity} 诉 {person} 的{adj}案件已经审结。"
"The verdict is sealed." = "裁决已封存。"
"The truth, as always, belongs to those who survive to tell it." = "真相一如既往，属于幸存下来讲述它的人。"

