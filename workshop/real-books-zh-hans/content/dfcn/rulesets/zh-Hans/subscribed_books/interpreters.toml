[[rulesets]]
[rulesets.rules]
"In {year1}, {@bt_hero|::subscribed_books::interpreters::person} took up a new profession at {@bt_site|::subscribed_books::interpreters::place}. The change marked a turning point -- a deliberate choice to leave behind what was familiar and step into something unknown. Whether the decision was driven by necessity, curiosity, or the simple realization that the old path had run its course, it reshaped {@bt_hero2|::subscribed_books::interpreters::person}'s life." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}在{@bt_site|::subscribed_books::interpreters::place}从事了一项新职业。这一变化标志着转折——有意离开熟悉的一切，走向未知。无论是出于需要、好奇，还是意识到旧路已经走尽，这个决定都重塑了{@bt_hero2|::subscribed_books::interpreters::person}的人生。"

[[rulesets]]
[rulesets.rules]
"In {year1}, {@bt_hero|::subscribed_books::interpreters::person} left the settled life behind and began to wander. The decision to walk away from {@bt_site|::subscribed_books::interpreters::place} -- from safety, from routine, from everything that was known -- was not made lightly. But {@bt_hero2|::subscribed_books::interpreters::person} had seen enough of the world from behind walls. It was time to see it from the road." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}告别定居生活，开始流浪。离开{@bt_site|::subscribed_books::interpreters::place}——离开安全、日常，以及熟悉的一切——并非轻易作出的决定。但{@bt_hero2|::subscribed_books::interpreters::person}已经从墙后看够了世界，该到路上亲眼看看了。"

[[rulesets]]
[rulesets.rules]
"In {year1}, {@bt_hero|::subscribed_books::interpreters::person} settled at {@bt_site|::subscribed_books::interpreters::place}. The wandering was over. Whether driven by age, weariness, or the discovery of a place worth staying for, {@bt_hero2|::subscribed_books::interpreters::person} chose to put down roots and build a life that did not depend on constant motion." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}定居于{@bt_site|::subscribed_books::interpreters::place}，流浪终于结束。无论是年岁增长、疲惫，还是找到了值得留下的地方，{@bt_hero2|::subscribed_books::interpreters::person}都选择扎根，建立一种不再依赖不停迁移的生活。"

