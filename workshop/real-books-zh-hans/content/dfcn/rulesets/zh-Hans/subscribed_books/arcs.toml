"This is the story of {@bt_proto|::subscribed_books::vocabulary::person} -- a tale of departure, trial, and return." = "这是{@bt_proto|::subscribed_books::vocabulary::person}的故事，一段离去、试炼与归来的传奇。"
"The journey continued." = "旅程继续。"
"And still the road stretched onward." = "道路仍向前延伸。"
"What lay ahead was unknown, but {@bt_proto|::subscribed_books::vocabulary::person} pressed on." = "前路未知，但{@bt_proto|::subscribed_books::vocabulary::person}仍继续向前。"
"What follows is a tragedy. The audience is advised that the ending is not a happy one." = "接下来是一出悲剧。请观众知晓，结局并不幸福。"
"The chorus whispered of what was to come." = "歌队低声预言着即将到来的事。"
"Fate, once set in motion, could not be stopped." = "命运一旦开始运转，就无法阻止。"
"And so the trap closed, one jaw at a time." = "陷阱就这样一点一点地合拢。"
"A comedy of errors, misunderstandings, and the sort of chaos that only sentient beings can create." = "这是一出由错误、误解，以及只有有智慧的生命才能制造的混乱组成的喜剧。"
"And then things got worse." = "然后事情变得更糟。"
"Naturally, nothing went according to plan." = "自然，没有一件事按计划进行。"
"The audience is reminded that no one was permanently harmed." = "提醒观众：没有人受到永久的伤害。"
"This is a story of wrong and reckoning. The wrong came first. The reckoning took longer." = "这是一个关于冤屈与清算的故事。冤屈先来，清算花了更长时间。"
"The debt would be paid." = "债务必将偿还。"
"{@bt_proto|::subscribed_books::vocabulary::person} had not forgotten. {@bt_proto2|::subscribed_books::vocabulary::person} would never forget." = "{@bt_proto|::subscribed_books::vocabulary::person}没有忘记，也永不会忘记。"
"Patience is a weapon. {@bt_proto|::subscribed_books::vocabulary::person} wielded it well." = "耐心是武器。{@bt_proto|::subscribed_books::vocabulary::person}用得很好。"
"A story of two souls drawn together by forces neither fully understood." = "两个灵魂，被彼此都未完全理解的力量吸引到一起的故事。"
"Love, like water, finds its way through any obstacle." = "爱情如水，能穿过任何阻碍找到路。"
"The heart wants what it wants. Reason has no say in the matter." = "心自有所求，理智无权过问。"
"The truth was closer than anyone suspected." = "真相比任何人猜想的都更近。"
"Each answer raised two new questions." = "每个答案都引出两个新问题。"
"Nothing was what it appeared to be." = "一切都不是表面看来的模样。"
"In praise of what endures." = "赞美长存之物。"
"And still the song rises." = "歌声仍不断升起。"
"Let this be remembered." = "愿此事被铭记。"
"For what was lost, and cannot be recovered." = "献给失去而无法挽回的一切。"
"The mourning continued." = "哀悼继续。"
"Memory is all that remains." = "留下的唯有记忆。"
"This account does not sit neatly in one telling. It began one way and became another; the reader should not expect its ending from its opening." = "这个故事无法整齐地归入一种讲法。它以一种方式开始，又变成另一种；读者不该凭开头期待结局。"
"What follows resists easy classification. Where {@bt_proto|::subscribed_books::vocabulary::person}'s story began and where it ended are not quite the same kind of story." = "接下来的内容难以简单归类。{@bt_proto|::subscribed_books::vocabulary::person}故事的开端与结尾，并不属于同一种故事。"
"{@bt_proto|::subscribed_books::vocabulary::person}'s story took an unexpected turn along the way. The reader may not be able to predict its direction from these opening pages." = "{@bt_proto|::subscribed_books::vocabulary::person}的故事途中出现意外转折。读者也许无法从这些开篇预测它的方向。"
"Some stories keep their promise from the first page to the last. This is not one of them." = "有些故事从第一页到最后一页都守着自己的承诺。这个故事却不是其中之一。"
"The story continued to shift." = "故事继续变化。"
"What came next did not follow neatly from what came before." = "接下来的事，并未整齐地承接此前的事。"
"The path had already proven unpredictable." = "这条道路早已证明自己难以预测。"
"The old argument surfaced again." = "旧日争论再次浮现。"
"This was not the first time the subject had come up." = "这并非第一次提起这个话题。"
"They had been here before, and neither of them had forgotten it." = "他们此前就曾陷入同样局面，双方都未忘记。"
"Still on the matter that would not die." = "仍纠缠在那个怎么也不会结束的话题上。"
"{@bt_name|::subscribed_books::vocabulary::person} was {article} {race} -- {article2} {profession} by trade, {quality_tags} by temperament. {Pro} had lived long enough to know that the world did not owe {obj} anything, and short enough to still be surprised when it gave something anyway." = "{@bt_name|::subscribed_books::vocabulary::person}是{race}，以{profession}为业，性情{quality_tags}。{Pro}活得足够久，知道世界并不欠{obj}什么，却还不够久，每当世界仍然给出什么时，仍会吃惊。"
"The {race} known as {@bt_name|::subscribed_books::vocabulary::person} was, by all accounts, {quality_tags}. {article2} {profession} who had earned {pos} reputation through years of stubborn persistence rather than any single act of brilliance." = "名叫{@bt_name|::subscribed_books::vocabulary::person}的{race}，据众人说，性情{quality_tags}。这位{profession}的声望来自多年顽强坚持，并非某一次出色的壮举。"
"{@bt_name|::subscribed_books::vocabulary::person}. {article} {race}. {article2} {profession}. {Pro} was {quality_tags}." = "{@bt_name|::subscribed_books::vocabulary::person}。一位{race}。一位{profession}。{Pro}性情{quality_tags}。"
"{@bt_name|::subscribed_books::vocabulary::person} was a follower of {deity}, and {pos} faith colored everything {pro} did." = "{@bt_name|::subscribed_books::vocabulary::person}信奉{deity}，{pos}信仰影响着{pro}所做的一切。"

