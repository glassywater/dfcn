"The gift disappeared into {@bt_a|::subscribed_books::vocabulary::person}'s collection of things that might be useful someday, sooner than expected." = "礼物比预想中更早进入了{@bt_a|::subscribed_books::vocabulary::person}收藏的“总有一天会有用”的物品堆。"
