[[rulesets]]
[rulesets.rules]
"\"You promised resources for the outer wall,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"Instead, the stone went to your private quarters. The people noticed. I noticed.\"" = "“你答应为外墙提供物资，”{@bt_a|::subscribed_books::vocabulary::person}说道，“石料却进了你的私人居所。人们都看见了，我也看见了。”"
"\"Three times I warned the council about the northern threat,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"Three times I was ignored. And now? Now the threat is at our gates, and everyone wants to know why I didn't warn them.\"" = "“我三次向议会警告北方的威胁，”{@bt_a|::subscribed_books::vocabulary::person}说道，“三次都无人理会。现在呢？威胁到了门前，所有人却都来问我，为什么没有提醒他们。”"
"\"You knew the supplies were short,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"You knew families would go hungry. And you signed the order anyway, because it wasn't your family.\"" = "“你知道物资不足，”{@bt_a|::subscribed_books::vocabulary::person}说道，“知道那些家庭会挨饿。可你还是签了命令，因为挨饿的不是你家。”"
"\"The trade agreement was supposed to benefit everyone,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"Instead, the merchants grew rich and the workers grew desperate. Explain to me how that happened.\"" = "“贸易协议本该使所有人受益，”{@bt_a|::subscribed_books::vocabulary::person}说道，“结果商人越来越富，工人越来越绝望。告诉我，为什么会这样。”"
"\"Your god is a lie,\" {@bt_a|::subscribed_books::vocabulary::person} said flatly. \"A story told to children to keep them obedient. And you -- you built your entire life on that story. When it crumbles, and it will, what will you have left?\"" = "“你的神是个谎言，”{@bt_a|::subscribed_books::vocabulary::person}冷冷地说，“只是让孩子听话的故事。而你，却把整个人生都建在那故事上。等它崩塌时——它迟早会崩塌——你还能剩下什么？”"
"\"Look at this place,\" {@bt_a|::subscribed_books::vocabulary::person} gestured at the crumbling walls. \"You call this prosperity? The roads are mud, the granary is half empty, and the soldiers haven't been paid in two months. This is your leadership.\"" = "“看看这里，”{@bt_a|::subscribed_books::vocabulary::person}指着破败的墙壁，“你管这叫繁荣？道路泥泞，粮仓半空，士兵两个月没领到军饷。这就是你的领导。”"
"\"The old traditions kept us alive for centuries,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"You want to throw them away because some traveling scholar told you there was a better way. There isn't. There never is.\"" = "“旧传统使我们生存了几个世纪，”{@bt_a|::subscribed_books::vocabulary::person}说道，“只因某个游学者告诉你有更好的办法，你就想把它们扔掉。根本没有。从来就没有。”"
"\"You think because you were born into privilege that you understand what the people need?\" {@bt_a|::subscribed_books::vocabulary::person} said. \"You have never gone hungry. You have never slept in the cold. Your opinions are luxuries.\"" = "“你以为出身优越就懂得人们需要什么？”{@bt_a|::subscribed_books::vocabulary::person}说道，“你从没挨过饿，从没在寒冷中露宿。你的观点，不过是奢侈品。”"
"\"The histories are clear,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"Every civilization that expanded too fast collapsed under its own weight. We are making the same mistakes, and you are cheering as we make them.\"" = "“历史写得清清楚楚，”{@bt_a|::subscribed_books::vocabulary::person}说道，“每个扩张过快的文明，都被自身的重量压垮。我们正在重犯旧错，你却还在一旁叫好。”"
"\"The decision was not mine alone,\" {@bt_b|::subscribed_books::vocabulary::person} replied. \"The council voted. The majority agreed. If you have a grievance, take it to the assembly.\"" = "“这不是我一个人的决定，”{@bt_b|::subscribed_books::vocabulary::person}答道，“议会投了票，多数人同意。若有不满，就去向大会申诉。”"
"\"You see conspiracy where there is only compromise,\" {@bt_b|::subscribed_books::vocabulary::person} said. \"Governing is not about giving everyone what they want. It is about giving no one everything.\"" = "“明明只是妥协，你却看成阴谋，”{@bt_b|::subscribed_books::vocabulary::person}说道，“治理不是让每个人如愿，而是不让任何人独占一切。”"
"\"Easy to criticize from the sidelines,\" {@bt_b|::subscribed_books::vocabulary::person} said. \"But when you sit in the chair, you will discover that the choices are harder than they look from below.\"" = "“站在一旁批评很容易，”{@bt_b|::subscribed_books::vocabulary::person}说道，“等你坐上那个位置，就会发现，选择比从下面看时难得多。”"
"\"My faith is not your concern,\" {@bt_b|::subscribed_books::vocabulary::person} said, voice tight. \"And I will not stand here and have my beliefs mocked by someone who believes in nothing.\"" = "“我的信仰与你无关，”{@bt_b|::subscribed_books::vocabulary::person}绷紧声音说道，“我不会站在这里，任凭一个什么也不信的人嘲笑我的信念。”"
"\"Tradition is not a plan,\" {@bt_b|::subscribed_books::vocabulary::person} replied. \"It is an excuse to avoid thinking. The world has changed. We must change with it, or be left behind.\"" = "“传统不是计划，”{@bt_b|::subscribed_books::vocabulary::person}答道，“只是逃避思考的借口。世界变了。我们必须跟着改变，否则就会被抛下。”"
"\"The economy is complex,\" {@bt_b|::subscribed_books::vocabulary::person} said. \"More complex than your tavern understanding of it. The trade routes I opened brought wealth to this settlement that your precious old ways never could.\"" = "“经济很复杂，”{@bt_b|::subscribed_books::vocabulary::person}说道，“比你在酒馆听来的那点见识复杂得多。我开辟的商路为聚落带来财富，是你珍爱的旧办法永远做不到的。”"
"\"Here is what I propose,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"We reinforce the southern approach, redirect the river to fill the moat, and station archers on the new tower. It will take fifty laborers and three seasons.\"" = "“我的提议是这样，”{@bt_a|::subscribed_books::vocabulary::person}说道，“加固南面的通道，引河水填满护城河，在新塔楼驻扎弓箭手。需要五十名劳工和三个季度。”"
"\"The mines are playing out,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"We have two choices: dig deeper, which risks collapse, or send prospectors west, which risks everything else. Neither option is safe.\"" = "“矿藏快要耗尽了，”{@bt_a|::subscribed_books::vocabulary::person}说道，“我们有两个选择：往下挖，冒塌方的风险；或派勘探者西行，冒其他所有风险。两条路都不安全。”"
"\"We need an alliance,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"Not a treaty -- those are paper. An alliance. Shared soldiers, shared walls, shared fate. It is the only way to survive what is coming.\"" = "“我们需要联盟，”{@bt_a|::subscribed_books::vocabulary::person}说道，“不是条约，那只是纸。是联盟。共享军队、城墙与命运。唯有如此，才能挺过即将到来的危机。”"
"\"The harvest will not last the winter,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"We can ration, which will cause unrest, or we can trade our iron reserves for grain, which will leave us unarmed.\"" = "“这次收成撑不过冬天，”{@bt_a|::subscribed_books::vocabulary::person}说道，“可以限量配给，但会引发骚乱；也可以拿储备的铁换粮食，但那样我们就没了武器。”"
"\"I have been studying the old texts,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"The gods demand a consecration of the new hall before we can use it. I know some disagree, but the rites must be observed. Our prosperity depends on it.\"" = "“我一直在研读古籍，”{@bt_a|::subscribed_books::vocabulary::person}说道，“诸神要求先为新大厅举行祝圣，才能使用。我知道有人不赞成，但仪式必须遵守。我们的繁荣系于此事。”"
"\"The {race} merchants are offering favorable terms,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"Better prices, longer credit, guaranteed supply lines. The question is whether we trust them enough to depend on them.\"" = "“{race}商人提出了优厚条件，”{@bt_a|::subscribed_books::vocabulary::person}说道，“更好的价格，更长的赊账期限，稳定的供应。问题是，我们是否信任他们到足以依靠他们。”"
"\"Our population has doubled in a decade,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"The old governance structure cannot handle it. I propose a council of guilds -- each trade represented, each voice heard. It will be messy, but it will be fair.\"" = "“十年间，我们的人口翻了一番，”{@bt_a|::subscribed_books::vocabulary::person}说道，“旧的治理结构已经应付不了。我提议建立行会议会，每个行业都有代表，每种声音都能被听见。虽然会乱一些，却能公平。”"
"\"The land to the north is fertile but contested,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"If we settle it, we risk war. If we don't, someone else will, and we lose the opportunity forever. I say we settle it, and build the defenses to hold it.\"" = "“北面的土地肥沃，但各方都在争夺，”{@bt_a|::subscribed_books::vocabulary::person}说道，“我们去定居，就可能开战；不去，别人就会去，我们将永远失去机会。依我看，就去定居，再修起防御守住它。”"
"\"The plan has merit,\" {@bt_b|::subscribed_books::vocabulary::person} admitted. \"But the cost concerns me. Where do the laborers come from? The fields? The workshops? Every hand we move creates a gap somewhere else.\"" = "“计划有可取之处，”{@bt_b|::subscribed_books::vocabulary::person}承认，“但代价让我担忧。劳工从哪里来？田里？工坊？每调走一双手，别处就会留下一个空缺。”"
"\"You assume we have three seasons,\" {@bt_b|::subscribed_books::vocabulary::person} said. \"What if we have one?\"" = "“你假定我们还有三个季度，”{@bt_b|::subscribed_books::vocabulary::person}说道，“如果只剩一个呢？”"
"\"I have seen alliances fail before,\" {@bt_b|::subscribed_books::vocabulary::person} said. \"They hold when times are good and shatter when times are bad -- which is exactly when you need them.\"" = "“我见过联盟破裂，”{@bt_b|::subscribed_books::vocabulary::person}说道，“好日子里它们牢固，坏日子里它们粉碎，而偏偏那时候才最需要它们。”"
"\"The gods have been silent for a long time,\" {@bt_b|::subscribed_books::vocabulary::person} said carefully. \"I respect the tradition, but I wonder if our resources might be better spent on walls than on altars.\"" = "“诸神已经沉默很久了，”{@bt_b|::subscribed_books::vocabulary::person}谨慎地说，“我尊重传统，却也在想，与其把物资用在祭坛上，是否修城墙更有用。”"
"\"Trusting the {race} merchants is a gamble,\" {@bt_b|::subscribed_books::vocabulary::person} said. \"But so is starving. I would rather gamble with trade than with empty stomachs.\"" = "“相信{race}商人是一场赌博，”{@bt_b|::subscribed_books::vocabulary::person}说道，“但挨饿也是。我宁愿拿贸易去赌，也不愿拿空肚子去赌。”"
"{@bt_b|::subscribed_books::vocabulary::person} had been selling information to enemies of the settlement -- troop positions, supply routes, the locations of hidden stores. The damage was incalculable. People had died because of what {@bt_b2|::subscribed_books::vocabulary::person} had revealed." = "{@bt_b|::subscribed_books::vocabulary::person}一直在向聚落的敌人出售情报：部队位置、补给路线，以及隐秘仓库的地点。损失无可估量，有人因{@bt_b2|::subscribed_books::vocabulary::person}泄露的消息而死。"
"{@bt_b|::subscribed_books::vocabulary::person} had poisoned the water supply -- slowly, carefully, over months. Not enough to kill outright, but enough to sicken. Enough to weaken. When {@bt_a|::subscribed_books::vocabulary::person} traced the illness back to its source, the trail led directly to {@bt_b2|::subscribed_books::vocabulary::person}." = "{@bt_b|::subscribed_books::vocabulary::person}数月来一直缓慢而谨慎地给水源下毒。剂量不足以立即致命，却足以让人患病、衰弱。{@bt_a|::subscribed_books::vocabulary::person}追查病因时，线索直接指向{@bt_b2|::subscribed_books::vocabulary::person}。"
"{@bt_b|::subscribed_books::vocabulary::person} had arranged the death of someone {@bt_a|::subscribed_books::vocabulary::person} loved. Not directly -- {@bt_b2|::subscribed_books::vocabulary::person} was too careful for that. But the ambush, the timing, the convenient absence of the guards who should have been there -- it all pointed to one person." = "{@bt_b|::subscribed_books::vocabulary::person}安排了{@bt_a|::subscribed_books::vocabulary::person}所爱之人的死亡，并未直接动手，因为{@bt_b2|::subscribed_books::vocabulary::person}太过谨慎。但那场伏击、时机，以及本该在场的卫兵恰好缺席，都指向同一个人。"
"{@bt_b|::subscribed_books::vocabulary::person} had been stealing from the communal treasury. Gold that should have bought grain for the winter, iron for the smiths, medicine for the sick -- all of it diverted into {@bt_b2|::subscribed_books::vocabulary::person}'s private hoard." = "{@bt_b|::subscribed_books::vocabulary::person}一直窃取公库的财物。本应用来购买过冬粮食、铁匠所需的铁、病人所需的药的黄金，全都流入了{@bt_b2|::subscribed_books::vocabulary::person}的私藏。"
"{@bt_b|::subscribed_books::vocabulary::person} had forged {@bt_a|::subscribed_books::vocabulary::person}'s seal on documents that authorized the execution of three innocent people. When {@bt_a2|::subscribed_books::vocabulary::person} discovered the forgeries, the prisoners were already dead." = "{@bt_b|::subscribed_books::vocabulary::person}在批准处决三名无辜者的文件上，伪造了{@bt_a|::subscribed_books::vocabulary::person}的印章。等{@bt_a2|::subscribed_books::vocabulary::person}发现伪造时，囚犯已经死去。"
"{@bt_b|::subscribed_books::vocabulary::person} had sabotaged the defenses before the last attack. The gate that failed to close, the alarm that did not sound, the weapons that were found blunted -- none of it was accident. {@bt_b2|::subscribed_books::vocabulary::person} had wanted the settlement to fall." = "上次袭击之前，{@bt_b|::subscribed_books::vocabulary::person}破坏了防御。关不上的大门、没有响起的警报、被发现钝化的武器，没有一件是意外。{@bt_b2|::subscribed_books::vocabulary::person}想让聚落陷落。"
"{@bt_b|::subscribed_books::vocabulary::person} had been feeding lies to {@bt_a|::subscribed_books::vocabulary::person}'s allies for months, slowly turning them against {@bt_a2|::subscribed_books::vocabulary::person} with carefully crafted half-truths and invented grievances. By the time {@bt_a3|::subscribed_books::vocabulary::person} realized what was happening, {pos1} support had evaporated." = "数月来，{@bt_b|::subscribed_books::vocabulary::person}不断向{@bt_a|::subscribed_books::vocabulary::person}的盟友灌输谎言，用精心编造的半真半假与虚构的不满，让他们逐渐反对{@bt_a2|::subscribed_books::vocabulary::person}。等{@bt_a3|::subscribed_books::vocabulary::person}察觉时，{pos1}支持已经烟消云散。"
"The evidence was in the ledger, hidden beneath the floorboards -- months of entries in {@bt_b|::subscribed_books::vocabulary::person}'s handwriting." = "证据就在藏于地板下的账簿里：数月的记录，皆是{@bt_b|::subscribed_books::vocabulary::person}的笔迹。"
"A messenger arrived carrying a letter meant for {@bt_b|::subscribed_books::vocabulary::person}. {@bt_a|::subscribed_books::vocabulary::person} read it first. The contents changed everything." = "一名信使带来了给{@bt_b|::subscribed_books::vocabulary::person}的信。{@bt_a|::subscribed_books::vocabulary::person}先读到了它。信的内容改变了一切。"
"{@bt_a|::subscribed_books::vocabulary::person} had followed {@bt_b|::subscribed_books::vocabulary::person} for three nights. On the third night, {pro1} saw what {@bt_b2|::subscribed_books::vocabulary::person} had been doing." = "{@bt_a|::subscribed_books::vocabulary::person}跟踪了{@bt_b|::subscribed_books::vocabulary::person}三个夜晚。第三夜，{pro1}亲眼看到了{@bt_b2|::subscribed_books::vocabulary::person}一直在做的事。"
"The confession came from a dying soldier. \"It was {@bt_b|::subscribed_books::vocabulary::person},\" the soldier whispered. \"It was always {@bt_b2|::subscribed_books::vocabulary::person}.\"" = "供词来自一名垂死的士兵。“是{@bt_b|::subscribed_books::vocabulary::person}，”士兵低声说，“一直都是{@bt_b2|::subscribed_books::vocabulary::person}。”"
"{@bt_b|::subscribed_books::vocabulary::person} confessed directly -- not out of guilt, but out of pride. \"Yes,\" {@bt_b2|::subscribed_books::vocabulary::person} said, smiling. \"I did it. You were so trusting. It was almost too easy.\"" = "{@bt_b|::subscribed_books::vocabulary::person}直接承认了，并非出于愧疚，而是出于得意。“没错，”{@bt_b2|::subscribed_books::vocabulary::person}笑着说，“是我做的。你太容易相信人了，简直易如反掌。”"
"{@bt_a|::subscribed_books::vocabulary::person} saw it happen with {pos1} own eyes, from twenty paces away, close enough to see the expression on {@bt_b|::subscribed_books::vocabulary::person}'s face." = "{@bt_a|::subscribed_books::vocabulary::person}在二十步之外，用{pos1}双眼目睹了全过程，近得足以看清{@bt_b|::subscribed_books::vocabulary::person}脸上的表情。"
"A friend pulled {@bt_a|::subscribed_books::vocabulary::person} aside, voice shaking. \"I did not want to be the one to tell you this. But you deserve to know what {@bt_b|::subscribed_books::vocabulary::person} has done.\"" = "一位朋友把{@bt_a|::subscribed_books::vocabulary::person}拉到一旁，声音颤抖：“我本不想由我来告诉你。但你有权知道{@bt_b|::subscribed_books::vocabulary::person}做了什么。”"
"{@bt_a|::subscribed_books::vocabulary::person} had hired an investigator. The report was thorough and devastating. Dates. Locations. Names. The evidence was irrefutable." = "{@bt_a|::subscribed_books::vocabulary::person}雇了一名调查者。报告详尽而致命：日期、地点、姓名，一应俱全，证据无可辩驳。"
"\"I know what you did,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"Every detail. Every lie. You have nothing left to hide behind.\"" = "“我知道你做了什么，”{@bt_a|::subscribed_books::vocabulary::person}说道，“每个细节，每句谎话。你已经无处可藏。”"
"\"How long?\" {@bt_a|::subscribed_books::vocabulary::person} asked, voice dangerously quiet. \"How long have you been working against us?\"" = "“多久了？”{@bt_a|::subscribed_books::vocabulary::person}的声音低得危险，“你暗中与我们作对，已经多久了？”"
"\"I trusted you,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I defended you when others had doubts. And the whole time, you were destroying everything I built.\"" = "“我信任你，”{@bt_a|::subscribed_books::vocabulary::person}说道，“别人怀疑时，我还为你辩护。而你始终在毁掉我建立的一切。”"
"\"I watched you do it,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I was there. I saw your face. Do not insult me by denying it.\"" = "“我亲眼看见你做的，”{@bt_a|::subscribed_books::vocabulary::person}说道，“我就在场，看到了你的脸。别再否认，侮辱我的眼睛。”"
"\"Explain,\" {@bt_a|::subscribed_books::vocabulary::person} said, holding up the evidence. \"Explain this. Explain why people are dead because of you.\"" = "“解释，”{@bt_a|::subscribed_books::vocabulary::person}举起证据，“解释这些。解释为什么有人因你而死。”"
"\"I have spent weeks trying to find the right words,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I never found them. So I will just say it plainly: I think about you constantly, and I would like that to mean something.\"" = "“我花了好几个星期，想找出合适的话，”{@bt_a|::subscribed_books::vocabulary::person}说道，“可始终没找到。所以我就直说了：我总是在想你，希望这份心意能有些意义。”"
"\"This is probably a mistake,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"You are probably going to say no. But I would rather hear you say no than spend the rest of my life wondering what you would have said.\"" = "“这大概是个错误，”{@bt_a|::subscribed_books::vocabulary::person}说道，“你大概会拒绝。但我宁愿亲耳听到你说不，也不愿用余生猜想你原本会怎么回答。”"
"\"I brought you something,\" {@bt_a|::subscribed_books::vocabulary::person} said, and held out a small, carefully carved figure -- clearly the work of many nights. \"I made it. It is supposed to be you. It is not very good.\"" = "“我给你带了样东西，”{@bt_a|::subscribed_books::vocabulary::person}说道，递出一尊精心雕成的小人像，显然花了许多个夜晚。“是我做的，想雕成你的样子。不过做得不太好。”"
"{@bt_b|::subscribed_books::vocabulary::person} looked at {@bt_a|::subscribed_books::vocabulary::person} for a long moment. \"It took you long enough,\" {@bt_b2|::subscribed_books::vocabulary::person} said softly." = "{@bt_b|::subscribed_books::vocabulary::person}望着{@bt_a|::subscribed_books::vocabulary::person}许久。“你可真让我等了够久，”{@bt_b2|::subscribed_books::vocabulary::person}轻声说道。"
"\"You are not wrong,\" {@bt_b|::subscribed_books::vocabulary::person} said. \"This is probably a mistake. Let us make it together.\"" = "“你没说错，”{@bt_b|::subscribed_books::vocabulary::person}说道，“这大概是个错误。那就让我们一起犯这个错吧。”"
"The dispute had been simmering for weeks -- over territory, over resources, over the right to speak in council. Now it boiled over." = "争端已暗中酝酿数周：为领地，为资源，为议会中的发言权。如今，它终于爆发。"
"It started with a shove. Not a punch -- a shove. The kind that says: I am done talking. {@bt_a|::subscribed_books::vocabulary::person} shoved first. {@bt_b|::subscribed_books::vocabulary::person} shoved back harder." = "事情始于一次推搡。不是一拳，而是一推。那动作仿佛在说：我不想再谈了。{@bt_a|::subscribed_books::vocabulary::person}先推了一把，{@bt_b|::subscribed_books::vocabulary::person}更用力地推了回来。"
"{@bt_a|::subscribed_books::vocabulary::person} had drawn a line. {@bt_b|::subscribed_books::vocabulary::person} had crossed it. The words that followed were the last words either of them would speak before the violence began." = "{@bt_a|::subscribed_books::vocabulary::person}划下底线，{@bt_b|::subscribed_books::vocabulary::person}却越了过去。随后的几句话，是暴力开始前双方说出的最后话语。"
"{@bt_b|::subscribed_books::vocabulary::person} had made a romantic advance on someone {@bt_a|::subscribed_books::vocabulary::person} cared about -- openly, brazenly, with {@bt_a2|::subscribed_books::vocabulary::person} standing right there. The insult was deliberate, and it demanded an immediate response." = "{@bt_b|::subscribed_books::vocabulary::person}公然、厚颜地向{@bt_a|::subscribed_books::vocabulary::person}在意的人求爱，而{@bt_a2|::subscribed_books::vocabulary::person}就站在旁边。这是蓄意的侮辱，必须立即回应。"
"It was a matter of faith. {@bt_b|::subscribed_books::vocabulary::person} had desecrated something sacred to {@bt_a|::subscribed_books::vocabulary::person} -- whether out of ignorance or contempt, the result was the same. For {@bt_a2|::subscribed_books::vocabulary::person}, there was only one possible answer." = "这是信仰之事。{@bt_b|::subscribed_books::vocabulary::person}亵渎了{@bt_a|::subscribed_books::vocabulary::person}心中的圣物。不论出于无知还是轻蔑，结果都一样。对{@bt_a2|::subscribed_books::vocabulary::person}而言，只有一种回应。"
"The argument had revealed something that could not be taken back. A truth about {@bt_b|::subscribed_books::vocabulary::person}'s character that {@bt_a|::subscribed_books::vocabulary::person} could not live with. The time for words was over." = "争论揭露了某种再也无法收回的东西：{@bt_b|::subscribed_books::vocabulary::person}性情中的真相，令{@bt_a|::subscribed_books::vocabulary::person}无法容忍。言语的时机已经过去。"
"{@bt_a|::subscribed_books::vocabulary::person} had held back for too long. Every slight, every injustice, every moment of being dismissed -- it had accumulated like pressure behind a dam. And now the dam broke." = "{@bt_a|::subscribed_books::vocabulary::person}忍得太久了。每一次轻慢、不公与不被重视，都像坝后的水压不断累积。如今，大坝终于决堤。"
"\"I only want what is best for the settlement,\" {@bt_a|::subscribed_books::vocabulary::person} said, with a sincerity so polished it was almost convincing. \"And what is best, I think we can agree, is that the current leadership step aside.\"" = "“我只想让聚落过得最好，”{@bt_a|::subscribed_books::vocabulary::person}说道，那精心打磨的诚恳几乎足以令人信服，“而最好的办法，我想大家都会同意，就是让现任领袖退位。”"
"{@bt_a|::subscribed_books::vocabulary::person} leaned close to {@bt_b|::subscribed_books::vocabulary::person}. \"Consider your position,\" {@bt_a2|::subscribed_books::vocabulary::person} whispered. \"You have enemies. I can protect you from them. All I ask is a small favor in return.\"" = "{@bt_a|::subscribed_books::vocabulary::person}凑近{@bt_b|::subscribed_books::vocabulary::person}。“想想你的处境，”{@bt_a2|::subscribed_books::vocabulary::person}低声说，“你有敌人，我可以保护你。作为回报，我只要一个小小的人情。”"
"\"You know,\" {@bt_a|::subscribed_books::vocabulary::person} said casually, \"I heard something interesting about the council's vote. Something that certain people might find... embarrassing, if it became public.\"" = "“你知道吗，”{@bt_a|::subscribed_books::vocabulary::person}随口说道，“我听到了一些关于议会投票的趣事。要是公开出来，有些人大概会觉得……难堪。”"

# Trait sadistic.
[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} prolonged the fight deliberately. The victory was not the point. The suffering was." = "{@bt_a|::subscribed_books::vocabulary::person}刻意延长战斗。目的不是胜利，而是折磨。"
"{@bt_a|::subscribed_books::vocabulary::person} eased off just as the enemy thought it was over, letting the hope curdle before striking again." = "{@bt_a|::subscribed_books::vocabulary::person}在敌人以为一切结束时稍稍收手，让希望变质，再次攻击。"
"Every wound {@bt_a|::subscribed_books::vocabulary::person} inflicted was chosen for how long it would take to matter, not how quickly." = "{@bt_a|::subscribed_books::vocabulary::person}造成的每一道伤口，都按它能持续多久来选择，而非多快见效。"
"{@bt_a|::subscribed_books::vocabulary::person} smiled at the sound {pos1} opponent made. It was the best part of the fight, and {pro1} was in no hurry to end it." = "{@bt_a|::subscribed_books::vocabulary::person}听到{pos1}对手发出的声音，笑了。这是战斗最美妙的部分，{pro1}一点也不急着结束。"
"{@bt_a|::subscribed_books::vocabulary::person} could have finished it in a single stroke. {pro1} took {pos1} time instead, savoring every second of it." = "{@bt_a|::subscribed_books::vocabulary::person}本可以一击了结。{pro1}却按{pos1}节奏慢慢来，品味每一秒。"
"The mercy blow never came. {@bt_a|::subscribed_books::vocabulary::person} preferred to watch instead." = "仁慈的一击始终没有到来。{@bt_a|::subscribed_books::vocabulary::person}更喜欢看着。"
"{@bt_a|::subscribed_books::vocabulary::person} circled the wounded enemy slowly, drawing the moment out, unwilling to let it end too soon." = "{@bt_a|::subscribed_books::vocabulary::person}缓缓绕着受伤的敌人走，将这一刻拖长，不愿它太早结束。"
"There was a particular pleasure {@bt_a|::subscribed_books::vocabulary::person} took in the moment just before someone realized they could not win, and {pro1} lingered there as long as {pro2} could." = "人将要意识到自己无法获胜之前的那一刻，让{@bt_a|::subscribed_books::vocabulary::person}格外快乐。{pro1}尽{pro2}所能地延长它。"
"{@bt_a|::subscribed_books::vocabulary::person} struck to wound, not to kill, again and again, and enjoyed the difference." = "{@bt_a|::subscribed_books::vocabulary::person}一次次攻击，只为致伤，而非致死，并享受着两者的区别。"
"When the enemy begged, {@bt_a|::subscribed_books::vocabulary::person} slowed down. Begging, {pro1} had learned, was worth savoring." = "敌人哀求时，{@bt_a|::subscribed_books::vocabulary::person}放慢了速度。{pro1}早已明白，哀求值得细细品味。"
"{@bt_a|::subscribed_books::vocabulary::person} let {pos1} opponent believe there was still a chance, right up until {pro1} took it away, slowly." = "{@bt_a|::subscribed_books::vocabulary::person}让{pos1}对手相信还有机会，直到{pro1}缓缓将它夺走。"
"The fight could have ended three times over. {@bt_a|::subscribed_books::vocabulary::person} made sure it did not." = "战斗本可以结束三次了。{@bt_a|::subscribed_books::vocabulary::person}却确保它没有结束。"
"{@bt_a|::subscribed_books::vocabulary::person} watched the fear grow in {pos1} opponent's eyes and found it more satisfying than the fight itself." = "{@bt_a|::subscribed_books::vocabulary::person}看着恐惧在{pos1}对手眼中增长，觉得它比战斗本身更令人满足。"
"There was no urgency in {@bt_a|::subscribed_books::vocabulary::person}'s violence. {pro1} had all the time in the world, and intended to use it." = "{@bt_a|::subscribed_books::vocabulary::person}的暴力里毫无急迫。{pro1}有大把时间，而且打算用尽。"
"{@bt_a|::subscribed_books::vocabulary::person} toyed with the wounded soldier the way a cat toys with something already caught." = "{@bt_a|::subscribed_books::vocabulary::person}戏弄受伤的士兵，就像猫戏弄已经抓住的猎物。"
"Each cry of pain seemed to feed something in {@bt_a|::subscribed_books::vocabulary::person}, and {@bt_a2|::subscribed_books::vocabulary::person} was not about to starve it." = "每一声痛呼，似乎都在喂养{@bt_a|::subscribed_books::vocabulary::person}心里的某种东西，而{@bt_a2|::subscribed_books::vocabulary::person}不打算让它挨饿。"
"{@bt_a|::subscribed_books::vocabulary::person} drew the blade across slow enough to make it last, and did not look away once." = "{@bt_a|::subscribed_books::vocabulary::person}慢慢划过刀刃，慢到足以让痛苦持续，一次也没移开目光。"
