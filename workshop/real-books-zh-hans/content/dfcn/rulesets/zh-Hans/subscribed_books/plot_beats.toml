# 英雄之旅
"The news reached {@bt_hero|::subscribed_books::vocabulary::person} at {@bt_place|::subscribed_books::vocabulary::place} before nightfall, and with it a question nobody else wanted to answer: who was going to {::subscribed_books::plot_vocabulary::goal}?" = "消息在夜幕降临前传到了身在 {@bt_place|::subscribed_books::vocabulary::place} 的 {@bt_hero|::subscribed_books::vocabulary::person} 耳中，随之而来的还有一个谁都不愿回答的问题：谁来{::subscribed_books::plot_vocabulary::goal}？"
"Everyone in {@bt_place|::subscribed_books::vocabulary::place} agreed that someone ought to {::subscribed_books::plot_vocabulary::goal}. Everyone looked at {@bt_hero|::subscribed_books::vocabulary::person} while they said it." = "{@bt_place|::subscribed_books::vocabulary::place} 的所有人都认为，总该有人去{::subscribed_books::plot_vocabulary::goal}。他们说这话时，目光都落在 {@bt_hero|::subscribed_books::vocabulary::person} 身上。"
"{@bt_hero|::subscribed_books::vocabulary::person} did not want the task. To {::subscribed_books::plot_vocabulary::goal} meant leaving {@bt_place|::subscribed_books::vocabulary::place}, and everything built there, for a road with {@bt_foe|::subscribed_books::vocabulary::person} at the end of it." = "{@bt_hero|::subscribed_books::vocabulary::person} 不想接下这项任务。要{::subscribed_books::plot_vocabulary::goal}，就得离开 {@bt_place|::subscribed_books::vocabulary::place}，抛下在那里建立的一切，踏上一条尽头有 {@bt_foe|::subscribed_books::vocabulary::person} 等待的道路。"
"\"Let someone else go,\" {@bt_hero|::subscribed_books::vocabulary::person} said, and meant it, and knew even as the words came out that there was no one else." = "“让别人去吧。”{@bt_hero|::subscribed_books::vocabulary::person} 说。这话是真心的，可话一出口，心里便已明白：再没有别人了。"
"{@bt_hero|::subscribed_books::vocabulary::person} left {@bt_place|::subscribed_books::vocabulary::place} at first light, taking the road toward {@bt_far_place|::subscribed_books::vocabulary::place}. Behind lay everything familiar; ahead lay {@bt_foe|::subscribed_books::vocabulary::person}, and {::subscribed_books::plot_vocabulary::stake}." = "天刚亮，{@bt_hero|::subscribed_books::vocabulary::person} 便离开 {@bt_place|::subscribed_books::vocabulary::place}，踏上通往 {@bt_far_place|::subscribed_books::vocabulary::place} 的道路。身后是熟悉的一切；前方是 {@bt_foe|::subscribed_books::vocabulary::person}，以及{::subscribed_books::plot_vocabulary::stake}。"
"The last house of {@bt_place|::subscribed_books::vocabulary::place} fell out of sight behind {@bt_hero|::subscribed_books::vocabulary::person}. From here on, every step was a step toward {@bt_far_place|::subscribed_books::vocabulary::place}." = "{@bt_place|::subscribed_books::vocabulary::place} 的最后一间房屋消失在 {@bt_hero|::subscribed_books::vocabulary::person} 身后。从此，每一步都是向 {@bt_far_place|::subscribed_books::vocabulary::place} 迈进。"
"The road to {@bt_far_place|::subscribed_books::vocabulary::place} tested {@bt_hero|::subscribed_books::vocabulary::person} at every turn. Twice the trail of {@bt_foe|::subscribed_books::vocabulary::person} went cold, and twice it was found again." = "通往 {@bt_far_place|::subscribed_books::vocabulary::place} 的道路处处考验着 {@bt_hero|::subscribed_books::vocabulary::person}。{@bt_foe|::subscribed_books::vocabulary::person} 的踪迹两度中断，又两度被重新寻获。"
"Nothing about the road to {@bt_far_place|::subscribed_books::vocabulary::place} was easy. {@bt_hero|::subscribed_books::vocabulary::person} began to understand why {@bt_foe|::subscribed_books::vocabulary::person} had chosen it." = "通往 {@bt_far_place|::subscribed_books::vocabulary::place} 的道路没有一处轻松。{@bt_hero|::subscribed_books::vocabulary::person} 开始明白，{@bt_foe|::subscribed_books::vocabulary::person} 为何选择了这条路。"
"No one could {::subscribed_books::plot_vocabulary::goal} alone. {@bt_ally|::subscribed_books::vocabulary::person} understood that before {@bt_hero|::subscribed_books::vocabulary::person} did, and offered help without being asked." = "没有人能独自{::subscribed_books::plot_vocabulary::goal}。{@bt_ally|::subscribed_books::vocabulary::person} 比 {@bt_hero|::subscribed_books::vocabulary::person} 更早明白这一点，不等开口便主动伸出援手。"
"{@bt_hero|::subscribed_books::vocabulary::person} had not expected help. It came anyway, from {@bt_ally|::subscribed_books::vocabulary::person}, and it changed what the road to {@bt_far_place|::subscribed_books::vocabulary::place} would be." = "{@bt_hero|::subscribed_books::vocabulary::person} 未曾指望有人相助。但帮助还是来了，来自 {@bt_ally|::subscribed_books::vocabulary::person}，也让通往 {@bt_far_place|::subscribed_books::vocabulary::place} 的旅途从此不同。"
"At {@bt_far_place|::subscribed_books::vocabulary::place} it came at last to {@bt_foe|::subscribed_books::vocabulary::person}, face to face, with {::subscribed_books::plot_vocabulary::stake} between them." = "到了 {@bt_far_place|::subscribed_books::vocabulary::place}，终于到了与 {@bt_foe|::subscribed_books::vocabulary::person} 当面对峙的时刻，横在双方之间的正是{::subscribed_books::plot_vocabulary::stake}。"
"All the roads of the story ran together at {@bt_far_place|::subscribed_books::vocabulary::place}, and {@bt_foe|::subscribed_books::vocabulary::person} was waiting where they met." = "故事中的所有道路都汇聚于 {@bt_far_place|::subscribed_books::vocabulary::place}，而 {@bt_foe|::subscribed_books::vocabulary::person} 就在交汇处等待。"
"What {@bt_hero|::subscribed_books::vocabulary::person} carried away from {@bt_far_place|::subscribed_books::vocabulary::place} was more than {::subscribed_books::plot_vocabulary::stake}: it was the knowledge of what {::subscribed_books::plot_vocabulary::stake2} had cost." = "{@bt_hero|::subscribed_books::vocabulary::person} 从 {@bt_far_place|::subscribed_books::vocabulary::place} 带走的不仅是{::subscribed_books::plot_vocabulary::stake}，还有为{::subscribed_books::plot_vocabulary::stake2}所付代价的切身体会。"
"{::subscribed_books::plot_vocabulary::stake} was within reach at last. {@bt_hero|::subscribed_books::vocabulary::person} found that reaching for it was harder than any of the road had been." = "{::subscribed_books::plot_vocabulary::stake}终于近在咫尺。{@bt_hero|::subscribed_books::vocabulary::person} 却发现，伸手去取比一路上的任何艰险都更难。"
"{@bt_hero|::subscribed_books::vocabulary::person} came home to {@bt_place|::subscribed_books::vocabulary::place} changed. People asked about {::subscribed_books::plot_vocabulary::stake}. Few asked what the road had taken in exchange." = "{@bt_hero|::subscribed_books::vocabulary::person} 回到了 {@bt_place|::subscribed_books::vocabulary::place} 的家，却已不再是从前的自己。人们问起{::subscribed_books::plot_vocabulary::stake}，很少有人问，这一路又拿走了什么作为交换。"
"{@bt_place|::subscribed_books::vocabulary::place} looked smaller than {@bt_hero|::subscribed_books::vocabulary::person} remembered, the way home always does to someone who has been to {@bt_far_place|::subscribed_books::vocabulary::place}." = "{@bt_place|::subscribed_books::vocabulary::place} 看起来比 {@bt_hero|::subscribed_books::vocabulary::person} 记忆中更小。对于去过 {@bt_far_place|::subscribed_books::vocabulary::place} 的人，故乡总是如此。"
# 希腊悲剧
"{@bt_hero|::subscribed_books::vocabulary::person} did not yet know what the matter of {::subscribed_books::plot_vocabulary::cause} would cost. No one ever does, at the beginning." = "{@bt_hero|::subscribed_books::vocabulary::person} 尚不知道{::subscribed_books::plot_vocabulary::cause}这件事会带来怎样的代价。故事刚开始时，从来没有人知道。"
"The gods, if they were watching {@bt_place|::subscribed_books::vocabulary::place} that year, kept their counsel about {::subscribed_books::plot_vocabulary::cause}." = "那一年，诸神若曾注视 {@bt_place|::subscribed_books::vocabulary::place}，也始终没有对{::subscribed_books::plot_vocabulary::cause}透露半点天机。"
"{@bt_hero|::subscribed_books::vocabulary::person} was sure of it now: whatever it took, {@bt_hero2|::subscribed_books::vocabulary::person} would {::subscribed_books::plot_vocabulary::goal}. The ones who warned otherwise were not listened to." = "{@bt_hero|::subscribed_books::vocabulary::person} 此时深信不疑：无论付出什么，{@bt_hero2|::subscribed_books::vocabulary::person} 都要{::subscribed_books::plot_vocabulary::goal}。那些提出警告的人，没有得到倾听。"
"Pride made the next choice for {@bt_hero|::subscribed_books::vocabulary::person}. To {::subscribed_books::plot_vocabulary::goal}, any price seemed small, and the price had not yet been named." = "骄傲替 {@bt_hero|::subscribed_books::vocabulary::person} 作出了下一个选择。为了{::subscribed_books::plot_vocabulary::goal}，任何代价似乎都微不足道，而那代价尚未揭晓。"
"Every step toward {::subscribed_books::plot_vocabulary::stake} seemed to go well, and {@bt_foe|::subscribed_books::vocabulary::person} seemed to be losing. That should have been the warning." = "每一步都顺利地接近{::subscribed_books::plot_vocabulary::stake}，{@bt_foe|::subscribed_books::vocabulary::person} 似乎节节败退。这本该就是警讯。"
"{@bt_foe|::subscribed_books::vocabulary::person} gave ground, a little at a time, and {@bt_hero|::subscribed_books::vocabulary::person} took it, never asking why it was so easy." = "{@bt_foe|::subscribed_books::vocabulary::person} 一点点退让，{@bt_hero|::subscribed_books::vocabulary::person} 一步步进逼，却从未想过为何如此容易。"
"Then everything turned. What {@bt_hero|::subscribed_books::vocabulary::person} had taken for victory over {@bt_foe|::subscribed_books::vocabulary::person} was the trap itself, closing." = "随后，一切急转直下。{@bt_hero|::subscribed_books::vocabulary::person} 自以为战胜 {@bt_foe|::subscribed_books::vocabulary::person} 的胜利，恰恰就是正在合拢的陷阱。"
"In one evening the story reversed. {@bt_foe|::subscribed_books::vocabulary::person} had been ahead all along, and {::subscribed_books::plot_vocabulary::stake} had never been as close as it looked." = "一夜之间，故事发生了逆转。{@bt_foe|::subscribed_books::vocabulary::person} 始终占据先机，而{::subscribed_books::plot_vocabulary::stake}从未像看上去那样触手可及。"
"{@bt_hero|::subscribed_books::vocabulary::person} saw it at last -- what {@bt_foe|::subscribed_books::vocabulary::person} had done, and what {@bt_hero2|::subscribed_books::vocabulary::person} had done in answer, and that the two were not so different." = "{@bt_hero|::subscribed_books::vocabulary::person} 终于看清了：{@bt_foe|::subscribed_books::vocabulary::person} 做过什么，{@bt_hero2|::subscribed_books::vocabulary::person} 又如何回应，而双方的所作所为其实并没有那么不同。"
"The truth arrived too late to be of use, as it does in all such stories: {@bt_hero|::subscribed_books::vocabulary::person} had helped {@bt_foe|::subscribed_books::vocabulary::person} at every turn." = "如同所有这类故事，真相来得太迟，已于事无补：{@bt_hero|::subscribed_books::vocabulary::person} 的每一步，都在帮助 {@bt_foe|::subscribed_books::vocabulary::person}。"
"It ended where it had always been going to end, over {::subscribed_books::plot_vocabulary::stake}, with {@bt_foe|::subscribed_books::vocabulary::person} and {@bt_hero|::subscribed_books::vocabulary::person} and nowhere left to stand." = "故事在注定的终点落幕：为了{::subscribed_books::plot_vocabulary::stake}，{@bt_foe|::subscribed_books::vocabulary::person} 与 {@bt_hero|::subscribed_books::vocabulary::person} 走到了再无立足之地的境地。"
"There was no avoiding it now. Everything that had happened since {@bt_place|::subscribed_books::vocabulary::place} came down on a single hour." = "如今已无可逃避。自 {@bt_place|::subscribed_books::vocabulary::place} 以来发生的一切，都压在了这一个时辰里。"
"Afterwards, {@bt_place|::subscribed_books::vocabulary::place} counted what the matter of {::subscribed_books::plot_vocabulary::stake} had cost, and could not make the numbers come out right." = "后来，{@bt_place|::subscribed_books::vocabulary::place} 的人们清点为{::subscribed_books::plot_vocabulary::stake}付出的代价，却怎么也算不明白这笔账。"
"The ones who were left went home from {@bt_far_place|::subscribed_books::vocabulary::place} by different roads, and did not speak of {::subscribed_books::plot_vocabulary::stake} again." = "留下来的人各走各的路，从 {@bt_far_place|::subscribed_books::vocabulary::place} 返回家乡，此后再也没有提起{::subscribed_books::plot_vocabulary::stake}。"
# 喜剧
"Nobody in {@bt_place|::subscribed_books::vocabulary::place} thought the matter of {::subscribed_books::plot_vocabulary::cause} would amount to anything." = "{@bt_place|::subscribed_books::vocabulary::place} 没有人以为{::subscribed_books::plot_vocabulary::cause}这件事能闹出什么名堂。"
"It was a small thing, as these things go. {@bt_hero|::subscribed_books::vocabulary::person} was sure it could be put right by morning." = "说起来，这不过是件小事。{@bt_hero|::subscribed_books::vocabulary::person} 确信，天亮前就能摆平。"
"By now nobody was entirely sure who knew what about {::subscribed_books::plot_vocabulary::stake}, least of all {@bt_hero|::subscribed_books::vocabulary::person}." = "到了这时，关于{::subscribed_books::plot_vocabulary::stake}，谁知道什么已经没人能说得清，最糊涂的莫过于 {@bt_hero|::subscribed_books::vocabulary::person}。"
"{@bt_foe|::subscribed_books::vocabulary::person} heard one version of events, {@bt_ally|::subscribed_books::vocabulary::person} heard another, and {@bt_hero|::subscribed_books::vocabulary::person} somehow ended up explaining both." = "{@bt_foe|::subscribed_books::vocabulary::person} 听到一种说法，{@bt_ally|::subscribed_books::vocabulary::person} 听到另一种，不知怎么，最后两种都得由 {@bt_hero|::subscribed_books::vocabulary::person} 来解释。"
"Every attempt to {::subscribed_books::plot_vocabulary::goal} made matters worse, and {@bt_foe|::subscribed_books::vocabulary::person} was beginning to notice." = "每次试图{::subscribed_books::plot_vocabulary::goal}，事情都会变得更糟，而 {@bt_foe|::subscribed_books::vocabulary::person} 也开始察觉了。"
"The matter of {::subscribed_books::plot_vocabulary::cause} had grown from a problem into a situation, and was well on its way to becoming a legend." = "{::subscribed_books::plot_vocabulary::cause}这件事，已经从一个麻烦变成了一场风波，而且眼看就要变成传奇了。"
"Words ran out at about the same time as patience, and {::subscribed_books::plot_vocabulary::cause} was settled, briefly, with fists." = "话说尽的时候，耐心也恰好耗尽。于是，{::subscribed_books::plot_vocabulary::cause}暂时靠拳头解决了。"
"Someone threw the first punch over {::subscribed_books::plot_vocabulary::cause}. Nobody afterwards would admit to it." = "为了{::subscribed_books::plot_vocabulary::cause}，有人挥出了第一拳。事后却谁也不肯承认。"
"By nightfall half of {@bt_place|::subscribed_books::vocabulary::place} was involved in the matter of {::subscribed_books::plot_vocabulary::cause}, and the other half was selling refreshments." = "到了夜幕降临，{@bt_place|::subscribed_books::vocabulary::place} 的一半人卷进了{::subscribed_books::plot_vocabulary::cause}这场风波，另一半则在兜售茶点。"
"It was at this point, with {@bt_foe|::subscribed_books::vocabulary::person} shouting and {@bt_ally|::subscribed_books::vocabulary::person} hiding, that {@bt_hero|::subscribed_books::vocabulary::person} had an idea." = "就在此时，{@bt_foe|::subscribed_books::vocabulary::person} 还在叫嚷，{@bt_ally|::subscribed_books::vocabulary::person} 还在躲藏，{@bt_hero|::subscribed_books::vocabulary::person} 想到了一个主意。"
"In the end the matter of {::subscribed_books::plot_vocabulary::cause} came apart the way it had come together: all at once, and to everyone's surprise." = "最后，{::subscribed_books::plot_vocabulary::cause}这场风波散去的方式与兴起时一样：突如其来，出乎所有人的意料。"
"Somehow, against all reason, it worked out. {@bt_hero|::subscribed_books::vocabulary::person} would spend years trying to explain how." = "不知怎的，完全不合情理地，事情居然解决了。{@bt_hero|::subscribed_books::vocabulary::person} 后来花了许多年，试图解释这究竟是怎么办到的。"
# 复仇故事
"{@bt_hero|::subscribed_books::vocabulary::person} was there when it was over, and saw what {@bt_foe|::subscribed_books::vocabulary::person} had left behind." = "一切结束时，{@bt_hero|::subscribed_books::vocabulary::person} 就在那里，亲眼看到了 {@bt_foe|::subscribed_books::vocabulary::person} 留下的残局。"
"The wrong was done, and {@bt_foe|::subscribed_books::vocabulary::person} did not trouble to hide it." = "恶行已然犯下，{@bt_foe|::subscribed_books::vocabulary::person} 甚至不屑掩饰。"
"{@bt_hero|::subscribed_books::vocabulary::person} made a promise that night, to no one in particular: {@bt_foe|::subscribed_books::vocabulary::person} would answer for {::subscribed_books::plot_vocabulary::cause}." = "那一夜，{@bt_hero|::subscribed_books::vocabulary::person} 对着无人之处许下誓言：{@bt_foe|::subscribed_books::vocabulary::person} 必须为{::subscribed_books::plot_vocabulary::cause}付出代价。"
"There was no oath, no ceremony. {@bt_hero|::subscribed_books::vocabulary::person} simply decided, and the deciding was harder than any oath." = "没有誓言，也没有仪式。{@bt_hero|::subscribed_books::vocabulary::person} 只是作出了决定，而作出这个决定，比任何誓言都要艰难。"
"{@bt_hero|::subscribed_books::vocabulary::person} spent the seasons that followed getting ready -- learning where {@bt_foe|::subscribed_books::vocabulary::person} slept, whom {@bt_foe2|::subscribed_books::vocabulary::person} trusted, and what {@bt_foe3|::subscribed_books::vocabulary::person} feared." = "此后的几个季节，{@bt_hero|::subscribed_books::vocabulary::person} 一直在做准备：查明 {@bt_foe|::subscribed_books::vocabulary::person} 住在哪里，{@bt_foe2|::subscribed_books::vocabulary::person} 信任谁，以及 {@bt_foe3|::subscribed_books::vocabulary::person} 害怕什么。"
"Patience was the first weapon {@bt_hero|::subscribed_books::vocabulary::person} learned to use. The others came later, one at a time, with {@bt_foe|::subscribed_books::vocabulary::person} in mind." = "耐心是 {@bt_hero|::subscribed_books::vocabulary::person} 学会使用的第一件武器。其余的后来才一一学会，而心里始终想着 {@bt_foe|::subscribed_books::vocabulary::person}。"
"The trail of {@bt_foe|::subscribed_books::vocabulary::person} led from {@bt_place|::subscribed_books::vocabulary::place} to {@bt_far_place|::subscribed_books::vocabulary::place}. {@bt_hero|::subscribed_books::vocabulary::person} followed it the way water follows a crack in stone." = "{@bt_foe|::subscribed_books::vocabulary::person} 的踪迹从 {@bt_place|::subscribed_books::vocabulary::place} 延伸到 {@bt_far_place|::subscribed_books::vocabulary::place}。{@bt_hero|::subscribed_books::vocabulary::person} 沿着踪迹追去，如同流水顺着石缝前行。"
"Every rumor of {@bt_foe|::subscribed_books::vocabulary::person} sent {@bt_hero|::subscribed_books::vocabulary::person} somewhere new. Most of them led nowhere. One of them did not." = "每一条关于 {@bt_foe|::subscribed_books::vocabulary::person} 的传闻，都让 {@bt_hero|::subscribed_books::vocabulary::person} 奔赴一个新地方。大多数都毫无结果。其中一条却不同。"
"At {@bt_far_place|::subscribed_books::vocabulary::place}, {@bt_hero|::subscribed_books::vocabulary::person} found {@bt_foe|::subscribed_books::vocabulary::person} at last, and neither of them was surprised." = "在 {@bt_far_place|::subscribed_books::vocabulary::place}，{@bt_hero|::subscribed_books::vocabulary::person} 终于找到了 {@bt_foe|::subscribed_books::vocabulary::person}。双方都没有感到意外。"
"It had been a long road to this room at {@bt_far_place|::subscribed_books::vocabulary::place}. {@bt_foe|::subscribed_books::vocabulary::person} was in it, and so, now, was {@bt_hero|::subscribed_books::vocabulary::person}." = "抵达 {@bt_far_place|::subscribed_books::vocabulary::place} 的这间屋子，走过了漫长的路。{@bt_foe|::subscribed_books::vocabulary::person} 在屋里，而此刻，{@bt_hero|::subscribed_books::vocabulary::person} 也在。"
"When it was over, the matter of {::subscribed_books::plot_vocabulary::cause} was finished, one way or another, and {@bt_hero|::subscribed_books::vocabulary::person} had to learn how to live without it." = "一切结束后，{::subscribed_books::plot_vocabulary::cause}这件事终究有了了结，而 {@bt_hero|::subscribed_books::vocabulary::person} 必须学会，在它不再存在的日子里如何生活。"
"Vengeance, {@bt_hero|::subscribed_books::vocabulary::person} found, leaves a quiet behind it. It is not the quiet anyone hopes for." = "{@bt_hero|::subscribed_books::vocabulary::person} 发现，复仇过后会留下一片寂静。那并非任何人所期望的寂静。"
