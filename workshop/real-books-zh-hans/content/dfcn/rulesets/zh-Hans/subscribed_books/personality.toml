"{@bt_a|::subscribed_books::vocabulary::person} struck to wound, not to kill, again and again, until wounding became its own kind of message." = "{@bt_a|::subscribed_books::vocabulary::person}一次次攻击，只为致伤，不为致死，直到伤害本身成为一种讯息。"
