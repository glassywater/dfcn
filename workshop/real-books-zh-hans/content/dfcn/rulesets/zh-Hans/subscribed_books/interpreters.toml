[rulesets.rules]
"In {year1}, an agreement was formed at {@bt_site|::subscribed_books::interpreters::place}. The terms were specific, the intentions were clear, and the consequences would unfold over time. Such agreements were the invisible architecture of civilization -- unseen by most, load-bearing for all." = "{year1}年，一项协议在{@bt_site|::subscribed_books::interpreters::place}缔结。条款明确，意图清晰，后果将随时间展开。这类协议是文明无形的结构——多数人看不见，却为所有人承重。"

