# 声明内生成变化的规范形变体；原作者句式保留。
[[rulesets]]
[rulesets.rules]
"Thunder rolled somewhere distant, punctual as a omen." = "远处雷声滚动，如预兆般准时。"
"This was not a beginning, and not quite a ending. It was the hinge between them." = "这不是开始，也算不上结束，而是两者之间的枢纽。"
"The doubt that had haunted every step vanished in a instant." = "伴随每一步的疑虑在刹那间消散。"
"What had seemed impossible a hour ago was now simply true." = "一小时前似乎不可能的事，如今已是事实。"
"The animals had gone quiet a hour ago, and had not started again." = "动物一个小时前就不再出声，此后也未恢复。"
"It was, by any honest measure, a accomplishment." = "用任何诚实的标准衡量，这都是成就。"
"It happened in a instant, and changed everything after it." = "它发生在一瞬，改变了此后的一切。"
"There was a before, and now there was a after, and nothing bridged them." = "曾经有一个“之前”，如今有一个“之后”，两者之间再无桥梁。"
"It was not a wound. It was closer to a amputation." = "这不是伤口，更像是截肢。"
"Everything that had been certain became, in a instant, uncertain." = "一切确定的事，转眼间都变得不确定。"
"This was not a accident. It was a consequence." = "这不是意外，而是后果。"
"It was a ordinary day, and ordinary days are underrated." = "这是平常的一天，而平常的一天常被低估。"
"Tenderness, in a world this harsh, was a act of courage." = "在如此严酷的世界里，温柔是一种勇气。"
"What seemed like a accident had been carefully arranged to look like one." = "看似意外的事，被精心安排成了意外的模样。"
"The taste in {@bt_a|::subscribed_books::vocabulary::person}'s mouth was familiar. Bitterness had become a old companion." = "{@bt_a|::subscribed_books::vocabulary::person}口中的味道很熟悉。苦涩已成老友。"
"{@bt_a|::subscribed_books::vocabulary::person} pressed forward, because stopping was no longer a option {@bt_a2|::subscribed_books::vocabulary::person} allowed." = "{@bt_a|::subscribed_books::vocabulary::person}继续向前，因为{@bt_a2|::subscribed_books::vocabulary::person}再不允许停下这个选项。"
"It felt less like a ending and more like a absence." = "与其说是结束，更像是缺席。"
"The question did not have a easy answer, and there was time to sit with that." = "这个问题没有简单答案，而现在有时间与它相处。"
"It was worth thinking about, slowly, without hurrying toward a answer." = "这值得慢慢思考，不急着寻找答案。"
"It was worth sitting with the discomfort of a open question." = "未解的问题令人不适，却值得静静面对。"
"Nothing here demanded a answer immediately." = "这里没有什么要求立即作答。"
"In the darkest moments, help came from a unexpected quarter." = "最黑暗的时刻，帮助来自意料之外。"
"Everything that could go wrong did. some things went wrong that no one had even considered possible." = "所有可能出错的事都出了错。接着，连没人想过可能的事也出了错。"
"It began with a act of cruelty that would define the rest of this story." = "开端是一件残酷之事，它将定义这个故事的其余部分。"
"There was a ease between them that neither had to work for." = "他们之间有一种无需费力的自在。"
"But {@bt_proto|::subscribed_books::vocabulary::person} was not alone. In the darkest stretch of the road, help came from a unexpected quarter -- a reminder that even in a hostile world, solidarity existed." = "但{@bt_proto|::subscribed_books::vocabulary::person}并不孤单。在道路最黑暗的一段，援助来自意料之外，提醒着人：即便世界充满敌意，团结仍然存在。"
"Something was wrong. {@bt_proto|::subscribed_books::vocabulary::person} was the first to notice -- a detail out of place, a question without a answer, a shadow where there should have been light." = "有什么不对。{@bt_proto|::subscribed_books::vocabulary::person}最先留意到，一个不合适的细节，一个无解的问题，一道本该有光的地方出现的阴影。"
"{@bt_proto|::subscribed_books::vocabulary::person} had gotten too close to the truth. {@bt_antag|::subscribed_books::vocabulary::person} struck first -- a ambush meant to silence the investigation permanently. But {@bt_proto2|::subscribed_books::vocabulary::person} was not so easily silenced." = "{@bt_proto|::subscribed_books::vocabulary::person}接近真相太过。{@bt_antag|::subscribed_books::vocabulary::person}抢先出手，意在通过伏击永久终止调查。但{@bt_proto2|::subscribed_books::vocabulary::person}没那么容易被封口。"
"Let the words rise. Let them carry what cannot be carried in silence. This is a invocation -- a calling-forth of something worth remembering." = "让话语升起，让它们承载沉默所不能承载之物。这是祈请，召来值得铭记的东西。"
", veins of metal twisted like roots of a ancient tree" = "，金属纹路扭曲如古树之根"
", regarded as a extension of self, never truly leaving one's side" = "，被视作自身的延伸，从未真正离开身边"
"{@bt_proto|::subscribed_books::vocabulary::person}'s story took a unexpected turn along the way. The reader may not be able to predict its direction from these opening pages." = "{@bt_proto|::subscribed_books::vocabulary::person}的故事途中出现意外转折。读者也许无法从这些开篇预测它的方向。"

