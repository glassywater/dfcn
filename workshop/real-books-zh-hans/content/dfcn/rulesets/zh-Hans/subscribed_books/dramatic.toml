"{::subscribed_books::speech::religion::entity} will {::subscribed_books::speech::religion::action} {::subscribed_books::speech::religion::object} only when conscience, not your wrath, demands it." = "唯有良知要求，而非你的怒火要求时，{::subscribed_books::speech::religion::entity}才会{::subscribed_books::speech::religion::action}{::subscribed_books::speech::religion::object}。"
"Empty rites are not faith, and {::subscribed_books::speech::religion::entity} know this far better than you." = "空洞仪式不是信仰，{::subscribed_books::speech::religion::entity}比你更懂。"
