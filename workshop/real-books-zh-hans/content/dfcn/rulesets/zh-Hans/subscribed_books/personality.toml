"{@bt_a|::subscribed_books::vocabulary::person} slammed {pos1} fist on the table. The room went silent." = "{@bt_a|::subscribed_books::vocabulary::person}把{pos1}拳头重重砸在桌上。屋内顿时鸦雀无声。"
"{@bt_a|::subscribed_books::vocabulary::person} stood so abruptly that the bench toppled behind {pro1}." = "{@bt_a|::subscribed_books::vocabulary::person}猛然起身，{pro1}身后的长凳随之翻倒。"
"{@bt_a|::subscribed_books::vocabulary::person} advanced on {@bt_b|::subscribed_books::vocabulary::person}, finger jabbing the air like a weapon." = "{@bt_a|::subscribed_books::vocabulary::person}逼近{@bt_b|::subscribed_books::vocabulary::person}，手指像武器一样刺向空中。"
"\"Enough!\" {@bt_a|::subscribed_books::vocabulary::person} roared. \"I will hear no more of this!\"" = "“够了！”{@bt_a|::subscribed_books::vocabulary::person}怒吼，“这种话我一句也不想再听！”"
"\"You dare speak to me that way?\" {@bt_a|::subscribed_books::vocabulary::person} snarled. \"Choose your next words carefully.\"" = "“你竟敢这样跟我说话？”{@bt_a|::subscribed_books::vocabulary::person}咆哮道，“接下来开口之前，最好想清楚。”"
"\"This is not a discussion,\" {@bt_a|::subscribed_books::vocabulary::person} said, voice dropping to something dangerous. \"This is a warning.\"" = "“这不是商量，”{@bt_a|::subscribed_books::vocabulary::person}压低声音，语气透出危险，“这是警告。”"
"The anger came fast, as it always did. {@bt_a|::subscribed_books::vocabulary::person} had never learned to hold it back -- had never wanted to." = "怒火一如既往地骤然涌起。{@bt_a|::subscribed_books::vocabulary::person}从未学会克制，也从未想过要克制。"
"{@bt_a|::subscribed_books::vocabulary::person} drew {pos1} weapon without hesitation. The time for words was over." = "{@bt_a|::subscribed_books::vocabulary::person}毫不犹豫地拔出{pos1}武器。言语已无用处。"
"{@bt_a|::subscribed_books::vocabulary::person} charged. There was no strategy in it, no calculation -- only fury." = "{@bt_a|::subscribed_books::vocabulary::person}冲了上去。这一击没有策略，没有算计，只有怒火。"
"\"Then we settle this the old way,\" {@bt_a|::subscribed_books::vocabulary::person} said, and there was something almost like relief in {pos1} voice." = "“那就用老办法解决，”{@bt_a|::subscribed_books::vocabulary::person}说道，{pos1}声音里竟隐约透着一丝释然。"
"{@bt_a|::subscribed_books::vocabulary::person} did not laugh. {pos1} expression made it clear that humor was not welcome." = "{@bt_a|::subscribed_books::vocabulary::person}没有笑。{pos1}表情已清楚表明，此刻不欢迎玩笑。"
"\"You think this is funny?\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I do not.\"" = "“你觉得这很好笑？”{@bt_a|::subscribed_books::vocabulary::person}说道，“我可不觉得。”"
"{@bt_a|::subscribed_books::vocabulary::person} spoke with the force of someone accustomed to being obeyed." = "{@bt_a|::subscribed_books::vocabulary::person}说话时带着惯于发号施令之人的威势。"
"\"This is not a suggestion,\" {@bt_a|::subscribed_books::vocabulary::person} said, voice hard as iron." = "“这不是建议，”{@bt_a|::subscribed_books::vocabulary::person}说道，声音坚硬如铁。"
"\"I have made my decision,\" {@bt_a|::subscribed_books::vocabulary::person} announced. \"I will hear no argument on this.\"" = "“我已经决定了，”{@bt_a|::subscribed_books::vocabulary::person}宣布，“此事不容争辩。”"
"\"We act now, or we pay the price later,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"The choice is simple.\"" = "“要么现在行动，要么以后付出代价，”{@bt_a|::subscribed_books::vocabulary::person}说道，“选择很简单。”"
"{@bt_a|::subscribed_books::vocabulary::person} went very still. The kind of still that preceded violence." = "{@bt_a|::subscribed_books::vocabulary::person}忽然一动不动。那是暴力爆发前的寂静。"
"The color drained from {@bt_a|::subscribed_books::vocabulary::person}'s face, then returned as a deep, dangerous flush." = "{@bt_a|::subscribed_books::vocabulary::person}的脸色先是一片惨白，继而涨得通红，透出危险的怒意。"
"\"You,\" {@bt_a|::subscribed_books::vocabulary::person} whispered, and the single word carried more menace than any shout." = "“你……”{@bt_a|::subscribed_books::vocabulary::person}低声说道，仅这一个字就比任何怒吼都更具威胁。"
"{@bt_a|::subscribed_books::vocabulary::person} accepted the gift with a curt nod. Gratitude did not come naturally." = "{@bt_a|::subscribed_books::vocabulary::person}简短地点头，收下礼物。表达谢意向来不是容易的事。"
"\"I will remember this,\" {@bt_a|::subscribed_books::vocabulary::person} said. It sounded more like a promise than a thank-you." = "“我会记住的，”{@bt_a|::subscribed_books::vocabulary::person}说道。这听起来更像一个承诺，而非一句感谢。"
"{@bt_a|::subscribed_books::vocabulary::person} listened with narrowed eyes. {pro1} was not easily deceived." = "{@bt_a|::subscribed_books::vocabulary::person}眯起眼睛听着。{pro1}不是容易受骗的人。"
"\"Do you take me for a fool?\" {@bt_a|::subscribed_books::vocabulary::person} asked. The answer would determine what happened next." = "“你把我当傻子吗？”{@bt_a|::subscribed_books::vocabulary::person}问道。这个问题的答案将决定接下来发生什么。"
"{@bt_a|::subscribed_books::vocabulary::person} was uncomfortable with tenderness. {pro1} showed affection the only way {pro2} knew how -- through fierce, possessive loyalty." = "{@bt_a|::subscribed_books::vocabulary::person}不习惯温柔。{pro1}表达感情时，只会用{pro2}熟悉的方式：强烈而充满占有欲的忠诚。"
"\"I am not good with words,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"But I would fight the world for you. That should be enough.\"" = "“我不擅长说话，”{@bt_a|::subscribed_books::vocabulary::person}说道，“但我愿为你与整个世界为敌。这样总该够了。”"
"{@bt_a|::subscribed_books::vocabulary::person} grabbed the thief by the collar before anyone else could react." = "其他人还没反应过来，{@bt_a|::subscribed_books::vocabulary::person}就一把揪住了小偷的衣领。"
"\"Return what you took,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"or I will take something of yours.\"" = "“把偷走的东西还回来，”{@bt_a|::subscribed_books::vocabulary::person}说道，“否则我就拿走你的一样东西。”"
"{@bt_a|::subscribed_books::vocabulary::person} saw through the disguise immediately. Or perhaps {pro1} simply did not care who was behind the mask." = "{@bt_a|::subscribed_books::vocabulary::person}立刻识破了伪装。也许{pro1}根本不在乎面具后面是谁。"
"\"I know who you are,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"And I know what you are doing. Stop.\"" = "“我知道你是谁，”{@bt_a|::subscribed_books::vocabulary::person}说道，“也知道你在做什么。停下。”"
"{@bt_a|::subscribed_books::vocabulary::person} watched with the intense focus of someone cataloguing threats." = "{@bt_a|::subscribed_books::vocabulary::person}全神贯注地观察，仿佛正逐一清点潜在的威胁。"
"Every event was a potential challenge. {@bt_a|::subscribed_books::vocabulary::person} assessed it accordingly." = "每件事都可能是一场挑战。{@bt_a|::subscribed_books::vocabulary::person}也以这样的眼光评估眼前的事。"
"{@bt_a|::subscribed_books::vocabulary::person} reacted instantly, shoving people aside to reach the source of the commotion." = "{@bt_a|::subscribed_books::vocabulary::person}立刻作出反应，推开众人，直奔骚动的源头。"
"\"Move!\" {@bt_a|::subscribed_books::vocabulary::person} barked. \"All of you, move!\"" = "“让开！”{@bt_a|::subscribed_books::vocabulary::person}厉声喝道，“你们所有人，都让开！”"
"{@bt_a|::subscribed_books::vocabulary::person} fought with the controlled fury of someone who had been waiting for this." = "{@bt_a|::subscribed_books::vocabulary::person}带着克制的怒火作战，仿佛早就在等待这一刻。"
"{@bt_a|::subscribed_books::vocabulary::person} raised both hands, palms out, smiling despite everything." = "{@bt_a|::subscribed_books::vocabulary::person}举起双手，掌心朝外，即便如此仍面带微笑。"
"{@bt_a|::subscribed_books::vocabulary::person} leaned back and let {@bt_b|::subscribed_books::vocabulary::person} finish, wearing the patient expression of someone who had heard worse." = "{@bt_a|::subscribed_books::vocabulary::person}向后靠去，让{@bt_b|::subscribed_books::vocabulary::person}把话说完，神情耐心，仿佛更难听的话也早已听过。"
"\"Now, now,\" {@bt_a|::subscribed_books::vocabulary::person} said, grinning. \"Let's not say things we'll regret. Well, things I'll regret. You go ahead.\"" = "“好了，好了，”{@bt_a|::subscribed_books::vocabulary::person}笑着说，“别说日后会后悔的话。准确说，别说我会后悔的话。你倒是可以继续。”"
"\"I hear you,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I disagree completely, but I hear you. That counts for something, right?\"" = "“我听明白了，”{@bt_a|::subscribed_books::vocabulary::person}说道，“虽然完全不同意，但至少听明白了。这总算有点意义吧？”"
"\"An interesting position,\" {@bt_a|::subscribed_books::vocabulary::person} replied. \"Wrong, of course, but interesting.\"" = "“有意思的观点，”{@bt_a|::subscribed_books::vocabulary::person}答道，“当然是错的，不过很有意思。”"
"{@bt_a|::subscribed_books::vocabulary::person} found arguments more entertaining than threatening. Life was too short for real anger." = "{@bt_a|::subscribed_books::vocabulary::person}觉得争论更像消遣，而非威胁。人生如此短暂，何必真的动怒。"
"{@bt_a|::subscribed_books::vocabulary::person} laughed -- a real laugh, the kind that made others laugh too, even when they didn't want to." = "{@bt_a|::subscribed_books::vocabulary::person}大笑起来，那是真心的笑，连不想笑的人也会被感染。"
"\"That reminds me,\" {@bt_a|::subscribed_books::vocabulary::person} said, and launched into a story that was only tangentially related but somehow better." = "“这让我想起一件事，”{@bt_a|::subscribed_books::vocabulary::person}说道，随即讲起一个只稍有关联、却不知为何更精彩的故事。"
