base = "subscribed_books::music"

[[rulesets]]
[rulesets.rules]
# templates.lua MusicalComposition: all five perspectives.
"AN ANTHEM OF {@bt_e|::subscribed_books::vocabulary::entity}." = "{@bt_e|::subscribed_books::vocabulary::entity} 的颂歌。"
"To be performed with full chorus and {adj} accompaniment." = "由完整合唱团与{adj}伴奏演出。"
"Movement I: The Gathering." = "第一乐章：集结。"
"A {adj} anthem composed by {person} at {@bt_s|::subscribed_books::vocabulary::place}." = "{person} 在 {@bt_s|::subscribed_books::vocabulary::place} 创作的一首{adj}颂歌。"
"For voices and instruments." = "为人声与乐器而作。"
"OPENING: The horns sound." = "开场：号角响起。"
"The drums answer." = "鼓声回应。"
"This anthem, composed by {person} for the people of {@bt_e|::subscribed_books::vocabulary::entity}, is scored for full ensemble." = "这首由 {person} 为 {@bt_e|::subscribed_books::vocabulary::entity} 的人民所作的颂歌，采用完整乐队编制。"
"It opens with a {adj} fanfare that builds from a single sustained note into a wall of sound, representing the unity of a civilization rising from silence into purpose." = "它以{adj}号角乐开场，从一个持续音构筑成声音之墙，象征一个文明的团结，从沉默中升起，走向目标。"
"Movement, inspired by events of {@year}:" = "乐章，灵感来自 {@year} 年的事件："
"A mournful passage follows, marking the loss of {@bt_a|::subscribed_books::vocabulary::person} in {@year}." = "随后是悲哀的乐段，纪念 {@year} 年失去的 {@bt_a|::subscribed_books::vocabulary::person}。"
"The strings carry the melody downward." = "弦乐带着旋律下行。"
"{cause} is given voice in a descending {adj} motif." = "{cause} 通过一个下行的{adj}动机获得表达。"
"A bright, ascending passage celebrates the creation of {@bt_i|::subscribed_books::vocabulary::artifact} in {@year}." = "一段明亮、上行的乐段，庆祝 {@bt_i|::subscribed_books::vocabulary::artifact} 于 {@year} 年诞生。"
"The {adj} theme introduced here recurs throughout." = "这里引入的{adj}主题，贯穿全曲。"
"A stately passage accompanies the investiture of {@bt_a|::subscribed_books::vocabulary::person} as {role} in {@year}." = "一段庄严乐段，伴随 {@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年就任{role}。"
"Brass and percussion mark the formality." = "铜管与打击乐彰显仪式的庄重。"
"A triumphant passage marks the founding of {@bt_s|::subscribed_books::vocabulary::place} in {@year}." = "一段凯旋乐段，纪念 {@bt_s|::subscribed_books::vocabulary::place} 于 {@year} 年建立。"
"The full ensemble enters in {adj} unison." = "全体乐队加入{adj}齐奏。"
"A transitional passage reflects the events of {@year}." = "一段过渡乐段，映照 {@year} 年的事件。"
"The texture thins, then builds." = "织体先变稀疏，再逐渐丰满。"
"The movement resolves." = "乐章归于解决。"
"A held chord." = "一个持续的和弦。"
"Silence." = "寂静。"
"FINALE: The anthem returns to its opening theme, now {adj} and transformed." = "终曲：颂歌回到开篇主题，如今已变得{adj}，焕然一新。"
"The chorus enters." = "合唱加入。"
"The sound swells to a climax and fades." = "声音膨胀至高潮，然后渐渐消退。"
"Composed by {person} for {@bt_e|::subscribed_books::vocabulary::entity}." = "由 {person} 为 {@bt_e|::subscribed_books::vocabulary::entity} 作曲。"
"CODA: The anthem's opening motif returns one final time, {adj} and radiant, carried by the full chorus of {@bt_e|::subscribed_books::vocabulary::entity}." = "尾声：颂歌的开篇动机最后一次回归，{adj}而灿烂，由 {@bt_e|::subscribed_books::vocabulary::entity} 的完整合唱团唱出。"
"The instruments fall silent one by one until only a single voice remains, singing the name of {@bt_s|::subscribed_books::vocabulary::place} into the fading air." = "乐器逐一沉默，直到只剩一个声音，将 {@bt_s|::subscribed_books::vocabulary::place} 的名字唱入渐逝的空气。"
"Composed by {person}." = "作曲：{person}。"
"A DIRGE." = "一首葬歌。"
"For the fallen of {@bt_e|::subscribed_books::vocabulary::entity}." = "献给 {@bt_e|::subscribed_books::vocabulary::entity} 的逝者。"
"Scored for low strings and voice." = "为低音弦乐与人声谱写。"
"The music begins in silence." = "音乐从寂静开始。"
"This dirge, composed at {@bt_s|::subscribed_books::vocabulary::place} by {person}, is meant to be performed slowly, with {adj} solemnity." = "这首由 {person} 在 {@bt_s|::subscribed_books::vocabulary::place} 创作的葬歌，应以缓慢速度、{adj}庄严演奏。"
"The next passage, reflecting the sorrows of {@year}:" = "下一乐段，映照 {@year} 年的悲伤："
"The central passage mourns {@bt_a|::subscribed_books::vocabulary::person}, taken by {cause} in {@year}." = "核心乐段哀悼 {@bt_a|::subscribed_books::vocabulary::person}，于 {@year} 年被 {cause} 带走。"
"A solo voice carries the {adj} melody, unaccompanied." = "独唱无伴奏地唱出{adj}旋律。"
"A sustained passage of {adj} grief follows, reflecting the losses of {@year}." = "随后是一段持续的{adj}悲伤，映照 {@year} 年的损失。"
"The music pauses." = "音乐暂停。"
"Breath." = "呼吸。"
"Continue." = "继续。"
"The dirge fades to silence." = "葬歌渐渐消失于寂静。"
"No applause." = "没有掌声。"
"Only memory." = "只有记忆。"
"Composed by {person} for the dead of {@bt_e|::subscribed_books::vocabulary::entity}." = "由 {person} 为 {@bt_e|::subscribed_books::vocabulary::entity} 的亡者作曲。"
"A BALLAD-SONG." = "一首叙事歌曲。"
"The tale of {person}, set to music by a bard of {@bt_e|::subscribed_books::vocabulary::entity}." = "{person} 的故事，由 {@bt_e|::subscribed_books::vocabulary::entity} 的吟游诗人谱曲。"
"The singer begins with a single {adj} note." = "歌者以一个{adj}音符开始。"
"This musical ballad tells the story of {@bt_a|::subscribed_books::vocabulary::person} in melody and verse." = "这首叙事歌曲，用旋律与诗句讲述 {@bt_a|::subscribed_books::vocabulary::person} 的故事。"
"Composed at {@bt_s|::subscribed_books::vocabulary::place}." = "作于 {@bt_s|::subscribed_books::vocabulary::place}。"
"The next verse, covering the events of {@year}:" = "下一诗节，讲述 {@year} 年的事件："
"The ballad turns mournful: {@bt_a|::subscribed_books::vocabulary::person} falls to {cause} in {@year}." = "叙事歌曲转为哀伤：{@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年因 {cause} 倒下。"
"The melody drops to a minor key." = "旋律转入小调。"
"A bright passage celebrates {@bt_i|::subscribed_books::vocabulary::artifact}, created in {@year}." = "一段明亮乐段，庆祝于 {@year} 年创造的 {@bt_i|::subscribed_books::vocabulary::artifact}。"
"The {adj} melody lifts." = "{adj}旋律上扬。"
"A verse of pride: {@bt_a|::subscribed_books::vocabulary::person} becomes {role} in {@year}." = "一节自豪的诗歌：{@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年成为{role}。"
"The tempo quickens." = "速度加快。"
"A verse covers the events of {@year}." = "一节诗歌讲述 {@year} 年的事件。"
"The melody wanders, then finds its footing." = "旋律游走，随后找到落脚点。"
"(Instrumental interlude.)" = "（器乐间奏。）"
"The ballad ends on a held note." = "叙事歌曲以一个持续音结束。"
"The singer bows." = "歌者鞠躬。"
"A musical ballad of {@bt_e|::subscribed_books::vocabulary::entity}, composed by {person}." = "{@bt_e|::subscribed_books::vocabulary::entity} 的叙事歌曲，由 {person} 作曲。"
"A BATTLE MARCH of {@bt_e|::subscribed_books::vocabulary::entity}." = "{@bt_e|::subscribed_books::vocabulary::entity} 的战斗进行曲。"
"Composed for drums, brass, and the thunder of {adj} purpose." = "为鼓、铜管，以及{adj}目标的雷鸣而作。"
"The drums begin." = "鼓声响起。"
"This march, scored for military ensemble by {person}, is designed to be played on the move." = "这首由 {person} 为军乐队谱写的进行曲，适合行进中演奏。"
"Tempo: relentless." = "速度：毫不停歇。"
"Next movement, reflecting the campaigns of {@year}:" = "下一乐章，映照 {@year} 年的战役："
"A sudden silence marks the fall of {@bt_a|::subscribed_books::vocabulary::person} in {@year}." = "突如其来的寂静，标记 {@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年倒下。"
"Then the drums resume, harder, {adj}er." = "随后鼓声再次响起，更有力，更{adj}。"
"The march does not stop for the dead." = "进行曲不会为死者停下。"
"A victorious passage: {@bt_s|::subscribed_books::vocabulary::place} is taken and held in {@year}." = "胜利的乐段：{@bt_s|::subscribed_books::vocabulary::place} 于 {@year} 年被攻占并守住。"
"Brass fanfare." = "铜管号角乐。"
"The march continues through {@year}." = "进行曲贯穿 {@year} 年。"
"Steady." = "坚定。"
"Inexorable." = "不可阻挡。"
"{adj}." = "{adj}。"
"The cadence holds." = "节奏保持不变。"
"Left, right, left, right." = "左，右，左，右。"
"The march ends with three sharp beats." = "进行曲以三个鲜明节拍结束。"
"Then the army moves." = "随后军队前进。"
"Composed for the forces of {@bt_e|::subscribed_books::vocabulary::entity} by {person}." = "由 {person} 为 {@bt_e|::subscribed_books::vocabulary::entity} 的军队作曲。"
"A LULLABY." = "一首摇篮曲。"
"For the children of {@bt_e|::subscribed_books::vocabulary::entity}." = "献给 {@bt_e|::subscribed_books::vocabulary::entity} 的孩子们。"
"Soft and {adj} and gentle." = "柔和、{adj}、温柔。"
"Hush now." = "安静吧。"
"The music begins like a whisper." = "音乐如低语般开始。"
"This lullaby, composed by {person} at {@bt_s|::subscribed_books::vocabulary::place}, is meant for quiet evenings and tired eyes." = "这首由 {person} 在 {@bt_s|::subscribed_books::vocabulary::place} 创作的摇篮曲，献给安静的夜晚与疲惫的双眼。"
"A {adj} lullaby for the smallest citizens of {@bt_e|::subscribed_books::vocabulary::entity}, composed by {person} at {@bt_s|::subscribed_books::vocabulary::place}." = "一首献给 {@bt_e|::subscribed_books::vocabulary::entity} 最小居民的{adj}摇篮曲，由 {person} 在 {@bt_s|::subscribed_books::vocabulary::place} 作曲。"
"The melody moves like a rocking cradle, slow and circular, each phrase returning to where it began." = "旋律如摇动的摇篮，缓慢而循环，每个乐句都回到起点。"
"Close your eyes." = "闭上眼睛。"
"Listen." = "听着。"
"The melody continues, soft as breath:" = "旋律继续，轻如呼吸："
"Even lullabies carry sorrow." = "就连摇篮曲也带着悲伤。"
"A gentle passage remembers {@bt_a|::subscribed_books::vocabulary::person}, lost in {@year}." = "一段温柔乐段，纪念于 {@year} 年离去的 {@bt_a|::subscribed_books::vocabulary::person}。"
"The melody does not break." = "旋律没有断裂。"
"It bends." = "它只是弯曲。"
"A tender passage evokes {@bt_i|::subscribed_books::vocabulary::artifact}, created in {@year}." = "一段柔情乐段，唤起于 {@year} 年创造的 {@bt_i|::subscribed_books::vocabulary::artifact}。"
"The {adj} beauty of small things." = "细小事物的{adj}美。"
"The music drifts through {@year} like a dream." = "音乐如梦一般，漂过 {@year} 年。"
"Nothing sharp." = "没有尖锐。"
"Nothing sudden." = "没有突兀。"
"Shh." = "嘘。"
"Sleep now." = "睡吧。"
"The lullaby fades." = "摇篮曲渐渐消退。"
"The child sleeps." = "孩子睡着了。"
"The world, for a moment, is at peace." = "世界暂时安宁。"
"The final note dissolves into the {adj} silence of a sleeping world." = "最后的音符，融入沉睡世界的{adj}寂静。"
"The lullaby is over, but its warmth lingers, like a hand on a small back, like a promise whispered in the dark." = "摇篮曲结束，温暖却仍停留，如一只轻抚小小背脊的手，如在黑暗中轻声许下的承诺。"

[[rulesets]]
name = "person"
[rulesets.rules]
"{::subscribed_books::vocabulary::person}" = "{::subscribed_books::vocabulary::person}"
[[rulesets]]
name = "adj"
[rulesets.rules]
"{::subscribed_books::adj}" = "{::subscribed_books::adj}"
[[rulesets]]
name = "role"
[rulesets.rules]
"{::subscribed_books::vocabulary::role}" = "{::subscribed_books::vocabulary::role}"
[[rulesets]]
name = "cause"
[rulesets.rules]
"{::subscribed_books::vocabulary::cause}" = "{::subscribed_books::vocabulary::cause}"
