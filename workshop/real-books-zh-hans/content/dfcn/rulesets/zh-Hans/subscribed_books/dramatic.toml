"How dare {::subscribed_books::speech::religion::entity} {::subscribed_books::speech::religion::action} {::subscribed_books::speech::religion::object} in the house of the faithful." = "{::subscribed_books::speech::religion::entity}怎敢在信众的殿堂{::subscribed_books::speech::religion::action}{::subscribed_books::speech::religion::object}？"
"{::subscribed_books::speech::religion::entity} have defiled {::subscribed_books::speech::religion::object}. There will be a price for it." = "{::subscribed_books::speech::religion::entity}玷污了{::subscribed_books::speech::religion::object}，必将付出代价。"
