[rulesets.rules]
"{beast}, {wildlife}" = "{beast}、{wildlife}"
"{beast} and {last_beast}" = "{beast}和{last_beast}"
"{beast}" = "{beast}"

[[rulesets]]
name = "beast"
[rulesets.rules]
"{::creatures::name}" = "{::creatures::name}"

[[rulesets]]
name = "last_beast"
[rulesets.rules]
"{beast}" = "{beast}"

[[rulesets]]
name = "place"
[rulesets.rules]
"{::subscribed_books::guide_vocabulary::inn}" = "{::subscribed_books::guide_vocabulary::inn}"
"{::subscribed_books::vocabulary::place}" = "{::subscribed_books::vocabulary::place}"

[[rulesets]]
name = "site"
[rulesets.rules]
"{::subscribed_books::vocabulary::place}" = "{::subscribed_books::vocabulary::place}"

[[rulesets]]
