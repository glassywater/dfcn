"I have not forgotten it, and I never will." = "我没有忘记，以后也绝不会忘记。"
"It puts me in mind of {value_word}, which I have thought about more than most things. \"{saying}\" I have found it true more often than not." = "这让我想起{value_word}；相较大多数事物，我对此思考得更多。“{saying}”依我的经历，这句话通常是对的。"
"It puts me in mind of {value_word}, which I have thought about more than most things." = "这让我想起{value_word}；相较大多数事物，我对此思考得更多。"
"\"{saying}\"" = "“{saying}”"
"I have found it true more often than not." = "依我的经历，这句话通常是对的。"

"And I will say this to {@bt_deity|::subscribed_books::vocabulary::person}, if {@bt_deity2|::subscribed_books::vocabulary::person} is listening: I have asked for less than most, and I have received it." = "如果{@bt_deity2|::subscribed_books::vocabulary::person}在听，我就要向{@bt_deity|::subscribed_books::vocabulary::person}说：我的所求比大多数人都少，所得也果真如此。"
"I have prayed to {@bt_deity|::subscribed_books::vocabulary::person} over smaller things than this. I am not sure {@bt_deity2|::subscribed_books::vocabulary::person} listens, but I am sure I am the better for asking." = "为比这更小的事，我也曾向{@bt_deity|::subscribed_books::vocabulary::person}祈祷。我不确定{@bt_deity2|::subscribed_books::vocabulary::person}是否聆听，但我确信，祈求本身便让我有所获益。"
"I have prayed to {@bt_deity|::subscribed_books::vocabulary::person} over smaller things than this." = "为比这更小的事，我也曾向{@bt_deity|::subscribed_books::vocabulary::person}祈祷。"
"I am not sure {@bt_deity|::subscribed_books::vocabulary::person} listens, but I am sure I am the better for asking." = "我不确定{@bt_deity|::subscribed_books::vocabulary::person}是否聆听，但我确信，祈求本身便让我有所获益。"
"And I will say this of {@bt_civ|::subscribed_books::vocabulary::entity}, since I am one of them: we forget our own too easily. We honour strangers and overlook the ones who built our halls." = "作为{@bt_civ|::subscribed_books::vocabulary::entity}的一员，我要说：我们太容易遗忘自己人了。我们尊崇外人，却忽视了为我们建起厅堂的人。"
"And I will say this of {@bt_civ|::subscribed_books::vocabulary::entity}, since I am one of them: we forget our own too easily." = "作为{@bt_civ|::subscribed_books::vocabulary::entity}的一员，我要说：我们太容易遗忘自己人了。"
