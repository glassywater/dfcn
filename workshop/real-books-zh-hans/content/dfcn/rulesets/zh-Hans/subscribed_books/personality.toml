"{@bt_a|::subscribed_books::vocabulary::person} confessed the impersonation to the very person it was meant to deceive, unprompted, out of sheer discomfort." = "纯粹因为不自在，{@bt_a|::subscribed_books::vocabulary::person}没等人问，就向本该受骗的那个人坦白了冒充之事。"
