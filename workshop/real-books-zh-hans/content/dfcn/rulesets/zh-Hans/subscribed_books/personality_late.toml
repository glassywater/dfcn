"{@bt_a|::subscribed_books::vocabulary::person} thanked {@bt_b|::subscribed_books::vocabulary::person} sincerely, then spent the walk home figuring out how to profit from the exchange." = "{@bt_a|::subscribed_books::vocabulary::person}真诚地感谢了{@bt_b|::subscribed_books::vocabulary::person}，然后在回家的路上一直琢磨如何从这次交换中获利。"
