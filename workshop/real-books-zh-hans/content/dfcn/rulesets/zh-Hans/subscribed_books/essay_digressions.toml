"I will not say either." = "我也不会说。"
"Working beside {@bt_other|::subscribed_books::vocabulary::person} taught me what I needed to know about working beside anyone." = "与{@bt_other|::subscribed_books::vocabulary::person}共事，让我明白了与任何人共事都该明白的道理。"

"And if anyone doubts what I say, let them look at what I have done." = "若有人怀疑我的话，就让他们看看我做过什么。"
"I mention it only because it is true, and because no one else will." = "我提起此事，只因为它是真的，也因为不会有别人提起。"
"I have lived a fuller life than most, and I see no reason to be shy about it." = "我的人生比大多数人更丰富，我觉得没有理由为此羞于开口。"

"And while I am speaking my mind, a word about {value_word}. \"{saying}\" People nod at that and then live as if they had never heard it. I have not forgotten it, and I never will." = "既然我正在直抒胸臆，就再说说{value_word}。“{saying}”人们听了点头，过起日子却像从未听过。我没有忘记，以后也绝不会忘记。"
