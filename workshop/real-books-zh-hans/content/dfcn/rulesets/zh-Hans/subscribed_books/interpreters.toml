[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person}, a {race}." = "{@bt_hero|::subscribed_books::interpreters::person}，{race}。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person}, a {race} born in the year {year1}." = "{@bt_hero|::subscribed_books::interpreters::person}，一位生于{year1}年的{race}。"

[[rulesets]]
[rulesets.rules]
"Known to be {tags}." = "以{tags}的性情闻名。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person} -- the same {race} from earlier in this account -- appeared once more." = "{@bt_hero|::subscribed_books::interpreters::person}——此前记述中出现过的那位{race}——再度现身。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person} was a {race}." = "{@bt_hero|::subscribed_books::interpreters::person}是{race}。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person} was an {race}." = "{@bt_hero|::subscribed_books::interpreters::person}是{race}。"

[[rulesets]]
[rulesets.rules]
"At the time, {@bt_hero|::subscribed_books::interpreters::person} was {n1} years old." = "那时，{@bt_hero|::subscribed_books::interpreters::person}已{n1}岁。"

[[rulesets]]
[rulesets.rules]
"Those who knew {@bt_hero|::subscribed_books::interpreters::person} described the {race} as {tags}." = "熟悉{@bt_hero|::subscribed_books::interpreters::person}的人形容这位{race}性情{tags}。"

[[rulesets]]
[rulesets.rules]
"Among {@bt_hero|::subscribed_books::interpreters::person}'s connections: {relations}." = "与{@bt_hero|::subscribed_books::interpreters::person}有关联的人包括：{relations}。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person} had held the following roles: {roles}." = "{@bt_hero|::subscribed_books::interpreters::person}曾担任以下职务：{roles}。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person} had {n1} recorded kills to {pos1} name." = "{@bt_hero|::subscribed_books::interpreters::person}名下记有{n1}次击杀，均归于{pos1}战绩。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person} had {n1} recorded kills to {pos1} name, including {persons}." = "{@bt_hero|::subscribed_books::interpreters::person}名下记有{n1}次击杀，均归于{pos1}战绩，其中包括{persons}。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person} had {n1} recorded kills since {pos1} last mention in this account." = "自上次在这部记述中提到{pos1}以来，{@bt_hero|::subscribed_books::interpreters::person}又留下了{n1}次有记录的击杀。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person} had {n1} recorded kills since {pos1} last mention in this account, including {persons}." = "自上次在这部记述中提到{pos1}以来，{@bt_hero|::subscribed_books::interpreters::person}又留下了{n1}次有记录的击杀，其中包括{persons}。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person} had been wounded {n1} time{plural} to {pos1} name." = "{@bt_hero|::subscribed_books::interpreters::person}有{n1}次{plural}受伤记在{pos1}经历之中。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person} had been wounded {n1} time{plural} since {pos1} last mention in this account." = "自上次在这部记述中提到{pos1}以来，{@bt_hero|::subscribed_books::interpreters::person}又受了{n1}次{plural}伤。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person} had created {n1} artifact{plural} of note." = "{@bt_hero|::subscribed_books::interpreters::person}曾创造出{n1}件{plural}著名神器。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person} possessed forbidden knowledge -- {n1} secret{plural} learned from sources best left unmentioned." = "{@bt_hero|::subscribed_books::interpreters::person}掌握着禁忌知识——从最好不要提及的来源学得的{n1}个{plural}秘密。"

[[rulesets]]
[rulesets.rules]
"But the story of {@bt_hero|::subscribed_books::interpreters::person} was far from over." = "但{@bt_hero|::subscribed_books::interpreters::person}的故事远未结束。"

[[rulesets]]
[rulesets.rules]
"This would not be the last time {@bt_hero|::subscribed_books::interpreters::person} would make {pos1} presence known." = "这不会是{@bt_hero|::subscribed_books::interpreters::person}最后一次让世人注意到{pos1}存在。"

[[rulesets]]
[rulesets.rules]
"The people had not seen the last of {@bt_hero|::subscribed_books::interpreters::person}. Not by a long measure." = "人们与{@bt_hero|::subscribed_books::interpreters::person}的缘分还远没有结束，远远没有。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person} was already dead by this point, having perished in the year {year1}." = "此时{@bt_hero|::subscribed_books::interpreters::person}已经死去，亡于{year1}年。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person}'s fate, in the end, was sealed. But that is a story for another time." = "{@bt_hero|::subscribed_books::interpreters::person}的命运终究已经注定，但那是留待以后再讲的故事。"

[[rulesets]]
[rulesets.rules]
"As of this writing, {@bt_hero|::subscribed_books::interpreters::person} endures." = "截至写下这段文字时，{@bt_hero|::subscribed_books::interpreters::person}仍然健在。"

[[rulesets]]
[rulesets.rules]
"The {race} returned. {@bt_hero|::subscribed_books::interpreters::person}, the same creature{from_ref}, appeared once more near {@bt_site|::subscribed_books::interpreters::place}. The people had feared this day. They had posted guards, strengthened fences, kept their animals close. None of it mattered." = "那只{race}回来了。{@bt_hero|::subscribed_books::interpreters::person}，{from_ref}的同一只生物，再度现身于{@bt_site|::subscribed_books::interpreters::place}附近。人们一直害怕这一天的到来，安排了守卫，加固了围栏，将牲畜留在身旁。但这一切都没有用。"

[[rulesets]]
[rulesets.rules]
# The two native from_ref suffixes must delimit the preceding place capture.
"It was {@bt_hero|::subscribed_books::interpreters::person} again. The {race} that had haunted {@bt_site|::subscribed_books::interpreters::place} from earlier in this account had come back, as the elders had warned it would. The creature was bolder now -- or perhaps just hungrier." = "又是{@bt_hero|::subscribed_books::interpreters::person}。本记述此前出现过、曾盘踞{@bt_site|::subscribed_books::interpreters::place}的那只{race}回来了，正如长者们警告过的那样。它如今更加大胆——或许只是更加饥饿。"
"It was {@bt_hero|::subscribed_books::interpreters::person} again. The {race} that had haunted {@bt_site|::subscribed_books::interpreters::place} from before had come back, as the elders had warned it would. The creature was bolder now -- or perhaps just hungrier." = "又是{@bt_hero|::subscribed_books::interpreters::person}。从前出现过、曾盘踞{@bt_site|::subscribed_books::interpreters::place}的那只{race}回来了，正如长者们警告过的那样。它如今更加大胆——或许只是更加饥饿。"

[[rulesets]]
[rulesets.rules]
"The nightmare that the people of {@bt_site|::subscribed_books::interpreters::place} had prayed was over had only been sleeping. {@bt_hero|::subscribed_books::interpreters::person}, the {race}{from_ref}, was back. And it was hungry." = "{@bt_site|::subscribed_books::interpreters::place}的人们曾祈祷噩梦就此结束，可噩梦只是睡着了。{@bt_hero|::subscribed_books::interpreters::person}，{from_ref}的那只{race}，又回来了。它正饥肠辘辘。"

[[rulesets]]
[rulesets.rules]
"The {race} known as {@bt_hero|::subscribed_books::interpreters::person} was no stranger to the lands around {@bt_site|::subscribed_books::interpreters::place}. It had prowled the outskirts for as long as anyone could remember, a shadow at the edge of firelight, a shape glimpsed between the trees. The people of {@bt_site2|::subscribed_books::interpreters::place} knew its name, and they spoke it with unease." = "名为{@bt_hero|::subscribed_books::interpreters::person}的{race}，早已熟悉{@bt_site|::subscribed_books::interpreters::place}周围的土地。人们记忆所及，它一直游荡在边缘地带，像火光尽头的阴影，像林木间一闪而过的身形。{@bt_site2|::subscribed_books::interpreters::place}的人们知道它的名字，提起时总带着不安。"

[[rulesets]]
[rulesets.rules]
"By the year {year1}, the creature was {n1} years old -- ancient by any measure, and all the more dangerous for the decades of hunting experience it had accumulated." = "到了{year1}年，这只生物已经{n1}岁——无论如何都算得上古老，而积累了数十年的狩猎经验，更使它危险无比。"

[[rulesets]]
[rulesets.rules]
"In {year1}, at {n1} years old, it was old enough to have outlived most of the settlers who first encountered it." = "{year1}年，它已{n1}岁，早已活过了最初遇见它的大多数定居者。"

[[rulesets]]
[rulesets.rules]
"At {n1} years old, the creature was in its prime -- strong, quick, and utterly without mercy." = "{n1}岁的它正值壮年——强壮、敏捷，而且毫无怜悯。"

[[rulesets]]
[rulesets.rules]
"Those who had observed the creature noted its {tags} nature." = "观察过这只生物的人，都注意到它{tags}的性情。"

[[rulesets]]
[rulesets.rules]
"Since its last appearance, {@bt_hero|::subscribed_books::interpreters::person} had struck {n1} more time{plural}." = "上次现身以来，{@bt_hero|::subscribed_books::interpreters::person}又发动了{n1}次{plural}袭击。"

[[rulesets]]
[rulesets.rules]
"Among the recent victims: {persons}." = "近期的受害者包括：{persons}。"

[[rulesets]]
[rulesets.rules]
"The creature was growing bolder." = "这只生物越来越大胆了。"

[[rulesets]]
[rulesets.rules]
"This was not the first time {@bt_hero|::subscribed_books::interpreters::person} had struck. The records of {@bt_site|::subscribed_books::interpreters::place} documented at least {n1} other incidents attributed to this same {race}." = "这并非{@bt_hero|::subscribed_books::interpreters::person}第一次袭击。{@bt_site|::subscribed_books::interpreters::place}的记录中，至少还有{n1}起事件归咎于这同一只{race}。"

[[rulesets]]
[rulesets.rules]
"Previous victims included {persons}." = "此前的受害者包括{persons}。"

[[rulesets]]
[rulesets.rules]
"The creature had become a persistent menace, a shadow that the people of {@bt_site|::subscribed_books::interpreters::place} could neither catch nor ignore." = "这只生物已成为挥之不去的威胁，像一道阴影，{@bt_site|::subscribed_books::interpreters::place}的人们既抓不住它，也无法忽视它。"

[[rulesets]]
[rulesets.rules]
"Whether this was the creature's first attack near {@bt_site|::subscribed_books::interpreters::place} or merely the first one recorded, no one could say. But the ease with which it struck suggested a predator well acquainted with the habits of the settlement." = "谁也说不清，这究竟是它第一次袭击{@bt_site|::subscribed_books::interpreters::place}附近，还是第一次被记录下来。但它袭击得如此轻易，显然早已熟知聚居地的生活规律。"

[[rulesets]]
[rulesets.rules]
"The victim was {creature}." = "受害者是{creature}。"

[[rulesets]]
[rulesets.rules]
"For the settlers of {@bt_site|::subscribed_books::interpreters::place}, the loss of even a single animal was no trivial matter. Every beast represented food, labor, or breeding stock -- resources that could not be easily replaced on the frontier." = "对{@bt_site|::subscribed_books::interpreters::place}的定居者而言，哪怕只失去一只牲畜，也绝非小事。每一只动物都意味着食物、劳力或种畜——这些资源在边疆都难以补充。"

[[rulesets]]
[rulesets.rules]
"It was only {creature}, some might say. But to the people of {@bt_site|::subscribed_books::interpreters::place}, whose survival depended on every animal they could keep alive through the winter, there was no such thing as \"only\" when it came to losses." = "有人也许会说，不过是{creature}罢了。可对{@bt_site|::subscribed_books::interpreters::place}的人们来说，每一只熬过冬天的动物都关乎生存，损失面前，根本没有“不过”二字。"

[[rulesets]]
[rulesets.rules]
"The creature was found -- what remained of it -- at the edge of the pasture. The {race} had eaten its fill and left the rest as a message, or perhaps simply as waste." = "人们在牧场边缘发现了那只动物——或者说，它残存的部分。那只{race}饱餐一顿，将余下的留作警告，也可能只是当作废物丢弃。"

[[rulesets]]
[rulesets.rules]
"The attack came in the year {year1}. {@bt_hero|::subscribed_books::interpreters::person} had crept close to {@bt_site|::subscribed_books::interpreters::place}, moving with the patience of a creature that has learned exactly how far it can push its luck. When it struck, it moved fast -- faster than anything that size had a right to move. {creature} never had a chance." = "袭击发生于{year1}年。{@bt_hero|::subscribed_books::interpreters::person}悄悄接近{@bt_site|::subscribed_books::interpreters::place}，耐心十足，仿佛早已摸清自己可以冒险到何种程度。发动袭击时，它快得惊人——快得不该属于那样庞大的身体。{creature}根本没有逃生的机会。"

[[rulesets]]
[rulesets.rules]
"It happened in {year1}. The details vary depending on who tells the story, but the outline is consistent: {@bt_hero|::subscribed_books::interpreters::person} appeared near {@bt_site|::subscribed_books::interpreters::place}, took {creature}, and vanished back into the wild before anyone could mount a response." = "事情发生在{year1}年。不同的人讲述时，细节各有出入，但大致经过相同：{@bt_hero|::subscribed_books::interpreters::person}出现在{@bt_site|::subscribed_books::interpreters::place}附近，抓走了{creature}，在人们来得及应对之前，就消失在荒野之中。"

[[rulesets]]
[rulesets.rules]
"In the year {year1}, {@bt_hero|::subscribed_books::interpreters::person} struck at {@bt_site|::subscribed_books::interpreters::place} with the brazenness of a creature that had stopped fearing the settlement's defenses. {creature} was seized and dragged away. By the time the alarm was raised, the {race} was gone, leaving only tracks, blood, and the growing conviction that something had to be done." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}肆无忌惮地袭击了{@bt_site|::subscribed_books::interpreters::place}，仿佛早已不再畏惧聚居地的防御。{creature}被抓住拖走。警报响起时，那只{race}已经离去，只留下足迹、鲜血，以及越来越强烈的念头：必须采取行动。"

[[rulesets]]
[rulesets.rules]
"Fear settled over {@bt_site|::subscribed_books::interpreters::place}. Children were kept indoors. Livestock was counted twice daily. Armed patrols walked the perimeter, jumping at shadows. {@bt_hero|::subscribed_books::interpreters::person} had reminded the people of something they preferred to forget: that the wilderness was not tame, and the walls of {@bt_site2|::subscribed_books::interpreters::place} were not as strong as they looked. Conversations turned to hunting parties, to bounties, to the question of whether this {race} could be killed at all." = "恐惧笼罩了{@bt_site|::subscribed_books::interpreters::place}。孩子被留在屋里，牲畜每天清点两次，武装巡逻队沿边界行走，见到影子都要惊跳。{@bt_hero|::subscribed_books::interpreters::person}提醒了人们一件他们宁愿忘记的事：荒野从未被驯服，而{@bt_site2|::subscribed_books::interpreters::place}的城墙也没有看起来那么坚固。谈论的话题转向猎捕队、悬赏，以及这只{race}究竟能不能被杀死。"

[[rulesets]]
[rulesets.rules]
"The people of {@bt_site|::subscribed_books::interpreters::place} gathered to decide what could be done. The young warriors spoke of tracking the {race} to its lair and ending the threat once and for all. The elders, who had seen such expeditions before, counseled patience and stronger fences. The argument went back and forth, as arguments in {@bt_site2|::subscribed_books::interpreters::place} always did, and in the end nothing was decided -- which was itself a decision, and not a good one." = "{@bt_site|::subscribed_books::interpreters::place}的人们聚在一起，商议对策。年轻战士主张追踪那只{race}到巢穴，一劳永逸地消除威胁。长者们见过这样的远征，劝大家耐心等待，先加固围栏。争论来来回回，就像{@bt_site2|::subscribed_books::interpreters::place}以往的争论一样，最终什么也没有决定——这本身也是一种决定，而且并不好。"

[[rulesets]]
[rulesets.rules]
"In the days that followed, {@bt_site|::subscribed_books::interpreters::place} was a changed place. The easy confidence that had characterized the settlement was gone, replaced by a wariness that touched everything -- the way people walked to the well, the way they counted their animals at dusk, the way they listened to the sounds of the night. {@bt_hero|::subscribed_books::interpreters::person} had not merely taken {creature}. The {race} had taken something more valuable: the illusion of safety." = "随后的日子里，{@bt_site|::subscribed_books::interpreters::place}变了。聚居地以往轻松的自信消失了，取而代之的是渗入一切的警惕——人们走向水井的方式、黄昏清点牲畜的方式、倾听夜间声音的方式，都不同了。{@bt_hero|::subscribed_books::interpreters::person}夺走的不只是{creature}，那只{race}还夺走了更珍贵的东西：安全的幻觉。"

[[rulesets]]
[rulesets.rules]
"This would not be the last time {@bt_hero|::subscribed_books::interpreters::person} would trouble the people of {@bt_site|::subscribed_books::interpreters::place}. The {race} would return. It always did." = "这不会是{@bt_hero|::subscribed_books::interpreters::person}最后一次侵扰{@bt_site|::subscribed_books::interpreters::place}的人们。那只{race}还会回来。它总会回来。"

[[rulesets]]
[rulesets.rules]
"The people of {@bt_site|::subscribed_books::interpreters::place} had not seen the last of {@bt_hero|::subscribed_books::interpreters::person}. The {race} was still out there, and it was patient." = "{@bt_site|::subscribed_books::interpreters::place}的人们还会再遇到{@bt_hero|::subscribed_books::interpreters::person}。那只{race}仍在外面，耐心十足。"

[[rulesets]]
[rulesets.rules]
"But the story of {@bt_hero|::subscribed_books::interpreters::person} was far from over. What came next would test the resolve of {@bt_site|::subscribed_books::interpreters::place} to its breaking point." = "但{@bt_hero|::subscribed_books::interpreters::person}的故事远未结束。接下来发生的事，会将{@bt_site|::subscribed_books::interpreters::place}的决心考验到极限。"

[[rulesets]]
[rulesets.rules]
"It would be another {n1} years before {@bt_hero|::subscribed_books::interpreters::person} met its end. Until then, the {race} continued to haunt {@bt_site|::subscribed_books::interpreters::place}." = "又过了{n1}年，{@bt_hero|::subscribed_books::interpreters::person}才迎来末日。在此之前，那只{race}一直侵扰着{@bt_site|::subscribed_books::interpreters::place}。"

[[rulesets]]
[rulesets.rules]
"The year {year1} would prove to be {@bt_hero|::subscribed_books::interpreters::person}'s last. The {race} did not survive to threaten {@bt_site|::subscribed_books::interpreters::place} again." = "{year1}年成为{@bt_hero|::subscribed_books::interpreters::person}的最后一年。那只{race}没能活下来，再次威胁{@bt_site|::subscribed_books::interpreters::place}。"

[[rulesets]]
[rulesets.rules]
"As of this writing, {@bt_hero|::subscribed_books::interpreters::person} remains at large. The {race} is out there still, somewhere beyond {@bt_site|::subscribed_books::interpreters::place}'s reach, waiting." = "截至写下这段文字时，{@bt_hero|::subscribed_books::interpreters::person}仍在游荡。那只{race}依旧在外面，在{@bt_site|::subscribed_books::interpreters::place}无法触及的某个地方，等待着。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person} was slain by {@bt_slayer|::subscribed_books::interpreters::person} at {@bt_site|::subscribed_books::interpreters::place} in {year1}." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}在{@bt_site|::subscribed_books::interpreters::place}被{@bt_slayer|::subscribed_books::interpreters::person}杀死。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person} died of old age in {year1} at {@bt_site|::subscribed_books::interpreters::place}. It was a peaceful end to a life fully lived." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}在{@bt_site|::subscribed_books::interpreters::place}寿终正寝。充实的一生迎来了安宁的结局。"

[[rulesets]]
[rulesets.rules]
"A wound turned septic. {@bt_hero|::subscribed_books::interpreters::person} fought the infection stubbornly, but the body has limits. In {year1}, it claimed what combat could not." = "一道伤口化脓感染。{@bt_hero|::subscribed_books::interpreters::person}顽强地对抗感染，可肉体终有极限。{year1}年，感染夺走了战斗未能夺走的性命。"

[[rulesets]]
[rulesets.rules]
"The waters near {@bt_site|::subscribed_books::interpreters::place} claimed {@bt_hero|::subscribed_books::interpreters::person} in {year1}." = "{year1}年，{@bt_site|::subscribed_books::interpreters::place}附近的水域夺去了{@bt_hero|::subscribed_books::interpreters::person}的性命。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person} was consumed by {cause} in {year1} at {@bt_site|::subscribed_books::interpreters::place}." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}在{@bt_site|::subscribed_books::interpreters::place}死于{cause}。"

[[rulesets]]
[rulesets.rules]
"A collapse at {@bt_site|::subscribed_books::interpreters::place} killed {@bt_hero|::subscribed_books::interpreters::person} in {year1}. There was no time to react." = "{year1}年，{@bt_site|::subscribed_books::interpreters::place}的坍塌夺去了{@bt_hero|::subscribed_books::interpreters::person}的性命，根本来不及反应。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person} died in {year1} at {@bt_site|::subscribed_books::interpreters::place}. The cause: {cause}." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}死于{@bt_site|::subscribed_books::interpreters::place}。死因：{cause}。"

[[rulesets]]
[rulesets.rules]
"In the year {year1}, {@bt_a|::subscribed_books::interpreters::person} and {@bt_b|::subscribed_books::interpreters::person} were joined. The union was not merely personal -- in {@bt_site|::subscribed_books::interpreters::place}, every bond between families carried political weight, and this one was no exception." = "{year1}年，{@bt_a|::subscribed_books::interpreters::person}与{@bt_b|::subscribed_books::interpreters::person}结合了。这段结合并非只关乎个人——在{@bt_site|::subscribed_books::interpreters::place}，家族间的每一条纽带都带着政治分量，这一条也不例外。"

[[rulesets]]
[rulesets.rules]
"The year {year1} brought {@bt_a|::subscribed_books::interpreters::person} and {@bt_b|::subscribed_books::interpreters::person} together. Whether the match was born of affection or arrangement, the result was the same: two lives, two families, two sets of obligations woven into one." = "{year1}年，{@bt_a|::subscribed_books::interpreters::person}与{@bt_b|::subscribed_books::interpreters::person}走到了一起。无论出于感情还是安排，结果都一样：两段人生、两个家族、两份责任交织成了一体。"

[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::interpreters::person} and {@bt_b|::subscribed_books::interpreters::person} became {relation} in {year1}. In a world where alliances were fragile and betrayals common, the bond between them was an anchor -- for both of them, and for those who depended on their stability." = "{year1}年，{@bt_a|::subscribed_books::interpreters::person}与{@bt_b|::subscribed_books::interpreters::person}成为{relation}。在这个联盟脆弱、背叛常见的世界里，两人的纽带是一枚锚——稳住了他们，也稳住了那些依赖他们的人。"

[[rulesets]]
[rulesets.rules]
"In {year1}, {@bt_a|::subscribed_books::interpreters::person} took {@bt_b|::subscribed_books::interpreters::person} as a traveling companion. The road was dangerous, and those who walked it alone did not walk it long. Together, they would face what neither could face alone." = "{year1}年，{@bt_a|::subscribed_books::interpreters::person}与{@bt_b|::subscribed_books::interpreters::person}结为旅伴。道路危险，独行者往往走不了多远。他们将共同面对任何一人独自都无法面对的事。"

[[rulesets]]
[rulesets.rules]
"In {year1}, {@bt_a|::subscribed_books::interpreters::person} took {@bt_b|::subscribed_books::interpreters::person} as an apprentice. The knowledge that would pass between them -- the skills, the judgment, the hard lessons -- would shape {@bt_b2|::subscribed_books::interpreters::person}'s life for decades to come." = "{year1}年，{@bt_a|::subscribed_books::interpreters::person}收{@bt_b|::subscribed_books::interpreters::person}为徒。两人之间传授的知识——技能、判断力，以及艰难的教训——将影响{@bt_b2|::subscribed_books::interpreters::person}此后数十年的人生。"

[[rulesets]]
[rulesets.rules]
"In {year1}, {@bt_a|::subscribed_books::interpreters::person} took {@bt_b|::subscribed_books::interpreters::person} prisoner. The circumstances of the capture would define both their fates -- captor and captive, bound by an act of violence that neither could undo." = "{year1}年，{@bt_a|::subscribed_books::interpreters::person}俘获了{@bt_b|::subscribed_books::interpreters::person}。这次俘获的经过将决定双方的命运——俘获者与俘虏，被一场谁也无法挽回的暴力绑在一起。"

[[rulesets]]
[rulesets.rules]
"In {year1}, {@bt_a|::subscribed_books::interpreters::person} and {@bt_b|::subscribed_books::interpreters::person} became {relation}. The bond would shape both their lives in ways neither could foresee." = "{year1}年，{@bt_a|::subscribed_books::interpreters::person}与{@bt_b|::subscribed_books::interpreters::person}成为{relation}。这条纽带将以双方都无法预见的方式，改变两人的人生。"

[[rulesets]]
[rulesets.rules]
"The two had crossed paths before. In the year {year1}, both had been at {@bt_site|::subscribed_books::interpreters::place} during a time of violence. Whether they fought side by side or merely survived the same ordeal, the experience bound them." = "两人此前就有过交集。{year1}年，在一段暴力肆虐的日子里，双方都曾身处{@bt_site|::subscribed_books::interpreters::place}。无论是并肩作战，还是仅仅从同一场苦难中生还，那段经历都将他们联系起来。"

[[rulesets]]
[rulesets.rules]
"Both {@bt_a|::subscribed_books::interpreters::person} and {@bt_b|::subscribed_books::interpreters::person} had served {@bt_entity|::subscribed_books::interpreters::entity}. The shared loyalty -- to the same people, the same cause, the same struggles -- had laid the groundwork for what came next." = "{@bt_a|::subscribed_books::interpreters::person}与{@bt_b|::subscribed_books::interpreters::person}都曾为{@bt_entity|::subscribed_books::interpreters::entity}效力。共同的忠诚——面对同一个族群、同一个事业、同样的抗争——为此后的发展打下了基础。"

[[rulesets]]
[rulesets.rules]
"What drew {@bt_a|::subscribed_books::interpreters::person} to {@bt_b|::subscribed_books::interpreters::person} was not recorded. Perhaps it was proximity -- both had lived in {@bt_site|::subscribed_books::interpreters::place} long enough for familiarity to become something more." = "{@bt_a|::subscribed_books::interpreters::person}为何被{@bt_b|::subscribed_books::interpreters::person}吸引，记录中并未说明。也许只是因为距离近——两人都在{@bt_site|::subscribed_books::interpreters::place}生活得够久，熟悉逐渐化成了更深的情感。"

[[rulesets]]
[rulesets.rules]
"The circumstances that brought {@bt_a|::subscribed_books::interpreters::person} and {@bt_b|::subscribed_books::interpreters::person} together were ordinary enough. But the bond that formed between them was not." = "让{@bt_a|::subscribed_books::interpreters::person}与{@bt_b|::subscribed_books::interpreters::person}相遇的情形十分平常，但两人之间形成的纽带却并不平凡。"

[[rulesets]]
[rulesets.rules]
"In {year1}, {@bt_hero|::subscribed_books::interpreters::person} {relation} at {@bt_site|::subscribed_books::interpreters::place}. The decision to put down roots was never simple -- it meant accepting a place as home, with all the obligations and vulnerabilities that entailed." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}在{@bt_site|::subscribed_books::interpreters::place}{relation}。决定扎根从来不简单——这意味着认定一处地方为家，并承担随之而来的责任与脆弱。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person} arrived at {@bt_site|::subscribed_books::interpreters::place} in {year1} and {relation}. Whether {@bt_hero2|::subscribed_books::interpreters::person} came seeking safety, opportunity, or simply a change, {@bt_site2|::subscribed_books::interpreters::place} would become the backdrop for the next chapter of {pos1} life." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}来到{@bt_site|::subscribed_books::interpreters::place}并{relation}。无论{@bt_hero2|::subscribed_books::interpreters::person}是来寻找安全、机会，还是仅仅想换种生活，{@bt_site2|::subscribed_books::interpreters::place}都将成为{pos1}人生下一章的舞台。"

[[rulesets]]
[rulesets.rules]
"In {year1}, {@bt_hero|::subscribed_books::interpreters::person} departed from {@bt_site|::subscribed_books::interpreters::place}. The settlement had seen {n1} deaths in the years leading up to the departure. Whether {@bt_hero2|::subscribed_books::interpreters::person} was fleeing the violence or simply tired of watching others fall, the result was the same: {@bt_site2|::subscribed_books::interpreters::place} lost another soul." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}离开了{@bt_site|::subscribed_books::interpreters::place}。离去前的几年里，聚居地已有{n1}人丧命。无论{@bt_hero2|::subscribed_books::interpreters::person}是在逃离暴力，还是只因厌倦目睹他人倒下，结果都一样：{@bt_site2|::subscribed_books::interpreters::place}又失去了一个人。"

[[rulesets]]
[rulesets.rules]
"In {year1}, {@bt_hero|::subscribed_books::interpreters::person} left {@bt_site|::subscribed_books::interpreters::place}. The departure was quiet -- no ceremony, no farewell address. {@bt_hero2|::subscribed_books::interpreters::person} simply gathered what mattered and walked away from what did not." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}离开了{@bt_site|::subscribed_books::interpreters::place}。离去悄无声息，没有仪式，也没有告别致辞。{@bt_hero2|::subscribed_books::interpreters::person}只是收拾起重要的东西，将其余一切留在身后。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person} departed from {@bt_site|::subscribed_books::interpreters::place} in {year1}. The reasons were personal, and the records do not elaborate. But {@bt_site2|::subscribed_books::interpreters::place} was diminished by the loss." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}离开{@bt_site|::subscribed_books::interpreters::place}。原因属于个人私事，记录没有详述。但这一离去，让{@bt_site2|::subscribed_books::interpreters::place}有所失落。"

[[rulesets]]
[rulesets.rules]
"In {year1}, {@bt_hero|::subscribed_books::interpreters::person} assumed the identity of {@bt_target|::subscribed_books::interpreters::person}. The impersonation was deliberate, sustained, and executed with a precision that suggested long planning. To become someone else -- to wear their name, their history, their face in the eyes of others -- was an act of either brilliance or desperation." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}冒用了{@bt_target|::subscribed_books::interpreters::person}的身份。这场冒充蓄意而持久，实施得极为精准，显然经过了长期谋划。成为另一个人——在他人眼中披上对方的名字、经历和面容——这样的行为，若非聪明绝顶，便是绝望至极。"

[[rulesets]]
[rulesets.rules]
"In {year1}, {@bt_hero|::subscribed_books::interpreters::person} disappeared behind a false identity. The person the world had known ceased to exist, replaced by a fiction carefully constructed to survive scrutiny." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}藏身于虚假身份之后。世人熟悉的那个人不复存在，取而代之的是一个精心编造、经得起审视的虚构人物。"

[[rulesets]]
[rulesets.rules]
"The deception had a clear motive. {@bt_hero|::subscribed_books::interpreters::person} had been declared a criminal by {@bt_entity|::subscribed_books::interpreters::entity}. With that designation came pursuit, and with pursuit came the need to become someone else entirely. The false identity was not a choice -- it was a survival strategy." = "欺骗有着明确的动机。{@bt_hero|::subscribed_books::interpreters::person}已被{@bt_entity|::subscribed_books::interpreters::entity}宣布为罪犯，随之而来的是追捕，而追捕迫使其彻底变成另一个人。虚假身份并非任意选择，而是求生之策。"

[[rulesets]]
[rulesets.rules]
"What drove {@bt_hero|::subscribed_books::interpreters::person} to this deception? The records do not say with certainty. But the act spoke of someone who had exhausted every honest option, and found only this one remaining." = "是什么驱使{@bt_hero|::subscribed_books::interpreters::person}做出这场欺骗？记录没有给出确切答案。但这一举动表明，所有正当的选择都已耗尽，只剩下这最后一条路。"

[[rulesets]]
[rulesets.rules]
"The motive behind the deception was a matter of speculation. Some believed {@bt_hero|::subscribed_books::interpreters::person} was fleeing a debt. Others suggested a more personal reason -- a past too painful to carry under {pos1} own name. The truth, as always, was probably simpler and sadder than the theories." = "欺骗的动机引来种种猜测。有人认为{@bt_hero|::subscribed_books::interpreters::person}在躲债，另一些人猜测原因更加私人——那段过去太过痛苦，无法再由{pos1}原本的名字承载。真相一如既往，可能比这些说法更简单，也更令人悲伤。"

[[rulesets]]
[rulesets.rules]
"To live as someone else was to give up everything that made {@bt_hero|::subscribed_books::interpreters::person} who {pro1} were. Every conversation was a performance. Every friendship was built on a lie. The mask, once worn, could not be set down without destroying everything it had built." = "以别人的身份活着，就意味着放弃所有让{@bt_hero|::subscribed_books::interpreters::person}成为{pro1}自己的东西。每次交谈都是表演，每段友谊都建立在谎言上。面具一旦戴上，就无法摘下，否则由它建立的一切都会毁灭。"

[[rulesets]]
[rulesets.rules]
"In {year1}, {@bt_hero|::subscribed_books::interpreters::person} was transformed from {creature} into {creature2}. The change was absolute. What had been {creature3} -- with all the memories, the skills, the identity that entailed -- was reshaped into something fundamentally different." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}从{creature}变成了{creature2}。变化彻底而绝对。原本的{creature3}——连同其记忆、技能和身份——被重塑为一种根本不同的存在。"

[[rulesets]]
[rulesets.rules]
"The transformation was not an accident of nature. It was {@bt_transformer|::subscribed_books::interpreters::person} who wielded the power that remade {@bt_hero|::subscribed_books::interpreters::person}. Whether it was a curse, a punishment, or something the victim had sought, the effect was the same: the person who had existed before was gone." = "这场变化并非自然的偶然。是{@bt_transformer|::subscribed_books::interpreters::person}运用力量，重塑了{@bt_hero|::subscribed_books::interpreters::person}。无论是诅咒、惩罚，还是受害者自己寻求的结果，效果都一样：先前存在的那个人，已然消失。"

[[rulesets]]
[rulesets.rules]
"The power that reshaped {@bt_hero|::subscribed_books::interpreters::person} left no clear signature. Whether it was a curse laid by a forgotten enemy, a consequence of forbidden knowledge, or something older and stranger, the transformation was complete and irreversible." = "重塑{@bt_hero|::subscribed_books::interpreters::person}的力量，没有留下明确的痕迹。无论是被遗忘的敌人施下诅咒，禁忌知识带来的后果，还是更加古老怪异的东西，这场变化都已彻底完成，再也无法逆转。"

[[rulesets]]
[rulesets.rules]
"The body that {@bt_hero|::subscribed_books::interpreters::person} now inhabited was not {pos1} own. The hands were wrong. The instincts were wrong. Everything that had been second nature -- walking, speaking, the simple act of being -- had to be relearned in a form that fought {pro1} at every step." = "{@bt_hero|::subscribed_books::interpreters::person}如今身处的身体，已不再是{pos1}原本的身体。双手不对，本能不对。所有曾经习以为常的事——行走、说话，乃至单纯地存在——都得重新学习，而这具身体每一步都在与{pro1}作对。"

