"{@bt_a|::subscribed_books::vocabulary::person} answered to a name that was not {pos1} own without so much as a flicker of hesitation." = "{@bt_a|::subscribed_books::vocabulary::person}应着一个不是{pos1}本名的名字，连一丝犹豫都没有。"
