base = "menu::encrust"

[[rulesets]]
[rulesets.rules]
"{kind}{main} with{main1}" = "为{main}{kind}{main1}"
# With no target flags the native producer leaves an empty target field.
"Encrust with{main1}" = "镶嵌{main1}"

[[rulesets]]
name = "kind"
[rulesets.rules]
"Encrust" = "镶嵌"

[[rulesets]]
name = "main"
[rulesets.rules]
" ammo" = "弹药"
" finished goods" = "成品"
" furniture" = "家具"
# Job 0x56/0x57/0x91 append these independent flags in this exact order,
# without English separators. Retain every selected target in combinations.
" finished goodsfurniture" = "成品、家具"
" finished goodsammo" = "成品、弹药"
" furnitureammo" = "家具、弹药"
" finished goodsfurnitureammo" = "成品、家具、弹药"

[[rulesets]]
name = "main1"
[rulesets.rules]
" cut gems" = "切割过的宝石"
" cut glass" = "切割过的玻璃"
" polished stones" = "打磨过的石头"
# Detailed jobs append the selected material instead of the generic category.
# This applies to gems, glass and polished stone for all three item targets.
" {::materials}" = "{::materials}"
" {::materials::job}" = "{::materials::job}"
" {::text::material}" = "{::text::material}"
