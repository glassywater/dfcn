", a dull thud echoes from within, though no object resides inside" = "，内部传来沉闷的敲响，尽管里面空无一物"
", it drips a cold mist that stains the very air with sorrow" = "，滴下的冷雾将悲哀染入空气"
", every touch feels like a hand grasping from beyond the veil" = "，每次触碰都像彼世的一只手抓来"
", its surface ripples with unseen waves, yet nothing moves" = "，表面泛着无形波纹，却没有什么移动"
", it hums a dissonant chord that unsettles the heart of any passerby" = "，嗡鸣着不谐的和音，让每个过客心神不宁"
", the light that spills from it is dimmer than the shadows it casts" = "，流出的光竟比投下的影子更暗"
", a faint scent of iron and rot clings to its worn edges" = "，磨损的边缘附着淡淡的铁与腐败气味"
", it seems to breathe, exhaling a chill that freezes the surrounding stone" = "，仿佛正在呼吸，吐出足以冻住周围石头的寒气"
", its silhouette warps, as if the night itself leans into it" = "，轮廓扭曲，仿佛夜色本身向它倾斜"
", a faint, whispering echo follows every step near its base" = "，底座附近每一步都伴着微弱低语般的回声"
", the ground beneath it shudders, though no weight is applied" = "，下面的地面颤抖，尽管并未受重压"
", it carries a silence so heavy that even birds cease to sing" = "，带着沉重得连鸟儿都停止歌唱的寂静"
", a subtle tremor ripples through the air, like a heartbeat too quick" = "，微颤掠过空气，如过快的心跳"
", its edges bleed a faint, crimson ink that stains the floor" = "，边缘渗出淡淡的鲜红墨汁，染污地面"
", the shadows around it lengthen, as if the darkness itself is hungry" = "，周围影子拉长，仿佛黑暗本身饥肠辘辘"
", animals refuse to come near it, some old instinct pulling them away" = "，动物拒绝靠近，古老的本能将它们拉远"
", it glows with a pallid light that drains warmth from the air" = "，闪着苍白的光，吸走空气中的温暖"
", older than any name still attached to it" = "，比仍与它相关的任何名字都更古老"
", worn smooth by hands long since forgotten" = "，被早已遗忘的双手磨得光滑"
", patina deep as centuries, each layer a memory of time" = "，包浆深厚如数百年岁月，每层都是时间的记忆"
", surface etched with symbols no living scholar can fully decipher" = "，表面刻着没有活着的学者能够完全解读的符号"
", weight grounded, as if bearing the burden of countless ages" = "，重量沉稳，仿佛背负无数时代的重担"
", glow faint, like the last ember of a long-gone fire" = "，光芒微弱，如早已熄灭的火留下的最后余烬"
", corners softened by the passage of countless generations of touch" = "，历经无数代人的触碰，棱角变得柔和"
", scent of dust and old stone clinging to its weathered frame" = "，风化的外框附着尘土与古石的气息"
", resonance humming low, a reminder of ages long past" = "，共鸣低响，提醒着久远的岁月"
", ironwork rusted yet dignified, telling of forgotten craftsmanship" = "，铁件虽锈，仍有尊严，诉说着被遗忘的工艺"
", cracks spider-webbed across its face, each a tale of survival" = "，正面裂纹如蛛网，每一道都是幸存的故事"
", veins of metal twisted like roots of an ancient tree" = "，金属纹路扭曲如古树之根"
", aura calm, as if it has witnessed the rise and fall of empires" = "，气息平静，仿佛见证过帝国兴亡"
", surface mottled with the patina of endless years of exposure" = "，表面斑驳，覆盖无尽暴露岁月留下的包浆"
", glow dim, reminiscent of a candle that has burned for ages" = "，光芒暗淡，像燃烧了许多年代的蜡烛"
", edges dulled by the relentless grind of history's passage" = "，边缘被历史无休止的磨砺钝化"
", markings faded, yet still speaking of a time before memory" = "，标记褪色，仍诉说着记忆之前的时代"
", presence steady, grounding those who stand near its timeworn base" = "，存在沉稳，让靠近古老底座的人也安定下来"
", weight reassuring, reminding all of its unyielding endurance" = "，重量令人安心，提醒众人它不屈的耐久"
", silence surrounding it, as if the world itself respects its age" = "，周围一片寂静，仿佛世界本身也尊重它的年纪"
", regarded now the way one regards a threat" = "，如今被人视作威胁"
", kept at a wary distance whenever it could be" = "，只要可能，便被警惕地保持距离"
", regarded now the way one regards a looming threat on the horizon" = "，如今被人视作地平线上迫近的威胁"
", handled like a cursed relic, eyes never lingering longer than necessary" = "，被当成受诅咒的遗物拿取，目光停留绝不超出必要"
", treated as a burden, its weight pressing heavily on the spirit" = "，被当成重担，其重量沉沉压在精神上"
", glanced at with suspicion, as if it might strike without warning" = "，受到怀疑的瞥视，仿佛可能毫无预警地袭来"
", avoided touching, fearing the unseen sting that seems to linger" = "，被避免触碰，人们害怕仿佛盘桓不去的无形刺痛"
", stored in the shadows, away from the light of daily life" = "，存于阴影里，远离日常生活的光"
", approached with a clenched jaw, ready to repel any sudden surge" = "，人们咬紧牙关靠近，准备击退任何骤起的力量"
", spoken about in hushed tones, each word edged with caution" = "，只被低声谈及，每个词都透着谨慎"
", regarded as a potential trap, its allure masked by danger" = "，被视作潜在陷阱，魅力之下藏着危险"
", moved aside with a quick, uneasy motion, never fully embraced" = "，被迅速而不安地推到一旁，从未被完全接纳"
", eyed like a snarling animal, ready to pounce at any moment" = "，受到如对龇牙野兽的注视，仿佛随时会扑来"
", regarded as a ticking clock, counting down to inevitable trouble" = "，被视作滴答计时的钟，倒数着不可避免的麻烦"
", handled with gloved hands, as if any skin contact could ignite conflict" = "，人们戴着手套拿取，仿佛任何皮肤接触都会点燃冲突"
", placed out of reach, a reminder of unresolved tension" = "，被放到够不着的地方，提醒着未解的紧张"
", watched from afar, the mind constantly calculating its next move" = "，人们从远处注视，心中不断推算它下一步的行动"
", treated as a dangerous presence, its very existence unsettling the air" = "，被当成危险之物，仅仅存在就扰乱空气"
", kept under lock, its mere sight enough to raise alarm bells" = "，被锁起来，仅仅看见就足以敲响警钟"
", regarded with a mix of dread and reluctant necessity" = "，受到混杂着恐惧与无奈需要的注视"
", held the way one holds something irreplaceable" = "，被如同不可替代之物那样握着"
", never far from reach anymore" = "，如今再不远离触手可及的地方"
", held the way one holds something irreplaceable, with reverent care" = "，被如同不可替代之物那样握着，怀着虔敬的谨慎"
", cradled gently, as if safeguarding a fragile heart against the world" = "，被轻轻托着，仿佛保护脆弱的心免遭世界伤害"
", cherished like a treasured heirloom, its presence soothing the soul" = "，被如珍贵传家宝那样珍惜，它的存在抚慰灵魂"
", kept close, its weight a comforting reminder of shared history" = "，被留在身边，其重量安慰地提醒着共同历史"
", treated with a tenderness that borders on reverence and love" = "，被以近乎崇敬与爱意的温柔对待"
", regarded as an extension of self, never truly leaving one's side" = "，被视作自身的延伸，从未真正离开身边"
", handled with soft hands, each touch a silent promise of loyalty" = "，被温柔的双手拿着，每次触碰都是无声的忠诚承诺"
", placed within arm's reach, a silent guardian against loneliness" = "，被放在伸手可及之处，无声守护，抵挡孤独"
", spoken of with affection, each mention a quiet hymn of gratitude" = "，被亲切地谈及，每次提起都是安静的感恩颂歌"
", regarded as a trusted ally, its presence bolstering confidence" = "，被视作可靠盟友，其存在增强信心"
", kept beside the bed, a nightly ritual of quiet devotion" = "，被放在床旁，如每夜安静虔诚的仪式"
", cherished like a beloved friend, its loss imagined as unbearable" = "，被如挚友般珍惜，想到失去便无法承受"
", handled with meticulous care, never allowing a single scratch" = "，被一丝不苟地照料，不容一道划痕"
", embraced in moments of doubt, its familiarity a calming anchor" = "，在疑虑时被拥紧，其熟悉感是安定心神的锚"
", regarded as a beacon, its glow guiding through darkest hours" = "，被视作灯塔，以光芒引领人穿过最黑暗的时辰"
", kept within sight, its presence a steady source of reassurance" = "，被留在视线之内，其存在不断提供安心"
", treated as a precious relic, its value measured in memories" = "，被当成珍贵遗物，价值由记忆衡量"
", held close during celebrations, its presence amplifying joy" = "，在庆祝时被紧拥，其存在增添欢喜"
"{@bt_a|::subscribed_books::vocabulary::person} had been alone for a long time. Since the death of {@bt_dead|::subscribed_books::vocabulary::person}, the world had felt wrong -- tilted, like a table with a missing leg. {a_pro} had tried to go back to the way things were. {::subscribed_books::arcs::ref_repeat_4} could not." = "{@bt_a|::subscribed_books::vocabulary::person}已经孤独很久。自{@bt_dead|::subscribed_books::vocabulary::person}死后，世界就不对劲，倾斜如缺了一条腿的桌子。{a_pro}试图恢复从前的生活，却做不到。"
"It began with a name spoken in grief. {@bt_dead|::subscribed_books::vocabulary::person}. {@bt_a|::subscribed_books::vocabulary::person} had heard the name and felt the ground shift beneath {a_pos} feet. {@bt_dead2|::subscribed_books::vocabulary::person} had been {relationship} -- the kind of bond that leaves a wound when it breaks." = "开端是悲伤中说出的一个名字：{@bt_dead|::subscribed_books::vocabulary::person}。{@bt_a|::subscribed_books::vocabulary::person}听见名字，感到{a_pos}脚下地面移动。{@bt_dead2|::subscribed_books::vocabulary::person}曾是{relationship}，那种一旦断裂就会留下伤口的纽带。"
"The road stretched out before {@bt_a|::subscribed_books::vocabulary::person}. Behind {a_obj} lay everything familiar. Ahead lay the people responsible for {@bt_dead|::subscribed_books::vocabulary::person}'s death, and whatever reckoning waited at the end of the road." = "道路延伸在{@bt_a|::subscribed_books::vocabulary::person}面前。{a_obj}身后，是熟悉的一切；前方，是该为{@bt_dead|::subscribed_books::vocabulary::person}之死负责的人，以及道路尽头等待的清算。"
"{@bt_a|::subscribed_books::vocabulary::person} sat alone by the fire, turning {@bt_dead|::subscribed_books::vocabulary::person}'s memory over in {a_pos} mind. {@bt_dead2|::subscribed_books::vocabulary::person} had been {relationship}. The loss was not something that healed. It was something that hardened." = "{@bt_a|::subscribed_books::vocabulary::person}独坐火旁，在{a_pos}心里反复想着{@bt_dead|::subscribed_books::vocabulary::person}。{@bt_dead2|::subscribed_books::vocabulary::person}曾是{relationship}。这份失去不会愈合，只会硬化。"
"\"I will find them,\" {@bt_a|::subscribed_books::vocabulary::person} said to no one. The words were not a threat. They were a fact, spoken with the certainty of stone. {@bt_dead|::subscribed_books::vocabulary::person} deserved that much. {@bt_dead2|::subscribed_books::vocabulary::person} deserved more." = "“我会找到他们。”{@bt_a|::subscribed_books::vocabulary::person}对着空无一人之处说道。那话不是威胁，而是如磐石般确信地说出的事实。{@bt_dead|::subscribed_books::vocabulary::person}值得至少如此。{@bt_dead2|::subscribed_books::vocabulary::person}值得更多。"
"The road was not kind. {@bt_opponent|::subscribed_books::vocabulary::person} stood between {@bt_a|::subscribed_books::vocabulary::person} and the path ahead. It was not the fight {a_pro} had come for, but it was the fight {::subscribed_books::arcs::ref_repeat_4} got." = "道路并不友善。{@bt_opponent|::subscribed_books::vocabulary::person}挡在{@bt_a|::subscribed_books::vocabulary::person}和前路之间。这不是{a_pro}为之而来的战斗，却是{::subscribed_books::arcs::ref_repeat_4}实际迎来的战斗。"
"{@bt_a|::subscribed_books::vocabulary::person} had been warned about this stretch of road. {@bt_opponent|::subscribed_books::vocabulary::person} had been preying on travelers for weeks. {@bt_a2|::subscribed_books::vocabulary::person} did not turn back." = "{@bt_a|::subscribed_books::vocabulary::person}曾听过关于这段路的警告。{@bt_opponent|::subscribed_books::vocabulary::person}已劫掠旅人数周。{@bt_a2|::subscribed_books::vocabulary::person}没有回头。"
"{@bt_a|::subscribed_books::vocabulary::person} heard the name first in a tavern -- {@bt_proto|::subscribed_books::vocabulary::person}, spoken by a stranger who did not know what the name meant to {@bt_a2|::subscribed_books::vocabulary::person}. {a_pro} set down {a_pos} drink and listened." = "{@bt_a|::subscribed_books::vocabulary::person}最先在酒馆听见那个名字：{@bt_proto|::subscribed_books::vocabulary::person}。说出它的陌生人，不知道名字对{@bt_a2|::subscribed_books::vocabulary::person}意味着什么。{a_pro}放下{a_pos}饮品，倾听起来。"
"It took weeks, but the trail led somewhere at last. {@bt_proto|::subscribed_books::vocabulary::person} was real, and close, and had no idea that {@bt_a|::subscribed_books::vocabulary::person} was coming." = "花了数周，线索终于有所指向。{@bt_proto|::subscribed_books::vocabulary::person}真实存在，就在近处，完全不知道{@bt_a|::subscribed_books::vocabulary::person}正在赶来。"
"A trader recognized {@bt_dead|::subscribed_books::vocabulary::person}'s description. \"I knew someone like that,\" the trader said. \"Traveled with a group -- a {race} named {@bt_proto|::subscribed_books::vocabulary::person}, and a {race2} named {@bt_love|::subscribed_books::vocabulary::person}.\" {@bt_a|::subscribed_books::vocabulary::person} thanked the trader and left without finishing {a_pos} meal." = "一名商人认出了对{@bt_dead|::subscribed_books::vocabulary::person}的描述。“我认识那样一个人，”商人说，“跟一群人一起旅行，一个叫{@bt_proto|::subscribed_books::vocabulary::person}的{race}，还有一个叫{@bt_love|::subscribed_books::vocabulary::person}的{race2}。”{@bt_a|::subscribed_books::vocabulary::person}向商人道谢，饭也未吃完便离去。"
