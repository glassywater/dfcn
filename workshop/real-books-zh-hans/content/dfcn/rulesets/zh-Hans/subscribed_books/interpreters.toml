[[rulesets]]
[rulesets.rules]
"In {year1}, the body of {@bt_victim|::subscribed_books::interpreters::person} was desecrated at {@bt_site|::subscribed_books::interpreters::place}. The act was one of deliberate cruelty -- not content with death alone, the perpetrator sought to strip away even the dignity of the corpse." = "{year1}年，{@bt_victim|::subscribed_books::interpreters::person}的遗体在{@bt_site|::subscribed_books::interpreters::place}遭到亵渎。这是蓄意的残忍——加害者不满足于死亡本身，连尸体最后的尊严也要剥夺。"

[[rulesets]]
[rulesets.rules]
"In life, {@bt_victim|::subscribed_books::interpreters::person} had been someone." = "生前，{@bt_victim|::subscribed_books::interpreters::person}也曾是有名有姓的人。"

[[rulesets]]
[rulesets.rules]
"In {year1}, a body was desecrated at {@bt_site|::subscribed_books::interpreters::place}. The act was one of deliberate cruelty -- a message written in flesh and bone, directed at the living. The identity of the victim was lost to time, but the horror of the act endured in the memory of those who witnessed it." = "{year1}年，一具尸体在{@bt_site|::subscribed_books::interpreters::place}遭到亵渎。这是蓄意的残忍——用血肉与骨头写给活人的讯息。受害者的身份已被时间遗忘，但目睹这一行为的人，始终记得其中的恐怖。"

[[rulesets]]
[rulesets.rules]
"In {year1}, {@bt_thief|::subscribed_books::interpreters::person} committed a theft at {@bt_site|::subscribed_books::interpreters::place}. The act was brazen -- carried out not in darkness or secrecy, but with the confidence of someone who did not fear the consequences, or who had already weighed them and found them acceptable." = "{year1}年，{@bt_thief|::subscribed_books::interpreters::person}在{@bt_site|::subscribed_books::interpreters::place}实施了盗窃。行为大胆到近乎肆无忌惮——没有躲在黑暗或秘密之中，而是带着不怕后果的自信，或是早已权衡后果并认为可以接受。"

[[rulesets]]
[rulesets.rules]
"In {year1}, a theft occurred at {@bt_site|::subscribed_books::interpreters::place}. The thief was never identified -- or if they were, the records do not say. What was taken mattered less than what the act revealed: that the security of {@bt_entity|::subscribed_books::interpreters::entity} was not absolute, and that trust, once broken, was difficult to restore." = "{year1}年，{@bt_site|::subscribed_books::interpreters::place}发生了一起盗窃。窃贼始终未被查明——即使查明，记录也没有说明。被盗的东西，远不如这件事揭示的事实重要：{@bt_entity|::subscribed_books::interpreters::entity}的安全并非绝对，而信任一旦破裂，就难以恢复。"

[[rulesets]]
[rulesets.rules]
"In {year1}, {@bt_entity|::subscribed_books::interpreters::entity} was dissolved. What had taken years of effort, negotiation, and shared purpose to build was undone. The members scattered -- some to rival organizations, some to solitude, some to the anonymity of a life unaffiliated with any cause. The dissolution left a void that would not be easily filled." = "{year1}年，{@bt_entity|::subscribed_books::interpreters::entity}解散了。多年努力、协商与共同目标所建立的一切，就此瓦解。成员四散——有人投向竞争组织，有人独居，有人过上不再隶属任何事业的无名生活。解散留下的空缺，难以轻易填补。"

[[rulesets]]
[rulesets.rules]
"In {year1}, {@bt_hero|::subscribed_books::interpreters::person} tamed a creature. The bond between person and animal was one of the oldest in the world -- a partnership forged in mutual need. The animal gained protection. {@bt_hero2|::subscribed_books::interpreters::person} gained a companion who asked nothing and offered everything. In the years to come, this particular bond would prove its worth many times over." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}驯服了一只动物。人与动物之间的纽带，是世上最古老的纽带之一——由彼此的需要结成的伙伴关系。动物获得了保护，{@bt_hero2|::subscribed_books::interpreters::person}则得到一个不求回报、倾尽所有的伙伴。此后多年，这份特殊的联系将一次又一次证明它的价值。"

[[rulesets]]
[rulesets.rules]
"In {year1}, {@bt_hero|::subscribed_books::interpreters::person} reached a great summit. The climb was arduous, the air thin, and the path uncertain. But {@bt_hero2|::subscribed_books::interpreters::person} pressed on -- driven by curiosity, by ambition, or by the simple human need to see what lay beyond the next ridge. The view from the top was magnificent, and the achievement was one that few could claim." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}登上了一座雄伟的山峰。攀登艰难，空气稀薄，路径难辨。但{@bt_hero2|::subscribed_books::interpreters::person}仍坚持前行——出于好奇、野心，或只是想看看下一道山脊之外的朴素愿望。峰顶景色壮丽，而这一成就，只有极少数人能够拥有。"

[[rulesets]]
[rulesets.rules]
"{@bt_hero|::subscribed_books::interpreters::person} had died in {year1} -- {cause}. In {year2}, {pro1} returned. The resurrection was a violation of the natural order, and those who witnessed it were divided between awe and horror. {@bt_hero2|::subscribed_books::interpreters::person} was alive again, but the person who came back was not quite the same as the one who had left." = "{@bt_hero|::subscribed_books::interpreters::person}已于{year1}年死去——{cause}。{year2}年，{pro1}回来了。复活违背了自然秩序，目睹者既敬畏又恐惧。{@bt_hero2|::subscribed_books::interpreters::person}再次活着，但归来的那个人，与离去时已不完全相同。"

[[rulesets]]
[rulesets.rules]
"In {year1}, {@bt_hero|::subscribed_books::interpreters::person} was brought back from death. The circumstances of the resurrection were unclear, but its reality was not. {@bt_hero2|::subscribed_books::interpreters::person} walked again among the living -- changed, perhaps, by what {pro1} had seen on the other side, but alive. A miracle to some. An abomination to others. A fact to all." = "{year1}年，{@bt_hero|::subscribed_books::interpreters::person}从死亡中归来。复活的经过并不清楚，但复活本身确凿无疑。{@bt_hero2|::subscribed_books::interpreters::person}再次行走于活人之间——也许因{pro1}在彼岸看到的事而有所改变，却确实活着。有人视之为奇迹，有人视之为亵渎，而对所有人而言，这都是事实。"

