[[rulesets]]
[rulesets.rules]
"And while I am on it: young {::subscribed_books::vocabulary::race} these days ask for everything and earn nothing. In my day one waited to be noticed. Now they come with their hands out and their mouths open, and they call it ambition." = "既然说到了这里，如今的年轻{::subscribed_books::vocabulary::race}什么都想要，却什么也不愿挣。在我年轻时，人们要耐心等待被赏识。如今他们伸着手、张着嘴来索取，还把这叫作雄心。"
"And while I am on it: young {::subscribed_books::vocabulary::race} these days ask for everything and earn nothing." = "既然说到了这里，如今的年轻{::subscribed_books::vocabulary::race}什么都想要，却什么也不愿挣。"
"In my day one waited to be noticed." = "在我年轻时，人们要耐心等待被赏识。"
"Now they come with their hands out and their mouths open, and they call it ambition." = "如今他们伸着手、张着嘴来索取，还把这叫作雄心。"
"They do not listen. They do not wait. They think a craft is a thing one picks up from the road like a stone, and they are offended when it turns out to be heavy." = "他们不听，也不等。他们以为一门手艺就像路边的石子，随手便能拾起；发觉它沉重时，反倒生气了。"
"They do not listen." = "他们不听。"
"They do not wait." = "他们不等。"
"They think a craft is a thing one picks up from the road like a stone, and they are offended when it turns out to be heavy." = "他们以为一门手艺就像路边的石子，随手便能拾起；发觉它沉重时，反倒生气了。"
"I have heard them in the halls, explaining to their elders how the world works. The world was working before they were born, and it will go on working after they have finally learned to keep quiet." = "我听过他们在大厅里向长辈解释世事如何运转。在他们出生之前，世事就已如此；等他们终于学会闭嘴，世事仍会运转下去。"
"I have heard them in the halls, explaining to their elders how the world works." = "我听过他们在大厅里向长辈解释世事如何运转。"
"The world was working before they were born, and it will go on working after they have finally learned to keep quiet." = "在他们出生之前，世事就已如此；等他们终于学会闭嘴，世事仍会运转下去。"
"I find myself thinking about the young more often than I used to. They seem to arrive in the world already certain of everything." = "我发现自己比过去更常想起年轻人。他们仿佛一来到世上，就已经对一切确信无疑。"
"I find myself thinking about the young more often than I used to." = "我发现自己比过去更常想起年轻人。"
"They seem to arrive in the world already certain of everything." = "他们仿佛一来到世上，就已经对一切确信无疑。"
"When I was young, I suppose I was as tiresome as they are now. I cannot remember it, which is probably a mercy." = "我想，我年轻时大概也像他们如今这样烦人。我已记不得了，这或许是件幸事。"
"When I was young, I suppose I was as tiresome as they are now." = "我想，我年轻时大概也像他们如今这样烦人。"
"I cannot remember it, which is probably a mercy." = "我已记不得了，这或许是件幸事。"

"And let me say this about company, since everyone is so fond of it: it is the enemy of good work. Every pair of hands in a room brings a mouth with it, and every mouth has an opinion." = "既然人人都喜欢结伴，我就直说：结伴是好作品的敌人。屋里每添一双手，就添一张嘴；每张嘴都有意见。"
"And let me say this about company, since everyone is so fond of it: it is the enemy of good work." = "既然人人都喜欢结伴，我就直说：结伴是好作品的敌人。"
"Every pair of hands in a room brings a mouth with it, and every mouth has an opinion." = "屋里每添一双手，就添一张嘴；每张嘴都有意见。"
"No one has ever made a thing worth keeping while someone stood at their shoulder asking what it was for." = "若总有人站在肩旁追问这有什么用，谁也做不出值得留下的东西。"
"There is nothing like a workshop with one pair of hands in it. No one to ask where the tools went. No one to tell you that the way you have always done it is wrong." = "没有什么比独自待在工坊里更好。没人来问工具去了哪儿，也没人告诉你，你一直以来的做法是错的。"
