# Complete baseline reference templates from templates.lua.
base = "subscribed_books::templates_legacy"

[[rulesets]]
[rulesets.rules]
"A practical manual for the {::subscribed_books::adj} student. What follows has been tested by experience and verified by practice." = "一本面向{::subscribed_books::adj}学生的实用手册。以下内容已由经验检验，并经实践证实。"
"This manual, written by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} of {@bt_entity|::subscribed_books::vocabulary::entity}, provides instruction based on years of direct experience at {@bt_site|::subscribed_books::vocabulary::place}." = "本手册由{@bt_entity|::subscribed_books::vocabulary::entity}的{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}撰写，所授知识源于在{@bt_site|::subscribed_books::vocabulary::place}多年积累的直接经验。"
"There is a difference between knowing a thing and knowing how to do it. This manual, compiled by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} from {::subscribed_books::personality::pos1} work at {@bt_site|::subscribed_books::vocabulary::place}, bridges that gap. Every technique described herein has been tested under {::subscribed_books::adj} conditions and proven sound." = "知道一件事与知道如何去做，是两回事。本手册由{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}根据{::subscribed_books::personality::pos1}在{@bt_site|::subscribed_books::vocabulary::place}的工作编写，旨在弥合这道鸿沟。这里描述的每项技法都曾在{::subscribed_books::adj}的条件下接受检验，并被证明可靠。"
"Practical knowledge is the foundation upon which all theory rests. {::subscribed_books::templates_legacy::metaphor} I, {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, have spent my years at {@bt_site|::subscribed_books::vocabulary::place} learning by doing, and this manual distills those lessons into a form that any diligent student of {@bt_entity|::subscribed_books::vocabulary::entity} can follow." = "实用知识是一切理论赖以建立的根基。{::subscribed_books::templates_legacy::metaphor}我，{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}，多年来在{@bt_site|::subscribed_books::vocabulary::place}通过实践学习。本手册将这些经验提炼成{@bt_entity|::subscribed_books::vocabulary::entity}任何勤勉学生都能遵循的形式。"
"Practical knowledge is the foundation upon which all theory rests. I, {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, have spent my years at {@bt_site|::subscribed_books::vocabulary::place} learning by doing, and this manual distills those lessons into a form that any diligent student of {@bt_entity|::subscribed_books::vocabulary::entity} can follow." = "实用知识是一切理论赖以建立的根基。我，{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}，多年来在{@bt_site|::subscribed_books::vocabulary::place}通过实践学习。本手册将这些经验提炼成{@bt_entity|::subscribed_books::vocabulary::entity}任何勤勉学生都能遵循的形式。"
"The next technique to master, as practiced around {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "接下来要掌握的技法，约于{@bt_year|::subscribed_books::vocabulary::birth_year}年付诸实践："
"Proceeding to the next practical lesson, relevant since {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "接下来是自{@bt_year|::subscribed_books::vocabulary::birth_year}年起适用的实用课程："
"The following section builds upon the preceding. The student should ensure mastery of earlier material before proceeding. This technique was refined in {@bt_year|::subscribed_books::vocabulary::birth_year}." = "以下内容承接前文。学生应先熟练掌握前面的材料，再继续学习。本技法于{@bt_year|::subscribed_books::vocabulary::birth_year}年得到改进。"
"The creation of {@bt_artifact|::subscribed_books::vocabulary::artifact} by {@bt_hero|::subscribed_books::vocabulary::person} in {@bt_year|::subscribed_books::vocabulary::birth_year} exemplifies the techniques described herein. Study it closely." = "{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年创造的{@bt_artifact|::subscribed_books::vocabulary::artifact}，体现了这里所述的技法。请仔细研究。"
"In {@bt_year|::subscribed_books::vocabulary::birth_year}, {@bt_hero|::subscribed_books::vocabulary::person} applied these principles to create {@bt_artifact|::subscribed_books::vocabulary::artifact}. The result speaks for itself." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年，{@bt_hero|::subscribed_books::vocabulary::person}运用这些原则创造了{@bt_artifact|::subscribed_books::vocabulary::artifact}。成果本身就是证明。"
"{@bt_hero|::subscribed_books::vocabulary::person} was recognized as {@bt_role|::subscribed_books::vocabulary::role} of {@bt_entity|::subscribed_books::vocabulary::entity} in {@bt_year|::subscribed_books::vocabulary::birth_year}, partly due to mastery of the skills described in this manual." = "{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年被任命为{@bt_entity|::subscribed_books::vocabulary::entity}的{@bt_role|::subscribed_books::vocabulary::role}，部分原因正是精通本手册所述的技能。"
"The loss of {@bt_hero|::subscribed_books::vocabulary::person} in {@bt_year|::subscribed_books::vocabulary::birth_year} to {@bt_cause|::subscribed_books::vocabulary::cause} is a reminder that even masters are mortal. Preserve their knowledge." = "{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年因{@bt_cause|::subscribed_books::vocabulary::cause}去世，提醒我们：即便大师也终有一死。请保存他们的知识。"
"Further practical application was demonstrated in {@bt_year|::subscribed_books::vocabulary::birth_year}. The diligent student will note the refinements." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年又一次展示了实际应用。勤勉的学生应留意其中的改进。"
"Practice these techniques until they become second nature." = "反复练习这些技法，直到它们成为本能。"
"Mastery comes through repetition. Do not proceed until you are confident." = "精通来自重复。没有把握之前，不要继续。"
"This manual is complete. The rest is practice. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "本手册到此结束。余下的是练习。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"No manual can substitute for hands-on experience. What is written here is a map, not the territory. Go forth, apply what you have learned, and improve upon it. The {::subscribed_books::adj} craft demands nothing less. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "任何手册都不能代替亲身实践。这里写下的是地图，而非土地本身。去运用所学，并加以改进。这门{::subscribed_books::adj}的技艺要求你做到这些。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"A treatise on the theoretical foundations of the subject at hand. By {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, scholar of {@bt_entity|::subscribed_books::vocabulary::entity}." = "一篇探讨当前课题理论基础的论著。作者：{@bt_entity|::subscribed_books::vocabulary::entity}的学者{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}。"
"This work establishes the {::subscribed_books::adj} principles underlying the discipline, drawing upon the accumulated knowledge of {@bt_entity|::subscribed_books::vocabulary::entity}." = "本书借鉴{@bt_entity|::subscribed_books::vocabulary::entity}积累的知识，确立了这门学科背后的{::subscribed_books::adj}原则。"
"The theoretical framework presented in this manual represents the current state of understanding within {@bt_entity|::subscribed_books::vocabulary::entity}. I, {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, have endeavored to synthesize the {::subscribed_books::adj} contributions of my predecessors into a coherent system. Errors of interpretation are my own." = "本手册提出的理论框架，代表了{@bt_entity|::subscribed_books::vocabulary::entity}当前的理解水平。我，{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}，努力将前人{::subscribed_books::adj}的贡献汇成一个连贯体系。解释上的错误由我承担。"
"Theorem {@bt_year|::subscribed_books::vocabulary::birth_year}: the following principle is asserted." = "定理{@bt_year|::subscribed_books::vocabulary::birth_year}：现提出以下原理。"
"The next proposition, formulated circa {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "下一项命题，约于{@bt_year|::subscribed_books::vocabulary::birth_year}年提出："
"The creation of {@bt_artifact|::subscribed_books::vocabulary::artifact} in {@bt_year|::subscribed_books::vocabulary::birth_year} provides empirical support for the theory advanced herein." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年{@bt_artifact|::subscribed_books::vocabulary::artifact}的创造，为本书提出的理论提供了实证支持。"
"The passing of {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} in {@bt_year|::subscribed_books::vocabulary::birth_year} represents a loss to the field that cannot be overstated." = "{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}于{@bt_year|::subscribed_books::vocabulary::birth_year}年去世，给这一领域带来的损失难以估量。"
"Observations from {@bt_year|::subscribed_books::vocabulary::birth_year} are consistent with the theoretical framework described above." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年的观察结果，与前述理论框架相符。"
"The proof is left as an exercise for the reader." = "证明留给读者作为练习。"
"Further investigation is warranted." = "有必要继续研究。"
"Q.E.D. This treatise is submitted for the consideration of the scholarly community. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "证毕。本论著提交学术界审议。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"The {::subscribed_books::adj} edifice of theory presented here is, by necessity, incomplete. No single work can encompass the full scope of understanding. I offer this treatise as one stone in a larger structure, trusting that future scholars will build upon it. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "这里构建的{::subscribed_books::adj}理论大厦，必然尚不完整。任何单部作品都无法涵盖全部认知。我将本论著作为更大建筑中的一块石头，期待后世学者在此基础上继续建造。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"Field notes. Compiled by {@bt_hero|::subscribed_books::vocabulary::person} at {@bt_site|::subscribed_books::vocabulary::place}. Unedited. Presented as recorded." = "实地笔记。由{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_site|::subscribed_books::vocabulary::place}整理。未经编辑。按记录原样呈现。"
"The following notes were taken during practical work at {@bt_site|::subscribed_books::vocabulary::place}. They are rough but honest. -- {@bt_hero|::subscribed_books::vocabulary::person}" = "以下笔记记录于{@bt_site|::subscribed_books::vocabulary::place}的实际工作期间。它们粗糙，却诚实。——{@bt_hero|::subscribed_books::vocabulary::person}"
"These field notes represent direct observation under {::subscribed_books::adj} working conditions at {@bt_site|::subscribed_books::vocabulary::place}. I, {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, have resisted the temptation to polish them. Their value lies in their immediacy, not their elegance." = "这些实地笔记，记录了在{@bt_site|::subscribed_books::vocabulary::place}的{::subscribed_books::adj}工作条件下作出的直接观察。我，{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}，克制了润色它们的冲动。它们的价值在于即时性，而非优雅。"
"Notes from the period around {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "约{@bt_year|::subscribed_books::vocabulary::birth_year}年前后的笔记："
"Field observations, circa {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "实地观察，约{@bt_year|::subscribed_books::vocabulary::birth_year}年："
"Note: {@bt_hero|::subscribed_books::vocabulary::person} produced {@bt_artifact|::subscribed_books::vocabulary::artifact} under the conditions described. Year {@bt_year|::subscribed_books::vocabulary::birth_year}. Remarkable results." = "注：{@bt_hero|::subscribed_books::vocabulary::person}在所述条件下制作了{@bt_artifact|::subscribed_books::vocabulary::artifact}。年份：{@bt_year|::subscribed_books::vocabulary::birth_year}。成果非凡。"
"Note: {@bt_hero|::subscribed_books::vocabulary::person} lost to {@bt_cause|::subscribed_books::vocabulary::cause}, {@bt_year|::subscribed_books::vocabulary::birth_year}. Field work carries risks. Document everything." = "注：{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年因{@bt_cause|::subscribed_books::vocabulary::cause}去世。实地工作有风险。务必记录一切。"
"Observation, {@bt_year|::subscribed_books::vocabulary::birth_year}: conditions consistent with earlier findings. Further data needed." = "观察，{@bt_year|::subscribed_books::vocabulary::birth_year}年：条件与早期发现一致。仍需更多数据。"
"End of field session." = "本次实地工作结束。"
"End of field notes. Raw data preserved for future analysis. -- {@bt_hero|::subscribed_books::vocabulary::person}" = "实地笔记结束。原始数据已保存，供日后分析。——{@bt_hero|::subscribed_books::vocabulary::person}"
"These {::subscribed_books::adj} field notes conclude here. They are imperfect, as all primary sources are. But they are true to what was observed, and that is the most any honest record can claim. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "这些{::subscribed_books::adj}的实地笔记到此结束。它们并不完美，任何第一手资料都是如此。但它们忠于实际观察，而这已是任何诚实记录所能作出的最高承诺。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"What I am about to share, I share reluctantly. These are the {::subscribed_books::adj} secrets of a master. Use them wisely. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "我即将分享的内容，是不情愿地分享的。这是一位大师{::subscribed_books::adj}的秘密。请明智运用。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"A master reveals what years of practice have taught. This knowledge was hard-won. Treat it with respect." = "一位大师揭示多年实践所得。这些知识来之不易。请尊重它们。"
"Every craft has its hidden depths, techniques known only to those who have spent a lifetime at the bench, the forge, or the desk. I, {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, have guarded these {::subscribed_books::adj} secrets for many years. I share them now because I fear they will be lost if I do not." = "每门技艺都有隐藏的深度，有些技法唯有在工作台、熔炉或书桌旁度过一生的人才会知道。我，{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}，守护这些{::subscribed_books::adj}秘密已很多年。如今将它们分享，是因为担心若不如此，它们便会失传。"
"The next secret, learned the hard way around {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "下一个秘密，是约{@bt_year|::subscribed_books::vocabulary::birth_year}年艰难领悟的："
"Here is something they don't teach in the academies. I discovered this in {@bt_year|::subscribed_books::vocabulary::birth_year}." = "这是学院里不会教的东西。我于{@bt_year|::subscribed_books::vocabulary::birth_year}年发现了它。"
"{@bt_hero|::subscribed_books::vocabulary::person} used this technique to create {@bt_artifact|::subscribed_books::vocabulary::artifact} in {@bt_year|::subscribed_books::vocabulary::birth_year}. The secret is in the preparation, not the execution." = "{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年用这种技法创造了{@bt_artifact|::subscribed_books::vocabulary::artifact}。秘密在于准备，而非执行。"
"The loss of {@bt_hero|::subscribed_books::vocabulary::person} in {@bt_year|::subscribed_books::vocabulary::birth_year} means these secrets almost died with {::subscribed_books::personality::obj1}. Learn them now." = "{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年去世，意味着这些秘密险些随{::subscribed_books::personality::obj1}一同消失。现在就学会它们。"
"Around {@bt_year|::subscribed_books::vocabulary::birth_year}, I discovered something that changed my understanding entirely." = "约{@bt_year|::subscribed_books::vocabulary::birth_year}年，我发现了一件彻底改变我理解的事。"
"Guard this knowledge. Share it only with those who will use it well." = "守护这些知识。只将它们传给会善加运用的人。"
"These are the secrets of {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}. I have held nothing back. The rest is up to you." = "这些就是{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}的秘密。我已毫无保留。剩下的取决于你。"
"The {::subscribed_books::adj} secrets of a master are now in your hands. I, {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, have discharged my duty. What you build with this knowledge will be your legacy, not mine. Make it worthy." = "大师{::subscribed_books::adj}的秘密如今已在你手中。我，{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}，完成了自己的责任。你用这些知识创造的，将成为你的遗产，而非我的。请让它配得上这份传承。"
"Welcome, student. This manual assumes you know nothing. That is fine. Everyone starts here." = "欢迎，学生。本手册假定你一无所知。这没有关系。每个人都从这里起步。"
"A simple introduction to the subject, written for those just beginning their studies. By {@bt_hero|::subscribed_books::vocabulary::person} of {@bt_entity|::subscribed_books::vocabulary::entity}." = "一本写给初学者的简单入门书。作者：{@bt_entity|::subscribed_books::vocabulary::entity}的{@bt_hero|::subscribed_books::vocabulary::person}。"
"This primer is addressed to the absolute beginner. I, {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, remember what it was like to know nothing about this subject, and I have written this manual with that memory firmly in mind. Start here. Read slowly. Ask questions." = "这本启蒙读物写给完全的初学者。我，{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}，还记得对这个课题一无所知的感觉，撰写本手册时始终铭记着这一点。从这里开始。慢慢读。多提问。"
"The next lesson. Take your time with this one." = "下一课。请花些时间学习。"
"Moving on. If the previous section was confusing, re-read it before continuing." = "继续。如果前一节令人困惑，请先重读，再往下看。"
"{@bt_hero|::subscribed_books::vocabulary::person} created {@bt_artifact|::subscribed_books::vocabulary::artifact} in {@bt_year|::subscribed_books::vocabulary::birth_year}. Don't worry -- you won't be expected to do anything like that for a long time." = "{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年创造了{@bt_artifact|::subscribed_books::vocabulary::artifact}。别担心——很长一段时间里，都不会要求你做到那种程度。"
"The events of {@bt_year|::subscribed_books::vocabulary::birth_year} illustrate a basic principle. Can you identify it?" = "{@bt_year|::subscribed_books::vocabulary::birth_year}年的事件说明了一个基本原理。你能找出它吗？"
"Good. You're making progress. Keep going." = "很好。你正在进步。继续。"
"You've reached the end of the primer. You are no longer a beginner. Congratulations. -- {@bt_hero|::subscribed_books::vocabulary::person}" = "你已经读到了启蒙读物的结尾。你不再是初学者。恭喜。——{@bt_hero|::subscribed_books::vocabulary::person}"
"The {::subscribed_books::adj} journey of learning has barely begun, but you have taken the hardest step: the first one. This primer is finished. What comes next is up to you. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "{::subscribed_books::adj}的学习旅程才刚刚开始，但你已经迈出了最困难的一步：第一步。这本启蒙读物已经结束。接下来如何，取决于你。——{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}"
"I came to {@bt_site|::subscribed_books::vocabulary::place} expecting little. I left with a story worth telling. Let me describe what I found." = "我来到{@bt_site|::subscribed_books::vocabulary::place}时并没有多少期待，离开时却带走了一个值得讲述的故事。让我描述自己的发现。"
"A traveler's guide to {@bt_site|::subscribed_books::vocabulary::place}, seat of {@bt_entity|::subscribed_books::vocabulary::entity}. Written from personal experience by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}." = "一本关于{@bt_entity|::subscribed_books::vocabulary::entity}中心{@bt_site|::subscribed_books::vocabulary::place}的旅行指南。由{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}根据亲身经历撰写。"
"The {::subscribed_books::adj} traveler learns more from a single visit than a scholar learns from a dozen books. I, {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, journeyed to {@bt_site|::subscribed_books::vocabulary::place} in the lands of {@bt_entity|::subscribed_books::vocabulary::entity}, and what I discovered there defied every expectation. This guide is my attempt to share the experience." = "{::subscribed_books::adj}的旅行者，一次造访所学，就胜过学者读上十几本书。我，{@bt_hero|::subscribed_books::vocabulary::person}{::subscribed_books::vocabulary::epithet}，前往{@bt_entity|::subscribed_books::vocabulary::entity}领土上的{@bt_site|::subscribed_books::vocabulary::place}，那里的发现超出了所有预期。本指南试图分享这段经历。"
