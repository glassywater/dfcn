# forms/essay/subjects/career.lua 的论述模板；保留完整句组与去重后的独立句。
# 动态职业经历由 essay_vocabulary::subject 解析，人物仅走现有书籍姓名入口。
base = "subscribed_books::essay_career"

[[rulesets]]
[rulesets.rules]
# 各节通用论点。
"It did not begin from nothing." = "它并非凭空开始。"
"There was a life before the work, and it explains the work." = "从事这份工作之前的生活，解释了为何会走上这条路。"
"Where I began matters." = "我从哪里开始，这很重要。"
"Of where I took it up, a word." = "关于我开始从事这份工作的地方，也该说上几句。"
"Where it began matters." = "这份工作从哪里开始，这很重要。"
"Of where it was taken up, a word." = "关于这份工作开始的地方，也该说上几句。"
"What I made of it, the record keeps." = "我由此成就了什么，史册自有记载。"
"The work itself speaks." = "工作本身便能说明一切。"
"What came of it, the record keeps." = "由此结出了什么成果，史册自有记载。"
"It was not all good years." = "那些年并非总是一帆风顺。"
"There were losses along the way." = "一路走来也有所失去。"

# 志业。
"I will argue that {::subscribed_books::essay_vocabulary::subject} was a calling answered." = "我要论证，{::subscribed_books::essay_vocabulary::subject}是对内心志业的回应。"
"This essay concerns {::subscribed_books::essay_vocabulary::subject}. I mean to show that the work chose {@bt_a|::subscribed_books::vocabulary::person} as much as {@bt_a2|::subscribed_books::vocabulary::person} chose the work." = "本文讨论{::subscribed_books::essay_vocabulary::subject}。我想说明，这份工作选择了{@bt_a|::subscribed_books::vocabulary::person}，正如{@bt_a2|::subscribed_books::vocabulary::person}选择了这份工作。"
"This essay concerns {::subscribed_books::essay_vocabulary::subject}." = "本文讨论{::subscribed_books::essay_vocabulary::subject}。"
"I mean to show that the work chose {@bt_a|::subscribed_books::vocabulary::person} as much as {@bt_a2|::subscribed_books::vocabulary::person} chose the work." = "我想说明，这份工作选择了{@bt_a|::subscribed_books::vocabulary::person}，正如{@bt_a2|::subscribed_books::vocabulary::person}选择了这份工作。"
"I write about {::subscribed_books::essay_vocabulary::subject}, and I will say plainly that it was a calling." = "我写下{::subscribed_books::essay_vocabulary::subject}，并要直言，这是一份志业。"
"Some work is taken up; some is surrendered to." = "有些工作是人主动选择的，有些则让人甘愿献身。"
"The record gives the trades and the years. What it cannot give is why {@bt_a|::subscribed_books::vocabulary::person} stayed." = "史册记下了行当与年份，却说不出{@bt_a|::subscribed_books::vocabulary::person}为何坚持留在其中。"
"The record gives the trades and the years." = "史册记下了行当与年份。"
"What it cannot give is why {@bt_a|::subscribed_books::vocabulary::person} stayed." = "它却说不出{@bt_a|::subscribed_books::vocabulary::person}为何坚持留在其中。"
"A life's work is the longest argument anyone makes." = "毕生的事业，是一个人能作出的最漫长的论证。"
"I did not drift into my work. I went to it." = "我不是懵懂间进入这一行的。我主动走向了它。"
"I did not drift into my work." = "我不是懵懂间进入这一行的。"
"I went to it." = "我主动走向了它。"
"The record gives my trades and my years. Why I stayed is mine to tell." = "史册记下了我的行当与年岁。至于我为何坚持，该由我自己讲述。"
"The record gives my trades and my years." = "史册记下了我的行当与年岁。"
"Why I stayed is mine to tell." = "至于我为何坚持，该由我自己讲述。"
"A calling is only a habit that knows its own name." = "所谓志业，不过是认得自身名字的习惯。"
"We say people find their work. More often it finds them unready, and waits." = "我们说，人找到了自己的事业。更多时候，却是事业找到尚未准备好的人，并耐心等待。"
"We say people find their work." = "我们说，人找到了自己的事业。"
"More often it finds them unready, and waits." = "更多时候，却是事业找到尚未准备好的人，并耐心等待。"
"It will be said that most people take the work that is offered, and that calling it a calling flatters a necessity." = "有人会说，大多数人只是接下了能得到的工作，把它称为志业，不过是在美化生活的需要。"
"Most people, perhaps. The record of {@bt_a|::subscribed_books::vocabulary::person} is not the record of most people." = "大多数人或许如此。但{@bt_a|::subscribed_books::vocabulary::person}的经历，与大多数人并不相同。"
"Most people, perhaps." = "大多数人或许如此。"
"The record of {@bt_a|::subscribed_books::vocabulary::person} is not the record of most people." = "{@bt_a|::subscribed_books::vocabulary::person}的经历，与大多数人并不相同。"
"Most people, perhaps. My record is not the record of most people." = "大多数人或许如此。但我的经历，与大多数人并不相同。"
"My record is not the record of most people." = "我的经历，与大多数人并不相同。"
"I return to {::subscribed_books::essay_vocabulary::subject}: a calling, followed. There is no higher thing to say of a working life." = "回到{::subscribed_books::essay_vocabulary::subject}：这是一份得以追随的志业。对于一个人的工作生涯，再没有比这更高的赞誉。"
"I return to {::subscribed_books::essay_vocabulary::subject}: a calling, followed." = "回到{::subscribed_books::essay_vocabulary::subject}：这是一份得以追随的志业。"
"There is no higher thing to say of a working life." = "对于一个人的工作生涯，再没有比这更高的赞誉。"
"I have written of my own work. I would choose it again." = "我已写下自己的事业。若能重来，我仍会选择它。"
"I have written of my own work." = "我已写下自己的事业。"
"I would choose it again." = "若能重来，我仍会选择它。"

# 现实需要。
"I will argue that {::subscribed_books::essay_vocabulary::subject} was shaped less by choice than by need, and that there is no shame in that." = "我要论证，{::subscribed_books::essay_vocabulary::subject}与其说源于选择，不如说源于需要，而这并无可耻之处。"
"I write about {::subscribed_books::essay_vocabulary::subject}, and I will not pretend it was all choice. Much of it was need." = "我写下{::subscribed_books::essay_vocabulary::subject}，不会假装一切都是自由选择。其中许多事，是出于生活的需要。"
"I write about {::subscribed_books::essay_vocabulary::subject}, and I will not pretend it was all choice." = "我写下{::subscribed_books::essay_vocabulary::subject}，不会假装一切都是自由选择。"
"Much of it was need." = "其中许多事，是出于生活的需要。"
"Necessity is the quiet author of most lives." = "生活的需要，悄无声息地书写了大多数人的一生。"
"The work went where the need was." = "哪里有需要，工作便走向哪里。"
"We praise the chosen life and forget that most lives are answers to someone else's question." = "我们赞美自主选择的人生，却忘了大多数人的一生都在回答别人提出的问题。"
"Some will say I make {@bt_a|::subscribed_books::vocabulary::person} smaller by saying so." = "有人会说，我这样说，是在贬低{@bt_a|::subscribed_books::vocabulary::person}。"
"Some will say I make myself smaller by saying so." = "有人会说，我这样说，是在贬低自己。"
"I make {@bt_a|::subscribed_books::vocabulary::person} truer. Doing what must be done, and doing it well, is no smaller thing." = "我只是在更真实地描写{@bt_a|::subscribed_books::vocabulary::person}。做必须做的事，并把它做好，同样不失伟大。"
"I make {@bt_a|::subscribed_books::vocabulary::person} truer." = "我只是在更真实地描写{@bt_a|::subscribed_books::vocabulary::person}。"
"Doing what must be done, and doing it well, is no smaller thing." = "做必须做的事，并把它做好，同样不失伟大。"
"I make myself truer. Doing what must be done, and doing it well, is no smaller thing." = "我只是在更真实地描写自己。做必须做的事，并把它做好，同样不失伟大。"
"I make myself truer." = "我只是在更真实地描写自己。"
"I return to {::subscribed_books::essay_vocabulary::subject}: a life of necessity, met. That deserves its own kind of praise." = "回到{::subscribed_books::essay_vocabulary::subject}：这一生，承担了生活所需。这也自有值得赞颂之处。"
"I return to {::subscribed_books::essay_vocabulary::subject}: a life of necessity, met." = "回到{::subscribed_books::essay_vocabulary::subject}：这一生，承担了生活所需。"
"That deserves its own kind of praise." = "这也自有值得赞颂之处。"

# 浪费才华。
"I will argue that {::subscribed_books::essay_vocabulary::subject} is a story of waste - of a talent spent where it was not needed, and withheld where it was." = "我要论证，{::subscribed_books::essay_vocabulary::subject}是一段浪费才华的经历——将才华耗在不需要它的地方，却未用于真正需要它之处。"
"Not every change of work is growth." = "并非每一次转行都是成长。"
"The years given to one trade are years taken from another." = "投给一种行当的岁月，也就是从另一种行当那里拿走的岁月。"
"Waste is the one failure that looks like industry from outside." = "唯有浪费这种失败，从外表看起来竟像是勤勉。"
"It will be said that {@bt_a|::subscribed_books::vocabulary::person} had the right to spend a life as {@bt_a2|::subscribed_books::vocabulary::person} chose." = "有人会说，{@bt_a|::subscribed_books::vocabulary::person}有权按照{@bt_a2|::subscribed_books::vocabulary::person}自己的选择度过一生。"
"The right, certainly. I only say the choice was poor." = "当然有这个权利。我只是说，这个选择不好。"
"The right, certainly." = "当然有这个权利。"
"I only say the choice was poor." = "我只是说，这个选择不好。"
"I return to {::subscribed_books::essay_vocabulary::subject}, and I name it plainly: a waste. I would be glad to be wrong." = "回到{::subscribed_books::essay_vocabulary::subject}，我要直言称它为浪费。我倒希望是自己错了。"
"I return to {::subscribed_books::essay_vocabulary::subject}, and I name it plainly: a waste." = "回到{::subscribed_books::essay_vocabulary::subject}，我要直言称它为浪费。"
"I would be glad to be wrong." = "我倒希望是自己错了。"

# 雄心。
"I will argue that {::subscribed_books::essay_vocabulary::subject} is best understood as ambition, plainly: a climb, deliberately made." = "我要论证，{::subscribed_books::essay_vocabulary::subject}最适合用雄心来解释。说得直白些，这是一场有意为之的攀登。"
"I write about {::subscribed_books::essay_vocabulary::subject}, and I admit that I wanted more than I was given." = "我写下{::subscribed_books::essay_vocabulary::subject}，也承认，我想要的比已经得到的更多。"
"Every step in the record is a step upward." = "史册中的每一步，都是向上走的一步。"
"Ambition does not hide in the record; it is the record." = "雄心并未藏在记载背后；它就是这份记载本身。"
"We distrust ambition in others and call it purpose in ourselves." = "我们不信任他人的雄心，却把自己的雄心称为志向。"
"It will be said that I mistake a working life for a scheme." = "有人会说，我把一段工作生涯误当成了一场谋划。"
"A working life with this shape is a scheme, whether or not it was ever called one." = "这样一段工作生涯，就是一场谋划，无论过去是否有人这样称呼它。"
"I return to {::subscribed_books::essay_vocabulary::subject}: an ambition, pursued. Whether it was worth it is for others to say." = "回到{::subscribed_books::essay_vocabulary::subject}：这是一段追逐雄心的经历。至于是否值得，就留待别人评说。"
"I return to {::subscribed_books::essay_vocabulary::subject}: an ambition, pursued." = "回到{::subscribed_books::essay_vocabulary::subject}：这是一段追逐雄心的经历。"
"Whether it was worth it is for others to say." = "至于是否值得，就留待别人评说。"
