"Pious words will not hide that {::subscribed_books::speech::religion::entity} were told to {::subscribed_books::speech::religion::action} {::subscribed_books::speech::religion::object} or else starve." = "虔诚话语藏不住事实：{::subscribed_books::speech::religion::entity}被告知，不{::subscribed_books::speech::religion::action}{::subscribed_books::speech::religion::object}就要挨饿。"
"{::subscribed_books::speech::religion::entity} kneel to no one who would {::subscribed_books::speech::religion::action} {::subscribed_books::speech::religion::object} merely to control us." = "{::subscribed_books::speech::religion::entity}不会向仅为控制我们而{::subscribed_books::speech::religion::action}{::subscribed_books::speech::religion::object}的人下跪。"
"You confuse obedience with devotion. {::subscribed_books::speech::religion::entity} will not {::subscribed_books::speech::religion::action} {::subscribed_books::speech::religion::object} to please you." = "你把服从混同虔诚。{::subscribed_books::speech::religion::entity}不会为取悦你而{::subscribed_books::speech::religion::action}{::subscribed_books::speech::religion::object}。"
"Let the gods decide. {::subscribed_books::speech::religion::entity} will not {::subscribed_books::speech::religion::action} {::subscribed_books::speech::religion::object} at your command." = "让众神决定。{::subscribed_books::speech::religion::entity}不会听你命令{::subscribed_books::speech::religion::action}{::subscribed_books::speech::religion::object}。"
"We have lost more to faith than you ever will. Do not lecture {::subscribed_books::speech::religion::entity} on {::subscribed_books::speech::religion::object}." = "我们因信仰失去的，比你一生将失去的更多。别教训{::subscribed_books::speech::religion::entity}如何对待{::subscribed_books::speech::religion::object}。"
"If devotion means the blind {::subscribed_books::speech::religion::action} of {::subscribed_books::speech::religion::object}, then {::subscribed_books::speech::religion::entity} choose to be faithless." = "如果虔诚意味着盲目地{::subscribed_books::speech::religion::action}{::subscribed_books::speech::religion::object}，那么{::subscribed_books::speech::religion::entity}宁愿不信。"

[[rulesets]]
name = "governance"
[rulesets.rules]
"You would {::subscribed_books::speech::governance::action} {::subscribed_books::speech::governance::body} and call it justice?" = "你想{::subscribed_books::speech::governance::action}{::subscribed_books::speech::governance::body}，还管这叫正义？"
"Your {::subscribed_books::speech::governance::policy} is tyranny by another name." = "你的{::subscribed_books::speech::governance::policy}只是换了个名字的暴政。"
"{::subscribed_books::speech::governance::policy} was written in blood, and you know it." = "{::subscribed_books::speech::governance::policy}是用血写成的，你心知肚明。"
"We will not stand by while you {::subscribed_books::speech::governance::action} {::subscribed_books::speech::governance::body}." = "你{::subscribed_books::speech::governance::action}{::subscribed_books::speech::governance::body}时，我们不会袖手旁观。"
"How dare you {::subscribed_books::speech::governance::action} {::subscribed_books::speech::governance::body} under the banner of order." = "你怎敢打着秩序的旗号{::subscribed_books::speech::governance::action}{::subscribed_books::speech::governance::body}？"
"{::subscribed_books::speech::governance::body} was never yours to {::subscribed_books::speech::governance::action}." = "{::subscribed_books::speech::governance::body}从不是任你{::subscribed_books::speech::governance::action}的东西。"
"Every word of your {::subscribed_books::speech::governance::policy} reeks of the throne." = "你的{::subscribed_books::speech::governance::policy}每个字都散发着王座的臭味。"
"If {::subscribed_books::speech::governance::policy} passes, the council is a corpse." = "如果{::subscribed_books::speech::governance::policy}通过，议会就成了尸体。"
"You {::subscribed_books::speech::governance::action} {::subscribed_books::speech::governance::body} like a butcher counts cuts." = "你{::subscribed_books::speech::governance::action}{::subscribed_books::speech::governance::body}，就像屠夫数着肉块。"
"{::subscribed_books::speech::governance::policy}? I have seen this script before. It ends in chains." = "{::subscribed_books::speech::governance::policy}？这套剧本我见过，结局是锁链。"
"Do you think the people will thank you when you {::subscribed_books::speech::governance::action} {::subscribed_books::speech::governance::body}?" = "你{::subscribed_books::speech::governance::action}{::subscribed_books::speech::governance::body}时，以为人民会感激你吗？"
"Your {::subscribed_books::speech::governance::policy} buys silence, not peace." = "你的{::subscribed_books::speech::governance::policy}买来的是沉默，不是和平。"
"I will not let you {::subscribed_books::speech::governance::action} {::subscribed_books::speech::governance::body} without a fight." = "我不会让你毫无阻碍地{::subscribed_books::speech::governance::action}{::subscribed_books::speech::governance::body}。"
"{::subscribed_books::speech::governance::body} belongs to the governed, not the governors who {::subscribed_books::speech::governance::action}." = "{::subscribed_books::speech::governance::body}属于被统治者，而非那些{::subscribed_books::speech::governance::action}的统治者。"
"This {::subscribed_books::speech::governance::policy} is a knife dressed as a law." = "这个{::subscribed_books::speech::governance::policy}，是一把打扮成法律的刀。"
"You {::subscribed_books::speech::governance::action} {::subscribed_books::speech::governance::body} and expect loyalty in return?" = "你{::subscribed_books::speech::governance::action}{::subscribed_books::speech::governance::body}，还指望换来忠诚？"
"{::subscribed_books::speech::governance::policy} is the crack where the whole wall falls." = "{::subscribed_books::speech::governance::policy}就是会让整堵墙坍塌的裂缝。"
"Mark me: if you {::subscribed_books::speech::governance::action} {::subscribed_books::speech::governance::body}, I name you traitor." = "记清楚：你若{::subscribed_books::speech::governance::action}{::subscribed_books::speech::governance::body}，我就称你为叛徒。"
"Your {::subscribed_books::speech::governance::policy} has no mercy in it, only math." = "你的{::subscribed_books::speech::governance::policy}没有仁慈，只有算计。"
"We are not cattle for you to {::subscribed_books::speech::governance::action} {::subscribed_books::speech::governance::body}." = "我们不是任你{::subscribed_books::speech::governance::action}{::subscribed_books::speech::governance::body}的牲口。"
"If we {::subscribed_books::speech::governance::action} {::subscribed_books::speech::governance::body}, there is no one left to hold us accountable." = "若我们{::subscribed_books::speech::governance::action}{::subscribed_books::speech::governance::body}，就再无人追究我们的责任。"
"{::subscribed_books::speech::governance::policy} has been tried before. It ended badly." = "{::subscribed_books::speech::governance::policy}以前试过，结局很糟。"
"You call it tyranny. I call it the only thing standing between us and ruin." = "你叫它暴政，我叫它挡在我们和毁灭之间的唯一东西。"
"{::subscribed_books::speech::governance::body} cannot survive without the {::subscribed_books::speech::governance::policy} that shields it." = "没有{::subscribed_books::speech::governance::policy}保护，{::subscribed_books::speech::governance::body}就活不下来。"
"Would you rather {::subscribed_books::speech::governance::action} {::subscribed_books::speech::governance::body} or watch the realm burn?" = "你宁愿{::subscribed_books::speech::governance::action}{::subscribed_books::speech::governance::body}，还是看着国度焚毁？"
"The {::subscribed_books::speech::governance::policy} is harsh because the world is harsh." = "{::subscribed_books::speech::governance::policy}严酷，因为世界严酷。"
"I did not {::subscribed_books::speech::governance::action} {::subscribed_books::speech::governance::body} for glory. I did it for the wall at our backs." = "我{::subscribed_books::speech::governance::action}{::subscribed_books::speech::governance::body}不是为荣耀，而是为了我们背后的墙。"
"{::subscribed_books::speech::governance::policy} is not a crown. It is a crutch, and we are broken." = "{::subscribed_books::speech::governance::policy}不是王冠，而是拐杖，因为我们已残破。"
"You speak of chains. I speak of the order that keeps yours off." = "你谈锁链，我谈让你免戴锁链的秩序。"
"If {::subscribed_books::speech::governance::policy} falls, who {::subscribed_books::speech::governance::action} {::subscribed_books::speech::governance::body} next? Your neighbor. Then you." = "若{::subscribed_books::speech::governance::policy}倒下，下一个{::subscribed_books::speech::governance::action}{::subscribed_books::speech::governance::body}的是谁？你的邻居，然后就是你。"
"I have {::subscribed_books::speech::governance::action} {::subscribed_books::speech::governance::body} a hundred times in my dreams, and each time it spared us." = "我在梦里{::subscribed_books::speech::governance::action}{::subscribed_books::speech::governance::body}一百次，每次都救了我们。"
"Your outrage is loud. The {::subscribed_books::speech::governance::policy} is quiet. That is why it works." = "你的愤怒很响，{::subscribed_books::speech::governance::policy}却安静。这正是它奏效的原因。"
"We {::subscribed_books::speech::governance::action} {::subscribed_books::speech::governance::body} so that no king ever need {::subscribed_books::dramatic::ref_repeat_2} {::subscribed_books::dramatic::ref_repeat_3} again." = "我们{::subscribed_books::speech::governance::action}{::subscribed_books::speech::governance::body}，是为了再不让任何国王需要{::subscribed_books::dramatic::ref_repeat_2}{::subscribed_books::dramatic::ref_repeat_3}。"
"{::subscribed_books::speech::governance::policy} is ugly. So is the wound it closes." = "{::subscribed_books::speech::governance::policy}丑陋，它封合的伤口也一样。"
"Do not mistake my {::subscribed_books::speech::governance::policy} for cruelty. Mistake it for survival." = "别把我的{::subscribed_books::speech::governance::policy}认作残酷，认作求生才对。"
"You would undo {::subscribed_books::speech::governance::policy} and leave {::subscribed_books::speech::governance::body} to the wolves?" = "你想撤销{::subscribed_books::speech::governance::policy}，把{::subscribed_books::speech::governance::body}丢给狼群？"
"I {::subscribed_books::speech::governance::action} {::subscribed_books::speech::governance::body} with a heavy hand because a light one was ignored." = "我用重手{::subscribed_books::speech::governance::action}{::subscribed_books::speech::governance::body}，因为轻手被忽略了。"
"The {::subscribed_books::speech::governance::policy} is not the enemy. The silence after it is gone will be." = "{::subscribed_books::speech::governance::policy}不是敌人。它消失后的沉默才是。"
"If you will not {::subscribed_books::speech::governance::action} {::subscribed_books::speech::governance::body}, then tell me who will." = "若你不肯{::subscribed_books::speech::governance::action}{::subscribed_books::speech::governance::body}，那告诉我，谁会？"
"{::subscribed_books::speech::governance::policy} kept the peace you now curse. Remember that when it breaks." = "{::subscribed_books::speech::governance::policy}保住了你如今诅咒的和平。和平破碎时，记得这点。"

[[rulesets]]
name = "diplomacy"
[rulesets.rules]
"You want to {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target}? Have you learned nothing from history?" = "你想{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}？历史没教会你任何事吗？"
"Every time you {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target}, it's the rest of us who pay the price." = "每次你{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}，都是我们其他人付代价。"
"You would {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target} without asking who'd suffer for it -- typical." = "你想{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}，却不问谁会受苦，真是你的作风。"
"So the plan is to {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target} and hope no one notices the cost?" = "所以计划是{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}，再希望没人留意代价？"
"We buried good people the last time someone was fool enough to {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target}." = "上次有人蠢到{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}时，我们埋了好人。"
"You call it strategy. I call it deciding to {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target} and praying it works." = "你叫它策略，我叫它决定{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}，然后祈祷有效。"
"To {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target} now is not diplomacy -- it is a gamble with other people's lives." = "现在{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}，不是外交，而是拿别人的命赌博。"
"You'd {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target} and sleep soundly after. I envy that." = "你会{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}，然后安稳入睡。我倒羡慕。"
"Not this again. Not another push to {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target}, not now, not ever." = "别再来一次。别再推动{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}，现在不行，永远不行。"
"What gives you the right to {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target} on behalf of all of us?" = "你有何权利代表我们所有人{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}？"
"You would risk everything we've built just to {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target}?" = "你想为{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}，冒险毁掉我们建立的一切？"
"I trusted your judgment once. Then you decided to {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target}." = "我曾信任你的判断。后来你决定{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}。"
"How many times must we watch you {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target} before it ends badly?" = "我们还得看你{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}多少次，事情才会以惨败收场？"
"Fine -- {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target}. Explain it to the widows after." = "好，那就{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}。事后去向寡妇解释。"
"There is a word for wanting to {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target} right now, and it isn't wisdom." = "现在想{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}，有一个词能形容，绝不是智慧。"
"Do you even hear yourself, wanting to {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target} as though it were simple?" = "你听见自己说什么了吗？想{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}，仿佛这很简单。"
"Fifty years of peace, and you'd throw it away to {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target}." = "五十年和平，你竟想为{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}把它丢掉。"
"Go ahead and {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target}. See how fast the council turns on you." = "去吧，{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}。看议会会多快反对你。"
"You speak of wanting to {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target} as if it costs nothing. It costs everything." = "你谈起想{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}，仿佛毫无代价。代价是一切。"
"Every warning I gave you, and still you mean to {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target}." = "我给过你每一项警告，你却仍想{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}。"
"If we {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target}, we will have no allies left when we truly need them." = "若我们{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}，真正需要盟友时，就再无盟友。"
"And what happens the day after we {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target}? Have you thought that far?" = "我们{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}之后的第二天会怎样？你想过那么远吗？"
"You keep saying it's the only way. It's just the easiest one." = "你一直说这是唯一的办法。其实只是最容易的。"
"We don't need to {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target}. We need patience, which you don't have." = "我们不需要{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}，需要的是你没有的耐心。"
"The moment we {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target}, every promise we've made becomes a lie." = "我们一旦{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}，许下的每项承诺都变成谎言。"
"Reckless. That's the only word for wanting to {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target} right now." = "莽撞。现在想{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}，只有这个词能形容。"
"If you {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target}, you had better be ready to bury the consequences yourself." = "你若{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}，最好准备好亲自掩埋后果。"
"There's still time to choose differently before we {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target}." = "在我们{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}之前，仍有时间作出不同选择。"
"You want to {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target}? Then you explain it, not me." = "你想{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}？那由你解释，别找我。"
"We tried something like this before. It cost us a generation of trust." = "以前试过类似的事，付掉的是一代人的信任。"
"To {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target} now is to burn a bridge we'll beg to cross later." = "现在{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}，就是烧掉我们日后会乞求跨过的桥。"
"I won't stand here and pretend that choosing to {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target} solves anything." = "我不会站在这里，假装选择{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}就解决了什么。"
"Every ally we have is watching to see if we'll {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target} rashly." = "我们每个盟友都在看着，看我们会不会贸然{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}。"
"Slow down. Nothing good ever came from rushing to {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target}." = "慢些。急着{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}从来没带来好事。"
"You call it boldness. History will call it the reason we lost {::subscribed_books::speech::diplomacy::target}." = "你叫它大胆，历史会叫它我们失去{::subscribed_books::speech::diplomacy::target}的原因。"
"If we {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target} without a plan, don't come to me when it unravels." = "若毫无计划地{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}，崩盘时别来找我。"
"There is no glory in deciding to {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target} out of spite." = "出于怨恨而决定{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}，没有荣耀。"
"We are not ready. We were never going to be ready to {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target}." = "我们没准备好，也绝不可能准备好去{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}。"
"Think of what we lose, not just what we gain, if we {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target}." = "若我们{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}，想想失去什么，别只想得到什么。"
"I have seen where this road leads if we {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target}, and it isn't where you think." = "我见过{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}会让这条路通向哪里，那不是你以为的地方。"

[[rulesets]]
name = "expansion"
[rulesets.rules]
"You would {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target} without even scouting it first? People will die for your impatience." = "你连侦察都不做就想{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}？有人会为你的急躁而死。"
"You want to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target} before we've even mapped the way in?" = "我们连入口路线都没画好，你就想{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}？"
"Every fool who rushed to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target} left someone behind to die for it." = "每个急着{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}的傻子，都留下旁人为它送命。"
"So the plan is to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target} on a whim, is it?" = "所以计划是一时兴起就{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}，是吗？"
"We lost three scouts the last time someone was eager to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target}." = "上次有人急着{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}，我们失去了三个侦察员。"
"You call it opportunity. I call it deciding to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target} with no plan at all." = "你叫它机会，我叫它毫无计划就决定{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}。"
"To {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target} now, with winter coming, is nothing short of reckless." = "冬天将至，现在{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}，根本就是莽撞。"
"You'd {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target} and call it progress. I call it a grave with extra steps." = "你会{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}，并称之为进步。我叫它多绕几步才抵达的坟墓。"
"Not this again. Not another rush to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target}, not without a survey team first." = "别再来一次。没先派勘测队，就别再急着{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}。"
"What gives you the right to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target} for all of us, alone?" = "你有何权利独自代表我们所有人{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}？"
"You would risk every worker we have just to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target}?" = "你想为{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}，让每个工人冒险？"
"I trusted your judgment once. Then you decided to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target} unprepared." = "我曾信任你的判断。后来你决定毫无准备地{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}。"
"How many more must we lose before you stop rushing to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target}?" = "还得失去多少人，你才会停止急着{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}？"
"Fine -- {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target}. Explain it to their families after." = "好，那就{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}。事后去向他们的家人解释。"
"There is a word for wanting to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target} blind, and it isn't courage." = "盲目想{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}，有一个词能形容，绝不是勇气。"
"Do you even hear yourself, wanting to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target} as though nothing could go wrong?" = "你听见自己说什么了吗？想{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}，仿佛不会有任何事出错。"
"Years of careful growth, and you'd throw it away to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target} overnight." = "多年谨慎发展，你竟想一夜间为{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}把它丢掉。"
"Go ahead and {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target}. See how fast the volunteers vanish." = "去吧，{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}。看志愿者会多快消失。"
"You speak of wanting to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target} as if the ground owes us nothing back." = "你谈起想{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}，仿佛大地不会向我们讨回什么。"
"Every warning I gave you, and still you mean to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target} unscouted." = "我给过你每一项警告，你却仍想未经侦察就{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}。"
"The last group to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target} never came back." = "上次去{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}的那群人，再没回来。"
"And who exactly will {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target} once the food runs low?" = "食物不足时，究竟谁去{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}？"
"You keep saying it's the only way. It's just the fastest one." = "你一直说这是唯一的办法。其实只是最快的。"
"We don't need to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target}. We need supplies, which you haven't gathered." = "我们不需要{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}，需要的是你尚未备齐的补给。"
"The moment we {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target}, every plan we made this season falls apart." = "一旦我们{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}，这季所有计划都崩散。"
"Reckless. That's the only word for wanting to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target} unprepared." = "莽撞。毫无准备地想{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}，只有这个词能形容。"
"If you {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target}, you had better be ready to lead the burial detail yourself." = "你若{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}，最好准备好亲自带领掩埋队。"
"There's still time to wait before we {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target}." = "在我们{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}之前，仍有时间再等等。"
"You want to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target}? Then you go first." = "你想{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}？那你先去。"
"We tried something like this before. It cost us half the harvest." = "以前试过类似的事，付掉的是一半收成。"
"To {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target} now is to gamble everything we stockpiled all year." = "现在{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}，就是拿全年储备的一切赌博。"
"I won't stand here and pretend that choosing to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target} without scouts is wise." = "我不会站在这里，假装没有侦察员就选择{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}是明智的。"
"Every worker we have is watching to see if we'll {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target} blindly." = "我们每个工人都在看着，看我们会不会盲目{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}。"
"There is no prize for being first to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target}. Only a grave, usually." = "第一个{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}的人没有奖品，通常只有坟墓。"
"You call it ambition. I call it the reason we'll lose people to {::subscribed_books::speech::expansion::target}." = "你叫它野心，我叫它我们会因{::subscribed_books::speech::expansion::target}失去人的原因。"
"You want to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target} on instinct alone? Instinct doesn't feed anyone through winter." = "你想单凭本能{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}？本能养不活人过冬。"
"There is no glory in deciding to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target} out of pride." = "出于骄傲而决定{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}，没有荣耀。"
"Every season we wait, someone else claims what we could have had. That's not an excuse to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target} blind, though." = "每等一季，别人就占去我们本可拥有的东西，但这也不是盲目{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}的借口。"
"You count what we'd gain. I count the names we'd carve into stone after." = "你数着能得到什么，我数着事后会刻上石头的名字。"
"The wilds don't care how badly we want to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target}. They take what they want regardless." = "荒野不在乎我们多想{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}，它照样取走想要的东西。"

[[rulesets]]
name = "thread"
[rulesets.rules]
"This is where it begins -- quietly, before anyone notices." = "故事从这里开始，安静地，在任何人察觉之前。"
"{@bt_proto|::subscribed_books::vocabulary::person} does not yet know what this story will ask." = "{@bt_proto|::subscribed_books::vocabulary::person}还不知道这个故事将索取什么。"
"Nothing worth doing comes easily. This is no exception." = "值得做的事没有一件容易，这也不例外。"
"The path grows harder, and {@bt_proto|::subscribed_books::vocabulary::person} presses on regardless." = "道路愈发艰难，{@bt_proto|::subscribed_books::vocabulary::person}却照样继续。"
"This is the moment all the rest has led to." = "就是这一刻，此前的一切都通向这里。"
"Everything now hangs in the balance." = "如今一切悬而未决。"
"And so it ends -- not as it began, but as it had to." = "于是结束，并非如开始时那样，而是如它必须如此的那样。"
"The story does not end here. But this scene does." = "故事并不在这里结束，这一场却会。"

[[rulesets]]
name = "beat"
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} stands at the threshold, not yet knowing what lies beyond." = "{@bt_a|::subscribed_books::vocabulary::person}站在门槛上，还不知道外面是什么。"
"The quiet before the start -- {@bt_a|::subscribed_books::vocabulary::person} feels it, even without a name for it." = "开端之前的寂静，{@bt_a|::subscribed_books::vocabulary::person}感受到了，哪怕说不出它的名字。"
"{@bt_a|::subscribed_books::vocabulary::person} presses on, through doubt, through difficulty, through fear." = "{@bt_a|::subscribed_books::vocabulary::person}穿过疑虑、困难、恐惧，继续向前。"
"The trial tests {a_pos} resolve, and {@bt_a|::subscribed_books::vocabulary::person} does not break." = "试炼考验{a_pos}决心，{@bt_a|::subscribed_books::vocabulary::person}却并未崩溃。"
"This is the reckoning, and {@bt_a|::subscribed_books::vocabulary::person} can feel it approaching." = "这是清算，{@bt_a|::subscribed_books::vocabulary::person}能感觉它正在逼近。"
"Everything {@bt_a|::subscribed_books::vocabulary::person} has built now balances on a single moment." = "{@bt_a|::subscribed_books::vocabulary::person}建立的一切，如今系于唯一的时刻。"
"{@bt_a|::subscribed_books::vocabulary::person} looks back at the road behind, and does not recognize the one who walked it." = "{@bt_a|::subscribed_books::vocabulary::person}回望身后的路，却已不认识曾走过它的人。"
"It is over now -- {@bt_a|::subscribed_books::vocabulary::person} is not the same." = "如今结束了，{@bt_a|::subscribed_books::vocabulary::person}已不再一样。"

[[rulesets]]
name = "action"
[rulesets.rules]
"{@bt_name|::subscribed_books::vocabulary::person} looks away." = "{@bt_name|::subscribed_books::vocabulary::person}移开目光。"
"{@bt_name|::subscribed_books::vocabulary::person} crosses {a_pos} arms." = "{@bt_name|::subscribed_books::vocabulary::person}交叉抱起双臂。"
"{@bt_name|::subscribed_books::vocabulary::person} paces a step, then stops." = "{@bt_name|::subscribed_books::vocabulary::person}踱一步，随后停下。"
"{@bt_name|::subscribed_books::vocabulary::person} lets out a slow breath." = "{@bt_name|::subscribed_books::vocabulary::person}缓缓吐出一口气。"
"{@bt_name|::subscribed_books::vocabulary::person} glances toward the door." = "{@bt_name|::subscribed_books::vocabulary::person}瞥向门。"
"{@bt_name|::subscribed_books::vocabulary::person} falls silent for a moment, jaw tight." = "{@bt_name|::subscribed_books::vocabulary::person}沉默片刻，咬紧牙关。"

[[rulesets]]
name = "romantic"
[rulesets.rules]
"I have spent weeks trying to find the right words. I never found them. So I will just say it plainly: I think about you constantly, and I would like that to mean something." = "我花了几周想找合适的话，却一直没找到。所以我就直说了：我时时想着你，也希望这能意味着什么。"
"This is probably a mistake. You are probably going to say no. But I would rather hear you say no than spend the rest of my life wondering what you would have said." = "这也许是个错误。你也许会拒绝。但我宁愿听你说不，也不愿余生都猜想你本会说什么。"
"I brought you something. I made it. It is supposed to be you. It is not very good." = "我给你带了样东西，是我做的。本想做成你的样子，不太好看。"
"It took you long enough." = "你可真让我等了够久。"
"You are not wrong. This is probably a mistake. Let us make it together." = "你没说错，这也许是个错误。让我们一起犯吧。"
"I only want what is best for the settlement. And what is best, I think we can agree, is that the current leadership step aside." = "我只想为聚落谋求最好。我想我们能同意，最好的就是让现任领导退位。"
"Consider your position. You have enemies. I can protect you from them. All I ask is a small favor in return." = "想想你的处境。你有敌人，我能保护你免遭他们伤害。我只求你回报一个小小的忙。"
"You know, I heard something interesting about the council's vote. Something that certain people might find embarrassing, if it became public." = "你知道吗，我听说了议会表决的一件趣事。如果公开，某些人可能会很难堪。"

