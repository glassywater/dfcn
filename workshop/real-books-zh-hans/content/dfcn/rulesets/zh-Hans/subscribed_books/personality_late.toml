base = "subscribed_books::personality_late"

[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} reacted before thinking. The words were out, sharp and regrettable, before {::subscribed_books::personality::pro1} could stop them." = "{@bt_a|::subscribed_books::vocabulary::person}还没想清楚就作出了反应。尖刻而令人后悔的话已经脱口而出，根本来不及制止。"
"{@bt_a|::subscribed_books::vocabulary::person} snapped back before {@bt_b|::subscribed_books::vocabulary::person} had even finished the sentence." = "{@bt_b|::subscribed_books::vocabulary::person}话还没说完，{@bt_a|::subscribed_books::vocabulary::person}就反唇相讥。"
"The words left {@bt_a|::subscribed_books::vocabulary::person}'s mouth faster than {::subscribed_books::personality::pro1} could weigh them, and by then it was too late to take them back." = "{@bt_a|::subscribed_books::vocabulary::person}的话比思考更快地冲出口中，想收回时已经晚了。"
"{@bt_a|::subscribed_books::vocabulary::person} was three insults deep before {::subscribed_books::personality::pro1} realized {::subscribed_books::personality::pro2} probably should have paused first." = "{@bt_a|::subscribed_books::vocabulary::person}已经连骂了三句，才意识到自己原本该先停一停。"
"It only took one wrong word to set {@bt_a|::subscribed_books::vocabulary::person} off, and once {::subscribed_books::personality::pro1} was off, there was no calling {::subscribed_books::personality::obj1} back." = "只消一句不对的话，就能惹怒{@bt_a|::subscribed_books::vocabulary::person}；一旦发作，谁也劝不回来。"
"{@bt_a|::subscribed_books::vocabulary::person} fired back instantly, and only realized how far {::subscribed_books::personality::pro1}'d gone once {@bt_b|::subscribed_books::vocabulary::person}'s face changed." = "{@bt_a|::subscribed_books::vocabulary::person}立刻还击，直到{@bt_b|::subscribed_books::vocabulary::person}脸色变了才意识到自己说得有多过分。"
"There was no filter between what {@bt_a|::subscribed_books::vocabulary::person} felt and what {@bt_a2|::subscribed_books::vocabulary::person} said. There rarely was." = "{@bt_a|::subscribed_books::vocabulary::person}心里怎么想，嘴上就怎么说，一向如此。"
"{@bt_a|::subscribed_books::vocabulary::person} slammed a hand on the table before {::subscribed_books::personality::pro1} had even decided that was what {::subscribed_books::personality::pro2} wanted to do." = "{@bt_a|::subscribed_books::vocabulary::person}还没决定要这样做，手就已经拍在桌上了。"
"The argument had barely started before {@bt_a|::subscribed_books::vocabulary::person} had already said something {::subscribed_books::personality::pro1} would regret by evening." = "争论才刚开始，{@bt_a|::subscribed_books::vocabulary::person}就已经说出了到晚上会后悔的话。"
"{@bt_a|::subscribed_books::vocabulary::person} interrupted with a retort {::subscribed_books::personality::pro1} hadn't fully thought through, and it showed." = "{@bt_a|::subscribed_books::vocabulary::person}出言打断，反驳的话尚未想透，这一点很明显。"
"By the time {@bt_a|::subscribed_books::vocabulary::person} caught up with what {::subscribed_books::personality::pro1}'d just said, it was already out there, doing damage." = "{@bt_a|::subscribed_books::vocabulary::person}反应过来自己刚才说了什么时，那些话已经传出去，造成伤害了。"
"{@bt_a|::subscribed_books::vocabulary::person} lunged into the argument headfirst, no plan, no pause, just reaction." = "{@bt_a|::subscribed_books::vocabulary::person}一头扎进争论，没有打算，没有停顿，只有本能的反应。"
"One sharp comment from {@bt_b|::subscribed_books::vocabulary::person} and {@bt_a|::subscribed_books::vocabulary::person} was off like a shot, no warm-up required." = "{@bt_b|::subscribed_books::vocabulary::person}一句尖刻的话就让{@bt_a|::subscribed_books::vocabulary::person}立即发作，根本不用酝酿。"
"{@bt_a|::subscribed_books::vocabulary::person} said the cruelest thing {::subscribed_books::personality::pro1} could think of in the moment, and thought about whether {::subscribed_books::personality::pro2} meant it only afterward." = "{@bt_a|::subscribed_books::vocabulary::person}说出了一时能想到的最恶毒的话，事后才思考自己是否真这样想。"
"{@bt_a|::subscribed_books::vocabulary::person} couldn't hold it in for even a second. Whatever {::subscribed_books::personality::pro1} felt, {::subscribed_books::personality::pro2} said, immediately." = "{@bt_a|::subscribed_books::vocabulary::person}连一秒都忍不住。有什么感受，立刻就会说出来。"
"The retort was out of {@bt_a|::subscribed_books::vocabulary::person}'s mouth before the thought behind it had fully formed." = "{@bt_a|::subscribed_books::vocabulary::person}反驳的话已经脱口而出，背后的想法却还没形成。"
"{@bt_a|::subscribed_books::vocabulary::person} went from calm to shouting in under a breath." = "{@bt_a|::subscribed_books::vocabulary::person}转眼间就从平静变成了大声吼叫。"
"{@bt_a|::subscribed_books::vocabulary::person} didn't build up to the outburst. {::subscribed_books::personality::pro1} just arrived there, all at once." = "{@bt_a|::subscribed_books::vocabulary::person}的爆发没有任何铺垫，一下子就来了。"
"It wasn't that {@bt_a|::subscribed_books::vocabulary::person} wanted to say it. It was that {@bt_a2|::subscribed_books::vocabulary::person} never really had the chance to decide not to." = "不是{@bt_a|::subscribed_books::vocabulary::person}想说出那些话，而是根本没来得及决定不说。"
"{@bt_a|::subscribed_books::vocabulary::person} reacted first and thought about the consequences only once {@bt_b|::subscribed_books::vocabulary::person} had already stormed off." = "{@bt_a|::subscribed_books::vocabulary::person}先作出反应，等到{@bt_b|::subscribed_books::vocabulary::person}愤然离去后才想起后果。"

[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} chased the thief on instinct, sprinting before {::subscribed_books::personality::pos1} mind caught up with {::subscribed_books::personality::pos2} legs." = "{@bt_a|::subscribed_books::vocabulary::person}凭本能追赶窃贼，大脑还没反应过来，两条腿就已飞奔。"
"{@bt_a|::subscribed_books::vocabulary::person} was already running before {::subscribed_books::personality::pro1} had even finished processing what had just been stolen." = "{@bt_a|::subscribed_books::vocabulary::person}还没完全弄清刚才丢了什么，人就已经跑起来了。"
"{@bt_a|::subscribed_books::vocabulary::person} lunged after the thief without a plan, without a weapon, without a second thought." = "{@bt_a|::subscribed_books::vocabulary::person}扑向窃贼，没有计划，没有武器，也没有一丝迟疑。"
"By the time anyone thought to stop {@bt_a|::subscribed_books::vocabulary::person}, {::subscribed_books::personality::pro1} was already halfway down the street after the thief." = "等别人想到要拦住{@bt_a|::subscribed_books::vocabulary::person}时，人已经追着窃贼跑出半条街了。"
"{@bt_a|::subscribed_books::vocabulary::person} didn't call for help. {::subscribed_books::personality::pro1} just moved, fast and unthinking." = "{@bt_a|::subscribed_books::vocabulary::person}没叫人帮忙，直接迅速而不假思索地行动起来。"
"The theft hadn't even fully registered before {@bt_a|::subscribed_books::vocabulary::person}'s legs were already carrying {::subscribed_books::personality::obj1} after the thief." = "偷窃的事实还没完全进入脑海，{@bt_a|::subscribed_books::vocabulary::person}的双腿就已经带着自己追了上去。"
"{@bt_a|::subscribed_books::vocabulary::person} tackled the fleeing thief without considering whether that was remotely a good idea." = "{@bt_a|::subscribed_books::vocabulary::person}扑倒了逃跑的窃贼，丝毫没考虑这样做到底是否明智。"
"There was no calculation in it. {@bt_a|::subscribed_books::vocabulary::person} simply reacted, chasing on pure impulse." = "这当中没有盘算。{@bt_a|::subscribed_books::vocabulary::person}只是凭着冲动作出反应，拔腿就追。"
"{@bt_a|::subscribed_books::vocabulary::person} shoved through the crowd after the thief, heedless of who {::subscribed_books::personality::pro1} knocked aside getting there." = "{@bt_a|::subscribed_books::vocabulary::person}挤过人群追赶窃贼，全然不顾一路撞开了谁。"
"The stolen item barely mattered anymore. {@bt_a|::subscribed_books::vocabulary::person} just wanted to catch {::subscribed_books::personality::pos1} target, immediately, whatever it took." = "失窃的东西已经几乎不重要了。{@bt_a|::subscribed_books::vocabulary::person}只想立刻抓住目标，不惜代价。"
"{@bt_a|::subscribed_books::vocabulary::person} was over the fence and into the alley before {::subscribed_books::personality::pro1} had even decided to give chase." = "{@bt_a|::subscribed_books::vocabulary::person}还没决定要追，人就已经翻过围栏冲进巷子了。"
"Someone yelled \"thief,\" and {@bt_a|::subscribed_books::vocabulary::person} was already moving before the word finished leaving their mouth." = "有人喊了一声“抓贼”，话还没说完，{@bt_a|::subscribed_books::vocabulary::person}就已经动身。"
"{@bt_a|::subscribed_books::vocabulary::person} grabbed the nearest object to throw and hurled it at the fleeing thief without thinking it through." = "{@bt_a|::subscribed_books::vocabulary::person}随手抓起最近的东西，想也不想就朝逃跑的窃贼扔了过去。"
"{@bt_a|::subscribed_books::vocabulary::person} didn't stop to check if it was safe to follow. {::subscribed_books::personality::pro1} just followed." = "{@bt_a|::subscribed_books::vocabulary::person}没停下来考虑追上去是否安全，只管追。"
"The chase took {@bt_a|::subscribed_books::vocabulary::person} three blocks before {::subscribed_books::personality::pro1} even remembered to think about what {::subscribed_books::personality::pro2} would do once {::subscribed_books::personality::pro3} caught up." = "{@bt_a|::subscribed_books::vocabulary::person}追了三个街区，才想起来该考虑追上以后怎么办。"
"{@bt_a|::subscribed_books::vocabulary::person} sprinted after the thief so fast {::subscribed_books::personality::pro1} nearly ran straight into a wall doing it." = "{@bt_a|::subscribed_books::vocabulary::person}追得太急，差点一头撞上墙。"
"{@bt_a|::subscribed_books::vocabulary::person} didn't weigh the risk of confronting the thief alone. {::subscribed_books::personality::pro1} was already doing it." = "{@bt_a|::subscribed_books::vocabulary::person}没有权衡独自面对窃贼的风险，因为已经冲上去了。"
"By instinct alone, {@bt_a|::subscribed_books::vocabulary::person} was in pursuit before {::subscribed_books::personality::pos1} own better judgment had a chance to weigh in." = "{@bt_a|::subscribed_books::vocabulary::person}完全凭本能开始追赶，更理智的念头根本没来得及插话。"
"{@bt_a|::subscribed_books::vocabulary::person} vaulted over the cart in the way without breaking stride, chasing on pure reflex." = "{@bt_a|::subscribed_books::vocabulary::person}毫不停步地跃过挡路的小车，全凭反射追赶。"
"The moment {@bt_a|::subscribed_books::vocabulary::person} saw the theft happen, thinking stopped and running started." = "{@bt_a|::subscribed_books::vocabulary::person}一看见偷窃发生，就不再思考，只管奔跑。"

[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} took the joke personally. Everything was personal." = "{@bt_a|::subscribed_books::vocabulary::person}觉得这笑话是在针对自己。所有事都与自己有关。"
"{@bt_a|::subscribed_books::vocabulary::person} was on {::subscribed_books::personality::pos1} feet before the punchline even finished landing." = "笑话的包袱还没抖完，{@bt_a|::subscribed_books::vocabulary::person}就已经站了起来。"
"The joke wasn't even about {@bt_a|::subscribed_books::vocabulary::person}, but {::subscribed_books::personality::pro1} reacted like it was, immediately and loudly." = "笑话根本没提到{@bt_a|::subscribed_books::vocabulary::person}，但回应来得又快又响，仿佛真是在针对自己。"
"{@bt_a|::subscribed_books::vocabulary::person} snapped back with something sharp before {::subscribed_books::personality::pro1} had time to consider whether the joke deserved it." = "{@bt_a|::subscribed_books::vocabulary::person}尖刻地还了嘴，根本来不及想这笑话是否值得如此回应。"
"What was clearly a joke to everyone else hit {@bt_a|::subscribed_books::vocabulary::person} like an accusation, and {::subscribed_books::personality::pro1} responded accordingly." = "其他人明明都知道是玩笑，{@bt_a|::subscribed_books::vocabulary::person}却觉得是在指责自己，也作出了相应反应。"
"{@bt_a|::subscribed_books::vocabulary::person}'s face went hard the instant the joke landed, no delay, no benefit of the doubt." = "笑话刚落下，{@bt_a|::subscribed_books::vocabulary::person}脸色就变硬了，既不迟疑，也不肯往好处想。"
"{@bt_a|::subscribed_books::vocabulary::person} shot back a retort hot enough that the joke-teller visibly regretted the joke." = "{@bt_a|::subscribed_books::vocabulary::person}回敬的话火气太大，让讲笑话的人明显后悔了。"
"There was no laughing it off for {@bt_a|::subscribed_books::vocabulary::person}. {::subscribed_books::personality::pro1} was already up out of {::subscribed_books::personality::pos1} seat." = "{@bt_a|::subscribed_books::vocabulary::person}无法一笑置之，人已经从座位上站起来了。"
"{@bt_a|::subscribed_books::vocabulary::person} took it as a challenge, not a joke, and reacted like {::subscribed_books::personality::pro1} had been challenged." = "{@bt_a|::subscribed_books::vocabulary::person}把这当成了挑衅，而非笑话，也按受到挑衅来回应。"
"The joke barely finished before {@bt_a|::subscribed_books::vocabulary::person} was already firing something back, hot and immediate." = "笑话才说完，{@bt_a|::subscribed_books::vocabulary::person}就已经立刻怒气冲冲地还击。"
"{@bt_a|::subscribed_books::vocabulary::person} couldn't tell the difference, in the moment, between being teased and being attacked." = "{@bt_a|::subscribed_books::vocabulary::person}当时根本分不清调侃与攻击的区别。"
"{@bt_a|::subscribed_books::vocabulary::person} flared up instantly, and it took the room a moment to realize it had just been a joke." = "{@bt_a|::subscribed_books::vocabulary::person}立刻发起火，房里的人过了一会儿才意识到那原本只是个笑话。"
"Something about being laughed at, even gently, sent {@bt_a|::subscribed_books::vocabulary::person} straight past annoyed and into furious." = "哪怕只是善意的笑声，也会让{@bt_a|::subscribed_books::vocabulary::person}直接越过不快，变得暴怒。"
"{@bt_a|::subscribed_books::vocabulary::person} didn't pause to consider the joke wasn't serious. {::subscribed_books::personality::pro1} was already reacting like it was." = "{@bt_a|::subscribed_books::vocabulary::person}没停下来想想笑话不是认真的，人已经按认真的话作出了反应。"
"{@bt_a|::subscribed_books::vocabulary::person} slammed a hand down, more offended by the joke than the situation seemed to call for." = "{@bt_a|::subscribed_books::vocabulary::person}重重拍下一只手，受到的冒犯远超过情境应有的程度。"
"The joke-teller barely got the words out before {@bt_a|::subscribed_books::vocabulary::person} was already on {::subscribed_books::personality::pos1} feet, jaw tight." = "讲笑话的人话刚出口，{@bt_a|::subscribed_books::vocabulary::person}就已站起身，咬紧了牙。"
"{@bt_a|::subscribed_books::vocabulary::person} answered the joke with a shove, not a laugh." = "{@bt_a|::subscribed_books::vocabulary::person}以推搡回应笑话，而不是发笑。"
"It wasn't even a good joke, but {@bt_a|::subscribed_books::vocabulary::person} reacted like it had drawn blood." = "那甚至不是个好笑话，{@bt_a|::subscribed_books::vocabulary::person}却反应得像被刺伤了。"
"{@bt_a|::subscribed_books::vocabulary::person} didn't ask if it was a joke. {::subscribed_books::personality::pro1} just reacted like it wasn't." = "{@bt_a|::subscribed_books::vocabulary::person}没问是不是玩笑，直接按不是玩笑来回应。"
"{@bt_a|::subscribed_books::vocabulary::person} was three sentences into a furious retort before realizing, too late, that everyone else was still smiling." = "{@bt_a|::subscribed_books::vocabulary::person}已怒气冲冲地反驳了三句，才发现其他人仍在微笑，可惜为时已晚。"

[[rulesets]]
[rulesets.rules]
"\"Actually,\" {@bt_a|::subscribed_books::vocabulary::person} said, and everyone who knew {::subscribed_books::personality::pro1} braced themselves, \"that's not quite right.\"" = "“其实，”{@bt_a|::subscribed_books::vocabulary::person}说，所有认识{@bt_a|::subscribed_books::vocabulary::person}的人都绷紧了神经，“那不太对。”"
"\"I'd push back on that,\" {@bt_a|::subscribed_books::vocabulary::person} said, already leaning forward." = "“我得反驳这一点。”{@bt_a|::subscribed_books::vocabulary::person}说着，已经向前倾身。"
"\"Have you considered the opposite?\" {@bt_a|::subscribed_books::vocabulary::person} said, mostly because {::subscribed_books::personality::pro1} enjoyed considering the opposite." = "“你考虑过反过来的情况吗？”{@bt_a|::subscribed_books::vocabulary::person}问，主要是因为自己喜欢反着想。"
"\"I'm not sure I agree,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"and I'd like to explain exactly why.\"" = "“我不太赞同，”{@bt_a|::subscribed_books::vocabulary::person}说，“而且想具体解释一下原因。”"
"\"Let's poke a hole in that,\" {@bt_a|::subscribed_books::vocabulary::person} said, with the enthusiasm of someone who had already found one." = "“来找找这个说法的漏洞。”{@bt_a|::subscribed_books::vocabulary::person}兴致勃勃地说，仿佛已经找到了。"
"\"Devil's advocate,\" {@bt_a|::subscribed_books::vocabulary::person} said, though everyone suspected it was really just {::subscribed_books::personality::pos1} advocate." = "“我只是唱个反调。”{@bt_a|::subscribed_books::vocabulary::person}说，但大家怀疑这其实只是自己的主张。"
"\"That's one way to look at it,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but here's a better one.\"" = "“那是一种看法，”{@bt_a|::subscribed_books::vocabulary::person}说，“不过这里还有个更好的。”"
"\"I hear you,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but I think you're wrong, and I'd like to spend a while explaining that.\"" = "“我听懂了，”{@bt_a|::subscribed_books::vocabulary::person}说，“但我觉得你错了，而且想花点时间解释这一点。”"
"\"Counterpoint,\" {@bt_a|::subscribed_books::vocabulary::person} said, before the point had even fully finished being made." = "观点还没说完，{@bt_a|::subscribed_books::vocabulary::person}就插话：“反过来说——”"
"\"I just don't think that holds up,\" {@bt_a|::subscribed_books::vocabulary::person} said, already gathering {::subscribed_books::personality::pos1} rebuttal." = "“我就是觉得这站不住脚。”{@bt_a|::subscribed_books::vocabulary::person}说着，已经开始组织反驳。"
"\"Sure, but what about—\" {@bt_a|::subscribed_books::vocabulary::person} started, and the discussion tilted sideways for another twenty minutes." = "“当然，但要是——”{@bt_a|::subscribed_books::vocabulary::person}一开口，讨论又偏离了方向二十分钟。"
"\"I'm going to disagree with everyone here,\" {@bt_a|::subscribed_books::vocabulary::person} said, sounding almost pleased about it." = "“我得反对在座的所有人。”{@bt_a|::subscribed_books::vocabulary::person}说，听起来几乎很高兴。"
"\"That's a nice theory,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but let's stress-test it a little.\"" = "“这个理论不错，”{@bt_a|::subscribed_books::vocabulary::person}说，“不过我们来稍微考验一下它。”"
"\"I could accept that,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"if it weren't for about six problems with it.\"" = "“我本来可以接受，”{@bt_a|::subscribed_books::vocabulary::person}说，“要不是它还有大约六个问题。”"
"\"Not to be difficult,\" {@bt_a|::subscribed_books::vocabulary::person} said, being difficult, \"but I don't think that's true.\"" = "“我不是故意找茬，”{@bt_a|::subscribed_books::vocabulary::person}找着茬说，“但我觉得那不是真的。”"
"\"Let me play devil's advocate for a second,\" {@bt_a|::subscribed_books::vocabulary::person} said, for the third time that meeting." = "“让我暂时唱个反调。”{@bt_a|::subscribed_books::vocabulary::person}在这次会议上第三次这样说。"
"\"I just think we should question that,\" {@bt_a|::subscribed_books::vocabulary::person} said, questioning it." = "“我只是觉得我们应该质疑这一点。”{@bt_a|::subscribed_books::vocabulary::person}一边质疑一边说。"
"\"That's the consensus, sure,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but consensus isn't the same as correct.\"" = "“那确实是共识，”{@bt_a|::subscribed_books::vocabulary::person}说，“但共识不等于正确。”"
"\"I want to be contrary for a moment,\" {@bt_a|::subscribed_books::vocabulary::person} said, as if that needed announcing." = "“我想暂时持不同意见。”{@bt_a|::subscribed_books::vocabulary::person}说，仿佛有必要先宣布。"
"\"Respectfully,\" {@bt_a|::subscribed_books::vocabulary::person} said, in a tone that promised very little respect was coming, \"I disagree.\"" = "“恕我直言，”{@bt_a|::subscribed_books::vocabulary::person}的语气毫无敬意，“我不赞同。”"

[[rulesets]]
[rulesets.rules]
"\"I appreciate the gesture,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but I have some concerns about the implications.\"" = "“我感谢这份心意，”{@bt_a|::subscribed_books::vocabulary::person}说，“但对它隐含的意思有些顾虑。”"
"\"Interesting choice,\" {@bt_a|::subscribed_books::vocabulary::person} said, turning it over. \"Can I ask why this one?\"" = "“这选择有意思。”{@bt_a|::subscribed_books::vocabulary::person}翻看着礼物，“我能问问为什么挑了这个吗？”"
"\"It's nice,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"though I have to say, I might have gone a different direction.\"" = "“挺好的，”{@bt_a|::subscribed_books::vocabulary::person}说，“不过我得说，我可能会选另一种。”"
"\"Thank you,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"though I do want to push back gently on the color.\"" = "“谢谢，”{@bt_a|::subscribed_books::vocabulary::person}说，“不过颜色方面，我想温和地提点异议。”"
"\"I like it,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but I'm not sure it's practical. Have you thought about that?\"" = "“我喜欢，”{@bt_a|::subscribed_books::vocabulary::person}说，“但不确定它实不实用。你想过这一点吗？”"
"\"I'll take it,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but I reserve the right to have opinions about it later.\"" = "“我会收下，”{@bt_a|::subscribed_books::vocabulary::person}说，“不过保留以后发表意见的权利。”"
"\"This raises a few questions for me,\" {@bt_a|::subscribed_books::vocabulary::person} said, examining the gift." = "“这让我有几个疑问。”{@bt_a|::subscribed_books::vocabulary::person}一边检查礼物一边说。"
"\"It's thoughtful,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but I'm going to need you to justify this decision.\"" = "“很体贴，”{@bt_a|::subscribed_books::vocabulary::person}说，“但我需要你解释一下这个决定。”"
"\"Not what I would have picked,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but let's talk about why you did.\"" = "“这不是我会选的，”{@bt_a|::subscribed_books::vocabulary::person}说，“不过我们来谈谈你为什么选它。”"
"\"I appreciate it, genuinely,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"and also, can we discuss the sizing?\"" = "“我确实很感激，”{@bt_a|::subscribed_books::vocabulary::person}说，“另外，我们能谈谈尺寸吗？”"
"\"Thank you,\" {@bt_a|::subscribed_books::vocabulary::person} said, then immediately, \"though I do wonder if there was a better option.\"" = "“谢谢，”{@bt_a|::subscribed_books::vocabulary::person}说，随即又补上，“不过我想知道是否有更好的选择。”"
"\"I have thoughts,\" {@bt_a|::subscribed_books::vocabulary::person} said, holding the gift up to the light. \"Want to hear them?\"" = "“我有些想法。”{@bt_a|::subscribed_books::vocabulary::person}举起礼物对着光，“想听吗？”"
"\"It's a fine gift,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but I don't think it's the gift I would have given.\"" = "“这是件好礼物，”{@bt_a|::subscribed_books::vocabulary::person}说，“但我觉得自己不会送这样的礼物。”"
"\"Let's debate the merits of this for a second,\" {@bt_a|::subscribed_books::vocabulary::person} said, only half joking." = "“我们来争论一下它的优点吧。”{@bt_a|::subscribed_books::vocabulary::person}半开玩笑地说。"
"\"I'm grateful,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but grateful doesn't mean I can't have notes.\"" = "“我很感激，”{@bt_a|::subscribed_books::vocabulary::person}说，“但感激不代表我不能提意见。”"
"\"Interesting,\" {@bt_a|::subscribed_books::vocabulary::person} said, in a tone that promised a follow-up question." = "“有意思。”{@bt_a|::subscribed_books::vocabulary::person}说，语气预示着马上还会追问。"
"\"I like the intent,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"less sure about the execution, if I'm honest.\"" = "“我喜欢这个用意，”{@bt_a|::subscribed_books::vocabulary::person}说，“但老实说，对实现方式没那么确定。”"
"\"This is nice,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but was it really the best use of the budget?\"" = "“这个不错，”{@bt_a|::subscribed_books::vocabulary::person}说，“但它真的最值得花这笔钱吗？”"
"\"I'll accept this,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"under protest, and only after a brief discussion.\"" = "“我会收下，”{@bt_a|::subscribed_books::vocabulary::person}说，“不过要保留异议，而且得先简短讨论一下。”"
"\"Thank you,\" {@bt_a|::subscribed_books::vocabulary::person} said, already forming a counterargument to the choice." = "“谢谢。”{@bt_a|::subscribed_books::vocabulary::person}说着，已经开始组织对这个选择的反驳。"

[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} relished the argument. For {::subscribed_books::personality::obj1}, disagreement was not conflict -- it was sport." = "{@bt_a|::subscribed_books::vocabulary::person}很享受这场争论。对其而言，意见不合不是冲突，而是一种运动。"
"{@bt_a|::subscribed_books::vocabulary::person} leaned back, visibly delighted that someone had finally decided to argue back." = "{@bt_a|::subscribed_books::vocabulary::person}向后一靠，明显很高兴终于有人决定争辩回来。"
"Where others tried to defuse the argument, {@bt_a|::subscribed_books::vocabulary::person} tried to sharpen it." = "别人想平息争论，{@bt_a|::subscribed_books::vocabulary::person}却想让它更加尖锐。"
"{@bt_a|::subscribed_books::vocabulary::person} switched sides halfway through, just to see if {::subscribed_books::personality::pro1} could win from the other direction too." = "{@bt_a|::subscribed_books::vocabulary::person}争到一半换了立场，只想看看从另一边能不能也赢。"
"The angrier the argument got, the more {@bt_a|::subscribed_books::vocabulary::person} seemed to be enjoying {::subscribed_books::personality::ref1}." = "争论越是火气冲天，{@bt_a|::subscribed_books::vocabulary::person}似乎就越享受。"
"{@bt_a|::subscribed_books::vocabulary::person} kept the argument alive well past the point anyone else wanted it to end, just to see where it went." = "其他人早就想结束争论，{@bt_a|::subscribed_books::vocabulary::person}却只想看看它能走向何处，硬是维持着。"
"\"Finally, a real conversation,\" {@bt_a|::subscribed_books::vocabulary::person} said, cracking {::subscribed_books::personality::pos1} knuckles." = "“终于像在认真谈话了。”{@bt_a|::subscribed_books::vocabulary::person}说着，掰响了指节。"
"{@bt_a|::subscribed_books::vocabulary::person} poked at the weakest point in {@bt_b|::subscribed_books::vocabulary::person}'s argument with obvious relish." = "{@bt_a|::subscribed_books::vocabulary::person}明显兴致勃勃地戳着{@bt_b|::subscribed_books::vocabulary::person}论点中最薄弱的地方。"
"Losing didn't bother {@bt_a|::subscribed_books::vocabulary::person} nearly as much as not getting to argue at all." = "比起输掉争论，{@bt_a|::subscribed_books::vocabulary::person}更在意的是根本没机会争论。"
"{@bt_a|::subscribed_books::vocabulary::person} argued a position {::subscribed_books::personality::pro1} didn't even hold, purely because no one else was willing to." = "{@bt_a|::subscribed_books::vocabulary::person}争辩的立场连自己都不认同，纯粹因为其他人不肯去争。"
"The debate had gone on for an hour, and {@bt_a|::subscribed_books::vocabulary::person} showed no sign of wanting it to stop." = "辩论已经持续一小时，{@bt_a|::subscribed_books::vocabulary::person}却丝毫没有想停下来的意思。"
"{@bt_a|::subscribed_books::vocabulary::person} grinned at the pushback. This was exactly what {::subscribed_books::personality::pro1} had been hoping for." = "{@bt_a|::subscribed_books::vocabulary::person}听到反驳就笑了。这正是自己一直期待的。"
"Where {@bt_b|::subscribed_books::vocabulary::person} saw a disagreement, {@bt_a|::subscribed_books::vocabulary::person} saw an invitation." = "{@bt_b|::subscribed_books::vocabulary::person}看到的是分歧，{@bt_a|::subscribed_books::vocabulary::person}看到的却是邀请。"
"{@bt_a|::subscribed_books::vocabulary::person} kept circling back to reopen points everyone else considered settled." = "{@bt_a|::subscribed_books::vocabulary::person}不断绕回来，重新讨论其他人认为已经解决的问题。"
"\"You're wrong, but go on,\" {@bt_a|::subscribed_books::vocabulary::person} said, genuinely enjoying watching {@bt_b|::subscribed_books::vocabulary::person} try." = "“你错了，不过继续。”{@bt_a|::subscribed_books::vocabulary::person}说，确实很享受看{@bt_b|::subscribed_books::vocabulary::person}努力的样子。"
"{@bt_a|::subscribed_books::vocabulary::person} took the weaker side of the argument on purpose, just to make it more interesting." = "{@bt_a|::subscribed_books::vocabulary::person}故意站在较弱的一边，只为让争论更有趣。"
"Every time {@bt_b|::subscribed_books::vocabulary::person} conceded a point, {@bt_a|::subscribed_books::vocabulary::person} looked almost disappointed the fight was ending." = "每当{@bt_b|::subscribed_books::vocabulary::person}承认一点，{@bt_a|::subscribed_books::vocabulary::person}就几乎显得失望，仿佛争斗就要结束了。"
"{@bt_a|::subscribed_books::vocabulary::person} needled the argument back to life just as it looked like it might resolve." = "争论刚有解决的迹象，{@bt_a|::subscribed_books::vocabulary::person}就挑拨着让它重新燃起。"
"For {@bt_a|::subscribed_books::vocabulary::person}, winning mattered less than the argument lasting as long as possible." = "对{@bt_a|::subscribed_books::vocabulary::person}而言，赢并不重要，让争论尽可能持续下去才重要。"
"{@bt_a|::subscribed_books::vocabulary::person} rubbed {::subscribed_books::personality::pos1} hands together. \"Alright,\" {::subscribed_books::personality::pro1} said. \"Let's really get into this.\"" = "{@bt_a|::subscribed_books::vocabulary::person}搓了搓手：“好，来真正深入地争一争吧。”"

[[rulesets]]
[rulesets.rules]
"\"That's not what happened,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"Let me tell you what actually happened.\"" = "“事情不是那样的，”{@bt_a|::subscribed_books::vocabulary::person}说，“让我告诉你实际发生了什么。”"
"\"I was there too,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"and I remember it differently.\"" = "“我当时也在场，”{@bt_a|::subscribed_books::vocabulary::person}说，“而我的记忆不一样。”"
"\"Actually, hold on,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"That's not quite the order things happened in.\"" = "“其实，等等，”{@bt_a|::subscribed_books::vocabulary::person}说，“事情发生的顺序不太对。”"
"\"With respect, that account is missing a few details,\" {@bt_a|::subscribed_books::vocabulary::person} said." = "“恕我直言，这个说法漏了些细节。”{@bt_a|::subscribed_books::vocabulary::person}说。"
"\"I saw the whole thing,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"and I have some corrections.\"" = "“我看到了全过程，”{@bt_a|::subscribed_books::vocabulary::person}说，“有些地方得纠正。”"
"\"That's one version,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"Here's the accurate one.\"" = "“那是一种说法，”{@bt_a|::subscribed_books::vocabulary::person}说，“下面这个才准确。”"
"\"I'm going to stop you there,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"because that's not right.\"" = "“我要打断一下，”{@bt_a|::subscribed_books::vocabulary::person}说，“因为那不对。”"
"\"Everyone keeps saying that,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"and everyone keeps getting it wrong.\"" = "“人人都这么说，”{@bt_a|::subscribed_books::vocabulary::person}说，“而人人都说错了。”"
"\"No, no,\" {@bt_a|::subscribed_books::vocabulary::person} said, already shaking {::subscribed_books::personality::pos1} head. \"It went differently than that.\"" = "“不，不。”{@bt_a|::subscribed_books::vocabulary::person}已经开始摇头，“事情不是那样发生的。”"
"\"I'd push back on that account,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"Let me walk you through what really happened.\"" = "“我得反驳这个说法，”{@bt_a|::subscribed_books::vocabulary::person}说，“让我从头说说实际发生了什么。”"
"\"That's not consistent with what I witnessed,\" {@bt_a|::subscribed_books::vocabulary::person} said, already gearing up." = "“那跟我亲眼所见的不一致。”{@bt_a|::subscribed_books::vocabulary::person}说，已经准备争论。"
"\"I was standing right there,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"and that is not how I remember it.\"" = "“我就站在那里，”{@bt_a|::subscribed_books::vocabulary::person}说，“而我的记忆不是这样。”"
"\"Let's get the facts straight,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"because that version has a few holes in it.\"" = "“我们得把事实理清楚，”{@bt_a|::subscribed_books::vocabulary::person}说，“因为这个说法有些漏洞。”"
"\"I hate to be the one to say it,\" {@bt_a|::subscribed_books::vocabulary::person} said, not hating it at all, \"but that's wrong.\"" = "“我真不想这么说，”{@bt_a|::subscribed_books::vocabulary::person}一点也不抗拒地说，“但那是错的。”"
"\"Someone has to correct the record,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"and I suppose it's going to be me.\"" = "“总得有人纠正记录，”{@bt_a|::subscribed_books::vocabulary::person}说，“看来只能由我来了。”"
"\"That's close,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but not quite right, and I think the details matter here.\"" = "“很接近，”{@bt_a|::subscribed_books::vocabulary::person}说，“但还不完全对，而我觉得这里的细节很重要。”"
"\"I saw it happen,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"and frankly, that's not the story.\"" = "“我看着它发生的，”{@bt_a|::subscribed_books::vocabulary::person}说，“坦白讲，事情不是这么回事。”"
"\"I have a different account,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"and I'd like the chance to present it.\"" = "“我有不同的说法，”{@bt_a|::subscribed_books::vocabulary::person}说，“想有个机会把它讲出来。”"
"\"Before this becomes the official version,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"I want to point out a few problems with it.\"" = "“在这成为正式说法以前，”{@bt_a|::subscribed_books::vocabulary::person}说，“我想先指出其中几个问题。”"
"\"I don't mean to argue,\" {@bt_a|::subscribed_books::vocabulary::person} said, clearly meaning to argue, \"but that's not right.\"" = "“我不是想争辩，”{@bt_a|::subscribed_books::vocabulary::person}明显想争辩地说，“但那不对。”"

[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} fought dirty. A handful of dust in the eyes, a kick below the belt, a blade where there should not have been one." = "{@bt_a|::subscribed_books::vocabulary::person}打得卑鄙：扬尘迷眼、踢向下身，还有本不该出现的暗刃。"
"{@bt_a|::subscribed_books::vocabulary::person} waited until {::subscribed_books::personality::pos1} opponent's back was turned. Honor was for people who could afford to lose." = "{@bt_a|::subscribed_books::vocabulary::person}一直等到对手转过背去。荣誉是输得起的人才讲究的。"
"{@bt_a|::subscribed_books::vocabulary::person} palmed a second weapon nobody had seen, and used it exactly when it would do the most damage." = "{@bt_a|::subscribed_books::vocabulary::person}暗藏着没人见过的第二件武器，等到最能造成伤害时才用上。"
"The rules of engagement meant nothing to {@bt_a|::subscribed_books::vocabulary::person}. Winning meant everything." = "交战规则对{@bt_a|::subscribed_books::vocabulary::person}毫无意义，胜利才意味着一切。"
"{@bt_a|::subscribed_books::vocabulary::person} feigned surrender, and the moment {::subscribed_books::personality::pos1} opponent lowered their guard, struck." = "{@bt_a|::subscribed_books::vocabulary::person}假装投降，等到对手放松警惕的一瞬间就动手。"
"{@bt_a|::subscribed_books::vocabulary::person} went for the eyes first. It wasn't glamorous, but it worked." = "{@bt_a|::subscribed_books::vocabulary::person}先攻向眼睛。虽不体面，却很有效。"
"While the duel had rules, the battle did not, and {@bt_a|::subscribed_books::vocabulary::person} made sure to remember which one {::subscribed_books::personality::pro1} was in." = "决斗有规则，战斗却没有；{@bt_a|::subscribed_books::vocabulary::person}始终记得自己正处于哪一种。"
"{@bt_a|::subscribed_books::vocabulary::person} used the terrain, the light, the confusion, anything that wasn't {::subscribed_books::personality::pos1} own skill, to tip the fight." = "{@bt_a|::subscribed_books::vocabulary::person}利用地形、光线、混乱，以及自身本领之外的一切，让战局倾斜。"
"{@bt_a|::subscribed_books::vocabulary::person} struck before the signal to begin had even finished sounding." = "开始的信号还没响完，{@bt_a|::subscribed_books::vocabulary::person}就已经出手。"
"There was a hidden blade in {@bt_a|::subscribed_books::vocabulary::person}'s boot, and by the end of the fight, everyone knew it." = "{@bt_a|::subscribed_books::vocabulary::person}的靴子里藏着一把刀，到战斗结束时，大家全都知道了。"
"{@bt_a|::subscribed_books::vocabulary::person} grabbed a fistful of sand and threw it without a flicker of hesitation." = "{@bt_a|::subscribed_books::vocabulary::person}抓起一把沙子，毫不迟疑地扬了出去。"
"{@bt_a|::subscribed_books::vocabulary::person} let {::subscribed_books::personality::pos1} opponent think the fight was fair for exactly as long as it was useful to let them think that." = "只要还对自己有用，{@bt_a|::subscribed_books::vocabulary::person}就让对手以为这场战斗是公平的。"
"{@bt_a|::subscribed_books::vocabulary::person} took the opening {::subscribed_books::personality::pos1} opponent left while checking on a fallen ally, and did not feel bad about it." = "对手查看倒地同伴时露出空当，{@bt_a|::subscribed_books::vocabulary::person}立刻利用了它，毫无愧意。"
"Every advantage {@bt_a|::subscribed_books::vocabulary::person} could take, {::subscribed_books::personality::pro1} took, rules be damned." = "{@bt_a|::subscribed_books::vocabulary::person}抓住了一切可用的优势，哪管什么规则。"
"{@bt_a|::subscribed_books::vocabulary::person} struck the weapon hand first, then the knee, then whatever else would end this fastest." = "{@bt_a|::subscribed_books::vocabulary::person}先打持武器的手，再打膝盖，随后攻击能最快结束战斗的任何部位。"
"There was no such thing as an unfair fight, as far as {@bt_a|::subscribed_books::vocabulary::person} was concerned. Only a won one and a lost one." = "在{@bt_a|::subscribed_books::vocabulary::person}看来，战斗没有公平与不公平之分，只有获胜和落败。"
"{@bt_a|::subscribed_books::vocabulary::person} used the distraction {@bt_b|::subscribed_books::vocabulary::person} caused without a second thought about whether that was in the spirit of things." = "{@bt_a|::subscribed_books::vocabulary::person}立即利用了{@bt_b|::subscribed_books::vocabulary::person}造成的分心，丝毫没想这是否符合约定精神。"
"{@bt_a|::subscribed_books::vocabulary::person} had never once, in {::subscribed_books::personality::pos1} life, fought fair when fighting dirty was an option." = "只要能用阴招，{@bt_a|::subscribed_books::vocabulary::person}这辈子就从没公平地打过一次。"
"{@bt_a|::subscribed_books::vocabulary::person} bit down hard when the grapple went to the ground, because winning didn't care how it happened." = "缠斗倒向地面时，{@bt_a|::subscribed_books::vocabulary::person}狠狠咬下去，因为胜利从不在乎如何得来。"
"{@bt_a|::subscribed_books::vocabulary::person} pulled the pin, so to speak, on a trick nobody in that fight had agreed to allow." = "{@bt_a|::subscribed_books::vocabulary::person}使出了战斗中谁都没有同意允许的诡计，仿佛拔掉了暗藏的引信。"

[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} bent every rule and broke the ones that didn't bend. The outcome was what mattered, not the method." = "{@bt_a|::subscribed_books::vocabulary::person}钻遍所有规则的空子，钻不过去的就直接打破。重要的是结果，不是手段。"
"{@bt_a|::subscribed_books::vocabulary::person} found the loophole in the agreed terms before anyone else had even finished agreeing to them." = "其他人还没同意完约定的条款，{@bt_a|::subscribed_books::vocabulary::person}就已经找到了其中的漏洞。"
"While everyone else negotiated in good faith, {@bt_a|::subscribed_books::vocabulary::person} was negotiating in {::subscribed_books::personality::pos1} own faith, which had different rules." = "别人诚心谈判，{@bt_a|::subscribed_books::vocabulary::person}却只照自己的原则谈判，那套原则完全不同。"
"{@bt_a|::subscribed_books::vocabulary::person} smiled, shook hands on the deal, and immediately began planning how to get around it." = "{@bt_a|::subscribed_books::vocabulary::person}微笑着握手成交，随即就开始谋划如何绕过交易。"
"The conflict had rules everyone else respected. {@bt_a|::subscribed_books::vocabulary::person} respected the outcome instead." = "这场冲突的规则得到其他人的尊重，{@bt_a|::subscribed_books::vocabulary::person}尊重的却只有结果。"
"{@bt_a|::subscribed_books::vocabulary::person} slipped a clause into the agreement that nobody would notice until it was too late to matter." = "{@bt_a|::subscribed_books::vocabulary::person}悄悄往协议里塞了一项条款，等别人注意到时，已经为时太晚。"
"There was a fair way to resolve this and a way that favored {@bt_a|::subscribed_books::vocabulary::person}. {@bt_a2|::subscribed_books::vocabulary::person} chose the second one without much deliberation." = "解决这事有公平的办法，也有偏向{@bt_a|::subscribed_books::vocabulary::person}的办法。{@bt_a|::subscribed_books::vocabulary::person}没怎么犹豫就选了后者。"
"{@bt_a|::subscribed_books::vocabulary::person} played both sides, quietly, and let each one believe {::subscribed_books::personality::pro1} was only playing theirs." = "{@bt_a|::subscribed_books::vocabulary::person}暗中两边周旋，让双方都以为自己只在为他们效力。"
"Whatever the terms of the conflict were, {@bt_a|::subscribed_books::vocabulary::person} treated them as a starting point for negotiation, not a boundary." = "不论冲突有什么约定，{@bt_a|::subscribed_books::vocabulary::person}都把它当成谈判的起点，而非界限。"
"{@bt_a|::subscribed_books::vocabulary::person} let the other party think they'd won, right up until it turned out they hadn't." = "{@bt_a|::subscribed_books::vocabulary::person}让对方一直以为自己赢了，直到结果证明并没有。"
"The truce held for everyone except {@bt_a|::subscribed_books::vocabulary::person}, who had never really intended to honor it." = "除了从未真打算遵守的{@bt_a|::subscribed_books::vocabulary::person}，所有人都守住了停战约定。"
"{@bt_a|::subscribed_books::vocabulary::person} used information {::subscribed_books::personality::pro1} wasn't supposed to have, and used it well." = "{@bt_a|::subscribed_books::vocabulary::person}利用了自己本不该掌握的信息，而且利用得很好。"
"{@bt_a|::subscribed_books::vocabulary::person} broke the agreement quietly enough that it took the others a while to even notice." = "{@bt_a|::subscribed_books::vocabulary::person}破坏协议时足够悄无声息，其他人过了好一阵才发现。"
"There were rules to how this was supposed to go. {@bt_a|::subscribed_books::vocabulary::person} had already found three ways around all of them." = "事情本该按规则进行，{@bt_a|::subscribed_books::vocabulary::person}却已经找到了三种绕过所有规则的办法。"
"{@bt_a|::subscribed_books::vocabulary::person} agreed to the terms out loud and began undermining them the moment the room cleared." = "{@bt_a|::subscribed_books::vocabulary::person}口头同意了条款，房里的人刚一散去，就开始暗中破坏。"
"For {@bt_a|::subscribed_books::vocabulary::person}, a fair resolution and a favorable one were only the same thing by coincidence, and {::subscribed_books::personality::pro1} wasn't counting on coincidence." = "对{@bt_a|::subscribed_books::vocabulary::person}而言，公平的解决与有利的解决只有碰巧才会一致，而自己并不指望巧合。"
"{@bt_a|::subscribed_books::vocabulary::person} used the mediator's blind spot exactly as well as {::subscribed_books::personality::pro1} had planned to." = "{@bt_a|::subscribed_books::vocabulary::person}如原先计划那样，精准地利用了调解人的盲点。"
"{@bt_a|::subscribed_books::vocabulary::person} claimed to be compromising, while quietly keeping every advantage {::subscribed_books::personality::pro1} had walked in with." = "{@bt_a|::subscribed_books::vocabulary::person}声称自己正在妥协，实际上却悄悄保住了入场时的每一项优势。"
"Whatever leverage existed, legitimate or not, {@bt_a|::subscribed_books::vocabulary::person} was already holding it." = "任何可用的筹码，不论正当与否，{@bt_a|::subscribed_books::vocabulary::person}都已握在手里。"
"{@bt_a|::subscribed_books::vocabulary::person} let the conflict resolve exactly the way {::subscribed_books::personality::pro1} had rigged it to resolve, and looked appropriately surprised about it." = "{@bt_a|::subscribed_books::vocabulary::person}让冲突完全按照自己安排的方式结束，又恰到好处地装出惊讶。"

[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} nodded along while privately pursuing a completely different agenda. Agreements were for other people." = "{@bt_a|::subscribed_books::vocabulary::person}一边点头附和，一边暗中推进完全不同的打算。协议是给别人守的。"
"{@bt_a|::subscribed_books::vocabulary::person} agreed to every point in the meeting and reversed course on all of them the moment it ended." = "{@bt_a|::subscribed_books::vocabulary::person}在会上同意了每一点，会议一结束就全部反着做。"
"While the discussion focused on consensus, {@bt_a|::subscribed_books::vocabulary::person} was quietly focused on outcome, and the two rarely lined up." = "讨论着眼于共识，{@bt_a|::subscribed_books::vocabulary::person}暗中着眼于结果，而两者很少一致。"
"{@bt_a|::subscribed_books::vocabulary::person} said all the right things and meant almost none of them." = "{@bt_a|::subscribed_books::vocabulary::person}说得句句得体，却几乎句句都不真心。"
"{@bt_a|::subscribed_books::vocabulary::person} steered the discussion exactly where {::subscribed_books::personality::pro1} wanted it to go, and made it look like everyone else's idea." = "{@bt_a|::subscribed_books::vocabulary::person}将讨论精准地引向自己想要的方向，还让它看起来像大家的主意。"
"The discussion produced an agreement. {@bt_a|::subscribed_books::vocabulary::person} had already decided which parts of it {::subscribed_books::personality::pro1} intended to honor." = "讨论达成了协议，而{@bt_a|::subscribed_books::vocabulary::person}早已决定其中哪些部分值得自己遵守。"
"{@bt_a|::subscribed_books::vocabulary::person} took detailed notes on everyone else's position, mostly so {::subscribed_books::personality::pro1} would know exactly how to work around them later." = "{@bt_a|::subscribed_books::vocabulary::person}详细记下其他人的立场，主要是为了日后准确绕开它们。"
"{@bt_a|::subscribed_books::vocabulary::person} smiled through the whole discussion, already three moves ahead of where the conversation actually was." = "{@bt_a|::subscribed_books::vocabulary::person}整场讨论都带着微笑，心里却已经比眼前的谈话领先三步。"
"Everyone else left the meeting thinking they'd been heard. {@bt_a|::subscribed_books::vocabulary::person} left knowing exactly what {::subscribed_books::personality::pro1} was going to do instead." = "其他人离开会议时，以为自己的意见被听见了；{@bt_a|::subscribed_books::vocabulary::person}离开时，却清楚知道自己将另做什么。"
"{@bt_a|::subscribed_books::vocabulary::person} volunteered to handle a task {::subscribed_books::personality::pro1} had no intention of doing the way it was agreed." = "{@bt_a|::subscribed_books::vocabulary::person}主动接下了一项任务，却根本没打算按约定的方法去做。"
"The discussion ended in a handshake. {@bt_a|::subscribed_books::vocabulary::person}'s fingers were already crossed." = "讨论以握手结束，而{@bt_a|::subscribed_books::vocabulary::person}已经暗暗交叉手指，准备不守承诺。"
"{@bt_a|::subscribed_books::vocabulary::person} let the group think they'd reached a fair compromise while quietly keeping the better half of it." = "{@bt_a|::subscribed_books::vocabulary::person}让大家以为达成了公平的妥协，却悄悄留下了更有利的一半。"
"{@bt_a|::subscribed_books::vocabulary::person} presented a half-truth so smoothly that nobody thought to check the other half." = "{@bt_a|::subscribed_books::vocabulary::person}把半真半假的话说得如此顺畅，谁也没想到去核实另一半。"
"{@bt_a|::subscribed_books::vocabulary::person} agreed out loud and made a private note to do the opposite." = "{@bt_a|::subscribed_books::vocabulary::person}口头同意，私下却记下了反着做的打算。"
"What {@bt_a|::subscribed_books::vocabulary::person} said in the meeting and what {@bt_a2|::subscribed_books::vocabulary::person} did afterward had, at best, a passing relationship." = "{@bt_a|::subscribed_books::vocabulary::person}会上说的话与会后做的事，充其量只有一点若有若无的联系。"
"{@bt_a|::subscribed_books::vocabulary::person} used the discussion to gather information {::subscribed_books::personality::pro1} had no intention of sharing in return." = "{@bt_a|::subscribed_books::vocabulary::person}利用讨论收集信息，却根本没打算分享自己的信息作为回报。"
"{@bt_a|::subscribed_books::vocabulary::person} nodded thoughtfully at every objection and dismissed every one of them the second the room emptied." = "{@bt_a|::subscribed_books::vocabulary::person}若有所思地对每项异议点头，房里一空就把它们全抛开。"
"The consensus the group reached was, unbeknownst to them, exactly the outcome {@bt_a|::subscribed_books::vocabulary::person} had engineered from the start." = "大家并不知道，最终达成的共识恰好就是{@bt_a|::subscribed_books::vocabulary::person}从一开始设计好的结果。"
"{@bt_a|::subscribed_books::vocabulary::person} played along just long enough to learn what {::subscribed_books::personality::pro1} needed, then quietly changed course." = "{@bt_a|::subscribed_books::vocabulary::person}配合到自己得到所需信息为止，然后悄悄改了方向。"
"{@bt_a|::subscribed_books::vocabulary::person} agreed to compromise, and then defined \"compromise\" almost entirely on {::subscribed_books::personality::pos1} own terms." = "{@bt_a|::subscribed_books::vocabulary::person}同意妥协，随后却几乎完全按照自己的条件定义了“妥协”。"

