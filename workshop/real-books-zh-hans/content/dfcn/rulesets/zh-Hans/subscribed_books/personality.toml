"{@bt_a|::subscribed_books::vocabulary::person} maintained the false identity through direct questioning without a single wrong beat." = "{@bt_a|::subscribed_books::vocabulary::person}在直接盘问中维持着假身份，节奏一次也没错。"
"{@bt_a|::subscribed_books::vocabulary::person} enjoyed the impersonation more than {pro1} probably should have. It came that easily." = "{@bt_a|::subscribed_books::vocabulary::person}对冒充的享受，大概超过了{pro1}应有的程度。它实在太容易。"
