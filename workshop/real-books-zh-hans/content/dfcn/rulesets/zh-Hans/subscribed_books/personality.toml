"{@bt_a|::subscribed_books::vocabulary::person} watched the room accept the false version and felt nothing but quiet satisfaction." = "{@bt_a|::subscribed_books::vocabulary::person}看着屋里的人接受虚假版本，心中只有安静的满足。"
"{@bt_a|::subscribed_books::vocabulary::person} answered a direct question with a direct lie, delivered as smoothly as the truth would have been." = "{@bt_a|::subscribed_books::vocabulary::person}用一个直接的谎言回答直接的问题，说得和真话一样流畅。"
"{@bt_a|::subscribed_books::vocabulary::person} adjusted {pos1} story mid-discussion the instant {pro1} sensed it wasn't landing, without anyone noticing the shift." = "{pro1}一察觉故事没奏效，{@bt_a|::subscribed_books::vocabulary::person}就当场调整{pos1}说法，没人注意到变化。"
