"The chaos meant nothing to {@bt_a|::subscribed_books::vocabulary::person} except a set of variables to be managed." = "对{@bt_a|::subscribed_books::vocabulary::person}而言，混乱不过是一组需要管理的变量。"
"{@bt_a|::subscribed_books::vocabulary::person} stepped in at exactly the right moment, having waited for exactly the right moment to arrive." = "{@bt_a|::subscribed_books::vocabulary::person}在完全正确的时刻介入，因为此前一直等着这个时刻到来。"
"Where others saw a crisis, {@bt_a|::subscribed_books::vocabulary::person} saw a sequence of solvable problems." = "别人看见危机时，{@bt_a|::subscribed_books::vocabulary::person}看见的是一连串可以解决的问题。"
"{@bt_a|::subscribed_books::vocabulary::person} weighed the risk for a half second, decided it was acceptable, and acted without a flicker of hesitation." = "{@bt_a|::subscribed_books::vocabulary::person}用半秒权衡风险，认定可以接受，随后毫不犹豫地行动。"
"{@bt_a|::subscribed_books::vocabulary::person} kept {pos1} breathing even and {pos2} eyes moving, reading the situation before committing to a move." = "{@bt_a|::subscribed_books::vocabulary::person}保持{pos1}呼吸平稳，让{pos2}双眼不断扫视，先看清局势，再决定行动。"
"Nothing about {@bt_a|::subscribed_books::vocabulary::person}'s expression changed as the conflict unfolded, though {pos1} eyes never stopped tracking every angle of it." = "冲突展开时，{@bt_a|::subscribed_books::vocabulary::person}表情丝毫未变，{pos1}双眼却从未停止追踪每一个角度。"
"{@bt_a|::subscribed_books::vocabulary::person} picked the outcome {pro1} wanted and worked backward from it, unbothered by the danger in between." = "{@bt_a|::subscribed_books::vocabulary::person}选定{pro1}想要的结果，从那里倒推，不为途中危险所扰。"
"The others reacted. {@bt_a|::subscribed_books::vocabulary::person} calculated." = "别人作出反应。{@bt_a|::subscribed_books::vocabulary::person}进行计算。"
"{@bt_a|::subscribed_books::vocabulary::person} moved decisively, and only afterward did anyone realize how carefully that decisiveness had been considered." = "{@bt_a|::subscribed_books::vocabulary::person}行动果断。直到之后，别人才能意识到，这份果断曾经过多仔细的考虑。"
"While the situation spiraled, {@bt_a|::subscribed_books::vocabulary::person} was quietly identifying the one thread that would unravel it." = "局势失控时，{@bt_a|::subscribed_books::vocabulary::person}正悄悄寻找那根能将乱局拆开的线头。"
"{@bt_a|::subscribed_books::vocabulary::person} treated the danger the way {pro1} treated everything: as a problem with a solution, if you looked for it calmly enough." = "{@bt_a|::subscribed_books::vocabulary::person}对待危险，就像{pro1}对待其他一切：只要足够冷静地寻找，就能找到解法的问题。"
"There was no adrenaline in {@bt_a|::subscribed_books::vocabulary::person}'s voice when {pro1} gave instructions, just clarity." = "{pro1}发出指示时，{@bt_a|::subscribed_books::vocabulary::person}声音里没有兴奋，只有清晰。"
"{@bt_a|::subscribed_books::vocabulary::person} sized up every person in the conflict and knew exactly which one to talk to first." = "{@bt_a|::subscribed_books::vocabulary::person}打量冲突里的每个人，准确知道该先向谁开口。"
"{@bt_a|::subscribed_books::vocabulary::person} did not need to raise {pos1} voice to be heard. {pro1} simply had the plan everyone else was missing." = "{@bt_a|::subscribed_books::vocabulary::person}无需提高{pos1}声音就能被听见。{pro1}只是拥有其他人都缺少的计划。"
"By the time the danger had fully registered with everyone else, {@bt_a|::subscribed_books::vocabulary::person} had already resolved it." = "等其他人终于完全意识到危险，{@bt_a|::subscribed_books::vocabulary::person}早已解决了它。"

# Trait cool_headed.
[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} felt the sting, catalogued it, and filed it away. There would be time to process later. Now was for thinking." = "{@bt_a|::subscribed_books::vocabulary::person}感到刺痛，将它记下，再收进心里。以后有时间处理情绪。现在要思考。"
"This changed the calculation. {@bt_a|::subscribed_books::vocabulary::person} adjusted accordingly and kept moving." = "这改变了计算。{@bt_a|::subscribed_books::vocabulary::person}相应调整，继续前行。"
"The hurt was there, distant and quiet, like something happening to someone else. {@bt_a|::subscribed_books::vocabulary::person} noted it and set it aside." = "痛苦在那里，遥远而安静，仿佛发生在别人身上。{@bt_a|::subscribed_books::vocabulary::person}记下它，暂且搁置。"
"There would be a reckoning with how this felt. Later. Right now there were more immediate problems." = "总要面对这份感受，但要留到以后。眼下还有更紧迫的问题。"
"{@bt_a|::subscribed_books::vocabulary::person} recognized the shape of {pos1} own anger rising and set it down carefully, out of the way, for now." = "{@bt_a|::subscribed_books::vocabulary::person}认出{pos1}怒火升起的形状，便小心将它放下，暂且移到一旁。"
"It was betrayal. Fine. {@bt_a|::subscribed_books::vocabulary::person} could work with that fact once {pro1} understood its shape." = "这是背叛。好吧。{@bt_a|::subscribed_books::vocabulary::person}一旦理解它的全貌，{pro1}就能处理这个事实。"
"Something in {@bt_a|::subscribed_books::vocabulary::person}'s chest tightened, and {pro1} noted the reaction with the same detachment {pro2} noted everything else." = "{@bt_a|::subscribed_books::vocabulary::person}胸口某处收紧，{pro1}记下这个反应，和{pro2}记下其他一切时一样超然。"
"The feelings would come. They always did, eventually. {@bt_a|::subscribed_books::vocabulary::person} had learned to let them wait their turn." = "情绪会来的。它们最终总会来。{@bt_a|::subscribed_books::vocabulary::person}早已学会让它们等着轮到自己。"
"What mattered now was not how {@bt_a|::subscribed_books::vocabulary::person} felt about it, but what {@bt_a2|::subscribed_books::vocabulary::person} did next. The feeling could be dealt with later." = "眼下重要的，不是{@bt_a|::subscribed_books::vocabulary::person}的感受，而是{@bt_a2|::subscribed_books::vocabulary::person}接下来做什么。感受可以以后处理。"
"{@bt_a|::subscribed_books::vocabulary::person} allowed {ref1} exactly one breath to register the blow, then moved past it." = "{@bt_a|::subscribed_books::vocabulary::person}只给{ref1}一次呼吸的时间来接受这份打击，随后就越过了它。"
"Underneath the composure, something had cracked. {@bt_a|::subscribed_books::vocabulary::person} noted the crack and kept walking." = "镇定之下，某样东西裂开了。{@bt_a|::subscribed_books::vocabulary::person}记下裂缝，继续走。"
"This was not the moment to feel it. {@bt_a|::subscribed_books::vocabulary::person} had trained {ref1} for exactly this kind of moment." = "现在不是感受它的时候。{@bt_a|::subscribed_books::vocabulary::person}训练{ref1}，正是为了这样的时刻。"
"{@bt_a|::subscribed_books::vocabulary::person} could feel the anger building at the edges of {pos1} thoughts, and simply declined to let it in yet." = "{@bt_a|::subscribed_books::vocabulary::person}能感觉到怒火正在{pos1}思绪边缘累积，只是暂且不让它进来。"
"The betrayal was a fact now, like any other fact. {@bt_a|::subscribed_books::vocabulary::person} began working out what to do with it." = "背叛如今是一个事实，与其他事实无异。{@bt_a|::subscribed_books::vocabulary::person}开始琢磨如何处理。"
"It would hurt later, probably badly. {@bt_a|::subscribed_books::vocabulary::person} made a mental note to deal with that when there was time to." = "它以后会痛，也许会很痛。{@bt_a|::subscribed_books::vocabulary::person}在心里记下，等有时间再处理。"
"{@bt_a|::subscribed_books::vocabulary::person} separated the information from the feeling, kept the former, and set the latter aside for safekeeping." = "{@bt_a|::subscribed_books::vocabulary::person}将信息与情绪分开，保留前者，把后者暂存到一旁。"
"There was a part of {@bt_a|::subscribed_books::vocabulary::person} that wanted to react. {@bt_a2|::subscribed_books::vocabulary::person} was very good at not listening to that part, not yet." = "{@bt_a|::subscribed_books::vocabulary::person}心里有一部分想要作出反应。{@bt_a2|::subscribed_books::vocabulary::person}很擅长不去听它，至少现在不听。"
"The sting was real. {@bt_a|::subscribed_books::vocabulary::person} simply refused to let it be the thing {pro1} responded to." = "刺痛是真的。{@bt_a|::subscribed_books::vocabulary::person}只是拒绝让它成为{pro1}回应的对象。"
"{@bt_a|::subscribed_books::vocabulary::person} filed the betrayal under things to grieve later and turned {pos1} attention to the more pressing matter of what came next." = "{@bt_a|::subscribed_books::vocabulary::person}把背叛归入以后再哀悼的事情，将{pos1}注意力转向更紧迫的问题：接下来怎么办。"
"It would have been easy to let the hurt take over. {@bt_a|::subscribed_books::vocabulary::person} did not have that luxury, and set it aside instead." = "任痛苦接管一切，本来很容易。{@bt_a|::subscribed_books::vocabulary::person}没有这样的奢侈，只能将它搁到一旁。"

# Trait cool_headed.
[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} was the first to react, and the calmest. While others panicked, {pro1} was already solving the problem." = "{@bt_a|::subscribed_books::vocabulary::person}第一个作出反应，也最镇定。别人惊慌时，{pro1}已经开始解决问题。"
"{@bt_a|::subscribed_books::vocabulary::person} assessed the injury with a glance and started giving orders before anyone else had finished shouting." = "{@bt_a|::subscribed_books::vocabulary::person}扫一眼就判断出伤势，还没人喊完，就开始发出命令。"
"While the room descended into chaos, {@bt_a|::subscribed_books::vocabulary::person} moved through it like {pro1} had rehearsed this exact scenario." = "屋里陷入混乱时，{@bt_a|::subscribed_books::vocabulary::person}穿行其间，仿佛{pro1}排练过完全相同的情景。"
"{@bt_a|::subscribed_books::vocabulary::person}'s voice cut through the panic, level and clear, and people listened to it because it was the only steady thing in the room." = "{@bt_a|::subscribed_books::vocabulary::person}声音平稳、清晰，穿透恐慌。人们听从它，因为它是屋里唯一稳定的东西。"
"{@bt_a|::subscribed_books::vocabulary::person} did not waste time asking what happened. {pro1} was already working out what to do about it." = "{@bt_a|::subscribed_books::vocabulary::person}不浪费时间问发生了什么。{pro1}已经在想该怎么办。"
"Someone needed to stay calm. {@bt_a|::subscribed_books::vocabulary::person} decided, without much deliberation, that it would be {obj1}." = "总需要有人保持冷静。{@bt_a|::subscribed_books::vocabulary::person}没怎么考虑，就决定由{obj1}来做。"
"{@bt_a|::subscribed_books::vocabulary::person} knelt beside the injured party, checked for the obvious first, and started working through the rest methodically." = "{@bt_a|::subscribed_books::vocabulary::person}跪到伤者身边，先查看明显的伤势，再有条不紊地处理其余问题。"
"While others froze, {@bt_a|::subscribed_books::vocabulary::person} was already moving, already thinking three steps past the current crisis." = "别人僵住时，{@bt_a|::subscribed_books::vocabulary::person}已在行动，思绪也已越过眼前危机三步。"
"{@bt_a|::subscribed_books::vocabulary::person} barked out a short list of instructions, and the panic in the room had somewhere useful to go." = "{@bt_a|::subscribed_books::vocabulary::person}高声给出一串简短的指令，让屋里的恐慌有了有用的去处。"
"Nothing about the accident seemed to surprise {@bt_a|::subscribed_books::vocabulary::person}. {pro1} simply began fixing what could be fixed." = "这场意外似乎没有任何地方令{@bt_a|::subscribed_books::vocabulary::person}吃惊。{pro1}只是开始修复能修复的东西。"
"{@bt_a|::subscribed_books::vocabulary::person} pressed a hand to the wound, steady as anything, and started asking the questions that actually mattered." = "{@bt_a|::subscribed_books::vocabulary::person}稳稳地用手按住伤口，开始询问真正要紧的问题。"
"The room needed a plan. {@bt_a|::subscribed_books::vocabulary::person} had one before anyone else had finished processing what had happened." = "屋里需要计划。别人还没理解发生的事，{@bt_a|::subscribed_books::vocabulary::person}就已有了计划。"
"{@bt_a|::subscribed_books::vocabulary::person} moved with the calm of someone who had decided panicking would not help and simply skipped that step." = "{@bt_a|::subscribed_books::vocabulary::person}行动镇定，像是早已认定恐慌无用，便直接跳过这一步。"
"While the others reacted to the accident, {@bt_a|::subscribed_books::vocabulary::person} was already responding to it, which was a different thing entirely." = "别人对意外作出本能反应时，{@bt_a|::subscribed_books::vocabulary::person}已在采取应对，两者全然不同。"
"{@bt_a|::subscribed_books::vocabulary::person} triaged the situation in seconds, flat and clear-eyed, and got to work." = "{@bt_a|::subscribed_books::vocabulary::person}几秒内就冷静清楚地分辨轻重缓急，开始处理。"
"There was no hesitation in {@bt_a|::subscribed_books::vocabulary::person}. Just assessment, then action." = "{@bt_a|::subscribed_books::vocabulary::person}毫不犹豫。只有评估，随后行动。"
"{@bt_a|::subscribed_books::vocabulary::person} took charge without announcing it, simply by being the only one who knew what to do next." = "{@bt_a|::subscribed_books::vocabulary::person}不宣布接管，却已经接管，只因为只有一个人知道下一步该做什么。"
"The blood did not seem to bother {@bt_a|::subscribed_books::vocabulary::person} nearly as much as the delay in doing something about it." = "比起鲜血，迟迟没人处理，似乎更让{@bt_a|::subscribed_books::vocabulary::person}不安。"
"{@bt_a|::subscribed_books::vocabulary::person} talked the injured person through it in a voice so steady it seemed to slow their own panic down." = "{@bt_a|::subscribed_books::vocabulary::person}用平稳的声音引导伤者，稳得仿佛连伤者自身的恐慌也慢了下来。"
"By the time anyone else had caught up to what had happened, {@bt_a|::subscribed_books::vocabulary::person} had already handled the worst of it." = "等别人终于跟上发生的事，{@bt_a|::subscribed_books::vocabulary::person}早已处理了最糟的部分。"


# 声明内生成变化的规范形变体；原作者句式保留。
[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} dropped {pos1} weapon at {pos2} feet and raised both hands, daring the enemy to strike a unarmed opponent." = "{@bt_a|::subscribed_books::vocabulary::person}把{pos1}武器丢在{pos2}脚边，举起双手，逼敌人面对是否敢攻击赤手空拳的对手。"
"{@bt_a|::subscribed_books::vocabulary::person} staged a entirely different disturbance and let {@bt_b|::subscribed_books::vocabulary::person} chase the wrong problem while {pro1} took the real one." = "{@bt_a|::subscribed_books::vocabulary::person}制造另一场全然不同的骚动，让{@bt_b|::subscribed_books::vocabulary::person}去追错误的问题，而{pro1}拿走真正的目标。"
"{@bt_a|::subscribed_books::vocabulary::person} returned a unrelated item to {@bt_b|::subscribed_books::vocabulary::person} as a act of apparent goodwill, timed precisely to cover for what {pro1} had just taken." = "{@bt_a|::subscribed_books::vocabulary::person}将一件无关的物品还给{@bt_b|::subscribed_books::vocabulary::person}，表面上出于善意，时机却准确掩护了{pro1}刚刚拿走的东西。"
"{@bt_a|::subscribed_books::vocabulary::person} had built the false identity with a escape route already built into it, in case anyone got too close to the truth." = "{@bt_a|::subscribed_books::vocabulary::person}构造假身份时，就已内置脱身路线，以防有人太接近真相。"
"{@bt_a|::subscribed_books::vocabulary::person} let a small, believable lie do the work a uncomfortable truth would have done far less efficiently." = "{@bt_a|::subscribed_books::vocabulary::person}用一个小小的、可信的谎言，完成了不舒服的真相远不能如此高效完成的事。"
"{@bt_a|::subscribed_books::vocabulary::person} kept the lie consistent across a dozen separate conversations, never once contradicting a earlier version." = "{@bt_a|::subscribed_books::vocabulary::person}在十几场不同的谈话中，让谎言始终一致，从未与之前的版本矛盾。"
"\"You want a honest answer or a comfortable one?\" {@bt_a|::subscribed_books::vocabulary::person} asked. \"I only have the honest kind.\"" = "“你想听诚实的答案，还是舒服的答案？”{@bt_a|::subscribed_books::vocabulary::person}问，“我只有诚实的那一种。”"
"{@bt_a|::subscribed_books::vocabulary::person} tried on the false identity like a ill-fitting coat, and shrugged it off before anyone noticed the seams." = "{@bt_a|::subscribed_books::vocabulary::person}像试穿不合身的外套一样试着用假身份，还没人注意接缝，就把它脱掉了。"
"{@bt_a|::subscribed_books::vocabulary::person} laughed, once, when {@bt_b|::subscribed_books::vocabulary::person} cried out. It was not a accident that {pro1} laughed." = "{@bt_b|::subscribed_books::vocabulary::person}惨叫时，{@bt_a|::subscribed_books::vocabulary::person}笑了一声。{pro1}的笑，绝非偶然。"
"{@bt_a|::subscribed_books::vocabulary::person} muttered a excuse no one heard and slipped away before the first real blow landed." = "{@bt_a|::subscribed_books::vocabulary::person}咕哝了个无人听清的借口，在第一记真正的攻击落下前溜走。"
"{@bt_a|::subscribed_books::vocabulary::person} packed quickly and left no explanation -- only a absence where {pro1} used to be." = "{@bt_a|::subscribed_books::vocabulary::person}匆忙收拾，没留下解释，只在{pro1}曾经所在的位置留下空缺。"
"{@bt_a|::subscribed_books::vocabulary::person} lowered {pos1} weapon the moment the other side did, refusing to press a advantage {pro1} hadn't earned fairly." = "对方一放下武器，{@bt_a|::subscribed_books::vocabulary::person}也放下{pos1}武器，拒绝利用{pro1}并未公平赢得的优势。"
"{@bt_a|::subscribed_books::vocabulary::person} took the blow rather than deliver a underhanded one to avoid it." = "{@bt_a|::subscribed_books::vocabulary::person}宁愿挨下这一击，也不愿用卑劣的一击躲过去。"
"\"Please,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"don't feel obligated. A obligated gift isn't really a gift at all.\"" = "“请别觉得欠了什么，”{@bt_a|::subscribed_books::vocabulary::person}说道，“让人背负义务的礼物，根本算不上礼物。”"
"\"Think about it from my perspective,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"just for a moment,\" and waited for the moment to become a agreement." = "“从我的角度想想，”{@bt_a|::subscribed_books::vocabulary::person}说道，“只要片刻就好。”随后等着那片刻变成赞同。"
"{@bt_a|::subscribed_books::vocabulary::person} offered the gift with calculated generosity. Every kindness was a investment." = "{@bt_a|::subscribed_books::vocabulary::person}带着算计过的慷慨送出礼物。每份善意都是一笔投资。"
"{@bt_a|::subscribed_books::vocabulary::person} did not budge. Not a inch. Not now, not ever. This was the hill, and {pro1} would die on it." = "{@bt_a|::subscribed_books::vocabulary::person}寸步不让。现在不让，永远不让。这是{pro1}要以死捍卫的立场。"
"{@bt_a|::subscribed_books::vocabulary::person} tapped the table once, final. \"That's my answer. It was my answer a hour ago too.\"" = "{@bt_a|::subscribed_books::vocabulary::person}在桌上敲了一下，一锤定音。“这就是我的答案。一小时前也是这个答案。”"
"{@bt_a|::subscribed_books::vocabulary::person} tilted {pos1} head. \"I'm going to need a minute. several jokes. In that order.\"" = "{@bt_a|::subscribed_books::vocabulary::person}偏了偏{pos1}脑袋。“我需要缓一会儿，然后讲几个笑话。按这个顺序来。”"
"For {@bt_a|::subscribed_books::vocabulary::person}, who lived by a code, this was not merely wrong -- it was a affront to the order that held the world together." = "对恪守准则的{@bt_a|::subscribed_books::vocabulary::person}而言，这不只是错误，更是对维系世界的秩序的冒犯。"
"\"A interesting position,\" {@bt_a|::subscribed_books::vocabulary::person} replied. \"Wrong, of course, but interesting.\"" = "“有意思的观点，”{@bt_a|::subscribed_books::vocabulary::person}答道，“当然是错的，不过很有意思。”"
"{@bt_a|::subscribed_books::vocabulary::person} stared at {@bt_b|::subscribed_books::vocabulary::person} for a long moment. the mask came back, but it was thinner now." = "{@bt_a|::subscribed_books::vocabulary::person}凝视{@bt_b|::subscribed_books::vocabulary::person}许久。随后那副面具又回来了，只是比以前更薄。"
"\"I see,\" {@bt_a|::subscribed_books::vocabulary::person} said. Two words. They contained a entire judgment." = "“明白了，”{@bt_a|::subscribed_books::vocabulary::person}说道。寥寥几个字，却已包含全部判断。"
"{@bt_a|::subscribed_books::vocabulary::person} watched the theft happen and said nothing. Loss, by now, was a old acquaintance." = "{@bt_a|::subscribed_books::vocabulary::person}看着偷窃发生，一言不发。如今，失去早已是熟悉的老友。"
"{@bt_b|::subscribed_books::vocabulary::person} had taken something from {@bt_a|::subscribed_books::vocabulary::person} years ago. Not a object -- something less tangible. A reputation. A chance. A future that {@bt_a2|::subscribed_books::vocabulary::person} had earned and {@bt_b2|::subscribed_books::vocabulary::person} had stolen." = "多年前，{@bt_b|::subscribed_books::vocabulary::person}从{@bt_a|::subscribed_books::vocabulary::person}那里夺走了一样东西。那不是物品，而是更难以触摸之物：声誉、机会，以及{@bt_a2|::subscribed_books::vocabulary::person}本已争取到、却被{@bt_b2|::subscribed_books::vocabulary::person}偷走的未来。"
"{@bt_b|::subscribed_books::vocabulary::person} had murdered someone {@bt_a|::subscribed_books::vocabulary::person} loved. Not in battle, not in self-defense, but deliberately, coldly, and without remorse. The kind of killing that demands a answer." = "{@bt_b|::subscribed_books::vocabulary::person}杀害了{@bt_a|::subscribed_books::vocabulary::person}所爱之人。不是战斗，也不是自卫，而是蓄意、冷酷、毫无悔意的谋杀。这样的杀戮，必须有人偿还。"
"They had met during a battle. {@bt_a|::subscribed_books::vocabulary::person} had dragged {@bt_b|::subscribed_books::vocabulary::person} out of the fighting, and in the chaos of blood and screaming, something impossible had happened: they had looked at each other and seen, not a ally or a stranger, but a person. The world had narrowed to a single point of recognition." = "他们相识于一场战斗。{@bt_a|::subscribed_books::vocabulary::person}把{@bt_b|::subscribed_books::vocabulary::person}拖出战场，在鲜血与尖叫的混乱中，不可思议的事发生了：他们对视，看见的既不是盟友，也不是陌生人，而是一个活生生的人。整个世界仿佛收束成了彼此认出的那一点。"
"\"Tradition is not a plan,\" {@bt_b|::subscribed_books::vocabulary::person} replied. \"It is a excuse to avoid thinking. The world has changed. We must change with it, or be left behind.\"" = "“传统不是计划，”{@bt_b|::subscribed_books::vocabulary::person}答道，“只是逃避思考的借口。世界变了。我们必须跟着改变，否则就会被抛下。”"
"\"We need a alliance,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"Not a treaty -- those are paper. A alliance. Shared soldiers, shared walls, shared fate. It is the only way to survive what is coming.\"" = "“我们需要联盟，”{@bt_a|::subscribed_books::vocabulary::person}说道，“不是条约，那只是纸。是联盟。共享军队、城墙与命运。唯有如此，才能挺过即将到来的危机。”"
"{@bt_a|::subscribed_books::vocabulary::person} had hired a investigator. The report was thorough and devastating. Dates. Locations. Names. The evidence was irrefutable." = "{@bt_a|::subscribed_books::vocabulary::person}雇了一名调查者。报告详尽而致命：日期、地点、姓名，一应俱全，证据无可辩驳。"
"{@bt_b|::subscribed_books::vocabulary::person} had made a romantic advance on someone {@bt_a|::subscribed_books::vocabulary::person} cared about -- openly, brazenly, with {@bt_a2|::subscribed_books::vocabulary::person} standing right there. The insult was deliberate, and it demanded a immediate response." = "{@bt_b|::subscribed_books::vocabulary::person}公然、厚颜地向{@bt_a|::subscribed_books::vocabulary::person}在意的人求爱，而{@bt_a2|::subscribed_books::vocabulary::person}就站在旁边。这是蓄意的侮辱，必须立即回应。"
"{@bt_a|::subscribed_books::vocabulary::person} got in {@bt_b|::subscribed_books::vocabulary::person}'s face, close enough that the anger was less a argument than a threat." = "{@bt_a|::subscribed_books::vocabulary::person}逼近{@bt_b|::subscribed_books::vocabulary::person}的脸，近得让愤怒不再像争辩，更像威胁。"
"{@bt_a|::subscribed_books::vocabulary::person} did not back down a inch. If anything, being challenged only made {pro1} angrier." = "{@bt_a|::subscribed_books::vocabulary::person}寸步不让。受到挑战，只会让{pro1}更加愤怒。"
"Every pause in the conversation was a opening {@bt_a|::subscribed_books::vocabulary::person} took, whether it was {pos1} turn or not." = "谈话里的每个停顿，都被{@bt_a|::subscribed_books::vocabulary::person}当作插话的机会，不管是否轮到{pos1}。"
"{@bt_a|::subscribed_books::vocabulary::person} did not ask for a explanation. {pro1} was already too far gone for one." = "{@bt_a|::subscribed_books::vocabulary::person}没有要求解释。{pro1}早已失控到听不进解释。"

