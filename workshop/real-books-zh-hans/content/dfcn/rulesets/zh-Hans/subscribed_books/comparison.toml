base = "subscribed_books::comparison"

[[rulesets]]
[rulesets.rules]
# templates.lua CulturalComparison, complete five perspectives, plus generic fallback.
"What unites us is greater than what divides us." = "团结我们的，比隔开我们的更多。"
"This work finds the {adj} common ground between {@bt_e|::subscribed_books::vocabulary::entity} and its neighbors." = "本书寻找 {@bt_e|::subscribed_books::vocabulary::entity} 与邻国之间的{adj}共同点。"
"A cultural comparison in the spirit of understanding." = "本着相互理解精神的文化比较。"
"The {adj} differences between civilizations are visible to anyone." = "文明之间的{adj}差异，谁都看得见。"
"The similarities require a more careful eye." = "相似之处，需要更细心的眼光。"
"This cultural comparison, by {person} of {@bt_e|::subscribed_books::vocabulary::entity}, is written in the hope that understanding breeds peace." = "这份由 {@bt_e|::subscribed_books::vocabulary::entity} 的 {person} 编写的文化比较，寄望理解能孕育和平。"
"Common ground observed in the period of {@year}:" = "{@year} 年前后观察到的共同点："
"The grief of {@bt_e|::subscribed_books::vocabulary::entity} at the loss of {@bt_a|::subscribed_books::vocabulary::person} in {@year} is a grief shared by all peoples." = "{@bt_e|::subscribed_books::vocabulary::entity} 因 {@year} 年失去 {@bt_a|::subscribed_books::vocabulary::person} 而产生的悲伤，是所有民族共有的悲伤。"
"{cause} respects no borders." = "{cause} 不认国界。"
"The founding of {@bt_s|::subscribed_books::vocabulary::place} in {@year} mirrors settlement patterns seen across civilizations." = "{@year} 年 {@bt_s|::subscribed_books::vocabulary::place} 的建立，反映了各文明共有的定居模式。"
"In {@year}, the peoples of the world faced similar {adj} challenges." = "{@year} 年，世界各民族面临相似的{adj}挑战。"
"Their responses reveal shared values." = "他们的回应，揭示出共同的价值。"
"More connects us than we care to admit." = "联系着我们的，比我们愿意承认的更多。"
"This comparison is offered as a bridge." = "这份比较，愿成为一座桥梁。"
"May those who cross it find friends on the other side." = "愿跨越它的人，在另一边找到朋友。"
"The {adj} work of cultural comparison reveals, in the end, a single truth: that beneath the surface of difference, all civilizations share the same fears, the same hopes, and the same {adj2} will to endure." = "{adj}文化比较工作，最终揭示一个真相：差异的表面之下，所有文明都有相同的恐惧、相同的希望，以及相同的{adj2}存续意志。"
"Let us compare {@bt_e|::subscribed_books::vocabulary::entity} with its lesser neighbors." = "让我们将 {@bt_e|::subscribed_books::vocabulary::entity} 与那些逊色的邻国相比。"
"The result, as always, favors us." = "结果一如既往，有利于我们。"
"A cultural comparison, if one can call it that." = "一份文化比较，姑且这么说吧。"
"{@bt_e|::subscribed_books::vocabulary::entity} stands {adj} above the rest." = "{@bt_e|::subscribed_books::vocabulary::entity} {adj}地凌驾于其他文明之上。"
"Allow me to demonstrate." = "请容我证明。"
"I, {person}, have studied the cultures that border {@bt_e|::subscribed_books::vocabulary::entity}, and I report with {adj} confidence that none approach our level of achievement." = "我，{person}，研究了与 {@bt_e|::subscribed_books::vocabulary::entity} 接壤的文化，怀着{adj}信心报告：没有一个接近我们的成就。"
"This comparison is not flattering to the others." = "这份比较，不会让其他文明好看。"
"It is not meant to be." = "也无意如此。"
"Further evidence of our superiority, from {@year}:" = "{@year} 年，我们优越地位的进一步证据："
"{@bt_i|::subscribed_books::vocabulary::artifact}, created by {@bt_a|::subscribed_books::vocabulary::person} in {@year}." = "{@bt_i|::subscribed_books::vocabulary::artifact}，由 {@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年创造。"
"Our neighbors have produced nothing comparable." = "我们的邻国，没有创造任何可与之相比的东西。"
"Nothing." = "什么也没有。"
"The founding of {@bt_s|::subscribed_books::vocabulary::place} in {@year} demonstrates {@bt_e|::subscribed_books::vocabulary::entity}'s {adj} ambition." = "{@year} 年 {@bt_s|::subscribed_books::vocabulary::place} 的建立，彰显了 {@bt_e|::subscribed_books::vocabulary::entity} 的{adj}雄心。"
"Our rivals merely watch." = "对手只能旁观。"
"Even in death, {@bt_e|::subscribed_books::vocabulary::entity}'s heroes outshine their neighbors'." = "即使死去，{@bt_e|::subscribed_books::vocabulary::entity} 的英雄也比邻国的英雄更耀眼。"
"{@bt_a|::subscribed_books::vocabulary::person} fell to {cause} in {@year}, and the whole world mourned." = "{@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年因 {cause} 倒下，整个世界都为之哀悼。"
"In {@year}, {@bt_e|::subscribed_books::vocabulary::entity} continued to set the standard by which other cultures are measured." = "{@year} 年，{@bt_e|::subscribed_books::vocabulary::entity} 继续树立衡量其他文化的标准。"
"The comparison speaks for itself." = "比较的结果不言自明。"
"{@bt_e|::subscribed_books::vocabulary::entity} is, was, and shall remain {adj} and supreme." = "{@bt_e|::subscribed_books::vocabulary::entity} 现在、过去、将来，都是{adj}且至高无上。"
"This comparison is merely confirmation." = "这份比较，只是确认这一点。"
"A dispassionate cultural comparison." = "一份冷静客观的文化比较。"
"{@bt_e|::subscribed_books::vocabulary::entity} is examined alongside its neighbors without favoritism or judgment." = "将 {@bt_e|::subscribed_books::vocabulary::entity} 与其邻国一同考察，不偏袒，也不评判。"
"This comparative study aims for objectivity." = "这份比较研究，旨在保持客观。"
"{person} observes and reports." = "{person} 观察并报告。"
"The comparative study of cultures requires the scholar to suppress {pos} own biases and examine the evidence with {adj} detachment." = "文化比较研究，要求学者克制{pos}偏见，以{adj}超然态度审视证据。"
"I, {person}, attempt that discipline here, comparing {@bt_e|::subscribed_books::vocabulary::entity} with its contemporaries on the basis of observable practice rather than inherited prejudice." = "我，{person}，在此尝试遵守这一原则，以可观察的实践而非传承的偏见为依据，将 {@bt_e|::subscribed_books::vocabulary::entity} 与同时代文明相比。"
"Comparative data from the period of {@year}:" = "{@year} 年前后的比较资料："
"The death of {@bt_a|::subscribed_books::vocabulary::person} in {@year} ({cause}) and comparable events in neighboring cultures reveal shared vulnerability." = "{@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年死亡（{cause}），与邻近文化的类似事件，共同揭示共有的脆弱。"
"Settlement patterns: {@bt_s|::subscribed_books::vocabulary::place} (est. {@year}) compared with contemporaneous developments elsewhere." = "定居模式：{@bt_s|::subscribed_books::vocabulary::place}（建立于 {@year} 年），与其他地区同期发展比较。"
"Cultural practices observed circa {@year} show both convergence and divergence across civilizations." = "{@year} 年左右观察到的文化实践，显示各文明既有趋同，也有分化。"
"The data supports multiple interpretations." = "资料支持多种解释。"
"This anthropological study is offered without conclusions." = "这份人类学研究，不作结论。"
"The reader is invited to draw {pos} own." = "请读者自行作出{pos}结论。"
"The strangest thing about studying other cultures is how familiar they look." = "研究其他文化最奇怪的地方，在于它们看起来如此熟悉。"
"{@bt_e|::subscribed_books::vocabulary::entity} and its neighbors are more alike than either would admit." = "{@bt_e|::subscribed_books::vocabulary::entity} 与邻国，比双方愿意承认的更加相似。"
"Mirror cultures: a study in {adj} parallels between civilizations that consider themselves unique." = "文化镜像：研究那些自认独特的文明之间的{adj}相似之处。"
"Parallels discovered in the period of {@year}:" = "{@year} 年前后发现的相似之处："
"{@bt_a|::subscribed_books::vocabulary::person}'s death in {@year} by {cause} echoes similar losses in neighboring cultures." = "{@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年因 {cause} 死亡，与邻近文化的类似损失相互呼应。"
"Grief wears the same face everywhere." = "悲伤在任何地方，都有同一张面孔。"
"The founding of {@bt_s|::subscribed_books::vocabulary::place} in {@year} follows a pattern seen across multiple civilizations." = "{@year} 年 {@bt_s|::subscribed_books::vocabulary::place} 的建立，遵循多个文明共有的模式。"
"In {@year}, the mirror effect was particularly {adj}: neighboring cultures made remarkably similar choices." = "{@year} 年，镜像效应尤其{adj}：邻近文化作出了惊人相似的选择。"
"The reflection is uncanny." = "这倒影相似得令人不安。"
"We are mirrors of each other, whether we acknowledge it or not." = "我们互为镜像，无论是否承认。"
"The differences between {@bt_e|::subscribed_books::vocabulary::entity} and its neighbors are not superficial." = "{@bt_e|::subscribed_books::vocabulary::entity} 与邻国的差异，并非表面现象。"
"They are {adj} and fundamental." = "它们{adj}，而且根深蒂固。"
"This work examines the fault lines." = "本书考察这些断层。"
"Civilizations collide." = "文明相互碰撞。"
"This comparison maps the points of contact and conflict between {@bt_e|::subscribed_books::vocabulary::entity} and the outside world." = "这份比较，绘出 {@bt_e|::subscribed_books::vocabulary::entity} 与外界接触、冲突的交点。"
"There is a fashionable notion that all cultures are essentially the same beneath the surface." = "有一种流行看法，认为所有文化在表面之下，本质都相同。"
"This is {adj} nonsense." = "这是一派{adj}胡言。"
"The cultural comparison that follows, compiled by {person}, documents the real and irreconcilable differences between {@bt_e|::subscribed_books::vocabulary::entity} and its neighbors." = "下文由 {person} 编写的文化比较，记录了 {@bt_e|::subscribed_books::vocabulary::entity} 与邻国之间真实而不可调和的差异。"
"The fault lines as they appeared in {@year}:" = "{@year} 年呈现的断层："
"The death of {@bt_a|::subscribed_books::vocabulary::person} in {@year} by {cause} was perceived entirely differently by {@bt_e|::subscribed_books::vocabulary::entity} and its neighbors." = "{@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年因 {cause} 死亡，{@bt_e|::subscribed_books::vocabulary::entity} 与邻国对此的看法完全不同。"
"{@bt_s|::subscribed_books::vocabulary::place}, founded in {@year}, was seen by {@bt_e|::subscribed_books::vocabulary::entity} as progress." = "于 {@year} 年建立的 {@bt_s|::subscribed_books::vocabulary::place}，在 {@bt_e|::subscribed_books::vocabulary::entity} 看来是进步。"
"Neighbors saw it as {adj} aggression." = "邻国却认为，这是{adj}侵略。"
"In {@year}, the clash of values between {@bt_e|::subscribed_books::vocabulary::entity} and surrounding cultures deepened." = "{@year} 年，{@bt_e|::subscribed_books::vocabulary::entity} 与周边文化之间的价值观冲突加深了。"
"The divisions are real." = "分歧真实存在。"
"Pretending otherwise is dangerous." = "假装没有分歧，很危险。"
"This comparison does not offer hope of reconciliation." = "这份比较，不提供和解的希望。"
"It offers {adj} clarity." = "它提供{adj}清晰认识。"
"What you do with clarity is up to you." = "有了清晰认识后如何行动，由你决定。"
"The clash between civilizations is not a problem to be solved." = "文明间的冲突，不是一个等待解决的问题。"
"It is a condition to be understood." = "它是一种需要理解的状况。"
"This comparison of {@bt_e|::subscribed_books::vocabulary::entity} and its neighbors is a {adj} map of irreconcilable differences." = "这份关于 {@bt_e|::subscribed_books::vocabulary::entity} 与邻国的比较，是一张记录不可调和差异的{adj}地图。"
"Draw your own borders." = "请画出你自己的边界。"
"What follows is a written account of matters deemed worthy of preservation." = "下文记述值得保存的事情。"
"This work concerns events and subjects of note." = "本书涉及重要事件与主题。"
"The author has set down the following for the benefit of future readers." = "作者为后世读者记下了以下内容。"
"The account continues with the events of {@year}." = "记述继续，讲述 {@year} 年的事件。"
"Attention turns now to the year {@year}." = "现在把目光转向 {@year} 年。"
"{@bt_a|::subscribed_books::vocabulary::person} died in {@year} at {@bt_s|::subscribed_books::vocabulary::place}." = "{@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年在 {@bt_s|::subscribed_books::vocabulary::place} 死亡。"
"The cause was {cause}." = "原因是 {cause}。"
"{@bt_s|::subscribed_books::vocabulary::place} was founded in {@year} by {@bt_e|::subscribed_books::vocabulary::entity}." = "{@bt_s|::subscribed_books::vocabulary::place} 由 {@bt_e|::subscribed_books::vocabulary::entity} 于 {@year} 年建立。"
"{@bt_i|::subscribed_books::vocabulary::artifact} was created by {@bt_a|::subscribed_books::vocabulary::person} in {@year}." = "{@bt_i|::subscribed_books::vocabulary::artifact} 由 {@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年创造。"
"{@bt_a|::subscribed_books::vocabulary::person} became {role} of {@bt_e|::subscribed_books::vocabulary::entity} in {@year}." = "{@bt_a|::subscribed_books::vocabulary::person} 于 {@year} 年成为 {@bt_e|::subscribed_books::vocabulary::entity} 的{role}。"
"Events of note occurred in {@year}." = "{@year} 年发生了一些重要事件。"
"The account of this period concludes." = "这个时期的记述到此结束。"
"This concludes the written work." = "本书到此结束。"
"The account is complete." = "记述已完成。"

[[rulesets]]
name = "person"
[rulesets.rules]
"{::subscribed_books::vocabulary::person}" = "{::subscribed_books::vocabulary::person}"
[[rulesets]]
name = "adj"
[rulesets.rules]
"{::subscribed_books::adj}" = "{::subscribed_books::adj}"
[[rulesets]]
name = "adj2"
[rulesets.rules]
"{adj}" = "{adj}"
[[rulesets]]
name = "pos"
[rulesets.rules]
"{::subscribed_books::pos}" = "{::subscribed_books::pos}"
[[rulesets]]
name = "role"
[rulesets.rules]
"{::subscribed_books::vocabulary::role}" = "{::subscribed_books::vocabulary::role}"
[[rulesets]]
name = "cause"
[rulesets.rules]
"{::subscribed_books::vocabulary::cause}" = "{::subscribed_books::vocabulary::cause}"
