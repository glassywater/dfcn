"{@bt_w|::subscribed_books::vocabulary::person} looked at {@bt_k|::subscribed_books::vocabulary::person} -- at the blood on {pos1} hands, at the emptiness in {pos2} eyes -- and for the first time, felt afraid. Not of the enemy. Of the person {@bt_k2|::subscribed_books::vocabulary::person} was becoming. \"Was there no other way?\" {@bt_w2|::subscribed_books::vocabulary::person} whispered. {@bt_k3|::subscribed_books::vocabulary::person} did not answer. The silence said everything." = "{@bt_w|::subscribed_books::vocabulary::person}看着{@bt_k|::subscribed_books::vocabulary::person}，看着{pos1}手上的血，{pos2}眼中的空洞，第一次感到害怕。怕的不是敌人，而是{@bt_k2|::subscribed_books::vocabulary::person}正变成的那个人。“难道没有别的办法吗？”{@bt_w2|::subscribed_books::vocabulary::person}低声问。{@bt_k3|::subscribed_books::vocabulary::person}没有回答。沉默道尽了一切。"
"{@bt_w|::subscribed_books::vocabulary::person} could not forget the look on {@bt_k|::subscribed_books::vocabulary::person}'s face when {pro1} killed {@bt_d|::subscribed_books::vocabulary::person}. Something had broken between them that day, and neither knew how to fix it." = "{@bt_w|::subscribed_books::vocabulary::person}忘不了{@bt_k|::subscribed_books::vocabulary::person}的表情，那是{pro1}杀死{@bt_d|::subscribed_books::vocabulary::person}时的表情。那天，两人之间的某种东西破碎了，谁也不知道该如何修复。"
"{@bt_w|::subscribed_books::vocabulary::person} stood over {@bt_d|::subscribed_books::vocabulary::person}'s body and felt nothing but relief. {@bt_k|::subscribed_books::vocabulary::person} was alive. That was all that mattered. The dead had earned their end." = "{@bt_w|::subscribed_books::vocabulary::person}站在{@bt_d|::subscribed_books::vocabulary::person}的尸体旁，只感到如释重负。{@bt_k|::subscribed_books::vocabulary::person}还活着，重要的只有这一点。死者是自取灭亡。"
"{@bt_w|::subscribed_books::vocabulary::person} fell to {pos1} knees beside {@bt_d|::subscribed_books::vocabulary::person}. The grief came in waves -- each one larger than the last, until {pro1} could not breathe, could not think, could not do anything but hold what was left of the person {pro2} had loved." = "{@bt_w|::subscribed_books::vocabulary::person}跪倒在{@bt_d|::subscribed_books::vocabulary::person}身旁，{pos1}膝盖落在地上。悲痛如浪潮涌来，一浪高过一浪，直到{pro1}无法呼吸、无法思考，只能抱着{pro2}深爱之人留下的躯体。"
"{@bt_w|::subscribed_books::vocabulary::person} stood apart from the others. {pro1} did not weep -- that would come later, in private, where no one could see. For now, {pro2} catalogued the loss with clinical precision, as if by naming the absence {pro3} could contain it." = "{@bt_w|::subscribed_books::vocabulary::person}独自站在一旁。{pro1}没有哭，那要留到稍后，留到无人看见的独处时刻。眼下，{pro2}近乎冷酷地逐一梳理失去的一切，仿佛只要给缺失命名，{pro3}就能将它控制住。"
"{@bt_w|::subscribed_books::vocabulary::person} had lost a friend. The word felt too small for what {@bt_d|::subscribed_books::vocabulary::person} had been. {@bt_w2|::subscribed_books::vocabulary::person} stood in silence, and the silence felt permanent." = "{@bt_w|::subscribed_books::vocabulary::person}失去了一位朋友。可“朋友”二字，远不足以概括{@bt_d|::subscribed_books::vocabulary::person}曾经的分量。{@bt_w2|::subscribed_books::vocabulary::person}默默站着，那沉默仿佛永远不会结束。"
"{@bt_w|::subscribed_books::vocabulary::person} looked at {@bt_k|::subscribed_books::vocabulary::person} and saw someone {pro1} did not fully recognize. The violence had been necessary -- perhaps. But the ease of it, the lack of hesitation, the way {@bt_k2|::subscribed_books::vocabulary::person} had not even flinched -- that was new. And it troubled {@bt_w2|::subscribed_books::vocabulary::person} deeply." = "{@bt_w|::subscribed_books::vocabulary::person}看着{@bt_k|::subscribed_books::vocabulary::person}，却看到一个令{pro1}感到陌生的人。暴力也许确实必要。但那份轻易、那份毫不犹豫，{@bt_k2|::subscribed_books::vocabulary::person}甚至不曾退缩的模样，都是第一次出现。这让{@bt_w2|::subscribed_books::vocabulary::person}深感不安。"
"{@bt_w|::subscribed_books::vocabulary::person} had seen {@bt_k|::subscribed_books::vocabulary::person} kill {@bt_d|::subscribed_books::vocabulary::person} without hesitation. The violence itself was not the problem. The ease of it was." = "{@bt_w|::subscribed_books::vocabulary::person}亲眼看见{@bt_k|::subscribed_books::vocabulary::person}毫不犹豫地杀死{@bt_d|::subscribed_books::vocabulary::person}。问题不在暴力本身，而在它发生得如此轻易。"
"{@bt_w|::subscribed_books::vocabulary::person} felt nothing for {@bt_d|::subscribed_books::vocabulary::person}. What mattered was that {@bt_k|::subscribed_books::vocabulary::person} was alive, standing, breathing. The rest was noise. {@bt_w2|::subscribed_books::vocabulary::person} went to {@bt_k2|::subscribed_books::vocabulary::person} and took {pos1} hand without a word." = "{@bt_w|::subscribed_books::vocabulary::person}对{@bt_d|::subscribed_books::vocabulary::person}毫无感觉。重要的是{@bt_k|::subscribed_books::vocabulary::person}还活着，还能站立、呼吸。其余都是杂音。{@bt_w2|::subscribed_books::vocabulary::person}走到{@bt_k2|::subscribed_books::vocabulary::person}身边，一言不发地握住{pos1}手。"
"{@bt_w|::subscribed_books::vocabulary::person} had words for {@bt_k|::subscribed_books::vocabulary::person} that night -- sharp ones, about whether it had to end that way, about what else could have been tried. {pro1} listened, and did not argue back. By morning the argument had burned itself out, and what remained between them was still standing." = "那天夜里，{@bt_w|::subscribed_books::vocabulary::person}对{@bt_k|::subscribed_books::vocabulary::person}说了一番尖锐的话，质问事情是否非得如此收场，是否还有别的办法。{pro1}听着，没有反驳。到了清晨，争论自行熄灭，两人之间剩下的感情仍未倒下。"
"{@bt_w|::subscribed_books::vocabulary::person} heard what had happened and thought little of it. {@bt_d|::subscribed_books::vocabulary::person} had been a stranger; {@bt_k|::subscribed_books::vocabulary::person} was not. That was the whole of the calculation, as far as {pro1} was concerned." = "{@bt_w|::subscribed_books::vocabulary::person}听说发生的事，却不甚在意。{@bt_d|::subscribed_books::vocabulary::person}是陌生人，{@bt_k|::subscribed_books::vocabulary::person}却不是。对{pro1}而言，考虑的无非就这些。"
"{@bt_w|::subscribed_books::vocabulary::person} did not know what to make of it, and did not spend long trying. There would be time to think later, if it mattered. For now there was only the rest of the evening to get through." = "{@bt_w|::subscribed_books::vocabulary::person}不知该如何看待此事，也没有费时去想。真要紧的话，以后总有时间思考。眼下，只需熬过这个夜晚剩下的时光。"
"{@bt_w|::subscribed_books::vocabulary::person} had travelled beside {@bt_k|::subscribed_books::vocabulary::person} long enough to think {pro1} knew {pos1} measure. This was not it. \"Was there no other way?\" {@bt_w2|::subscribed_books::vocabulary::person} asked, quietly enough that only {@bt_k2|::subscribed_books::vocabulary::person} could hear. There was no good answer, and both of them knew it." = "{@bt_w|::subscribed_books::vocabulary::person}与{@bt_k|::subscribed_books::vocabulary::person}同行已久，以为{pro1}早已知道{pos1}为人。眼前这一幕却全然不同。“难道没有别的办法吗？”{@bt_w2|::subscribed_books::vocabulary::person}问，声音低得只有{@bt_k2|::subscribed_books::vocabulary::person}能听见。没有令人满意的答案，两人都明白。"
"{@bt_w|::subscribed_books::vocabulary::person} had seen {@bt_k|::subscribed_books::vocabulary::person} kill {@bt_d|::subscribed_books::vocabulary::person} without hesitation, and could not un-see it. Something about how the company travelled together had quietly changed." = "{@bt_w|::subscribed_books::vocabulary::person}看见{@bt_k|::subscribed_books::vocabulary::person}毫不犹豫地杀死{@bt_d|::subscribed_books::vocabulary::person}，那一幕再也无法忘却。队伍结伴同行的方式，悄然发生了某种变化。"
"{@bt_w|::subscribed_books::vocabulary::person} clapped {@bt_k|::subscribed_books::vocabulary::person} on the shoulder. {@bt_d|::subscribed_books::vocabulary::person} had it coming, as far as {pro1} was concerned, and the company was better off for it." = "{@bt_w|::subscribed_books::vocabulary::person}拍了拍{@bt_k|::subscribed_books::vocabulary::person}的肩膀。在{pro1}看来，{@bt_d|::subscribed_books::vocabulary::person}是罪有应得，队伍也因此轻松了。"
"{@bt_w|::subscribed_books::vocabulary::person} pulled {@bt_k|::subscribed_books::vocabulary::person} aside that night, low-voiced, asking whether it had to go that far. {pro1} had no good answer to give. By the time the fire burned down, the matter was dropped, and the company moved on as it always had." = "那天夜里，{@bt_w|::subscribed_books::vocabulary::person}把{@bt_k|::subscribed_books::vocabulary::person}拉到一旁，低声问是否非得做到这个地步。{pro1}拿不出令人满意的回答。等篝火渐熄，话题也随之放下，队伍仍如往常一样继续前行。"
"{@bt_w|::subscribed_books::vocabulary::person} barely broke stride. {@bt_d|::subscribed_books::vocabulary::person} had been a stranger, the road was long, and there would be other, worse things to think about before it ended." = "{@bt_w|::subscribed_books::vocabulary::person}几乎没有放慢脚步。{@bt_d|::subscribed_books::vocabulary::person}不过是个陌生人，道路漫长，在抵达尽头之前，还有其他更糟的事情需要考虑。"
"{@bt_w|::subscribed_books::vocabulary::person} said nothing about it, then or later. Whatever {pro1} made of it, {pro2} kept to {pos1} own counsel." = "{@bt_w|::subscribed_books::vocabulary::person}对此只字未提，当时没有，后来也没有。不论{pro1}如何看待此事，{pro2}都把想法留在{pos1}心里。"

