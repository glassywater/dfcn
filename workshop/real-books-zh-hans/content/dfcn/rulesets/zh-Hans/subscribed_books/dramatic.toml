"The faithful weep while {::subscribed_books::speech::religion::entity} {::subscribed_books::speech::religion::action} {::subscribed_books::speech::religion::object} without a shred of shame." = "信众哭泣，{::subscribed_books::speech::religion::entity}却毫无羞耻地{::subscribed_books::speech::religion::action}{::subscribed_books::speech::religion::object}。"
"{::subscribed_books::speech::religion::object} was sacred. {::subscribed_books::speech::religion::entity} made it a jest for the gutter." = "{::subscribed_books::speech::religion::object}曾经神圣，{::subscribed_books::speech::religion::entity}却把它变成污沟里的笑料。"
"I will not stand by while {::subscribed_books::speech::religion::entity} {::subscribed_books::speech::religion::action} {::subscribed_books::speech::religion::object}. Not this time." = "我不会袖手看着{::subscribed_books::speech::religion::entity}{::subscribed_books::speech::religion::action}{::subscribed_books::speech::religion::object}。这一次不会。"
"You call this devotion? {::subscribed_books::speech::religion::entity} {::subscribed_books::speech::religion::action} {::subscribed_books::speech::religion::object} like thieves in the night." = "你管这叫虔诚？{::subscribed_books::speech::religion::entity}{::subscribed_books::speech::religion::action}{::subscribed_books::speech::religion::object}，如夜里的盗贼。"
"Every altar remembers the hour {::subscribed_books::speech::religion::entity} {::subscribed_books::speech::religion::action} {::subscribed_books::speech::religion::object}." = "每座祭坛都记得{::subscribed_books::speech::religion::entity}{::subscribed_books::speech::religion::action}{::subscribed_books::speech::religion::object}的那一刻。"
"{::subscribed_books::speech::religion::entity} spit on {::subscribed_books::speech::religion::object} and call it worship. I have seen enough." = "{::subscribed_books::speech::religion::entity}唾弃{::subscribed_books::speech::religion::object}，却管这叫敬拜。我看够了。"
"Mark my words: {::subscribed_books::speech::religion::entity} will answer for how they {::subscribed_books::speech::religion::action} {::subscribed_books::speech::religion::object}." = "记住我的话：{::subscribed_books::speech::religion::entity}必须为{::subscribed_books::speech::religion::action}{::subscribed_books::speech::religion::object}的方式负责。"
"Is nothing holy to {::subscribed_books::speech::religion::entity}? You would {::subscribed_books::speech::religion::action} {::subscribed_books::speech::religion::object} for less than nothing." = "对{::subscribed_books::speech::religion::entity}而言，还有什么神圣？你竟要为毫无价值之事{::subscribed_books::speech::religion::action}{::subscribed_books::speech::religion::object}。"
"{::subscribed_books::speech::religion::object} belongs to the gods, not to {::subscribed_books::speech::religion::entity} who {::subscribed_books::speech::religion::action} it for gain." = "{::subscribed_books::speech::religion::object}属于众神，不属于为了获利而{::subscribed_books::speech::religion::action}它的{::subscribed_books::speech::religion::entity}。"
