"{@bt_actor|::subscribed_books::vocabulary::person} stopped at the last crossroads before {@bt_far_place|::subscribed_books::vocabulary::place} and did not go on. \"I am done with {::subscribed_books::plot_vocabulary::cause},\" {@bt_actor2|::subscribed_books::vocabulary::person} said. {@bt_partner|::subscribed_books::vocabulary::person} watched {@bt_actor3|::subscribed_books::vocabulary::person} walk back toward {@bt_place|::subscribed_books::vocabulary::place}, and understood that the cause belonged to {@bt_partner2|::subscribed_books::vocabulary::person} now." = "{@bt_actor|::subscribed_books::vocabulary::person} 在抵达 {@bt_far_place|::subscribed_books::vocabulary::place} 前的最后一个岔路口停下，不再前行。“我不想再管{::subscribed_books::plot_vocabulary::cause}了。”{@bt_actor2|::subscribed_books::vocabulary::person} 说。{@bt_partner|::subscribed_books::vocabulary::person} 望着 {@bt_actor3|::subscribed_books::vocabulary::person} 走回通往 {@bt_place|::subscribed_books::vocabulary::place} 的路，明白如今这份事业只属于 {@bt_partner2|::subscribed_books::vocabulary::person} 了。"
