"The ritual dance of {@bt_entity|::subscribed_books::vocabulary::entity}, devised by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} at {@bt_site|::subscribed_books::vocabulary::place}, is among the most {::subscribed_books::adj} sacred expressions of the civilization's spiritual life. The dancers move in patterns that mirror the cosmos, each gesture a invocation, each step a covenant with the unseen." = "{@bt_entity|::subscribed_books::vocabulary::entity}的祭仪之舞，由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）于{@bt_site|::subscribed_books::vocabulary::place}设计，是该文明精神生活中最为{::subscribed_books::adj}神圣表达之一。舞者依照映照宇宙的图案移动，每个手势是祈请，每一步是与无形者的契约。"
"A exalted passage: the dancers raise their arms toward {@bt_artifact|::subscribed_books::vocabulary::artifact}, created in {@bt_year|::subscribed_books::vocabulary::birth_year}. The gesture is one of reverence." = "崇敬的一段：舞者向{@bt_year|::subscribed_books::vocabulary::birth_year}年创造的{@bt_artifact|::subscribed_books::vocabulary::artifact}高举双臂。这个手势表达敬意。"
"The people of {@bt_entity|::subscribed_books::vocabulary::entity} have always looked upward for meaning. The stars above {@bt_site|::subscribed_books::vocabulary::place} are not random. They are a {::subscribed_books::adj} text, written by powers beyond mortal comprehension. This chart, compiled by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, is a attempt to read that text." = "{@bt_entity|::subscribed_books::vocabulary::entity}的人民向来仰望天空寻找意义。{@bt_site|::subscribed_books::vocabulary::place}上方的星星并不随机，而是由超越凡人理解的力量写成的{::subscribed_books::adj}文本。本图由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）编纂，试图读懂这段文本。"
"I have spent my nights at {@bt_site|::subscribed_books::vocabulary::place} falling in love with points of light. Each star has a character, a mood, a {::subscribed_books::adj} personality. This catalogue, by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, is a attempt to capture what the cold language of astronomy cannot: the romance of the sky." = "我在{@bt_site|::subscribed_books::vocabulary::place}的夜晚里，爱上一个个光点。每颗星都有性格、情绪、{::subscribed_books::adj}个性。这本由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）写成的星表，试图捕捉天文学冰冷语言无法表达的东西：天空的浪漫。"

