[[rulesets]]
name = "military"
[rulesets.rules]
"You {::subscribed_books::speech::military::strategy} {::subscribed_books::speech::military::object} and call it a plan? It is a invitation to disaster." = "你{::subscribed_books::speech::military::strategy}{::subscribed_books::speech::military::object}，就管这叫计划？这是在招来灾难。"
"Every hour you {::subscribed_books::speech::military::strategy} {::subscribed_books::speech::military::object} is a hour our dead multiply." = "你每多花一小时{::subscribed_books::speech::military::strategy}{::subscribed_books::speech::military::object}，我们的死者就多一小时成倍增加。"

[[rulesets]]
name = "economy"
[rulesets.rules]
"You {::subscribed_books::speech::economy::action} {::subscribed_books::speech::economy::target} for your own glory and call the missing {::subscribed_books::speech::economy::resource} a accident." = "你为自己的荣耀{::subscribed_books::speech::economy::action}{::subscribed_books::speech::economy::target}，却把不见的{::subscribed_books::speech::economy::resource}说成意外。"

[[rulesets]]
name = "governance"
[rulesets.rules]
"If {::subscribed_books::speech::governance::policy} falls, who {::subscribed_books::speech::governance::action} {::subscribed_books::speech::governance::body} next? Your neighbor. you." = "若{::subscribed_books::speech::governance::policy}倒下，下一个{::subscribed_books::speech::governance::action}{::subscribed_books::speech::governance::body}的是谁？你的邻居，然后就是你。"

[[rulesets]]
name = "diplomacy"
[rulesets.rules]
"I trusted your judgment once. you decided to {::subscribed_books::speech::diplomacy::action} {::subscribed_books::speech::diplomacy::target}." = "我曾信任你的判断。后来你决定{::subscribed_books::speech::diplomacy::action}{::subscribed_books::speech::diplomacy::target}。"

[[rulesets]]
name = "expansion"
[rulesets.rules]
"I trusted your judgment once. you decided to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target} unprepared." = "我曾信任你的判断。后来你决定毫无准备地{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}。"
"Every season we wait, someone else claims what we could have had. That's not a excuse to {::subscribed_books::speech::expansion::action} {::subscribed_books::speech::expansion::target} blind, though." = "每等一季，别人就占去我们本可拥有的东西，但这也不是盲目{::subscribed_books::speech::expansion::action}{::subscribed_books::speech::expansion::target}的借口。"

