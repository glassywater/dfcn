# 声明内生成变化的规范形变体；原作者句式保留。
[[rulesets]]
[rulesets.rules]
"What followed was a odyssey that would reshape the world." = "此后，一场将重塑世界的漫长旅程展开了。"
"This novel traces each phase with the {adj} precision of a astronomer charting a comet that will not return." = "这部小说以天文学者绘制永不归来之彗星轨迹的{adj}精确，追溯每个阶段。"

