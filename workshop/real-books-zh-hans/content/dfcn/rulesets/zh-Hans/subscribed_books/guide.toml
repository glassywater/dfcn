[rulesets.rules]
# 所有者来自历史组织字段；不通过允许原样透传的身份捕获。
"{::text::name}" = "{::text::name}"
"{::subscribed_books::narrative_vocabulary::entity}" = "{::subscribed_books::narrative_vocabulary::entity}"
"a people" = "一个民族"
"the people of {site}" = "{site}的人民"

[[rulesets]]
name = "person"
[rulesets.rules]
# 姓名和称号分别完整匹配，避免 vocabulary::person 内的原样捕获分支。
"{::subscribed_books::vocabulary::plain_person}" = "{::subscribed_books::vocabulary::plain_person}"
"{::subscribed_books::vocabulary::plain_person} {::subscribed_books::vocabulary::epithet}" = "{::subscribed_books::vocabulary::plain_person}（{::subscribed_books::vocabulary::epithet}）"

[[rulesets]]
name = "builder"
[rulesets.rules]
"{person}" = "{person}"

