"{@bt_a|::subscribed_books::vocabulary::person}'s teeth were gritted, {pos1} eyes wide with fear the whole time {pro1} fought." = "{@bt_a|::subscribed_books::vocabulary::person}咬紧牙关。整个战斗过程中，{pro1}都因恐惧而睁大{pos1}双眼。"
"{@bt_a|::subscribed_books::vocabulary::person} fought clumsily, flinching at every strike, but {pro1} did not stop." = "{@bt_a|::subscribed_books::vocabulary::person}笨拙地战斗，每一击都让人畏缩，可{pro1}始终没有停下。"
"{@bt_a|::subscribed_books::vocabulary::person} would have given anything to be somewhere else. Trapped in the battle, {pro1} fought instead." = "{@bt_a|::subscribed_books::vocabulary::person}愿付出一切，只求去别的地方。可困在战场上，{pro1}只能继续战斗。"
"Fear made {@bt_a|::subscribed_books::vocabulary::person} fast, if not accurate, and {pro1} used every bit of that speed to survive." = "恐惧让{@bt_a|::subscribed_books::vocabulary::person}动作迅速，虽不准确，{pro1}却用尽这份速度求生。"
"{@bt_a|::subscribed_books::vocabulary::person} fought with {pos1} back against something solid, because at least that way nothing could come at {pro1} from behind." = "{@bt_a|::subscribed_books::vocabulary::person}把{pos1}背靠在坚实的东西上战斗，至少这样，就没有东西能从后面袭击{pro1}。"
"{@bt_a|::subscribed_books::vocabulary::person} did not fight to win. {pro1} fought only to still be breathing when it ended." = "{@bt_a|::subscribed_books::vocabulary::person}战斗不是为了获胜。{pro1}只求结束时还能呼吸。"
"{@bt_a|::subscribed_books::vocabulary::person} stumbled through the battle on pure adrenaline, too afraid to think, too trapped to stop." = "{@bt_a|::subscribed_books::vocabulary::person}全凭肾上腺素在战斗中踉跄挣扎，怕得无法思考，又困得无法停下。"
"{@bt_a|::subscribed_books::vocabulary::person} fought with {pos1} eyes half-closed against the worst of it, and somehow still landed enough blows to matter." = "最可怕的场面来临时，{@bt_a|::subscribed_books::vocabulary::person}半闭{pos1}双眼战斗，竟仍打中了足以奏效的几击。"
"{@bt_a|::subscribed_books::vocabulary::person} was terrified the entire time, and fought anyway, because the battle had already closed around {obj1}." = "{@bt_a|::subscribed_books::vocabulary::person}始终惊恐万分，却仍在战斗，因为战局早已将{obj1}团团困住。"
"{@bt_a|::subscribed_books::vocabulary::person} fought like someone bargaining with the moment itself, promising anything just to survive it." = "{@bt_a|::subscribed_books::vocabulary::person}战斗得像在与这一刻本身讨价还价，愿许下任何承诺，只求活过去。"
"{@bt_a|::subscribed_books::vocabulary::person}'s fear never left {pro1} once during the battle. It just became, gradually, useful." = "战斗中，{@bt_a|::subscribed_books::vocabulary::person}的恐惧一刻也没离开{pro1}。只是渐渐地，它变得有用了。"
"{@bt_a|::subscribed_books::vocabulary::person} held {pos1} ground only because there was nowhere left to retreat to, and fought like it." = "{@bt_a|::subscribed_books::vocabulary::person}守住{pos1}阵地，只因再也无路可退，而战斗的模样也正是如此。"

[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} said nothing. {pro1} simply disappeared. By morning, {pro2} was gone." = "{@bt_a|::subscribed_books::vocabulary::person}什么也没说。{pro1}只是消失了。到清晨，{pro2}已不在这里。"
"{@bt_a|::subscribed_books::vocabulary::person} did not stay to face what {pro1} had done. {pro2} was gone before anyone woke to find out." = "{@bt_a|::subscribed_books::vocabulary::person}没留下来面对{pro1}做过的事。还没人醒来发现真相，{pro2}就已经走了。"
"By the time the betrayal was discovered, {@bt_a|::subscribed_books::vocabulary::person} was already somewhere else, and had no intention of being found." = "背叛被发现时，{@bt_a|::subscribed_books::vocabulary::person}早已去了别处，也无意让人找到。"
"{@bt_a|::subscribed_books::vocabulary::person} left in the night, quietly, and did not leave word of where {pro1} had gone." = "{@bt_a|::subscribed_books::vocabulary::person}在夜里悄悄离开，没有留下{pro1}去向的消息。"
"{@bt_a|::subscribed_books::vocabulary::person} could not face the consequences, so {pro1} simply removed {ref1} from where they might find {obj1}." = "{@bt_a|::subscribed_books::vocabulary::person}无法面对后果，于是{pro1}让{ref1}离开了别人可能找到{obj1}的地方。"
"{@bt_a|::subscribed_books::vocabulary::person} vanished so completely after the betrayal that some wondered if {pro1} had ever really been there at all." = "背叛之后，{@bt_a|::subscribed_books::vocabulary::person}消失得如此彻底，以至于有人怀疑，{pro1}是否真的曾经存在于此。"
"{@bt_a|::subscribed_books::vocabulary::person} slipped away before the full weight of what {pro1} had done could land on {obj1}." = "{pro1}所做之事的全部后果落到{obj1}身上之前，{@bt_a|::subscribed_books::vocabulary::person}就溜走了。"
"There was no confrontation. {@bt_a|::subscribed_books::vocabulary::person} made sure of that, by not being anywhere near when it happened." = "没有当面对质。{@bt_a|::subscribed_books::vocabulary::person}确保如此，办法是在事情发生时，远远离开那里。"
"{@bt_a|::subscribed_books::vocabulary::person} packed quickly and left no explanation -- only an absence where {pro1} used to be." = "{@bt_a|::subscribed_books::vocabulary::person}匆忙收拾，没留下解释，只在{pro1}曾经所在的位置留下空缺。"
"{@bt_a|::subscribed_books::vocabulary::person} chose distance over honesty, and kept choosing it, further and further, until {pro1} was simply gone." = "{@bt_a|::subscribed_books::vocabulary::person}选择距离，而非坦诚，并一次次选下去，越走越远，直到{pro1}彻底消失。"
"{@bt_a|::subscribed_books::vocabulary::person} was already gone by the time anyone thought to ask {pro1} why." = "等有人想到问{pro1}为什么时，{@bt_a|::subscribed_books::vocabulary::person}已经走了。"
"{@bt_a|::subscribed_books::vocabulary::person} could not undo the betrayal, so {pro1} did the only thing that felt survivable: {pro2} left." = "{@bt_a|::subscribed_books::vocabulary::person}无法撤回背叛，于是{pro1}做了唯一看似能活下去的事：{pro2}离开了。"
"{@bt_a|::subscribed_books::vocabulary::person} did not answer for what {pro1} had done. {pro2} answered by disappearing instead." = "{@bt_a|::subscribed_books::vocabulary::person}没有为{pro1}做过的事负责。{pro2}用消失作出了回答。"
"{@bt_a|::subscribed_books::vocabulary::person} had a head start on the consequences, and used every bit of it to be somewhere else entirely." = "{@bt_a|::subscribed_books::vocabulary::person}比后果抢先一步，充分利用这段领先，彻底去了另一个地方。"
"{@bt_a|::subscribed_books::vocabulary::person} was nowhere to be found once the betrayal came to light, and stayed that way for a long time." = "背叛一曝光，{@bt_a|::subscribed_books::vocabulary::person}就无处可寻，而且许久都如此。"
"{@bt_a|::subscribed_books::vocabulary::person} left behind only the betrayal itself. {pro1} did not stay long enough to leave anything else." = "{@bt_a|::subscribed_books::vocabulary::person}只留下背叛本身。{pro1}没有停留到足以留下其他东西。"
"{@bt_a|::subscribed_books::vocabulary::person} ran from what {pro1} had done, the same way {pro2} ran from everything else that frightened {obj1}." = "{@bt_a|::subscribed_books::vocabulary::person}逃避{pro1}做过的事，就像{pro2}逃避其他一切令{obj1}害怕的东西。"
"{@bt_a|::subscribed_books::vocabulary::person} was gone before {pro1} had to look anyone in the eye about it." = "还没到{pro1}必须直视别人、交代此事的时候，{@bt_a|::subscribed_books::vocabulary::person}就已经离开。"
"{@bt_a|::subscribed_books::vocabulary::person} chose to vanish rather than explain, and {pro1} never really came back from it." = "{@bt_a|::subscribed_books::vocabulary::person}选择消失，而非解释，此后{pro1}再未真正回来。"
"{@bt_a|::subscribed_books::vocabulary::person} slipped out quietly, and by the time the betrayal was fully understood, there was no one left to confront." = "{@bt_a|::subscribed_books::vocabulary::person}悄悄溜走。等背叛的全貌终于被看清，已无人留下接受对质。"

# Trait: noble.
[[rulesets]]
[rulesets.rules]
"\"I will not lower myself to your level,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"But I will remember this.\"" = "“我不会堕落到与你一样，”{@bt_a|::subscribed_books::vocabulary::person}说道，“但这事我会记住。”"
"\"You have broken something that cannot be mended,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I will not pretend otherwise. But I will not stoop to answer it in kind.\"" = "“你毁掉了无法修复的东西，”{@bt_a|::subscribed_books::vocabulary::person}说道，“我不会假装没有。但我也不会自降身份，以同样的方式回报。”"
"\"I forgive the act,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"though I will not forget it. Those are different things.\"" = "“我原谅这件事，”{@bt_a|::subscribed_books::vocabulary::person}说道，“但不会忘记。原谅与遗忘，是两回事。”"
"\"I trusted you,\" {@bt_a|::subscribed_books::vocabulary::person} said quietly. \"That was my error to make, and I will not compound it with cruelty.\"" = "“我曾信任你，”{@bt_a|::subscribed_books::vocabulary::person}轻声说，“那是我自己的错误，我不会再用残忍让错误更深。”"
"\"You have chosen your path,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I will not follow you down it, even now.\"" = "“你选择了自己的道路，”{@bt_a|::subscribed_books::vocabulary::person}说道，“即使到了现在，我也不会跟着你走下去。”"
"\"I could return this in kind,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"and I choose not to. That is the whole of the difference between us.\"" = "“我本可以以牙还牙，”{@bt_a|::subscribed_books::vocabulary::person}说道，“但我选择不这样做。这就是我们之间的全部区别。”"
"\"This changes what I owe you,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but not what I owe myself.\"" = "“这会改变我对你的责任，”{@bt_a|::subscribed_books::vocabulary::person}说道，“却不会改变我对自己的责任。”"
"\"Say what you will,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I will still act as I believe is right, regardless of what you've done.\"" = "“随你怎么说，”{@bt_a|::subscribed_books::vocabulary::person}说道，“不管你做过什么，我仍会按自己认为正确的方式行事。”"
"\"I am not angry,\" {@bt_a|::subscribed_books::vocabulary::person} said, though {pro1} clearly was. \"I am simply finished trusting you.\"" = "“我没生气，”{@bt_a|::subscribed_books::vocabulary::person}说道，尽管{pro1}显然很生气，“我只是不再信任你了。”"
"\"You had my loyalty,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"You will not have my hatred as well. That much I will not give you.\"" = "“你曾拥有我的忠诚，”{@bt_a|::subscribed_books::vocabulary::person}说道，“不会再得到我的仇恨。这一点，我不会给你。”"
"\"I hold no grudge,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"though I will hold my distance.\"" = "“我不会怀恨，”{@bt_a|::subscribed_books::vocabulary::person}说道，“但会保持距离。”"
"\"This will not change how I treat those who did not betray me,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I will not let it.\"" = "“这不会改变我对待没有背叛我的人的方式，”{@bt_a|::subscribed_books::vocabulary::person}说道，“我不会允许它改变。”"
"\"I understand why you did it,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"Understanding is not the same as forgiveness. But I offer what I can.\"" = "“我理解你为什么这样做，”{@bt_a|::subscribed_books::vocabulary::person}说道，“理解不等于原谅。但我会尽我所能。”"
"\"You have made your choice,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I will not make you regret it. That would make me no better than you.\"" = "“你已作出选择，”{@bt_a|::subscribed_books::vocabulary::person}说道，“我不会让你为此后悔。否则我也不比你好。”"
"\"I will speak no ill of you,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"though I have every right to.\"" = "“我不会说你的坏话，”{@bt_a|::subscribed_books::vocabulary::person}说道，“尽管我完全有权这样做。”"
"\"There was a version of this where I answered betrayal with betrayal,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I am glad I am not that person.\"" = "“这事也可能走向另一种结局，由我用背叛回应背叛，”{@bt_a|::subscribed_books::vocabulary::person}说道，“庆幸我不是那样的人。”"
"\"I release you from any debt you owed me,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"Consider us finished, not enemies.\"" = "“你欠我的一切，我都免了，”{@bt_a|::subscribed_books::vocabulary::person}说道，“我们就此结束，但不是敌人。”"
"\"You will not hear me lie about what you did,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but you will not hear me stoop to match it either.\"" = "“你不会听到我歪曲你做过的事，”{@bt_a|::subscribed_books::vocabulary::person}说道，“也不会看到我降低自己，做出同样的事。”"
"\"I do not need your apology,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I need only to know it will not happen again to someone else.\"" = "“我不需要你的道歉，”{@bt_a|::subscribed_books::vocabulary::person}说道，“只需要知道，这事不会再发生在别人身上。”"
"\"This is not the end I would have chosen for us,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but I will meet it with dignity, even if you did not.\"" = "“这不是我会为我们选择的结局，”{@bt_a|::subscribed_books::vocabulary::person}说道，“但我会有尊严地面对，即使你没有。”"

[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} fought with honor -- no tricks, no cheap shots, no strikes against a fallen opponent." = "{@bt_a|::subscribed_books::vocabulary::person}堂堂正正地战斗，不玩诡计，不下黑手，也不攻击倒下的对手。"
"{@bt_a|::subscribed_books::vocabulary::person} lowered {pos1} weapon the moment the other side did, refusing to press an advantage {pro1} hadn't earned fairly." = "对方一放下武器，{@bt_a|::subscribed_books::vocabulary::person}也放下{pos1}武器，拒绝利用{pro1}并未公平赢得的优势。"
"{@bt_a|::subscribed_books::vocabulary::person} gave the warning {pro1} was not obligated to give, before the conflict turned into something worse." = "冲突恶化之前，{@bt_a|::subscribed_books::vocabulary::person}先发出了警告，尽管{pro1}并无这样做的义务。"
"{@bt_a|::subscribed_books::vocabulary::person} could have ended it quickly, unfairly. {pro1} chose the slower, cleaner way instead." = "{@bt_a|::subscribed_books::vocabulary::person}本可以迅速却不公平地结束此事。{pro1}却选择了更慢、更堂正的办法。"
"{@bt_a|::subscribed_books::vocabulary::person} took the blow rather than deliver an underhanded one to avoid it." = "{@bt_a|::subscribed_books::vocabulary::person}宁愿挨下这一击，也不愿用卑劣的一击躲过去。"
"Even furious, {@bt_a|::subscribed_books::vocabulary::person} would not strike first. Some lines {pro1} would not cross, whatever the provocation." = "即使盛怒，{@bt_a|::subscribed_books::vocabulary::person}也不先动手。无论受到什么挑衅，有些底线{pro1}绝不越过。"
"{@bt_a|::subscribed_books::vocabulary::person} offered terms before the conflict escalated further, though nothing obliged {pro1} to." = "{@bt_a|::subscribed_books::vocabulary::person}在冲突进一步升级前提出和解条件，尽管{pro1}并没有这样的义务。"
"{@bt_a|::subscribed_books::vocabulary::person} fought only as hard as {pro1} had to, and not a single measure harder." = "{@bt_a|::subscribed_books::vocabulary::person}只使出{pro1}不得不使出的力气，不多用半分。"
"When the advantage came, {@bt_a|::subscribed_books::vocabulary::person} did not take it. That was not how {pro1} chose to win." = "优势出现时，{@bt_a|::subscribed_books::vocabulary::person}没有利用。{pro1}不愿用这种方式取胜。"
"{@bt_a|::subscribed_books::vocabulary::person} stood between the conflict and those who had no part in it, and held the line there." = "{@bt_a|::subscribed_books::vocabulary::person}挡在冲突与无辜者之间，牢牢守住这条线。"
"{@bt_a|::subscribed_books::vocabulary::person} refused the easy blow and took the harder, fairer one instead." = "{@bt_a|::subscribed_books::vocabulary::person}拒绝轻易得手的一击，选择更难、却更公平的攻击。"
"{@bt_a|::subscribed_books::vocabulary::person} would rather lose with {pos1} principles intact than win without them." = "{@bt_a|::subscribed_books::vocabulary::person}宁愿带着完整的{pos1}原则落败，也不愿丢掉原则获胜。"
"{@bt_a|::subscribed_books::vocabulary::person} called off {pos1} own allies the moment the fight turned unfair in {pos2} favor." = "战斗一旦不公平地偏向{pos2}一方，{@bt_a|::subscribed_books::vocabulary::person}就叫停了{pos1}盟友。"
"{@bt_a|::subscribed_books::vocabulary::person} met aggression with restraint, not because {pro1} lacked the will to fight, but because {pro2} had a code that mattered more." = "{@bt_a|::subscribed_books::vocabulary::person}以克制回应攻击，并非{pro1}没有战意，而是{pro2}有比战意更重要的准则。"
"{@bt_a|::subscribed_books::vocabulary::person} gave {pos1} opponent the chance to yield before the conflict became irreversible." = "{@bt_a|::subscribed_books::vocabulary::person}在冲突无法挽回之前，给了{pos1}对手投降的机会。"
"{@bt_a|::subscribed_books::vocabulary::person} would not use the weapon {pro1} had been handed, not that way, not against someone already beaten." = "{@bt_a|::subscribed_books::vocabulary::person}不会用{pro1}接到的武器，以那种方式，攻击一个已经落败的人。"
"{@bt_a|::subscribed_books::vocabulary::person} fought the conflict {pro1} was given, not the conflict {pro2} could have manufactured to win more easily." = "{@bt_a|::subscribed_books::vocabulary::person}面对{pro1}实际遇到的冲突，而不是为方便获胜，由{pro2}刻意制造出来的冲突。"
"{@bt_a|::subscribed_books::vocabulary::person} held to the old rules of engagement even as everyone around {pro1} abandoned them." = "即使{pro1}周围的人全都放弃旧日交战准则，{@bt_a|::subscribed_books::vocabulary::person}仍坚持遵守。"
"{@bt_a|::subscribed_books::vocabulary::person} accepted the wound rather than the dishonorable way out of taking it." = "{@bt_a|::subscribed_books::vocabulary::person}宁愿受伤，也不愿用不光彩的办法逃开。"
"{@bt_a|::subscribed_books::vocabulary::person} ended the conflict the moment {pro1} could, and not a moment past when honor required it." = "{@bt_a|::subscribed_books::vocabulary::person}在{pro1}能够结束冲突的那一刻就结束它，绝不比荣誉所允许的时刻多拖片刻。"

[[rulesets]]
[rulesets.rules]
"\"I give this freely,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"No debt is owed. No favor expected.\"" = "“这是自愿给你的，”{@bt_a|::subscribed_books::vocabulary::person}说道，“不欠人情，也不求回报。”"
"\"Take it,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I ask nothing in return, and I mean that plainly.\"" = "“收下吧，”{@bt_a|::subscribed_books::vocabulary::person}说道，“我不求任何回报，就是字面上的意思。”"
"\"This isn't a transaction,\" {@bt_a|::subscribed_books::vocabulary::person} said, offering the gift. \"It's simply what's right.\"" = "“这不是交易，”{@bt_a|::subscribed_books::vocabulary::person}递出礼物，说道，“只是应该做的事。”"
"\"I don't give to be thanked,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"But you're welcome, all the same.\"" = "“我送东西，不是为了听谢谢，”{@bt_a|::subscribed_books::vocabulary::person}说道，“不过，还是说句不客气。”"
"\"Consider it settled,\" {@bt_a|::subscribed_books::vocabulary::person} said, handing it over. \"There's no ledger between us. There never was.\"" = "“就算了结了，”{@bt_a|::subscribed_books::vocabulary::person}递过去，说道，“我们之间没有账本，从来就没有。”"
"\"I would have given this to anyone in your position,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"It isn't special to you. It's just decent.\"" = "“换谁处在你的境地，我都会送出它，”{@bt_a|::subscribed_books::vocabulary::person}说道，“不是特地为你，只是做人的本分。”"
"\"Please,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"don't feel obligated. An obligated gift isn't really a gift at all.\"" = "“请别觉得欠了什么，”{@bt_a|::subscribed_books::vocabulary::person}说道，“让人背负义务的礼物，根本算不上礼物。”"
"\"I ask for nothing,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"and I'd think less of myself if I did.\"" = "“我无所求，”{@bt_a|::subscribed_books::vocabulary::person}说道，“若有所求，我自己都会瞧不起自己。”"
"\"This is yours now,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"What you do with it, and what you owe me for it -- nothing -- is entirely up to you.\"" = "“现在它属于你了，”{@bt_a|::subscribed_books::vocabulary::person}说道，“怎样使用由你决定。至于你欠我什么，答案是什么也不欠。”"
"\"I know what it cost me,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I also know it was worth giving. That's the whole of my reasoning.\"" = "“我知道它花费了我多少，”{@bt_a|::subscribed_books::vocabulary::person}说道，“也知道值得送出。我的理由就这些。”"
"\"Don't thank me too much,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I'd have been ashamed not to offer it.\"" = "“不必太过感谢，”{@bt_a|::subscribed_books::vocabulary::person}说道，“若不送给你，我反倒会羞愧。”"
"\"There are no strings on this,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I've cut them all myself, just to be sure.\"" = "“这不附带任何条件，”{@bt_a|::subscribed_books::vocabulary::person}说道，“为了保险，我亲手把所有牵绊都剪断了。”"
"\"I give what I can spare,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"and sometimes a bit of what I can't. This was worth it.\"" = "“我给出能拿得出来的东西，”{@bt_a|::subscribed_books::vocabulary::person}说道，“有时也给一点拿不出来的。这次值得。”"
"\"This isn't charity,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"It's simply what one person owes another, now and then.\"" = "“这不是施舍，”{@bt_a|::subscribed_books::vocabulary::person}说道，“只是人和人之间，偶尔应尽的责任。”"
"\"Take it with a clear conscience,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I gave it with one.\"" = "“心安理得地收下吧，”{@bt_a|::subscribed_books::vocabulary::person}说道，“我送出时也是心安理得。”"
"\"I won't pretend this was easy to part with,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but that's rather the point of giving.\"" = "“我不会假装舍得它很容易，”{@bt_a|::subscribed_books::vocabulary::person}说道，“但赠予的意义，也正在这里。”"
"\"You don't owe me your gratitude,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"You've already given me enough, just by needing it less than you did.\"" = "“你不欠我谢意，”{@bt_a|::subscribed_books::vocabulary::person}说道，“你的需要比以前少了些，就已经给了我足够的回报。”"
"\"I would rather go without than see you go without,\" {@bt_a|::subscribed_books::vocabulary::person} said simply." = "“我宁愿自己缺了，也不愿看你缺了，”{@bt_a|::subscribed_books::vocabulary::person}简单地说。"
"\"No favor is expected,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"and none will be remembered, should you ever wonder.\"" = "“不期待人情，”{@bt_a|::subscribed_books::vocabulary::person}说道，“也不会记着这份人情，哪怕你以后想起这个问题。”"
"\"This is freely given,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"and freely forgotten, the moment it leaves my hands.\"" = "“这是自愿送出的，”{@bt_a|::subscribed_books::vocabulary::person}说道，“一离开我的手，也就自愿忘记了。”"

# Trait: manipulative.
[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} steered the conversation with subtle precision, and by the end, everyone believed the conclusion had been their own idea." = "{@bt_a|::subscribed_books::vocabulary::person}微妙而精准地引导谈话。到最后，所有人都以为结论是自己想出来的。"
"{@bt_a|::subscribed_books::vocabulary::person} asked questions that were not really questions, each one nudging the discussion a little closer to where {pro1} wanted it." = "{@bt_a|::subscribed_books::vocabulary::person}提出一个个其实并非问题的问题，每一个都让讨论更接近{pro1}想要的方向。"
"By the time the others noticed the discussion had a direction, {@bt_a|::subscribed_books::vocabulary::person} had already gotten what {pro1} came for." = "等别人意识到讨论有预定方向时，{@bt_a|::subscribed_books::vocabulary::person}已经得到了{pro1}此行想要的东西。"
"{@bt_a|::subscribed_books::vocabulary::person} let someone else say the words {pro1} wanted said, then agreed enthusiastically, as if surprised." = "{@bt_a|::subscribed_books::vocabulary::person}让别人说出{pro1}想说的话，再热情地表示赞同，仿佛惊喜地听到一个新主意。"
"{@bt_a|::subscribed_books::vocabulary::person} planted a doubt early and let it grow on its own for the rest of the conversation." = "{@bt_a|::subscribed_books::vocabulary::person}早早种下怀疑，让它在余下的谈话中自行生长。"
"Nothing {@bt_a|::subscribed_books::vocabulary::person} said was technically false. All of it, arranged together, led exactly where {pro1} intended." = "{@bt_a|::subscribed_books::vocabulary::person}说的每句话，严格来说都不算假。但把它们组合起来，就恰好通向{pro1}预定的结果。"
"{@bt_a|::subscribed_books::vocabulary::person} conceded a small point generously, banking the goodwill for the larger one {pro1} actually wanted." = "{@bt_a|::subscribed_books::vocabulary::person}大方地在小事上让步，积攒好感，留给{pro1}真正想要的大事。"
"{@bt_a|::subscribed_books::vocabulary::person} listened with total attention, filing away exactly which words would move each person in the room." = "{@bt_a|::subscribed_books::vocabulary::person}全神贯注地听着，记下哪些话能打动屋里的每个人。"
"The discussion felt open and fair. It was neither. {@bt_a|::subscribed_books::vocabulary::person} had mapped its ending before it began." = "讨论看似开放而公平，其实两者皆无。{@bt_a|::subscribed_books::vocabulary::person}在开始之前，就已规划好结局。"
"{@bt_a|::subscribed_books::vocabulary::person} paused at exactly the right moment, letting the silence do the persuading for {pro1}." = "{@bt_a|::subscribed_books::vocabulary::person}恰到好处地停顿，让沉默替{pro1}完成说服。"
"{@bt_a|::subscribed_books::vocabulary::person} reframed the disagreement as a misunderstanding, and the misunderstanding, conveniently, was never {pos1} fault." = "{@bt_a|::subscribed_books::vocabulary::person}把分歧重新解释为误会，而这误会，恰好从来不是{pos1}过错。"
"By asking what everyone else thought first, {@bt_a|::subscribed_books::vocabulary::person} learned exactly how to phrase what {pro1} thought." = "{@bt_a|::subscribed_books::vocabulary::person}先问过所有人的想法，于是准确知道该如何表达{pro1}自己的想法。"
"{@bt_a|::subscribed_books::vocabulary::person} agreed with the loudest voice in the room just long enough to redirect it." = "{@bt_a|::subscribed_books::vocabulary::person}赞同屋里声音最大的人，赞同得刚好足以改变对方的方向。"
"{@bt_a|::subscribed_books::vocabulary::person} left {pos1} own preference unstated until the room had nearly talked itself into it anyway." = "{@bt_a|::subscribed_books::vocabulary::person}迟迟不说{pos1}偏好，直到屋里的人几乎自己讨论出了相同的选择。"
"{@bt_a|::subscribed_books::vocabulary::person} offered two options, both of which led to the same outcome {pro1} had wanted from the start." = "{@bt_a|::subscribed_books::vocabulary::person}给出两个选择，而两条路都通向{pro1}从一开始就想要的结果。"
"{@bt_a|::subscribed_books::vocabulary::person} smiled and nodded and, without seeming to try, made the conclusion feel inevitable." = "{@bt_a|::subscribed_books::vocabulary::person}微笑、点头，看似毫不费力，就让那个结论变得理所当然。"
"{@bt_a|::subscribed_books::vocabulary::person} let the discussion drift, correcting its course so gently that no one noticed the current was {pos1}." = "{@bt_a|::subscribed_books::vocabulary::person}让讨论随意漂流，再轻轻校正方向，无人察觉水流其实受{pos1}掌控。"
"{@bt_a|::subscribed_books::vocabulary::person} praised the group's good judgment right before steering that judgment exactly where {pro1} needed it." = "{@bt_a|::subscribed_books::vocabulary::person}先赞扬众人的判断高明，随即把这份判断引向{pro1}需要的方向。"
"{@bt_a|::subscribed_books::vocabulary::person} said very little. What little {@bt_a2|::subscribed_books::vocabulary::person} said did all the necessary work." = "{@bt_a|::subscribed_books::vocabulary::person}说得很少。而{@bt_a2|::subscribed_books::vocabulary::person}说出的那几句话，已完成所有必要的工作。"
"By the end of the discussion, everyone left satisfied. Only {@bt_a|::subscribed_books::vocabulary::person} left with what {pro1} had actually wanted." = "讨论结束时，所有人都满意而归。只有{@bt_a|::subscribed_books::vocabulary::person}带走了{pro1}真正想要的东西。"

[[rulesets]]
[rulesets.rules]
"\"Of course you feel that way,\" {@bt_a|::subscribed_books::vocabulary::person} said sympathetically. \"Anyone would. But have you considered...\"" = "“你当然会这样想，”{@bt_a|::subscribed_books::vocabulary::person}同情地说，“换谁都会。不过，你有没有考虑过……”"
"\"I only want what's best for you,\" {@bt_a|::subscribed_books::vocabulary::person} said, in a tone carefully calibrated to sound like it." = "“我只是想让你过得最好，”{@bt_a|::subscribed_books::vocabulary::person}说道，语气精心拿捏，听起来恰如其言。"
"\"You're right to be upset,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"You're just upset at the wrong person, is all.\"" = "“你生气是应该的，”{@bt_a|::subscribed_books::vocabulary::person}说道，“只不过气错了人而已。”"
"\"I'm not trying to change your mind,\" {@bt_a|::subscribed_books::vocabulary::person} said, doing exactly that. \"I just think you deserve all the facts.\"" = "“我不是想改变你的主意，”{@bt_a|::subscribed_books::vocabulary::person}说道，却正是在做这件事，“我只是觉得，你有权知道全部事实。”"
"\"Take your time,\" {@bt_a|::subscribed_books::vocabulary::person} said, knowing full well the silence would work in {pos1} favor." = "“慢慢来，”{@bt_a|::subscribed_books::vocabulary::person}说道，心知肚明，这沉默会对{pos1}有利。"
"\"I hate that we're fighting,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"especially when I only brought this up because I care about you.\"" = "“我讨厌我们这样争吵，”{@bt_a|::subscribed_books::vocabulary::person}说道，“尤其我提起这事，只是因为在乎你。”"
"\"You know I'd never manipulate you,\" {@bt_a|::subscribed_books::vocabulary::person} said, watching closely to see if that landed." = "“你知道我从不会操纵你，”{@bt_a|::subscribed_books::vocabulary::person}说道，仔细观察这话是否奏效。"
"\"Let's not argue,\" {@bt_a|::subscribed_books::vocabulary::person} said gently, having already gotten exactly what {pro1} came for." = "“别吵了，”{@bt_a|::subscribed_books::vocabulary::person}温柔地说，此时{pro1}此行所求早已全部到手。"
"\"I just want to understand your side,\" {@bt_a|::subscribed_books::vocabulary::person} said, already three steps ahead of it." = "“我只是想理解你的立场，”{@bt_a|::subscribed_books::vocabulary::person}说道，心里的算计却已领先三步。"
"\"It's funny,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"you're the third person to feel that way. Maybe there's something to it.\"" = "“有意思，”{@bt_a|::subscribed_books::vocabulary::person}说道，“你是第三个这么想的人了。也许确实有点道理。”"
"\"I'd never ask you to choose,\" {@bt_a|::subscribed_books::vocabulary::person} said, phrasing the choice so there was really only one answer." = "“我绝不会逼你选择，”{@bt_a|::subscribed_books::vocabulary::person}说道，却把选择说得实际上只剩一个答案。"
"\"I trust your judgment completely,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"which is why I know you'll come around.\"" = "“我完全相信你的判断，”{@bt_a|::subscribed_books::vocabulary::person}说道，“所以我知道，你最终会想通的。”"
"\"You don't have to agree with me right now,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"Just think about it. That's all I'm asking.\"" = "“你不必现在就同意我，”{@bt_a|::subscribed_books::vocabulary::person}说道，“只需想一想。我只求这一点。”"
"\"I'm only saying this because no one else will,\" {@bt_a|::subscribed_books::vocabulary::person} said, which was, conveniently, also useful." = "“我说这些，只是因为别人都不肯说，”{@bt_a|::subscribed_books::vocabulary::person}说道。而恰好，这话本身也很有用。"
"\"I hear you,\" {@bt_a|::subscribed_books::vocabulary::person} said, in the tone of someone who had already decided not to." = "“我明白你的意思，”{@bt_a|::subscribed_books::vocabulary::person}说道，语气却像早已决定不去听的人。"
"\"Honestly, I admire that you stood your ground,\" {@bt_a|::subscribed_books::vocabulary::person} said, softening the ground considerably in the process." = "“说真的，我佩服你坚持立场，”{@bt_a|::subscribed_books::vocabulary::person}说道，而这话正在大大软化那立场。"
"\"We both want the same thing,\" {@bt_a|::subscribed_books::vocabulary::person} said, quietly redefining what that thing was." = "“我们想要的是同一件事，”{@bt_a|::subscribed_books::vocabulary::person}说道，悄悄重新定义了那件事。"
"\"I'm not upset,\" {@bt_a|::subscribed_books::vocabulary::person} said, letting the faint disappointment in {pos1} voice do the arguing instead." = "“我没生气，”{@bt_a|::subscribed_books::vocabulary::person}说道，让{pos1}声音里隐约的失望代替自己争辩。"
"\"You're the only one I'd trust with this,\" {@bt_a|::subscribed_books::vocabulary::person} said, and watched the flattery do its work." = "“这件事，我只信任你，”{@bt_a|::subscribed_books::vocabulary::person}说道，看着奉承发挥作用。"
"\"Think about it from my perspective,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"just for a moment,\" and waited for the moment to become an agreement." = "“从我的角度想想，”{@bt_a|::subscribed_books::vocabulary::person}说道，“只要片刻就好。”随后等着那片刻变成赞同。"

[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} offered the gift with calculated generosity. Every kindness was an investment." = "{@bt_a|::subscribed_books::vocabulary::person}带着算计过的慷慨送出礼物。每份善意都是一笔投资。"
"{@bt_a|::subscribed_books::vocabulary::person} chose the gift carefully -- not for what it said about {pos1} taste, but for what it would owe {pro1} later." = "{@bt_a|::subscribed_books::vocabulary::person}仔细挑选礼物，看重的不是它能表现{pos1}品味，而是日后能让别人欠{pro1}多少人情。"
"{@bt_a|::subscribed_books::vocabulary::person} gave freely, publicly, and made sure the right people were watching when {pro1} did." = "{@bt_a|::subscribed_books::vocabulary::person}大方而公开地赠予，并确保{pro1}赠予时，该看到的人都在看。"
"The gift arrived with no strings attached. The strings would come later, once they were less visible." = "礼物到来时，不附带任何条件。条件会在以后到来，到那时，它们就不那么显眼了。"
"{@bt_a|::subscribed_books::vocabulary::person} gave generously to the one person whose favor {pro1} most needed, and forgot everyone else entirely." = "{@bt_a|::subscribed_books::vocabulary::person}慷慨地赠予那个{pro1}最需要讨好的人，将其他所有人忘得一干二净。"
"{@bt_a|::subscribed_books::vocabulary::person} timed the gift to land at the exact moment it would do the most good -- for {pro1}." = "{@bt_a|::subscribed_books::vocabulary::person}算准时机送出礼物，恰好赶在它最有益的时候，当然，是对{pro1}最有益。"
"{@bt_a|::subscribed_books::vocabulary::person} made the gift look spontaneous. It had been planned for weeks." = "{@bt_a|::subscribed_books::vocabulary::person}让礼物看起来像是一时兴起，其实早已计划了好几个星期。"
"{@bt_a|::subscribed_books::vocabulary::person} gave something small and made it feel enormous, which was, in its way, the more valuable gift." = "{@bt_a|::subscribed_books::vocabulary::person}送出一件小东西，却让它显得意义非凡。某种意义上，这才是更有价值的礼物。"
"{@bt_a|::subscribed_books::vocabulary::person} let the recipient believe the gift was unconditional. {@bt_a2|::subscribed_books::vocabulary::person} knew better." = "{@bt_a|::subscribed_books::vocabulary::person}让收礼者相信，礼物毫无条件。{@bt_a2|::subscribed_books::vocabulary::person}却心知肚明。"
"{@bt_a|::subscribed_books::vocabulary::person} gave with a warm smile and a mental note of exactly what {pro1} expected in return." = "{@bt_a|::subscribed_books::vocabulary::person}带着温暖的微笑赠予，心里却清楚记着{pro1}期待怎样的回报。"
"{@bt_a|::subscribed_books::vocabulary::person} chose a gift that would be impossible to refuse and, more importantly, impossible to forget." = "{@bt_a|::subscribed_books::vocabulary::person}选择了一件无法拒绝的礼物，更重要的是，也无法忘记。"
"The gift came with a story attached, one designed to make the recipient feel singled out, special, indebted." = "礼物附着一个故事，为的是让收礼者觉得受到特别关照、独一无二，并欠下人情。"
"{@bt_a|::subscribed_books::vocabulary::person} gave generously in front of {pos1} rivals, knowing generosity, witnessed, was its own kind of leverage." = "{@bt_a|::subscribed_books::vocabulary::person}在{pos1}对手面前大方赠予，深知被人看见的慷慨，本身就是一种筹码。"
"{@bt_a|::subscribed_books::vocabulary::person} handed over the gift and immediately changed the subject, letting the debt sit unspoken and unrefused." = "{@bt_a|::subscribed_books::vocabulary::person}送出礼物后立刻换了话题，让那份人情停在那里，既不说破，也无法拒绝。"
"{@bt_a|::subscribed_books::vocabulary::person} gave the gift {pro1} knew would be needed most, having quietly arranged for that need in the first place." = "{@bt_a|::subscribed_books::vocabulary::person}送出{pro1}知道对方最需要的礼物，而那份需要，本来就是自己悄悄安排出来的。"
"{@bt_a|::subscribed_books::vocabulary::person} made sure the gift arrived without a note. Anonymous generosity, {pro1} had learned, bought the most goodwill." = "{@bt_a|::subscribed_books::vocabulary::person}确保礼物送达时没有署名。{pro1}早已明白，匿名的慷慨最能赢得好感。"
"{@bt_a|::subscribed_books::vocabulary::person} gave exactly enough to be remembered and not so much that it looked like a bribe." = "{@bt_a|::subscribed_books::vocabulary::person}给得刚好足以让人记住，又不多到看起来像贿赂。"
"{@bt_a|::subscribed_books::vocabulary::person} presented the gift modestly, downplaying its cost, which only made it land harder." = "{@bt_a|::subscribed_books::vocabulary::person}谦逊地呈上礼物，淡化它的花费，反而让它更打动人。"
"{@bt_a|::subscribed_books::vocabulary::person} gave the gift to soften ground {pro1} intended to walk on again very soon." = "{@bt_a|::subscribed_books::vocabulary::person}送出礼物，软化那片{pro1}很快还要踏入的土地。"
"{@bt_a|::subscribed_books::vocabulary::person} gave without being asked, which was, {pro1} had found, the most effective way to be owed." = "{@bt_a|::subscribed_books::vocabulary::person}不等别人请求就主动赠予。{pro1}发现，这是让人欠下人情最有效的方式。"

# Trait: stubborn.
[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} did not budge. Not an inch. Not now, not ever. This was the hill, and {pro1} would die on it." = "{@bt_a|::subscribed_books::vocabulary::person}寸步不让。现在不让，永远不让。这是{pro1}要以死捍卫的立场。"
"{@bt_a|::subscribed_books::vocabulary::person} crossed {pos1} arms and planted {pos2} feet, and the conversation might as well have ended there." = "{@bt_a|::subscribed_books::vocabulary::person}抱起{pos1}双臂，站稳{pos2}双脚，谈话到这里其实就已经结束了。"
"No amount of pleading moved {@bt_a|::subscribed_books::vocabulary::person}. {pro1} had made up {pos1} mind before the argument even began, and nothing said since had touched it." = "再怎么恳求也打动不了{@bt_a|::subscribed_books::vocabulary::person}。争论开始之前，{pro1}就已拿定{pos1}主意，此后的话没有一句能动摇它。"
"{@bt_a|::subscribed_books::vocabulary::person} repeated {pos1} position, word for word, exactly as {pro1} had said it the first time. And the second. And the third." = "{@bt_a|::subscribed_books::vocabulary::person}一字不差地重复{pos1}立场，和{pro1}第一次说时完全一样。第二次、第三次，也一样。"
"The argument went in circles, always returning to the same place: {@bt_a|::subscribed_books::vocabulary::person}, unmoved, arms folded, waiting it out." = "争论绕来绕去，总回到同一个地方：{@bt_a|::subscribed_books::vocabulary::person}抱着双臂，毫不动摇，等它自行结束。"
"{@bt_a|::subscribed_books::vocabulary::person} listened to every counterpoint with visible patience and changed {pos1} mind on none of them." = "{@bt_a|::subscribed_books::vocabulary::person}明显很耐心地听完每条反驳，却没有一条改变{pos1}想法。"
"Reason, evidence, pleading -- {@bt_a|::subscribed_books::vocabulary::person} absorbed all of it and gave back exactly nothing." = "道理、证据、恳求，{@bt_a|::subscribed_books::vocabulary::person}全都听进去了，却没有作出丝毫回应。"
"{@bt_a|::subscribed_books::vocabulary::person} simply stopped responding to new arguments, as though repetition alone might make the old one true again." = "{@bt_a|::subscribed_books::vocabulary::person}干脆不再回应新的论据，仿佛只要重复，就能让旧说法重新成为真理。"
"There was a particular set to {pos1} jaw that meant the discussion was, as far as {pro1} was concerned, already over." = "{pos1}下颌绷出一种特殊的姿态，意味着在{pro1}看来，讨论已经结束。"
"{@bt_a|::subscribed_books::vocabulary::person} let the silence stretch rather than concede a single point." = "{@bt_a|::subscribed_books::vocabulary::person}宁愿让沉默延续，也不肯承认哪怕一点。"
"Every attempt to find common ground slid off {@bt_a|::subscribed_books::vocabulary::person} like water off stone." = "每一次寻找共同立场的尝试，都像水滑过石头一样，无法触动{@bt_a|::subscribed_books::vocabulary::person}。"
"{@bt_a|::subscribed_books::vocabulary::person} nodded along to the argument against {pro1}, then said, calmly, that {pro2} still disagreed." = "{@bt_a|::subscribed_books::vocabulary::person}听着反对{pro1}的论点，一路点头，随后平静地表示，{pro2}仍然不同意。"
"{@bt_a|::subscribed_books::vocabulary::person} had agreed to listen. {pro1} had not agreed to be convinced, and made sure everyone understood the difference." = "{@bt_a|::subscribed_books::vocabulary::person}答应过倾听。{pro1}可没答应接受说服，而且确保所有人都明白两者的区别。"
"{@bt_a|::subscribed_books::vocabulary::person} dug in further with every fresh objection, as if opposition itself were proof {pro1} was right." = "每多一条反对意见，{@bt_a|::subscribed_books::vocabulary::person}就更加固执，仿佛反对本身就证明{pro1}正确。"
"The others eventually gave up first. {@bt_a|::subscribed_books::vocabulary::person} had not moved a muscle." = "最终，别人先放弃了。{@bt_a|::subscribed_books::vocabulary::person}连一块肌肉都没动过。"
"{@bt_a|::subscribed_books::vocabulary::person} folded {pos1} arms and waited for the argument to exhaust itself, which it eventually did." = "{@bt_a|::subscribed_books::vocabulary::person}抱起{pos1}双臂，等争论耗尽自身的力气。最终，它确实耗尽了。"
"{@bt_a|::subscribed_books::vocabulary::person} conceded nothing, not even the small, obviously true things, on principle." = "出于原则，{@bt_a|::subscribed_books::vocabulary::person}什么也不承认，连那些微小而显然正确的事也不例外。"
"Whatever ground {@bt_a|::subscribed_books::vocabulary::person} had staked out at the start of the argument, {pro1} still held at the end of it." = "无论{@bt_a|::subscribed_books::vocabulary::person}在争论开始时占据什么立场，到结束时，{pro1}仍然守着它。"
"{@bt_a|::subscribed_books::vocabulary::person} was polite about it, even friendly, which somehow made the refusal to budge more infuriating." = "{@bt_a|::subscribed_books::vocabulary::person}态度礼貌，甚至友善，不知为何，反倒让那份寸步不让更加令人恼火。"
"{@bt_a|::subscribed_books::vocabulary::person} had heard this argument before, in one form or another, and {pro1} had not changed {pos1} mind then either." = "这套说辞，{@bt_a|::subscribed_books::vocabulary::person}以前就听过，只是形式不同。当时{pro1}也没有改变{pos1}主意。"

[[rulesets]]
[rulesets.rules]
"\"I have heard your argument,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"My answer has not changed. It will not change.\"" = "“你的论点我听到了，”{@bt_a|::subscribed_books::vocabulary::person}说道，“我的答案没有变，也不会变。”"
"\"You can say it a different way if you like,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but it won't land any differently.\"" = "“你愿意的话，可以换个说法，”{@bt_a|::subscribed_books::vocabulary::person}说道，“但效果不会有什么不同。”"
"{@bt_a|::subscribed_books::vocabulary::person} shook {pos1} head slowly. \"No. I've considered it. I'm still no.\"" = "{@bt_a|::subscribed_books::vocabulary::person}缓缓摇动{pos1}脑袋。“不。我考虑过了，还是不同意。”"
"\"We can discuss this as long as you want,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"The outcome's already decided.\"" = "“你想讨论多久都行，”{@bt_a|::subscribed_books::vocabulary::person}说道，“结果早已定了。”"
"\"I appreciate the effort,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but you're pushing on a door that doesn't open.\"" = "“你的努力我领情，”{@bt_a|::subscribed_books::vocabulary::person}说道，“可你推的是一扇打不开的门。”"
"{@bt_a|::subscribed_books::vocabulary::person} folded {pos1} hands. \"Say what you need to say. I'll still be sitting here disagreeing with you when you're done.\"" = "{@bt_a|::subscribed_books::vocabulary::person}合起{pos1}双手。“想说什么就说。等你说完，我还是会坐在这里反对你。”"
"\"That's a fine point,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"and it changes nothing.\"" = "“这论点不错，”{@bt_a|::subscribed_books::vocabulary::person}说道，“可什么也改变不了。”"
"\"I don't need to hear it again,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I heard it the first time. I disagreed the first time too.\"" = "“不用再说一遍，”{@bt_a|::subscribed_books::vocabulary::person}说道，“第一次我就听见了，第一次我也没同意。”"
"{@bt_a|::subscribed_books::vocabulary::person} was quiet for a moment. \"No,\" {pro1} said finally. Just that." = "{@bt_a|::subscribed_books::vocabulary::person}沉默片刻。“不，”{pro1}终于说道。仅此而已。"
"\"You're not wrong that it would be easier,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but easier was never the deciding factor.\"" = "“你说这样更容易，这没错，”{@bt_a|::subscribed_books::vocabulary::person}说道，“但是否容易，从来不是决定因素。”"
"\"I'm not being stubborn,\" {@bt_a|::subscribed_books::vocabulary::person} said, entirely stubbornly. \"I'm being consistent.\"" = "“我不是固执，”{@bt_a|::subscribed_books::vocabulary::person}十分固执地说，“我是始终如一。”"
"\"Ask me again tomorrow,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"and I'll give you the same answer, so let's save us both the trouble.\"" = "“明天再问我，”{@bt_a|::subscribed_books::vocabulary::person}说道，“答案也一样。所以咱俩都省点事吧。”"
"{@bt_a|::subscribed_books::vocabulary::person} met every objection with the same flat calm. \"No. Next.\"" = "{@bt_a|::subscribed_books::vocabulary::person}用同样平淡的镇静回应每条反对意见。“不。下一条。”"
"\"I respect that you disagree,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I disagree right back.\"" = "“我尊重你的不同意见，”{@bt_a|::subscribed_books::vocabulary::person}说道，“我也同样不同意你。”"
"\"You've made your case,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I made mine a while ago. Mine still stands.\"" = "“你的理由已经讲了，”{@bt_a|::subscribed_books::vocabulary::person}说道，“我的早就讲过了，而且仍然成立。”"
"{@bt_a|::subscribed_books::vocabulary::person} did not raise {pos1} voice. {pro1} did not need to. \"The answer is no,\" {pro2} repeated, \"same as before.\"" = "{@bt_a|::subscribed_books::vocabulary::person}没有提高{pos1}声音，{pro1}也不需要。“答案是不，”{pro2}重复道，“和之前一样。”"
"\"I won't pretend to be persuaded just to end the conversation,\" {@bt_a|::subscribed_books::vocabulary::person} said." = "“我不会为了结束谈话，就假装被说服，”{@bt_a|::subscribed_books::vocabulary::person}说道。"
"\"There's nothing left to discuss,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"unless you've got a new argument. Do you have a new argument?\"" = "“没什么可讨论的了，”{@bt_a|::subscribed_books::vocabulary::person}说道，“除非你有新的论据。你有吗？”"
"{@bt_a|::subscribed_books::vocabulary::person} tapped the table once, final. \"That's my answer. It was my answer an hour ago too.\"" = "{@bt_a|::subscribed_books::vocabulary::person}在桌上敲了一下，一锤定音。“这就是我的答案。一小时前也是这个答案。”"
"\"You're welcome to keep talking,\" {@bt_a|::subscribed_books::vocabulary::person} said, settling back into {pos1} chair, \"I'm comfortable.\"" = "“你尽管继续说，”{@bt_a|::subscribed_books::vocabulary::person}靠进{pos1}椅子里，说道，“我坐得挺舒服。”"

[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} was unmoved. Stubbornness, in this case, was a form of armor." = "{@bt_a|::subscribed_books::vocabulary::person}不为所动。在这里，固执就是一副铠甲。"
"Every flattering word, every clever angle -- none of it found purchase. {@bt_a|::subscribed_books::vocabulary::person} simply would not move." = "每句奉承、每种巧妙的切入方式，都无处着力。{@bt_a|::subscribed_books::vocabulary::person}就是不肯动摇。"
"{@bt_a|::subscribed_books::vocabulary::person} recognized the attempt for what it was and refused to budge out of pure spite as much as principle." = "{@bt_a|::subscribed_books::vocabulary::person}认出了对方的企图，拒绝退让，既是出于原则，也是不想让对方得逞。"
"The manipulation slid off {@bt_a|::subscribed_books::vocabulary::person} the same way every argument did: without effect." = "那些操纵手段和每一次争辩一样，滑过{@bt_a|::subscribed_books::vocabulary::person}，没有丝毫效果。"
"{@bt_a|::subscribed_books::vocabulary::person} let the persuasion run its course, nodded politely, and did exactly what {pro1} had already decided to do." = "{@bt_a|::subscribed_books::vocabulary::person}听任劝说进行到底，礼貌地点头，随后照着{pro1}早已作出的决定行事。"
"Whatever angle was being worked, {@bt_a|::subscribed_books::vocabulary::person} had already decided not to be worked, and held to it." = "无论对方从哪里下手，{@bt_a|::subscribed_books::vocabulary::person}早已决定不受摆布，并坚守到底。"
"{@bt_a|::subscribed_books::vocabulary::person} met the charm offensive with the same flat wall {pro1} met everything else with." = "面对魅力攻势，{@bt_a|::subscribed_books::vocabulary::person}和{pro1}面对其他一切时一样，竖起一面纹丝不动的墙。"
"The clever framing, the careful wording -- {@bt_a|::subscribed_books::vocabulary::person} noticed all of it and was persuaded by none of it." = "巧妙的包装、精心的措辞，{@bt_a|::subscribed_books::vocabulary::person}全都看在眼里，却没有一项能说服心意。"
"{@bt_a|::subscribed_books::vocabulary::person} was, if anything, more resistant to persuasion than to open argument. At least argument was honest." = "{@bt_a|::subscribed_books::vocabulary::person}对劝诱的抵触，比对公开争辩还深。至少争辩是坦诚的。"
"{@bt_a|::subscribed_books::vocabulary::person} simply repeated {pos1} position, unbothered by the increasingly creative attempts to change it." = "{@bt_a|::subscribed_books::vocabulary::person}只管重复{pos1}立场，任凭改变它的尝试越来越花巧，依然不为所动。"
"{@bt_a|::subscribed_books::vocabulary::person} let the pressure build and did not so much as shift {pos1} stance." = "{@bt_a|::subscribed_books::vocabulary::person}任凭压力累积，连{pos1}站姿都没有变过。"
"Try as they might, no one could find the lever that moved {@bt_a|::subscribed_books::vocabulary::person}. There wasn't one." = "任凭如何尝试，谁也找不到能撬动{@bt_a|::subscribed_books::vocabulary::person}的杠杆。根本没有。"
"{@bt_a|::subscribed_books::vocabulary::person} watched the manipulation unfold with something like detached amusement, then declined to participate in it." = "{@bt_a|::subscribed_books::vocabulary::person}冷眼看着操纵展开，几乎像是在看一出笑话，随后拒绝参与。"
"{@bt_a|::subscribed_books::vocabulary::person} had been talked at for a long while and had, by the end, agreed to nothing." = "对方滔滔不绝地向{@bt_a|::subscribed_books::vocabulary::person}说了许久，直到最后，仍是什么也没答应。"
"{@bt_a|::subscribed_books::vocabulary::person}'s answer, filtered through every clever approach {pro1} was offered, remained exactly what it had been at the start." = "每一种巧妙手段都试过之后，{@bt_a|::subscribed_books::vocabulary::person}的答案仍和最初完全相同，{pro1}没有改变。"
"{@bt_a|::subscribed_books::vocabulary::person} did not even pretend to consider the offer. Some minds simply do not open on request." = "{@bt_a|::subscribed_books::vocabulary::person}连假装考虑提议都不愿。有些人的心思，根本不会应要求而敞开。"
"The harder the push, the more firmly {@bt_a|::subscribed_books::vocabulary::person} planted {pos1} feet." = "逼得越紧，{@bt_a|::subscribed_books::vocabulary::person}就越牢地站稳{pos1}双脚。"
"{@bt_a|::subscribed_books::vocabulary::person} let the other person talk themselves out, then gave the same answer {pro1} would have given at the start." = "{@bt_a|::subscribed_books::vocabulary::person}让对方把话说尽，随后给出{pro1}最开始就会给出的那个答案。"
"{@bt_a|::subscribed_books::vocabulary::person} was immune to flattery in a way that made the attempt feel, in retrospect, a little embarrassing." = "{@bt_a|::subscribed_books::vocabulary::person}对奉承完全免疫，事后回想，那番尝试甚至有些尴尬。"
"{@bt_a|::subscribed_books::vocabulary::person} stood exactly where {pro1} had been standing before the conversation started, and stayed there." = "{@bt_a|::subscribed_books::vocabulary::person}仍站在谈话开始前{pro1}站的地方，始终没有离开。"

#[trait funny: Argument / Conflict / Betrayal]
[[rulesets]]
[rulesets.rules]
"\"Oh come on,\" {@bt_a|::subscribed_books::vocabulary::person} said with a grin. \"If we're going to fight, at least let me finish my drink first.\"" = "“得了吧，”{@bt_a|::subscribed_books::vocabulary::person}咧嘴笑道，“要吵架，好歹先让我把酒喝完。”"
"{@bt_a|::subscribed_books::vocabulary::person} raised both hands in mock surrender. \"Truce! I concede! You win! What were we arguing about again?\"" = "{@bt_a|::subscribed_books::vocabulary::person}举起双手，佯装投降。“停战！我认输！你赢了！对了，我们在吵什么来着？”"
"\"You know,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"this would make a great story someday. Mind if I start writing it now, mid-argument?\"" = "“你知道吗，”{@bt_a|::subscribed_books::vocabulary::person}说道，“这事将来会是个好故事。介意我现在就动笔吗，就在咱俩吵到一半的时候？”"
"\"I'd love to keep yelling,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but I think my voice just broke, and that's embarrassing for both of us.\"" = "“我倒想继续喊，”{@bt_a|::subscribed_books::vocabulary::person}说道，“可好像刚刚喊破音了，咱俩都挺丢人的。”"
"{@bt_a|::subscribed_books::vocabulary::person} let out a low whistle. \"Wow. Okay. Somebody's had a rough day. Was it me? Please say it wasn't me.\"" = "{@bt_a|::subscribed_books::vocabulary::person}低低吹了声口哨。“哇，好吧，有人今天过得不太顺。是我吗？求你说不是我。”"
"\"Can we table this?\" {@bt_a|::subscribed_books::vocabulary::person} asked. \"Not because I'm wrong. Purely for scheduling reasons.\"" = "“能先搁置这事吗？”{@bt_a|::subscribed_books::vocabulary::person}问，“不是因为我错了。纯粹是日程安排的问题。”"
"\"I was going to make a clever comeback,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but I got distracted by how mad you look right now.\"" = "“我本来想妙语反击，”{@bt_a|::subscribed_books::vocabulary::person}说道，“可你现在气成这样，让我看得走神了。”"
"{@bt_a|::subscribed_books::vocabulary::person} clutched at {pos1} chest theatrically. \"Oh, the wound! The betrayal! The devastating truth of your correct point!\"" = "{@bt_a|::subscribed_books::vocabulary::person}夸张地捂住{pos1}胸口。“啊，这伤痛！这背叛！你的观点居然正确，多么毁灭性的真相！”"
"\"Careful,\" {@bt_a|::subscribed_books::vocabulary::person} said, backing away with a laugh, \"arguing with me is a skill best practiced sober.\"" = "“当心，”{@bt_a|::subscribed_books::vocabulary::person}笑着后退，“跟我争辩，最好在清醒时练这门本事。”"
"\"In my defense,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"I have no defense. But I do have several unrelated jokes.\"" = "“容我辩解一下，”{@bt_a|::subscribed_books::vocabulary::person}说道，“我无从辩解。不过我有几个毫不相关的笑话。”"
"{@bt_a|::subscribed_books::vocabulary::person} snorted. \"This is the part where I usually crack under pressure and start doing bits, so, fair warning.\"" = "{@bt_a|::subscribed_books::vocabulary::person}嗤笑一声。“一般到了这一步，我就会压力过大，开始插科打诨。提前提醒你一下。”"
"\"You're really committing to this argument,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"I respect it. I also think you're wrong. But I respect it.\"" = "“你吵得真投入，”{@bt_a|::subscribed_books::vocabulary::person}说道，“我很敬佩。我也觉得你错了。但我很敬佩。”"
"\"Let the record show,\" {@bt_a|::subscribed_books::vocabulary::person} announced to no one in particular, \"that I tried to be serious for at least four seconds.\"" = "“请记录在案，”{@bt_a|::subscribed_books::vocabulary::person}不知对谁宣布，“我至少努力认真了四秒钟。”"
"{@bt_a|::subscribed_books::vocabulary::person} held up a finger. \"One moment. I need to compose myself before I say something devastatingly funny.\"" = "{@bt_a|::subscribed_books::vocabulary::person}竖起一根手指。“等一下。说出那个让你笑到崩溃的笑话之前，我得先镇定一下。”"
"\"I'd apologize,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"but then we'd have nothing to argue about, and this is the most fun I've had all week.\"" = "“我倒是可以道歉，”{@bt_a|::subscribed_books::vocabulary::person}说道，“可那样就没得吵了，而这是我这周最开心的事。”"
"\"Is it hot in here,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"or is that just the sound of you being furious at me?\"" = "“这里是不是太热了，”{@bt_a|::subscribed_books::vocabulary::person}说道，“还是说，你气我的声音都能发热？”"
"{@bt_a|::subscribed_books::vocabulary::person} sighed dramatically. \"Fine. FINE. You're right. There, I said it. Are you happy? Don't answer that.\"" = "{@bt_a|::subscribed_books::vocabulary::person}夸张地叹气。“好吧，好吧！你说得对。行了，我说了。高兴了吗？别回答。”"
"\"I was told there'd be a debate,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"not a shouting contest. I only brought material for the debate.\"" = "“他们说是来辩论的，”{@bt_a|::subscribed_books::vocabulary::person}说道，“没说要比赛吼叫。我只准备了辩论的材料。”"
"{@bt_a|::subscribed_books::vocabulary::person} pointed at the sky. \"Look, a bird!\" Nobody looked. {pro1} shrugged. \"Worth a shot.\"" = "{@bt_a|::subscribed_books::vocabulary::person}指向天空。“看，有鸟！”没人抬头。{pro1}耸耸肩。“总值得试试。”"
"\"You know what they say,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"Nobody actually says anything, I just needed a second to think of a comeback.\"" = "“俗话说得好，”{@bt_a|::subscribed_books::vocabulary::person}说道，“其实没有这句俗话，我只是需要一秒钟想怎么回嘴。”"

[[rulesets]]
[rulesets.rules]
"\"I feel like we should talk about this,\" {@bt_a|::subscribed_books::vocabulary::person} said, dodging a thrown object. \"Or not. Dodging is fine too.\"" = "“我觉得咱们该谈谈，”{@bt_a|::subscribed_books::vocabulary::person}闪开扔来的东西，说道，“或者不谈也行。闪躲也挺好。”"
"{@bt_a|::subscribed_books::vocabulary::person} ducked behind a barrel. \"This is a very one-sided conversation!\" {pro1} shouted. \"I'd like to file a complaint!\"" = "{@bt_a|::subscribed_books::vocabulary::person}躲到桶后。“这场谈话完全是你单方面的！”{pro1}喊道，“我要投诉！”"
"\"Okay, hostile,\" {@bt_a|::subscribed_books::vocabulary::person} said, hands up. \"Noted. Filed away. Definitely not going to make a joke about it. Definitely.\"" = "“好吧，敌意很足，”{@bt_a|::subscribed_books::vocabulary::person}举着手说，“记下了，存档了。绝对不会拿它开玩笑，绝对。”"
"{@bt_a|::subscribed_books::vocabulary::person} weaved out of the way and grinned. \"Missed me! Try again, this is oddly fun for me and terrible for you!\"" = "{@bt_a|::subscribed_books::vocabulary::person}闪身躲开，咧嘴笑道：“没打中！再来，这事对我居然挺好玩，对你可就太糟了！”"
"\"Can we agree,\" {@bt_a|::subscribed_books::vocabulary::person} called out, \"that violence is a young person's game and I am, spiritually, quite old?\"" = "“咱们能达成共识吗，”{@bt_a|::subscribed_books::vocabulary::person}喊道，“暴力是年轻人的游戏，而我的心灵已经很老了？”"
"{@bt_a|::subscribed_books::vocabulary::person} raised {pos1} hands. \"I come in peace! Well, I come in mild sarcasm, but it's adjacent to peace!\"" = "{@bt_a|::subscribed_books::vocabulary::person}举起{pos1}双手。“我带着和平而来！好吧，是带着一点讽刺，但也差不多算和平！”"
"\"You throw like someone who's never had to apologize for anything,\" {@bt_a|::subscribed_books::vocabulary::person} said, still moving." = "“看你扔东西的架势，好像从来没为任何事道过歉，”{@bt_a|::subscribed_books::vocabulary::person}一边继续闪躲一边说。"
"{@bt_a|::subscribed_books::vocabulary::person} laughed despite {ref1}. \"This is escalating fast. I like it. I hate it. Mostly I like it.\"" = "{@bt_a|::subscribed_books::vocabulary::person}连{ref1}也控制不住地笑了。“闹得越来越大了。我喜欢，我讨厌。主要还是喜欢。”"
"\"In my professional opinion,\" {@bt_a|::subscribed_books::vocabulary::person} said, sidestepping, \"we should both put down our weapons and go get lunch.\"" = "“以我的专业意见，”{@bt_a|::subscribed_books::vocabulary::person}侧身躲开，说道，“咱们应该都放下武器，去吃午饭。”"
"{@bt_a|::subscribed_books::vocabulary::person} yelped and spun away. \"Rude! Deeply, deeply rude! I'm telling everyone how rude this was!\"" = "{@bt_a|::subscribed_books::vocabulary::person}惊叫着转身避开。“无礼！太无礼，实在太无礼！我要告诉所有人，你有多无礼！”"
"\"I have several excellent qualities,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"and not one of them is going to help me right now.\"" = "“我有好几种优秀品质，”{@bt_a|::subscribed_books::vocabulary::person}说道，“可现在一种也帮不上忙。”"
"{@bt_a|::subscribed_books::vocabulary::person} pointed at the damage behind {obj1}. \"That was already broken! Probably! I'm choosing to believe that!\"" = "{@bt_a|::subscribed_books::vocabulary::person}指着{obj1}身后被砸坏的东西。“那本来就坏了！大概吧！反正我选择相信它本来就坏了！”"
"\"This is exactly the kind of thing I joke about later,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"assuming there is a later.\"" = "“这种事正适合日后拿来开玩笑，”{@bt_a|::subscribed_books::vocabulary::person}说道，“前提是还有日后。”"
"{@bt_a|::subscribed_books::vocabulary::person} bowed mid-scramble. \"Thank you, thank you, I'll be here all week, please stop trying to hit me.\"" = "{@bt_a|::subscribed_books::vocabulary::person}慌乱躲避时还鞠了一躬。“谢谢，谢谢，我整周都在这里演出，请别再打我了。”"
"\"Statistically,\" {@bt_a|::subscribed_books::vocabulary::person} said, catching {pos1} breath, \"you should have calmed down by now. Statistics were wrong.\"" = "“从统计上说，”{@bt_a|::subscribed_books::vocabulary::person}缓了缓{pos1}呼吸，说道，“你现在应该消气了。看来统计错了。”"
"{@bt_a|::subscribed_books::vocabulary::person} grinned through gritted teeth. \"You know, under different circumstances, I think we could've been friends.\"" = "{@bt_a|::subscribed_books::vocabulary::person}咬着牙挤出笑容。“你知道，换个场合，我觉得咱们本来可以做朋友。”"
"\"I'm not scared,\" {@bt_a|::subscribed_books::vocabulary::person} announced, clearly scared. \"I'm just extremely motivated to be somewhere else.\"" = "“我不怕，”{@bt_a|::subscribed_books::vocabulary::person}宣布，显然怕得很，“我只是特别有动力去别的地方。”"
"{@bt_a|::subscribed_books::vocabulary::person} threw up {pos1} hands. \"Fine! You win the fight! I'll take the moral victory of not sweating this much!\"" = "{@bt_a|::subscribed_books::vocabulary::person}举起{pos1}双手。“好吧！你打赢了！我就拿不用流这么多汗当精神胜利吧！”"
"\"Ask me anything about de-escalation,\" {@bt_a|::subscribed_books::vocabulary::person} said, backpedaling fast, \"because I am living the opposite of it right now.\"" = "“缓和局势的事，你尽管问我，”{@bt_a|::subscribed_books::vocabulary::person}飞快后退着说，“因为我现在经历的恰好是它的反面。”"
"{@bt_a|::subscribed_books::vocabulary::person} winced as something whistled past {pos1} ear. \"That's it, I'm putting that in the story. With embellishments.\"" = "某样东西呼啸着掠过{pos1}耳边，{@bt_a|::subscribed_books::vocabulary::person}吓得缩了一下。“够了，我要把这段写进故事里，还要添油加醋。”"

[[rulesets]]
[rulesets.rules]
"\"Well,\" {@bt_a|::subscribed_books::vocabulary::person} said, with a laugh that didn't reach {pos1} eyes. \"I did not see that coming. And I see a lot of things coming.\"" = "“好吧，”{@bt_a|::subscribed_books::vocabulary::person}笑着说，{pos1}眼中却毫无笑意，“这倒没料到。我平时可是能料到很多事的。”"
"{@bt_a|::subscribed_books::vocabulary::person} let out a short, disbelieving laugh. \"Okay. Okay! Great. Love that for me. Love that for both of us.\"" = "{@bt_a|::subscribed_books::vocabulary::person}难以置信地短笑一声。“好吧，好吧！太好了。我可真喜欢这种遭遇，咱俩可真走运。”"
"\"You know,\" {@bt_a|::subscribed_books::vocabulary::person} said, voice a little too bright, \"I was due for a good betrayal. Really keeps you humble.\"" = "“你知道，”{@bt_a|::subscribed_books::vocabulary::person}用过分轻快的声音说，“我也该好好被背叛一回了。真能让人谦虚。”"
"{@bt_a|::subscribed_books::vocabulary::person} clapped slowly. \"Bravo. Genuinely. I'd give notes, but I'm too busy being devastated to be constructive.\"" = "{@bt_a|::subscribed_books::vocabulary::person}缓缓鼓掌。“精彩，真的。本来想提点意见，可我正忙着崩溃，实在提不出建设性的意见。”"
"\"I'll add this to the list,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"of things I'll definitely joke about someday. Not today. But someday.\"" = "“这事我要记在清单上，”{@bt_a|::subscribed_books::vocabulary::person}说道，“将来一定拿来开玩笑的那些事。不是今天，但总有一天。”"
"{@bt_a|::subscribed_books::vocabulary::person} smiled thinly. \"Ha. Ha ha. That's — yeah, that's a normal amount of laughing for this situation.\"" = "{@bt_a|::subscribed_books::vocabulary::person}勉强一笑。“哈，哈哈。对，这种情况下，笑这么多算正常。”"
"\"Well played,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"truly. I'd applaud, but my hands are busy processing several emotions at once.\"" = "“玩得漂亮，”{@bt_a|::subscribed_books::vocabulary::person}说道，“真的。我倒想鼓掌，可我的手正忙着同时处理好几种情绪。”"
"{@bt_a|::subscribed_books::vocabulary::person} exhaled through {pos1} teeth. \"I'm choosing to find this funny. It's that or the alternative, and the alternative sounds exhausting.\"" = "{@bt_a|::subscribed_books::vocabulary::person}从{pos1}牙缝间吐出一口气。“我决定觉得这很好笑。不然就得换另一种反应，而那种听起来太累了。”"
"\"So that's a betrayal,\" {@bt_a|::subscribed_books::vocabulary::person} said. \"Noted for future reference. Filing it right next to 'never trust anyone, ever.'\"" = "“原来这就叫背叛，”{@bt_a|::subscribed_books::vocabulary::person}说道，“记下，供日后参考。就归档在‘永远别相信任何人’旁边。”"
"{@bt_a|::subscribed_books::vocabulary::person} let out a long, slow whistle. \"Wow. Cold. Efficient. I almost admire it. Almost.\"" = "{@bt_a|::subscribed_books::vocabulary::person}慢慢吹出一声长口哨。“哇，冷酷，利落。我都快佩服了，差一点。”"
"\"I had a whole speech prepared for this moment,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"and it turns out it was mostly swearing, so.\"" = "“为这一刻，我准备过一整段演讲，”{@bt_a|::subscribed_books::vocabulary::person}说道，“结果发现大部分都是骂人的话。所以嘛。”"
"{@bt_a|::subscribed_books::vocabulary::person} pressed a hand to {pos1} chest. \"Betrayed! In this economy! The nerve, honestly, the sheer nerve.\"" = "{@bt_a|::subscribed_books::vocabulary::person}用手按住{pos1}胸口。“竟然背叛！在这种年景！真够胆，简直胆大包天！”"
"\"You know what's funny,\" {@bt_a|::subscribed_books::vocabulary::person} said, not smiling, \"is that I actually thought that one was going well.\"" = "“知道最可笑的是什么吗，”{@bt_a|::subscribed_books::vocabulary::person}没有笑，“我居然以为这次一切顺利。”"
"{@bt_a|::subscribed_books::vocabulary::person} laughed once, sharp. \"There it is. There's the twist. I should've bet money on this.\"" = "{@bt_a|::subscribed_books::vocabulary::person}尖锐地笑了一声。“来了，转折来了。我早该拿它下注的。”"
"\"Congratulations,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"on the betrayal. Five stars. Would not recommend experiencing personally.\"" = "“恭喜，”{@bt_a|::subscribed_books::vocabulary::person}说道，“背叛干得漂亮，五星好评。但不推荐亲自体验。”"
"{@bt_a|::subscribed_books::vocabulary::person} tilted {pos1} head. \"I'm going to need a minute. And then several jokes. In that order.\"" = "{@bt_a|::subscribed_books::vocabulary::person}偏了偏{pos1}脑袋。“我需要缓一会儿，然后讲几个笑话。按这个顺序来。”"
"\"Well, this is awkward,\" {@bt_a|::subscribed_books::vocabulary::person} said, \"and by awkward I mean catastrophic, but 'awkward' felt easier to say out loud.\"" = "“好吧，这挺尴尬，”{@bt_a|::subscribed_books::vocabulary::person}说道，“我说尴尬，其实是说灾难性。只是‘尴尬’比较说得出口。”"
"{@bt_a|::subscribed_books::vocabulary::person} shrugged with far more composure than {pro1} felt. \"Sure. Fine. Great. Love a classic betrayal, really ties the week together.\"" = "{@bt_a|::subscribed_books::vocabulary::person}耸耸肩，表面比{pro1}心里镇定得多。“行，好，太好了。我最爱这种经典背叛了，这周可算圆满了。”"
"\"I'm not mad,\" {@bt_a|::subscribed_books::vocabulary::person} said, in the exact tone of someone who was extremely mad. \"I'm just recalculating.\"" = "“我没生气，”{@bt_a|::subscribed_books::vocabulary::person}用气得要命的语气说，“我只是在重新盘算。”"
"{@bt_a|::subscribed_books::vocabulary::person} managed a crooked smile. \"You know, most people at least wait until I've finished my drink.\"" = "{@bt_a|::subscribed_books::vocabulary::person}挤出一丝歪斜的笑。“你知道，大多数人至少会等我把酒喝完。”"

[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} reacted." = "{@bt_a|::subscribed_books::vocabulary::person}作出了反应。"
"For {@bt_a|::subscribed_books::vocabulary::person}, who lived by a code, this was not merely wrong -- it was an affront to the order that held the world together." = "对恪守准则的{@bt_a|::subscribed_books::vocabulary::person}而言，这不只是错误，更是对维系世界的秩序的冒犯。"
"{@bt_a|::subscribed_books::vocabulary::person} believed in rules. What had just happened violated every one of them." = "{@bt_a|::subscribed_books::vocabulary::person}相信规矩。而刚刚发生的事，违背了每一条规矩。"
"{@bt_a|::subscribed_books::vocabulary::person} had never been one for formality. The proper way of doing things was, in {pos1} experience, rarely the right way." = "{@bt_a|::subscribed_books::vocabulary::person}从不拘泥于礼节。凭{pos1}经验，合乎规矩的做法，往往并非正确的做法。"
"Rules existed to be tested. {@bt_a|::subscribed_books::vocabulary::person} tested them constantly." = "规矩就是用来挑战的。{@bt_a|::subscribed_books::vocabulary::person}总在挑战它们。"
"{@bt_a|::subscribed_books::vocabulary::person} took no pleasure in what had to be done. But doing the right thing and doing the easy thing were rarely the same." = "{@bt_a|::subscribed_books::vocabulary::person}并不以必须做的事为乐。但正确的事与容易的事，向来很少相同。"
"Even now, {@bt_a|::subscribed_books::vocabulary::person} looked for the path that caused the least harm. It was a habit -- and a burden." = "即便此刻，{@bt_a|::subscribed_books::vocabulary::person}仍在寻找伤害最小的道路。这是一种习惯，也是一副重担。"
"Generosity, for {@bt_a|::subscribed_books::vocabulary::person}, was always transactional. The gesture concealed a purpose." = "对{@bt_a|::subscribed_books::vocabulary::person}而言，慷慨始终是一场交易。示好背后藏着目的。"
"{@bt_a|::subscribed_books::vocabulary::person} smiled, and the smile contained calculations that {@bt_b|::subscribed_books::vocabulary::person} could not see." = "{@bt_a|::subscribed_books::vocabulary::person}露出微笑，笑容里藏着{@bt_b|::subscribed_books::vocabulary::person}看不见的算计。"

[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} held out {::subscribed_books::world::item}. \"This belonged to my {::subscribed_books::world::relation},\" {@bt_a2|::subscribed_books::vocabulary::person} said quietly. \"{pro1} carried it for years. I want you to have it -- not because I do not value it, but because I do.\"" = "{@bt_a|::subscribed_books::vocabulary::person}递出{::subscribed_books::world::item}。“这是我的{::subscribed_books::world::relation}留下的，”{@bt_a2|::subscribed_books::vocabulary::person}轻声说，“{pro1}带了它很多年。我想把它送给你，并不是因为不珍惜它，恰恰因为珍惜。”"
"{@bt_a|::subscribed_books::vocabulary::person} presented a small instrument -- hand-carved, carefully tuned, and clearly the work of many patient nights. \"I know you love music,\" {@bt_a2|::subscribed_books::vocabulary::person} said. \"I made this for you.\"" = "{@bt_a|::subscribed_books::vocabulary::person}送来一件小乐器：手工雕刻，仔细调音，显然是许多个夜晚耐心制作的成果。“我知道你喜欢音乐，”{@bt_a2|::subscribed_books::vocabulary::person}说道，“这是为你做的。”"
"{@bt_a|::subscribed_books::vocabulary::person} unwrapped a set of tools -- each one balanced, polished, and fitted to the hand. \"The best I could find,\" {@bt_a2|::subscribed_books::vocabulary::person} said. \"You deserve tools that match your skill.\"" = "{@bt_a|::subscribed_books::vocabulary::person}解开包裹，露出一套工具，每件都配重均衡、打磨光亮、握持顺手。“这是我能找到的最好的一套，”{@bt_a2|::subscribed_books::vocabulary::person}说道，“你值得拥有配得上你技艺的工具。”"
"{@bt_a|::subscribed_books::vocabulary::person} held out a pressed flower, preserved between sheets of parchment. \"I found this on the mountain pass,\" {@bt_a2|::subscribed_books::vocabulary::person} said. \"It reminded me of you.\"" = "{@bt_a|::subscribed_books::vocabulary::person}递出一朵保存在羊皮纸间的压花。“我在山口发现了它，”{@bt_a2|::subscribed_books::vocabulary::person}说道，“它让我想起你。”"
"{@bt_a|::subscribed_books::vocabulary::person} presented a blade -- not ornate, but perfectly balanced. \"I had this made by the best smith in {::subscribed_books::world::profession},\" {@bt_a2|::subscribed_books::vocabulary::person} said. \"For someone who understands what a weapon should be.\"" = "{@bt_a|::subscribed_books::vocabulary::person}送来一把剑，毫不华丽，却有着完美的平衡。“我请{::subscribed_books::world::profession}中最好的铁匠打造了它，”{@bt_a2|::subscribed_books::vocabulary::person}说道，“送给懂得武器该是什么样子的人。”"
"{@bt_a|::subscribed_books::vocabulary::person} held out a leather-bound journal, filled with {pos1} own handwriting. \"Every story I know,\" {@bt_a2|::subscribed_books::vocabulary::person} said. \"The ones my family told me, the ones I heard on the road. They are yours now.\"" = "{@bt_a|::subscribed_books::vocabulary::person}递出一本皮面日记，里面写满了{pos1}亲笔文字。“我知道的每一个故事，”{@bt_a2|::subscribed_books::vocabulary::person}说道，“家人讲给我的，旅途中听来的。现在，它们都属于你了。”"
"{@bt_a|::subscribed_books::vocabulary::person} brought out a carefully wrapped package. Inside was {::subscribed_books::world::food}, prepared with obvious care. \"My own recipe,\" {@bt_a2|::subscribed_books::vocabulary::person} said. \"I have been working on it for weeks.\"" = "{@bt_a|::subscribed_books::vocabulary::person}拿出一个仔细包好的包裹，里面是用心准备的{::subscribed_books::world::food}。“我自己的配方，”{@bt_a2|::subscribed_books::vocabulary::person}说道，“我琢磨了好几个星期。”"
"{@bt_a|::subscribed_books::vocabulary::person} unfolded a piece of parchment and read aloud -- a poem, written in {pos1} own hand, about {@bt_b|::subscribed_books::vocabulary::person}. It was clumsy in places and beautiful in others, and it was completely sincere." = "{@bt_a|::subscribed_books::vocabulary::person}展开一张羊皮纸，朗声读起一首{pos1}亲手写的诗，写的是{@bt_b|::subscribed_books::vocabulary::person}。有些地方笨拙，有些地方优美，却处处真诚。"
"The gift was small: a stone from the river near {@bt_a|::subscribed_books::vocabulary::person}'s birthplace. \"It is not worth anything,\" {@bt_a2|::subscribed_books::vocabulary::person} said. \"Except to me. And now, I hope, to you.\"" = "礼物很小：一颗来自{@bt_a|::subscribed_books::vocabulary::person}出生地附近河流的石头。“它不值什么，”{@bt_a2|::subscribed_books::vocabulary::person}说道，“除了对我而言。而现在，我希望，对你也是。”"
"{@bt_a|::subscribed_books::vocabulary::person} presented a map -- hand-drawn, detailed, annotated with notes in {pos1} careful handwriting. \"Every path I have walked,\" {@bt_a2|::subscribed_books::vocabulary::person} said. \"Every danger I have found. It should keep you alive.\"" = "{@bt_a|::subscribed_books::vocabulary::person}送来一幅手绘地图，细致详尽，边上满是{pos1}工整的注记。“我走过的每条路，”{@bt_a2|::subscribed_books::vocabulary::person}说道，“遇见的每种危险。它应该能让你活下来。”"
"{@bt_a|::subscribed_books::vocabulary::person} placed {::subscribed_books::world::item} in {@bt_b|::subscribed_books::vocabulary::person}'s hands. \"I have carried this for a long time,\" {@bt_a2|::subscribed_books::vocabulary::person} said. \"It is time it belonged to someone who will use it well.\"" = "{@bt_a|::subscribed_books::vocabulary::person}把{::subscribed_books::world::item}放进{@bt_b|::subscribed_books::vocabulary::person}手中。“我带着它很久了，”{@bt_a2|::subscribed_books::vocabulary::person}说道，“该让它属于能够好好使用它的人了。”"

[[rulesets]]
