[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} did not flinch from the blows. If anything, the pain sharpened {::subscribed_books::personality::pos1} focus. {::subscribed_books::personality::pro1} had made peace with suffering a long time ago." = "{@bt_a|::subscribed_books::vocabulary::person}没有因挨打而退缩。疼痛反而让注意力更集中。很久以前，自己就已与苦难和解。"
"{@bt_a|::subscribed_books::vocabulary::person} welcomed the hit almost gratefully, like it confirmed something {::subscribed_books::personality::pro1} already believed about {::subscribed_books::personality::ref1}." = "{@bt_a|::subscribed_books::vocabulary::person}几乎带着感激迎接那一击，仿佛它证实了自己早已相信的某种想法。"
"Each wound landed on {@bt_a|::subscribed_books::vocabulary::person} and, rather than weakening {::subscribed_books::personality::obj1}, seemed to steady {::subscribed_books::personality::obj2}." = "每一处伤落在{@bt_a|::subscribed_books::vocabulary::person}身上，都没有让其虚弱，反而似乎让其更安稳。"
"{@bt_a|::subscribed_books::vocabulary::person} stopped guarding {::subscribed_books::personality::pos1} weaker side on purpose, almost curious what it would feel like to take the hit there." = "{@bt_a|::subscribed_books::vocabulary::person}故意不再保护较弱的一侧，几乎有些好奇那里挨上一击是什么感觉。"
"The pain, when it came, felt less like a setback to {@bt_a|::subscribed_books::vocabulary::person} and more like proof {::subscribed_books::personality::pro1} was still standing." = "疼痛到来时，对{@bt_a|::subscribed_books::vocabulary::person}而言更像是自己仍然站着的证明，而不是挫折。"
"{@bt_a|::subscribed_books::vocabulary::person} absorbed the blow without a sound, and something in {::subscribed_books::personality::pos1} expression looked almost satisfied." = "{@bt_a|::subscribed_books::vocabulary::person}一声不响地承受了那一击，神情中甚至露出几分满足。"
"{@bt_a|::subscribed_books::vocabulary::person} pushed forward into the strike rather than away from it, like {::subscribed_books::personality::pro1} needed to feel the impact fully." = "{@bt_a|::subscribed_books::vocabulary::person}向前迎上攻击而不是躲开，仿佛需要完整地感受撞击。"
"Where others tried to avoid the hit, {@bt_a|::subscribed_books::vocabulary::person} leaned into it, and did not seem to regret the choice." = "别人设法躲避攻击，{@bt_a|::subscribed_books::vocabulary::person}却迎了上去，似乎并不后悔。"
"The bruises would come later. For now, {@bt_a|::subscribed_books::vocabulary::person} felt only a strange, quiet clarity." = "瘀伤之后才会出现。此刻，{@bt_a|::subscribed_books::vocabulary::person}只感到一种奇异而安静的清明。"
"{@bt_a|::subscribed_books::vocabulary::person} took the wound and, for a moment, looked almost at peace." = "{@bt_a|::subscribed_books::vocabulary::person}受了伤，有那么一瞬间，却几乎显得平和。"
"Something in {@bt_a|::subscribed_books::vocabulary::person} relaxed with every blow taken, as if the pain confirmed {::subscribed_books::personality::pro1} was exactly where {::subscribed_books::personality::pro2} was meant to be." = "每承受一击，{@bt_a|::subscribed_books::vocabulary::person}心里就有什么放松下来，仿佛疼痛证明了自己正处于应在的位置。"
"{@bt_a|::subscribed_books::vocabulary::person} did not raise a hand to protect {::subscribed_books::personality::ref1}. {::subscribed_books::personality::pro1} had stopped doing that a long time ago." = "{@bt_a|::subscribed_books::vocabulary::person}没有抬手保护自己。很久以前，就已经不再这样做了。"
"The fight hurt {@bt_a|::subscribed_books::vocabulary::person} badly, and {::subscribed_books::personality::pro1} kept fighting like the hurt was fuel." = "战斗让{@bt_a|::subscribed_books::vocabulary::person}伤得很重，而自己仍像以疼痛为燃料一般战斗。"
"{@bt_a|::subscribed_books::vocabulary::person} smiled faintly through a split lip, like the pain was an old, familiar friend." = "{@bt_a|::subscribed_books::vocabulary::person}嘴唇裂开，却淡淡一笑，仿佛疼痛是一位熟悉的老朋友。"
"Every blow {@bt_a|::subscribed_books::vocabulary::person} took landed like confirmation of something {::subscribed_books::personality::pro1} had long since stopped questioning." = "{@bt_a|::subscribed_books::vocabulary::person}承受的每一击，都像在证实某件早已不再质疑的事情。"
"{@bt_a|::subscribed_books::vocabulary::person} did not cry out. If anything, the silence felt like its own kind of relief." = "{@bt_a|::subscribed_books::vocabulary::person}没有喊叫。那份沉默反而像是另一种解脱。"
"The worse it got, the steadier {@bt_a|::subscribed_books::vocabulary::person} became, as though suffering was the only thing {::subscribed_books::personality::pro1} truly trusted." = "情况越糟，{@bt_a|::subscribed_books::vocabulary::person}越安稳，仿佛苦难是唯一真正值得信任的东西。"
"{@bt_a|::subscribed_books::vocabulary::person} took the hit meant to end the fight and, somehow, seemed almost disappointed when it didn't." = "{@bt_a|::subscribed_books::vocabulary::person}挨了本该结束战斗的一击，不知为何，当它没能做到时，自己反而几乎显得失望。"
"There was something in {@bt_a|::subscribed_books::vocabulary::person} that needed this, and the battlefield gave it freely." = "{@bt_a|::subscribed_books::vocabulary::person}心里有一部分需要这一切，而战场毫无保留地给了它。"
"{@bt_a|::subscribed_books::vocabulary::person} let the pain wash over {::subscribed_books::personality::obj1} instead of fighting it, the way {::subscribed_books::personality::pro1} always had." = "{@bt_a|::subscribed_books::vocabulary::person}任由疼痛淹没自己，不与之对抗，一向如此。"

[[rulesets]]
[rulesets.rules]
"{@bt_a|::subscribed_books::vocabulary::person} did not avoid the confrontation. {::subscribed_books::personality::pro1} walked into it. Some part of {::subscribed_books::personality::pro2} needed it." = "{@bt_a|::subscribed_books::vocabulary::person}没有避开对峙，而是走了进去。内心某一部分需要它。"
