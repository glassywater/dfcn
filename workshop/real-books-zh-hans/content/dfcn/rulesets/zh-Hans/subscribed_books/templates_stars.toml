# templates.lua 基线 Choreography/StarChart/StarCatalogue：全部 15 视角、119 展示模板。
# 世界身份槽与 adjectives/metaphor 均使用已翻译的 scoped 词池。
base = "subscribed_books::templates_stars"

[[rulesets]]
[rulesets.rules]
"A WAR DANCE of {@bt_entity|::subscribed_books::vocabulary::entity}. Choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} at {@bt_site|::subscribed_books::vocabulary::place}.\n\nThe dancers take their positions. The drums begin." = "{@bt_entity|::subscribed_books::vocabulary::entity}的战舞。由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）于{@bt_site|::subscribed_books::vocabulary::place}编排。\n\n舞者各就其位，鼓声开始。"
"A WAR DANCE of {@bt_entity|::subscribed_books::vocabulary::entity}. Choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} at {@bt_site|::subscribed_books::vocabulary::place}. The dancers take their positions. The drums begin." = "{@bt_entity|::subscribed_books::vocabulary::entity}的战舞。由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）于{@bt_site|::subscribed_books::vocabulary::place}编排。\n\n舞者各就其位，鼓声开始。"
"A WAR DANCE of {@bt_entity|::subscribed_books::vocabulary::entity}. Choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} at {@bt_site|::subscribed_books::vocabulary::place}." = "{@bt_entity|::subscribed_books::vocabulary::entity}的战舞。由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）于{@bt_site|::subscribed_books::vocabulary::place}编排。"
"The dancers take their positions. The drums begin." = "舞者各就其位，鼓声开始。"
"This martial choreography, devised for the warriors of {@bt_entity|::subscribed_books::vocabulary::entity}, is performed before battle. Every movement is a {::subscribed_books::adj} weapon." = "这套为{@bt_entity|::subscribed_books::vocabulary::entity}战士设计的武舞，在战前表演。每个动作都是{::subscribed_books::adj}武器。"
"The war dance of {@bt_entity|::subscribed_books::vocabulary::entity}, choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, is not entertainment. It is preparation. Each step, each strike, each {::subscribed_books::adj} turn of the body is designed to harden the will and sharpen the spirit. The dance begins in stillness and ends in fury." = "{@bt_entity|::subscribed_books::vocabulary::entity}的战舞由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）编排。它不是娱乐，而是准备。每一步、每一击、每一次{::subscribed_books::adj}身体转动，都旨在锻硬意志、磨利精神。舞从静止开始，在狂怒中结束。"
"Next movement, evoking the battles of {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "下一个动作，唤起{@bt_year|::subscribed_books::vocabulary::birth_year}年的战斗："
"A violent sequence: the fall of {@bt_hero|::subscribed_books::vocabulary::person} in {@bt_year|::subscribed_books::vocabulary::birth_year} is reenacted. The dancers strike the ground. {@bt_cause|::subscribed_books::vocabulary::cause} is given form in {::subscribed_books::adj} motion." = "一段激烈舞序：重演{@bt_hero|::subscribed_books::vocabulary::person}在{@bt_year|::subscribed_books::vocabulary::birth_year}年的倒下。舞者击打地面，以{::subscribed_books::adj}动作赋予{@bt_cause|::subscribed_books::vocabulary::cause}形体。"
"A conquering advance: the founding of {@bt_evsite|::subscribed_books::vocabulary::place} in {@bt_year|::subscribed_books::vocabulary::birth_year} is celebrated with stamping feet and raised fists." = "征服般的推进：舞者跺脚、举拳，庆祝{@bt_evsite|::subscribed_books::vocabulary::place}于{@bt_year|::subscribed_books::vocabulary::birth_year}年的建立。"
"A sequence of {::subscribed_books::adj} intensity reflects the conflicts of {@bt_year|::subscribed_books::vocabulary::birth_year}." = "一段{::subscribed_books::adj}而强烈的舞序，反映{@bt_year|::subscribed_books::vocabulary::birth_year}年的冲突。"
"The dancers hold. Sweat. Breath. Resume." = "舞者定住。汗。呼吸。继续。"
"The war dance ends with a unified shout. Silence. The warriors are ready.\n\nChoreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} for {@bt_entity|::subscribed_books::vocabulary::entity}." = "战舞以齐声呐喊结束。寂静。战士已经准备好。\n\n由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）为{@bt_entity|::subscribed_books::vocabulary::entity}编排。"
"The war dance ends with a unified shout. Silence. The warriors are ready. Choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} for {@bt_entity|::subscribed_books::vocabulary::entity}." = "战舞以齐声呐喊结束。寂静。战士已经准备好。\n\n由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）为{@bt_entity|::subscribed_books::vocabulary::entity}编排。"
"The war dance ends with a unified shout. Silence. The warriors are ready." = "战舞以齐声呐喊结束。寂静。战士已经准备好。"
"Choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} for {@bt_entity|::subscribed_books::vocabulary::entity}." = "由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）为{@bt_entity|::subscribed_books::vocabulary::entity}编排。"
"A RITUAL DANCE. Sacred to {@bt_entity|::subscribed_books::vocabulary::entity}. Choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}.\n\nThe ceremony begins." = "祭仪之舞。对{@bt_entity|::subscribed_books::vocabulary::entity}而言神圣。编舞：{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）。\n\n仪式开始。"
"A RITUAL DANCE. Sacred to {@bt_entity|::subscribed_books::vocabulary::entity}. Choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}. The ceremony begins." = "祭仪之舞。对{@bt_entity|::subscribed_books::vocabulary::entity}而言神圣。编舞：{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）。\n\n仪式开始。"
"A RITUAL DANCE. Sacred to {@bt_entity|::subscribed_books::vocabulary::entity}. Choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}." = "祭仪之舞。对{@bt_entity|::subscribed_books::vocabulary::entity}而言神圣。编舞：{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）。"
"The ceremony begins." = "仪式开始。"
"This dance is not performed for audiences. It is performed for the powers that watch over {@bt_entity|::subscribed_books::vocabulary::entity}. Each movement is a {::subscribed_books::adj} prayer." = "这支舞不是为观众表演，而是献给守护{@bt_entity|::subscribed_books::vocabulary::entity}的力量。每个动作都是{::subscribed_books::adj}祈祷。"
"The ritual dance of {@bt_entity|::subscribed_books::vocabulary::entity}, devised by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} at {@bt_site|::subscribed_books::vocabulary::place}, is among the most {::subscribed_books::adj} sacred expressions of the civilization's spiritual life. The dancers move in patterns that mirror the cosmos, each gesture an invocation, each step a covenant with the unseen." = "{@bt_entity|::subscribed_books::vocabulary::entity}的祭仪之舞，由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）于{@bt_site|::subscribed_books::vocabulary::place}设计，是该文明精神生活中最为{::subscribed_books::adj}神圣表达之一。舞者依照映照宇宙的图案移动，每个手势是祈请，每一步是与无形者的契约。"
"The next phase of the ritual, drawing upon the events of {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "祭仪的下一阶段，取材于{@bt_year|::subscribed_books::vocabulary::birth_year}年的事件："
"A solemn passage: the dancers lower themselves to the ground, honoring {@bt_hero|::subscribed_books::vocabulary::person}, taken by {@bt_cause|::subscribed_books::vocabulary::cause} in {@bt_year|::subscribed_books::vocabulary::birth_year}. The {::subscribed_books::adj} earth receives the offering." = "庄严的一段：舞者降到地面，纪念{@bt_year|::subscribed_books::vocabulary::birth_year}年被{@bt_cause|::subscribed_books::vocabulary::cause}带走的{@bt_hero|::subscribed_books::vocabulary::person}。{::subscribed_books::adj}大地接纳供奉。"
"An exalted passage: the dancers raise their arms toward {@bt_artifact|::subscribed_books::vocabulary::artifact}, created in {@bt_year|::subscribed_books::vocabulary::birth_year}. The gesture is one of reverence." = "崇敬的一段：舞者向{@bt_year|::subscribed_books::vocabulary::birth_year}年创造的{@bt_artifact|::subscribed_books::vocabulary::artifact}高举双臂。这个手势表达敬意。"
"A processional: the dancers advance in formation, reenacting the founding of {@bt_evsite|::subscribed_books::vocabulary::place} in {@bt_year|::subscribed_books::vocabulary::birth_year}." = "行进舞段：舞者结阵推进，重演{@bt_evsite|::subscribed_books::vocabulary::place}于{@bt_year|::subscribed_books::vocabulary::birth_year}年的建立。"
"The dancers trace a {::subscribed_books::adj} circle, embodying the passage of {@bt_year|::subscribed_books::vocabulary::birth_year} into eternity." = "舞者画出{::subscribed_books::adj}圆圈，体现{@bt_year|::subscribed_books::vocabulary::birth_year}年走向永恒。"
"The ritual pauses. The silence is sacred." = "祭仪暂停。沉默神圣。"
"The ritual dance concludes. The dancers bow. The powers have been honored.\n\nChoreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} for {@bt_entity|::subscribed_books::vocabulary::entity}." = "祭仪之舞结束。舞者鞠躬，力量已受敬奉。\n\n由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）为{@bt_entity|::subscribed_books::vocabulary::entity}编排。"
"The ritual dance concludes. The dancers bow. The powers have been honored. Choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} for {@bt_entity|::subscribed_books::vocabulary::entity}." = "祭仪之舞结束。舞者鞠躬，力量已受敬奉。\n\n由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）为{@bt_entity|::subscribed_books::vocabulary::entity}编排。"
"The ritual dance concludes. The dancers bow. The powers have been honored." = "祭仪之舞结束。舞者鞠躬，力量已受敬奉。"
"The final gesture is a slow lowering of the hands, palms down, as if pressing the {::subscribed_books::adj} energy of the dance into the earth for safekeeping. The ritual is complete. The dancers are transformed. {::subscribed_books::templates_legacy::metaphor}\n\nChoreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}." = "最后一个手势是缓慢放低双手，掌心朝下，仿佛将舞蹈的{::subscribed_books::adj}能量压入大地保管。祭仪完成，舞者转变。{::subscribed_books::templates_legacy::metaphor}\n\n由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）编排。"
"The final gesture is a slow lowering of the hands, palms down, as if pressing the {::subscribed_books::adj} energy of the dance into the earth for safekeeping. The ritual is complete. The dancers are transformed. {::subscribed_books::templates_legacy::metaphor} Choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}." = "最后一个手势是缓慢放低双手，掌心朝下，仿佛将舞蹈的{::subscribed_books::adj}能量压入大地保管。祭仪完成，舞者转变。{::subscribed_books::templates_legacy::metaphor}\n\n由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）编排。"
"The final gesture is a slow lowering of the hands, palms down, as if pressing the {::subscribed_books::adj} energy of the dance into the earth for safekeeping. The ritual is complete. The dancers are transformed. {::subscribed_books::templates_legacy::metaphor}" = "最后一个手势是缓慢放低双手，掌心朝下，仿佛将舞蹈的{::subscribed_books::adj}能量压入大地保管。祭仪完成，舞者转变。{::subscribed_books::templates_legacy::metaphor}"
"Choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}." = "由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）编排。"
"The final gesture is a slow lowering of the hands, palms down, as if pressing the {::subscribed_books::adj} energy of the dance into the earth for safekeeping. The ritual is complete. The dancers are transformed. Choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}." = "最后一个手势是缓慢放低双手，掌心朝下，仿佛将舞蹈的{::subscribed_books::adj}能量压入大地保管。祭仪完成，舞者转变。\n\n由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）编排。"
"The final gesture is a slow lowering of the hands, palms down, as if pressing the {::subscribed_books::adj} energy of the dance into the earth for safekeeping. The ritual is complete. The dancers are transformed." = "最后一个手势是缓慢放低双手，掌心朝下，仿佛将舞蹈的{::subscribed_books::adj}能量压入大地保管。祭仪完成，舞者转变。"
"A DANCE OF CELEBRATION! Choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} for the festivals of {@bt_entity|::subscribed_books::vocabulary::entity}.\n\nThe music starts. The feet follow." = "庆祝之舞！由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）为{@bt_entity|::subscribed_books::vocabulary::entity}的节庆编排。\n\n音乐开始，双脚跟随。"
"A DANCE OF CELEBRATION! Choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} for the festivals of {@bt_entity|::subscribed_books::vocabulary::entity}. The music starts. The feet follow." = "庆祝之舞！由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）为{@bt_entity|::subscribed_books::vocabulary::entity}的节庆编排。\n\n音乐开始，双脚跟随。"
"A DANCE OF CELEBRATION! Choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} for the festivals of {@bt_entity|::subscribed_books::vocabulary::entity}." = "庆祝之舞！由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）为{@bt_entity|::subscribed_books::vocabulary::entity}的节庆编排。"
"The music starts. The feet follow." = "音乐开始，双脚跟随。"
"Joy! This dance is pure {::subscribed_books::adj} celebration, created for the happy occasions of {@bt_site|::subscribed_books::vocabulary::place}." = "欢喜！这支舞是纯粹{::subscribed_books::adj}庆祝，为{@bt_site|::subscribed_books::vocabulary::place}的喜庆场合创作。"
"Next sequence, celebrating the events of {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "下一舞序，庆祝{@bt_year|::subscribed_books::vocabulary::birth_year}年的事件："
"A joyful sequence celebrates {@bt_artifact|::subscribed_books::vocabulary::artifact}, created in {@bt_year|::subscribed_books::vocabulary::birth_year}. The dancers whirl with {::subscribed_books::adj} abandon." = "快乐的舞序庆祝{@bt_year|::subscribed_books::vocabulary::birth_year}年创造的{@bt_artifact|::subscribed_books::vocabulary::artifact}。舞者以{::subscribed_books::adj}放纵旋转。"
"Leaping, stamping joy: the founding of {@bt_evsite|::subscribed_books::vocabulary::place} in {@bt_year|::subscribed_books::vocabulary::birth_year} is danced with glee." = "跳跃、跺脚的喜悦：舞者欢欣起舞，庆祝{@bt_evsite|::subscribed_books::vocabulary::place}于{@bt_year|::subscribed_books::vocabulary::birth_year}年的建立。"
"A proud sequence: {@bt_hero|::subscribed_books::vocabulary::person} is honored as {@bt_role|::subscribed_books::vocabulary::role} in {@bt_year|::subscribed_books::vocabulary::birth_year}. The dancers form a crown." = "骄傲的舞序：纪念{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年担任{@bt_role|::subscribed_books::vocabulary::role}。舞者组成王冠。"
"The dancers celebrate the year {@bt_year|::subscribed_books::vocabulary::birth_year} with {::subscribed_books::adj} energy and unfailing rhythm." = "舞者以{::subscribed_books::adj}活力与始终不变的节奏，庆祝{@bt_year|::subscribed_books::vocabulary::birth_year}年。"
"Laughter. Applause. The dance goes on." = "笑声。掌声。舞继续。"
"The celebration dance ends in a burst of movement and a shower of applause.\n\nChoreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} for {@bt_entity|::subscribed_books::vocabulary::entity}." = "庆祝之舞以迸发的动作与如雨掌声结束。\n\n由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）为{@bt_entity|::subscribed_books::vocabulary::entity}编排。"
"The celebration dance ends in a burst of movement and a shower of applause. Choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} for {@bt_entity|::subscribed_books::vocabulary::entity}." = "庆祝之舞以迸发的动作与如雨掌声结束。\n\n由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）为{@bt_entity|::subscribed_books::vocabulary::entity}编排。"
"The celebration dance ends in a burst of movement and a shower of applause." = "庆祝之舞以迸发的动作与如雨掌声结束。"
"A DANCE OF MOURNING. For those who have been lost. Choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}.\n\nThe dancers enter slowly." = "哀悼之舞。献给失去的人。编舞：{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）。\n\n舞者缓缓入场。"
"A DANCE OF MOURNING. For those who have been lost. Choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}. The dancers enter slowly." = "哀悼之舞。献给失去的人。编舞：{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）。\n\n舞者缓缓入场。"
"A DANCE OF MOURNING. For those who have been lost. Choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}." = "哀悼之舞。献给失去的人。编舞：{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）。"
"The dancers enter slowly." = "舞者缓缓入场。"
"This is a dance of grief. Every movement carries the {::subscribed_books::adj} weight of absence." = "这是一支悲伤之舞。每个动作都承载缺席的{::subscribed_books::adj}重量。"
"The next passage mourns the losses of {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "下一舞段，哀悼{@bt_year|::subscribed_books::vocabulary::birth_year}年的失去："
"The central passage: the dancers enact the loss of {@bt_hero|::subscribed_books::vocabulary::person} to {@bt_cause|::subscribed_books::vocabulary::cause} in {@bt_year|::subscribed_books::vocabulary::birth_year}. One dancer sinks to the ground. The others reach but cannot hold." = "核心舞段：舞者表现{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年因{@bt_cause|::subscribed_books::vocabulary::cause}逝去。一位舞者沉向地面，其他人伸手，却无法抓住。"
"A passage of {::subscribed_books::adj} sorrow for the year {@bt_year|::subscribed_books::vocabulary::birth_year}. The dancers move like shadows." = "献给{@bt_year|::subscribed_books::vocabulary::birth_year}年、一段{::subscribed_books::adj}悲哀的舞段。舞者如影子般移动。"
"The dance pauses. No one speaks." = "舞暂停。无人说话。"
"The mourning dance ends in stillness. The dancers stand with bowed heads. The dead are honored.\n\nChoreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} for {@bt_entity|::subscribed_books::vocabulary::entity}." = "哀悼之舞在静止中结束。舞者垂首站立，逝者受到敬重。\n\n由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）为{@bt_entity|::subscribed_books::vocabulary::entity}编排。"
"The mourning dance ends in stillness. The dancers stand with bowed heads. The dead are honored. Choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} for {@bt_entity|::subscribed_books::vocabulary::entity}." = "哀悼之舞在静止中结束。舞者垂首站立，逝者受到敬重。\n\n由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）为{@bt_entity|::subscribed_books::vocabulary::entity}编排。"
"The mourning dance ends in stillness. The dancers stand with bowed heads. The dead are honored." = "哀悼之舞在静止中结束。舞者垂首站立，逝者受到敬重。"
"The final position is one of {::subscribed_books::adj} acceptance: hands open, faces lifted. The mourning dance does not deny grief. It gives it a body, a shape, a {::subscribed_books::templates_stars::ref_repeat_1} form that the living can bear. {::subscribed_books::templates_legacy::metaphor}\n\nChoreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}." = "最后的姿态是{::subscribed_books::adj}接受：双手张开，面孔抬起。哀悼之舞不否认悲伤，而是赋予它身体、形状，以及活人能够承受的{::subscribed_books::templates_stars::ref_repeat_1}形式。{::subscribed_books::templates_legacy::metaphor}\n\n由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）编排。"
"The final position is one of {::subscribed_books::adj} acceptance: hands open, faces lifted. The mourning dance does not deny grief. It gives it a body, a shape, a {::subscribed_books::templates_stars::ref_repeat_1} form that the living can bear. {::subscribed_books::templates_legacy::metaphor} Choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}." = "最后的姿态是{::subscribed_books::adj}接受：双手张开，面孔抬起。哀悼之舞不否认悲伤，而是赋予它身体、形状，以及活人能够承受的{::subscribed_books::templates_stars::ref_repeat_1}形式。{::subscribed_books::templates_legacy::metaphor}\n\n由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）编排。"
"The final position is one of {::subscribed_books::adj} acceptance: hands open, faces lifted. The mourning dance does not deny grief. It gives it a body, a shape, a {::subscribed_books::templates_stars::ref_repeat_1} form that the living can bear. {::subscribed_books::templates_legacy::metaphor}" = "最后的姿态是{::subscribed_books::adj}接受：双手张开，面孔抬起。哀悼之舞不否认悲伤，而是赋予它身体、形状，以及活人能够承受的{::subscribed_books::templates_stars::ref_repeat_1}形式。{::subscribed_books::templates_legacy::metaphor}"
"The final position is one of {::subscribed_books::adj} acceptance: hands open, faces lifted. The mourning dance does not deny grief. It gives it a body, a shape, a {::subscribed_books::templates_stars::ref_repeat_1} form that the living can bear. Choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}." = "最后的姿态是{::subscribed_books::adj}接受：双手张开，面孔抬起。哀悼之舞不否认悲伤，而是赋予它身体、形状，以及活人能够承受的{::subscribed_books::templates_stars::ref_repeat_1}形式。\n\n由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）编排。"
"The final position is one of {::subscribed_books::adj} acceptance: hands open, faces lifted. The mourning dance does not deny grief. It gives it a body, a shape, a {::subscribed_books::templates_stars::ref_repeat_1} form that the living can bear." = "最后的姿态是{::subscribed_books::adj}接受：双手张开，面孔抬起。哀悼之舞不否认悲伤，而是赋予它身体、形状，以及活人能够承受的{::subscribed_books::templates_stars::ref_repeat_1}形式。"
"A COURTSHIP DANCE. Choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} for the lovers of {@bt_entity|::subscribed_books::vocabulary::entity}.\n\nTwo dancers face each other. The music begins." = "求爱之舞。由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）为{@bt_entity|::subscribed_books::vocabulary::entity}的恋人们编排。\n\n两位舞者面向彼此，音乐开始。"
"A COURTSHIP DANCE. Choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} for the lovers of {@bt_entity|::subscribed_books::vocabulary::entity}. Two dancers face each other. The music begins." = "求爱之舞。由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）为{@bt_entity|::subscribed_books::vocabulary::entity}的恋人们编排。\n\n两位舞者面向彼此，音乐开始。"
"A COURTSHIP DANCE. Choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} for the lovers of {@bt_entity|::subscribed_books::vocabulary::entity}." = "求爱之舞。由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）为{@bt_entity|::subscribed_books::vocabulary::entity}的恋人们编排。"
"Two dancers face each other. The music begins." = "两位舞者面向彼此，音乐开始。"
"This dance is about desire and hesitation, pursuit and retreat. The {::subscribed_books::adj} language of courtship, spoken in movement." = "这支舞表现欲望与犹豫、追逐与退却。以动作说出的{::subscribed_books::adj}求爱语言。"
"The next figure of the dance, evoking {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "下一舞姿，唤起{@bt_year|::subscribed_books::vocabulary::birth_year}年："
"Even courtship dances carry loss. A passage mourns {@bt_hero|::subscribed_books::vocabulary::person}, taken in {@bt_year|::subscribed_books::vocabulary::birth_year}. One dancer reaches for a partner who is no longer there." = "即便求爱之舞也承载失去。一段舞哀悼{@bt_year|::subscribed_books::vocabulary::birth_year}年逝去的{@bt_hero|::subscribed_books::vocabulary::person}。一位舞者向已不在的伴侣伸手。"
"A playful sequence: one dancer presents {@bt_artifact|::subscribed_books::vocabulary::artifact} as a gift. Created in {@bt_year|::subscribed_books::vocabulary::birth_year}, it becomes a token of devotion." = "嬉戏的舞序：一位舞者将{@bt_artifact|::subscribed_books::vocabulary::artifact}作为礼物呈上。这件{@bt_year|::subscribed_books::vocabulary::birth_year}年创造的东西，成了忠贞的信物。"
"The dancers circle each other in {@bt_year|::subscribed_books::vocabulary::birth_year}. Closer. Farther. Closer. The {::subscribed_books::adj} tension builds." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年，舞者围绕彼此。更近。更远。更近。{::subscribed_books::adj}张力积聚。"
"The dancers pause. Eyes meet. The music softens." = "舞者暂停，目光相遇，音乐柔和下来。"
"The courtship dance ends with the two dancers hand in hand. The beginning of something.\n\nChoreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} for {@bt_entity|::subscribed_books::vocabulary::entity}." = "求爱之舞以两位舞者手牵手结束。某事的开端。\n\n由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）为{@bt_entity|::subscribed_books::vocabulary::entity}编排。"
"The courtship dance ends with the two dancers hand in hand. The beginning of something. Choreographed by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} for {@bt_entity|::subscribed_books::vocabulary::entity}." = "求爱之舞以两位舞者手牵手结束。某事的开端。\n\n由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）为{@bt_entity|::subscribed_books::vocabulary::entity}编排。"
"The courtship dance ends with the two dancers hand in hand. The beginning of something." = "求爱之舞以两位舞者手牵手结束。某事的开端。"
"A STAR CHART for navigators. Compiled by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} at {@bt_site|::subscribed_books::vocabulary::place}. Use these stars to find your way." = "供导航者使用的星图。由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）于{@bt_site|::subscribed_books::vocabulary::place}编纂。用这些星星寻找方向。"
"This chart maps the night sky as seen from {@bt_site|::subscribed_books::vocabulary::place}. For practical navigation by the people of {@bt_entity|::subscribed_books::vocabulary::entity}." = "本图绘出从{@bt_site|::subscribed_books::vocabulary::place}所见的夜空，供{@bt_entity|::subscribed_books::vocabulary::entity}人民实际导航使用。"
"Celestial observations, season of {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "天体观测，{@bt_year|::subscribed_books::vocabulary::birth_year}年的时节："
"The stars above {@bt_site|::subscribed_books::vocabulary::place} in {@bt_year|::subscribed_books::vocabulary::birth_year} were mapped and recorded. The {::subscribed_books::adj} constellations guided travelers and sailors alike." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年，{@bt_site|::subscribed_books::vocabulary::place}上空的星辰被绘图、记录。{::subscribed_books::adj}星座为旅人与水手共同指路。"
"The passing of {@bt_hero|::subscribed_books::vocabulary::person} in {@bt_year|::subscribed_books::vocabulary::birth_year} is noted: even navigators are mortal. {::subscribed_books::personality::pos1} charts endure." = "记下{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年的离世：导航者也终有一死。{::subscribed_books::personality::pos1}星图长存。"
"Verify these positions against direct observation." = "请用直接观测核对这些位置。"
"This star chart is a practical tool. Use it wisely, and the sky will never lead you astray. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "本星图是实用工具。明智使用，天空就永不会将你引入歧途。——{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）"
"The stars are not merely lights. They are the {::subscribed_books::adj} stories of the gods, written in fire across the vault of heaven. This chart reads them." = "星星不只是光点，而是以火焰写满穹顶的众神{::subscribed_books::adj}故事。本图解读它们。"
"A mythological star chart of {@bt_entity|::subscribed_books::vocabulary::entity}. Each constellation is a chapter in the divine narrative." = "{@bt_entity|::subscribed_books::vocabulary::entity}的神话星图。每个星座，都是神圣叙事的一章。"
"The people of {@bt_entity|::subscribed_books::vocabulary::entity} have always looked upward for meaning. The stars above {@bt_site|::subscribed_books::vocabulary::place} are not random. They are a {::subscribed_books::adj} text, written by powers beyond mortal comprehension. This chart, compiled by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, is an attempt to read that text." = "{@bt_entity|::subscribed_books::vocabulary::entity}的人民向来仰望天空寻找意义。{@bt_site|::subscribed_books::vocabulary::place}上方的星星并不随机，而是由超越凡人理解的力量写成的{::subscribed_books::adj}文本。本图由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）编纂，试图读懂这段文本。"
"The stars as they told their stories in {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "星辰在{@bt_year|::subscribed_books::vocabulary::birth_year}年讲述的故事："
"A {::subscribed_books::adj} constellation appeared above {@bt_site|::subscribed_books::vocabulary::place} in {@bt_year|::subscribed_books::vocabulary::birth_year}, the year {@bt_hero|::subscribed_books::vocabulary::person} died. The stars marked {::subscribed_books::personality::pos1} passing with {@bt_cause|::subscribed_books::vocabulary::cause}." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年，{@bt_hero|::subscribed_books::vocabulary::person}去世的那一年，一个{::subscribed_books::adj}星座出现在{@bt_site|::subscribed_books::vocabulary::place}上空。星辰以{@bt_cause|::subscribed_books::vocabulary::cause}标记{::subscribed_books::personality::pos1}离去。"
"The creation of {@bt_artifact|::subscribed_books::vocabulary::artifact} in {@bt_year|::subscribed_books::vocabulary::birth_year} coincided with a celestial alignment. The stars approved." = "{@bt_artifact|::subscribed_books::vocabulary::artifact}于{@bt_year|::subscribed_books::vocabulary::birth_year}年的创造，恰逢天体排列。星辰表示赞许。"
"In {@bt_year|::subscribed_books::vocabulary::birth_year}, the constellations above {@bt_site|::subscribed_books::vocabulary::place} told their {::subscribed_books::adj} eternal stories once more." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年，{@bt_site|::subscribed_books::vocabulary::place}上空的星座再次讲述它们{::subscribed_books::adj}永恒故事。"
"The stars speak. We listen, imperfectly." = "星辰开口，我们不完美地倾听。"
"This mythological star chart is a map not of the sky, but of the soul. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "这幅神话星图绘的不是天空，而是灵魂。——{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）"
"The {::subscribed_books::adj} mythology written in the stars above {@bt_entity|::subscribed_books::vocabulary::entity} is older than civilization itself. This chart preserves one generation's reading. The next will read differently. Both will be true. {::subscribed_books::templates_legacy::metaphor} -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "写在{@bt_entity|::subscribed_books::vocabulary::entity}上空星辰里的{::subscribed_books::adj}神话，比文明本身更古老。本图保存一代人的解读，下一代会读得不同。两者都真实。{::subscribed_books::templates_legacy::metaphor}——{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）"
"The {::subscribed_books::adj} mythology written in the stars above {@bt_entity|::subscribed_books::vocabulary::entity} is older than civilization itself. This chart preserves one generation's reading. The next will read differently. Both will be true. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "写在{@bt_entity|::subscribed_books::vocabulary::entity}上空星辰里的{::subscribed_books::adj}神话，比文明本身更古老。本图保存一代人的解读，下一代会读得不同。两者都真实。——{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）"
"A SEASONAL STAR CALENDAR for {@bt_entity|::subscribed_books::vocabulary::entity}. When to plant, when to harvest, when to prepare: the stars will tell you." = "{@bt_entity|::subscribed_books::vocabulary::entity}的季节星历。何时种植、何时收获、何时准备，星辰都会告诉你。"
"This chart correlates celestial positions with the practical rhythms of life at {@bt_site|::subscribed_books::vocabulary::place}." = "本图将天体位置与{@bt_site|::subscribed_books::vocabulary::place}生活的实际节奏对应起来。"
"Seasonal observations for the period of {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "{@bt_year|::subscribed_books::vocabulary::birth_year}年期间的季节观测："
"The founding of {@bt_evsite|::subscribed_books::vocabulary::place} in {@bt_year|::subscribed_books::vocabulary::birth_year} established a new observation point for seasonal reckoning." = "{@bt_evsite|::subscribed_books::vocabulary::place}于{@bt_year|::subscribed_books::vocabulary::birth_year}年的建立，为季节推算提供了新的观测点。"
"In {@bt_year|::subscribed_books::vocabulary::birth_year}, the seasonal stars appeared on schedule. The {::subscribed_books::adj} rhythms of {@bt_site|::subscribed_books::vocabulary::place} continued." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年，季节星辰如期出现。{@bt_site|::subscribed_books::vocabulary::place}的{::subscribed_books::adj}节奏继续。"
"The calendar turns. The stars are patient." = "历法转动。星辰耐心。"
"Follow the stars. They have kept the calendar longer than any of us. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "跟随星辰。它们守着历法，比我们任何人都更久。——{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）"
"The stars foretell. This chart records their {::subscribed_books::adj} warnings and promises as seen from {@bt_site|::subscribed_books::vocabulary::place}." = "星辰预言。本图记录从{@bt_site|::subscribed_books::vocabulary::place}看到的{::subscribed_books::adj}警告与承诺。"
"A PROPHETIC STAR CHART. What the heavens have revealed to {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, astronomer of {@bt_entity|::subscribed_books::vocabulary::entity}." = "预言星图。天空向{@bt_entity|::subscribed_books::vocabulary::entity}的天文学家{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）揭示的一切。"
"I, {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, have spent long nights at {@bt_site|::subscribed_books::vocabulary::place} reading the {::subscribed_books::adj} language of the stars. What they have shown me is not always comforting. This prophetic chart records what the heavens have written, for the benefit or warning of {@bt_entity|::subscribed_books::vocabulary::entity}." = "我，{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}），在{@bt_site|::subscribed_books::vocabulary::place}度过漫长夜晚，解读星辰的{::subscribed_books::adj}语言。它们展示给我的，并不总让人宽慰。本预言星图记录天空写下的内容，为{@bt_entity|::subscribed_books::vocabulary::entity}提供助益或警告。"
"The stars' pronouncement for the era of {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "星辰对{@bt_year|::subscribed_books::vocabulary::birth_year}年时代的宣告："
"The stars foretold the death of {@bt_hero|::subscribed_books::vocabulary::person} in {@bt_year|::subscribed_books::vocabulary::birth_year}. {@bt_cause|::subscribed_books::vocabulary::cause} was written in the heavens. Few read the {::subscribed_books::adj} warning." = "星辰预言了{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年的死亡。{@bt_cause|::subscribed_books::vocabulary::cause}写在天上。少有人读懂{::subscribed_books::adj}警告。"
"In {@bt_year|::subscribed_books::vocabulary::birth_year}, the celestial signs spoke of change. The stars above {@bt_site|::subscribed_books::vocabulary::place} shifted into {::subscribed_books::adj} new configurations." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年，天象诉说变化。{@bt_site|::subscribed_books::vocabulary::place}上空的星辰移成{::subscribed_books::adj}新排列。"
"The prophecy continues. The stars do not rest." = "预言继续。星辰不休息。"
"These prophecies are recorded, not endorsed. The stars show what may be, not what must be. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "这些预言被记录，但并非获认可。星辰展示可能发生的事，而非必须发生的事。——{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）"
"ASTRONOMICAL OBSERVATION LOG. Observer: {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}. Location: {@bt_site|::subscribed_books::vocabulary::place}. Conditions: noted per entry." = "天文观测日志。观测者：{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）。地点：{@bt_site|::subscribed_books::vocabulary::place}。条件：每条记录分别注明。"
"A scientific record of celestial observations. Compiled for the archives of {@bt_entity|::subscribed_books::vocabulary::entity}." = "天体观测的科学记录。为{@bt_entity|::subscribed_books::vocabulary::entity}档案编纂。"
"Observations for the period of {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "{@bt_year|::subscribed_books::vocabulary::birth_year}年期间的观测："
"Position and brightness data recorded for {@bt_year|::subscribed_books::vocabulary::birth_year}. Conditions at {@bt_site|::subscribed_books::vocabulary::place}: {::subscribed_books::adj}. No anomalies noted." = "记录{@bt_year|::subscribed_books::vocabulary::birth_year}年的位置与亮度数据。{@bt_site|::subscribed_books::vocabulary::place}条件：{::subscribed_books::adj}。未发现异常。"
"Note: observations interrupted in {@bt_year|::subscribed_books::vocabulary::birth_year} due to the death of {@bt_hero|::subscribed_books::vocabulary::person} ({@bt_cause|::subscribed_books::vocabulary::cause}). Data for this period is incomplete." = "注：{@bt_year|::subscribed_books::vocabulary::birth_year}年，观测因{@bt_hero|::subscribed_books::vocabulary::person}死亡（{@bt_cause|::subscribed_books::vocabulary::cause}）而中断。此时段数据不完整。"
"Observation session concluded." = "本次观测结束。"
"End of log. Data preserved for future reference. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, astronomer of {@bt_entity|::subscribed_books::vocabulary::entity}" = "日志结束。数据保存，以备日后参考。——{@bt_entity|::subscribed_books::vocabulary::entity}的天文学家{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）"
"A SYSTEMATIC CATALOGUE of celestial bodies as observed from {@bt_site|::subscribed_books::vocabulary::place}. Compiled by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} for {@bt_entity|::subscribed_books::vocabulary::entity}." = "从{@bt_site|::subscribed_books::vocabulary::place}所见天体的系统星表。由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）为{@bt_entity|::subscribed_books::vocabulary::entity}编纂。"
"This catalogue lists and categorizes the stars visible from {@bt_site|::subscribed_books::vocabulary::place}. Organized by position and magnitude." = "本星表列出并分类从{@bt_site|::subscribed_books::vocabulary::place}可见的星辰，按位置与星等组织。"
"Catalogue entries for the observation period of {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "{@bt_year|::subscribed_books::vocabulary::birth_year}年观测时段的星表条目："
"Celestial objects catalogued during {@bt_year|::subscribed_books::vocabulary::birth_year}. Total entries for this period: {::subscribed_books::adj} and numerous." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年编目的天体。本时段条目总数：{::subscribed_books::adj}，且众多。"
"The cataloguing work of {@bt_hero|::subscribed_books::vocabulary::person} was interrupted by {::subscribed_books::personality::pos1} death in {@bt_year|::subscribed_books::vocabulary::birth_year}. Subsequent entries compiled by others." = "{@bt_hero|::subscribed_books::vocabulary::person}的编目工作因{::subscribed_books::personality::pos1}于{@bt_year|::subscribed_books::vocabulary::birth_year}年的死亡而中断。后续条目由他人编纂。"
"Entries continue in the next section." = "条目在下一节继续。"
"Catalogue complete. {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, cataloguer, for the astronomical records of {@bt_entity|::subscribed_books::vocabulary::entity}." = "星表完成。编目者{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}），为{@bt_entity|::subscribed_books::vocabulary::entity}的天文记录编制。"
"Not a catalogue. A love affair with the {::subscribed_books::adj} night sky. Each star deserves a poem, and I, {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, attempt to give it one." = "这不是星表，而是与{::subscribed_books::adj}夜空的恋情。每颗星都值得一首诗，我，{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}），试图给它们每颗一首。"
"The stars above {@bt_site|::subscribed_books::vocabulary::place} are not data points. They are songs waiting to be heard. This catalogue hears them." = "{@bt_site|::subscribed_books::vocabulary::place}上空的星辰不是数据点，而是等待被听见的歌。本星表倾听它们。"
"I have spent my nights at {@bt_site|::subscribed_books::vocabulary::place} falling in love with points of light. Each star has a character, a mood, a {::subscribed_books::adj} personality. This catalogue, by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, is an attempt to capture what the cold language of astronomy cannot: the romance of the sky." = "我在{@bt_site|::subscribed_books::vocabulary::place}的夜晚里，爱上一个个光点。每颗星都有性格、情绪、{::subscribed_books::adj}个性。这本由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）写成的星表，试图捕捉天文学冰冷语言无法表达的东西：天空的浪漫。"
"Stars that caught my eye around {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "约于{@bt_year|::subscribed_books::vocabulary::birth_year}年吸引我目光的星："
"In {@bt_year|::subscribed_books::vocabulary::birth_year}, the sky above {@bt_site|::subscribed_books::vocabulary::place} was particularly {::subscribed_books::adj}. Certain stars seemed to pulse with new intensity." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年，{@bt_site|::subscribed_books::vocabulary::place}上空的天空格外{::subscribed_books::adj}。某些星辰似乎以新的强度脉动。"
"Under the stars that witnessed the creation of {@bt_artifact|::subscribed_books::vocabulary::artifact} in {@bt_year|::subscribed_books::vocabulary::birth_year}, the sky itself seemed to celebrate." = "见证{@bt_artifact|::subscribed_books::vocabulary::artifact}于{@bt_year|::subscribed_books::vocabulary::birth_year}年创造的群星下，天空本身也仿佛在庆祝。"
"There are always more stars. Always more beauty." = "总还有更多星辰，总还有更多美。"
"This poet's catalogue of the sky is finished. The sky, mercifully, is not. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "这位诗人的天空星表已经完成。幸好，天空还没有。——{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）"
"I close this catalogue knowing I have captured only a fraction of the {::subscribed_books::adj} beauty overhead. {::subscribed_books::templates_legacy::metaphor} The sky does not need my words. But I needed to say them. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "合上星表时，我知道只捕捉了头顶{::subscribed_books::adj}美丽的一小部分。{::subscribed_books::templates_legacy::metaphor}天空不需要我的话，但我需要说出来。——{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）"
"I close this catalogue knowing I have captured only a fraction of the {::subscribed_books::adj} beauty overhead. The sky does not need my words. But I needed to say them. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "合上星表时，我知道只捕捉了头顶{::subscribed_books::adj}美丽的一小部分。天空不需要我的话，但我需要说出来。——{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）"
"This catalogue preserves astronomical observations passed down through generations of {@bt_entity|::subscribed_books::vocabulary::entity}. The oldest records date to the founding era." = "本星表保存{@bt_entity|::subscribed_books::vocabulary::entity}历代传下的天文观测，最早记录可追溯到建国时代。"
"The stars were watched long before this catalogue was compiled. {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} has gathered the {::subscribed_books::adj} ancient observations into a single reference." = "本星表编纂之前很久，星辰就已被观测。{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）将{::subscribed_books::adj}古老观测汇为单一参考资料。"
"Records from the era of {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "{@bt_year|::subscribed_books::vocabulary::birth_year}年时代的记录："
"Ancient observations from {@bt_year|::subscribed_books::vocabulary::birth_year} describe the {::subscribed_books::adj} positions of key stars. Some match current positions. Some do not." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年的古老观测，描述重要星辰的{::subscribed_books::adj}位置。有些与现今位置相同，有些不同。"
"Observations from the founding of {@bt_evsite|::subscribed_books::vocabulary::place} in {@bt_year|::subscribed_books::vocabulary::birth_year} provide baseline celestial data." = "{@bt_evsite|::subscribed_books::vocabulary::place}于{@bt_year|::subscribed_books::vocabulary::birth_year}年建立时的观测，为天体数据提供了基线。"
"The ancient records speak across the centuries." = "古老记录跨越数百年诉说。"
"These ancient records are preserved for posterity. The stars have changed less than we have. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "这些古老记录为后世保存。星辰改变得比我们更少。——{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）"
"A comparative star catalogue. How do the people of {@bt_entity|::subscribed_books::vocabulary::entity} name the stars differently from their neighbors?" = "比较星表。{@bt_entity|::subscribed_books::vocabulary::entity}人民给星辰命名的方式，与邻居有何不同？"
"The same stars hang above every civilization, but each names them differently. This catalogue compares." = "同样的星辰悬在每个文明上方，每个文明却命名不同。本星表加以比较。"
"Comparative entries from the era of {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "{@bt_year|::subscribed_books::vocabulary::birth_year}年时代的比较条目："
"Stars observed in {@bt_year|::subscribed_books::vocabulary::birth_year}: the names used by {@bt_entity|::subscribed_books::vocabulary::entity} are compared with known alternatives." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年观测的星辰：将{@bt_entity|::subscribed_books::vocabulary::entity}所用名称与已知的其他名称比较。"
"The comparison reveals cultural values as much as astronomical knowledge." = "比较所揭示的文化价值，不亚于天文学知识。"
"This comparative catalogue shows that the sky is a mirror: each civilization sees itself in the stars. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "本比较星表说明，天空是一面镜子，每个文明都在星辰中看见自己。——{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）"
"A CELESTIAL ATLAS. Detailed positions and descriptions of all catalogued objects above {@bt_site|::subscribed_books::vocabulary::place}." = "天文图集。{@bt_site|::subscribed_books::vocabulary::place}上方所有已编目天体的详细位置与描述。"
"This atlas of the night sky, compiled by {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, aims for {::subscribed_books::adj} completeness in documenting the heavens above {@bt_entity|::subscribed_books::vocabulary::entity}." = "本夜空图集由{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）编纂，旨在以{::subscribed_books::adj}完备性记录{@bt_entity|::subscribed_books::vocabulary::entity}上方的天空。"
"Atlas section for the observation period of {@bt_year|::subscribed_books::vocabulary::birth_year}:" = "{@bt_year|::subscribed_books::vocabulary::birth_year}年观测时段的图集分节："
"Celestial positions documented for {@bt_year|::subscribed_books::vocabulary::birth_year}. The atlas grows more {::subscribed_books::adj} and comprehensive with each observation." = "记录{@bt_year|::subscribed_books::vocabulary::birth_year}年的天体位置。每次观测，都使图集更加{::subscribed_books::adj}而全面。"
"The atlas expands with each clear night." = "每个晴夜，图集都在扩充。"
"The celestial atlas of {@bt_entity|::subscribed_books::vocabulary::entity} is as complete as current observation allows. The sky awaits further mapping. -- {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}" = "{@bt_entity|::subscribed_books::vocabulary::entity}的天文图集，已在当前观测允许的范围内尽量完备。天空等待进一步绘图。——{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）"

